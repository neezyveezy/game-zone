<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pixel Front</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Bright toy-box war table: blue sea, pastel nations, white candy-shell panels with saturated accents. */
:root {
  --panel: rgba(255,255,255,0.9); --ink: #1d2b3a; --muted: #6a7b8c; --line: rgba(29,43,58,0.1);
  --blue: #2f80ed; --green: #27ae60; --gold: #f5b400; --red: #e74c3c; --purple: #8e44ad; --pink: #ff5d8f;
  --f-fun: "Fredoka", "Nunito", system-ui, sans-serif; --f-body: "Nunito", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #2f7fcf; color: var(--ink); font: 14px/1.35 var(--f-body); -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 10px; padding: 7px 12px; background: #eef3f8; font-weight: 700; transition: transform .08s, background .12s; }
button:hover:not(:disabled) { background: #e2ebf4; }
button:active:not(:disabled) { transform: scale(0.96); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; }
button.primary { background: linear-gradient(180deg, #45a3ff, #2f80ed); color: #fff; box-shadow: 0 3px 0 #1f5fb8; }
button.danger { background: #ffe8e5; color: #c0392b; }
.muted { color: var(--muted); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 4px; flex: none; box-shadow: 0 0 0 2px #fff, 0 1px 3px rgba(0,0,0,.25); }
.sw.big { width: 26px; height: 26px; border-radius: 8px; }
[hidden] { display: none !important; }
.glass { background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 16px; box-shadow: 0 6px 24px rgba(10,40,80,.22), 0 0 0 1px rgba(255,255,255,.6) inset; }

#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
#map.placing { cursor: copy; }
#map.onicon { cursor: help; }
#admin { position: fixed; z-index: 8; left: 12px; top: calc(205px + env(safe-area-inset-top, 0px)); width: 290px; max-height: calc(100vh - 340px); overflow-y: auto; padding: 10px 12px 12px; display: grid; gap: 6px; border: 2px solid #ffd23f; }
#admin header { position: sticky; top: -10px; background: #fff; margin: -10px -12px 0; padding: 10px 12px 6px; z-index: 1; display: flex; justify-content: space-between; align-items: center; font: 700 17px var(--f-fun); }
#admin header button { padding: 3px 9px; }
#admin h4 { margin: 4px 0 0; font: 700 11px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.agrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.agrid button { font-size: 12.5px; padding: 7px 6px; text-align: left; background: #f4f8fc; }
.agrid button.on { background: linear-gradient(180deg, #d9fbe6, #9ff0bf); box-shadow: 0 0 0 2px var(--green) inset; }
.pw { display: flex; gap: 8px; } .pw input { flex: 1; min-width: 0; border: 0; background: #eef3f8; border-radius: 10px; padding: 9px 12px; font-weight: 700; }
.err { color: var(--red); font-weight: 800; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

/* player stats, top-left */
#hud { position: fixed; z-index: 5; left: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); width: 290px; padding: 12px 14px; display: grid; gap: 8px; }
.who { display: flex; align-items: center; gap: 8px; font: 700 18px var(--f-fun); }
.who .sw { width: 18px; height: 18px; border-radius: 6px; }
.troops { display: grid; gap: 4px; }
.troops .big { font: 700 30px/1 var(--f-fun); color: var(--blue); font-variant-numeric: tabular-nums; }
.troops .big small { font: 600 14px var(--f-fun); color: var(--muted); margin-left: 4px; }
.bar { height: 9px; border-radius: 9px; background: #e3ebf3; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #56ccf2, #2f80ed); border-radius: 9px; transition: width .2s; }
.res { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.res div { background: #f4f8fc; border-radius: 10px; padding: 5px 8px; }
.res label { display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.res b { font: 700 16px var(--f-fun); font-variant-numeric: tabular-nums; }
.res small { display: block; font-size: 11.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
.res .m b { color: var(--green); } .res .m small { color: var(--green); }
.res .g b { color: #d99a00; } .res .g small { color: #d99a00; }
.res .l b { color: var(--purple); }
#uOut { font-size: 12.5px; font-weight: 800; color: var(--red); min-height: 0; }
#uOut:empty { display: none; }

/* leaderboard, top-right */
#lead { position: fixed; z-index: 5; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); width: 236px; padding: 10px 12px; }
#lead h3 { margin: 0 0 6px; font: 700 15px var(--f-fun); display: flex; justify-content: space-between; align-items: baseline; }
#lead h3 small { font: 700 12px var(--f-body); color: var(--muted); }
#board { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
#board li { display: flex; align-items: center; gap: 7px; padding: 3px 5px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
#board li:hover { background: #eef3f8; }
#board li.me { background: linear-gradient(90deg, #fff4c2, #ffe68a); }
#board li.gap { justify-content: center; color: var(--muted); cursor: default; padding: 0; }
#board .rk { width: 18px; text-align: right; color: var(--muted); font: 600 12px var(--f-fun); }
#board .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#board b { font: 700 13px var(--f-fun); color: var(--blue); font-variant-numeric: tabular-nums; }

/* time controls */
#timebar { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; gap: 4px; padding: 5px; align-items: center; }
#timebar button { padding: 6px 10px; font: 700 13px var(--f-fun); background: transparent; }
#timebar button.on { background: var(--blue); color: #fff; }
#timebar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }

/* bottom dock: troop slider + build bar */
#dock { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: stretch; padding: 8px; max-width: calc(100vw - 24px); }
.ratio { display: grid; align-content: center; gap: 3px; padding: 0 8px; min-width: 170px; }
.ratio .row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--muted); }
.ratio .row b { font: 700 15px var(--f-fun); color: var(--red); }
.ratio input { width: 100%; accent-color: var(--red); }
.builds { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.builds::-webkit-scrollbar { display: none; }
.builds button { display: grid; justify-items: center; gap: 0; min-width: 72px; padding: 6px 6px 5px; background: #fff; border-radius: 12px; box-shadow: 0 2px 0 rgba(29,43,58,.12), 0 0 0 1px var(--line) inset; position: relative; }
.builds button .ic { font-size: 24px; line-height: 1.1; }
.builds button span { font-size: 11px; font-weight: 800; white-space: nowrap; }
.builds button em { font: 700 12px var(--f-fun); font-style: normal; color: var(--green); }
.builds button[data-cur="gold"] em { color: #d99a00; }
.builds button kbd { position: absolute; top: 3px; left: 5px; font: 700 9.5px var(--f-fun); color: var(--muted); }
.builds button.poor { opacity: .5; }
.builds button.poor em { color: var(--red); }
.builds button.on { background: linear-gradient(180deg, #fffbe6, #ffe68a); box-shadow: 0 0 0 3px var(--gold); }
.builds button[data-build="nuke"].on { background: linear-gradient(180deg, #fff0ee, #ffc7bf); box-shadow: 0 0 0 3px var(--red); }

#feed { position: fixed; z-index: 4; left: 12px; bottom: calc(112px + env(safe-area-inset-bottom, 0px)); width: 330px; list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; pointer-events: none; }
#feed li { background: rgba(255,255,255,.88); border-radius: 10px; padding: 5px 10px; font-size: 12.5px; font-weight: 700; box-shadow: 0 2px 8px rgba(10,40,80,.15); border-left: 4px solid #b7c6d6; }
#feed li.good { border-left-color: var(--green); } #feed li.bad { border-left-color: var(--red); }

#reqs { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px)); display: grid; gap: 6px; }
.req { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 14px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(10,40,80,.25); font-weight: 700; animation: pop .25s; }
.req button { padding: 5px 10px; } .req button[data-y="1"] { background: var(--green); color: #fff; }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }

#ctx { position: fixed; z-index: 20; min-width: 220px; padding: 8px; display: grid; gap: 4px; animation: pop .12s; }
#ctx .ch { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 2px 4px 6px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
#ctx .ch b { font: 700 16px var(--f-fun); } #ctx .ch small { flex-basis: 100%; color: var(--muted); font-weight: 700; }
#ctx button { text-align: left; display: flex; justify-content: space-between; gap: 12px; background: #f4f8fc; }
#ctx button span { color: var(--muted); font-weight: 800; }
#tip { position: fixed; z-index: 15; pointer-events: none; background: rgba(255,255,255,.95); border-radius: 10px; padding: 6px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(10,40,80,.2); max-width: 260px; }
#tip b { font-family: var(--f-fun); } #tip span { color: var(--blue); font-weight: 800; } #tip small { color: var(--muted); font-weight: 700; } #tip .ally { color: var(--green); font-style: normal; font-weight: 800; }
#toast { position: fixed; z-index: 30; left: 50%; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 10px); opacity: 0; pointer-events: none; background: #1d2b3a; color: #fff; padding: 8px 16px; border-radius: 12px; font-weight: 800; transition: .15s; max-width: calc(100vw - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); } #toast.bad { background: var(--red); } #toast.good { background: var(--green); }
.pulse { position: fixed; z-index: 25; pointer-events: none; font-size: 26px; transform: translate(-50%, -50%); animation: pulse .7s forwards; }
@keyframes pulse { to { transform: translate(-50%, -120%) scale(1.5); opacity: 0; } }

/* start screen */
#start { position: fixed; z-index: 10; left: 14px; top: 14px; bottom: 14px; width: 380px; display: flex; flex-direction: column; overflow: hidden; }
#start header { padding: 18px 20px 12px; }
#start h1 { margin: 0; font: 700 38px/1 var(--f-fun); background: linear-gradient(90deg, #2f80ed, #8e44ad 55%, #ff5d8f); -webkit-background-clip: text; background-clip: text; color: transparent; }
#start header p { margin: 6px 0 0; color: var(--muted); font-weight: 700; }
.sbody { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 0 20px; }
#natSearch { width: 100%; border: 0; background: #eef3f8; border-radius: 12px; padding: 9px 12px; font-weight: 700; }
#natList { flex: 1; min-height: 80px; overflow-y: auto; list-style: none; margin: 0; padding: 4px; background: #f6f9fc; border-radius: 12px; }
#natList li { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 9px; cursor: pointer; font-weight: 700; }
#natList li:hover { background: #fff; } #natList li.on { background: linear-gradient(90deg, #fff4c2, #ffe68a); }
#natList small { margin-left: auto; color: var(--muted); }
#natInfo { display: flex; gap: 10px; align-items: center; min-height: 48px; }
#natInfo b { font: 700 18px var(--f-fun); } #natInfo small { display: block; color: var(--muted); font-weight: 700; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.opts label { display: grid; gap: 3px; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.opts select { border: 0; background: #eef3f8; border-radius: 10px; padding: 6px; font-weight: 700; text-transform: none; color: var(--ink); width: 100%; }
#start footer { display: flex; gap: 8px; padding: 14px 20px 18px; }
#start footer .primary { flex: 1; font-size: 16px; padding: 11px; }

#modal { position: fixed; inset: 0; z-index: 40; background: rgba(10,30,60,.45); display: grid; place-items: center; padding: 16px; }
#modalBody { width: min(420px, 100%); padding: 22px; display: grid; gap: 12px; }
#modalBody h2 { margin: 0; font: 700 30px var(--f-fun); }
#modalBody p { margin: 0; } .row { display: flex; gap: 8px; flex-wrap: wrap; } .chk { display: flex; gap: 8px; align-items: center; font-weight: 700; }
#loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #2f7fcf; color: #fff; font: 700 24px var(--f-fun); }

body:not(.playing) #hud, body:not(.playing) #dock, body:not(.playing) #timebar, body:not(.playing) #feed { display: none; }

@media (max-width: 820px) {
  #hud { width: auto; right: 12px; padding: 8px 10px; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
  .who { display: none; }
  .troops .big { font-size: 22px; }
  .res { grid-column: 1 / -1; } .res b { font-size: 14px; }
  #lead { display: none; }
  #admin { left: 8px; right: 8px; width: auto; top: calc(120px + env(safe-area-inset-top, 0px)); max-height: 45vh; }
  #timebar { top: auto; left: auto; right: 12px; transform: none; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); flex-direction: column; }
  #timebar .sep { width: 20px; height: 1px; }
  #dock { left: 8px; right: 8px; transform: none; flex-direction: column; gap: 6px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  .builds button { min-width: 62px; }
  #feed { width: auto; right: 70px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
  #feed li:nth-last-child(n+3) { display: none; }
  #toast { bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
  #start { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; height: 64vh; }
  #start h1 { font-size: 28px; } #start header p { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<body>
<canvas id="map" aria-label="World map"></canvas>

<section id="hud" class="glass">
  <div class="who"><i class="sw" id="pSw"></i><span id="pName">—</span></div>
  <div class="troops"><div class="big">🪖 <span id="uTroops">0</span><small id="uMax"></small></div><div class="bar"><i id="uBar"></i></div><div id="uOut"></div></div>
  <div class="res">
    <div class="m"><label>💵 Money</label><b id="uMoney">0</b><small id="uMps"></small></div>
    <div class="g"><label>🪙 Gold</label><b id="uGold">0</b><small id="uGps"></small></div>
    <div class="l"><label>🗺️ Land</label><b id="uLand">0%</b><small>&nbsp;</small></div>
  </div>
</section>

<section id="lead" class="glass"><h3>🏆 Top 10 land <small id="alive"></small></h3><ol id="board"></ol></section>

<div id="timebar" class="glass">
  <button data-speed="0" title="Pause (Space)">⏸</button><button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button>
  <span class="sep"></span><button id="btnHome" title="Go to my country">🏠</button><button id="btnAdmin" title="Admin panel">🔑</button><button id="btnMenu" title="Menu">☰</button>
</div>

<div id="dock" class="glass">
  <div class="ratio">
    <div class="row"><span>⚔️ Troops per attack</span><b id="uRatio">30%</b></div>
    <input type="range" id="ratio" min="5" max="100" step="5" value="30" aria-label="Share of troops per attack">
    <div class="row"><span>Sends</span><span id="uRatioT">0</span></div>
  </div>
  <div class="builds">
    <button data-build="city" title="City: +30K troop limit, +money"><kbd>1</kbd><span class="ic">🏙️</span><span>City</span><em></em></button>
    <button data-build="def" title="Defense post: land in its radius is 3× harder to take"><kbd>2</kbd><span class="ic">🛡️</span><span>Defense</span><em></em></button>
    <button data-build="port" title="Port: on the coast. Trade ships bring gold"><kbd>3</kbd><span class="ic">⚓</span><span>Port</span><em></em></button>
    <button data-build="mine" data-cur="gold" title="Gold mine: +450 gold per second"><kbd>4</kbd><span class="ic">⛏️</span><span>Gold Mine</span><em></em></button>
    <button data-build="sam" data-cur="gold" title="Anti-nuke: shoots down nukes aimed inside its radius"><kbd>5</kbd><span class="ic">📡</span><span>Anti-Nuke</span><em></em></button>
    <button data-build="nuke" data-cur="gold" title="Nuke: wipes buildings and land in a small radius"><kbd>6</kbd><span class="ic">☢️</span><span>Nuke</span><em></em></button>
  </div>
</div>

<ul id="feed"></ul>
<div id="reqs"></div>
<section id="admin" class="glass" hidden aria-label="Admin panel">
  <header><b>🛠️ Admin Panel</b><button data-a="close" title="Close">✕</button></header>
  <h4>Resources</h4>
  <div class="agrid">
    <button data-a="money">💵 +$1M</button><button data-a="gold">🪙 +1M gold</button>
    <button data-a="troops">🪖 +250K troops</button><button data-a="fill">💪 Fill troops</button>
    <button data-a="limit">📈 Troop limit <span id="admLimit">×1</span></button><button data-cheat="infinite">♾️ Infinite cash</button>
  </div>
  <h4>Powers</h4>
  <div class="agrid">
    <button data-cheat="god">😇 God mode</button><button data-cheat="free">🎁 Free buildings</button>
    <button data-cheat="mega">💣 Mega nukes</button><button data-cheat="peace">🕊️ AI won't attack you</button>
    <button data-cheat="disco">🌈 Disco country</button><button data-a="turbo">⚡ Turbo 10×</button>
  </div>
  <h4>Chaos</h4>
  <div class="agrid">
    <button data-a="annex">👑 Annex a country</button><button data-a="rain">☢️ Nuke rain</button>
    <button data-a="smite">⚡ Smite the #1</button><button data-a="friends">🤝 Everyone's ally</button>
    <button data-a="chaos">🔥 World chaos</button><button data-a="win">🏆 Instant win</button>
  </div>
</section>
<div id="ctx" class="glass" hidden></div>
<div id="tip" hidden></div>
<div id="toast"></div>

<section id="start" class="glass" hidden>
  <header><h1>Pixel Front</h1><p>Every pixel of land can be taken. Pick a country and conquer the world.</p></header>
  <div class="sbody">
    <input id="natSearch" type="search" placeholder="🔍 Search countries" autocomplete="off" aria-label="Search countries">
    <ul id="natList"></ul>
    <div id="natInfo"></div>
    <div class="opts">
      <label>Difficulty<select id="optDiff"><option value="0">😊 Easy</option><option value="1">😐 Normal</option><option value="2">😈 Hard</option></select></label>
      <label>Win at<select id="optVictory"><option value="0.3">30% land</option><option value="0.6">60% land</option><option value="0.9">90% land</option></select></label>
      <label>Map<select id="optDeg"><option value="0.45">Small</option><option value="0.3">Normal</option><option value="0.22">Huge</option></select></label>
    </div>
  </div>
  <footer><button id="btnRandom">🎲 Random</button><button id="btnStart" class="primary" disabled>Pick a country</button></footer>
</section>

<div id="modal" hidden><div id="modalBody" class="glass"></div></div>
<div id="loading">🌍 Painting the world…</div>
<script>
'use strict';
// World geography as flat [lon,lat, lon,lat, ...] polygons. Rasterized to the tile grid at startup.
const GEO = {
  latTop: 84, latBottom: -58,

  feed() {
    if (!ui.feedDirty) return; ui.feedDirty = false;
    $('feed').innerHTML = G.feed.slice(-6).map((f) => `<li class="${f.cls || ''}">${esc(f.text)}</li>`).join('');
  },
  requests() {
    const now = performance.now();
    G.requests = G.requests.filter((r) => r.until > now && nations[r.from].alive && !isAlly(r.from, G.player));
    const h = G.requests.map((r) => `<div class="req"><i class="sw" style="background:${nations[r.from].vivid}"></i><span><b>${esc(nations[r.from].name)}</b> wants an alliance</span><button data-r="${r.from}" data-y="1">🤝 Accept</button><button data-r="${r.from}" data-y="0">✖</button></div>`).join('');
    if ($('reqs').innerHTML !== h) $('reqs').innerHTML = h;
  },
};
$('reqs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const id = +b.dataset.r;
  if (b.dataset.y === '1') { ally(G.player, id); feed(`🤝 You are now allied with ${nations[id].name}.`, 'good'); } else nations[id].grudge[G.player] += 1;
  G.requests = G.requests.filter((r) => r.from !== id); ui.requests();
});
$('board').addEventListener('click', (e) => { const li = e.target.closest('li[data-n]'); if (li) { const n = nations[+li.dataset.n]; centerOn(n.sx / n.tiles, n.sy / n.tiles, Math.max(cam.z, 3)); } });
document.querySelectorAll('[data-build]').forEach((b) => b.addEventListener('click', () => setTool(G.tool === b.dataset.build ? null : b.dataset.build)));
document.querySelectorAll('[data-speed]').forEach((b) => b.addEventListener('click', () => setSpeed(+b.dataset.speed)));
$('ratio').addEventListener('input', (e) => { G.ratio = +e.target.value / 100; setText($('uRatio'), e.target.value + '%'); ui.top(); });
$('btnHome').addEventListener('click', () => { const P = nations[G.player]; if (P && P.tiles) centerOn(P.sx / P.tiles, P.sy / P.tiles, Math.max(cam.z, 3)); });
$('btnMenu').addEventListener('click', () => openModal(`<h2>Menu</h2>
  <label class="chk"><input type="checkbox" id="optLabels" ${opts.labels ? 'checked' : ''}> Show country names and troop counts</label>
  <p class="muted">Click enemy land to attack with your troop slider share. Click again somewhere else to split your army. Right-click (or long-press) any country for alliances, gifts and nukes. Space pauses. Keys 1–6 pick buildings.</p>
  <div class="row"><button data-m="new" class="danger">🔄 New game</button><button data-m="close" class="primary">Resume</button></div>`));

// ================================================================ admin panel (password locked)
// Only a scrambled fingerprint (SHA-256) of the password is stored, so it can't be read from the code.
const ADMIN_HASH = '5badf1c4b5a8417a8f5908edc114a3da1ff54467c319991e84128062a3cf299e';
function sha256(msg) {
  const K = [], H = [];
  let n = 2, i;
  while (K.length < 64) {
    for (i = 2; i * i <= n; i++) if (n % i === 0) break;
    if (i * i > n) {
      if (H.length < 8) H.push((n ** (1 / 2) % 1) * 4294967296 | 0);
      K.push((n ** (1 / 3) % 1) * 4294967296 | 0);
    }
    n++;
  }
  let bytes = unescape(encodeURIComponent(msg));
  const bitLen = bytes.length * 8, words = [];
  bytes += '\x80';
  while (bytes.length % 64 !== 56) bytes += '\x00';
  for (i = 0; i < bytes.length; i++) words[i >> 2] |= bytes.charCodeAt(i) << (24 - (i % 4) * 8);
  words.push(Math.floor(bitLen / 4294967296), bitLen | 0);
  const rot = (x, c) => (x >>> c) | (x << (32 - c));
  for (let j = 0; j < words.length; j += 16) {
    const w = words.slice(j, j + 16);
    let a = H.slice();
    for (i = 0; i < 64; i++) {
      if (i >= 16) {
        const w15 = w[i - 15], w2 = w[i - 2];
        w[i] = (w[i - 16] + (rot(w15, 7) ^ rot(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rot(w2, 17) ^ rot(w2, 19) ^ (w2 >>> 10))) | 0;
      }
      const e = a[4], t1 = (a[7] + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & a[5]) ^ (~e & a[6])) + K[i] + w[i]) | 0;
      const x = a[0], t2 = ((rot(x, 2) ^ rot(x, 13) ^ rot(x, 22)) + ((x & a[1]) ^ (x & a[2]) ^ (a[1] & a[2]))) | 0;
      a = [(t1 + t2) | 0].concat(a.slice(0, 7)); a[4] = (a[4] + t1) | 0;
    }
    for (i = 0; i < 8; i++) H[i] = (H[i] + a[i]) | 0;
  }
  return H.map(v => ('00000000' + (v >>> 0).toString(16)).slice(-8)).join('');
}
$('btnAdmin').addEventListener('click', () => {
  if (!G.started) { toast('Start a game first.', 'bad'); return; }
  if (G.admin) { $('admin').hidden = !$('admin').hidden; return; }
  openModal(`<h2>🔑 Admin access</h2><p class="muted">Enter the password to unlock the admin panel.</p>
    <form id="pwForm" class="pw"><input type="password" id="pwIn" placeholder="Password" autocomplete="off" aria-label="Admin password"><button class="primary" type="submit">Unlock</button></form>
    <p id="pwErr" class="err" hidden>Wrong password. Try again.</p>`);
  setTimeout(() => $('pwIn') && $('pwIn').focus(), 30);
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'pwForm') return;
  e.preventDefault();
  if (sha256('pixelfront-admin:' + $('pwIn').value) === ADMIN_HASH) { G.admin = true; $('modal').hidden = true; $('admin').hidden = false; syncAdmin(); toast('🔓 Admin panel unlocked!', 'good'); }
  else { $('pwErr').hidden = false; const f = $('pwForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); $('pwIn').select(); }
});
function syncAdmin() { document.querySelectorAll('[data-cheat]').forEach((b) => b.classList.toggle('on', !!G.cheat[b.dataset.cheat])); setText($('admLimit'), '×' + G.cheat.limit); }
function annex(d) {
  if (!d || d === G.player) { toast('Pick another country.', 'bad'); return; }
  const n = nations[d];
  for (let k = 0; k < landCount; k++) { const t = landList[k]; if (owner[t] === d) capture(t, G.player); }
  nationStats(); feed(`👑 You annexed ${n.name}!`, 'good'); toast(`👑 ${n.name} is now yours.`, 'good');
}
function playerEnemies() { const l = []; for (let b = 1; b < NN; b++) if (b !== G.player && nations[b].alive && !isAlly(G.player, b)) l.push(b); return l; }
let discoT = 0;
function discoStep(now) {
  if (!G.cheat.disco || now - discoT < 250) return; discoT = now;
  const P = nations[G.player], h = (now / 12) % 360;
  P.col = hsl(h, 75, 68); P.vivid = `rgb(${hsl(h, 85, 48)})`; P.css = `rgb(${P.col})`;
  buildPalette();
  for (let k = 0; k < landCount; k++) { const t = landList[k]; if (owner[t] === G.player) markDirty(t); }
}
$('admin').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const P = nations[G.player], a = b.dataset.a;
  if (b.dataset.cheat) { const k = b.dataset.cheat; G.cheat[k] = !G.cheat[k]; if (k === 'free') ui.top(); if (k === 'disco' && !G.cheat.disco) { const i = G.player - 1, h = (i * 137.508 + 25) % 360; P.col = hsl(h, 52 + (i % 4) * 8, 70 + (i % 3) * 4); P.vivid = `rgb(${hsl(h, 78, 46)})`; buildPalette(); for (let k2 = 0; k2 < landCount; k2++) if (owner[landList[k2]] === G.player) markDirty(landList[k2]); } toast(`${b.textContent.trim()} ${G.cheat[k] ? 'ON' : 'OFF'}`, G.cheat[k] ? 'good' : ''); syncAdmin(); return; }
  if (a === 'close') { $('admin').hidden = true; return; }
  if (a === 'money') { P.money += 1e6; toast('💵 +$1M', 'good'); }
  else if (a === 'gold') { P.gold += 1e6; toast('🪙 +1M gold', 'good'); }
  else if (a === 'troops') { P.troops += 250000; toast('🪖 +250K troops', 'good'); }
  else if (a === 'fill') { P.troops = Math.max(P.troops, P.maxT); toast('🪖 Troops filled to max', 'good'); }
  else if (a === 'limit') { G.cheat.limit = Math.min(64, G.cheat.limit * 2); calcStats(P); syncAdmin(); toast(`📈 Troop limit ×${G.cheat.limit}`, 'good'); }
  else if (a === 'annex') { setTool('annex'); }
  else if (a === 'rain') {
    const en = playerEnemies(); if (!en.length) { toast('No enemies left to nuke.', 'bad'); return; }
    for (let i = 0; i < 10; i++) { const d = en[Math.floor(Math.random() * en.length)], n = nations[d]; const t = randOwned(d, n.sx / n.tiles, n.sy / n.tiles, 30 * TS); if (t >= 0) launchNuke(G.player, t); }
    toast('☢️ Nuke rain incoming!', 'good');
  }
  else if (a === 'smite') {
    const top = nations.filter((n) => n.id && n.alive && n.id !== G.player).sort((x, y) => y.tiles - x.tiles)[0]; if (!top) return;
    G.fx.push({ x: top.sx / top.tiles, y: top.sy / top.tiles, t0: performance.now(), dur: 1600, r: 40 * TS, kind: 'boom' });
    const id = top.id; for (let k = 0; k < landCount; k++) { const t = landList[k]; if (owner[t] === id) { capture(t, 0); scar[t] = 1; } }
    feed(`⚡ ${top.name} was smitten from the face of the Earth!`, 'good');
  }
  else if (a === 'friends') { for (const b2 of playerEnemies()) ally(G.player, b2); toast('🤝 Everyone is your ally now.', 'good'); feed('🤝 The whole world joined your alliance.', 'good'); }
  else if (a === 'chaos') { const en = playerEnemies(); for (const x of en) for (const y of en) if (x !== y && isAlly(x, y)) unally(x, y); for (const x of en) { const n = nations[x]; n.troops = n.maxT; n.ai.next = 1; n.ai.aggr = 1.6; } toast('🔥 Every AI is angry and armed. Chaos!', 'good'); }
  else if (a === 'turbo') { setSpeed(10); toast('⚡ Turbo speed 10×', 'good'); }
  else if (a === 'win') { endGame(true); }
  ui.top();
});

// ================================================================ start / end
let pick = 0;
function listNations(f) {
  f = (f || '').toLowerCase();
  const l = nations.filter((n) => n.id && n.alive && n.name.toLowerCase().includes(f)).sort((a, b) => b.tiles - a.tiles);
  $('natList').innerHTML = l.map((n) => `<li data-n="${n.id}" class="${n.id === pick ? 'on' : ''}"><i class="sw" style="background:${n.vivid}"></i><span>${esc(n.name)}</span><small>${fmt(n.troops)} 🪖</small></li>`).join('');
}
function choose(id) {
  pick = id; const n = nations[id];
  listNations($('natSearch').value);
  const li = $('natList').querySelector(`[data-n="${id}"]`); if (li) li.scrollIntoView({ block: 'nearest' });
  $('natInfo').innerHTML = `<i class="sw big" style="background:${n.vivid}"></i><div><b>${esc(n.name)}</b><small>🪖 ${fmt(n.troops)} troops · 💵 ${fmt(n.mps)}/s · 🪙 ${fmt(n.gps)}/s · ${(n.tiles / landCount * 100).toFixed(2)}% of land</small></div>`;
  $('btnStart').disabled = false; $('btnStart').textContent = `▶ Play as ${n.name}`;
  const z = clamp(80 / Math.sqrt(n.tiles) + 1.5, cam.z, 7);
  if (cam.vw > 820) centerOn(n.sx / n.tiles - 200 / z, n.sy / n.tiles, z); else centerOn(n.sx / n.tiles, n.sy / n.tiles + cam.vh * 0.25 / z, z);
}
$('natList').addEventListener('click', (e) => { const li = e.target.closest('li[data-n]'); if (li) choose(+li.dataset.n); });
$('natSearch').addEventListener('input', (e) => listNations(e.target.value));
$('btnRandom').addEventListener('click', () => { const l = nations.filter((n) => n.id && n.alive && n.tiles > 150); choose(l[Math.floor(Math.random() * l.length)].id); });
$('btnStart').addEventListener('click', () => { if (pick) start(pick); });
for (const [id, k] of [['optDiff', 'diff'], ['optVictory', 'victory'], ['optDeg', 'deg']]) {
  $(id).value = opts[k];
  $(id).addEventListener('change', (e) => { opts[k] = +e.target.value; save('wf_opts', opts); if (k === 'deg') newWorld(); });
}
function start(id) {
  G.player = id; G.started = true; G.over = false; nations[id].isPlayer = true; calcStats(nations[id]);
  buildPalette();
  for (let k = 0; k < landCount; k++) { const t = landList[k]; if (owner[t] === id) markDirty(t); }
  $('start').hidden = true; document.body.classList.add('playing');
  $('pName').textContent = nations[id].name; $('pSw').style.background = nations[id].vivid;
  const P = nations[id]; centerOn(P.sx / P.tiles, P.sy / P.tiles, clamp(60 / Math.sqrt(P.tiles) + 1.5, 2, 6));
  feed(`🎉 You lead ${P.name}. Grab ${Math.round(opts.victory * 100)}% of the world to win.`, 'good');
  setSpeed(1); ui.top(); ui.board();
}
function endGame(won) {
  if (G.over) return; G.over = true; setSpeed(0);
  const P = nations[G.player];
  openModal(`<h2>${won ? '🏆 Victory!' : '💀 Defeated'}</h2><p>${won ? `${esc(P.name)} controls ${(P.tiles / landCount * 100).toFixed(1)}% of the world.` : `${esc(P.name)} has been wiped off the map.`}</p>
    <div class="row"><button data-m="new" class="primary">🔄 New game</button><button data-m="watch">${won ? 'Keep playing' : '👀 Watch the world'}</button></div>`);
}
function openModal(h) { $('modalBody').innerHTML = h; $('modal').hidden = false; }
$('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') { $('modal').hidden = true; return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.m === 'new') { $('modal').hidden = true; newWorld(); }
  else if (b.dataset.m === 'close') $('modal').hidden = true;
  else if (b.dataset.m === 'watch') { $('modal').hidden = true; G.over = false; opts.victory = 2; G.speed = 1; }
});
$('modal').addEventListener('change', (e) => { if (e.target.id === 'optLabels') { opts.labels = e.target.checked; save('wf_opts', opts); needs = true; } });

function newWorld() {
  $('loading').hidden = false; document.body.classList.remove('playing');
  setTimeout(() => {
    Object.assign(G, { tick: 0, speed: 0, started: false, over: false, player: 0, tool: null, attacks: [], boats: [], trades: [], nukes: [], fx: [], floaters: [], requests: [], feed: [] });
    tradePaths.clear();
    G.admin = false; G.selStruct = 0; G.cheat = { god: false, infinite: false, free: false, mega: false, peace: false, disco: false, limit: 1 }; $('admin').hidden = true;
    opts.victory = +$('optVictory').value || 0.6;
    genWorld(opts.deg); initNations(); initRender(); resize();
    if (cam.vw > 820) { const z = Math.min((cam.vw - 400) / W, (cam.vh - 40) / H) * 0.98; centerOn(W / 2 - 200 / z, H / 2, z); }
    else { const z = cam.vw / W * 1.6; centerOn(W / 2, H / 2 + cam.vh * 0.22 / z, z); }
    pick = 0; $('btnStart').disabled = true; $('btnStart').textContent = 'Pick a country';
    $('natInfo').innerHTML = '<p class="muted">Click any country on the map, or pick one from the list.</p>';
    $('natSearch').value = ''; listNations('');
    $('start').hidden = false; $('loading').hidden = true; ui.feedDirty = true; ui.feed(); ui.board(); setTool(null); setSpeed(0);
  }, 30);
}

let last = performance.now(), acc = 0, uiT = 0, bT = 0;
function loop(now) {
  requestAnimationFrame(loop); // schedule first so one bad frame never freezes the game
  const dt = Math.min(250, now - last); last = now;
  if (G.speed && G.started && $('modal').hidden) {
    acc += dt * G.speed; let n = 0;
    while (acc >= 100 && n < 8) { tick(); acc -= 100; n++; }
    if (acc > 300) acc = 0;
    if (n) needs = true;
  }
  if (G.cheat.disco && G.started) discoStep(now);
  if (W) {
    const ch = flush(now);
    if (ch || needs || G.fx.length || G.floaters.length || G.nukes.length || G.boats.length || G.trades.length) {
      try { draw(performance.now()); } catch (err) { console.error(err); }
      needs = false;
    }
  }
  if (now - uiT > 150) { uiT = now; if (G.started) { ui.top(); ui.feed(); if (G.requests.length) ui.requests(); } }
  if (now - bT > 600) { bT = now; if (W) ui.board(); }
}
window.addEventListener('resize', resize);
resize(); newWorld(); requestAnimationFrame(loop);
window.__wf = { G, cam, redraw: () => { needs = true; }, nations: () => nations, tick, dims: () => ({ W, H, landCount }), structs: () => structs };
})();

</script>
