<style>
  :root {
    --bg: #0a0e16; --bg-elevated: #0e1420; --panel: #131a28; --panel-2: #182034;
    --border: #232e46; --border-soft: #1a2338;
    --text: #e8edf8; --text-dim: #93a4c4; --text-faint: #5b6b8c;
    --accent: #4fd8ff; --accent-dim: #2a6b82; --credit: #ffb347;
    --danger: #ff5c5c; --success: #3ddc84; --radius: 10px;
    --font-display: 'Rajdhani', 'Segoe UI', sans-serif;
    --font-body: 'IBM Plex Sans', 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0; font-family: var(--font-body); color: var(--text);
    background: radial-gradient(ellipse 900px 500px at 15% -10%, rgba(79,216,255,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(255,179,71,0.05), transparent 55%), var(--bg);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; margin: 0 0 4px; }
  h1 { font-size: 1.9rem; } h2 { font-size: 1.4rem; }
  h3 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 12px; }
  p { line-height: 1.55; }
  .dim { color: var(--text-dim); } .dim.small { font-size: 0.82rem; margin-top: 6px; }
  button, input, select { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: rgba(79,216,255,0.3); }

  .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 16px; padding: 32px 28px; text-align: center; }
  .auth-logo { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: 0.03em; margin-bottom: 10px; }
  .auth-logo .mark { color: var(--accent); font-size: 1.7rem; line-height: 1; }
  .auth-sub { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 22px; line-height: 1.5; }
  .auth-field { margin-bottom: 18px; text-align: left; }
  .auth-field label { display: block; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 6px; }
  .auth-field input { width: 100%; }
  .auth-submit { width: 100%; }

  .hud-bar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 20px; padding: 10px 20px;
    background: rgba(10,14,22,0.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-soft); }
  .hud-logo { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.03em; white-space: nowrap; }
  .hud-logo .mark { color: var(--accent); font-size: 1.35rem; line-height: 1; }
  .hud-nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .hud-nav::-webkit-scrollbar { display: none; }
  .nav-link { font-family: var(--font-display); font-weight: 600; font-size: 0.92rem; text-decoration: none; color: var(--text-dim);
    padding: 8px 12px; border-radius: 7px; white-space: nowrap; transition: color .15s, background .15s; letter-spacing: 0.02em; cursor: pointer; background: none; border: none; }
  .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .nav-link.active { color: var(--accent); background: rgba(79,216,255,0.1); }

  /* ---- pop-out page menu (hover on desktop, tap on touch) ---- */
  .hud-spacer { flex: 1; }
  @media (max-width: 1180px) {
    .hud-bar { flex-wrap: wrap; row-gap: 8px; gap: 10px; }
    .hud-stats { order: 3; width: 100%; justify-content: flex-start; }
  }
  @media (max-width: 640px) { .hud-stats { justify-content: space-between; } }
  .nav-menu { position: relative; }
  .nav-menu-btn { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 0.98rem; letter-spacing: .03em; color: var(--text);
    background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--border); border-radius: 22px; padding: 7px 14px 7px 12px; cursor: pointer; position: relative; overflow: hidden;
    transition: border-color .2s, box-shadow .25s, transform .15s; }
  .nav-menu-btn::after { content: ""; position: absolute; top: 0; left: -70%; width: 50%; height: 100%; background: linear-gradient(110deg, transparent, rgba(255,255,255,.18), transparent); transition: left .55s ease; }
  .nav-menu-btn:hover::after, .nav-menu.open .nav-menu-btn::after { left: 120%; }
  .nav-menu.open .nav-menu-btn, .nav-menu-btn:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,216,255,.12), 0 0 22px -6px var(--accent); }
  .nmb-icon { width: 16px; height: 12px; position: relative; display: inline-block; }
  .nmb-icon i { position: absolute; left: 0; width: 100%; height: 2px; border-radius: 2px; background: var(--accent); transition: transform .3s cubic-bezier(.3,1.5,.5,1), opacity .2s, top .3s; }
  .nmb-icon i:nth-child(1) { top: 0; } .nmb-icon i:nth-child(2) { top: 5px; } .nmb-icon i:nth-child(3) { top: 10px; }
  .nav-menu.open .nmb-icon i:nth-child(1) { top: 5px; transform: rotate(45deg); }
  .nav-menu.open .nmb-icon i:nth-child(2) { opacity: 0; transform: scaleX(0); }
  .nav-menu.open .nmb-icon i:nth-child(3) { top: 5px; transform: rotate(-45deg); }
  .nmb-label { color: var(--accent); white-space: nowrap; }
  .nmb-caret { font-size: .7rem; color: var(--text-dim); transition: transform .3s; }
  .nav-menu.open .nmb-caret { transform: rotate(180deg); }
  .nav-panel { position: absolute; top: calc(100% + 12px); left: -8px; width: min(640px, calc(100vw - 24px)); z-index: 80; padding: 16px; border-radius: 18px;
    background: rgba(12,17,28,.97); backdrop-filter: blur(16px) saturate(1.3); border: 1px solid var(--border); box-shadow: 0 30px 70px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(79,216,255,.06);
    visibility: hidden; opacity: 0; transform-origin: var(--ax, 40px) -10px; transform: translateY(-10px) scale(.92); clip-path: circle(0% at var(--ax, 40px) 0);
    transition: opacity .22s ease, transform .38s cubic-bezier(.2,1.25,.35,1), clip-path .5s cubic-bezier(.2,.8,.2,1), visibility 0s linear .5s; overflow: hidden; }
  .nav-panel::before { content: ""; position: absolute; top: -7px; left: calc(var(--ax, 40px) - 6px); width: 12px; height: 12px; transform: rotate(45deg); background: inherit; border-left: 1px solid var(--border); border-top: 1px solid var(--border); }
  .nav-menu.open .nav-panel { visibility: visible; opacity: 1; transform: none; clip-path: circle(150% at var(--ax, 40px) 0); transition: opacity .2s ease, transform .4s cubic-bezier(.2,1.25,.35,1), clip-path .55s cubic-bezier(.2,.8,.2,1), visibility 0s; }
  .nav-panel-glow { position: absolute; inset: -40%; pointer-events: none; opacity: .55;
    background: radial-gradient(circle at 15% 0%, rgba(79,216,255,.18), transparent 40%), radial-gradient(circle at 90% 100%, rgba(181,113,255,.14), transparent 45%); }
  .nav-menu.open .nav-panel-glow { animation: nav-glow-drift 6s ease-in-out infinite alternate; }
  @keyframes nav-glow-drift { to { transform: translate(6%, 4%) rotate(6deg); } }
  .nav-panel-inner { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 12px; }
  .nav-group { display: flex; flex-direction: column; gap: 6px; }
  .nav-group-title { font-family: var(--font-display); font-weight: 700; font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-faint); padding: 0 6px 2px; }
  .nav-tile { position: relative; display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 12px; text-decoration: none; color: var(--text); border: 1px solid transparent;
    opacity: 0; transform: translateY(10px) scale(.96); transition: background .15s, border-color .15s, transform .2s cubic-bezier(.3,1.4,.5,1); }
  .nav-menu.open .nav-tile { animation: nav-tile-in .42s cubic-bezier(.2,1.3,.4,1) both; animation-delay: calc(var(--i) * 28ms + 60ms); }
  @keyframes nav-tile-in { from { opacity: 0; transform: translateY(12px) scale(.94); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  .nav-tile:hover, .nav-tile:focus-visible { background: rgba(255,255,255,.05); border-color: color-mix(in srgb, var(--tc) 45%, transparent); transform: translateY(-2px); outline: none; }
  .nav-tile .ti { width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
    background: color-mix(in srgb, var(--tc) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc) 35%, transparent); transition: transform .3s cubic-bezier(.3,1.8,.5,1), box-shadow .2s; }
  .nav-tile:hover .ti { transform: scale(1.15) rotate(-8deg); box-shadow: inset 0 0 0 1px var(--tc), 0 0 16px -2px var(--tc); }
  .nav-tile b { display: block; font-family: var(--font-display); font-weight: 700; font-size: .95rem; line-height: 1.1; }
  .nav-tile small { display: block; font-size: .72rem; color: var(--text-dim); line-height: 1.25; margin-top: 2px; }
  .nav-tile.active { background: color-mix(in srgb, var(--tc) 12%, transparent); border-color: color-mix(in srgb, var(--tc) 55%, transparent); }
  .nav-tile.active b { color: var(--tc); }
  .nav-tile.active::after { content: ""; position: absolute; right: 10px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--tc); box-shadow: 0 0 8px var(--tc); }
  .nav-tile .badge { font-family: var(--font-mono); font-size: .6rem; color: #05141c; background: var(--tc); border-radius: 8px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
  .nav-panel-foot { position: relative; grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--border-soft); padding-top: 10px; margin-top: 2px; font-size: .72rem; color: var(--text-faint); font-family: var(--font-mono); }
  .nav-panel-foot kbd { font-family: var(--font-mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--text-dim); }
  @media (max-width: 640px) {
    .nav-menu { order: 2; }
    .nav-panel { position: fixed; top: 64px; left: 12px !important; right: 12px; width: auto; max-height: calc(100vh - 80px); overflow-y: auto; transform-origin: 30px -10px; clip-path: circle(0% at 30px 0); }
    .nav-menu.open .nav-panel { clip-path: circle(160% at 30px 0); }
    .nav-panel { background: rgba(10,14,22,.985); }
    .nav-panel-foot { display: none; }
    .nav-panel::before { display: none; }
    .nav-panel-inner { grid-template-columns: 1fr 1fr; }
    .nav-tile small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .nav-panel, .nav-menu.open .nav-panel { transition: opacity .15s, visibility 0s; transform: none; clip-path: none; }
    .nav-menu.open .nav-tile { animation: none; opacity: 1; transform: none; }
  }
  .hud-stats { display: flex; align-items: center; gap: 16px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .hud-stat { text-align: right; line-height: 1.15; }
  .hud-stat .l { font-size: 0.62rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }
  .hud-stat .v { font-size: 0.95rem; font-weight: 600; }
  .hud-stat.credits .v { color: var(--credit); } .hud-stat.portfolio .v { color: var(--accent); }
  .hud-identity { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 8px 4px 4px; border-radius: 20px; border: 1px solid var(--border); background: var(--panel); }
  .hud-identity:hover { border-color: var(--accent-dim); }
  #hud-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--panel-2); font-family: var(--font-display); font-weight: 700; font-size: 0.75rem; color: var(--accent); }
  #hud-name { font-family: var(--font-display); font-weight: 600; font-size: 0.88rem; white-space: nowrap; }
  .sound-toggle { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel); color: var(--text-dim); cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: border-color .12s, color .12s; }
  .sound-toggle:hover { border-color: var(--accent-dim); color: var(--text); }
  .sound-toggle.muted { color: var(--text-faint); }
  .quick-toggle { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel); color: var(--text-dim); cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: border-color .12s, color .12s, background .12s; }
  .quick-toggle:hover { border-color: var(--accent-dim); color: var(--text); }
  .quick-toggle.active { color: var(--credit); border-color: var(--credit); background: rgba(255,179,71,0.12); }
  .auto-open-banner { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--panel); border: 1px solid var(--accent-dim); border-radius: 20px;
    padding: 8px 16px; display: none; align-items: center; gap: 10px; font-size: 0.82rem; box-shadow: 0 8px 24px -8px rgba(0,0,0,0.6); white-space: nowrap; }
  .auto-open-banner b { color: var(--accent); }
  .auto-open-banner button { font-family: var(--font-display); font-weight: 600; background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 14px; padding: 3px 10px; cursor: pointer; font-size: 0.78rem; }
  .auto-open-banner button:hover { color: var(--text); border-color: var(--danger); }
  .case-open-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 4px; }
  .bulk-results { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
  .bulk-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg-elevated); border-radius: 8px; border: 1px solid var(--border-soft); font-size: 0.85rem; }
  .bulk-row .bulk-name { flex: 1; font-family: var(--font-display); font-weight: 600; }
  .bulk-row .bulk-price { font-family: var(--font-mono); color: var(--credit); }
  .forge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .forge-path-card { text-align: center; }
  .forge-path-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .forge-arrow { font-family: var(--font-display); font-weight: 600; color: var(--text-dim); font-size: 0.85rem; }
  .forge-path-card .btn { width: 100%; margin-top: 6px; }
  .forge-merge { position: relative; height: 170px; width: 100%; max-width: 760px; }
  .forge-card { position: absolute; left: 50%; top: 0; width: 150px; margin-left: -75px; transform: translateX(var(--start-x)); transition: transform 1.1s cubic-bezier(.3,0,.2,1), opacity 1.1s ease-in, filter 1.1s; }
  .forge-merge.merging .forge-card { transform: translateX(0) scale(0.15); opacity: 0; filter: blur(3px) brightness(1.8); }
  @media (prefers-reduced-motion: reduce) { .forge-merge.merging .forge-card { transition: none; } }
  .wheel-wrap { position: relative; width: 320px; height: 320px; margin: 40px auto 20px; }
  .wheel-wrap.shake { animation: stage-shake 0.45s ease-in-out; }
  .wheel-glow-ring { position: absolute; inset: -18px; border-radius: 50%; z-index: 0;
    background: conic-gradient(from 0deg, #ffd700, #ff6ec7, #4fd8ff, #b571ff, #3ddc84, #ffd700); filter: blur(16px); opacity: 0.5; animation: wheel-ring-spin 7s linear infinite; }
  .wheel-wrap.spinning .wheel-glow-ring { opacity: 0.85; animation-duration: 1.4s; }
  @keyframes wheel-ring-spin { to { transform: rotate(360deg); } }
  .wheel-lights { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .wheel-light { position: absolute; top: 50%; left: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: #fff6da; box-shadow: 0 0 7px 2px rgba(255,210,110,0.85); animation: wheel-light-twinkle 1.5s ease-in-out infinite; }
  @keyframes wheel-light-twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.7) rotate(var(--a)) translate(152px) rotate(calc(var(--a) * -1)); } 50% { opacity: 1; transform: scale(1.2) rotate(var(--a)) translate(152px) rotate(calc(var(--a) * -1)); } }
  .wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid var(--panel-2); position: relative; z-index: 1;
    box-shadow: 0 0 36px -4px rgba(255,179,71,0.55), inset 0 0 26px rgba(0,0,0,0.55); transition: box-shadow 0.3s; }
  .wheel.spinning { box-shadow: 0 0 70px 10px rgba(255,179,71,0.85), inset 0 0 26px rgba(0,0,0,0.55); }
  .wheel.epic-win { animation: wheel-epic-pulse 0.9s ease-out; }
  @keyframes wheel-epic-pulse { 0% { box-shadow: 0 0 36px -4px rgba(255,179,71,0.55); } 40% { box-shadow: 0 0 80px 18px rgba(181,113,255,0.95); } 100% { box-shadow: 0 0 36px -4px rgba(255,179,71,0.55); } }
  .wheel-shine { position: absolute; inset: 0; border-radius: 50%; z-index: 2; pointer-events: none;
    background: radial-gradient(circle at 32% 24%, rgba(255,255,255,0.45), transparent 46%); mix-blend-mode: screen; }
  .wheel-hub { position: absolute; top: 50%; left: 50%; width: 58px; height: 58px; margin: -29px; border-radius: 50%; z-index: 3;
    background: radial-gradient(circle at 35% 28%, #fff7e0, #ffb347 55%, #c9790f); box-shadow: 0 0 20px rgba(255,179,71,0.75), inset 0 2px 5px rgba(255,255,255,0.7);
    display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
  .wheel-pointer-fixed { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 0; height: 0; z-index: 4;
    border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 24px solid #fff6da; filter: drop-shadow(0 0 8px rgba(255,210,110,0.9)); }
  .wheel-label { position: absolute; top: 50%; left: 50%; width: 94px; margin-left: -47px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 0.74rem; color: #05141c; text-shadow: 0 1px 2px rgba(255,255,255,0.35); }
  .wheel-label.epic { font-weight: 800; animation: wheel-epic-text 1.6s ease-in-out infinite; }
  @keyframes wheel-epic-text { 0%, 100% { text-shadow: 0 0 6px #fff, 0 0 12px #b571ff; } 50% { text-shadow: 0 0 16px #fff, 0 0 26px #ff6ec7; } }
  .wheel-action { text-align: center; margin-top: 16px; position: relative; z-index: 1; }

  .wheel-action .btn.primary.lg:hover { background: linear-gradient(180deg, #ffe3a3, #ffc166); }
  #wheel-cooldown { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
  .wheel-result { max-width: 360px; margin: 22px auto 0; text-align: center; padding: 16px 20px; border-radius: var(--radius);
    background: linear-gradient(180deg, var(--panel), var(--panel-2)); border: 1px solid var(--rc, var(--border)); box-shadow: 0 0 28px -8px var(--rc, transparent);
    opacity: 0; transform: translateY(8px) scale(0.96); transition: opacity 0.35s ease-out, transform 0.35s ease-out; }

  .wheel-result .wr-label { font-family: var(--font-display); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--rc, var(--text-dim)); margin-bottom: 4px; }
  .wheel-result .wr-main { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; }
  .wheel-result .wr-sub { color: var(--text-dim); font-size: 0.82rem; margin-top: 2px; }
  .battle-lobby-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--bg-elevated); border-radius: 8px; border: 1px solid var(--border-soft); margin-bottom: 8px; }

  .battle-lobby-info { flex: 1; font-size: 0.88rem; }
  .battle-arena { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 16px; }
  .battle-col { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 14px; }

  .reveal-stage { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; overflow: hidden; }
  .reveal-caselabel { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); font-size: 0.9rem; }
  .reel-viewport { position: relative; width: min(900px, 92vw); height: 190px; overflow: hidden; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-elevated); }
  .reel-pointer { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 5; box-shadow: 0 0 12px var(--accent); }
  .reel-pointer::before, .reel-pointer::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; }
  .reel-pointer::before { top: -1px; border-top: 9px solid var(--accent); } .reel-pointer::after { bottom: -1px; border-bottom: 9px solid var(--accent); }
  .reel-strip { position: absolute; top: 0; left: 0; height: 100%; display: flex; will-change: transform; }
  .reel-card { width: 176px; height: 100%; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-right: 1px solid var(--border-soft); padding: 10px; text-align: center; }
  .reel-card-cat { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-faint); }
  .reel-card-name { font-family: var(--font-display); font-weight: 600; font-size: 0.92rem; line-height: 1.15; }
  .reel-card-rarity { font-family: var(--font-display); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .reel-card.landed { background: radial-gradient(circle, color-mix(in srgb, var(--rc) 18%, transparent), transparent 70%); }
  .fx-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .reveal-result { opacity: 0; transform: translateY(12px); transition: opacity .4s, transform .4s; }
  .reveal-result.show { opacity: 1; transform: translateY(0); }
  .result-card { background: var(--panel); border: 1px solid var(--rc); border-radius: 16px; padding: 30px 40px; text-align: center; box-shadow: 0 0 60px -10px var(--rg); position: relative; z-index: 1; overflow: visible; }
  .result-rarity { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.12em; font-size: 0.85rem; margin-bottom: 6px; }
  .result-name { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; margin-bottom: 2px; }
  .result-mfr { color: var(--text-dim); margin-bottom: 14px; }
  .result-price { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 600; color: var(--credit); margin-bottom: 18px; }
  .livery-badge { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--credit); border: 1px solid var(--credit); border-radius: 14px; padding: 2px 9px; max-width: 100%; box-sizing: border-box; white-space: normal; word-break: break-word; line-height: 1.3; }
  .result-livery { margin: -4px 0 12px; }
  .ac-livery { margin-bottom: 8px; }
  .livery-catalog-card { padding: 14px 18px; }
  .livery-catalog-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border-soft); }
  .livery-catalog-head a { font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; text-decoration: none; }
  .livery-catalog-head a:hover { text-decoration: underline; }
  .livery-odds-list { display: flex; flex-direction: column; gap: 6px; }
  .livery-odds-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; font-size: 0.86rem; padding: 6px 10px; background: var(--bg-elevated); border-radius: 7px; }
  @media (max-width: 640px) { .livery-odds-row { grid-template-columns: 1fr; gap: 2px; text-align: left; } }
  .result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; max-width: 380px; margin: 0 auto; }
  .result-rays { position: absolute; top: 50%; left: 50%; width: 640px; height: 640px; transform: translate(-50%,-50%) rotate(0deg); z-index: -1; pointer-events: none;
    background: conic-gradient(from 0deg, transparent 0deg, var(--rc) 6deg, transparent 16deg, transparent 164deg, var(--rc) 174deg, transparent 184deg, transparent 344deg, var(--rc) 352deg, transparent 360deg);
    opacity: 0.3; filter: blur(3px); animation: rays-rotate 7s linear infinite; }
  @keyframes rays-rotate { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(360deg); } }
  @keyframes stage-shake { 0%, 100% { transform: translate(0,0); } 20% { transform: translate(-7px,5px); } 40% { transform: translate(7px,-5px); } 60% { transform: translate(-5px,-7px); } 80% { transform: translate(5px,7px); } }
  .reveal-stage.shake { animation: stage-shake 0.45s ease-in-out; }
  @keyframes flash-pulse { 0% { background: rgba(255,255,255,0); } 12% { background: var(--fc); } 100% { background: rgba(4,6,10,0.94); } }
  #reveal-overlay.flash-legendary { animation: flash-pulse 0.7s ease-out; --fc: rgba(255,111,174,0.35); }
  #reveal-overlay.flash-mythic { animation: flash-pulse 0.85s ease-out; --fc: rgba(255,207,61,0.45); }
  #reveal-overlay.flash-ultra { animation: flash-pulse 1s ease-out; --fc: rgba(255,77,77,0.55); }
  @keyframes flash-pulse-golden { 0% { background: rgba(255,255,255,0); } 6% { background: #fffde8; } 16% { background: rgba(255,215,0,0.65); } 30% { background: rgba(255,215,0,0.1); }
    42% { background: rgba(255,215,0,0.55); } 58% { background: rgba(255,215,0,0.08); } 70% { background: rgba(255,215,0,0.35); } 100% { background: rgba(4,6,10,0.94); } }
  #reveal-overlay.flash-golden { animation: flash-pulse-golden 1.3s ease-out; }
  @keyframes flash-pulse-divine { 0% { background: rgba(255,255,255,0); } 10% { background: #fffdf0; } 30% { background: var(--fc); } 100% { background: rgba(4,6,10,0.94); } }
  #reveal-overlay.flash-divine { animation: flash-pulse-divine 1.3s ease-out; --fc: rgba(255,223,0,0.75); }
  @keyframes stage-shake-divine { 0%, 100% { transform: translate(0,0) scale(1); } 15% { transform: translate(-10px,7px) scale(1.01); } 30% { transform: translate(10px,-7px) scale(1.01); }
    45% { transform: translate(-8px,-10px) scale(1.01); } 60% { transform: translate(8px,10px) scale(1.01); } 75% { transform: translate(-6px,6px) scale(1.005); } 90% { transform: translate(6px,-4px) scale(1.005); } }
  .reveal-stage.shake-divine { animation: stage-shake-divine 0.9s ease-in-out; }
  .reel-card.golden-slot { background: radial-gradient(circle, rgba(255,215,0,0.18), transparent 75%); animation: golden-pulse 1s ease-in-out infinite; gap: 4px; }
  @keyframes golden-pulse { 0%, 100% { box-shadow: inset 0 0 0 rgba(255,215,0,0); } 50% { box-shadow: inset 0 0 30px rgba(255,215,0,0.5); } }
  .golden-slot-icon { font-size: 2.3rem; line-height: 1; filter: drop-shadow(0 0 10px rgba(255,215,0,0.85)); }
  @keyframes golden-hit-zoom { 0% { transform: scale(1); filter: brightness(1); } 25% { transform: scale(1.22); filter: brightness(1.8); } 55% { transform: scale(0.96); filter: brightness(1.3); } 100% { transform: scale(1.06); filter: brightness(1.15); } }
  .reel-card.golden-slot.hit { animation: golden-pulse 1s ease-in-out infinite, golden-hit-zoom 0.6s ease-out; z-index: 2; }
  @keyframes golden-burst-ring { 0% { opacity: 0.95; transform: translate(-50%,-50%) scale(0.15); border-width: 14px; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(5.5); border-width: 1px; } }
  .golden-burst { position: absolute; top: 50%; left: 50%; width: 120px; height: 120px; border-radius: 50%; border: 14px solid rgba(255,215,0,0.8);
    pointer-events: none; z-index: 1; animation: golden-burst-ring 0.9s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes golden-burst-glow { 0% { opacity: 0.9; transform: translate(-50%,-50%) scale(0.2); } 60% { opacity: 0.55; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(3.4); } }
  .golden-burst-glow { position: absolute; top: 50%; left: 50%; width: 360px; height: 360px; border-radius: 50%; pointer-events: none; z-index: 0;
    background: radial-gradient(circle, rgba(255,245,200,0.95), rgba(255,215,0,0.5) 45%, transparent 72%); animation: golden-burst-glow 1s ease-out forwards; }
  .reel-viewport.golden-wheel { border-color: #ffd700; background: radial-gradient(ellipse at center, rgba(255,215,0,0.12), var(--bg-elevated) 75%); box-shadow: 0 0 40px -10px rgba(255,215,0,0.5); }
  .reel-card.golden-card { border-right-color: rgba(255,215,0,0.25); }
  @media (prefers-reduced-motion: reduce) {
    .reel-strip { transition: none !important; }
    #reveal-overlay.flash-legendary, #reveal-overlay.flash-mythic, #reveal-overlay.flash-ultra, #reveal-overlay.flash-golden, #reveal-overlay.flash-divine { animation: none; }
    .result-rays { animation: none; } .reveal-stage.shake, .reveal-stage.shake-divine { animation: none; } .reel-card.golden-slot, .reel-card.golden-slot.hit { animation: none; }
    .golden-burst, .golden-burst-glow { display: none; }
  }
  @media (max-width: 640px) {
    .hud-bar { flex-wrap: wrap; gap: 10px; } .hud-stats { order: 3; width: 100%; justify-content: space-between; }
    .hud-spacer { display: none; }
    .lb-header, .lb-row { grid-template-columns: 32px 1fr 70px 100px; }
  }

  /* ================= Seasonal events + music ================= */
  #sv-scene, #sv-amb { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  #sv-amb { width: 100%; height: 100%; }
  #auth-screen, #game-root { position: relative; z-index: 1; }
  html[data-season] body { background: radial-gradient(ellipse 900px 520px at 15% -10%, var(--sea-glow), transparent 62%),
    radial-gradient(ellipse 700px 500px at 100% 0%, var(--sea-glow2), transparent 58%), var(--bg); }
  html[data-season="halloween"]    { --bg: #0d0812; --bg-elevated: #120b18; --accent: #ff9a3c; --accent-dim: #8a4a14; --sea-glow: rgba(255,122,26,.16); --sea-glow2: rgba(140,70,220,.16); }
  html[data-season="friday13"]     { --bg: #08060e; --bg-elevated: #0e0a16; --accent: #b48cff; --accent-dim: #5a3f8a; --sea-glow: rgba(130,60,200,.18); --sea-glow2: rgba(255,122,26,.08); }
  html[data-season="christmas"]    { --bg: #071324; --bg-elevated: #0a182c; --accent: #9fe8ff; --accent-dim: #2f6f86; --sea-glow: rgba(120,200,255,.14); --sea-glow2: rgba(255,59,59,.10); }
  html[data-season="newyear"]      { --bg: #07071a; --bg-elevated: #0c0c22; --accent: #ffd54f; --accent-dim: #8a6d1c; --sea-glow: rgba(255,213,79,.13); --sea-glow2: rgba(255,79,139,.10); }
  html[data-season="july4"]        { --bg: #070b20; --bg-elevated: #0b1028; --accent: #7fa6ff; --accent-dim: #2f4f9a; --sea-glow: rgba(255,59,59,.12); --sea-glow2: rgba(79,125,255,.16); }
  html[data-season="valentine"]    { --bg: #14070f; --bg-elevated: #1a0a14; --accent: #ff7aa8; --accent-dim: #8a2e50; --sea-glow: rgba(255,79,139,.18); --sea-glow2: rgba(255,159,208,.08); }
  html[data-season="stpatrick"]    { --bg: #06140c; --bg-elevated: #091a10; --accent: #5fe08a; --accent-dim: #23794a; --sea-glow: rgba(63,220,110,.15); --sea-glow2: rgba(255,213,79,.08); }
  html[data-season="easter"]       { --bg: #120c1e; --bg-elevated: #181026; --accent: #ffa6d6; --accent-dim: #8a4d72; --sea-glow: rgba(255,159,208,.16); --sea-glow2: rgba(166,227,255,.12); }
  html[data-season="summer"]       { --bg: #061820; --bg-elevated: #081e28; --accent: #ffd23f; --accent-dim: #8a7016; --sea-glow: rgba(255,210,63,.16); --sea-glow2: rgba(63,224,197,.12); }
  html[data-season="thanksgiving"] { --bg: #120a06; --bg-elevated: #180e08; --accent: #ffa04d; --accent-dim: #8a4f1c; --sea-glow: rgba(255,138,61,.16); --sea-glow2: rgba(196,64,26,.10); }

  /* scenery behind the market: sky object, a little airfield, fly-bys */
  .sv-moon { position: absolute; top: 12vh; right: 7vw; width: min(13vw, 120px); aspect-ratio: 1; border-radius: 50%; opacity: .75;
    background: radial-gradient(circle at 30% 62%, rgba(0,0,0,.08) 0 8%, transparent 9%), radial-gradient(circle at 64% 34%, rgba(0,0,0,.07) 0 6%, transparent 7%),
      radial-gradient(circle at 35% 35%, #fffbe9, #e9e3c8 55%, #b9b293); box-shadow: 0 0 60px 14px rgba(255,250,220,.16); }
  .sv-moon.blood { background: radial-gradient(circle at 30% 62%, rgba(120,40,0,.25) 0 8%, transparent 9%), radial-gradient(circle at 35% 35%, #ffe2b8, #ff9a3c 55%, #b54a12); box-shadow: 0 0 70px 18px rgba(255,122,26,.28); }
  .sv-moon.grey { filter: grayscale(1); opacity: .5; }
  .sv-moon.dim { opacity: .4; }
  .sv-moon.harvest { background: radial-gradient(circle at 35% 35%, #ffe7c2, #ffb066 55%, #c4621a); box-shadow: 0 0 70px 16px rgba(255,138,61,.24); }
  .sv-sun { position: absolute; top: 9vh; right: 8vw; width: min(14vw, 130px); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, #fff7c2, #ffd23f 55%, #ffb000); box-shadow: 0 0 80px 24px rgba(255,210,63,.28); opacity: .85; }
  .sv-sun::before { content: ""; position: absolute; inset: -40%; border-radius: 50%; animation: sv-spin 40s linear infinite;
    background: repeating-conic-gradient(rgba(255,220,100,.18) 0 8deg, transparent 8deg 22deg); -webkit-mask: radial-gradient(circle, transparent 40%, #000 42%, transparent 70%); mask: radial-gradient(circle, transparent 40%, #000 42%, transparent 70%); }
  .sv-heart { position: absolute; top: 26vh; right: 10vw; width: 90px; height: 90px; transform: rotate(-45deg); background: #ff4f8b; opacity: .35; filter: blur(1px); animation: sv-beat 1.6s ease-in-out infinite; }
  .sv-heart::before, .sv-heart::after { content: ""; position: absolute; width: 90px; height: 90px; border-radius: 50%; background: inherit; }
  .sv-heart::before { top: -45px; left: 0; } .sv-heart::after { left: 45px; top: 0; }
  .sv-rainbow { position: absolute; left: -22vmax; bottom: -32vmax; width: 72vmax; height: 72vmax; border-radius: 50%; opacity: .2; filter: blur(2px);
    background: radial-gradient(circle, transparent 52%, #ff4d4d 52% 55%, #ffa94d 55% 58%, #ffe14d 58% 61%, #5fd35f 61% 64%, #4dabff 64% 67%, #9b6bff 67% 70%, transparent 70%); }
  .sv-ground { position: absolute; left: 0; right: 0; bottom: 0; height: clamp(90px, 16vh, 170px); }
  .sv-ground svg { width: 100%; height: 100%; display: block; }
  .sv-rwy circle, .sv-pk { animation: sv-blink 2.4s ease-in-out infinite; }
  .sv-tow { position: absolute; left: 0; display: flex; align-items: center; white-space: nowrap; animation: sv-across 46s linear infinite; will-change: transform; }
  .sv-tow .ban { font: 700 13px var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: #140c02; background: var(--sea-solid); padding: 4px 12px;
    border-radius: 2px; box-shadow: 0 2px 10px rgba(0,0,0,.4); transform-origin: right center; animation: sv-flutter 1.1s ease-in-out infinite; }
  .sv-tow .rope { width: 44px; height: 1px; background: rgba(255,255,255,.5); }
  .sv-tow svg { width: 72px; height: 26px; display: block; }
  .sv-tow .nav { animation: sv-blink 1s steps(1) infinite; }
  .sv-fly { position: absolute; left: 0; font-size: 34px; animation: sv-across 34s linear infinite; animation-delay: -12s; will-change: transform; }
  .sv-fly.rtl { animation-name: sv-across-rtl; }
  @keyframes sv-across { from { transform: translateX(-120%); } to { transform: translateX(110vw); } }
  @keyframes sv-across-rtl { from { transform: translateX(110vw); } to { transform: translateX(-120%); } }
  @keyframes sv-flutter { 50% { transform: skewY(-2deg) scaleY(.92); } }
  @keyframes sv-blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  @keyframes sv-spin { to { transform: rotate(360deg); } }
  @keyframes sv-beat { 50% { transform: rotate(-45deg) scale(1.08); } }

  /* event banner under the ticker, with the live countdown */
  .sv-sea-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 20px; border-bottom: 1px solid var(--border-soft);
    background: linear-gradient(90deg, var(--sea-glow, transparent), transparent 75%), var(--bg-elevated); }
  .sv-sea-bar[hidden] { display: none; }
  .sv-sea-bar .ic { font-size: 1.35rem; line-height: 1; }
  .sv-sea-bar b { font-family: var(--font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
  .sv-sea-bar .msg { color: var(--text-dim); font-size: .85rem; flex: 1; min-width: 200px; }
  .sv-sea-bar .cd { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .82rem; color: var(--text); white-space: nowrap;
    background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 3px 12px; }
  .sv-sea-bar .cd span { color: var(--accent); font-weight: 600; }
  .sv-logo-ic { margin-left: 2px; font-size: 1.05rem; }
  .music-on { color: var(--accent) !important; border-color: var(--accent-dim) !important; box-shadow: 0 0 12px -4px var(--accent); }

  /* catchable bonus item that drifts across the screen */
  .sv-collect { position: fixed; left: 0; z-index: 45; font-size: 36px; line-height: 1; background: none; border: none; padding: 8px; cursor: pointer;
    filter: drop-shadow(0 0 10px var(--sea-solid)); animation: sv-collect 13s linear forwards; }
  .sv-collect.rtl { animation-name: sv-collect-rtl; }
  .sv-collect span { display: inline-block; animation: sv-bob 1.4s ease-in-out infinite; }
  .sv-collect:hover span { transform: scale(1.3); }
  @keyframes sv-collect { from { transform: translateX(-70px); } to { transform: translateX(calc(100vw + 70px)); } }
  @keyframes sv-collect-rtl { from { transform: translateX(calc(100vw + 70px)); } to { transform: translateX(-70px); } }
  @keyframes sv-bob { 50% { transform: translateY(-10px) rotate(8deg); } }

  /* the last 10 seconds of the year */
  .sv-ny { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; pointer-events: none; text-align: center;
    font: 700 clamp(64px, 16vw, 180px)/1 var(--font-display); color: #ffd54f; text-shadow: 0 0 40px rgba(255,213,79,.7), 0 6px 0 rgba(0,0,0,.4); }
  .sv-ny small { display: block; font-size: .28em; letter-spacing: .3em; color: #fff; }
  .sv-ny.pop { animation: sv-ny-pop .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes sv-ny-pop { from { transform: scale(.4); opacity: 0; } }

  /* music & events window */
  .sv-set h4 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); font-size: .78rem; margin: 16px 0 8px; }
  .sv-set h4:first-child { margin-top: 0; }
  .sv-switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: .88rem; margin-bottom: 10px; }
  .sv-switch small { display: block; color: var(--text-faint); font-size: .74rem; margin-top: 2px; }
  .sv-range { width: 100%; accent-color: var(--accent); }
  .sv-tracks { display: grid; gap: 6px; }
  .sv-track { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; cursor: pointer; color: var(--text); font: inherit;
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .sv-track:hover { border-color: var(--accent-dim); }
  .sv-track.on { border-color: var(--accent); background: rgba(255,255,255,.05); }
  .sv-track.sea { border-style: dashed; border-color: var(--sea-solid); }
  .sv-track.sea.on { border-style: solid; }
  .sv-track b { font-family: var(--font-display); font-weight: 600; display: block; font-size: .92rem; }
  .sv-track small { color: var(--text-faint); font-size: .74rem; }
  .sv-track .t-st { margin-left: auto; font-family: var(--font-mono); font-size: .72rem; color: var(--accent); white-space: nowrap; }
  #sv-track-left, #sv-next-left { font-family: var(--font-mono); color: var(--accent); }
  @media (prefers-reduced-motion: reduce) {
    .sv-tow, .sv-fly { display: none; }
    .sv-rwy circle, .sv-pk, .sv-sun::before, .sv-heart, .sv-tow .ban { animation: none; }
  }

  /* ================= Overhaul update ================= */
  .modal-box.wide { max-width: 560px; }
  .modal-box.xwide { max-width: 760px; }
  .modal-body { max-height: 70vh; overflow-y: auto; }
  .hud-icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel); color: var(--text-dim); cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; }
  .hud-icon-btn:hover { border-color: var(--accent-dim); color: var(--text); }
  .hud-icon-btn .dot { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .sub-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .sub-tab { font-family: var(--font-display); font-weight: 600; font-size: 0.88rem; text-decoration: none; color: var(--text-dim); padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; }
  .sub-tab:hover { color: var(--text); border-color: var(--accent-dim); }
  .sub-tab.active { color: var(--accent); border-color: var(--accent-dim); background: rgba(79,216,255,0.1); }

  .exclusive-badge { display: inline-block; font-family: var(--font-display); font-weight: 700; font-size: 0.6rem; letter-spacing: 0.1em; padding: 2px 7px; border-radius: 5px; margin-bottom: 6px; color: #04140f;
    background: linear-gradient(90deg, #5effc1, #7ad7ff, #c48bff, #5effc1); background-size: 300% 100%; animation: legacy-heading-shift 4s linear infinite; }
  .lock-btn { background: none; border: 1px solid var(--border); color: var(--text-faint); border-radius: 7px; width: 30px; flex: 0 0 30px !important; padding: 0 !important; cursor: pointer; font-size: 0.85rem; }

  /* market events */

  .ev-chip { font-family: var(--font-mono); font-size: 0.66rem; padding: 1px 6px; border-radius: 5px; border: 1px solid; margin-left: 6px; }
  /* buy orders + auctions */
  .order-row, .watch-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--bg-elevated); border-radius: 8px; border: 1px solid var(--border-soft); font-size: 0.86rem; margin-bottom: 8px; }

  @media (max-width: 640px) { .order-row, .watch-row { grid-template-columns: 1fr auto; } }
  .auction-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }

  .auction-card.outbid { border-color: var(--danger); }
  .auc-bid { font-family: var(--font-mono); font-size: 1.25rem; font-weight: 600; color: var(--credit); margin: 8px 0 2px; }
  .auc-meta { font-size: 0.8rem; color: var(--text-dim); display: flex; justify-content: space-between; gap: 8px; }
  .auc-time { font-family: var(--font-mono); color: var(--accent); }

  .auc-status { font-family: var(--font-display); font-weight: 700; font-size: 0.75rem; letter-spacing: .06em; text-transform: uppercase; margin-top: 8px; }
  .quick-bids { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

  /* reel: near-miss tease + legendary cinematic */
  .reel-viewport { transition: box-shadow .5s, border-color .5s, opacity .5s, filter .5s; }
  .reel-viewport.tease { border-color: var(--tc); box-shadow: 0 0 0 1px var(--tc), 0 0 60px -6px var(--tc), inset 0 0 40px -10px var(--tc); }
  .reel-viewport.cine-dim { opacity: .18; filter: blur(3px); }
  .cine { position: absolute; inset: 0; z-index: 6; pointer-events: auto; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .cine.out { transition: opacity .45s; opacity: 0; pointer-events: none; }
  .cine-dark { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(0,0,0,.35), rgba(0,0,0,.92) 70%); animation: cine-fade .5s ease-out both; }
  .cine-beam { position: absolute; left: 50%; top: -10%; width: 220px; height: 120%; margin-left: -110px; transform-origin: 50% 50%;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--rc) 55%, transparent) 35%, #fff 50%, color-mix(in srgb, var(--rc) 55%, transparent) 65%, transparent); filter: blur(14px);
    animation: cine-beam 1.1s cubic-bezier(.2,.8,.2,1) .1s both; mix-blend-mode: screen; }
  .cine-rays { position: absolute; left: 50%; top: 50%; width: 1400px; height: 1400px; margin: -700px; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 40%, transparent) 0 4deg, transparent 4deg 18deg);
    -webkit-mask: radial-gradient(circle, #000 8%, transparent 60%); mask: radial-gradient(circle, #000 8%, transparent 60%);
    animation: cine-rays 6s linear infinite, cine-fade .9s ease-out .35s both; opacity: .9; }
  .cine-ring { position: absolute; left: 50%; top: 50%; width: 160px; height: 160px; margin: -80px; border-radius: 50%; border: 3px solid var(--rc); box-shadow: 0 0 30px var(--rc), inset 0 0 20px var(--rc); opacity: 0;
    animation: cine-ring 1.6s cubic-bezier(.15,.7,.3,1) forwards; }
  .cine-ring.r2 { animation-delay: .35s; } .cine-ring.r3 { animation-delay: .7s; }
  .cine-streak { position: absolute; left: 50%; top: 50%; width: 140px; height: 2px; margin-top: -1px; transform-origin: 0 50%;
    background: linear-gradient(90deg, transparent, var(--rc), #fff); border-radius: 2px; opacity: 0; animation: cine-streak 1.2s ease-in var(--d) infinite; }
  .cine-plane { position: relative; width: 260px; height: 195px; animation: cine-plane 1.5s cubic-bezier(.15,.85,.25,1.05) .45s both; filter: drop-shadow(0 0 22px var(--rc)) drop-shadow(0 0 60px var(--rc)); }
  .cine-plane svg { width: 100%; height: 100%; }
  .cine-text { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; }
  .cine-rarity { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.2rem, 7vw, 4.6rem); letter-spacing: .28em; color: #fff; text-shadow: 0 0 18px var(--rc), 0 0 46px var(--rc); padding-left: .28em; }
  .cine-rarity span { display: inline-block; opacity: 0; animation: cine-letter .5s cubic-bezier(.2,1.6,.4,1) both; }
  .cine-name { font-family: var(--font-display); font-weight: 600; font-size: clamp(1rem, 2.6vw, 1.5rem); color: var(--rc); letter-spacing: .06em; margin-top: 6px; opacity: 0; animation: cine-up .6s ease-out 1.25s both; }
  .cine-skip { position: absolute; bottom: 18px; right: 22px; font-size: .72rem; color: rgba(255,255,255,.4); font-family: var(--font-mono); letter-spacing: .08em; }
  .cine-sweep { position: absolute; inset: -20%; background: linear-gradient(115deg, transparent 35%, color-mix(in srgb, var(--rc) 60%, transparent) 48%, #fff 50%, color-mix(in srgb, var(--rc) 60%, transparent) 52%, transparent 65%); mix-blend-mode: screen; opacity: 0; animation: cine-sweep 1.3s ease-in-out .2s both; }
  .cine-mythic .cine-sweep, .cine-ultra .cine-sweep, .cine-divine .cine-sweep { animation-iteration-count: 2; }
  .cine-ultra .cine-dark { background: radial-gradient(circle, rgba(60,0,0,.35), rgba(10,0,0,.94) 70%); }
  .cine-ultra .cine-plane { animation: cine-plane 1.5s cubic-bezier(.15,.85,.25,1.05) .45s both, cine-tremble .12s linear 2s 8; }
  .cine-divine .cine-dark { background: radial-gradient(circle, rgba(255,250,220,.25), rgba(20,14,0,.92) 70%); }
  .cine-divine .cine-rarity { color: #fffbe0; }
  .cine-divine .cine-halo { position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,230,.9), rgba(255,223,0,.35) 35%, transparent 65%); animation: cine-halo 2.2s ease-out .3s both; }
  @keyframes cine-fade { from { opacity: 0; } }
  @keyframes cine-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes cine-beam { 0% { transform: scaleX(0) scaleY(.2); opacity: 0; } 30% { transform: scaleX(1.6) scaleY(1); opacity: 1; } 100% { transform: scaleX(.7) scaleY(1); opacity: .55; } }
  @keyframes cine-rays { to { transform: rotate(360deg); } }
  @keyframes cine-ring { 0% { transform: scale(.1); opacity: 1; } 100% { transform: scale(5.5); opacity: 0; } }
  @keyframes cine-streak { 0% { opacity: 0; transform: rotate(var(--a)) translateX(30px) scaleX(.3); } 20% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateX(70vmax) scaleX(1.6); } }
  @keyframes cine-plane { 0% { transform: scale(.04) translateY(60px) rotate(-14deg); opacity: 0; filter: blur(6px) drop-shadow(0 0 22px var(--rc)); } 55% { opacity: 1; transform: scale(1.22) rotate(4deg); filter: blur(0) drop-shadow(0 0 30px var(--rc)) drop-shadow(0 0 80px var(--rc)); } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes cine-letter { from { opacity: 0; transform: translateY(26px) scale(1.8); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes cine-sweep { 0% { opacity: 0; transform: translateX(-60%); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateX(60%); } }
  @keyframes cine-tremble { 25% { transform: translate(-3px, 2px); } 75% { transform: translate(3px, -2px); } }
  @keyframes cine-halo { 0% { transform: scale(.2); opacity: 0; } 40% { opacity: 1; } 100% { transform: scale(1.4); opacity: .5; } }

  /* arena: air races + dogfights */
  .arena-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .arena-grid { grid-template-columns: 1fr; } }
  .arena-canvas { width: 100%; display: block; border-radius: var(--radius); border: 1px solid var(--border); background: #07101c; }
  .race-canvas { height: 330px; }
  .fight-canvas { height: 300px; }
  .prize-table { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .prize-table span { font-family: var(--font-mono); font-size: 0.78rem; padding: 4px 10px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-elevated); }
  .hp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 12px; }

  .hp-fill.mid { background: linear-gradient(90deg, #ffb347, #ffd54f); } .hp-fill.low { background: linear-gradient(90deg, #ff5c5c, #ff8a5c); }

  /* upgrade gamble */
  .upg-layout { display: grid; grid-template-columns: 1fr 340px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 980px) { .upg-layout { grid-template-columns: 1fr; } }
  .upg-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
  .upg-item { text-align: left; border: 1px solid var(--border); border-top: 2px solid var(--rc); border-radius: 8px; background: var(--bg-elevated); color: var(--text); padding: 8px 10px; cursor: pointer; font-size: 0.8rem; font-family: inherit; }
  .upg-item.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 18px -6px var(--accent); background: rgba(79,216,255,0.08); }
  .upg-item b { font-family: var(--font-display); display: block; font-size: 0.86rem; line-height: 1.15; }
  .upg-item .v { font-family: var(--font-mono); color: var(--credit); font-size: 0.75rem; }
  .gauge-wrap { position: relative; width: 300px; height: 300px; margin: 0 auto; }
  .gauge-wrap svg { width: 100%; height: 100%; }
  .gauge-needle { position: absolute; left: 50%; top: 50%; width: 6px; height: 132px; margin-left: -3px; margin-top: -132px; transform-origin: 50% 100%; border-radius: 4px;
    background: linear-gradient(180deg, #fff, var(--accent)); box-shadow: 0 0 14px var(--accent); }
  .gauge-center { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
  .gauge-center .pct { font-family: var(--font-mono); font-size: 2rem; font-weight: 600; }

  .gauge-wrap.win { animation: gauge-win 1s ease-out; } .gauge-wrap.lose { animation: stage-shake .45s ease-in-out; }
  @keyframes gauge-win { 30% { filter: drop-shadow(0 0 40px #3ddc84) brightness(1.4); transform: scale(1.04); } }
  .upg-target { text-align: center; }
  .mult-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }

  /* Black Friday */
  html[data-season="blackfriday"] { --bg: #050505; --bg-elevated: #0d0d0d; --panel: #121212; --panel-2: #191919; --border: #2c2c2c; --border-soft: #1f1f1f; --accent: #ffd400; --accent-dim: #8a7300; --sea-glow: rgba(255,212,0,.14); --sea-glow2: rgba(255,60,60,.10); }
  .bf-hero { position: relative; overflow: hidden; border-radius: var(--radius); padding: 22px 26px; margin-bottom: 22px; border: 2px solid #ffd400;
    background: repeating-linear-gradient(-45deg, rgba(255,212,0,.07) 0 14px, transparent 14px 28px), #0a0a0a; box-shadow: 0 0 40px -12px #ffd400; }

  /* update log */

  /* Aurora Vault (gift-code exclusive case) */
  .aurora-card { position: relative; overflow: hidden; border-radius: var(--radius); padding: 22px 26px; margin-top: 30px; border: 2px solid transparent;
    background: linear-gradient(160deg, #06121a, #0b0a1e) padding-box, linear-gradient(90deg, #5effc1, #7ad7ff, #c48bff, #ff8ad8, #5effc1) border-box; background-size: auto, 300% 300%;
    animation: legacy-border-shift 5s linear infinite; }

  .aurora-card h2 { background: linear-gradient(90deg, #5effc1, #7ad7ff, #c48bff, #5effc1); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: legacy-heading-shift 5s linear infinite; font-size: 1.6rem; }
  .aurora-card .glowbg { position: absolute; inset: -40%; background: radial-gradient(ellipse at 30% 40%, rgba(94,255,193,.16), transparent 45%), radial-gradient(ellipse at 70% 60%, rgba(196,139,255,.18), transparent 45%); animation: aurora-drift 9s ease-in-out infinite alternate; }
  .mini-cube { width: 96px; height: 96px; perspective: 500px; flex-shrink: 0; }
  .mini-cube .aurora-cube { width: 70px; height: 70px; margin: 13px; }
  .mini-cube .aurora-cube .f { width: 70px; height: 70px; }

  .aurora-stars { position: absolute; inset: 0; width: 100%; height: 100%; }

  .aurora-ribbons span { position: absolute; left: -20%; width: 140%; height: 34%; border-radius: 50%; animation: aurora-wave 11s ease-in-out infinite alternate; }
  .aurora-ribbons span:nth-child(1) { top: 2%; background: linear-gradient(90deg, transparent, rgba(94,255,193,.55), rgba(122,215,255,.45), transparent); }
  .aurora-ribbons span:nth-child(2) { top: 16%; background: linear-gradient(90deg, transparent, rgba(196,139,255,.5), rgba(255,138,216,.35), transparent); animation-duration: 14s; animation-delay: -4s; }
  .aurora-ribbons span:nth-child(3) { top: 58%; height: 30%; background: linear-gradient(90deg, transparent, rgba(122,215,255,.3), rgba(94,255,193,.35), transparent); animation-duration: 17s; animation-delay: -8s; opacity: .6; }
  @keyframes aurora-wave { 0% { transform: translateX(-6%) skewY(-6deg) scaleY(.8); } 50% { transform: translateX(4%) skewY(4deg) scaleY(1.15); } 100% { transform: translateX(8%) skewY(-3deg) scaleY(.9); } }
  @keyframes aurora-drift { to { transform: translate(6%, -4%) rotate(8deg); } }
  .aurora-title { position: absolute; top: 9vh; left: 0; right: 0; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 7vw, 4.4rem); letter-spacing: .34em; padding-left: .34em; color: #eafff7; z-index: 3;
    text-shadow: 0 0 18px rgba(94,255,193,.9), 0 0 50px rgba(122,215,255,.6), 0 0 90px rgba(196,139,255,.5); }
  .aurora-title span { display: inline-block; opacity: 0; animation: aurora-letter .9s cubic-bezier(.2,1.2,.3,1) both; }
  .aurora-sub { position: absolute; top: calc(9vh + clamp(2.6rem, 8vw, 5.2rem)); left: 0; right: 0; text-align: center; color: rgba(220,255,245,.7); font-size: .9rem; letter-spacing: .2em; text-transform: uppercase; z-index: 3; animation: cine-up 1s ease-out 1.4s both; }
  @keyframes aurora-letter { from { opacity: 0; transform: translateY(-30px) scale(.6); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }
  .aurora-vault-wrap { position: absolute; left: 50%; top: 54%; width: 200px; height: 200px; margin: -100px; perspective: 900px; z-index: 3; cursor: pointer; animation: aurora-float 4s ease-in-out infinite; }
  @keyframes aurora-float { 50% { transform: translateY(-14px); } }
  .aurora-cube { position: relative; width: 150px; height: 150px; margin: 25px; transform-style: preserve-3d; animation: aurora-spin 9s linear infinite; }
  .aurora-cube .f { position: absolute; width: 150px; height: 150px; border: 2px solid rgba(160,255,230,.85); border-radius: 12px;
    background: linear-gradient(135deg, rgba(94,255,193,.22), rgba(122,215,255,.12) 45%, rgba(196,139,255,.25)); box-shadow: 0 0 26px rgba(94,255,193,.55), inset 0 0 30px rgba(196,139,255,.45); backdrop-filter: blur(2px); transition: transform 1s cubic-bezier(.2,.8,.2,1), opacity 1s; }
  .aurora-cube .f::after { content: "✦"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; color: rgba(230,255,248,.9); text-shadow: 0 0 16px #5effc1; }
  .mini-cube .aurora-cube .f::after { font-size: 1.3rem; }
  .aurora-cube .f1 { transform: rotateY(0deg) translateZ(75px); } .aurora-cube .f2 { transform: rotateY(90deg) translateZ(75px); } .aurora-cube .f3 { transform: rotateY(180deg) translateZ(75px); }
  .aurora-cube .f4 { transform: rotateY(-90deg) translateZ(75px); } .aurora-cube .f5 { transform: rotateX(90deg) translateZ(75px); } .aurora-cube .f6 { transform: rotateX(-90deg) translateZ(75px); }
  .mini-cube .aurora-cube .f1 { transform: rotateY(0deg) translateZ(35px); } .mini-cube .aurora-cube .f2 { transform: rotateY(90deg) translateZ(35px); } .mini-cube .aurora-cube .f3 { transform: rotateY(180deg) translateZ(35px); }

  /* =====================================================================
     UPDATE 2: OVERHAUL. The new look.
     Glass panels, gradient light, depth, and motion everywhere. Layered on
     top of everything above, so every Update 1 effect still works as before.
     ===================================================================== */
  :root {
    --bg: #05080f; --bg-elevated: #090e1a; --panel: #0d1424; --panel-2: #111a2e;
    --border: rgba(140,170,230,.16); --border-soft: rgba(140,170,230,.085);
    --text: #eef3ff; --text-dim: #98a8c8; --text-faint: #5f6f92;
    --accent-2: #8b7bff; --radius: 16px;
    --glass: linear-gradient(160deg, rgba(255,255,255,.065), rgba(255,255,255,.012) 55%);
    --glass-strong: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.02) 60%);
    --lift: 0 18px 40px -24px rgba(0,0,0,.95);
    --ease-spring: cubic-bezier(.2,1.35,.35,1);
    --ease-out: cubic-bezier(.2,.8,.2,1);
    --font-logo: 'Orbitron', 'Rajdhani', sans-serif;
  }
  html[data-season="blackfriday"] { --accent-2: #ff3b3b; }
  html[data-season="halloween"], html[data-season="thanksgiving"] { --accent-2: #b36bff; }
  html[data-season="christmas"] { --accent-2: #ff4d6a; }
  html { scrollbar-color: rgba(120,150,210,.35) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(120,150,210,.3); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  ::-webkit-scrollbar-track { background: transparent; }
  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

  /* ---- living background: a slow radar grid and drifting light ---- */
  body { background-color: var(--bg); }
  /* perf: the grid drifts with a GPU transform instead of repainting the whole screen every frame */
  body::before { content: ""; position: fixed; top: -64px; left: -64px; right: 0; bottom: 0; z-index: 0; pointer-events: none;
    background-image: linear-gradient(rgba(120,170,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(120,170,255,.05) 1px, transparent 1px);
    background-size: 64px 64px; -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 10%, transparent 72%); mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 10%, transparent 72%);
    animation: ui2-grid 30s linear infinite; will-change: transform; }
  body::after { content: ""; position: fixed; inset: -20%; z-index: 0; pointer-events: none; opacity: .9;
    background: radial-gradient(38% 32% at 18% 20%, color-mix(in srgb, var(--accent) 11%, transparent), transparent 70%),
      radial-gradient(34% 30% at 85% 30%, color-mix(in srgb, var(--accent-2) 10%, transparent), transparent 70%),
      radial-gradient(40% 35% at 55% 95%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 70%);
    animation: ui2-orbs 38s ease-in-out infinite alternate; will-change: transform; }
  @keyframes ui2-grid { to { transform: translate3d(64px, 64px, 0); } }
  @keyframes ui2-orbs { 50% { transform: translate(3%, 4%) scale(1.05); } 100% { transform: translate(-3%, 2%) scale(.97); } }

  /* ---- sign-in screen ---- */
  .auth-screen { position: relative; overflow: hidden; }
  .auth-sky { position: absolute; inset: 0; pointer-events: none; }
  .as-plane { position: absolute; left: -10%; font-size: 26px; color: color-mix(in srgb, var(--accent) 70%, #fff); filter: drop-shadow(0 0 10px var(--accent)); opacity: .55; animation: ui2-fly 16s linear infinite; }
  .as-plane::after { content: ""; position: absolute; right: 100%; top: 50%; width: 180px; height: 2px; margin-top: -1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 60%, transparent)); }
  .as-plane.p1 { top: 18%; } .as-plane.p2 { top: 64%; font-size: 18px; animation-duration: 22s; animation-delay: -9s; opacity: .35; } .as-plane.p3 { top: 38%; font-size: 14px; animation-duration: 28s; animation-delay: -18s; opacity: .25; }
  @keyframes ui2-fly { from { transform: translateX(0) rotate(0); } to { transform: translateX(130vw) rotate(0); } }
  .as-runway { position: absolute; left: 50%; bottom: 0; width: 2px; height: 40vh; transform: translateX(-50%) perspective(400px) rotateX(70deg); transform-origin: bottom;
    background: repeating-linear-gradient(to top, color-mix(in srgb, var(--accent) 70%, transparent) 0 18px, transparent 18px 44px); opacity: .25; animation: ui2-runway 1.2s linear infinite; }
  @keyframes ui2-runway { to { background-position: 0 -44px; } }
  .auth-card { position: relative; z-index: 1; max-width: 420px; padding: 40px 32px; border-radius: 24px; background: var(--glass-strong), rgba(10,16,30,.82); backdrop-filter: blur(18px);
    border: 1px solid var(--border); box-shadow: 0 40px 90px -40px #000, 0 0 0 1px rgba(79,216,255,.05), inset 0 1px 0 rgba(255,255,255,.08); animation: ui2-rise .9s var(--ease-spring) both; }
  .auth-card::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(135deg, var(--accent), transparent 35%, transparent 65%, var(--accent-2)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .7; }
  .auth-logo { font-size: 2.2rem; gap: 12px; margin-bottom: 14px; }
  .auth-logo .mark { font-size: 2.2rem; animation: ui2-hover 3s ease-in-out infinite; display: inline-block; }
  .auth-field label { text-transform: uppercase; letter-spacing: .1em; font-size: .7rem; font-weight: 600; }
  .auth-submit { padding: 13px 18px; font-size: 1.05rem; }
  @keyframes ui2-hover { 50% { transform: translateY(-5px) rotate(-6deg); } }
  @keyframes ui2-rise { from { opacity: 0; transform: translateY(30px) scale(.96); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

  /* ---- logo ---- */
  .logo-word { font-family: var(--font-logo); font-weight: 900; letter-spacing: .06em;
    background: linear-gradient(100deg, #fff 10%, color-mix(in srgb, var(--accent) 80%, #fff) 45%, var(--accent-2) 90%); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: ui2-logo-sheen 9s ease-in-out infinite; }
  @keyframes ui2-logo-sheen { 50% { background-position: 100% 0; } }
  .hud-logo { text-decoration: none; color: inherit; font-size: 1.08rem; }
  .hud-logo .mark { display: inline-block; transition: transform .5s var(--ease-spring); filter: drop-shadow(0 0 8px var(--accent)); }
  .hud-logo:hover .mark { transform: translate(4px, -4px) rotate(-18deg) scale(1.15); }

  /* ---- HUD ---- */
  /* perf: no live blur behind the sticky bar (it re-blurred every moving pixel under it each frame) */
  .hud-bar { flex-wrap: wrap; row-gap: 8px; column-gap: 14px; padding: 10px 22px; background: linear-gradient(180deg, rgba(6,10,20,.985), rgba(7,11,22,.95)); backdrop-filter: none; border-bottom: 0;
    box-shadow: 0 16px 40px -28px rgba(0,0,0,.9); }
  .hud-bar::after { content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: 1px; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--accent) 30%, var(--accent-2) 70%, transparent); opacity: .55; animation: ui2-line 6s ease-in-out infinite alternate; transform-origin: center; }
  @keyframes ui2-line { from { transform: scaleX(.55); opacity: .35; } to { transform: scaleX(1); opacity: .7; } }
  .hud-stats { gap: 10px; }
  .hud-stat { text-align: left; padding: 5px 12px; border-radius: 12px; background: rgba(255,255,255,.035); border: 1px solid var(--border-soft); transition: background .3s, border-color .3s, box-shadow .3s; }
  .hud-stat .l { letter-spacing: .14em; font-size: .58rem; }
  .hud-stat .v { font-size: 1rem; }
  .hud-stat.flash-up { animation: ui2-flash-up .9s ease-out; } .hud-stat.flash-down { animation: ui2-flash-down .9s ease-out; }
  @keyframes ui2-flash-up { 15% { background: rgba(61,220,132,.16); border-color: rgba(61,220,132,.55); box-shadow: 0 0 22px -6px #3ddc84; } }
  @keyframes ui2-flash-down { 15% { background: rgba(255,92,92,.14); border-color: rgba(255,92,92,.5); box-shadow: 0 0 22px -6px #ff5c5c; } }
  .sound-toggle, .quick-toggle, .hud-icon-btn { width: 36px; height: 36px; background: var(--glass), var(--panel); border-color: var(--border);
    transition: transform .25s var(--ease-spring), border-color .2s, color .2s, box-shadow .25s, background .2s; }
  .sound-toggle:hover, .quick-toggle:hover, .hud-icon-btn:hover { transform: translateY(-2px) scale(1.06); border-color: var(--accent); color: var(--text); box-shadow: 0 8px 20px -10px var(--accent); }
  .sound-toggle:active, .quick-toggle:active, .hud-icon-btn:active { transform: scale(.92); }
  .hud-identity { background: var(--glass), var(--panel); border-color: var(--border); padding: 4px 12px 4px 4px; transition: border-color .2s, box-shadow .25s, transform .25s var(--ease-spring); }
  .hud-identity:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -12px var(--accent); border-color: var(--accent); }
  #hud-avatar { width: 28px; height: 28px; color: #04121c; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 0 12px -2px var(--accent); }
  .nav-menu-btn { border-radius: 14px; background: var(--glass), var(--panel); }

  /* ---- ticker + event bar ---- */
  .ticker { background: rgba(6,10,20,.55); border-bottom: 1px solid var(--border-soft); -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
  .tick-item { padding: 0 18px; }
  .sv-sea-bar { background: linear-gradient(90deg, var(--sea-glow, transparent), transparent 75%), rgba(8,12,22,.92); }

  /* ---- page + headings ---- */
  .page { position: relative; z-index: 1; padding-top: 34px; }
  .page-head { margin-bottom: 26px; }
  .page-head h1 { font-size: clamp(2rem, 4.2vw, 2.8rem); line-height: 1.05; letter-spacing: .005em; display: inline-block;
    background: linear-gradient(100deg, #fff 25%, color-mix(in srgb, var(--accent) 85%, #fff) 70%, var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .page-head::after { content: ""; display: block; width: 72px; height: 3px; border-radius: 3px; margin-top: 12px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 14px var(--accent); }
  .page-head p.dim { font-size: .98rem; max-width: 70ch; }
  h3 { letter-spacing: .1em; font-size: .92rem; }
  .panel h3::before, .battle-col-header::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 9px; vertical-align: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .battle-col-header::before { display: none; }
  .section-sub { display: flex; align-items: center; gap: 10px; }
  .section-sub::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
  .back-link { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 10px; border: 1px solid transparent; transition: color .2s, background .2s, border-color .2s, transform .25s var(--ease-spring); }
  .back-link:hover { background: rgba(255,255,255,.04); border-color: var(--border-soft); transform: translateX(-3px); }
  .empty-note { padding: 50px 20px; border: 1px dashed var(--border); border-radius: var(--radius); background: rgba(255,255,255,.015); }

  /* ---- page entrance (only when you change page) ---- */
  #app.page-enter .page > :nth-child(-n+12) { animation: ui2-page-in .55s var(--ease-out) backwards; animation-delay: calc(var(--pi, 0) * 50ms); }
  #app.page-enter :is(.ac-grid, .case-grid, .auction-grid, .stat-cards, .forge-grid, .listing-list, .ledger-list, .lb-body, .upg-items) > :nth-child(-n+24) { animation: ui2-card-in .5s var(--ease-spring) backwards; animation-delay: calc(var(--gi, 0) * 30ms + 120ms); }
  #app.page-enter .odds-bar-fill { animation: ui2-bar-grow 1s var(--ease-out) .25s backwards; transform-origin: left; }
  @keyframes ui2-page-in { from { opacity: 0; transform: translateY(16px); } }
  @keyframes ui2-card-in { from { opacity: 0; transform: translateY(22px) scale(.95); } }
  @keyframes ui2-bar-grow { from { transform: scaleX(0); } }

  /* ---- glass surfaces ---- */
  .panel, .battle-col, .stat-card { background: var(--glass), var(--panel); border: 1px solid var(--border-soft); border-radius: 18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), var(--lift); }
  .panel { padding: 20px; margin-bottom: 18px; }
  .stat-card { position: relative; overflow: hidden; padding: 16px 18px; transition: transform .35s var(--ease-spring), border-color .25s; }
  .stat-card::before { content: ""; position: absolute; top: -40%; right: -20%; width: 70%; height: 120%; pointer-events: none;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 14%, transparent), transparent 65%); }
  .stat-card:hover { transform: translateY(-3px); border-color: var(--border); }
  .stat-card-label { letter-spacing: .12em; font-size: .68rem; font-weight: 600; }
  .stat-card-value { font-size: 1.45rem; }

  /* ---- cards: depth, tilt, and a spotlight that follows the mouse ---- */
  .card { border-radius: 18px; background: var(--glass), var(--panel); border: 1px solid var(--border-soft);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), var(--lift);
    transition: transform .45s var(--ease-out), border-color .25s, box-shadow .35s; }
  /* perf: cards off-screen in long grids (catalog, hangar, market) skip layout and paint entirely */
  :is(.ac-grid, .auction-grid) > .card { content-visibility: auto; contain-intrinsic-size: auto 150px; }
  .card:hover { --ty: -5px; transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--ty));
    border-color: color-mix(in srgb, var(--rc, var(--accent)) 55%, transparent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 26px 50px -26px color-mix(in srgb, var(--rc, var(--accent)) 70%, #000); }
  .card.tilting { transition: transform .12s linear, border-color .25s, box-shadow .35s; }
  .card::before { border-top-width: 2px; opacity: 1; box-shadow: 0 -6px 18px -6px var(--rc, transparent); }
  .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .35s;
    background: radial-gradient(280px circle at var(--mx, 50%) var(--my, 0%), color-mix(in srgb, var(--rc, var(--accent)) 18%, transparent), transparent 62%); }
  .card:hover::after { opacity: 1; }
  .ac-card-name { font-size: 1.06rem; }
  .ac-rarity-pill { background: color-mix(in srgb, currentColor 12%, transparent); padding: 2px 9px; }
  .ac-cat-badge { background: rgba(255,255,255,.03); }
  .ac-price { font-size: 1.02rem; }
  .ac-card-actions .btn { border-radius: 9px; }

  /* ---- buttons ---- */
  .btn { position: relative; overflow: hidden; isolation: isolate; border-radius: 12px; border: 1px solid rgba(140,170,230,.2);
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)), var(--panel-2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 8px 18px -12px rgba(0,0,0,.9);
    transition: transform .25s var(--ease-spring), box-shadow .25s, border-color .2s, background-position .5s, filter .2s; }
  .btn:hover:not(:disabled) { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 12px 26px -14px var(--accent); }
  .btn:active:not(:disabled) { transform: translateY(0) scale(.96); transition-duration: .08s; }
  .btn:disabled { opacity: .42; filter: saturate(.4); box-shadow: none; }
  .btn.ghost { background: rgba(255,255,255,.02); }
  .btn.primary { color: #03101b; border-color: transparent; background-size: 180% 180%; background-position: 0% 50%;
    background-image: linear-gradient(130deg, color-mix(in srgb, var(--accent) 60%, #fff), var(--accent) 45%, color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 10px 26px -12px var(--accent); }
  .btn.primary:hover:not(:disabled) { background-position: 100% 50%; filter: brightness(1.07); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 14px 32px -12px var(--accent); }
  /* perf: the sheen moves with transform (it used to animate `left`, re-laying-out every primary button every frame) */
  .btn.primary::before { content: ""; position: absolute; top: 0; left: 0; width: 45%; height: 100%; z-index: -1; pointer-events: none;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-160%) skewX(-18deg); animation: ui2-sheen 5s ease-in-out infinite; }
  .btn.primary:disabled::before, .btn.primary.small::before { display: none; }
  @keyframes ui2-sheen { 0%, 62% { transform: translateX(-160%) skewX(-18deg); } 100% { transform: translateX(330%) skewX(-18deg); } }
  .btn.lg { border-radius: 14px; }
  .ripple { position: absolute; border-radius: 50%; pointer-events: none; z-index: 0; transform: scale(0); background: radial-gradient(circle, rgba(255,255,255,.5), rgba(255,255,255,.15) 60%, transparent 70%); animation: ui2-ripple .65s ease-out forwards; }
  @keyframes ui2-ripple { to { transform: scale(1); opacity: 0; } }

  /* ---- inputs ---- */
  .input { background: rgba(6,10,20,.72); border: 1px solid var(--border); border-radius: 12px; transition: border-color .2s, box-shadow .25s, background .2s; }
  .input:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); background: rgba(6,10,20,.9); }
  select.input option, select.input optgroup { background: #0b1222; color: var(--text); }
  input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

  function closeReveal(after) {
    var overlay = document.getElementById("reveal-overlay");
