<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e16; --bg-elevated: #0e1420; --panel: #131a28; --panel-2: #182034;
    --border: #232e46; --border-soft: #1a2338;
    --text: #e8edf8; --text-dim: #93a4c4; --text-faint: #5b6b8c;
    --accent: #4fd8ff; --accent-dim: #2a6b82; --credit: #ffb347;
    --danger: #ff5c5c; --success: #3ddc84; --radius: 10px;
    --font-display: 'Rajdhani', 'Segoe UI', sans-serif;
    --font-body: 'IBM Plex Sans', 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0; font-family: var(--font-body); color: var(--text);
    background: radial-gradient(ellipse 900px 500px at 15% -10%, rgba(79,216,255,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(255,179,71,0.05), transparent 55%), var(--bg);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; margin: 0 0 4px; }
  h1 { font-size: 1.9rem; } h2 { font-size: 1.4rem; }
  h3 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 12px; }
  p { line-height: 1.55; }
  .dim { color: var(--text-dim); } .dim.small { font-size: 0.82rem; margin-top: 6px; }
  button, input, select { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: rgba(79,216,255,0.3); }

  .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 16px; padding: 32px 28px; text-align: center; }
  .auth-logo { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: 0.03em; margin-bottom: 10px; }
  .auth-logo .mark { color: var(--accent); font-size: 1.7rem; line-height: 1; }
  .auth-sub { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 22px; line-height: 1.5; }
  .auth-field { margin-bottom: 18px; text-align: left; }
  .auth-field label { display: block; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 6px; }
  .auth-field input { width: 100%; }
  .auth-submit { width: 100%; }

  .hud-bar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 20px; padding: 10px 20px;
    background: rgba(10,14,22,0.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-soft); }
  .hud-logo { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.03em; white-space: nowrap; }
  .hud-logo .mark { color: var(--accent); font-size: 1.35rem; line-height: 1; }
  .hud-nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .hud-nav::-webkit-scrollbar { display: none; }
  .nav-link { font-family: var(--font-display); font-weight: 600; font-size: 0.92rem; text-decoration: none; color: var(--text-dim);
    padding: 8px 12px; border-radius: 7px; white-space: nowrap; transition: color .15s, background .15s; letter-spacing: 0.02em; cursor: pointer; background: none; border: none; }
  .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .nav-link.active { color: var(--accent); background: rgba(79,216,255,0.1); }
  .hud-stats { display: flex; align-items: center; gap: 16px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .hud-stat { text-align: right; line-height: 1.15; }
  .hud-stat .l { font-size: 0.62rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }
  .hud-stat .v { font-size: 0.95rem; font-weight: 600; }
  .hud-stat.credits .v { color: var(--credit); } .hud-stat.portfolio .v { color: var(--accent); }
  .hud-identity { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 8px 4px 4px; border-radius: 20px; border: 1px solid var(--border); background: var(--panel); }
  .hud-identity:hover { border-color: var(--accent-dim); }
  #hud-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--panel-2); font-family: var(--font-display); font-weight: 700; font-size: 0.75rem; color: var(--accent); }
  #hud-name { font-family: var(--font-display); font-weight: 600; font-size: 0.88rem; white-space: nowrap; }
  .sound-toggle { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel); color: var(--text-dim); cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: border-color .12s, color .12s; }
  .sound-toggle:hover { border-color: var(--accent-dim); color: var(--text); }
  .sound-toggle.muted { color: var(--text-faint); }
  .quick-toggle { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel); color: var(--text-dim); cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: border-color .12s, color .12s, background .12s; }
  .quick-toggle:hover { border-color: var(--accent-dim); color: var(--text); }
  .quick-toggle.active { color: var(--credit); border-color: var(--credit); background: rgba(255,179,71,0.12); }
  .auto-open-banner { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--panel); border: 1px solid var(--accent-dim); border-radius: 20px;
    padding: 8px 16px; display: none; align-items: center; gap: 10px; font-size: 0.82rem; box-shadow: 0 8px 24px -8px rgba(0,0,0,0.6); white-space: nowrap; }
  .auto-open-banner b { color: var(--accent); }
  .auto-open-banner button { font-family: var(--font-display); font-weight: 600; background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 14px; padding: 3px 10px; cursor: pointer; font-size: 0.78rem; }
  .auto-open-banner button:hover { color: var(--text); border-color: var(--danger); }
  .case-open-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 4px; }
  .bulk-results { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
  .bulk-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg-elevated); border-radius: 8px; border: 1px solid var(--border-soft); font-size: 0.85rem; }
  .bulk-row .bulk-name { flex: 1; font-family: var(--font-display); font-weight: 600; }
  .bulk-row .bulk-price { font-family: var(--font-mono); color: var(--credit); }
  .forge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .forge-path-card { text-align: center; }
  .forge-path-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .forge-arrow { font-family: var(--font-display); font-weight: 600; color: var(--text-dim); font-size: 0.85rem; }
  .forge-path-card .btn { width: 100%; margin-top: 6px; }
  .forge-merge { position: relative; height: 170px; width: 100%; max-width: 760px; }
  .forge-card { position: absolute; left: 50%; top: 0; width: 150px; margin-left: -75px; transform: translateX(var(--start-x)); transition: transform 1.1s cubic-bezier(.3,0,.2,1), opacity 1.1s ease-in, filter 1.1s; }
  .forge-merge.merging .forge-card { transform: translateX(0) scale(0.15); opacity: 0; filter: blur(3px) brightness(1.8); }
  @media (prefers-reduced-motion: reduce) { .forge-merge.merging .forge-card { transition: none; } }
  .wheel-wrap { position: relative; width: 320px; height: 320px; margin: 40px auto 20px; }
  .wheel-wrap.shake { animation: stage-shake 0.45s ease-in-out; }
  .wheel-glow-ring { position: absolute; inset: -18px; border-radius: 50%; z-index: 0;
    background: conic-gradient(from 0deg, #ffd700, #ff6ec7, #4fd8ff, #b571ff, #3ddc84, #ffd700); filter: blur(16px); opacity: 0.5; animation: wheel-ring-spin 7s linear infinite; }
  .wheel-wrap.spinning .wheel-glow-ring { opacity: 0.85; animation-duration: 1.4s; }
  @keyframes wheel-ring-spin { to { transform: rotate(360deg); } }
  .wheel-lights { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .wheel-light { position: absolute; top: 50%; left: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: #fff6da; box-shadow: 0 0 7px 2px rgba(255,210,110,0.85); animation: wheel-light-twinkle 1.5s ease-in-out infinite; }
  @keyframes wheel-light-twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.7) rotate(var(--a)) translate(152px) rotate(calc(var(--a) * -1)); } 50% { opacity: 1; transform: scale(1.2) rotate(var(--a)) translate(152px) rotate(calc(var(--a) * -1)); } }
  .wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid var(--panel-2); position: relative; z-index: 1;
    box-shadow: 0 0 36px -4px rgba(255,179,71,0.55), inset 0 0 26px rgba(0,0,0,0.55); transition: box-shadow 0.3s; }
  .wheel.spinning { box-shadow: 0 0 70px 10px rgba(255,179,71,0.85), inset 0 0 26px rgba(0,0,0,0.55); }
  .wheel.epic-win { animation: wheel-epic-pulse 0.9s ease-out; }
  @keyframes wheel-epic-pulse { 0% { box-shadow: 0 0 36px -4px rgba(255,179,71,0.55); } 40% { box-shadow: 0 0 80px 18px rgba(181,113,255,0.95); } 100% { box-shadow: 0 0 36px -4px rgba(255,179,71,0.55); } }
  .wheel-shine { position: absolute; inset: 0; border-radius: 50%; z-index: 2; pointer-events: none;
    background: radial-gradient(circle at 32% 24%, rgba(255,255,255,0.45), transparent 46%); mix-blend-mode: screen; }
  .wheel-hub { position: absolute; top: 50%; left: 50%; width: 58px; height: 58px; margin: -29px; border-radius: 50%; z-index: 3;
    background: radial-gradient(circle at 35% 28%, #fff7e0, #ffb347 55%, #c9790f); box-shadow: 0 0 20px rgba(255,179,71,0.75), inset 0 2px 5px rgba(255,255,255,0.7);
    display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
  .wheel-pointer-fixed { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 0; height: 0; z-index: 4;
    border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 24px solid #fff6da; filter: drop-shadow(0 0 8px rgba(255,210,110,0.9)); }
  .wheel-label { position: absolute; top: 50%; left: 50%; width: 94px; margin-left: -47px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 0.74rem; color: #05141c; text-shadow: 0 1px 2px rgba(255,255,255,0.35); }
  .wheel-label.epic { font-weight: 800; animation: wheel-epic-text 1.6s ease-in-out infinite; }
  @keyframes wheel-epic-text { 0%, 100% { text-shadow: 0 0 6px #fff, 0 0 12px #b571ff; } 50% { text-shadow: 0 0 16px #fff, 0 0 26px #ff6ec7; } }
  .wheel-action { text-align: center; margin-top: 16px; position: relative; z-index: 1; }
  .wheel-action .btn.primary.lg { background: linear-gradient(180deg, #ffd98a, #ffb347); border-color: #ffb347; color: #251400; box-shadow: 0 10px 26px -8px rgba(255,179,71,0.7); }
  .wheel-action .btn.primary.lg:hover { background: linear-gradient(180deg, #ffe3a3, #ffc166); }
  #wheel-cooldown { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
  .wheel-result { max-width: 360px; margin: 22px auto 0; text-align: center; padding: 16px 20px; border-radius: var(--radius);
    background: linear-gradient(180deg, var(--panel), var(--panel-2)); border: 1px solid var(--rc, var(--border)); box-shadow: 0 0 28px -8px var(--rc, transparent);
    opacity: 0; transform: translateY(8px) scale(0.96); transition: opacity 0.35s ease-out, transform 0.35s ease-out; }
  .wheel-result.show { opacity: 1; transform: translateY(0) scale(1); }
  .wheel-result .wr-label { font-family: var(--font-display); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--rc, var(--text-dim)); margin-bottom: 4px; }
  .wheel-result .wr-main { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; }
  .wheel-result .wr-sub { color: var(--text-dim); font-size: 0.82rem; margin-top: 2px; }
  .battle-lobby-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--bg-elevated); border-radius: 8px; border: 1px solid var(--border-soft); margin-bottom: 8px; }
  .battle-lobby-row:last-child { margin-bottom: 0; }
  .battle-lobby-info { flex: 1; font-size: 0.88rem; }
  .battle-arena { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 16px; }
  .battle-col { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 14px; }
  .battle-col-header { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-display); font-weight: 700; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border-soft); }
  .battle-col-header.you { color: var(--accent); } .battle-col-header.them { color: var(--text-dim); }
  .battle-total { font-family: var(--font-mono); color: var(--credit); }
  .battle-vs { align-self: center; font-family: var(--font-display); font-weight: 700; color: var(--text-faint); font-size: 1.1rem; padding-top: 60px; }
  .battle-items { display: flex; flex-direction: column; gap: 6px; max-height: 520px; overflow-y: auto; }
  .battle-item-card { border: 1px solid var(--rc, var(--border)); border-radius: 8px; padding: 8px 10px; background: var(--bg-elevated); font-size: 0.82rem; animation: battle-card-in .3s ease-out; }
  .battle-item-card.empty { border-style: dashed; border-color: var(--border-soft); min-height: 46px; opacity: 0.4; }
  .battle-item-card.special { box-shadow: 0 0 14px -2px var(--rc); }
  @keyframes battle-card-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .b-rarity { font-family: var(--font-display); font-weight: 600; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .b-name { font-family: var(--font-display); font-weight: 600; }
  .b-livery { margin-top: 2px; } .b-price { font-family: var(--font-mono); color: var(--credit); font-size: 0.78rem; margin-top: 2px; }
  .battle-result-banner { text-align: center; padding: 24px; }
  .battle-result-banner.win { border-color: var(--success); } .battle-result-banner.lose { border-color: var(--danger); }
  .tourney-panel { margin-top: 16px; border-color: var(--credit); }
  .tourney-panel.locked { border-color: var(--border-soft); opacity: 0.88; }
  .tourney-progress { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .tourney-progress-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 6px 10px; background: var(--bg-elevated); border-radius: 7px; }
  .tourney-progress-row b { font-family: var(--font-mono); color: var(--accent); }
  .tourney-steps { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tourney-step { font-family: var(--font-display); font-weight: 600; font-size: 0.82rem; color: var(--text-faint); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); }
  .tourney-step.active { color: var(--accent); border-color: var(--accent-dim); background: rgba(79,216,255,0.1); }
  .tourney-step.done { color: var(--success); border-color: var(--success); }
  .tourney-step-arrow { color: var(--text-faint); }
  @media (max-width: 640px) { .battle-arena { flex-direction: column; } .battle-vs { padding-top: 0; } }
  .admin-toggle { position: fixed; left: 14px; bottom: 14px; z-index: 50; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--panel); color: var(--text-faint); cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; justify-content: center;
    opacity: 0.5; transition: opacity .15s, border-color .15s, color .15s; }
  .admin-toggle:hover { opacity: 1; border-color: var(--accent-dim); color: var(--text); }
  .admin-toggle.unlocked { color: var(--credit); border-color: var(--credit); opacity: 0.8; }
  .admin-case-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border-soft); }
  .admin-case-row:last-child { border-bottom: none; }
  .admin-case-row .name { font-family: var(--font-display); font-weight: 600; min-width: 170px; flex: 1; }

  .legacy-section { margin-top: 44px; }
  .legacy-heading { text-align: center; font-family: var(--font-display); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 1.05rem; margin-bottom: 18px;
    background: linear-gradient(90deg, #ffd700, #ff6ec7, #4fd8ff, #b571ff, #ffd700); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: legacy-heading-shift 5s linear infinite; }
  @keyframes legacy-heading-shift { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
  .legacy-card { position: relative; display: flex; gap: 22px; align-items: center; border-radius: var(--radius); padding: 22px 26px; background: linear-gradient(180deg, var(--panel), var(--panel-2)); overflow: hidden; z-index: 0; }
  .legacy-card.live { border: 2px solid transparent; z-index: 0; animation: legacy-glow 2.6s ease-in-out infinite;
    background: linear-gradient(180deg, var(--panel), var(--panel-2)) padding-box,
      linear-gradient(90deg, #ffd700, #ff6ec7, #4fd8ff, #b571ff, #3ddc84, #ffd700) border-box;
    background-size: auto, 300% 300%; animation: legacy-glow 2.6s ease-in-out infinite, legacy-border-shift 4s linear infinite; }
  @keyframes legacy-border-shift { 0% { background-position: 0% 0%, 0% 50%; } 100% { background-position: 0% 0%, 300% 50%; } }
  @keyframes legacy-glow { 0%, 100% { box-shadow: 0 0 24px -4px rgba(255,179,71,0.45); } 50% { box-shadow: 0 0 46px 6px rgba(181,113,255,0.55); } }
  .legacy-card.dormant { border: 1px dashed var(--border-soft); opacity: 0.75; justify-content: center; text-align: center; }
  .legacy-spark { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px 2px rgba(255,215,0,0.9); opacity: 0; animation: legacy-twinkle 2.4s ease-in-out infinite; pointer-events: none; }
  @keyframes legacy-twinkle { 0%, 100% { opacity: 0; transform: scale(0.4); } 50% { opacity: 1; transform: scale(1.1); } }
  .legacy-reel { width: 220px; height: 118px; flex-shrink: 0; border-radius: 10px; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at center, rgba(255,179,71,0.16), transparent 72%); border: 1px solid rgba(255,179,71,0.3); }
  .legacy-reel::before, .legacy-reel::after { content: ''; position: absolute; top: 0; bottom: 0; width: 24px; z-index: 2; pointer-events: none; }
  .legacy-reel::before { left: 0; background: linear-gradient(90deg, var(--panel), transparent); }
  .legacy-reel::after { right: 0; background: linear-gradient(-90deg, var(--panel), transparent); }
  .legacy-reel-track { display: flex; gap: 8px; position: absolute; top: 50%; left: 0; transform: translateY(-50%); animation: legacy-reel-scroll 16s linear infinite; white-space: nowrap; }
  .legacy-reel-card { flex-shrink: 0; width: 86px; padding: 8px 6px; border-radius: 8px; border: 1px solid var(--rc); background: var(--panel-2); text-align: center; box-shadow: 0 0 10px -4px var(--rc); }
  .legacy-reel-name { font-family: var(--font-display); font-weight: 600; font-size: 0.66rem; line-height: 1.2; white-space: normal; }
  .legacy-reel-sub { font-family: var(--font-mono); font-size: 0.6rem; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.04em; }
  @keyframes legacy-reel-scroll { from { transform: translateY(-50%) translateX(0); } to { transform: translateY(-50%) translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .legacy-reel-track { animation: none; } }
  .legacy-info { flex: 1; min-width: 0; }
  .legacy-info h2 { font-family: var(--font-display); margin: 4px 0 6px; font-size: 1.3rem; }
  .legacy-tag { display: inline-block; font-family: var(--font-display); font-weight: 700; font-size: 0.68rem; letter-spacing: 0.08em; color: #ffb347; border: 1px solid #ffb347; border-radius: 20px; padding: 3px 10px; }
  .legacy-tag.dim { color: var(--text-faint); border-color: var(--border-soft); }
  .legacy-countdown-row { margin: 10px 0 14px; font-family: var(--font-mono); font-size: 0.95rem; color: var(--text-dim); }
  .legacy-countdown-row span { color: var(--credit); font-weight: 600; }
  .legacy-countdown-row.big { font-size: 1.4rem; margin: 14px 0; }

    if (tier < 0.50) return Math.round(20000 * Math.pow(60, Math.random()));        // modest: ~20k-1.2M
    if (tier < 0.82) return Math.round(500000 * Math.pow(40, Math.random()));       // solid: ~500k-20M
    if (tier < 0.95) return Math.round(10000000 * Math.pow(30, Math.random()));     // big: ~10M-300M
    return Math.round(200000000 * Math.pow(25, Math.random()));                    // whale: ~200M-5B
  }
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  /* ---------- utils ----------*/
  function fmtCr(n) { n = Math.round(n || 0); return "¢" + n.toLocaleString("en-US"); }
  function fmtPct(n) { if (n === null || n === undefined || !isFinite(n)) return null; return (n >= 0 ? "+" : "") + n.toFixed(2) + "%"; }
  function genId() { return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10); }
  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function withArticle(word) { return (/^[aeiou]/i.test(word) ? "an " : "a ") + word; }
  function shadeColor(hex, pct) {
    var m = /^#([0-9a-f]{6})$/i.exec(hex);
    if (!m) return hex;
    var num = parseInt(m[1], 16);
    var r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
    var adjust = function (c) { return Math.max(0, Math.min(255, Math.round(c + (pct / 100) * 255))); };
    r = adjust(r); g = adjust(g); b = adjust(b);
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  function timeAgo(ms) {
    var s = Math.max(1, Math.floor((Date.now() - ms) / 1000));
    if (s < 60) return s + "s ago";
    var m = Math.floor(s / 60); if (m < 60) return m + "m ago";
    var h = Math.floor(m / 60); if (h < 24) return h + "h ago";
    var d = Math.floor(h / 24); return d + "d ago";
  }
  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
  function rarityMeta(r) { return D.RARITY_META[r] || D.RARITY_META.common; }
  function catMeta(c) { return D.CATEGORY_META[c] || { label: c, icon: "??" }; }
  function toast(msg, kind) {
    if (kind === "bad") sfx.bad();
    var el = document.createElement("div");
    el.className = "toast " + (kind || "");
    el.textContent = msg;
    $toasts.appendChild(el);
    requestAnimationFrame(function () { el.classList.add("show"); });
    setTimeout(function () { el.classList.remove("show"); setTimeout(function () { el.remove(); }, 300); }, 3600);
  }
  function pickBotName() { return BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)]; }

  function priceDoc(aircraftId) { return state.prices[aircraftId]; }
  function currentPrice(aircraftId) {
    var p = priceDoc(aircraftId);
    if (p && typeof p.current === "number") return p.current;
    var a = D.CATALOG_BY_ID[aircraftId];
    return a ? a.base : 0;
  }
  function isLivePrice(aircraftId) { var p = priceDoc(aircraftId); return !!(p && typeof p.current === "number"); }
  function change24h(aircraftId) {
    var p = priceDoc(aircraftId);
    if (!p || !p.history || !p.history.length) return null;
    var cutoff = Date.now() - 24 * 3600 * 1000, base = null;
    for (var i = p.history.length - 1; i >= 0; i--) { if (p.history[i].t <= cutoff) { base = p.history[i].price; break; } }
    if (base === null || base === 0) return null;
    return ((p.current - base) / base) * 100;
  }
  function portfolioValue() { return computePortfolioValueFrom(state.credits, state.inventory); }
  function computePortfolioValueFrom(credits, items) {
    var v = credits || 0;
    items.forEach(function (it) { if (!it.listed) v += itemValue(it); });
    return v;
  }
  function unrealizedPL() {
    var pl = 0;
    state.inventory.forEach(function (it) { if (!it.listed) pl += itemValue(it) - (it.cost || 0); });
    return pl;
  }
  function quickSellPrice(aircraftId) { return Math.round(currentPrice(aircraftId) * QUICK_SELL_FACTOR); }
  // A livery is a value-only bonus layered on top of a specific owned/listed
  // instance of an aircraft — the catalog entry itself never changes.
  function valueWithLivery(aircraftId, livery) {
    var base = currentPrice(aircraftId);
    return livery ? Math.round(base * (1 + livery.valuePct / 100)) : base;
  }
  function itemValue(item) { return valueWithLivery(item.aircraftId, item.livery); }
  function quickSellPriceForItem(item) { return Math.round(itemValue(item) * QUICK_SELL_FACTOR); }
  function liveryBadge(livery) { return livery ? '<span class="livery-badge">' + esc(livery.name) + ' <span class="up">+' + livery.valuePct + '%</span></span>' : ""; }

  /* ---------- simulated market engine ---------- */
  function stepAircraftPrice(id) {
    var a = D.CATALOG_BY_ID[id];
    if (!a) return;
    var p = state.prices[id];
    if (!p) p = state.prices[id] = { mult: 1, current: a.base, history: [], minted: 0 };
    var reversion = (1 - p.mult) * 0.05;
    var shock = (Math.random() - 0.5) * 0.16;
    p.mult = clamp(p.mult + shock + reversion, 0.3, 3.2);
    p.current = Math.max(1, Math.round(a.base * p.mult));
    p.history.push({ t: Date.now(), price: p.current });
    if (p.history.length > 180) p.history = p.history.slice(p.history.length - 180);
  }
  // Bots list common aircraft constantly and rarer tiers progressively less
  // often — flat odds across the whole catalog made an Ultra just as likely
  // to turn up for sale as a common Cessna, which is why they felt common.
  // Divine stays excluded entirely; it's never listed by a bot at all.
  var BOT_LISTING_RARITY_WEIGHTS = { common: 40, uncommon: 25, rare: 15, epic: 10, legendary: 5, mythic: 2, ultra: 0.4 };
  var BOT_LISTING_LEGACY_WEIGHT = 1.2; // rarer than Mythic, but an actual, findable chance — not a lottery
  function spawnBotListingInto(s) {
    var pool = D.CATALOG.filter(function (c) { return c.rarity !== "divine"; });
    var byRarity = {};
    pool.forEach(function (c) { (byRarity[c.rarity] = byRarity[c.rarity] || []).push(c); });
    var total = 0;
    for (var r in BOT_LISTING_RARITY_WEIGHTS) { if (byRarity[r] && byRarity[r].length) total += BOT_LISTING_RARITY_WEIGHTS[r]; }
    var legacyPool = D.LEGACY_CATALOG || [];
    if (legacyPool.length) total += BOT_LISTING_LEGACY_WEIGHT;
    var roll = Math.random() * total, acc = 0, chosenRarity = null, isLegacyPick = false;
    for (var r2 in BOT_LISTING_RARITY_WEIGHTS) {
      if (!byRarity[r2] || !byRarity[r2].length) continue;
      acc += BOT_LISTING_RARITY_WEIGHTS[r2];
      if (roll <= acc) { chosenRarity = r2; break; }
    }
    if (!chosenRarity && legacyPool.length) { acc += BOT_LISTING_LEGACY_WEIGHT; if (roll <= acc) isLegacyPick = true; }
    var a;
    if (isLegacyPick) {
      a = legacyPool[Math.floor(Math.random() * legacyPool.length)];
    } else {
      var rarityPool = (chosenRarity && byRarity[chosenRarity]) || pool;
      a = rarityPool[Math.floor(Math.random() * rarityPool.length)];
    }
    var livery = D.rollLivery(a.id);
    var liveryMult = livery ? 1 + livery.valuePct / 100 : 1;
    var ref = ((s.prices[a.id] && s.prices[a.id].current) || a.base) * liveryMult;
    var price = Math.max(1, Math.round(ref * (0.82 + Math.random() * 0.38)));
    s.listings.push({ id: genId(), aircraftId: a.id, price: price, sellerName: pickBotName(), listedAt: Date.now(), mine: false, livery: livery });
  }
  function spawnBattleInto(s) {
    var caseDef = D.CASES[Math.floor(Math.random() * D.CASES.length)];
    var count = 2 + Math.floor(Math.random() * 9);
    s.openBattles.push({ id: genId(), caseId: caseDef.id, count: count, botName: pickBotName(), createdAt: Date.now() });
  }
  function pushActivity(ev) {
    state.activity.push(ev);
    if (state.activity.length > 40) state.activity = state.activity.slice(state.activity.length - 40);
  }
  function pushLedger(ev) {
    state.ledger.push(ev);
    if (state.ledger.length > 300) state.ledger = state.ledger.slice(state.ledger.length - 300);
  }
  function snapshotHistory() {
    state.portfolioHistory.push({ t: Date.now(), value: Math.round(portfolioValue()) });
    if (state.portfolioHistory.length > 400) state.portfolioHistory = state.portfolioHistory.slice(state.portfolioHistory.length - 400);
  }
  function applyFlip(pl, name) {
    state.realizedPL += pl;
    if (!state.bestFlip || pl > state.bestFlip.amount) state.bestFlip = { amount: pl, name: name, t: Date.now() };
    if (!state.worstFlip || pl < state.worstFlip.amount) state.worstFlip = { amount: pl, name: name, t: Date.now() };
  }

  function runTick(live) {
    var sampleSize = 6 + Math.floor(Math.random() * 10);
    for (var i = 0; i < sampleSize; i++) {
      var a = D.CATALOG[Math.floor(Math.random() * D.CATALOG.length)];
      stepAircraftPrice(a.id);
    }
    // Legacy aircraft aren't in D.CATALOG (so they can never leak into normal
    // cases/the golden wheel), but their market price still needs to drift
    // like everything else's — sampled separately, at a lighter touch since
    // the pool is tiny.
    var legacySampleSize = 1 + Math.floor(Math.random() * 2);
    for (var li = 0; li < legacySampleSize; li++) {
      var la = D.LEGACY_CATALOG[Math.floor(Math.random() * D.LEGACY_CATALOG.length)];
      stepAircraftPrice(la.id);
    }
    var botCount = state.listings.filter(function (l) { return !l.mine; }).length;
    if (Math.random() < 0.55 && botCount < 70) spawnBotListingInto(state);
    if (Math.random() < 0.55 && botCount < 70) spawnBotListingInto(state);
    if (Math.random() < 0.25 && state.openBattles.length < 10) spawnBattleInto(state);
    if (Math.random() < 0.15 && state.openBattles.length > 3) state.openBattles.splice(Math.floor(Math.random() * state.openBattles.length), 1);
    if (Math.random() < 0.18 && botCount > 20) {
      var botIdx = [];
      state.listings.forEach(function (l, idx) { if (!l.mine) botIdx.push(idx); });
      if (botIdx.length) {
        var rm = botIdx[Math.floor(Math.random() * botIdx.length)];
        var removed = state.listings[rm];
        state.listings.splice(rm, 1);
        pushActivity({ type: "trade", aircraftId: removed.aircraftId, price: removed.price, t: Date.now() });
      }
    }
    var mine = state.inventory.filter(function (it) { return it.listed; });
    mine.forEach(function (item) {
      if (Math.random() < botBuyChance(item)) botBuysPlayerListing(item, live);
    });
    state.leaderboardBots.forEach(function (b) {
      b.value = Math.max(1000, Math.round(b.value * (1 + (Math.random() - 0.49) * 0.07)));
      if (Math.random() < 0.004) b.value = Math.round(b.value * (1.5 + Math.random() * 3)); // a rival hit a big pull or battle win
    });
    if (Math.random() < 0.45) {
      var who = pickBotName();
      var rarityRoll = Math.random();
      var rarity = rarityRoll > 0.998 ? "mythic" : rarityRoll > 0.99 ? "legendary" : rarityRoll > 0.94 ? "epic" : rarityRoll > 0.8 ? "rare" : rarityRoll > 0.5 ? "uncommon" : "common";
      var pool = D.CATALOG.filter(function (a) { return a.rarity === rarity; });
      if (pool.length) {
        var pick = pool[Math.floor(Math.random() * pool.length)];
        pushActivity({ type: "unlock", aircraftId: pick.id, rarity: pick.rarity, who: who, t: Date.now() });
      }
    }
    state.lastTick = Date.now();
  }

  // Bots buy near-market listings readily, but a listing priced far above
  // fair market value gets exponentially less likely to sell — this is what
  // keeps someone from listing an item for billions/trillions and having a
  // bot snap it up anyway (reported by players testing the marketplace).
  function botBuyChance(item) {
    var a = D.CATALOG_BY_ID[item.aircraftId];
    if (!a) return 0;
    var listing = state.listings.find(function (l) { return l.instanceId === item.instanceId; });
    if (!listing) return 0;
    var market = valueWithLivery(a.id, listing.livery) || a.base || 1;
    var ratio = listing.price / market;
    var excess = Math.max(0, ratio - 1);
    return 0.12 * Math.exp(-2 * excess);
  }
  function botBuysPlayerListing(item, live) {
    var idx = state.listings.findIndex(function (l) { return l.instanceId === item.instanceId; });
    if (idx === -1) return;
    var listing = state.listings[idx];
    var a = D.CATALOG_BY_ID[item.aircraftId];
    if (!a) return;
    state.listings.splice(idx, 1);
    state.inventory = state.inventory.filter(function (i) { return i.instanceId !== item.instanceId; });
    var pl = listing.price - (item.cost || 0);
    state.credits += listing.price;
    state.totalEarned += listing.price;
    applyFlip(pl, a.name);
    pushLedger({ t: Date.now(), type: "sell", aircraftId: a.id, amount: listing.price, cost: item.cost || 0, pl: pl, rarity: a.rarity });
    var p = state.prices[a.id] || (state.prices[a.id] = { mult: 1, current: a.base, history: [], minted: 0 });
    p.current = listing.price; p.mult = listing.price / a.base;
    p.history.push({ t: Date.now(), price: listing.price });
    pushActivity({ type: "trade", aircraftId: a.id, price: listing.price, t: Date.now() });
    snapshotHistory();
    if (live) toast(pickBotName() + " bought your " + a.name + " for " + fmtCr(listing.price) + "!", "good");
  }

  function catchUp() {
    var elapsed = Date.now() - (state.lastTick || Date.now());
    var ticks = Math.min(140, Math.floor(elapsed / TICK_MS));
    for (var i = 0; i < ticks; i++) runTick(false);
    state.lastTick = Date.now();
  }

  var tickTimer = null;
  function startTicking() {
    if (tickTimer) clearInterval(tickTimer);
    tickTimer = setInterval(function () {
      runTick(true);
      save();
      updateHud();
      renderTicker();
      var r = route();
      if (r.name === "market" || r.name === "leaderboard" || (r.name === "aircraft")) render();
    }, TICK_MS);
  }

  /* ---------- routing ---------- */
  function route() {
    var h = location.hash.replace(/^#\/?/, "");
    var parts = h.split("/").filter(Boolean);
    return { name: parts[0] || "catalog", param: parts[1] || null };
  }
  window.addEventListener("hashchange", render);

  /* ---------- boot ---------- */
  function initAuthScreen() {
    document.getElementById("auth-form").onsubmit = function (e) {
      e.preventDefault();
      var name = document.getElementById("auth-callsign").value.trim().slice(0, 24) || "Pilot";
      state = freshState(name);
      save();
      enterGame();
    };
  }
  function enterGame() {
    document.getElementById("auth-screen").style.display = "none";
    document.getElementById("game-root").style.display = "block";
    catchUp();
    save();
    startTicking();
    updateHud();
    updateSoundToggle();
    updateQuickToggle();
    updateAdminButton();
    renderTicker();
    ready = true;
    render();
    checkLegacyCaseNotification();
  }
  // Heals a loaded save against any shape it might be missing fields from —
  // an interrupted write, an earlier version of this file, manual editing,
  // whatever. Anything structurally missing or empty is topped back up from
  // a freshly generated state rather than left blank, so the marketplace and
  // leaderboard can never silently end up empty.
  function normalizeState(raw) {
    var template = freshState((raw && raw.callsign) || "Pilot");
    if (!raw) return template;
    var s = Object.assign({}, template, raw);
    if (!Array.isArray(s.listings) || !s.listings.length) s.listings = template.listings;
    if (!Array.isArray(s.leaderboardBots) || s.leaderboardBots.length < 5) s.leaderboardBots = template.leaderboardBots;
    // One-time leaderboard rebalance for saves from before whale bots existed —
    // after this, bot values keep drifting under their own steam, untouched.
    if (s.leaderboardVersion !== LEADERBOARD_VERSION) { s.leaderboardBots = template.leaderboardBots; s.leaderboardVersion = LEADERBOARD_VERSION; }
    if (!s.prices || typeof s.prices !== "object") s.prices = template.prices;
    if (!Array.isArray(s.inventory)) s.inventory = [];
    if (!Array.isArray(s.ledger)) s.ledger = [];
    if (!Array.isArray(s.activity)) s.activity = [];
    if (!Array.isArray(s.portfolioHistory) || !s.portfolioHistory.length) s.portfolioHistory = template.portfolioHistory;
    if (typeof s.credits !== "number" || isNaN(s.credits)) s.credits = template.credits;
    if (typeof s.totalSpent !== "number" || isNaN(s.totalSpent)) s.totalSpent = 0;
    if (typeof s.totalEarned !== "number" || isNaN(s.totalEarned)) s.totalEarned = 0;
    if (typeof s.realizedPL !== "number" || isNaN(s.realizedPL)) s.realizedPL = 0;
    if (typeof s.lastTick !== "number" || isNaN(s.lastTick)) s.lastTick = Date.now();
    if (!Array.isArray(s.openBattles)) s.openBattles = template.openBattles;
    if (!s.battleStats || typeof s.battleStats !== "object") s.battleStats = template.battleStats;
    if (typeof s.battleStats.legendaryWinsSinceTournament !== "number") s.battleStats.legendaryWinsSinceTournament = 0;
    if (typeof s.battleStats.tournamentsWon !== "number") s.battleStats.tournamentsWon = 0;
    if (typeof s.lastDailySpin !== "number") s.lastDailySpin = 0;
    if (typeof s.lastSeenLegacyCycleIdx !== "number") s.lastSeenLegacyCycleIdx = -1;
    delete s.onlineSim;
    return s;
  }
  function boot() {
    initAuthScreen();
    var existing = load();
    if (existing && existing.callsign) {
      state = normalizeState(existing);
      save();
      enterGame();
    }
  }

  function updateHud() {
    if (!state) return;
    if ($hudCredits) $hudCredits.textContent = fmtCr(state.credits);
    if ($hudPortfolio) $hudPortfolio.textContent = fmtCr(portfolioValue());
    if ($hudName) $hudName.textContent = state.callsign || "Pilot";
    if ($hudAvatar) $hudAvatar.textContent = (state.callsign.trim()[0] || "?").toUpperCase();
  }
  function renderTicker() {
    if (!$ticker) return;
    if (!state.activity.length) { $ticker.innerHTML = '<span class="tick-item dim">Quiet skies so far — open a case or list something.</span>'; return; }
    var items = state.activity.slice().reverse().slice(0, 20).map(function (ev) {
      var a = D.CATALOG_BY_ID[ev.aircraftId];
      var name = a ? a.name : "Unknown aircraft";
      if (ev.type === "trade") return '<span class="tick-item"><b>' + esc(name) + "</b> sold for " + fmtCr(ev.price) + "</span>";
      var rm = rarityMeta(ev.rarity);
      return '<span class="tick-item" style="color:' + rm.color + '">★ ' + esc(ev.who || "A pilot") + " unlocked " + rm.label.toUpperCase() + " <b>" + esc(name) + "</b></span>";
    }).join('<span class="tick-sep">&middot;</span>');
    $ticker.innerHTML = items + items;
  }

  /* ---------- case opening ---------- */
  var RARITY_INTENSITY = { common: 0, uncommon: 0, rare: 1, epic: 2, legendary: 3, mythic: 4, ultra: 5, divine: 6 };

  // Grants a specific aircraft from a case into the player's inventory.
  // ledgerAmount is what the ledger/item.cost should show (0 for admin/bulk
  // grants that were already paid for elsewhere, -price otherwise).
  function grantCaseItem(caseDef, won, ledgerAmount, sourceSuffix) {
    var item = { instanceId: genId(), aircraftId: won.id, acquiredAt: Date.now(), source: "case:" + caseDef.id + (sourceSuffix || ""), listed: false, cost: ledgerAmount < 0 ? -ledgerAmount : 0, livery: D.rollLivery(won.id) };
    state.inventory.push(item);
    var p = state.prices[won.id] || (state.prices[won.id] = { mult: 1, current: null, history: [], minted: 0 });
    p.minted = (p.minted || 0) + 1;
    pushActivity({ type: "unlock", aircraftId: won.id, rarity: won.rarity, who: state.callsign, t: Date.now() });
    pushLedger({ t: Date.now(), type: "case", aircraftId: won.id, amount: ledgerAmount, rarity: won.rarity });
    snapshotHistory();
    return item;
  }

  // free: skip the credit cost (used by the admin panel / bulk-open, which
  // already charged a lump sum up front). forcedWon: skip the normal odds
  // roll and use this exact aircraft (or {special:"golden"}) instead — an
  // admin-panel power. onDone: called once the player has fully resolved the
  // result (Keep/List/Quicksell) — used to chain auto-open and bulk-open.
  function openCaseFlow(caseDef, free, forcedWon, onDone) {
    if (!free && state.credits < caseDef.price) { toast("Not enough credits for the " + caseDef.name + ".", "bad"); return; }
    var won = forcedWon || D.openCase(caseDef);
    if (!won) { toast("That case has nothing left to pull from.", "bad"); return; }
    sfx.caseOpen();
    if (!free) { state.credits -= caseDef.price; state.totalSpent += caseDef.price; }
    if (won.special === "golden") {
      save(); updateHud(); renderTicker();
      runRevealSequence(caseDef, won, null, free, onDone);
      return;
    }
    var item = grantCaseItem(caseDef, won, free ? 0 : -caseDef.price);
    save(); updateHud(); renderTicker();
    runRevealSequence(caseDef, won, item, free, onDone);
  }

  function runRevealSequence(caseDef, won, item, free, onDone) {
    if (won.special === "golden") { runGoldenSequence(caseDef, free, onDone); return; }
    var instant = reduceMotion || quickMode;
    var overlay = document.getElementById("reveal-overlay");
    overlay.classList.add("active");
    var rm = rarityMeta(won.rarity);
    var pool = D.casePool(caseDef);
    if (!pool.length) pool = D.CATALOG;
    var reelLen = instant ? 1 : 48;
    var targetIndex = reelLen - 4;
    var strip = [];
    for (var i = 0; i < reelLen; i++) strip.push(i === targetIndex ? won : pool[Math.floor(Math.random() * pool.length)]);

    overlay.innerHTML =
      '<div class="reveal-stage"><div class="reveal-caselabel">' + esc(caseDef.name) + '</div>' +
      '<div class="reel-viewport"><div class="reel-pointer"></div><div class="reel-strip" id="reel-strip"></div></div>' +
      '<canvas id="fx-canvas" class="fx-canvas"></canvas><div class="reveal-result" id="reveal-result" style="display:none"></div></div>';

    var $strip = document.getElementById("reel-strip");
    var cardW = 176;
    $strip.style.width = (strip.length * cardW) + "px";
    $strip.innerHTML = strip.map(function (a) {
      var m = rarityMeta(a.rarity);
      return '<div class="reel-card" style="--rc:' + m.color + '"><div class="reel-card-cat">' + catMeta(a.cat).icon + '</div>' +
        '<div class="reel-card-name">' + esc(a.name) + '</div><div class="reel-card-rarity" style="color:' + m.color + '">' + m.label + "</div></div>";
    }).join("");

    var viewport = overlay.querySelector(".reel-viewport");
    var vw = viewport.clientWidth;
    var finalOffset = (targetIndex * cardW) + (cardW / 2) - (vw / 2);

    if (instant) { $strip.style.transform = "translateX(-" + finalOffset + "px)"; finishReveal(); }
    else {
      requestAnimationFrame(function () {
        $strip.style.transition = "transform 4.4s cubic-bezier(.12,.72,.1,1)";
        $strip.style.transform = "translateX(-" + finalOffset + "px)";
      });
      sfx.reelSpin(4.4);
      setTimeout(finishReveal, 4500);
    }

    function finishReveal() {
      var cards = $strip.querySelectorAll(".reel-card");
      if (cards[targetIndex]) cards[targetIndex].classList.add("landed");
      var intensity = RARITY_INTENSITY[won.rarity] || 0;
      var isDivine = won.rarity === "divine";
      sfx.reveal(isDivine ? "ultra" : won.rarity);
      if (isDivine) sfx.divineReveal();
      if (intensity >= 2 && !reduceMotion) { overlay.classList.add("flash-" + won.rarity); runParticles(document.getElementById("fx-canvas"), rm.color, intensity); }
      if (intensity >= 3 && !reduceMotion) { var stage = overlay.querySelector(".reveal-stage"); if (stage) stage.classList.add(isDivine ? "shake-divine" : "shake"); }
      setTimeout(showResultCard, intensity >= 2 ? 650 : 150);
    }
    function showResultCard() {
      var $res = document.getElementById("reveal-result");
      var intensity = RARITY_INTENSITY[won.rarity] || 0;
      var raysHtml = (intensity >= 3 && !reduceMotion) ? '<div class="result-rays" style="--rc:' + rm.color + '"></div>' : "";
      var liveryHtml = item.livery ? '<div class="result-livery">' + liveryBadge(item.livery) + '</div>' : "";
      $res.style.display = "flex";
      $res.innerHTML =
        '<div class="result-card" style="--rc:' + rm.color + ';--rg:' + rm.glow + '">' + raysHtml +
        '<div class="result-rarity" style="color:' + rm.color + '">' + rm.label.toUpperCase() + "</div>" +
        '<div class="result-name">' + esc(won.name) + '</div><div class="result-mfr">' + esc(won.mfr) + "</div>" + liveryHtml +
        '<div class="result-price">' + fmtCr(itemValue(item)) + '</div>' +
        '<div class="result-actions"><button class="btn ghost" id="res-keep">Keep</button>' +
        '<button class="btn ghost" id="res-list">List for sale</button>' +
        '<button class="btn primary" id="res-quicksell">Quick sell &mdash; ' + fmtCr(quickSellPriceForItem(item)) + "</button></div></div>";
      requestAnimationFrame(function () { $res.classList.add("show"); });
      document.getElementById("res-keep").onclick = function () { closeOverlay(); toast("Added " + won.name + " to your hangar.", "good"); };
      document.getElementById("res-list").onclick = function () { closeOverlay(); openSellModal(item, won); };
      document.getElementById("res-quicksell").onclick = function () { closeOverlay(); sellItemInstant(item, won); };
    }
    function closeOverlay() { overlay.classList.remove("active", "flash-legendary", "flash-mythic", "flash-ultra", "flash-golden", "flash-divine"); overlay.innerHTML = ""; if (onDone) onDone(); }
  }

  // The golden bonus wheel: landing the "???" slot in a normal case pulls up a
  // second, all-gold reel spun from every Ultra aircraft plus the two Divine
  // aircraft — the only way Divine aircraft can ever be won.
  function runGoldenSequence(caseDef, free, onDone) {
    var instant = reduceMotion || quickMode;
    var overlay = document.getElementById("reveal-overlay");
    overlay.classList.add("active");
    var cardW = 176;
    var decoyPool = D.CATALOG.filter(function (a) { return a.rarity === "epic" || a.rarity === "legendary" || a.rarity === "mythic" || a.rarity === "ultra"; });
    if (!decoyPool.length) decoyPool = D.CATALOG;
    var reelLen = instant ? 1 : 40;
    var targetIndex = reelLen - 4;
    var strip = [];
    for (var i = 0; i < reelLen; i++) strip.push(i === targetIndex ? "GOLD" : decoyPool[Math.floor(Math.random() * decoyPool.length)]);

    overlay.innerHTML =
      '<div class="reveal-stage"><div class="reveal-caselabel" style="color:#ffd700">A golden pull is forming&hellip;</div>' +
      '<div class="reel-viewport"><div class="reel-pointer"></div><div class="reel-strip" id="reel-strip"></div></div>' +
      '<canvas id="fx-canvas" class="fx-canvas"></canvas><div class="reveal-result" id="reveal-result" style="display:none"></div></div>';

    var $strip = document.getElementById("reel-strip");
    $strip.style.width = (strip.length * cardW) + "px";
    $strip.innerHTML = strip.map(function (a) {
      if (a === "GOLD") return '<div class="reel-card golden-slot" id="golden-slot-card" style="--rc:#ffd700"><div class="golden-slot-icon">&#127920;</div><div class="reel-card-name" style="color:#ffd700">???</div></div>';
      var m = rarityMeta(a.rarity);
      return '<div class="reel-card" style="--rc:' + m.color + '"><div class="reel-card-cat">' + catMeta(a.cat).icon + '</div>' +
        '<div class="reel-card-name">' + esc(a.name) + '</div><div class="reel-card-rarity" style="color:' + m.color + '">' + m.label + "</div></div>";
    }).join("");

    var viewport = overlay.querySelector(".reel-viewport");
    var vw = viewport.clientWidth;
    var finalOffset = (targetIndex * cardW) + (cardW / 2) - (vw / 2);

    if (instant) { $strip.style.transform = "translateX(-" + finalOffset + "px)"; landGolden(); }
    else {
      requestAnimationFrame(function () {
        $strip.style.transition = "transform 4.4s cubic-bezier(.12,.72,.1,1)";
        $strip.style.transform = "translateX(-" + finalOffset + "px)";
      });
      sfx.reelSpin(4.4);
      setTimeout(landGolden, 4500);
    }

    function landGolden() {
      var cards = $strip.querySelectorAll(".reel-card");
      var landedCard = cards[targetIndex];
      if (landedCard) landedCard.classList.add("landed", "hit");
      sfx.goldenHit();
      if (!reduceMotion) {
        overlay.classList.add("flash-golden");
        runParticles(document.getElementById("fx-canvas"), "#ffd700", 6);
        var stage = overlay.querySelector(".reveal-stage");
        if (stage) {
          stage.classList.add("shake");
          var glow = document.createElement("div"); glow.className = "golden-burst-glow"; stage.appendChild(glow);
          var ring1 = document.createElement("div"); ring1.className = "golden-burst"; stage.appendChild(ring1);
          var ring2 = document.createElement("div"); ring2.className = "golden-burst"; ring2.style.animationDelay = "0.12s"; stage.appendChild(ring2);
        }
      }
      setTimeout(startBonusWheel, instant ? 150 : 1000);
    }

    function startBonusWheel() {
      overlay.classList.remove("flash-golden");
      var won2 = D.openGolden();
      var rm2 = rarityMeta(won2.rarity);
      var isDivine = won2.rarity === "divine";
      var pools = D.goldenPool();
      var fullPool = pools.ultras.concat(pools.divines);
      if (!fullPool.length) fullPool = [won2];
      var reelLen2 = instant ? 1 : Math.max(24, fullPool.length * 4);
      var targetIndex2 = reelLen2 - 4;
      var strip2 = [];
      for (var i = 0; i < reelLen2; i++) strip2.push(i === targetIndex2 ? won2 : fullPool[Math.floor(Math.random() * fullPool.length)]);

      overlay.innerHTML =
        '<div class="reveal-stage"><div class="reveal-caselabel" style="color:#ffd700">GOLDEN WHEEL</div>' +
        '<div class="reel-viewport golden-wheel"><div class="reel-pointer"></div><div class="reel-strip" id="reel-strip-2"></div></div>' +
        '<canvas id="fx-canvas-2" class="fx-canvas"></canvas><div class="reveal-result" id="reveal-result-2" style="display:none"></div></div>';

      var $strip2 = document.getElementById("reel-strip-2");
      $strip2.style.width = (strip2.length * cardW) + "px";
      $strip2.innerHTML = strip2.map(function (a) {
        var m = rarityMeta(a.rarity);
        return '<div class="reel-card golden-card" style="--rc:' + m.color + '"><div class="reel-card-cat">' + catMeta(a.cat).icon + '</div>' +
          '<div class="reel-card-name">' + esc(a.name) + '</div><div class="reel-card-rarity" style="color:' + m.color + '">' + m.label + "</div></div>";
      }).join("");

      var viewport2 = overlay.querySelector(".golden-wheel");
      var vw2 = viewport2.clientWidth;
      var finalOffset2 = (targetIndex2 * cardW) + (cardW / 2) - (vw2 / 2);

      if (instant) { $strip2.style.transform = "translateX(-" + finalOffset2 + "px)"; finishGolden(); }
      else {
        requestAnimationFrame(function () {
          $strip2.style.transition = "transform 5.2s cubic-bezier(.1,.75,.08,1)";
          $strip2.style.transform = "translateX(-" + finalOffset2 + "px)";
        });
        sfx.goldenSpin(5.2);
        setTimeout(finishGolden, 5300);
      }

      function finishGolden() {
        var cards = $strip2.querySelectorAll(".reel-card");
        if (cards[targetIndex2]) cards[targetIndex2].classList.add("landed");
        if (isDivine) sfx.divineReveal(); else sfx.reveal("ultra");
        if (!reduceMotion) {
          overlay.classList.add(isDivine ? "flash-divine" : "flash-ultra");
          runParticles(document.getElementById("fx-canvas-2"), rm2.color, isDivine ? 8 : 5);
          var stage2 = overlay.querySelector(".reveal-stage");
          if (stage2) stage2.classList.add(isDivine ? "shake-divine" : "shake");
        }
        setTimeout(showGoldenResult, isDivine ? 950 : 650);
      }
      function showGoldenResult() {
        var newItem = grantCaseItem(caseDef, won2, free ? 0 : -caseDef.price, ":golden");
        save(); updateHud(); renderTicker();

        var $res = document.getElementById("reveal-result-2");
        var raysHtml = '<div class="result-rays" style="--rc:' + rm2.color + '"></div>';
        var liveryHtml = newItem.livery ? '<div class="result-livery">' + liveryBadge(newItem.livery) + '</div>' : "";
        $res.style.display = "flex";
        $res.innerHTML =
          '<div class="result-card" style="--rc:' + rm2.color + ';--rg:' + rm2.glow + '">' + raysHtml +
          '<div class="result-rarity" style="color:' + rm2.color + '">' + rm2.label.toUpperCase() + "</div>" +
          '<div class="result-name">' + esc(won2.name) + '</div><div class="result-mfr">' + esc(won2.mfr) + "</div>" + liveryHtml +
          '<div class="result-price">' + fmtCr(itemValue(newItem)) + '</div>' +
          '<div class="result-actions"><button class="btn ghost" id="res-keep">Keep</button>' +
          '<button class="btn ghost" id="res-list">List for sale</button>' +
          '<button class="btn primary" id="res-quicksell">Quick sell &mdash; ' + fmtCr(quickSellPriceForItem(newItem)) + "</button></div></div>";
        requestAnimationFrame(function () { $res.classList.add("show"); });
        document.getElementById("res-keep").onclick = function () { closeOverlay(); toast("Added " + won2.name + " to your hangar.", "good"); };
        document.getElementById("res-list").onclick = function () { closeOverlay(); openSellModal(newItem, won2); };
        document.getElementById("res-quicksell").onclick = function () { closeOverlay(); sellItemInstant(newItem, won2); };
      }
    }
    function closeOverlay() { overlay.classList.remove("active", "flash-legendary", "flash-mythic", "flash-ultra", "flash-golden", "flash-divine"); overlay.innerHTML = ""; if (onDone) onDone(); }
  }

  /* ---------- bulk open (x10) ---------- */
  // Opens several cases at once. Ordinary pulls resolve instantly (watching
  // ten full reel spins back to back isn't practical) and land in a results
  // modal, but a golden/divine hit always gets its full animated moment —
  // bulk speed never gets to swallow the rare stuff.
  function bulkOpenCaseFlow(caseDef, count) {
    var totalCost = caseDef.price * count;
    if (state.credits < totalCost) { toast("Not enough credits to open " + count + " at once.", "bad"); return; }
    var results = [];
    for (var i = 0; i < count; i++) {
      var w = D.openCase(caseDef);
      if (!w) break;
      results.push(w);
    }
    if (!results.length) { toast("That case has nothing left to pull from.", "bad"); return; }
    var actualCost = caseDef.price * results.length;
    state.credits -= actualCost;
    state.totalSpent += actualCost;
    sfx.caseOpen();

    var normals = [], goldens = [];
    results.forEach(function (w) { (w.special === "golden" ? goldens : normals).push(w); });

    var summary = normals.map(function (w) { return { aircraft: D.CATALOG_BY_ID[w.id], item: grantCaseItem(caseDef, w, -caseDef.price) }; });
    save(); updateHud(); renderTicker();
    if (summary.length) showBulkSummary(caseDef, summary, goldens.length);

    function playNextGolden() {
      if (!goldens.length) { if (ready) render(); return; }
      var g = goldens.shift();
      runRevealSequence(caseDef, g, null, true, playNextGolden);
    }
    if (goldens.length) setTimeout(playNextGolden, summary.length ? 500 : 0);
  }
  function showBulkSummary(caseDef, results, goldenCount) {
    var totalValue = results.reduce(function (s, r) { return s + itemValue(r.item); }, 0);
    var rows = results.slice().sort(function (a, b) { return D.RARITIES.indexOf(b.aircraft.rarity) - D.RARITIES.indexOf(a.aircraft.rarity); })
      .map(function (r) {
        var rm = rarityMeta(r.aircraft.rarity);
        return '<div class="bulk-row"><span class="tag" style="color:' + rm.color + ';border-color:' + rm.color + '">' + rm.label + '</span>' +
          '<span class="bulk-name">' + esc(r.aircraft.name) + (r.item.livery ? " " + liveryBadge(r.item.livery) : "") + '</span><span class="bulk-price">' + fmtCr(itemValue(r.item)) + '</span></div>';
      }).join("");
    var note = goldenCount ? '<p class="dim small" style="margin-top:10px">Plus ' + goldenCount + ' Golden Wheel pull' + (goldenCount > 1 ? "s" : "") + " coming up next&hellip;</p>" : "";
    showModal("Opened " + results.length + "× " + caseDef.name,
      '<div class="bulk-results">' + rows + '</div><p class="dim small" style="margin-top:10px">Total value: ' + fmtCr(totalValue) + '</p>' + note,
      [{ label: "Nice!", cls: "primary", action: function () { closeModal(); if (ready) render(); } }]);
  }

  /* ---------- auto-open ---------- */
  var autoOpenCaseId = null, autoOpenTimer = null, autoOpenCount = 0;
  var AUTO_OPEN_LIMIT = 300;
  function updateAutoOpenBanner() {
    var el = document.getElementById("auto-open-banner");
    if (!el) return;
    if (!autoOpenCaseId) { el.style.display = "none"; el.innerHTML = ""; return; }
    var c = D.CASES_BY_ID[autoOpenCaseId];
    el.style.display = "flex";
    el.innerHTML = "Auto-opening <b>" + esc(c ? c.name : "case") + "</b> &middot; " + autoOpenCount + ' opened <button id="auto-open-stop-btn">Stop</button>';
    var stopBtn = document.getElementById("auto-open-stop-btn");
    if (stopBtn) stopBtn.onclick = function () { stopAutoOpen("Auto-open stopped."); };
  }
  function stopAutoOpen(reason) {
    if (autoOpenTimer) { clearTimeout(autoOpenTimer); autoOpenTimer = null; }
    var wasActive = !!autoOpenCaseId;
    autoOpenCaseId = null;
    if (wasActive && reason) toast(reason + " (" + autoOpenCount + " opened)", "");
    autoOpenCount = 0;
    updateAutoOpenBanner();
    if (ready) render();
  }
  function startAutoOpen(caseDef) {
    if (autoOpenCaseId === caseDef.id) { stopAutoOpen("Auto-open stopped."); return; }
    if (autoOpenCaseId) stopAutoOpen(null);
    if (state.credits < caseDef.price) { toast("Not enough credits.", "bad"); return; }
    autoOpenCaseId = caseDef.id;
    autoOpenCount = 0;
    updateAutoOpenBanner();
    if (ready) render();
    autoOpenStep(caseDef);
  }
  function autoOpenStep(caseDef) {
    if (autoOpenCaseId !== caseDef.id) return;
    if (autoOpenCount >= AUTO_OPEN_LIMIT) { stopAutoOpen("Auto-open safety limit reached."); return; }
    if (state.credits < caseDef.price) { stopAutoOpen("Ran out of credits."); return; }
    var won = D.openCase(caseDef);
    if (!won) { stopAutoOpen("Nothing left to pull from."); return; }
    sfx.caseOpen();
    state.credits -= caseDef.price;
    state.totalSpent += caseDef.price;
    autoOpenCount++;
    updateAutoOpenBanner();
    if (won.special === "golden") {
      // Always pause for a golden/divine moment — too big to blow past automatically.
      stopAutoOpen(null);
      save(); updateHud(); renderTicker();
      runRevealSequence(caseDef, won, null, true);
      return;
    }
    grantCaseItem(caseDef, won, -caseDef.price);
    save(); updateHud(); renderTicker();
    // Auto-open never waits on a click — every ordinary pull auto-keeps itself
    // and moves straight on, so Stop (on the page or the banner) always stays
    // reachable. Only golden/divine pauses the whole loop, above.
    toast("Got " + won.name + " (" + rarityMeta(won.rarity).label + ")", "good");
    autoOpenTimer = setTimeout(function () { autoOpenStep(caseDef); }, 350);
  }

  function runParticles(canvas, color, intensity) {
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr; ctx.scale(dpr, dpr);
    var count = 40 + intensity * 30, parts = [];
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * Math.PI * 2, speed = 2 + Math.random() * (3 + intensity * 1.5);
      parts.push({ x: w / 2, y: h / 2, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed - 1, life: 60 + Math.random() * 40, age: 0, size: 2 + Math.random() * (2 + intensity) });
    }
    var start = performance.now(), duration = 1600 + intensity * 200;
    function frame(now) {
      var elapsed = now - start;
      ctx.clearRect(0, 0, w, h);
      parts.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.age++;
        var a = Math.max(0, 1 - p.age / p.life);
        ctx.globalAlpha = a; ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      if (elapsed < duration) requestAnimationFrame(frame); else ctx.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- sell / buy / quick sell ---------- */
  function openSellModal(item, aircraft) {
    var market = itemValue(item);
    var liveryNote = item.livery ? '<p class="dim small">Livery: <b style="color:var(--credit)">' + esc(item.livery.name) + '</b> (+' + item.livery.valuePct + '% value)</p>' : "";
    showModal("List " + aircraft.name,
      '<div class="modal-sell">' + liveryNote + '<p class="dim">Current market price: <b>' + fmtCr(market) + '</b></p>' +
      '<label class="field-label">Your asking price</label>' +
      '<input type="number" id="sell-price" class="input" min="1" step="1" value="' + Math.round(market) + '"></div>',
      [
        { label: "Cancel", cls: "ghost", action: closeModal },
        { label: "List for sale", cls: "primary", action: function () {
            var val = parseInt(document.getElementById("sell-price").value, 10);
            if (!val || val <= 0) { toast("Enter a valid asking price.", "bad"); return; }
            closeModal(); listItem(item, aircraft, val);
          } },
      ]);
  }
  function listItem(item, aircraft, price) {
    state.inventory = state.inventory.map(function (i) { return i.instanceId === item.instanceId ? Object.assign({}, i, { listed: true }) : i; });
    state.listings.push({ id: genId(), aircraftId: aircraft.id, price: price, sellerName: state.callsign, listedAt: Date.now(), mine: true, instanceId: item.instanceId, livery: item.livery || null });
    sfx.list();
    save(); toast("Listed " + aircraft.name + " for " + fmtCr(price) + ".", "good");
    if (ready) render();
  }
  function cancelListing(item) {
    state.listings = state.listings.filter(function (l) { return l.instanceId !== item.instanceId; });
    state.inventory = state.inventory.map(function (i) { return i.instanceId === item.instanceId ? Object.assign({}, i, { listed: false }) : i; });
    sfx.cancel();
    save(); toast("Listing cancelled.", ""); if (ready) render();
  }
  function buyListing(listing) {
    if (listing.mine) { toast("That's your own listing.", "bad"); return; }
    if (state.credits < listing.price) { toast("Not enough credits.", "bad"); return; }
    var aircraft = D.CATALOG_BY_ID[listing.aircraftId];
    if (!aircraft) return;
    sfx.buy();
    state.listings = state.listings.filter(function (l) { return l.id !== listing.id; });
    state.credits -= listing.price;
    state.totalSpent += listing.price;
    state.inventory.push({ instanceId: genId(), aircraftId: aircraft.id, acquiredAt: Date.now(), source: "market", listed: false, cost: listing.price, livery: listing.livery || null });
    // Market price tracking reflects the standard livery's value, so a sale
    // of a rare-livery instance doesn't skew the base aircraft's price.
    var liveryMult = listing.livery ? 1 + listing.livery.valuePct / 100 : 1;
    var baseEquivalent = listing.price / liveryMult;
    var p = state.prices[aircraft.id] || (state.prices[aircraft.id] = { mult: 1, current: aircraft.base, history: [], minted: 0 });
    p.current = baseEquivalent; p.mult = baseEquivalent / aircraft.base;
    p.history.push({ t: Date.now(), price: baseEquivalent });
    pushLedger({ t: Date.now(), type: "buy", aircraftId: aircraft.id, amount: -listing.price, rarity: aircraft.rarity });
    pushActivity({ type: "trade", aircraftId: aircraft.id, price: listing.price, t: Date.now() });
    snapshotHistory(); save(); updateHud();
    toast("Bought " + aircraft.name + " for " + fmtCr(listing.price) + " from " + listing.sellerName + "!", "good");
    if (ready) render();
  }
  function sellItemInstant(item, aircraft) {
    var price = quickSellPriceForItem(item);
    var pl = price - (item.cost || 0);
    sfx.sell();
    state.inventory = state.inventory.filter(function (i) { return i.instanceId !== item.instanceId; });
    state.credits += price; state.totalEarned += price;
    applyFlip(pl, aircraft.name);
    pushLedger({ t: Date.now(), type: "quicksell", aircraftId: aircraft.id, amount: price, cost: item.cost || 0, pl: pl, rarity: aircraft.rarity });
    snapshotHistory(); save(); updateHud();
    toast("Quick sold " + aircraft.name + " for " + fmtCr(price) + ".", "good");
    if (ready) render();
  }

  /* ---------- modal ---------- */
  function showModal(title, bodyHtml, buttons) {
    var host = document.getElementById("modal-host");
    host.innerHTML = '<div class="modal-backdrop"><div class="modal-box"><div class="modal-title">' + esc(title) + '</div>' +
      '<div class="modal-body">' + bodyHtml + '</div><div class="modal-actions"></div></div></div>';
    var actions = host.querySelector(".modal-actions");
    buttons.forEach(function (b) {
      var btn = document.createElement("button");
      btn.className = "btn " + (b.cls || ""); btn.textContent = b.label; btn.onclick = b.action;
      actions.appendChild(btn);
    });
    host.querySelector(".modal-backdrop").addEventListener("click", function (e) { if (e.target.classList.contains("modal-backdrop")) closeModal(); });
  }
  function closeModal() { document.getElementById("modal-host").innerHTML = ""; }

  /* ---------- shell / nav ---------- */
  function renderShell() { $app.innerHTML = '<div class="loading-shell">Preparing the flight line&hellip;</div>'; }
  var NAV = [["catalog", "Catalog"], ["market", "Marketplace"], ["cases", "Cases"], ["battles", "Battles"], ["forge", "Forge"], ["dailyspin", "Daily Spin"], ["inventory", "Hangar"], ["portfolio", "Portfolio"], ["leaderboard", "Leaderboard"]];
  function renderNav(active) {
    var items = NAV.slice();
    if (adminUnlocked) items = items.concat([["admin", "Admin"]]);
    return items.map(function (n) { return '<a href="#/' + n[0] + '" class="nav-link' + (active === n[0] ? " active" : "") + '">' + n[1] + "</a>"; }).join("");
  }
  function render() {
    if (!ready) return;
    var r = route();
    var navHost = document.getElementById("nav-links");
    if (navHost) navHost.innerHTML = renderNav(r.name);
    if (r.name === "catalog") return renderCatalog();
    if (r.name === "liveries") return renderLiveryCatalog();
    if (r.name === "aircraft") return renderAircraftDetail(r.param);

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();

  function drawLineChart(canvas, pts, color) {

      canvas.width = w * dpr; canvas.height = h * dpr;
      var ctx = canvas.getContext("2d"); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);
      var pad = { l: 8, r: 8, t: 16, b: 20 };
      var minV = Math.min.apply(null, pts.map(function (p) { return p.v; }));
      var maxV = Math.max.apply(null, pts.map(function (p) { return p.v; }));
      if (minV === maxV) { minV *= 0.95; maxV *= 1.05; }
      var minT = pts[0].t, maxT = pts[pts.length - 1].t;
      if (minT === maxT) minT -= 1;
      function X(t) { return pad.l + ((t - minT) / (maxT - minT)) * (w - pad.l - pad.r); }
      function Y(v) { return h - pad.b - ((v - minV) / (maxV - minV)) * (h - pad.t - pad.b); }

      var grad = ctx.createLinearGradient(0, pad.t, 0, h - pad.b);

      pts.forEach(function (p) { ctx.lineTo(X(p.t), Y(p.v)); });
      ctx.lineTo(X(pts[pts.length - 1].t), h - pad.b); ctx.lineTo(X(pts[0].t), h - pad.b); ctx.closePath();
      ctx.fillStyle = grad; ctx.fill();
      ctx.beginPath();
      pts.forEach(function (p, i) { var x = X(p.t), y = Y(p.v); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();

        ctx.beginPath(); ctx.arc(X(last.t), Y(last.v), 7, 0, Math.PI * 2); ctx.strokeStyle = color + "88"; ctx.stroke();

      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(hx, hy, 4.5, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
      ctx.beginPath(); ctx.arc(hx, hy, 7.5, 0, Math.PI * 2); ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
      var label = fmtCr(hp.v);
      var dateLabel = new Date(hp.t).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      ctx.font = "600 12px 'IBM Plex Mono', monospace";

      var boxH = 38, boxX = Math.min(Math.max(hx - tw / 2, pad.l), w - pad.r - tw), boxY = hy - boxH - 12;

  /* ---------- legacy cases ---------- */

  function legacyReelHtml(lc) {

  function legacySparksHtml() {

  function legacyOdds(lc) {
    var poolAircraft = lc.pool.map(function (id) { return D.CATALOG_BY_ID[id]; }).filter(Boolean);
    var byRarity = {};
    poolAircraft.forEach(function (a) { (byRarity[a.rarity] = byRarity[a.rarity] || []).push(a); });
    var total = 0;
    for (var r in lc.weights) { if (byRarity[r] && byRarity[r].length) total += lc.weights[r]; }
    var out = [];
    D.RARITIES.slice().reverse().forEach(function (r) {
      if (byRarity[r] && byRarity[r].length && lc.weights[r] > 0) {
        var pct = (lc.weights[r] / total) * 100 / byRarity[r].length;
        byRarity[r].forEach(function (a) { out.push({ a: a, pct: pct }); });
      }

  function startLegacyCountdown() {

  function openLegacyCaseFlow(lc) {

  function runLegacyRevealSequence(lc, result) {
    var overlay = document.getElementById("reveal-overlay");

    var a = result.aircraft, livery = result.livery;
    var rm = rarityMeta(a.rarity);
    var decoyPool = lc.pool ? lc.pool.map(function (id) { return D.CATALOG_BY_ID[id]; }).filter(Boolean) : D.LEGACY_CATALOG;
    if (!decoyPool.length) decoyPool = [a];
    var reelLen = reduceMotion ? 1 : 44;
    var targetIndex = reelLen - 4;
    var strip = [];
    for (var i = 0; i < reelLen; i++) strip.push(i === targetIndex ? a : decoyPool[Math.floor(Math.random() * decoyPool.length)]);
    overlay.innerHTML = '<div class="reveal-stage"><div class="reveal-caselabel legacy-label">' + esc(lc.name.toUpperCase()) + '</div>' +
      '<div class="reel-viewport golden-wheel"><div class="reel-pointer"></div><div class="reel-strip" id="reel-strip"></div></div>' +
      '<canvas id="fx-canvas" class="fx-canvas"></canvas><div class="reveal-result" id="reveal-result" style="display:none"></div></div>';
    var $strip = document.getElementById("reel-strip");
    $strip.style.width = (strip.length * cardW) + "px";
    $strip.innerHTML = strip.map(function (c) {
      var m = rarityMeta(c.rarity);
      return '<div class="reel-card golden-card" style="--rc:' + m.color + '"><div class="reel-card-cat">' + catMeta(c.cat).icon + '</div>' +
        '<div class="reel-card-name">' + esc(c.name) + '</div><div class="reel-card-rarity" style="color:' + m.color + '">' + m.label + "</div></div>";
    }).join("");
    var viewport = overlay.querySelector(".reel-viewport");
    var vw = viewport.clientWidth;
    var finalOffset = (targetIndex * cardW) + (cardW / 2) - (vw / 2);
    if (reduceMotion) { $strip.style.transform = "translateX(-" + finalOffset + "px)"; finishLegacyReveal(); }
    else {
      requestAnimationFrame(function () {
        $strip.style.transition = "transform 5s cubic-bezier(.12,.72,.1,1)";
        $strip.style.transform = "translateX(-" + finalOffset + "px)";
      });
      sfx.goldenSpin(5);
      setTimeout(finishLegacyReveal, 5100);
    }
    function finishLegacyReveal() {
      var cards = $strip.querySelectorAll(".reel-card");
      if (cards[targetIndex]) cards[targetIndex].classList.add("landed");
      var intensity = RARITY_INTENSITY[a.rarity] || 0;
      sfx.reveal(a.rarity === "ultra" ? "ultra" : a.rarity);
      if (!reduceMotion) {
        overlay.classList.add("flash-" + (intensity >= 4 ? "ultra" : "legendary"));
        runParticles(document.getElementById("fx-canvas"), rm.color, Math.max(intensity, 3));
        var stage = overlay.querySelector(".reveal-stage");
        if (stage) stage.classList.add("shake");
      }
      setTimeout(showLegacyResult, 700);
    }
    function showLegacyResult() {
      var item = { instanceId: genId(), aircraftId: a.id, acquiredAt: Date.now(), source: "legacy:" + lc.id, listed: false, cost: lc.price, livery: livery };
      state.inventory.push(item);
      var p = state.prices[a.id] || (state.prices[a.id] = { mult: 1, current: null, history: [], minted: 0 });
      p.minted = (p.minted || 0) + 1;
      pushActivity({ type: "unlock", aircraftId: a.id, rarity: a.rarity, who: state.callsign, t: Date.now() });
      pushLedger({ t: Date.now(), type: "legacy", aircraftId: a.id, amount: -lc.price, rarity: a.rarity });
      snapshotHistory(); save(); updateHud(); renderTicker();
      var $res = document.getElementById("reveal-result");
      var raysHtml = '<div class="result-rays" style="--rc:' + rm.color + '"></div>';
      var liveryHtml = livery ? '<div class="result-livery">' + liveryBadge(livery) + '</div>' : "";
      $res.style.display = "flex";
      $res.innerHTML = '<div class="result-card" style="--rc:' + rm.color + ';--rg:' + rm.glow + '">' + raysHtml +
        '<div class="result-rarity" style="color:' + rm.color + '">' + rm.label.toUpperCase() + ' &middot; <span class="limited-badge">LIMITED</span></div>' +
        '<div class="result-name">' + esc(a.name) + '</div><div class="result-mfr">' + esc(a.mfr) + '</div>' + liveryHtml +
        '<div class="result-price">' + fmtCr(valueWithLivery(a.id, livery)) + '</div>' +
        '<div class="result-actions"><button class="btn ghost" id="res-keep">Keep</button>' +
        '<button class="btn ghost" id="res-list">List for sale</button>' +
        '<button class="btn primary" id="res-quicksell">Quick sell &mdash; ' + fmtCr(Math.round(valueWithLivery(a.id, livery) * QUICK_SELL_FACTOR)) + '</button></div></div>';
      requestAnimationFrame(function () { $res.classList.add("show"); });
      document.getElementById("res-keep").onclick = function () { closeLegacyOverlay(); toast("Added " + a.name + " to your hangar.", "good"); };
      document.getElementById("res-list").onclick = function () { closeLegacyOverlay(); openSellModal(item, a); };
      document.getElementById("res-quicksell").onclick = function () { closeLegacyOverlay(); sellItemInstant(item, a); };
    }
    function closeLegacyOverlay() {
      overlay.classList.remove("active", "flash-legendary", "flash-mythic", "flash-ultra", "flash-golden", "flash-divine");
      overlay.innerHTML = "";

  }
  // A single dart-shaped top-down airplane body, reused and reshaped (wingspan
  // scale, extra engine/rotor/wing bits) for every category so the whole set
  // reads as one consistent icon family instead of 10 unrelated drawings.
  var PLANE_BODY = "M100,8 L118,52 L178,88 L120,82 L114,128 L138,148 L100,136 L62,148 L86,128 L80,82 L22,88 L82,52 Z";
  function planeGlyph(color, wingScale, extra) {
    var t = wingScale && wingScale !== 1 ? ' transform="translate(100,78) scale(' + wingScale + ',1) translate(-100,-78)"' : "";
    return '<g' + t + '><path d="' + PLANE_BODY + '" fill="' + color + '"/></g>' + (extra || "");
  }
  // Straight-wing, round-nosed silhouette for propeller aircraft — visually
  // distinct from the swept jet dart above, so a Cessna doesn't read as a jet.
  function propPlaneGlyph(color, wingLen, opts) {

      '<rect x="' + (100 - halfWing) + '" y="68" width="' + wingLen + '" height="11" rx="4" fill="' + color + '"/>' +
      '<rect x="78" y="124" width="44" height="9" rx="3" fill="' + color + '"/>';
    if (opts.biplane) html += '<rect x="' + (100 - halfWing * 0.8) + '" y="96" width="' + (wingLen * 0.8) + '" height="8" rx="3" fill="' + color + '" opacity="0.55"/>';
    if (opts.wingEngines) html += '<circle cx="' + (100 - halfWing * 0.42) + '" cy="74" r="7" fill="none" stroke="' + color + '" stroke-width="2.5"/><circle cx="' + (100 + halfWing * 0.42) + '" cy="74" r="7" fill="none" stroke="' + color + '" stroke-width="2.5"/>';
    if (opts.nosePod !== false) html += '<circle cx="100" cy="22" r="8" fill="none" stroke="' + color + '" stroke-width="2.5"/>';
    return html;
  }
  function categorySilhouette(cat, color) {
    switch (cat) {
      case "GLIDER": return propPlaneGlyph(color, 192, { nosePod: false });
      case "MILITARY": return planeGlyph(color, 0.68);
      case "EXPERIMENTAL": return planeGlyph(color, 0.65, '<polygon points="92,140 100,158 108,140" fill="' + color + '" opacity="0.75"/>');
      case "CARGO": return planeGlyph(color, 1.08, '<ellipse cx="60" cy="78" rx="7" ry="11" fill="' + color + '" opacity="0.8"/><ellipse cx="40" cy="86" rx="7" ry="11" fill="' + color + '" opacity="0.8"/><ellipse cx="140" cy="78" rx="7" ry="11" fill="' + color + '" opacity="0.8"/><ellipse cx="160" cy="86" rx="7" ry="11" fill="' + color + '" opacity="0.8"/>');
      case "AIRLINER": return planeGlyph(color, 1.0, '<ellipse cx="62" cy="80" rx="8" ry="13" fill="' + color + '" opacity="0.85"/><ellipse cx="138" cy="80" rx="8" ry="13" fill="' + color + '" opacity="0.85"/>');
      case "BIZJET": return planeGlyph(color, 0.78, '<ellipse cx="88" cy="126" rx="6" ry="10" fill="' + color + '" opacity="0.85"/><ellipse cx="112" cy="126" rx="6" ry="10" fill="' + color + '" opacity="0.85"/>');
      case "TURBOPROP": return propPlaneGlyph(color, 168, { wingEngines: true, nosePod: false });

  function caseArtSvg(c) {

  /* ---------- battles ---------- */
