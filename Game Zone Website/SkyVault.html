  var battleView = "lobby"; // "lobby" | "arena" | "result"
  var activeBattle = null;
  var battleSelection = { caseId: D.CASES[0].id, count: 5 };

  function resolveBattlePull(caseDef) {
    var w = D.openCase(caseDef);
    if (w && w.special === "golden") w = D.openGolden();
    if (!w) w = D.CATALOG[Math.floor(Math.random() * D.CATALOG.length)];
    return { aircraft: w, livery: D.rollLivery(w.id) };
  }
  function grantBattleItem(r) {
    var item = { instanceId: genId(), aircraftId: r.aircraft.id, acquiredAt: Date.now(), source: "battle", listed: false, cost: 0, livery: r.livery };
    state.inventory.push(item);
    var p = state.prices[r.aircraft.id] || (state.prices[r.aircraft.id] = { mult: 1, current: null, history: [], minted: 0 });
    p.minted = (p.minted || 0) + 1;
    pushActivity({ type: "unlock", aircraftId: r.aircraft.id, rarity: r.aircraft.rarity, who: state.callsign, t: Date.now() });
  }
  function startBattle(caseDef, count, botName) {
    count = Math.max(1, Math.min(BATTLE_MAX_CASES, Math.round(count)));
    var cost = caseDef.price * count;
    if (state.credits < cost) { toast("Not enough credits for that battle.", "bad"); return; }
    state.credits -= cost;
    state.totalSpent += cost;
    state.battleStats.wagered += cost;
    save(); updateHud();
    activeBattle = {
      caseDef: caseDef, count: count, botName: botName || pickBotName(), cost: cost,
      playerResults: [], botResults: [], playerTotal: 0, botTotal: 0, revealed: 0, playerWon: null,
    };
    battleView = "arena";
    render();
    runBattleReveal(activeBattle);
  }
  function runBattleReveal(b) {
    sfx.caseOpen();
    var step = 0;
    function revealNext() {
      if (activeBattle !== b) return;
      if (step >= b.count) { finishBattle(b); return; }
      var pr = resolveBattlePull(b.caseDef), br = resolveBattlePull(b.caseDef);
      b.playerResults.push(pr); b.botResults.push(br);
      b.playerTotal += valueWithLivery(pr.aircraft.id, pr.livery);
      b.botTotal += valueWithLivery(br.aircraft.id, br.livery);
      b.revealed = step + 1;
      var topIntensity = Math.max(RARITY_INTENSITY[pr.aircraft.rarity] || 0, RARITY_INTENSITY[br.aircraft.rarity] || 0);
      sfx.reveal(topIntensity >= 5 ? "ultra" : topIntensity >= 3 ? "legendary" : topIntensity >= 2 ? "epic" : "common");
      if (ready) render();
      step++;
      setTimeout(revealNext, 550);
    }
    revealNext();
  }
  function finishBattle(b) {
    var playerWon = state.adminAlwaysWinBattles || b.playerTotal >= b.botTotal;
    b.playerWon = playerWon;
    if (playerWon) {
      b.playerResults.concat(b.botResults).forEach(grantBattleItem);
      state.battleStats.wins++;
      state.battleStats.won += b.playerTotal + b.botTotal;
      if (b.caseDef.id === "legendary") state.battleStats.legendaryWinsSinceTournament = (state.battleStats.legendaryWinsSinceTournament || 0) + 1;
      sfx.reveal("legendary");
    } else {
      state.battleStats.losses++;
      sfx.bad();
    }
    save(); updateHud(); renderTicker();
    battleView = "result";
    render();
  }
  function emptyBattleSlots(n) { var html = ""; for (var i = 0; i < n; i++) html += '<div class="battle-item-card empty"></div>'; return html; }
  function battleItemCard(r) {
    var a = r.aircraft, rm = rarityMeta(a.rarity);
    var special = (a.rarity === "ultra" || a.rarity === "divine") ? " special" : "";
    var val = valueWithLivery(a.id, r.livery);
    return '<div class="battle-item-card' + special + '" style="--rc:' + rm.color + '"><div class="b-rarity" style="color:' + rm.color + '">' + rm.label + '</div>' +
      '<div class="b-name">' + esc(a.name) + '</div>' + (r.livery ? '<div class="b-livery">' + liveryBadge(r.livery) + '</div>' : "") +
      '<div class="b-price">' + fmtCr(val) + '</div></div>';
  }
  function renderBattles() {
    if (battleView === "arena" && activeBattle) return renderBattleArena();
    if (battleView === "result" && activeBattle) return renderBattleResult();
    if (battleView === "tournament" && activeTournament) return renderTournamentRound();
    if (battleView === "tournament-result" && activeTournament) return renderTournamentResult();
    renderBattleLobby();
  }
  function battleLobbyRow(b) {
    var c = D.CASES_BY_ID[b.caseId];
    if (!c) return "";
    var cost = c.price * b.count;
    return '<div class="battle-lobby-row"><div class="case-art" style="width:52px;height:40px;flex-shrink:0">' + caseArtSvg(c) + '</div>' +
      '<div class="battle-lobby-info"><b>' + esc(b.botName) + '</b><span class="dim"> wants to battle &middot; ' + b.count + '× ' + esc(c.name) + '</span></div>' +
      '<button class="btn primary small" data-join-battle="' + b.id + '">Join &mdash; ' + fmtCr(cost) + '</button></div>';
  }
  function renderBattleLobby() {
    var stats = state.battleStats;
    var selCase = D.CASES_BY_ID[battleSelection.caseId] || D.CASES[0];
    var createCost = selCase.price * battleSelection.count;
    $app.innerHTML = '<section class="page"><div class="page-head"><h1>Battles</h1><p class="dim">Open cases head-to-head against a bot. Highest total value takes everything &mdash; the loser walks away empty-handed.</p></div>' +
      '<div class="stat-cards">' +
      statCard("Battles won", stats.wins) + statCard("Battles lost", stats.losses) +
      statCard("Total wagered", fmtCr(stats.wagered)) + statCard("Total won", fmtCr(stats.won)) + '</div>' +
      '<div class="panel"><h3>Start a battle</h3><div class="filter-bar">' +
      '<select class="input" id="battle-case-select">' + D.CASES.map(function (c) { return '<option value="' + c.id + '"' + (battleSelection.caseId === c.id ? " selected" : "") + '>' + esc(c.name) + " — " + fmtCr(c.price) + '</option>'; }).join("") + '</select>' +
      '<input class="input" id="battle-count-input" type="number" min="1" max="' + BATTLE_MAX_CASES + '" value="' + battleSelection.count + '" style="max-width:110px">' +
      '<button class="btn primary" id="battle-create-btn">Start battle &mdash; ' + fmtCr(createCost) + '</button></div>' +
      '<p class="dim small">Up to ' + BATTLE_MAX_CASES + ' cases per battle. You and the bot each open the same case the same number of times.</p></div>' +
      '<div class="panel"><h3>Open battles (' + state.openBattles.length + ')</h3>' +
      (state.openBattles.length ? '<div class="battle-lobby-list">' + state.openBattles.map(battleLobbyRow).join("") : '<p class="dim">No open battles right now &mdash; check back soon, or start your own.</p>') + '</div>' +
      tournamentPanelHtml() +
      '</section>';
    var caseSel = document.getElementById("battle-case-select");
    var countInput = document.getElementById("battle-count-input");
    if (caseSel) caseSel.onchange = function (e) { battleSelection.caseId = e.target.value; renderBattleLobby(); };
    if (countInput) countInput.onchange = function (e) { battleSelection.count = clamp(parseInt(e.target.value, 10) || 1, 1, BATTLE_MAX_CASES); renderBattleLobby(); };
    var createBtn = document.getElementById("battle-create-btn");
    if (createBtn) createBtn.onclick = function () { startBattle(selCase, battleSelection.count, null); };
    var tourneyBtn = document.getElementById("tourney-enter-btn");
    if (tourneyBtn) tourneyBtn.onclick = startTournament;
    document.querySelectorAll("[data-join-battle]").forEach(function (b) {
      b.onclick = function () {
        var idx = state.openBattles.findIndex(function (x) { return x.id === b.getAttribute("data-join-battle"); });
        if (idx === -1) return;
        var entry = state.openBattles[idx];
        var c = D.CASES_BY_ID[entry.caseId];
        if (!c) return;
        if (state.credits < c.price * entry.count) { toast("Not enough credits to join that battle.", "bad"); return; }
        state.openBattles.splice(idx, 1);
        startBattle(c, entry.count, entry.botName);
      };
    });
  }
  function battleArenaHtml(b, resultBanner) {
    return '<div class="battle-arena">' +
      '<div class="battle-col"><div class="battle-col-header you"><span>YOU</span><span class="battle-total">' + fmtCr(b.playerTotal) + '</span></div>' +
      '<div class="battle-items">' + b.playerResults.map(battleItemCard).join("") + emptyBattleSlots(b.count - b.playerResults.length) + '</div></div>' +
      '<div class="battle-vs">VS</div>' +
      '<div class="battle-col"><div class="battle-col-header them"><span>' + esc(b.botName) + '</span><span class="battle-total">' + fmtCr(b.botTotal) + '</span></div>' +
      '<div class="battle-items">' + b.botResults.map(battleItemCard).join("") + emptyBattleSlots(b.count - b.botResults.length) + '</div></div>' +
      '</div>' + (resultBanner || '<div class="panel"><p class="dim">Opened ' + b.revealed + " / " + b.count + '</p></div>');
  }
  function renderBattleArena() {
    var b = activeBattle;
    $app.innerHTML = '<section class="page"><div class="page-head"><h1>Battle &mdash; ' + esc(b.caseDef.name) + '</h1><p class="dim">' + b.count + ' cases each &middot; ' + fmtCr(b.cost) + ' entry</p></div>' +
      battleArenaHtml(b) + '</section>';
  }
  function renderBattleResult() {
    var b = activeBattle;
    var pot = b.playerTotal + b.botTotal;
    var banner = '<div class="panel battle-result-banner ' + (b.playerWon ? "win" : "lose") + '"><h2>' + (b.playerWon ? "You won!" : "You lost") + '</h2>' +
      '<p class="dim">You: ' + fmtCr(b.playerTotal) + ' &middot; ' + esc(b.botName) + ': ' + fmtCr(b.botTotal) + '</p>' +
      (b.playerWon ? '<p>You keep all ' + (b.playerResults.length + b.botResults.length) + ' items &mdash; worth ' + fmtCr(pot) + ' total.</p>' : '<p class="dim">Better luck next time.</p>') + '</div>';
    $app.innerHTML = '<section class="page"><div class="page-head"><h1>Battle Result</h1></div>' +
      battleArenaHtml(b, banner) +
      '<button class="btn primary lg" id="battle-done-btn" style="margin-top:16px">Back to Battles</button></section>';
    document.getElementById("battle-done-btn").onclick = function () { activeBattle = null; battleView = "lobby"; render(); };
  }

  /* ---------- tournament ---------- */
  var TOURNAMENT_UNLOCK_LEGENDARY_WINS = 20;
  var TOURNAMENT_ENTRY_COST = 12000000;
  var TOURNAMENT_ROUND_SIZES = [6, 8, 12];
  var TOURNAMENT_ROUND_NAMES = ["Quarterfinal", "Semifinal", "Final"];
  var TOURNAMENT_CHAMPION_BONUS = 5000000;
  var activeTournament = null;
  function tournamentUnlocked() {
    return (state.battleStats.legendaryWinsSinceTournament || 0) >= TOURNAMENT_UNLOCK_LEGENDARY_WINS;
  }
  function tournamentPanelHtml() {
    if (tournamentUnlocked()) {
      var canAfford = state.credits >= TOURNAMENT_ENTRY_COST;
      return '<div class="panel tourney-panel"><h3>🏆 8-Player Tournament</h3>' +
        '<p class="dim">Single elimination, 3 rounds of escalating Legendary Case battles (6 → 8 → 12 cases). Win a round and you keep everything from it; lose, and you keep what you’ve already banked.</p>' +
        '<button class="btn primary lg" id="tourney-enter-btn" ' + (canAfford ? "" : "disabled") + '>Enter Tournament &mdash; ' + fmtCr(TOURNAMENT_ENTRY_COST) + '</button>' +
        (canAfford ? "" : '<p class="dim small">Not enough credits.</p>') +
        '<p class="dim small">Win or lose, the gate relocks after this attempt &mdash; you\'ll need ' + TOURNAMENT_UNLOCK_LEGENDARY_WINS + ' more Legendary Case wins to re-enter.</p>' +
        (state.battleStats.tournamentsWon ? '<p class="dim small">Tournaments won: ' + state.battleStats.tournamentsWon + '</p>' : "") + '</div>';
    }
    var w = Math.min(state.battleStats.legendaryWinsSinceTournament || 0, TOURNAMENT_UNLOCK_LEGENDARY_WINS);
    return '<div class="panel tourney-panel locked"><h3>🔒 8-Player Tournament</h3>' +
      '<p class="dim">Win ' + TOURNAMENT_UNLOCK_LEGENDARY_WINS + ' normal Legendary Case battles to unlock. The gate resets after every tournament attempt, win or lose.</p>' +
      '<div class="tourney-progress"><div class="tourney-progress-row"><span>Legendary Case battles won</span><b>' + w + ' / ' + TOURNAMENT_UNLOCK_LEGENDARY_WINS + '</b></div></div></div>';
  }
  function startTournament() {
    if (!tournamentUnlocked()) { toast("Tournament is still locked.", "bad"); return; }
    if (state.credits < TOURNAMENT_ENTRY_COST) { toast("Not enough credits for the tournament entry.", "bad"); return; }
    state.credits -= TOURNAMENT_ENTRY_COST;
    state.totalSpent += TOURNAMENT_ENTRY_COST;
    save(); updateHud();
    activeTournament = { roundIdx: 0, bankedCount: 0, bankedValue: 0 };
    battleView = "tournament";
    runTournamentRound();
  }
  function runTournamentRound() {
    var t = activeTournament;
    var caseDef = D.CASES_BY_ID.legendary;
    t.caseDef = caseDef;
    t.count = TOURNAMENT_ROUND_SIZES[t.roundIdx];
    t.roundName = TOURNAMENT_ROUND_NAMES[t.roundIdx];
    t.botName = pickBotName();
    t.playerResults = []; t.botResults = []; t.playerTotal = 0; t.botTotal = 0; t.revealed = 0; t.outcome = null;
    battleView = "tournament";
    render();
    sfx.caseOpen();
    var step = 0;
    function revealNext() {
      if (activeTournament !== t) return;
      if (step >= t.count) { finishTournamentRound(t); return; }
      var pr = resolveBattlePull(caseDef), br = resolveBattlePull(caseDef);
      t.playerResults.push(pr); t.botResults.push(br);
      t.playerTotal += valueWithLivery(pr.aircraft.id, pr.livery);
      t.botTotal += valueWithLivery(br.aircraft.id, br.livery);
      t.revealed = step + 1;
      var topIntensity = Math.max(RARITY_INTENSITY[pr.aircraft.rarity] || 0, RARITY_INTENSITY[br.aircraft.rarity] || 0);
      sfx.reveal(topIntensity >= 5 ? "ultra" : topIntensity >= 3 ? "legendary" : "epic");
      if (ready) render();
      step++;
      setTimeout(revealNext, 480);
    }
    revealNext();
  }
  function finishTournamentRound(t) {
    var won = state.adminAlwaysWinBattles || t.playerTotal >= t.botTotal;
    t.outcome = won ? "won" : "lost";
    if (won) {
      t.playerResults.concat(t.botResults).forEach(grantBattleItem);
      t.bankedCount += t.playerResults.length + t.botResults.length;
      t.bankedValue += t.playerTotal + t.botTotal;
      save(); updateHud(); renderTicker();
      sfx.reveal("legendary");
    } else {
      sfx.bad();
    }
    battleView = "tournament-result";
    render();
  }
  function advanceTournament() {
    var t = activeTournament;
    if (t.roundIdx >= TOURNAMENT_ROUND_SIZES.length - 1) {
      state.credits += TOURNAMENT_CHAMPION_BONUS;
      state.battleStats.tournamentsWon = (state.battleStats.tournamentsWon || 0) + 1;
      state.battleStats.legendaryWinsSinceTournament = 0;
      save(); updateHud();
      toast("Tournament champion! +" + fmtCr(TOURNAMENT_CHAMPION_BONUS), "good");
      activeTournament = null;
      battleView = "lobby";
      render();
      return;
    }
    t.roundIdx++;
    runTournamentRound();
  }
  function exitTournament() {
    state.battleStats.legendaryWinsSinceTournament = 0;
    save(); updateHud();
    activeTournament = null;
    battleView = "lobby";
    render();
  }
  function tournamentStepsHtml(t) {
    return '<div class="tourney-steps">' + TOURNAMENT_ROUND_NAMES.map(function (name, i) {
      var cls = i < t.roundIdx || (i === t.roundIdx && t.outcome === "won" && i < TOURNAMENT_ROUND_SIZES.length - 1) ? "done" : i === t.roundIdx ? "active" : "";
      return '<div class="tourney-step ' + cls + '">' + (cls === "done" ? "✓ " : "") + name + '</div>';
    }).join('<div class="tourney-step-arrow">&rarr;</div>') + '</div>';
  }
  function renderTournamentRound() {
    var t = activeTournament;
    $app.innerHTML = '<section class="page"><div class="page-head"><h1>Tournament &mdash; ' + t.roundName + '</h1><p class="dim">' + t.count + ' Legendary Cases each &middot; Round ' + (t.roundIdx + 1) + ' of 3</p></div>' +
      tournamentStepsHtml(t) + battleArenaHtml(t) + '</section>';
  }
  function renderTournamentResult() {
    var t = activeTournament;
    var won = t.outcome === "won";
    var isFinal = t.roundIdx === TOURNAMENT_ROUND_SIZES.length - 1;
    var banner = '<div class="panel battle-result-banner ' + (won ? "win" : "lose") + '"><h2>' + (won ? (isFinal ? "Tournament Champion!" : t.roundName + " won!") : "Eliminated in the " + t.roundName) + '</h2>' +
      '<p class="dim">You: ' + fmtCr(t.playerTotal) + ' &middot; ' + esc(t.botName) + ': ' + fmtCr(t.botTotal) + '</p>' +
      (won ? '<p>Banked so far: ' + t.bankedCount + ' items worth ' + fmtCr(t.bankedValue) + (isFinal ? " — plus a " + fmtCr(TOURNAMENT_CHAMPION_BONUS) + " champion bonus!" : "") + '</p>' : '<p class="dim">You keep everything banked from earlier rounds.</p>') + '</div>';
    $app.innerHTML = '<section class="page"><div class="page-head"><h1>Tournament &mdash; ' + t.roundName + '</h1></div>' +
      tournamentStepsHtml(t) + battleArenaHtml(t, banner) +
      '<button class="btn primary lg" id="tourney-continue-btn" style="margin-top:16px">' + (won ? (isFinal ? "Claim victory" : "Next round: " + TOURNAMENT_ROUND_NAMES[t.roundIdx + 1]) : "Back to Battles") + '</button></section>';
    document.getElementById("tourney-continue-btn").onclick = function () { if (won) advanceTournament(); else exitTournament(); };
  }

  /* ---------- inventory ---------- */
  function renderInventory() {
    var owned = state.inventory.filter(function (i) { return !i.listed; });
    var listed = state.inventory.filter(function (i) { return i.listed; });
    var matching = owned.filter(function (it) {
      var a = D.CATALOG_BY_ID[it.aircraftId]; if (!a) return false;
      if (hangarBulkFilter.rarity && a.rarity !== hangarBulkFilter.rarity) return false;
      if (hangarBulkFilter.skipLivery && it.livery) return false;
      if (hangarBulkFilter.skipLimited && a.legacy) return false;
      return true;
    });
    var matchValue = matching.reduce(function (s, it) { return s + quickSellPriceForItem(it); }, 0);
    $app.innerHTML = '<section class="page"><div class="page-head"><h1>Your Hangar</h1><p class="dim">' + owned.length + " aircraft owned &middot; " + listed.length + " listed for sale &middot; portfolio " + fmtCr(portfolioValue()) + '</p></div>' +
      '<div class="panel"><h3>Bulk sell</h3><div class="filter-bar">' +
      '<select class="input" id="bulk-rarity-select"><option value="">All rarities</option>' + D.RARITIES.map(function (r) { return '<option value="' + r + '"' + (hangarBulkFilter.rarity === r ? " selected" : "") + '>' + rarityMeta(r).label + '</option>'; }).join("") + '</select>' +
      '<label class="check-label"><input type="checkbox" id="bulk-skip-livery"' + (hangarBulkFilter.skipLivery ? " checked" : "") + '> Skip items with a special livery</label>' +
      '<label class="check-label"><input type="checkbox" id="bulk-skip-limited"' + (hangarBulkFilter.skipLimited ? " checked" : "") + '> Skip limited aircraft</label>' +
      '<button class="btn primary" id="bulk-sell-btn" ' + (matching.length ? "" : "disabled") + '>Quick sell ' + matching.length + " item" + (matching.length === 1 ? "" : "s") + " &mdash; " + fmtCr(matchValue) + '</button></div></div>' +
      '<div class="ac-grid">' + (owned.length ? owned.map(inventoryCard).join("") : '<p class="dim empty-note">Your hangar is empty. Open a case or buy something on the marketplace.</p>') + '</div>' +
      (listed.length ? '<h3 class="section-sub">Listed for sale</h3><div class="ac-grid">' + listed.map(inventoryCard).join("") + '</div>' : "") + '</section>';
    document.getElementById("bulk-rarity-select").onchange = function (e) { hangarBulkFilter.rarity = e.target.value; renderInventory(); };
    document.getElementById("bulk-skip-livery").onchange = function (e) { hangarBulkFilter.skipLivery = e.target.checked; renderInventory(); };
    document.getElementById("bulk-skip-limited").onchange = function (e) { hangarBulkFilter.skipLimited = e.target.checked; renderInventory(); };
    document.getElementById("bulk-sell-btn").onclick = function () { bulkQuickSell(matching); };
    document.querySelectorAll("[data-sell]").forEach(function (b) {
      b.onclick = function () { var item = state.inventory.find(function (i) { return i.instanceId === b.getAttribute("data-sell"); }); var a = item && D.CATALOG_BY_ID[item.aircraftId]; if (item && a) openSellModal(item, a); };
    });
    document.querySelectorAll("[data-quicksell]").forEach(function (b) {
      b.onclick = function () { var item = state.inventory.find(function (i) { return i.instanceId === b.getAttribute("data-quicksell"); }); var a = item && D.CATALOG_BY_ID[item.aircraftId]; if (item && a) sellItemInstant(item, a); };
    });
    document.querySelectorAll("[data-cancel]").forEach(function (b) {
      b.onclick = function () { var item = state.inventory.find(function (i) { return i.instanceId === b.getAttribute("data-cancel"); }); if (item) cancelListing(item); };
    });
  }
  function bulkQuickSell(items) {
    if (!items.length) return;
    var total = items.reduce(function (s, it) { return s + quickSellPriceForItem(it); }, 0);
    showModal("Quick sell " + items.length + " aircraft?",
      '<p>This instantly sells all ' + items.length + " matching aircraft for a combined <b>" + fmtCr(total) + "</b>. This can't be undone.</p>",
      [
        { label: "Cancel", cls: "ghost", action: closeModal },
        { label: "Sell them all", cls: "primary", action: function () {
            closeModal();
            var ids = items.map(function (it) { return it.instanceId; });
            var soldValue = 0, soldCount = 0;
            ids.forEach(function (instanceId) {
              var item = state.inventory.find(function (i) { return i.instanceId === instanceId; });
              var a = item && D.CATALOG_BY_ID[item.aircraftId];
              if (!item || !a) return;
              var price = quickSellPriceForItem(item);
              var pl = price - (item.cost || 0);
              state.inventory = state.inventory.filter(function (i) { return i.instanceId !== instanceId; });
              state.credits += price; state.totalEarned += price;
              applyFlip(pl, a.name);
              pushLedger({ t: Date.now(), type: "quicksell", aircraftId: a.id, amount: price, cost: item.cost || 0, pl: pl, rarity: a.rarity });
              soldValue += price; soldCount++;
            });
            snapshotHistory(); save(); updateHud();
            sfx.sell();
            toast("Quick sold " + soldCount + " aircraft for " + fmtCr(soldValue) + ".", "good");
            if (ready) render();
          } },
      ]);
  }

  /* ---------- forge ---------- */
  // Sacrifice several aircraft of one rarity for a guaranteed pull of the
  // next tier up. Stops at ultra on purpose — divine stays exclusive to the
  // golden wheel, never forgeable.
  var FORGE_PATHS = [
    { from: "common", to: "uncommon", need: 8, cost: 50000 },
    { from: "uncommon", to: "rare", need: 8, cost: 400000 },
    { from: "rare", to: "epic", need: 6, cost: 4000000 },
    { from: "epic", to: "legendary", need: 6, cost: 25000000 },
    { from: "legendary", to: "mythic", need: 5, cost: 120000000 },

  /* ---------- admin panel ---------- */
  function adminAddCredits(amount) {
    state.credits += amount;
    save(); updateHud(); renderAdmin();
    toast("Added " + fmtCr(amount) + " to your balance.", "good");
  }
  function adminSetCredits(amount) {
    state.credits = Math.round(amount);
    save(); updateHud(); renderAdmin();
    toast("Credits set to " + fmtCr(amount) + ".", "good");
  }
  function adminOpenCase(caseId, forcedKey) {
    var c = D.CASES_BY_ID[caseId];
    if (!c) return;
    var forcedWon;
    if (forcedKey === "golden") {
      forcedWon = { special: "golden" };
    } else if (forcedKey && forcedKey !== "random") {
      var pool = D.CATALOG.filter(function (a) { return a.rarity === forcedKey; });
      if (!pool.length) { toast("No aircraft of that rarity exist.", "bad"); return; }
      forcedWon = pool[Math.floor(Math.random() * pool.length)];
    }
    openCaseFlow(c, true, forcedWon);
  }
  function adminGrantAircraftCore(aircraftId) {
    var a = D.CATALOG_BY_ID[aircraftId];
    if (!a) return null;
    state.inventory.push({ instanceId: genId(), aircraftId: a.id, acquiredAt: Date.now(), source: "admin", listed: false, cost: 0, livery: D.rollLivery(a.id) });
    var p = state.prices[a.id] || (state.prices[a.id] = { mult: 1, current: null, history: [], minted: 0 });
    p.minted = (p.minted || 0) + 1;
    return a;
  }
  function adminGrantAircraft(aircraftId) {
    var a = adminGrantAircraftCore(aircraftId);
    if (!a) { toast("Pick an aircraft first.", "bad"); return; }
    save(); updateHud();
    toast("Granted " + a.name + ".", "good");
    if (ready) render();
  }
  function adminGrantAll() {
    D.CATALOG.forEach(function (a) { adminGrantAircraftCore(a.id); });
    save(); updateHud();
    toast("Granted one of every aircraft (" + D.CATALOG.length + ").", "good");
    if (ready) render();
  }
  function adminGrantAllLimited() {
    D.LEGACY_CATALOG.forEach(function (a) { adminGrantAircraftCore(a.id); });
    save(); updateHud();
    toast("Granted one of every limited aircraft (" + D.LEGACY_CATALOG.length + ").", "good");
    if (ready) render();
  }
  function adminGrantLivery(value) {
    if (!value) { toast("Pick a livery first.", "bad"); return; }
    var sep = value.indexOf("::");
    var aircraftId = value.slice(0, sep), liveryName = value.slice(sep + 2);
    var a = D.CATALOG_BY_ID[aircraftId];
    if (!a) { toast("Aircraft not found.", "bad"); return; }
    var opts = D.LIVERIES[aircraftId] || [];
    var found = opts.filter(function (o) { return o.name === liveryName; })[0];
    if (!found) { toast("Livery not found.", "bad"); return; }
    state.inventory.push({ instanceId: genId(), aircraftId: a.id, acquiredAt: Date.now(), source: "admin", listed: false, cost: 0, livery: { name: found.name, valuePct: found.valuePct } });
    var p = state.prices[a.id] || (state.prices[a.id] = { mult: 1, current: null, history: [], minted: 0 });
    p.minted = (p.minted || 0) + 1;
    save(); updateHud();
    toast("Granted " + a.name + " — " + found.name + ".", "good");
    if (ready) render();
  }

    return Object.keys(D.LIVERIES).sort(function (x, y) {

    }).map(function (aircraftId) {

  var SEA_DAY = 864e5;
  function easterSunday(y) {
    var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3),
      h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, mo - 1, da);
  }

  /* ---------- banner, logo, countdowns ---------- */
  function paintSeaBar() {

  function paintSeaCountdown() {

  function paintLogo() { var el = document.getElementById("sv-logo-ic"); if (el) el.textContent = decoOn() ? SEA.ic : ""; }

  // The last ten seconds of the year get a big countdown, then a fireworks finale

  /* ---------- music (generated live with Web Audio: no files to download) ---------- */
  var TRACKS = {

    nightflight: { name: "Night Flight", desc: "Slow, dreamy and calm", bpm: 66, ch: [[52, 59, 64, 67], [48, 55, 60, 64], [53, 57, 60, 65], [50, 57, 62, 65]], pad: "triangle", bass: "sine", lead: "sine", walk: [0, 7, 0, 7], lp: 1500, bells: 1, sparse: 1 },

    spring:  { bpm: 96, ch: [[60, 64, 67, 72], [57, 60, 64, 69], [53, 57, 60, 65], [55, 59, 62, 67]], pad: "triangle", bass: "sine", hat: 1, lead: "triangle", walk: [0, 7, 12, 7], bells: 1, lp: 2600 },

    harvest: { bpm: 88, ch: [[55, 59, 62, 67], [52, 55, 59, 64], [48, 52, 55, 60], [50, 54, 57, 62]], pad: "triangle", bass: "triangle", hat: 1, lead: "triangle", walk: [0, 7, 12, 7], lp: 1800, bells: 1 },

    start: function () {

    },
    stop: function () {

      var n = this.node, c = actx;
      if (n && c) {

        setTimeout(function () { try { n.disconnect(); } catch (e) {} }, 900);

      this.node = null; this.filt = null;

    },
    restart: function () { var self = this; this.stop(); this.rt = setTimeout(function () { self.start(); }, 650); },
    setVol: function () { if (this.node && actx) this.node.gain.setTargetAtTime(svSet.vol * 0.55, actx.currentTime, 0.2); },
    sched: function () {
      var c = actx; if (!c || !this.node) return;
      var spb = 60 / this.tr.bpm;
      if (this.next < c.currentTime - 0.2) this.next = c.currentTime + 0.05;   // fell behind (busy tab): skip ahead instead of piling notes up

    },
    play: function (b, t, spb) {
      var tr = this.tr, ch = tr.ch[Math.floor(b / 8) % tr.ch.length], pos = b % 8, self = this;
      var pick = function () { return ch[Math.floor(Math.random() * ch.length)]; };
      if (pos === 0) ch.forEach(function (n) { self.note(n, t, spb * 3.9, tr.pad, 0.035); });
      if (tr.sparse) { if (pos === 0 || pos === 4) this.note(ch[0] - 12, t, spb * 1.8, tr.bass, 0.07); }

      if (tr.theremin && pos === 4 && Math.random() < 0.5) this.glide(ch[0] + 24, t, spb * 3);

    glide: function (m, t, d) {

      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.03, t + 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(this.filt); o.start(t); l.start(t); o.stop(t + d + 0.05); l.stop(t + d + 0.05);

      var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();

  };
  function paintMusicBtn() {
    var b = document.getElementById("music-toggle");
    if (!b) return;

    b.setAttribute("aria-label", b.title);

  // Browsers only allow sound after the player clicks or presses a key, so saved music waits for that.

    var go = function () {

      if (svSet.music) MUS.start();
    };
    document.addEventListener("pointerdown", go, true); document.addEventListener("keydown", go, true);
  }

  /* ---------- the Music & Events window ---------- */
  function trackBtn(k, label, desc, sea) {
    var sel = musicKey() === k, st = sel && MUS.timer ? "♫ playing" : sel ? "selected" : sea ? "⏳ limited" : "";
    return '<button type="button" class="sv-track' + (sel ? " on" : "") + (sea ? " sea" : "") + '" data-track="' + k + '"><span><b>' + esc(label) + '</b><small>' + esc(desc) + '</small></span><span class="t-st">' + st + '</span></button>';
  }
  function openMusicModal() {
    var nx = nextSeason();
    var rows = BASE_TRACKS.map(function (k) { return trackBtn(k, TRACKS[k].name, TRACKS[k].desc, false); }).join("");
    if (SEA) rows += trackBtn("season", SEA.ic + " " + SEA.track.name, SEA.name + " event soundtrack", true);
    var note = SEA
      ? "The " + esc(SEA.track.name) + " track is only here during " + esc(SEA.name) + ". It leaves in <span id=\"sv-track-left\"></span>."
      : "Event soundtracks show up here only while a seasonal event is on." + (nx ? " Next event: " + nx.ic + " " + esc(nx.name) + " in <span id=\"sv-next-left\"></span>." : "");
    var body = '<div class="sv-set" id="sv-music-modal">' +
      '<h4>Music</h4><div class="sv-switch"><span>Background music<small>Made live in your browser, nothing to download.</small></span>' +
      '<button type="button" class="btn small' + (svSet.music ? " primary" : "") + '" id="sv-music-on">' + (svSet.music ? "On" : "Off") + '</button></div>' +
      '<label class="field-label" for="sv-vol">Music volume</label><input type="range" class="sv-range" id="sv-vol" min="0" max="100" value="' + Math.round(svSet.vol * 100) + '">' +
      '<h4>Pick a track</h4><div class="sv-tracks">' + rows + '</div><p class="dim small">' + note + '</p>' +
      '<h4>Seasonal events</h4><div class="sv-switch"><span>Decorations &amp; effects<small>Themes, scenery, particles and bonus catches.</small></span>' +
      '<button type="button" class="btn small' + (svSet.deco ? " primary" : "") + '" id="sv-deco-on">' + (svSet.deco ? "On" : "Off") + '</button></div>' +
      '</div>';
    showModal("Music & Events", body, [{ label: "Done", cls: "primary", action: closeModal }]);
    document.getElementById("sv-music-on").onclick = function () {
      svSet.music = !svSet.music; saveSvSet();
      if (svSet.music) MUS.start(); else MUS.stop();
      openMusicModal();
    };
    document.getElementById("sv-vol").oninput = function (e) { svSet.vol = clamp(e.target.value / 100, 0, 1); saveSvSet(); MUS.setVol(); };
    document.querySelectorAll("#sv-music-modal [data-track]").forEach(function (b) {
      b.onclick = function () {
        var k = b.getAttribute("data-track"), changed = k !== musicKey();

        setTimeout(function () { if (document.getElementById("sv-music-modal")) openMusicModal(); }, 750);   // show "playing" once it starts

  function paintMusicModalTimes() {
    var now = Date.now(), a = document.getElementById("sv-track-left"), b = document.getElementById("sv-next-left");
    if (a && SEA) a.textContent = fmtLeft(SEA.end - now);
    if (b) { var nx = nextSeason(); if (nx) b.textContent = fmtLeft(nx.start - now); }
  }

  /* ---------- admin panel: preview any event ---------- */
  function adminSeaOptions() {
    var cur = seaOverride && !seaOverride.temp ? seaOverride.id : "";
    return '<option value="">Automatic (real calendar)</option><option value="none"' + (cur === "none" ? " selected" : "") + '>Off</option>' +
      SEASONS.map(function (s) { return '<option value="' + s.id + '"' + (cur === s.id ? " selected" : "") + '>' + s.ic + ' ' + esc(s.name) + '</option>'; }).join("");
  }
  function adminSeaStatus() {
    var r = realSeason(new Date()), nx = nextSeason(), now = Date.now();
    var real = r ? "Real calendar: " + r.ic + " " + esc(r.name) + " is on, ends in " + fmtLeft(r.end - now) + "."

    if (seaOverride && seaOverride.id === "none") return "Events are switched off. " + real;
    if (SEA && SEA.preview) return "Previewing " + SEA.ic + " " + esc(SEA.name) + ". " + real;
    return real;
  }

    toast(v === "none" ? "Seasonal events switched off." : v ? "Previewing " + seasonById(v).name + "." : "Back to the real calendar.", "good");
    var st = document.getElementById("admin-sea-status"); if (st) st.innerHTML = adminSeaStatus();
  }

  /* ---------- switching events on and off ---------- */

    var prev = SEA && SEA.id;
    SEA = seasonNow();
    var h = document.documentElement, on = decoOn();
    if (on) h.setAttribute("data-season", SEA.id); else h.removeAttribute("data-season");
    h.style.setProperty("--sea-solid", SEA ? SEA.solid : "#4fd8ff");

    AMB.set(on && !reduceMotion ? SEA.amb : null);
    paintSeaBar(); paintLogo(); scheduleCollect();
