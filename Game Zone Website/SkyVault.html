  function runRevealSequence(caseDef, won, item, onDone) {
    var instant = reduceMotion || quickMode;
    var overlay = document.getElementById("reveal-overlay");
    overlay.classList.add("active");
    var pool = D.casePool(caseDef);
    if (!pool.length) pool = D.CATALOG;
    var R = D.RARITIES, wonIdx = R.indexOf(won.rarity), teasers = [];
    if (wonIdx < R.indexOf("legendary")) teasers = pool.filter(function (a) { return R.indexOf(a.rarity) >= R.indexOf("legendary"); });
    if (caseDef.weights.golden > 0 && won.rarity !== "ultra") teasers.push("GOLD");
    var rm = rarityMeta(won.rarity), intensity = RARITY_INTENSITY[won.rarity] || 0;
    spinReel(overlay, { label: esc(caseDef.name), target: won, pool: pool, teasers: teasers, instant: instant,
      teaseColor: intensity >= 3 ? rm.color : null,
      onLand: function (ctx) {
        landEffects(ctx, won, overlay);
        var show = function () { showRevealResult(ctx, won, item, function () { closeReveal(onDone); }); };
        if (intensity >= 3 && !instant) playCinematic(ctx, won, show);
        else setTimeout(show, intensity >= 2 ? 650 : 150);
      } });
  }

  // The golden bonus wheel: landing the "???" slot in a normal case pulls up a
  // second, all-gold reel spun from every Ultra aircraft plus the two Divine
  // aircraft — the only way Divine aircraft can ever be won.
  function runGoldenSequence(caseDef, cost, onDone) {
    var instant = reduceMotion || quickMode;
    var overlay = document.getElementById("reveal-overlay");
    overlay.classList.add("active");
    // Bug fix: the prize used to be granted only after both reels finished,
    // so closing the tab mid-animation lost a paid golden pull. It's rolled
    // and banked up front now; the reels just reveal it.
    var won2 = D.openGolden();
    holdHud();
    var item = grantCaseItem(caseDef, won2, -(cost || 0), ":golden");
    save(); updateHud(); renderTicker();
    var decoyPool = D.CATALOG.filter(function (a) { return a.rarity === "epic" || a.rarity === "legendary" || a.rarity === "mythic" || a.rarity === "ultra"; });
    spinReel(overlay, { label: "A golden pull is forming&hellip;", labelColor: "#ffd700", target: "GOLD", pool: decoyPool, len: 40, instant: instant, teaseColor: "#ffd700",
      onLand: function (ctx) {
        if (ctx.card) ctx.card.classList.add("hit");
        sfx.goldenHit();
        if (!reduceMotion) {
          overlay.classList.add("flash-golden");
          runParticles(ctx.canvas, "#ffd700", 6);
          ctx.stage.classList.add("shake");
          var glow = document.createElement("div"); glow.className = "golden-burst-glow"; ctx.stage.appendChild(glow);
          var ring1 = document.createElement("div"); ring1.className = "golden-burst"; ctx.stage.appendChild(ring1);
          var ring2 = document.createElement("div"); ring2.className = "golden-burst"; ring2.style.animationDelay = "0.12s"; ctx.stage.appendChild(ring2);
        }
        var tk = revealToken;
        setTimeout(function () { if (tk === revealToken) startBonusWheel(); }, instant ? 150 : 1000);
      } });
    function startBonusWheel() {
      overlay.classList.remove("flash-golden");
      var pools = D.goldenPool(), fullPool = pools.ultras.concat(pools.divines);
      if (!fullPool.length) fullPool = [won2];
      var isDivine = won2.rarity === "divine", rm2 = rarityMeta(won2.rarity);
      spinReel(overlay, { label: "GOLDEN WHEEL", labelColor: "#ffd700", viewportCls: "golden-wheel", cardCls: "golden-card", target: won2, pool: fullPool,
        teasers: isDivine ? null : pools.divines, nearMissChance: 0.5, len: Math.max(24, fullPool.length * 4), duration: 5.2, spinSfx: "golden", instant: instant, teaseColor: rm2.color,
        onLand: function (ctx) {
          if (isDivine) sfx.divineReveal(); else sfx.reveal("ultra");
          if (!reduceMotion) {
            overlay.classList.add(isDivine ? "flash-divine" : "flash-ultra");
            runParticles(ctx.canvas, rm2.color, isDivine ? 8 : 5);
            ctx.stage.classList.add(isDivine ? "shake-divine" : "shake");
          }
          var show = function () { showRevealResult(ctx, won2, item, function () { closeReveal(onDone); }, { rays: true }); };
          if (!instant) playCinematic(ctx, won2, show); else setTimeout(show, 150);
        } });
    }
  }

  /* ---------- bulk open (x10) ---------- */
  // Opens several cases at once. Ordinary pulls resolve instantly (watching
  // ten full reel spins back to back isn't practical) and land in a results
  // modal, but a golden/divine hit always gets its full animated moment —
  // bulk speed never gets to swallow the rare stuff.
  function bulkOpenCaseFlow(caseDef, count) {
    if (caseDef.id === "doorbuster") { toast("Doorbusters open one at a time.", "bad"); return; }
    var price = casePrice(caseDef);
    var totalCost = price * count;
    if (state.credits < totalCost) { toast("Not enough credits to open " + count + " at once.", "bad"); return; }
    var results = [];
    for (var i = 0; i < count; i++) {
      var w = D.openCase(caseDef);
      if (!w) break;
      results.push(w);
    }
    if (!results.length) { toast("That case has nothing left to pull from.", "bad"); return; }
    var actualCost = price * results.length;
    state.credits -= actualCost;
    state.totalSpent += actualCost;
    sfx.caseOpen();

    var normals = [], goldens = [];
    results.forEach(function (w) { (w.special === "golden" ? goldens : normals).push(w); });

    var summary = normals.map(function (w) { return { aircraft: D.CATALOG_BY_ID[w.id], item: grantCaseItem(caseDef, w, -price) }; });
    save(); updateHud(); renderTicker();
    if (summary.length) showBulkSummary(caseDef, summary, goldens.length);

    function playNextGolden() {
      if (!goldens.length) { if (ready) render(); return; }
      goldens.shift();
      // Bug fix: golden pulls from a bulk open were recorded as free (cost 0),
      // which made their profit/loss look far better than it was.
      runGoldenSequence(caseDef, price, playNextGolden);
    }
    if (goldens.length) setTimeout(playNextGolden, summary.length ? 500 : 0);
  }
  function showBulkSummary(caseDef, results, goldenCount) {
    var totalValue = results.reduce(function (s, r) { return s + itemValue(r.item); }, 0);
    var rows = results.slice().sort(function (a, b) { return D.RARITIES.indexOf(b.aircraft.rarity) - D.RARITIES.indexOf(a.aircraft.rarity); })
      .map(function (r) {
        var rm = rarityMeta(r.aircraft.rarity);
        return '<div class="bulk-row"><span class="tag" style="color:' + rm.color + ';border-color:' + rm.color + '">' + rm.label + '</span>' +
          '<span class="bulk-name">' + esc(r.aircraft.name) + (r.item.livery ? " " + liveryBadge(r.item.livery) : "") + '</span><span class="bulk-price">' + fmtCr(itemValue(r.item)) + '</span></div>';
      }).join("");
    var note = goldenCount ? '<p class="dim small" style="margin-top:10px">Plus ' + goldenCount + ' Golden Wheel pull' + (goldenCount > 1 ? "s" : "") + " coming up next&hellip;</p>" : "";
    showModal("Opened " + results.length + "× " + caseDef.name,
      '<div class="bulk-results">' + rows + '</div><p class="dim small" style="margin-top:10px">Total value: ' + fmtCr(totalValue) + '</p>' + note,
      [{ label: "Nice!", cls: "primary", action: function () { closeModal(); if (ready) render(); } }]);
  }

  /* ---------- auto-open ---------- */
  var autoOpenCaseId = null, autoOpenTimer = null, autoOpenCount = 0;
  var AUTO_OPEN_LIMIT = 300;
  function updateAutoOpenBanner() {
    var el = document.getElementById("auto-open-banner");
    if (!el) return;
    if (!autoOpenCaseId) { el.style.display = "none"; el.innerHTML = ""; return; }
    var c = D.CASES_BY_ID[autoOpenCaseId];
    el.style.display = "flex";
    el.innerHTML = "Auto-opening <b>" + esc(c ? c.name : "case") + "</b> &middot; " + autoOpenCount + ' opened <button id="auto-open-stop-btn">Stop</button>';
    var stopBtn = document.getElementById("auto-open-stop-btn");
    if (stopBtn) stopBtn.onclick = function () { stopAutoOpen("Auto-open stopped."); };
  }
  function stopAutoOpen(reason) {
    if (autoOpenTimer) { clearTimeout(autoOpenTimer); autoOpenTimer = null; }
    var wasActive = !!autoOpenCaseId;
    autoOpenCaseId = null;
    if (wasActive && reason) toast(reason + " (" + autoOpenCount + " opened)", "");
    autoOpenCount = 0;
    updateAutoOpenBanner();
    if (ready) render();
  }
  function startAutoOpen(caseDef) {
    if (autoOpenCaseId === caseDef.id) { stopAutoOpen("Auto-open stopped."); return; }
    if (autoOpenCaseId) stopAutoOpen(null);
    if (caseDef.id === "doorbuster") { toast("Doorbusters open one at a time.", "bad"); return; }
    if (state.credits < casePrice(caseDef)) { toast("Not enough credits.", "bad"); return; }
    autoOpenCaseId = caseDef.id;
    autoOpenCount = 0;
    updateAutoOpenBanner();
    if (ready) render();
    autoOpenStep(caseDef);
  }
  function autoOpenStep(caseDef) {
    if (autoOpenCaseId !== caseDef.id) return;
    if (autoOpenCount >= AUTO_OPEN_LIMIT) { stopAutoOpen("Auto-open safety limit reached."); return; }
    var price = casePrice(caseDef);
    if (state.credits < price) { stopAutoOpen("Ran out of credits."); return; }
    var won = D.openCase(caseDef);
    if (!won) { stopAutoOpen("Nothing left to pull from."); return; }
    sfx.caseOpen();
    state.credits -= price;
    state.totalSpent += price;
    autoOpenCount++;
    updateAutoOpenBanner();
    if (won.special === "golden") {
      // Always pause for a golden/divine moment — too big to blow past automatically.
      stopAutoOpen(null);
      runGoldenSequence(caseDef, price);
      return;
    }
    grantCaseItem(caseDef, won, -price);
    save(); updateHud(); renderTicker();
    // Auto-open never waits on a click — every ordinary pull auto-keeps itself
    // and moves straight on, so Stop (on the page or the banner) always stays
    // reachable. Only golden/divine pauses the whole loop, above.
    toast("Got " + won.name + " (" + rarityMeta(won.rarity).label + ")", "good");
    autoOpenTimer = setTimeout(function () { autoOpenStep(caseDef); }, 350);
  }

  function runParticles(canvas, color, intensity) {
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr; ctx.scale(dpr, dpr);
    var count = 40 + intensity * 30, parts = [];
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * Math.PI * 2, speed = 2 + Math.random() * (3 + intensity * 1.5);
      parts.push({ x: w / 2, y: h / 2, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed - 1, life: 60 + Math.random() * 40, age: 0, size: 2 + Math.random() * (2 + intensity) });
    }
    var start = performance.now(), duration = 1600 + intensity * 200;
    function frame(now) {
      var elapsed = now - start;
      ctx.clearRect(0, 0, w, h);
      parts.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.age++;
        var a = Math.max(0, 1 - p.age / p.life);
        ctx.globalAlpha = a; ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      if (elapsed < duration) requestAnimationFrame(frame); else ctx.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- sell / buy / quick sell ---------- */
  function openSellModal(item, aircraft) {
    var cur = state.inventory.find(function (i) { return i.instanceId === item.instanceId; });
    if (!cur) { toast("That aircraft isn't in your hangar any more.", "bad"); return; }
    if (cur.locked) { toast(aircraft.name + " is locked. Unlock it in your hangar first.", "bad"); return; }
    if (cur.listed) { toast("That aircraft is already listed.", "bad"); return; }
    item = cur;
    var market = itemValue(item);
    var liveryNote = item.livery ? '<p class="dim small">Livery: <b style="color:var(--credit)">' + esc(item.livery.name) + '</b> (+' + item.livery.valuePct + '% value)</p>' : "";
    showModal("List " + aircraft.name,
      '<div class="modal-sell">' + liveryNote + '<p class="dim">Current market price: <b>' + fmtCr(market) + '</b></p>' +
      '<label class="field-label">Your asking price</label>' +
      '<input type="number" id="sell-price" class="input" min="1" step="1" value="' + Math.round(market) + '"></div>',
      [
        { label: "Cancel", cls: "ghost", action: closeModal },
        { label: "List for sale", cls: "primary", action: function () {
            var val = parseInt(document.getElementById("sell-price").value, 10);
            if (!val || val <= 0) { toast("Enter a valid asking price.", "bad"); return; }
            closeModal(); listItem(item, aircraft, val);
          } },
      ]);
  }
  function listItem(item, aircraft, price) {
    state.inventory = state.inventory.map(function (i) { return i.instanceId === item.instanceId ? Object.assign({}, i, { listed: true }) : i; });
    state.listings.push({ id: genId(), aircraftId: aircraft.id, price: price, sellerName: state.callsign, listedAt: Date.now(), mine: true, instanceId: item.instanceId, livery: item.livery || null });
    sfx.list();
    save(); toast("Listed " + aircraft.name + " for " + fmtCr(price) + ".", "good");
    if (ready) render();
  }
  function cancelListing(item) {
    state.listings = state.listings.filter(function (l) { return l.instanceId !== item.instanceId; });
    state.inventory = state.inventory.map(function (i) { return i.instanceId === item.instanceId ? Object.assign({}, i, { listed: false }) : i; });
    sfx.cancel();
    save(); toast("Listing cancelled.", ""); if (ready) render();
  }
  function buyListing(listing) {
    if (listing.mine) { toast("That's your own listing.", "bad"); return; }
    if (state.credits < listing.price) { toast("Not enough credits.", "bad"); return; }
    var aircraft = D.CATALOG_BY_ID[listing.aircraftId];
    if (!aircraft) return;
    sfx.buy();
    state.listings = state.listings.filter(function (l) { return l.id !== listing.id; });
    state.credits -= listing.price;
    state.totalSpent += listing.price;
    state.inventory.push({ instanceId: genId(), aircraftId: aircraft.id, acquiredAt: Date.now(), source: "market", listed: false, cost: listing.price, livery: listing.livery || null });
    recordTradePrice(aircraft, listing.price, listing.livery);
    pushLedger({ t: Date.now(), type: "buy", aircraftId: aircraft.id, amount: -listing.price, rarity: aircraft.rarity });
    pushActivity({ type: "trade", aircraftId: aircraft.id, price: listing.price, t: Date.now() });
    snapshotHistory(); save(); updateHud();
    toast("Bought " + aircraft.name + " for " + fmtCr(listing.price) + " from " + listing.sellerName + "!", "good");
    if (ready) render();
  }
  function sellItemInstant(item, aircraft) {
    var cur = state.inventory.find(function (i) { return i.instanceId === item.instanceId; });
    if (!cur || cur.listed) { toast("That aircraft isn't available to sell.", "bad"); return; }
    if (cur.locked) { toast(aircraft.name + " is locked. Unlock it in your hangar first.", "bad"); return; }
    item = cur;
    var price = quickSellPriceForItem(item);
    var pl = price - (item.cost || 0);
    sfx.sell();
    state.inventory = state.inventory.filter(function (i) { return i.instanceId !== item.instanceId; });
    state.credits += price; state.totalEarned += price;
    applyFlip(pl, aircraft.name);
    pushLedger({ t: Date.now(), type: "quicksell", aircraftId: aircraft.id, amount: price, cost: item.cost || 0, pl: pl, rarity: aircraft.rarity });
    snapshotHistory(); save(); updateHud();
    toast("Quick sold " + aircraft.name + " for " + fmtCr(price) + ".", "good");
    if (ready && !hangarPatch(item.instanceId, true)) render();
  }

  /* ---------- battles ---------- */
  var BATTLE_MAX_CASES = 20;
  var battleView = "lobby"; // "lobby" | "arena" | "result"
  var activeBattle = null;
  var battleSelection = { caseId: D.CASES[0].id, count: 5 };

  function resolveBattlePull(caseDef) {
    var w = D.openCase(caseDef);
    if (w && w.special === "golden") w = D.openGolden();
    if (!w) w = D.CATALOG[Math.floor(Math.random() * D.CATALOG.length)];
    return { aircraft: w, livery: D.rollLivery(w.id) };
  }
  function grantBattleItem(r) {
    var item = { instanceId: genId(), aircraftId: r.aircraft.id, acquiredAt: Date.now(), source: "battle", listed: false, cost: 0, livery: r.livery };
    state.inventory.push(item);
    var p = state.prices[r.aircraft.id] || (state.prices[r.aircraft.id] = { mult: 1, current: null, history: [], minted: 0 });
    p.minted = (p.minted || 0) + 1;
    pushActivity({ type: "unlock", aircraftId: r.aircraft.id, rarity: r.aircraft.rarity, who: state.callsign, t: Date.now() });
  }
  function startBattle(caseDef, count, botName) {
    count = Math.max(1, Math.min(BATTLE_MAX_CASES, Math.round(count)));
    var cost = casePrice(caseDef) * count;
    if (state.credits < cost) { toast("Not enough credits for that battle.", "bad"); return; }
    state.credits -= cost;
    state.totalSpent += cost;
    state.battleStats.wagered += cost;
    activeBattle = {
      caseDef: caseDef, count: count, botName: botName || pickBotName(), cost: cost,
      playerResults: [], botResults: [], playerTotal: 0, botTotal: 0, revealed: 0, playerWon: null,
    };
    // Bug fix: every pull used to be rolled during the animation and the prize
    // paid at the very end, so leaving mid-battle lost the whole entry fee. The
    // battle is now settled the moment it starts; the reveal only plays it back.
    var allP = [], allB = [], pt = 0, bt = 0;
    for (var i = 0; i < count; i++) {
      var pr = resolveBattlePull(caseDef), br = resolveBattlePull(caseDef);
      allP.push(pr); allB.push(br);
      pt += valueWithLivery(pr.aircraft.id, pr.livery); bt += valueWithLivery(br.aircraft.id, br.livery);
    }
    activeBattle.allP = allP; activeBattle.allB = allB;
    holdHud(60000);
    settleBattle(activeBattle, pt, bt);
    save(); updateHud(); renderTicker();
    battleView = "arena";
    render();
    runBattleReveal(activeBattle);
  }
  function settleBattle(b, pt, bt) {
    var playerWon = state.adminAlwaysWinBattles || pt >= bt;
    b.playerWon = playerWon;
    if (playerWon) {
      b.allP.concat(b.allB).forEach(grantBattleItem);
      state.battleStats.wins++;
      state.battleStats.won += pt + bt;
      if (b.caseDef.id === "legendary") state.battleStats.legendaryWinsSinceTournament = (state.battleStats.legendaryWinsSinceTournament || 0) + 1;
    } else state.battleStats.losses++;
  }
  function runBattleReveal(b) {
    sfx.caseOpen();
    var step = 0;
    function revealNext() {
      if (activeBattle !== b) return;
      if (step >= b.count) { finishBattle(b); return; }
      var pr = b.allP[step], br = b.allB[step];
      b.playerResults.push(pr); b.botResults.push(br);
      b.playerTotal += valueWithLivery(pr.aircraft.id, pr.livery);
      b.botTotal += valueWithLivery(br.aircraft.id, br.livery);
      b.revealed = step + 1;
      var topIntensity = Math.max(RARITY_INTENSITY[pr.aircraft.rarity] || 0, RARITY_INTENSITY[br.aircraft.rarity] || 0);
      // Bug fix: this used to re-render (and play sounds on) whatever page you were on,
      // twice a second, even after you'd left the Battles page.
      var here = onBattlesPage();
      if (here) { sfx.reveal(topIntensity >= 5 ? "ultra" : topIntensity >= 3 ? "legendary" : topIntensity >= 2 ? "epic" : "common"); renderKeepScroll(); }
      step++;
      setTimeout(revealNext, here ? 550 : 0);
    }
    revealNext();
  }
  function finishBattle(b) {
    releaseHud();
    battleView = "result";
    if (!onBattlesPage()) { toast("⚔ Battle vs " + b.botName + " finished: you " + (b.playerWon ? "won!" : "lost.") + " Open Battles to see it.", b.playerWon ? "good" : ""); return; }
    if (b.playerWon) sfx.reveal("legendary"); else sfx.bad();
    render();
  }
  function onBattlesPage() { return ready && route().name === "battles"; }
  function emptyBattleSlots(n) { var html = ""; for (var i = 0; i < n; i++) html += '<div class="battle-item-card empty"></div>'; return html; }
  function battleItemCard(r) {
    var a = r.aircraft, rm = rarityMeta(a.rarity);
    var special = (a.rarity === "ultra" || a.rarity === "divine") ? " special" : "";
    var val = valueWithLivery(a.id, r.livery);
    return '<div class="battle-item-card' + special + '" style="--rc:' + rm.color + '"><div class="b-rarity" style="color:' + rm.color + '">' + rm.label + '</div>' +
      '<div class="b-name">' + esc(a.name) + '</div>' + (r.livery ? '<div class="b-livery">' + liveryBadge(r.livery) + '</div>' : "") +
      '<div class="b-price">' + fmtCr(val) + '</div></div>';
  }
  function renderBattles() {
    if (battleView === "arena" && activeBattle) return renderBattleArena();
    if (battleView === "result" && activeBattle) return renderBattleResult();
    if (battleView === "tournament" && activeTournament) return renderTournamentRound();
    if (battleView === "tournament-result" && activeTournament) return renderTournamentResult();
    renderBattleLobby();
  }
  function battleLobbyRow(b) {

      '<div class="battle-lobby-info"><b>' + esc(b.botName) + '</b><span class="dim"> wants to battle &middot; ' + b.count + '× ' + esc(c.name) + '</span></div>' +
      '<button class="btn primary small" data-join-battle="' + b.id + '">Join &mdash; ' + fmtCr(cost) + '</button></div>';
  }
  function renderBattleLobby() {
    var stats = state.battleStats;
    var selCase = D.CASES_BY_ID[battleSelection.caseId] || D.CASES[0];

    $app.innerHTML = '<section class="page"><div class="page-head"><h1>Battles</h1><p class="dim">Open cases head-to-head against a bot. Highest total value takes everything &mdash; the loser walks away empty-handed.</p></div>' +
      '<div class="stat-cards">' +
      statCard("Battles won", stats.wins) + statCard("Battles lost", stats.losses) +

      '<div class="panel"><h3>Start a battle</h3><div class="filter-bar">' +
      '<select class="input" id="battle-case-select">' + D.CASES.map(function (c) { return '<option value="' + c.id + '"' + (battleSelection.caseId === c.id ? " selected" : "") + '>' + esc(c.name) + " — " + fmtCr(casePrice(c)) + '</option>'; }).join("") + '</select>' +
      '<input class="input" id="battle-count-input" type="number" min="1" max="' + BATTLE_MAX_CASES + '" value="' + battleSelection.count + '" style="max-width:110px">' +
      '<button class="btn primary" id="battle-create-btn">Start battle &mdash; ' + fmtCr(createCost) + '</button></div>' +
      '<p class="dim small">Up to ' + BATTLE_MAX_CASES + ' cases per battle. You and the bot each open the same case the same number of times.</p></div>' +
      '<div class="panel"><h3>Open battles (' + state.openBattles.length + ')</h3>' +
      (state.openBattles.length ? '<div class="battle-lobby-list">' + state.openBattles.map(battleLobbyRow).join("") : '<p class="dim">No open battles right now &mdash; check back soon, or start your own.</p>') + '</div>' +
      tournamentPanelHtml() +
      '</section>';
    var caseSel = document.getElementById("battle-case-select");
    var countInput = document.getElementById("battle-count-input");
    if (caseSel) caseSel.onchange = function (e) { battleSelection.caseId = e.target.value; renderBattleLobby(); };
    if (countInput) countInput.onchange = function (e) { battleSelection.count = clamp(parseInt(e.target.value, 10) || 1, 1, BATTLE_MAX_CASES); renderBattleLobby(); };
    var createBtn = document.getElementById("battle-create-btn");
    if (createBtn) createBtn.onclick = function () { startBattle(selCase, battleSelection.count, null); };
    var tourneyBtn = document.getElementById("tourney-enter-btn");
    if (tourneyBtn) tourneyBtn.onclick = startTournament;
    document.querySelectorAll("[data-join-battle]").forEach(function (b) {
      b.onclick = function () {
        var idx = state.openBattles.findIndex(function (x) { return x.id === b.getAttribute("data-join-battle"); });
        if (idx === -1) return;
        var entry = state.openBattles[idx];
        var c = D.CASES_BY_ID[entry.caseId];
        if (!c) return;
        if (state.credits < casePrice(c) * entry.count) { toast("Not enough credits to join that battle.", "bad"); return; }
        state.openBattles.splice(idx, 1);
        startBattle(c, entry.count, entry.botName);
      };
    });
  }
  function battleArenaHtml(b, resultBanner) {
    return '<div class="battle-arena">' +
      '<div class="battle-col"><div class="battle-col-header you"><span>YOU</span><span class="battle-total">' + fmtCr(b.playerTotal) + '</span></div>' +
      '<div class="battle-items">' + b.playerResults.map(battleItemCard).join("") + emptyBattleSlots(b.count - b.playerResults.length) + '</div></div>' +
      '<div class="battle-vs">VS</div>' +
      '<div class="battle-col"><div class="battle-col-header them"><span>' + esc(b.botName) + '</span><span class="battle-total">' + fmtCr(b.botTotal) + '</span></div>' +
      '<div class="battle-items">' + b.botResults.map(battleItemCard).join("") + emptyBattleSlots(b.count - b.botResults.length) + '</div></div>' +
      '</div>' + (resultBanner || '<div class="panel"><p class="dim">Opened ' + b.revealed + " / " + b.count + '</p></div>');
  }
  function renderBattleArena() {
    var b = activeBattle;
    $app.innerHTML = '<section class="page"><div class="page-head"><h1>Battle &mdash; ' + esc(b.caseDef.name) + '</h1><p class="dim">' + b.count + ' cases each &middot; ' + fmtCr(b.cost) + ' entry</p></div>' +
      battleArenaHtml(b) + '</section>';
  }
  function renderBattleResult() {
    var b = activeBattle;
    var pot = b.playerTotal + b.botTotal;
    var banner = '<div class="panel battle-result-banner ' + (b.playerWon ? "win" : "lose") + '"><h2>' + (b.playerWon ? "You won!" : "You lost") + '</h2>' +
      '<p class="dim">You: ' + fmtCr(b.playerTotal) + ' &middot; ' + esc(b.botName) + ': ' + fmtCr(b.botTotal) + '</p>' +
      (b.playerWon ? '<p>You keep all ' + (b.playerResults.length + b.botResults.length) + ' items &mdash; worth ' + fmtCr(pot) + ' total.</p>' : '<p class="dim">Better luck next time.</p>') + '</div>';
    $app.innerHTML = '<section class="page"><div class="page-head"><h1>Battle Result</h1></div>' +
      battleArenaHtml(b, banner) +
      '<button class="btn primary lg" id="battle-done-btn" style="margin-top:16px">Back to Battles</button></section>';
    document.getElementById("battle-done-btn").onclick = function () { activeBattle = null; battleView = "lobby"; render(); };
  }

  /* ---------- tournament ---------- */
  var TOURNAMENT_UNLOCK_LEGENDARY_WINS = 20;
  var TOURNAMENT_ENTRY_COST = 12000000;
  var TOURNAMENT_ROUND_SIZES = [6, 8, 12];
  var TOURNAMENT_ROUND_NAMES = ["Quarterfinal", "Semifinal", "Final"];
  var TOURNAMENT_CHAMPION_BONUS = 5000000;
  var activeTournament = null;
  function tournamentUnlocked() {
    return (state.battleStats.legendaryWinsSinceTournament || 0) >= TOURNAMENT_UNLOCK_LEGENDARY_WINS;
  }
  function tournamentPanelHtml() {
    if (tournamentUnlocked()) {
      var canAfford = state.credits >= TOURNAMENT_ENTRY_COST;
      return '<div class="panel tourney-panel"><h3>🏆 8-Player Tournament</h3>' +
        '<p class="dim">Single elimination, 3 rounds of escalating Legendary Case battles (6 → 8 → 12 cases). Win a round and you keep everything from it; lose, and you keep what you’ve already banked.</p>' +
        '<button class="btn primary lg" id="tourney-enter-btn" ' + (canAfford ? "" : "disabled") + '>Enter Tournament &mdash; ' + fmtCr(TOURNAMENT_ENTRY_COST) + '</button>' +
        (canAfford ? "" : '<p class="dim small">Not enough credits.</p>') +
        '<p class="dim small">Win or lose, the gate relocks after this attempt &mdash; you\'ll need ' + TOURNAMENT_UNLOCK_LEGENDARY_WINS + ' more Legendary Case wins to re-enter.</p>' +
        (state.battleStats.tournamentsWon ? '<p class="dim small">Tournaments won: ' + state.battleStats.tournamentsWon + '</p>' : "") + '</div>';
    }
    var w = Math.min(state.battleStats.legendaryWinsSinceTournament || 0, TOURNAMENT_UNLOCK_LEGENDARY_WINS);
    return '<div class="panel tourney-panel locked"><h3>🔒 8-Player Tournament</h3>' +
      '<p class="dim">Win ' + TOURNAMENT_UNLOCK_LEGENDARY_WINS + ' normal Legendary Case battles to unlock. The gate resets after every tournament attempt, win or lose.</p>' +
      '<div class="tourney-progress"><div class="tourney-progress-row"><span>Legendary Case battles won</span><b>' + w + ' / ' + TOURNAMENT_UNLOCK_LEGENDARY_WINS + '</b></div></div></div>';
  }
  function startTournament() {
    if (!tournamentUnlocked()) { toast("Tournament is still locked.", "bad"); return; }
    if (state.credits < TOURNAMENT_ENTRY_COST) { toast("Not enough credits for the tournament entry.", "bad"); return; }
    state.credits -= TOURNAMENT_ENTRY_COST;
    state.totalSpent += TOURNAMENT_ENTRY_COST;
    // Bug fix: the gate only relocked when you pressed the final button, so
    // reloading mid-tournament left it open for a free extra attempt.
    state.battleStats.legendaryWinsSinceTournament = 0;
    save(); updateHud();
    activeTournament = { roundIdx: 0, bankedCount: 0, bankedValue: 0 };
    battleView = "tournament";
    runTournamentRound();
  }
  function runTournamentRound() {
    var t = activeTournament;
    var caseDef = D.CASES_BY_ID.legendary;
    t.caseDef = caseDef;
    t.count = TOURNAMENT_ROUND_SIZES[t.roundIdx];
    t.roundName = TOURNAMENT_ROUND_NAMES[t.roundIdx];
    t.botName = pickBotName();
    t.playerResults = []; t.botResults = []; t.playerTotal = 0; t.botTotal = 0; t.revealed = 0; t.outcome = null;
    // Settled up front (same fix as normal battles), the reveal just plays it back.
    var allP = [], allB = [], pt = 0, bt = 0;
    for (var i = 0; i < t.count; i++) {
      var p0 = resolveBattlePull(caseDef), b0 = resolveBattlePull(caseDef);
      allP.push(p0); allB.push(b0);
      pt += valueWithLivery(p0.aircraft.id, p0.livery); bt += valueWithLivery(b0.aircraft.id, b0.livery);
    }
    t.pendingWon = state.adminAlwaysWinBattles || pt >= bt;
    holdHud(60000);
    if (t.pendingWon) {
      allP.concat(allB).forEach(grantBattleItem);
      t.bankedCount += allP.length + allB.length;
      t.bankedValue += pt + bt;
      if (t.roundIdx >= TOURNAMENT_ROUND_SIZES.length - 1) {
        state.credits += TOURNAMENT_CHAMPION_BONUS;
        state.battleStats.tournamentsWon = (state.battleStats.tournamentsWon || 0) + 1;
      }
    }
    save(); updateHud(); renderTicker();
    battleView = "tournament";
    render();
    sfx.caseOpen();
    var step = 0;
    function revealNext() {
      if (activeTournament !== t) return;
      if (step >= t.count) { finishTournamentRound(t); return; }
      var pr = allP[step], br = allB[step];
      t.playerResults.push(pr); t.botResults.push(br);
      t.playerTotal += valueWithLivery(pr.aircraft.id, pr.livery);
      t.botTotal += valueWithLivery(br.aircraft.id, br.livery);
      t.revealed = step + 1;
      var topIntensity = Math.max(RARITY_INTENSITY[pr.aircraft.rarity] || 0, RARITY_INTENSITY[br.aircraft.rarity] || 0);
      var here = onBattlesPage();
      if (here) { sfx.reveal(topIntensity >= 5 ? "ultra" : topIntensity >= 3 ? "legendary" : "epic"); renderKeepScroll(); }
      step++;
      setTimeout(revealNext, here ? 480 : 0);
    }
    revealNext();
  }
  function finishTournamentRound(t) {
    var won = t.pendingWon;
    releaseHud();
    t.outcome = won ? "won" : "lost";
    battleView = "tournament-result";
    if (!onBattlesPage()) { toast("🏆 Tournament " + t.roundName + (won ? " won!" : " lost.") + " Open Battles to continue.", won ? "good" : ""); return; }
    if (won) sfx.reveal("legendary"); else sfx.bad();
    render();
  }
  function advanceTournament() {
    var t = activeTournament;
    if (t.roundIdx >= TOURNAMENT_ROUND_SIZES.length - 1) {
      toast("Tournament champion! +" + fmtCr(TOURNAMENT_CHAMPION_BONUS) + " bonus banked.", "good");
      activeTournament = null;
      battleView = "lobby";
      render();
      return;
    }
    t.roundIdx++;
    runTournamentRound();
  }
  function exitTournament() {
    activeTournament = null;
    battleView = "lobby";
    render();
  }
  function tournamentStepsHtml(t) {
    return '<div class="tourney-steps">' + TOURNAMENT_ROUND_NAMES.map(function (name, i) {
      var cls = i < t.roundIdx || (i === t.roundIdx && t.outcome === "won" && i < TOURNAMENT_ROUND_SIZES.length - 1) ? "done" : i === t.roundIdx ? "active" : "";
      return '<div class="tourney-step ' + cls + '">' + (cls === "done" ? "✓ " : "") + name + '</div>';

  var DAILY_WHEEL_WEIGHTS = [20, 20, 18, 15, 12, 8, 5, 2];
  var DAILY_WHEEL_COOLDOWN_MS = 24 * 3600 * 1000;
  var dailyWheelCooldownTimer = null;
  function renderDailyWheel() {
    if (dailyWheelCooldownTimer) { clearInterval(dailyWheelCooldownTimer); dailyWheelCooldownTimer = null; }
    var now = Date.now();
    var last = state.lastDailySpin || 0;
    var canSpin = (now - last) >= DAILY_WHEEL_COOLDOWN_MS;
    var nextAt = last + DAILY_WHEEL_COOLDOWN_MS;
    var segAngle = 360 / DAILY_WHEEL_SEGMENTS.length;
    var gradientStops = DAILY_WHEEL_SEGMENTS.map(function (s, i) {
      var mid = (i * segAngle) + segAngle * 0.5;
      return s.color + " " + (i * segAngle) + "deg " + (mid - 1) + "deg, " + shadeColor(s.color, -14) + " " + mid + "deg, " + s.color + " " + ((i + 1) * segAngle) + "deg";
    }).join(", ");
    var labelsHtml = DAILY_WHEEL_SEGMENTS.map(function (s, i) {
      var angle = i * segAngle + segAngle / 2;
      return '<div class="wheel-label' + (s.type === "epic" ? " epic" : "") + '" style="transform: rotate(' + angle + 'deg) translate(0,-128px) rotate(' + (-angle) + 'deg)">' + esc(s.label) + '</div>';
    }).join("");
    var lightCount = 16, lightsHtml = "";
    for (var li = 0; li < lightCount; li++) {
      var la = (li / lightCount) * 360;
      lightsHtml += '<div class="wheel-light" style="--a:' + la + 'deg; animation-delay:' + (li * 0.09) + 's"></div>';
    }
    $app.innerHTML = '<section class="page"><div class="page-head"><h1>Daily Spin</h1><p class="dim">One free spin every 24 hours. Mostly credits &mdash; but one slot is a guaranteed Epic aircraft.</p></div>' +
      '<div class="wheel-wrap" id="wheel-wrap"><div class="wheel-glow-ring"></div><div class="wheel-lights">' + lightsHtml + '</div>' +
      '<div class="wheel-pointer-fixed"></div><div class="wheel" id="daily-wheel" style="background: conic-gradient(' + gradientStops + ')">' + labelsHtml +
      '<div class="wheel-shine"></div></div><div class="wheel-hub">✦</div>' +
      '<canvas id="wheel-fx-canvas" class="fx-canvas" style="z-index:5"></canvas></div>' +
      '<div class="wheel-action">' +
      (canSpin ? '<button class="btn primary lg" id="wheel-spin-btn">Spin the Wheel</button>' : '<p class="dim">Next spin in <span id="wheel-cooldown">' + formatCountdown(nextAt - now) + '</span></p>') +
      '</div><div class="wheel-result" id="wheel-result"></div></section>';
    if (canSpin) {
      document.getElementById("wheel-spin-btn").onclick = spinDailyWheel;
    } else {
      dailyWheelCooldownTimer = setInterval(function () {
        var el = document.getElementById("wheel-cooldown");
        if (!el) { clearInterval(dailyWheelCooldownTimer); dailyWheelCooldownTimer = null; return; }
        var remain = nextAt - Date.now();
        if (remain <= 0) { renderDailyWheel(); return; }
        el.textContent = formatCountdown(remain);
      }, 1000);
    }
  }
  function spinDailyWheel() {
    if (Date.now() - (state.lastDailySpin || 0) < DAILY_WHEEL_COOLDOWN_MS) return;
    var btn = document.getElementById("wheel-spin-btn");
    if (btn) btn.disabled = true;
    // Bug fix: the cooldown used to start only when the wheel stopped, so
    // reloading mid-spin gave you a free re-spin.
    state.lastDailySpin = Date.now();
    save();
    var wrap = document.getElementById("wheel-wrap");
    if (wrap) wrap.classList.add("spinning");
    var total = DAILY_WHEEL_WEIGHTS.reduce(function (a, b) { return a + b; }, 0);
    var roll = Math.random() * total, acc = 0, idx = 0;
    for (var i = 0; i < DAILY_WHEEL_WEIGHTS.length; i++) { acc += DAILY_WHEEL_WEIGHTS[i]; if (roll <= acc) { idx = i; break; } }
    var segAngle = 360 / DAILY_WHEEL_SEGMENTS.length;
    var segCenter = idx * segAngle + segAngle / 2;
    var spins = 5 + Math.floor(Math.random() * 3);
    var finalRotation = spins * 360 + (360 - segCenter);
    var wheel = document.getElementById("daily-wheel");
    wheel.classList.add("spinning");
    wheel.style.transition = reduceMotion ? "none" : "transform 4s cubic-bezier(.12,.72,.1,1)";
    wheel.style.transform = "rotate(" + finalRotation + "deg)";
    sfx.reelSpin(reduceMotion ? 0 : 4);
    setTimeout(function () { finishWheelSpin(idx); }, reduceMotion ? 50 : 4100);
  }
  function finishWheelSpin(idx) {
    var seg = DAILY_WHEEL_SEGMENTS[idx];

    if (wrap) wrap.classList.remove("spinning");
    var wheelEl0 = document.getElementById("daily-wheel");
    if (wheelEl0) wheelEl0.classList.remove("spinning");
    var $res = document.getElementById("wheel-result");
    if (seg.type === "credits") {
      state.credits += seg.amount;
      save(); updateHud();
      sfx.buy();
      if ($res) {
        $res.style.setProperty("--rc", seg.color);
        $res.innerHTML = '<div class="wr-label">Daily Spin</div><div class="wr-main" style="color:' + seg.color + '">+' + fmtCr(seg.amount) + '</div><div class="wr-sub">Added to your credits.</div>';
        requestAnimationFrame(function () { $res.classList.add("show"); });
      }
      runParticles(document.getElementById("wheel-fx-canvas"), seg.color, 1);
      toast("Daily Spin: +" + fmtCr(seg.amount) + "!", "good");
    } else {
      var pool = D.CATALOG.filter(function (a) { return a.rarity === "epic"; });
      var a = pool[Math.floor(Math.random() * pool.length)];
      var livery = D.rollLivery(a.id);
      var item = { instanceId: genId(), aircraftId: a.id, acquiredAt: Date.now(), source: "dailywheel", listed: false, cost: 0, livery: livery };
      state.inventory.push(item);
      var p = state.prices[a.id] || (state.prices[a.id] = { mult: 1, current: null, history: [], minted: 0 });
      p.minted = (p.minted || 0) + 1;
      pushActivity({ type: "unlock", aircraftId: a.id, rarity: "epic", who: state.callsign, t: Date.now() });
      snapshotHistory();
      save(); updateHud(); renderTicker();
      sfx.reveal("epic");
      var wheelEl = document.getElementById("daily-wheel");
      if (wheelEl) wheelEl.classList.add("epic-win");
      if (!reduceMotion) { var stage = document.getElementById("wheel-wrap"); if (stage) { stage.classList.add("shake"); setTimeout(function () { stage.classList.remove("shake"); }, 500); } }
      runParticles(document.getElementById("wheel-fx-canvas"), rarityMeta("epic").color, 4);
      if ($res) {
        $res.style.setProperty("--rc", rarityMeta("epic").color);
        $res.innerHTML = '<div class="wr-label">✦ Jackpot ✦</div><div class="wr-main" style="color:' + rarityMeta("epic").color + '">' + esc(a.name) + '</div><div class="wr-sub">' + esc(a.mfr) + (livery ? " &middot; " + liveryBadge(livery) : "") + '</div>';
        requestAnimationFrame(function () { $res.classList.add("show"); });
      }
      toast("JACKPOT! Daily Spin landed an Epic " + a.name + "!", "good");
    }
    renderDailyWheelCooldownOnly();
  }
  function renderDailyWheelCooldownOnly() {

  /* ---------- extra sounds ---------- */
  sfx.tick = function (gain) {
    var ctx = audioCtx(); if (!ctx) return;
    sfxTone(ctx, 1800, ctx.currentTime, 0.03, { type: "square", gain: gain || 0.03 });
  };
  sfx.creep = function (dur, near) {
    var ctx = audioCtx(); if (!ctx) return;
    var n = near ? 6 : 3, t0 = ctx.currentTime;
    for (var i = 0; i < n; i++) {
      var p = (i + 1) / (n + 1), when = t0 + Math.pow(p, 0.6) * dur;
      sfxTone(ctx, near ? 1400 + i * 90 : 1500, when, 0.035, { type: "square", gain: 0.035 });
    }
  };
  function sweepNoise(ctx, t, dur, f0, f1, gain) {
    var n = Math.max(1, Math.floor(ctx.sampleRate * dur)), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    var src = ctx.createBufferSource(); src.buffer = buf;
    var f = ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.2;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    var g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + dur * 0.85); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(t); src.stop(t + dur + 0.05);
  }
  sfx.cinematic = function (tier) {
    var ctx = audioCtx(); if (!ctx) return; var t = ctx.currentTime;
    sweepNoise(ctx, t, 0.5, 300, 5000, 0.12);
    sfxTone(ctx, 90, t + 0.45, 0.8, { type: "sine", gain: 0.2, freqTo: 40 });
    var chords = { legendary: [523, 659, 784, 1047], mythic: [494, 622, 740, 988, 1245], ultra: [440, 554, 659, 880, 1109, 1319], divine: [392, 494, 587, 784, 988, 1175, 1568] };
    (chords[tier] || chords.legendary).forEach(function (f, i) { sfxTone(ctx, f, t + 0.5 + i * 0.07, 1.4, { type: i % 2 ? "sine" : "triangle", gain: 0.07 }); });
    for (var i = 0; i < 10; i++) sfxTone(ctx, 2000 + Math.random() * 2500, t + 0.6 + i * 0.09, 0.2, { type: "sine", gain: 0.025 });
  };
  sfx.alert = function () {
    var ctx = audioCtx(); if (!ctx) return; var t = ctx.currentTime;
    sfxTone(ctx, 880, t, 0.12, { type: "triangle", gain: 0.08 }); sfxTone(ctx, 1320, t + 0.12, 0.18, { type: "triangle", gain: 0.08 });
  };
  sfx.gun = function () {
    var ctx = audioCtx(); if (!ctx) return; var t = ctx.currentTime;
    for (var i = 0; i < 6; i++) sfxNoise(ctx, t + i * 0.06, 0.04, { gain: 0.06, filterFreq: 1800 });
  };
  sfx.boom = function (big) {
    var ctx = audioCtx(); if (!ctx) return; var t = ctx.currentTime;
    sfxTone(ctx, big ? 110 : 160, t, big ? 0.9 : 0.35, { type: "sine", gain: 0.2, freqTo: 35 });
    sfxNoise(ctx, t, big ? 0.9 : 0.3, { gain: big ? 0.16 : 0.08, filterFreq: 500, filterType: "lowpass" });
  };
  sfx.beep = function (hi) {
    var ctx = audioCtx(); if (!ctx) return;
    sfxTone(ctx, hi ? 1046 : 523, ctx.currentTime, hi ? 0.4 : 0.16, { type: "square", gain: 0.06 });
  };
  sfx.auroraCharge = function (dur) {
    var ctx = audioCtx(); if (!ctx) return; var t = ctx.currentTime;
    sweepNoise(ctx, t, dur, 120, 6000, 0.14);
    sfxTone(ctx, 110, t, dur, { type: "sawtooth", gain: 0.05, freqTo: 880 });
    sfxTone(ctx, 165, t, dur, { type: "triangle", gain: 0.05, freqTo: 1320 });
  };
  sfx.auroraBurst = function () {
    var ctx = audioCtx(); if (!ctx) return; var t = ctx.currentTime;
    sfxTone(ctx, 70, t, 1.4, { type: "sine", gain: 0.25, freqTo: 30 });
    sfxNoise(ctx, t, 1.2, { gain: 0.14, filterFreq: 3000 });
    [523, 659, 784, 988, 1175, 1568, 1976, 2349].forEach(function (f, i) { sfxTone(ctx, f, t + 0.05 + i * 0.06, 1.6, { type: "sine", gain: 0.06 }); });
  };
  sfx.auroraAmbient = function () {

  }
  function forgeFee(p) { return isBlackFriday() ? Math.round(p.cost * (1 - BF_FORGE_DISCOUNT)) : p.cost; }

  function marketEventDef(id) { for (var i = 0; i < MARKET_EVENTS.length; i++) if (MARKET_EVENTS[i].id === id) return MARKET_EVENTS[i]; return null; }

  /* ---------- auctions ---------- */
  var AUCTION_SLOTS = 4;
  var AUCTION_WEIGHTS = { epic: 38, legendary: 30, mythic: 16, ultra: 6 }, AUCTION_LEGACY_WEIGHT = 10;
  function spawnAuction(now) {
    var total = AUCTION_LEGACY_WEIGHT, r;
    for (r in AUCTION_WEIGHTS) total += AUCTION_WEIGHTS[r];
    var roll = Math.random() * total, acc = 0, pick = "legacy";
    for (r in AUCTION_WEIGHTS) { acc += AUCTION_WEIGHTS[r]; if (roll <= acc) { pick = r; break; } }
    var pool = pick === "legacy" ? D.LEGACY_CATALOG : D.CATALOG.filter(function (a) { return a.rarity === pick; });
    if (!pool.length) pool = D.CATALOG.filter(function (a) { return a.rarity === "epic"; });
    var a = pool[Math.floor(Math.random() * pool.length)];
    var livery = D.rollLivery(a.id, 2);
    var market = valueWithLivery(a.id, livery);
    state.auctions.push({ id: genId(), aircraftId: a.id, livery: livery, bid: Math.max(1, Math.round(market * (0.45 + Math.random() * 0.2))), leader: null, myBid: 0, bids: 0,
      startedAt: now, endsAt: now + (4 + Math.random() * 8) * 60000, botCap: Math.round(market * (0.75 + Math.random() * 0.5)), done: false });
  }
  function topUpAuctions() {
    var now = Date.now();
    var live = state.auctions.filter(function (x) { return !x.done; }).length;
    for (var i = live; i < AUCTION_SLOTS; i++) spawnAuction(now);
    var ended = state.auctions.filter(function (x) { return x.done; });
    if (ended.length > 8) {
      var drop = ended.slice(0, ended.length - 8).map(function (x) { return x.id; });
      state.auctions = state.auctions.filter(function (x) { return drop.indexOf(x.id) === -1; });
    }
  }
  function minNextBid(x) { return x.leader ? Math.ceil(x.bid * 1.05) : x.bid; }
  function botBid(x, amount, live) {
    var a = D.CATALOG_BY_ID[x.aircraftId], now = Date.now();
    if (x.leader === "me") {
      state.credits += x.myBid; x.myBid = 0;
      if (live) { toast("🔨 You were outbid on the " + (a ? a.name : "auction") + "! Your " + fmtCr(x.bid) + " is back.", "bad"); }
    }
    x.bid = amount; x.leader = pickBotName(); x.bids++;
    if (x.endsAt - now < 15000) x.endsAt = now + 15000;   // anti-snipe
  }
  function settleAuction(x, live) {
    var a = D.CATALOG_BY_ID[x.aircraftId];
    x.done = true; x.endedAt = Date.now();
    if (x.leader === "me" && !live && minNextBid(x) <= x.botCap) {
      // a bot would have outbid you while you were away
      state.credits += x.myBid; x.myBid = 0;
      x.bid = minNextBid(x); x.leader = pickBotName();
      offlineReport.auctionsLost++;
    }
    if (x.leader === "me" && a) {
      var paid = x.myBid; x.myBid = 0; x.won = true; x.paid = paid;
      state.totalSpent += paid;
      state.inventory.push({ instanceId: genId(), aircraftId: a.id, acquiredAt: Date.now(), source: "auction", listed: false, cost: paid, livery: x.livery || null });
      recordTradePrice(a, paid, x.livery);
      pushLedger({ t: Date.now(), type: "auction", aircraftId: a.id, amount: -paid, rarity: a.rarity });
      pushActivity({ type: "trade", aircraftId: a.id, price: paid, t: Date.now() });
      snapshotHistory();
      if (live) { sfx.reveal("legendary"); toast("🔨 SOLD to you! " + a.name + " for " + fmtCr(paid) + ".", "good"); }
      else offlineReport.auctionsWon.push(a.name);
    } else if (x.leader && a) {
      pushActivity({ type: "trade", aircraftId: a.id, price: x.bid, t: Date.now() });
    }
  }
  function processAuctions(live) {
    if (!state || !state.auctions) return false;
    var now = Date.now(), changed = false;
    state.auctions.forEach(function (x) {
      if (x.done) return;
      if (!D.CATALOG_BY_ID[x.aircraftId]) { x.done = true; state.credits += x.myBid || 0; x.myBid = 0; changed = true; return; }
      if (now >= x.endsAt) { settleAuction(x, live); changed = true; return; }
      if (!live) return;
      var next = minNextBid(x), left = x.endsAt - now;
      var p = (x.leader === "me" ? 0.06 : 0.012) * (left < 30000 ? 3.5 : 1);
      if (next <= x.botCap && Math.random() < p) { botBid(x, next, live); changed = true; }
    });

    return changed;
  }
  function placeBid(id, amount) {
    var x = state.auctions.find(function (q) { return q.id === id; });
    if (!x || x.done || Date.now() >= x.endsAt) { toast("That auction has ended.", "bad"); return; }
    if (x.leader === "me") { toast("You're already the top bidder.", ""); return; }
    var min = minNextBid(x);
    if (!amount || amount < min) { toast("The minimum bid is " + fmtCr(min) + ".", "bad"); return; }
    if (state.credits < amount) { toast("Not enough credits for that bid.", "bad"); return; }
    state.credits -= amount;
    x.myBid = amount; x.bid = amount; x.leader = "me"; x.bids++;
    if (x.endsAt - Date.now() < 20000) x.endsAt = Date.now() + 20000;
    sfx.buy(); save(); updateHud();
    toast("Bid placed: " + fmtCr(amount) + ". Credits are held until you win or get outbid.", "good");
    if (ready) renderKeepScroll();

  function startStarfield(cv) {
    var c = cv.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1), W = 0, H = 0, stars = [], warp = 0.5, target = 0.5;
    var cols = ["#ffffff", "#bfffe9", "#a6e3ff", "#d9c8ff", "#ffd9f2"];

    function seed(s) { s.x = (Math.random() - 0.5) * 2; s.y = (Math.random() - 0.5) * 2; s.z = 0.2 + Math.random() * 0.8; s.col = cols[Math.floor(Math.random() * cols.length)]; return s; }
    size();
    for (var i = 0; i < 320; i++) stars.push(seed({}));
    c.lineCap = "round";
    var ov = document.getElementById("reveal-overlay");
    function frame() {
      if (!ov.classList.contains("aurora-mode") || !document.body.contains(cv)) return;
      requestAnimationFrame(frame);
      warp += (target - warp) * 0.04;
      c.fillStyle = "rgba(2,3,10," + (warp > 3 ? 0.3 : 0.85) + ")"; c.fillRect(0, 0, W, H);
      var cx = W / 2, cy = H * 0.54, k = 0.55 * Math.max(W, H);
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i], pz = s.z;
        s.z -= 0.0018 * warp;
        if (s.z <= 0.03) { seed(s); s.z = 1; pz = 1; }
        var sx = cx + s.x / s.z * k, sy = cy + s.y / s.z * k, px = cx + s.x / pz * k, py = cy + s.y / pz * k;
        c.strokeStyle = s.col; c.globalAlpha = Math.min(1, (1 - s.z) * 1.6); c.lineWidth = Math.max(0.8, (1 - s.z) * 2.6);

    }

      o.type = "sine"; o.frequency.setValueAtTime(this.hz(m), t); o.frequency.linearRampToValueAtTime(this.hz(m + 5), t + d * 0.6); o.frequency.linearRampToValueAtTime(this.hz(m - 2), t + d);
      l.frequency.value = 6; lg.gain.value = 8; l.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.03, t + 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(this.filt); o.start(t); l.start(t); o.stop(t + d + 0.05); l.stop(t + d + 0.05);
    },
    hat: function (t) {
      var c = actx;
      if (!this.hb) { var n = Math.floor(c.sampleRate * 0.05); this.hb = c.createBuffer(1, n, c.sampleRate); var a = this.hb.getChannelData(0); for (var i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n); }
      var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = this.hb; f.type = "highpass"; f.frequency.value = 7000; g.gain.value = 0.025;
      s.connect(f); f.connect(g); g.connect(this.node); s.start(t);
    },
    kick: function (t) {
      var c = actx, o = c.createOscillator(), g = c.createGain();
      o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.15);
      g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g); g.connect(this.node); o.start(t); o.stop(t + 0.22);
    },
  };
  function paintMusicBtn() {
    var b = document.getElementById("music-toggle");
    if (!b) return;
    b.classList.toggle("music-on", !!MUS.timer);
    b.title = MUS.timer ? "Now playing: " + musicName() + " (music & events)" : "Music & seasonal events";
    b.setAttribute("aria-label", b.title);
  }
  // Browsers only allow sound after the player clicks or presses a key, so saved music waits for that.
  function armMusic() {
    var go = function () {
      document.removeEventListener("pointerdown", go, true); document.removeEventListener("keydown", go, true);
      if (svSet.music) MUS.start();
    };
    document.addEventListener("pointerdown", go, true); document.addEventListener("keydown", go, true);
  }

  /* ---------- the Music & Events window ---------- */
  function trackBtn(k, label, desc, sea) {
    var sel = musicKey() === k, st = sel && MUS.timer ? "♫ playing" : sel ? "selected" : sea ? "⏳ limited" : "";
    return '<button type="button" class="sv-track' + (sel ? " on" : "") + (sea ? " sea" : "") + '" data-track="' + k + '"><span><b>' + esc(label) + '</b><small>' + esc(desc) + '</small></span><span class="t-st">' + st + '</span></button>';
  }
  function openMusicModal() {
    var nx = nextSeason();
    var rows = BASE_TRACKS.map(function (k) { return trackBtn(k, TRACKS[k].name, TRACKS[k].desc, false); }).join("");
    if (SEA) rows += trackBtn("season", SEA.ic + " " + SEA.track.name, SEA.name + " event soundtrack", true);
    var note = SEA
      ? "The " + esc(SEA.track.name) + " track is only here during " + esc(SEA.name) + ". It leaves in <span id=\"sv-track-left\"></span>."
      : "Event soundtracks show up here only while a seasonal event is on." + (nx ? " Next event: " + nx.ic + " " + esc(nx.name) + " in <span id=\"sv-next-left\"></span>." : "");
    var body = '<div class="sv-set" id="sv-music-modal">' +
      '<h4>Music</h4><div class="sv-switch"><span>Background music<small>Made live in your browser, nothing to download.</small></span>' +
      '<button type="button" class="btn small' + (svSet.music ? " primary" : "") + '" id="sv-music-on">' + (svSet.music ? "On" : "Off") + '</button></div>' +
      '<label class="field-label" for="sv-vol">Music volume</label><input type="range" class="sv-range" id="sv-vol" min="0" max="100" value="' + Math.round(svSet.vol * 100) + '">' +
      '<h4>Pick a track</h4><div class="sv-tracks">' + rows + '</div><p class="dim small">' + note + '</p>' +
      '<h4>Seasonal events</h4><div class="sv-switch"><span>Decorations &amp; effects<small>Themes, scenery, particles and bonus catches.</small></span>' +
      '<button type="button" class="btn small' + (svSet.deco ? " primary" : "") + '" id="sv-deco-on">' + (svSet.deco ? "On" : "Off") + '</button></div>' +
      '</div>';
    showModal("Music & Events", body, [{ label: "Done", cls: "primary", action: closeModal }]);
    document.getElementById("sv-music-on").onclick = function () {
      svSet.music = !svSet.music; saveSvSet();
      if (svSet.music) MUS.start(); else MUS.stop();
      openMusicModal();
    };
    document.getElementById("sv-vol").oninput = function (e) { svSet.vol = clamp(e.target.value / 100, 0, 1); saveSvSet(); MUS.setVol(); };
    document.querySelectorAll("#sv-music-modal [data-track]").forEach(function (b) {
      b.onclick = function () {
        var k = b.getAttribute("data-track"), changed = k !== musicKey();
        svSet.track = k; svSet.music = true; saveSvSet();
        if (changed || !MUS.timer) MUS.restart();
        openMusicModal();
        setTimeout(function () { if (document.getElementById("sv-music-modal")) openMusicModal(); }, 750);   // show "playing" once it starts
      };
    });
    document.getElementById("sv-deco-on").onclick = function () { svSet.deco = !svSet.deco; saveSvSet(); applySeason(); openMusicModal(); };
    paintMusicModalTimes();
  }
  function paintMusicModalTimes() {
    var now = Date.now(), a = document.getElementById("sv-track-left"), b = document.getElementById("sv-next-left");
    if (a && SEA) a.textContent = fmtLeft(SEA.end - now);
    if (b) { var nx = nextSeason(); if (nx) b.textContent = fmtLeft(nx.start - now); }
  }

  /* ---------- admin panel: preview any event ---------- */
  function adminSeaOptions() {
    var cur = seaOverride && !seaOverride.temp ? seaOverride.id : "";
    return '<option value="">Automatic (real calendar)</option><option value="none"' + (cur === "none" ? " selected" : "") + '>Off</option>' +
      SEASONS.map(function (s) { return '<option value="' + s.id + '"' + (cur === s.id ? " selected" : "") + '>' + s.ic + ' ' + esc(s.name) + '</option>'; }).join("");
  }
  function adminSeaStatus() {
    var r = realSeason(new Date()), nx = nextSeason(), now = Date.now();
    var real = r ? "Real calendar: " + r.ic + " " + esc(r.name) + " is on, ends in " + fmtLeft(r.end - now) + "."
      : "Real calendar: no event right now" + (nx ? ", next is " + nx.ic + " " + esc(nx.name) + " in " + fmtLeft(nx.start - now) : "") + ".";
    if (seaOverride && seaOverride.id === "none") return "Events are switched off. " + real;
    if (SEA && SEA.preview) return "Previewing " + SEA.ic + " " + esc(SEA.name) + ". " + real;
    return real;
  }
  function setSeaOverride(v) {
    seaOverride = v ? { id: v, at: Date.now() } : null;
    saveSeaOverride(); applySeason();
    toast(v === "none" ? "Seasonal events switched off." : v ? "Previewing " + seasonById(v).name + "." : "Back to the real calendar.", "good");
    var st = document.getElementById("admin-sea-status"); if (st) st.innerHTML = adminSeaStatus();
  }

  /* ---------- switching events on and off ---------- */
  function applySeason() {
    var prev = SEA && SEA.id;
    SEA = seasonNow();
    var h = document.documentElement, on = decoOn();
    if (on) h.setAttribute("data-season", SEA.id); else h.removeAttribute("data-season");
    h.style.setProperty("--sea-solid", SEA ? SEA.solid : "#4fd8ff");
    var sc = document.getElementById("sv-scene"), key = on ? SEA.id : "";
    if (sc && sc.getAttribute("data-k") !== key) { sc.setAttribute("data-k", key); sc.innerHTML = on ? sceneHTML(SEA) : ""; }
    AMB.set(on && !reduceMotion ? SEA.amb : null);
    paintSeaBar(); paintLogo(); scheduleCollect();
    if ((SEA && SEA.id) !== prev) {
      // the event soundtrack swaps in or out the moment the event starts or ends
      if (MUS.timer && svSet.track === "season") MUS.restart();
      paintMusicBtn();
      if (document.getElementById("sv-music-modal")) openMusicModal();
      // Bug fix: sale prices and banners (Black Friday) didn't update until you changed page
      if (ready && state && (prev === "blackfriday" || (SEA && SEA.id === "blackfriday"))) renderKeepScroll();
    }
  }
  document.addEventListener("click", function (e) {
    if (!e.target.closest) return;
    if (e.target.closest("#music-toggle") || e.target.closest("#sv-sea-music")) openMusicModal();
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) MUS.stop();
    else { if (svSet.music && actx) MUS.start(); AMB.kick(); }
  });
  window.addEventListener("resize", function () { AMB.size(); });
  // Checked every second, so events start and end right on time, even if the page stays open
  setInterval(function () {
    var want = seasonNow();
    if ((want && want.id) !== (SEA && SEA.id) || (want && SEA && want.end !== SEA.end)) { applySeason(); return; }
    paintSeaCountdown(); paintMusicModalTimes();
    var st = document.getElementById("admin-sea-status"); if (st) st.innerHTML = adminSeaStatus();
  }, 1000);
  setInterval(newYearMoment, 200);

  AMB.size();
  applySeason();
  paintMusicBtn();
  armMusic();

  boot();
})();
</script>
</body>
</html>
