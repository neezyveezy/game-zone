<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mogul Life</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;900&display=swap">
<style>
/* Layout: a night-city money terminal. Sticky HUD on top, nav rail on the left (bottom bar on phones), one scrolling panel. */
:root {
  color-scheme: dark;
  --bg: #0b0e1c;
  --hero: #111633;
  --panel: #151a31;
  --panel-2: #1c2240;
  --line: #2a3156;
  --fg: #eef0fb;
  --muted: #8d94b8;
  --gold: #f3c14b;
  --gold-deep: #b9862a;
  --mint: #3fd9a0;
  --coral: #ff6f7d;
  --sky: #7aa7ff;
  --violet: #b493ff;
  --peach: #ffb37a;
  --sky-back: #1b2350;
  --sky-front: #0d1129;
  --f-display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --f-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 14px;
  --nav-w: 92px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; min-height: 100vh; overflow-x: hidden;
  background: radial-gradient(1200px 500px at 15% -10%, rgba(122, 167, 255, .13), transparent 60%), radial-gradient(900px 500px at 100% 0%, rgba(243, 193, 75, .08), transparent 60%), var(--bg); background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.up { color: var(--mint); } .down { color: var(--coral); } .gold-t { color: var(--gold); }
.center { text-align: center; justify-content: center; }

/* ---------- HUD ---------- */
#app { min-height: 100vh; }
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: rgba(11, 14, 28, .88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
  padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hud-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 900; font-size: 15px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--gold), var(--gold-deep)); display: grid; place-items: center; color: #1b1405; font-style: normal; font-size: 14px; box-shadow: 0 0 18px rgba(243, 193, 75, .35); }
#cashwrap { display: flex; flex-direction: column; line-height: 1.05; border-radius: 10px; padding: 2px 8px; margin-left: -8px; }
#cashwrap small { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
#cash { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 3.2vw, 30px); color: var(--gold); font-variant-numeric: tabular-nums; text-shadow: 0 0 24px rgba(243, 193, 75, .25); }
#cashwrap.gain { animation: gain .7s ease; } #cashwrap.loss { animation: loss .7s ease; }
@keyframes gain { 30% { background: rgba(63, 217, 160, .16); } }
@keyframes loss { 30% { background: rgba(255, 111, 125, .16); } }
.hud-meta { display: flex; gap: 18px; font-size: 13px; color: var(--muted); }
.hud-meta b { display: block; color: var(--fg); font-family: var(--f-mono); font-size: 14px; font-weight: 700; }
.hud-meta #flow.up, .hud-meta #flow.down { font-family: var(--f-mono); font-weight: 700; font-size: 14px; display: block; }
.hud-ctl { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.speed { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.speed button { border: 0; background: none; padding: 5px 9px; border-radius: 7px; cursor: pointer; font-family: var(--f-mono); font-size: 12px; font-weight: 700; color: var(--muted); }
.speed button.on { background: var(--gold); color: #1b1405; }
.icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: grid; place-items: center; font-size: 15px; }
.icon-btn.off { opacity: .45; }
#stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 9px; }
.stat { display: flex; gap: 7px; align-items: center; min-width: 0; }
.st-ic { font-size: 15px; }
.st-body { flex: 1; min-width: 0; }
.st-top { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.st-top b { color: var(--fg); font-family: var(--f-mono); }
#jailbar { background: repeating-linear-gradient(45deg, rgba(255, 111, 125, .2) 0 10px, rgba(255, 111, 125, .1) 10px 20px); border: 1px solid var(--coral); color: var(--fg); padding: 8px 12px; border-radius: 10px; margin-top: 8px; font-weight: 700; font-size: 13px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); gap: 22px; max-width: 1280px; margin: 0 auto;
  padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#nav { position: sticky; top: 140px; align-self: start; display: flex; flex-direction: column; gap: 4px; }
#nav button { position: relative; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 12px; color: var(--muted); font-size: 11.5px; font-weight: 700; transition: background .2s, color .2s, transform .15s; }
#nav button:hover { background: var(--panel); color: var(--fg); }
#nav button:active { transform: scale(.95); }
#nav button.on { background: var(--panel-2); color: var(--gold); box-shadow: inset 0 0 0 1px var(--line); }
#nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#panel { min-width: 0; animation: panelIn .35s ease; }
@keyframes panelIn { from { opacity: .4; transform: translateY(6px); } }

.ph { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.ph h2 { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 3vw, 32px); letter-spacing: -.01em; }
.ph p { color: var(--muted); }
.subtabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 18px; padding-bottom: 2px; }
.subtabs::-webkit-scrollbar { display: none; }
.subtabs button { flex: none; border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--muted); transition: all .2s; }
.subtabs button:hover { color: var(--fg); }
.subtabs button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.sect { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 0 10px; }
.sect h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 800; }
.lead { color: var(--muted); margin-bottom: 14px; max-width: 65ch; }

/* ---------- primitives ---------- */
.btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); padding: 9px 16px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 14px; transition: transform .12s, filter .2s, background .2s, box-shadow .2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.97); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn.gold { background: linear-gradient(180deg, #f8d06a, var(--gold) 50%, #d9a332); color: #1d1606; border-color: #f8d784; box-shadow: 0 4px 16px rgba(243, 193, 75, .22), inset 0 1px 0 rgba(255, 255, 255, .4); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--coral); border-color: rgba(255, 111, 125, .4); }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 9px; }
.btn.big { padding: 13px 28px; font-size: 16px; border-radius: 12px; font-family: var(--f-display); font-weight: 700; letter-spacing: .02em; }
.btn small { opacity: .7; font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.gold { color: var(--gold); border-color: rgba(243, 193, 75, .4); background: rgba(243, 193, 75, .08); }
.pill.mint { color: var(--mint); border-color: rgba(63, 217, 160, .4); background: rgba(63, 217, 160, .08); }
.pill.sky { color: var(--sky); border-color: rgba(122, 167, 255, .4); }
.pill.coral { color: var(--coral); border-color: rgba(255, 111, 125, .4); }
.bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .06); overflow: hidden; margin: 6px 0 4px; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--c, var(--gold)); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.bar.thin { height: 5px; margin: 3px 0 0; }
.bar.thin.low i { animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .35; } }
.bar.mint i { background: var(--mint); } .bar.sky i { background: var(--sky); } .bar.violet i { background: var(--violet); } .bar.coral i { background: var(--coral); }
.bar.heat i { background: linear-gradient(90deg, var(--peach), var(--coral)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card.current { border-color: rgba(243, 193, 75, .35); background: linear-gradient(160deg, rgba(243, 193, 75, .07), transparent 50%), var(--panel); margin-bottom: 8px; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h3 { font-size: 16px; font-weight: 800; }
.card h4 { font-size: 13px; margin: 14px 0 8px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; margin: 8px 0; font-size: 13.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-family: var(--f-mono); font-weight: 700; font-size: 13px; }
.lbl-row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 12px; color: var(--muted); }
.lbl-row b { color: var(--fg); font-family: var(--f-mono); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.acts.wrap { margin-bottom: 4px; }
.big-ic { font-size: 34px; line-height: 1; margin-bottom: 8px; }
.lg { font-size: 18px; display: block; }
.big-num { font-family: var(--f-display); font-weight: 700; font-size: 26px; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 50px 20px; border: 1px dashed var(--line); border-radius: var(--r); display: grid; gap: 12px; justify-items: center; }
.empty span { font-size: 44px; }

/* item cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 12px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.ladder { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; transition: transform .18s, border-color .2s, box-shadow .2s; position: relative; }
.item:hover { transform: translateY(-2px); border-color: #3a4374; box-shadow: 0 10px 28px rgba(0, 0, 0, .3); }
.item-top { display: flex; gap: 11px; align-items: center; }
.item .ic { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: var(--panel-2); border: 1px solid var(--line); }
.item .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.item .nm b { font-size: 14.5px; line-height: 1.25; }
.item .nm small { color: var(--muted); font-size: 12.5px; }
.item .acts { margin-top: auto; padding-top: 4px; }
.item.locked { opacity: .62; }
.item.locked:hover { opacity: .85; }
.item.is-cur { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset, 0 0 24px rgba(243, 193, 75, .12); }
.item.is-done { border-color: rgba(63, 217, 160, .35); }
.item.shady { background: linear-gradient(160deg, rgba(255, 111, 125, .07), transparent 60%), var(--panel); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
.chip.ok { color: var(--mint); background: rgba(63, 217, 160, .1); }
.chip.no { color: var(--coral); background: rgba(255, 111, 125, .1); }
.effs { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; font-weight: 700; font-family: var(--f-mono); }

/* ---------- home ---------- */
.ticker { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin-bottom: 14px; mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
.ticker-track { display: flex; gap: 34px; width: max-content; padding: 8px 0; font-family: var(--f-mono); font-size: 12.5px; font-weight: 500; animation: tick 60s linear infinite; white-space: nowrap; }
@keyframes tick { to { transform: translateX(-50%); } }
.hero { position: relative; border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, #0e1230, var(--hero) 70%); border: 1px solid var(--line); min-height: 250px; }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-in { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 26px; flex-wrap: wrap; min-height: 250px; }
.hero-txt { max-width: 420px; text-shadow: 0 2px 12px rgba(0, 0, 0, .6); }
.eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 800; }
.hero h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(30px, 5vw, 48px); line-height: 1; letter-spacing: -.02em; margin: 8px 0 10px; }
.hero p b { font-family: var(--f-mono); }
.hustle-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.hustle { width: 150px; height: 150px; border-radius: 50%; border: 0; cursor: pointer; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #3a2705;
  background: radial-gradient(circle at 35% 30%, #fff1bf, #f6cf63 35%, #d79c2c 75%, #a8711a); box-shadow: 0 0 0 6px rgba(243, 193, 75, .16), 0 0 50px rgba(243, 193, 75, .35), inset 0 -8px 18px rgba(120, 70, 0, .45), inset 0 6px 12px rgba(255, 255, 255, .5);
  transition: transform .08s; touch-action: manipulation; user-select: none; -webkit-user-select: none; animation: breathe 3s ease-in-out infinite; }
.hustle::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 2px dashed rgba(90, 55, 0, .35); }
.hustle:active:not(:disabled), .hustle.pop { animation: press .18s ease; }
.hustle:disabled { filter: grayscale(.8) brightness(.6); cursor: not-allowed; animation: none; }
.coin-face { font-family: var(--f-display); font-weight: 900; font-size: 44px; line-height: 1; }
.hustle-lbl { font-family: var(--f-display); font-weight: 700; font-size: 11px; letter-spacing: .2em; }
.hustle-amt { font-family: var(--f-mono); font-weight: 700; font-size: 13px; }
@keyframes breathe { 50% { box-shadow: 0 0 0 10px rgba(243, 193, 75, .08), 0 0 70px rgba(243, 193, 75, .45), inset 0 -8px 18px rgba(120, 70, 0, .45), inset 0 6px 12px rgba(255, 255, 255, .5); } }
@keyframes press { 50% { transform: scale(.92); } }
.tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 12px; }
.tip { display: grid; grid-template-columns: 1fr auto; text-align: left; gap: 2px 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(243, 193, 75, .35); background: rgba(243, 193, 75, .06); cursor: pointer; transition: transform .15s, background .2s; }
.tip:hover { transform: translateY(-2px); background: rgba(243, 193, 75, .1); }
.tip b { grid-column: 1; } .tip span { grid-column: 1; font-size: 12.5px; color: var(--muted); } .tip i { grid-row: 1 / 3; grid-column: 2; align-self: center; font-style: normal; color: var(--gold); font-weight: 800; }
.dash { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; margin-top: 12px; }
.flow-card { grid-row: span 2; }
.flowbar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 3px; margin-bottom: 14px; }
.flowbar i { display: block; transition: flex .6s; } .flowbar .in { background: var(--mint); } .flowbar .out { background: var(--coral); }
.flow-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.flow-cols h4 { margin: 0 0 4px; font-size: 13px; }
.log-card { grid-column: 2 / 4; }
.log { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; max-height: 260px; overflow-y: auto; font-size: 13.5px; }
.log li { padding: 6px 8px; border-radius: 8px; display: flex; gap: 10px; animation: logIn .4s ease; }
.log li span { color: var(--muted); font-family: var(--f-mono); font-size: 11.5px; flex: none; width: 62px; padding-top: 2px; }
.log li.k-good { background: rgba(63, 217, 160, .05); } .log li.k-bad { background: rgba(255, 111, 125, .06); } .log li.k-gold { background: rgba(243, 193, 75, .08); } .log li.k-money { background: rgba(122, 167, 255, .05); }
@keyframes logIn { from { opacity: 0; transform: translateX(-8px); } }
.life-rows { display: grid; gap: 12px; }
.life-rows > div { display: flex; gap: 11px; align-items: center; }
.life-rows .ic { width: 38px; height: 38px; border-radius: 11px; background: var(--panel-2); display: grid; place-items: center; font-size: 19px; flex: none; }
.life-rows b { display: block; font-size: 14px; } .life-rows small { color: var(--muted); font-size: 12px; }

/* ---------- business ---------- */
.biz-inc { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; background: var(--panel-2); border-radius: 10px; padding: 9px 11px; }
.biz-inc b { font-family: var(--f-mono); color: var(--mint); font-size: 15px; } .biz-inc small { color: var(--muted); font-size: 12px; }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.tgl { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 5px 8px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--muted); transition: all .2s; }
.tgl.on { color: var(--mint); border-color: rgba(63, 217, 160, .5); background: rgba(63, 217, 160, .08); }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 7px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--muted); transition: all .15s; }
.seg button:hover:not(:disabled) { color: var(--fg); background: var(--panel-2); }
.seg button.on { background: var(--panel-2); color: var(--gold); box-shadow: inset 0 0 0 1px var(--line); }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.startup-pitch, .legacy { max-width: 560px; display: grid; gap: 10px; justify-items: start; }
.su-val small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
.su-val b { display: block; font-family: var(--f-display); font-size: 32px; color: var(--gold); }

/* ---------- markets ---------- */
.mkt { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 14px; align-items: start; }
.mkt-list { display: grid; gap: 4px; max-height: 640px; overflow-y: auto; padding-right: 2px; }
.mrow { position: relative; display: grid; grid-template-columns: 62px minmax(0, 1fr) 70px 82px; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid transparent; border-radius: 10px; background: var(--panel); cursor: pointer; text-align: left; transition: border-color .2s, background .2s; }
.mrow:hover { border-color: var(--line); }
.mrow.on { border-color: var(--gold); background: var(--panel-2); }
.sym { font-family: var(--f-mono); font-weight: 700; font-size: 13px; }
.mname { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mpx { text-align: right; display: flex; flex-direction: column; font-family: var(--f-mono); font-size: 12.5px; }
.mpx small { font-size: 11px; }
.held { position: absolute; left: 3px; top: 50%; width: 4px; height: 16px; margin-top: -8px; border-radius: 3px; background: var(--gold); }
.spark { width: 100%; height: 24px; overflow: visible; }

/* ---------- trophies ---------- */

/* ---------- update 1 ---------- */

<script>

'use strict';

const SAVE_KEY = 'mogul-life-save-v1';
const DAY_MS = 1500;

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const randn = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const byId = (list, id) => list.find(x => x.id === id);
const uid = () => Math.random().toString(36).slice(2, 9);
const randName = () => pick(FIRST) + ' ' + pick(LAST);

function fmt(n, opts) {
  if (!isFinite(n)) return '$∞';
  const neg = n < 0; n = Math.abs(n);
  let s;
  if (n < 10 && opts === 'cents') s = n.toFixed(2);
  else if (n < 100 * K) s = Math.round(n).toLocaleString('en-US');
  else {
    const units = [[1e18, 'Qi'], [1e15, 'Qa'], [T, 'T'], [B, 'B'], [M, 'M'], [K, 'K']];
    const [d, u] = units.find(([d]) => n >= d);
    const x = n / d;
    s = (x >= 100 ? x.toFixed(1) : x.toFixed(2)) + u;
  }
  return (neg ? '-$' : '$') + s;
}
function fmtPrice(p) {
  if (p >= 1000) return fmt(p);
  if (p >= 1) return '$' + p.toFixed(2);
  if (p >= 0.01) return '$' + p.toFixed(4);
  return '$' + p.toPrecision(3);
}
const fmtNum = n => n >= 1e6 ? fmt(n).slice(1) : (n >= 100 ? Math.round(n).toLocaleString('en-US') : (+n.toFixed(n < 1 ? 4 : 2)).toString());
const pct = (x, d = 1) => (x >= 0 ? '+' : '') + (x * 100).toFixed(d) + '%';

// ---------- state ----------
let S;

function newMarkets() {
  const mk = { mood: 0, housing: 1, coll: {}, px: {}, tip: null };
  [...STOCKS, ...CRYPTO, ...COMMODITIES].forEach(a => {

  for (let i = 0; i < 40; i++) stepMarkets(mk, true);
  return mk;
}

const vehValue = v => { const d = byId(VEHICLES, v.id), age = S.day - v.day; return d.app ? d.price * Math.min(3, 1 + age * 0.002) : d.price * Math.max(0.35, 0.85 - age * 0.002); };
const collValue = c => { const d = byId(COLLECTIBLES, c.id); return d.price * S.mk.coll[d.t] * c.mult; };

const bizBase = id => { const b = byId(BUSINESSES, id), o = S.biz[id]; return b.inc * bizLvlMult(o.lvl) * branchPower(o); };

  const o = S.biz[id], base = bizBase(id);
  return (o.mkt ? base * 0.08 : 0) + (o.mgr ? base * 0.1 : 0) + (o.ins ? base * 0.03 : 0) + u1BizStaffCost(id);
}
const bizValue = id => { const o = S.biz[id]; return o.ipo && S.mk.px[o.ipo.sym] ? px(o.ipo.sym) * 1e6 * o.ipo.own : o.inv * 0.6; };
function loanLimit() { return Math.max(5 * K, netWorth(true) * 0.5) * (S.credit / 850); }
const taxRate = () => Math.max(0.04, 0.2 - (S.office >= 0 ? OFFICES.slice(0, S.office + 1).reduce((a, o) => a + o.tax, 0) : 0) - (S.staff?.accountant ? 0.03 : 0));
const hustleValue = () => (4 + (S.job ? jobPay(byId(JOBS, S.job), true) * 0.05 : 0) + Object.keys(S.biz).length * 3) * Math.pow(1.6, S.hustleLvl) * legacyMult() * (activeHoliday()?.hustle || 1);
const hustleUpCost = () => 150 * Math.pow(4.2, S.hustleLvl);

function jobPay(j, expected) {
  let p = j.pay * legacyMult() * (S.salaryBoostUntil > S.day ? S.salaryBoost : 1) * (0.75 + S.perf / 200) * (S.raise?.[j.id] || 1);
  if (S.st.en < 10) p *= 0.5;
  if (j.vari && expected) p *= 1 + S.st.rep / 200;
  return p;
}

function netWorth(noLoan) {
  let n = S.money + S.savings + S.bonds.reduce((a, b) => a + b.amt, 0) + holdValue();
  for (const id in S.homes) n += homeValue(id);
  S.vehicles.forEach(v => n += vehValue(v));
  S.coll.forEach(c => n += collValue(c));
  for (const id in S.biz) n += bizValue(id);
  if (S.startup) n += S.startup.val * S.startup.eq * 0.5;
  n += u1NetWorth();
  return noLoan ? n : n - S.loan;
}

// Daily flows, used by both the simulation and the Home dashboard.
function flows() {
  const f = { salary: 0, biz: 0, rent: 0, office: 0, interest: 0, divs: 0, out: { housing: 0, staff: 0, upkeep: 0, family: 0, loan: 0, lawyer: 0 } };
  if (S.job && !jailed()) f.salary = jobPay(byId(JOBS, S.job), true);
  for (const id in S.biz) { f.biz += bizIncome(id); f.out.staff += bizCosts(id); }
  const h = curHome();
  if (h.rent) f.out.housing += h.rent;
  for (const id in S.homes) {
    const d = byId(HOMES, id), o = S.homes[id];
    f.out.housing += d.price * 0.00035;
    if (o.rented && id !== S.home) f.rent += d.price * S.mk.housing * 0.002 * legacyMult();
  }
  S.vehicles.forEach(v => f.out.upkeep += byId(VEHICLES, v.id).price * 0.0006);
  S.pets.forEach(p => f.out.family += byId(PETS, p.id).daily);
  f.out.family += S.kids.length * 40;
  if (S.office >= 0) f.office = OFFICES[S.office].pay;
  f.interest = S.savings * 0.0008;
  for (const sym in S.hold) { const st = STOCKS.find(s => s.sym === sym); if (st && st.div) f.divs += S.hold[sym].sh * px(sym) * st.div; }
  f.out.loan = S.loan * 0.0025;
  if (S.lawyer) f.out.lawyer = Math.max(500, netWorth(true) * 0.00003);
  u1Flows(f);
  f.inTotal = f.salary + f.biz + f.rent + f.office + f.interest + f.divs + f.sponsor + f.kidsPay + f.acq;
  f.outTotal = Object.values(f.out).reduce((a, b) => a + b, 0);
  f.net = f.inTotal - f.outTotal;
  return f;
}

// ---------- requirements ----------
function reqCheck(req) {
  const miss = [];
  if (!req) return miss;
  if (req.edu) req.edu.forEach(e => { if (!S.edu.includes(e)) miss.push(byId(EDU, e).name); });
  if (req.anyDegree && !DEGREES.some(d => S.edu.includes(d))) miss.push('Any degree');
  if (req.prev && (S.jobDays[req.prev] || 0) < req.days) miss.push(`${req.days} days as ${byId(JOBS, req.prev).name} (${Math.floor(S.jobDays[req.prev] || 0)})`);
  ['smt', 'fit', 'rep'].forEach(k => { if (req[k] && S.st[k] < req[k]) miss.push(`${byId(STATS, k).name} ${req[k]}`); });
  if (req.hobby) for (const k in req.hobby) if (S.hobby[k] < req.hobby[k]) miss.push(`${byId(HOBBIES, k).name} skill ${req.hobby[k]}`);
  if (req.veh && !ownsAnyVeh()) miss.push('Any vehicle');
  if (req.vehMin && bestVehPrice() < req.vehMin) miss.push(`A ${fmt(req.vehMin)}+ car`);
  if (req.own && !S.biz[req.own]) miss.push(`Own ${byId(BUSINESSES, req.own).name}`);
  return miss;
}

// ---------- markets ----------
function stepMarkets(mk, warm) {
  mk.mood = clamp(mk.mood * 0.97 + randn() * 0.09, -1, 1);
  const news = [];
  STOCKS.forEach(s => {
    const o = mk.px[s.sym];
    let r = mk.mood * 0.0025 + 0.0007 + s.vol * randn();
    if (mk.tip && mk.tip.sym === s.sym) { r += rand(0.18, 0.35); mk.tip = null; news.push({ t: `${s.name} rockets on surprise buyout rumor`, up: 1, sym: s.sym }); }
    if (!warm && Math.random() < 0.012) {
      const up = Math.random() < 0.55, mag = rand(0.08, 0.22);
      r += up ? mag : -mag;
      news.push({ t: pick(up ? HEADLINES_UP : HEADLINES_DN).replace('{n}', s.name), up, sym: s.sym });
    }
    o.p = Math.max(0.5, o.p * Math.exp(r));
  });
  if (!warm && Math.random() < 0.004) { STOCKS.forEach(s => mk.px[s.sym].p *= rand(0.75, 0.86)); news.push({ t: 'MARKET CRASH: stocks plunge across the board', up: 0, big: 1 }); mk.mood = -0.8; }
  else if (!warm && Math.random() < 0.004) { STOCKS.forEach(s => mk.px[s.sym].p *= rand(1.08, 1.15)); news.push({ t: 'Bull run: every sector rallies', up: 1, big: 1 }); mk.mood = 0.8; }
  CRYPTO.forEach(c => {
    const o = mk.px[c.sym];
    if (c.stable) { o.p = 1 + randn() * 0.002; return; }
    let r = 0.0012 + c.vol * randn() + mk.mood * 0.004;
    if (!warm && c.meme && Math.random() < 0.02) { r += Math.log(rand(2, 7)); news.push({ t: `${c.name} explodes after viral meme`, up: 1, sym: c.sym }); }
    else if (!warm && c.meme && Math.random() < 0.01) { r -= Math.log(rand(5, 20)); news.push({ t: `${c.name} rug pulled! Holders wrecked`, up: 0, sym: c.sym }); }
    o.p = Math.max(c.p * 1e-4, o.p * Math.exp(r));
  });
  COMMODITIES.forEach(c => { const o = mk.px[c.sym]; o.p *= Math.exp(0.0004 + c.vol * randn() - (c.sym === 'GOLD' ? mk.mood * 0.002 : 0)); });
  for (const sym in mk.px) { const o = mk.px[sym]; o.h.push(o.p); if (o.h.length > 90) o.h.shift(); }
  mk.housing = clamp(mk.housing * Math.exp(0.0005 + 0.006 * randn() + mk.mood * 0.001), 0.55, 4);
  for (const t in mk.coll) mk.coll[t] = clamp(mk.coll[t] * Math.exp(0.0008 + COLLECT_TYPES[t].vol * randn()), 0.3, 6);
  return news;
}

// ---------- logging ----------
function log(text, kind = 'info') {
  S.log.unshift({ d: S.day, t: text, k: kind });
  if (S.log.length > 60) S.log.length = 60;
  if (typeof onLog === 'function') onLog();
}
function earn(n, src) { S.money += n; if (n > 0) S.totals.earned += n; }
function spend(n) { if (S.money < n) { sfx('error'); toast('Not enough cash. You need ' + fmt(n) + '.', 'bad'); return false; } S.money -= n; return true; }
function stat(k, d) { S.st[k] = clamp(S.st[k] + d, 0, 100); }
function applyEff(eff, mult = 1) { for (const k in eff) stat(k, eff[k] * mult); }

// ---------- the daily tick ----------
function tick() {
  S.day++;
  const f = flows();
  const j = S.job && byId(JOBS, S.job);

  // work
  if (j && !jailed()) {
    let pay = jobPay(j);
    if (j.vari) {
      const r = Math.random();
      if (r < 0.015) { const v = rand(12, 30); pay *= v; toast(`🔥 You went viral! ${fmt(pay)} today`, 'gold'); confetti(60); sfx('win'); log(`Went viral as a ${j.name}: ${fmt(pay)}`, 'money'); stat('rep', 3); }
      else pay *= rand(0.2, 1.8) * (1 + S.st.rep / 200);
    }
    earn(pay); S.taxAcc += pay;
    S.jobDays[j.id] = (S.jobDays[j.id] || 0) + 1;
    stat('en', -j.drain); stat('hap', -j.stress * 0.3);
    const good = S.st.en > 35 && S.st.hap > 30;
    S.perf = clamp(S.perf + (good ? 0.8 + S.st.smt / 120 : 0) - (S.st.en < 20 ? 1.5 : 0) - (S.st.hap < 15 ? 1.5 : 0) + randn() * 0.6, 0, 100);
    if (j.risk && Math.random() < j.risk) {
      const bill = 3000 + S.money * 0.02;
      stat('hp', -35); S.money -= bill;
      toast(`🚑 Injured on the job! Hospital bill ${fmt(bill)}`, 'bad'); shake(); sfx('bad'); log(`Injured at work. Paid ${fmt(bill)}`, 'bad');
    }
    if (S.perf < 8 && Math.random() < 0.2) { log(`Fired from ${j.name} for poor performance`, 'bad'); toast(`You were fired from ${j.name}!`, 'bad'); shake(); sfx('bad'); S.job = null; stat('hap', -12); }
  }
  if (S.salaryBoostUntil === S.day) toast('Your temporary raise has ended.', 'info');

  // study
  if (S.study && !jailed()) {
    const e = byId(EDU, S.study.id);
    S.study.prog++;
    stat('en', -4);
    if (S.study.prog >= e.days) {
      S.edu.push(e.id); stat('smt', e.smt); S.study = null;
      toast(`🎓 Graduated: ${e.name}!`, 'gold'); confetti(90); sfx('win'); log(`Graduated with ${e.name}`, 'good');
      if (typeof markDirty === 'function') markDirty();
    }
  }

  // businesses
  let bizEarn = 0, ownerDrain = 0;
  for (const id in S.biz) {
    const b = byId(BUSINESSES, id), o = S.biz[id];
    const inc = bizIncome(id); bizEarn += inc; o.earned = (o.earned || 0) + inc;
    S.money -= bizCosts(id);
    if (!o.mgr) ownerDrain += 1.2;
    if (b.heat) S.heat = clamp(S.heat + b.heat, 0, 100);
    if (o.price === 0) stat('rep', 0.02);
  }
  earn(bizEarn); S.taxAcc += bizEarn;
  stat('en', -Math.min(ownerDrain, 14));
  if (Object.keys(S.biz).length && Math.random() < 0.035) bizEvent();

  // startup
  if (S.startup) stepStartup();

  // housing and lifestyle
  const h = curHome();
  if (h.rent) S.money -= h.rent;
  let comfort = h.comfort, hap = h.hap, extra = { hp: 0, fit: 0, smt: 0, rep: 0 };
  if (S.homes[S.home]) S.homes[S.home].upg.forEach(u => { const g = byId(UPGRADES, u); comfort += g.comfort || 0; hap += g.hap || 0; for (const k in extra) extra[k] += g[k] || 0; });
  S.money -= f.out.housing - (h.rent || 0);
  earn(f.rent); S.taxAcc += f.rent;
  S.money -= f.out.upkeep;
  const vbest = S.vehicles.reduce((m, v) => Math.max(m, byId(VEHICLES, v.id).comfort), 0);
  comfort += vbest;
  S.vehicles.forEach(v => { const d = byId(VEHICLES, v.id); hap += d.hap * 0.5; extra.rep += d.rep * 0.3; });
  S.pets.forEach(p => { const d = byId(PETS, p.id); hap += d.hap; extra.fit += d.fit || 0; extra.rep += d.rep || 0; });
  S.money -= f.out.family;
  if (S.partner && S.partnerOut) { hap -= 0.2; S.partner.love = Math.max(5, S.partner.love - 0.3); }
  else if (S.partner) { hap += S.married ? 1 : 0.6; S.partner.love = clamp(S.partner.love - (S.married ? 0.08 : 0.15), 0, 100); if (S.partner.love < 15 && S.day % 10 === 0) toast(`${S.partner.name} feels neglected. Plan a date night!`, 'bad'); if (S.partner.love <= 0) breakUp(true); }
  hap += S.kids.length * 0.4;
  stat('en', comfort * 0.8);
  stat('hap', hap * 0.5 + (50 - S.st.hap) * 0.01);
  stat('hp', (S.st.fit - 45) / 220 + (S.st.en > 30 ? 0.1 : -0.5) + (S.st.hap < 15 ? -0.3 : 0) + extra.hp);
  stat('fit', -0.05 + extra.fit); stat('smt', extra.smt); stat('rep', extra.rep - (S.st.rep > 20 ? 0.03 : 0));

  // politics, money, credit
  if (S.office >= 0) earn(f.office);
  S.savings += f.interest;
  earn(f.divs);
  S.loan += f.out.loan;
  S.money -= f.out.lawyer;
  S.bonds = S.bonds.filter(b => { if (b.until <= S.day) { const p = b.amt * (1 + 0.002 * 30); earn(p); toast(`Bond matured: ${fmt(p)}`, 'good'); log(`Bond matured for ${fmt(p)}`, 'money'); return false; } return true; });
  S.sched = S.sched.filter(x => { if (x.day <= S.day) { earn(x.amt); toast(x.msg, x.amt >= 0 ? 'good' : 'bad'); log(x.msg, 'money'); return false; } return true; });
  if (S.money < 0) {
    const need = -S.money;
    S.loan += need * 1.05; S.money = 0; S.credit = clamp(S.credit - 4, 300, 850);
    if (Math.random() < 0.3) toast(`Cash ran out. The bank covered ${fmt(need)} as debt.`, 'bad');
    if (S.loan > loanLimit() * 1.6) repossess();
  } else if (S.loan === 0 && S.day % 5 === 0) S.credit = clamp(S.credit + 1, 300, 850);
  if (S.st.hp <= 6) { const bill = 5000 + S.money * 0.03; S.money -= bill; S.st.hp = 55; stat('hap', -10); toast(`🏥 You collapsed and were hospitalized. Bill: ${fmt(bill)}`, 'bad'); shake(); sfx('bad'); log(`Hospitalized. Paid ${fmt(bill)}`, 'bad'); }

  // taxes every 7 days
  if (S.day % 7 === 0 && S.taxAcc > 0) {
    const due = S.taxAcc * taxRate();
    if (S.evade) { S.heat = clamp(S.heat + Math.min(12, 2 + Math.log10(due + 1)), 0, 100); log(`Skipped ${fmt(due)} in taxes`, 'bad'); }
    else { S.money -= due; S.totals.taxes += due; log(`Paid ${fmt(due)} in weekly taxes (${Math.round(taxRate() * 100)}%)`, 'info'); }
    S.taxAcc = 0;
  }

  // heat
  S.heat = clamp(S.heat - 0.3, 0, 100);
  if (!jailed() && S.heat > 5 && Math.random() < Math.pow(S.heat / 100, 2) * 0.06 * (S.lawyer ? 0.45 : 1)) investigation();

  // markets
  const news = stepMarkets(S.mk);
  news.forEach(n => {
    S.news.unshift({ d: S.day, ...n });
    if (n.big) { toast('📉 ' + n.t, n.up ? 'good' : 'bad'); if (!n.up) shake(); }
    else if (n.sym && S.hold[n.sym]) { toast(`📰 ${n.sym} (you own it): ${n.t}`, n.up ? 'good' : 'bad'); sfx(n.up ? 'cash' : 'bad'); }
  });
  if (S.news.length > 20) S.news.length = 20;

  // rivals
  S.rivals.forEach(r => r.nw *= Math.random() < 0.06 ? rand(0.94, 0.99) : 1 + r.g * rand(0.3, 1.7));

  u1Tick();

  // random life events
  if (S.day > 4 && !modalOpen() && Math.random() < 0.05) lifeEvent();

  const nw = netWorth();
  S.totals.maxNw = Math.max(S.totals.maxNw, nw);
  checkAchievements();
  if (S.day % 3 === 0) save();
}

function repossess() {
  const assets = [];
  for (const id in S.homes) if (id !== S.home) assets.push({ v: homeValue(id), take: () => delete S.homes[id], n: byId(HOMES, id).name });
  S.vehicles.forEach(v => assets.push({ v: vehValue(v), take: () => S.vehicles = S.vehicles.filter(x => x !== v), n: byId(VEHICLES, v.id).name }));
  S.coll.forEach(c => assets.push({ v: collValue(c), take: () => S.coll = S.coll.filter(x => x !== c), n: byId(COLLECTIBLES, c.id).name }));
  for (const id in S.biz) assets.push({ v: bizValue(id), take: () => delete S.biz[id], n: byId(BUSINESSES, id).name });
  if (S.homes[S.home]) assets.push({ v: homeValue(S.home), take: () => { delete S.homes[S.home]; S.home = 'basement'; }, n: byId(HOMES, S.home).name });
  if (!assets.length) return;
  assets.sort((a, b) => b.v - a.v);
  const a = assets[0];
  a.take(); S.loan = Math.max(0, S.loan - a.v * 0.6);
  toast(`🔒 The bank repossessed your ${a.n}!`, 'bad'); shake(); sfx('bad'); log(`Repossessed: ${a.n}`, 'bad');
  markDirty();
}

function bizEvent() {
  const ids = Object.keys(S.biz), id = pick(ids), b = byId(BUSINESSES, id), o = S.biz[id];
  const r = Math.random();
  if (r < 0.3) { o.boost = rand(1.6, 2.5); o.boostUntil = S.day + 5; toast(`⭐ ${b.name} got a viral review! Income x${o.boost.toFixed(1)} for 5 days`, 'good'); log(`${b.name} went viral`, 'good'); }
  else if (r < 0.5) {
    if (o.price === 2 || Math.random() < 0.5) { toast(`✅ ${b.name} passed its health inspection`, 'good'); stat('rep', 0.5); }
    else { const fine = bizBase(id) * 2; S.money -= fine; toast(`📋 ${b.name} failed inspection. Fine: ${fmt(fine)}`, 'bad'); log(`${b.name} inspection fine ${fmt(fine)}`, 'bad'); }
  } else if (r < 0.75) {
    if (S.staff?.bodyguard && !o.ins) { toast(`🕶️ Your bodyguard scared off robbers at ${b.name}`, 'good'); return; }
    if (o.ins) { toast(`🛡️ A robbery at ${b.name} was fully covered by insurance`, 'info'); return; }
    const loss = bizIncome(id) * 1.5; S.money -= loss; toast(`🦹 ${b.name} was robbed! Lost ${fmt(loss)}`, 'bad'); shake(); log(`${b.name} robbed`, 'bad');
  } else if (r < 0.88) {
    if (o.ins) { toast(`🛡️ A kitchen fire at ${b.name} was covered by insurance`, 'info'); return; }
    o.closedUntil = S.day + 6; toast(`🔥 Fire at ${b.name}! Closed for 6 days`, 'bad'); shake(); sfx('bad'); log(`${b.name} closed by fire`, 'bad');
  } else { stat('rep', 2); toast(`📰 A magazine featured ${b.name}. Reputation up!`, 'good'); }
}

function stepStartup() {
  const s = S.startup;
  s.days++;
  s.val *= Math.exp(0.004 + s.round * 0.0025 + (S.st.smt - 50) / 20000 + 0.055 * randn());
  s.hist.push(s.val); if (s.hist.length > 60) s.hist.shift();
  if (Math.random() < (S.st.smt > 60 ? 0.0015 : 0.003) + (s.val < s.raised * 0.3 ? 0.02 : 0)) {
    toast(`💥 ${s.name} ran out of runway and shut down.`, 'bad'); shake(); sfx('bad'); log(`${s.name} failed`, 'bad');
    S.startup = null; markDirty();
  }
}

function investigation() {
  if (typeof showChoice !== 'function' || modalOpen()) return;
  const fine = Math.max(5 * K, S.money * 0.4);
  showChoice({
    icon: '🚨', title: 'Federal Investigation',
    text: `Investigators are at your door asking about your finances. Heat level: ${Math.round(S.heat)}.`,
    choices: [
      { label: `Pay the fine (${fmt(fine)})`, fn: () => { S.money -= fine; S.heat = 0; stat('rep', -5); log(`Paid ${fmt(fine)} settlement`, 'bad'); return 'You paid up. The case is closed.'; } },
      { label: 'Fight it in court', fn: () => {
        if (Math.random() < (S.lawyer ? 0.7 : 0.4)) { S.heat = Math.max(0, S.heat - 40); stat('rep', 2); return 'Acquitted! Your lawyers tore the case apart.'; }
        goToJail(12, fine * 0.5); return 'Guilty. You are going to jail for 12 days.';
      } },
    ],
  });
}

function goToJail(days, fine) {
  S.money -= fine || 0;
  S.jailUntil = S.day + days; S.heat = 0; S.totals.timesJailed++;
  if (S.job) { log(`Lost job as ${byId(JOBS, S.job).name} (jailed)`, 'bad'); S.job = null; }
  S.study = null; stat('hap', -30); stat('rep', -15);
  shake(); sfx('bad'); log(`Sent to jail for ${days} days`, 'bad'); markDirty();
}

function breakUp(silent) {
  if (!S.partner) return;
  const n = S.partner.name;
  if (S.married) { const loss = S.money * 0.3; S.money -= loss; log(`Divorced ${n}. Lost ${fmt(loss)} in the settlement`, 'bad'); toast(`💔 ${n} divorced you. Settlement: ${fmt(loss)}`, 'bad'); }
  else { log(`${n} broke up with you`, 'bad'); toast(`💔 ${n} broke up with you`, 'bad'); }
  S.partner = null; S.married = false; stat('hap', -15); markDirty();
}

// ---------- life events ----------

    { label: 'Say no', fn: () => { stat('hap', -2); return 'Things are a bit awkward now.'; } } ] },

<script>

'use strict';

const $ = s => document.querySelector(s);

}

  if (!h || h.length < 2) return '';

  return h.map((v, i) => `${(i / (h.length - 1) * w).toFixed(1)},${(hgt - 2 - (v - mn) / r * (hgt - 4)).toFixed(1)}`).join(' ');

function refreshLive() {

    const [k, arg] = el.dataset.live.split(':');

    const v = f(arg);

    if (!hist) return;
    const pts = spark(hist, w, h);
    const line = el.querySelector('polyline'), area = el.querySelector('polygon');
    if (line) line.setAttribute('points', pts);
    if (area) area.setAttribute('points', `0,${h} ${pts} ${w},${h}`);
    const up = hist[hist.length - 1] >= hist[0];
    el.classList.toggle('dn', !up);
  });
  const jail = jailed();
  $$('#panel [data-cost]').forEach(b => { b.disabled = S.money < +b.dataset.cost || (jail && !b.dataset.free); });
}
function sparkSvg(sym, w = 120, h = 34, big) {
  const hist = sym === '@startup' ? S.startup.hist : S.mk.px[sym].h;
  const pts = spark(hist, w, h);
  const up = hist[hist.length - 1] >= hist[0];
  return `<svg class="spark ${big ? 'big' : ''} ${up ? '' : 'dn'}" data-spark="${sym}" data-w="${w}" data-h="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    ${big ? `<polygon points="0,${h} ${pts} ${w},${h}"></polygon>` : ''}<polyline points="${pts}"></polyline></svg>`;
}

// ---------- toasts & modals ----------
function toast(msg, kind = 'info') {
  const t = document.createElement('div');

function scrReveal() {

function startInterview(id) {
  const j = byId(JOBS, id);
  const qs = INTERVIEW_QS.slice().sort(() => Math.random() - 0.5).slice(0, 3);
  let i = 0, score = 0;
  const ask = () => {
    const q = qs[i];
    openModal({ icon: '🧑‍💼', title: `Interview: ${j.name}`, cls: 'interview',
      html: `<div class="iv-dots">${[0, 1, 2].map(k => `<i class="${k < i ? 'done' : k === i ? 'now' : ''}"></i>`).join('')}</div><p class="iv-q">“${esc(q.q)}”</p>`,
      buttons: q.a.slice().sort(() => Math.random() - 0.5).map(([t, s]) => ({ label: esc(t), fn: () => { score += s; i++; setTimeout(i < 3 ? ask : finish, 260); } })) });
  };
  const finish = () => {
    const total = score + S.st.smt / 25 + S.st.rep / 50 + (S.st.hap > 60 ? 0.5 : 0);
    const need = 2 + Math.log10(j.pay) * 0.8;
    S.u.interviews++;
    if (total >= need) {
      openModal({ icon: '🤝', title: "You're hired!", html: `<p>The interviewer shakes your hand. Welcome aboard as a <b class="gold-t">${j.name}</b>.</p>`, buttons: [{ label: 'Start working', cls: 'gold' }] });

  };
  ask();
}

// ---------- dramatic reveal helper ----------
function reveal({ icon, title, wait, then, delay = 1600 }) {
  openModal({ icon, title, html: `<div class="loader-dots"><i></i><i></i><i></i></div><p class="muted">${wait}</p>`, buttons: [{ label: 'Continue', cls: 'gold' }] });
  const w = $$('.modal-wrap').pop(), b = w.querySelector('.m-btns .btn');
  b.disabled = true;
  setTimeout(() => {
    const r = then();
    w.querySelector('.m-ic').textContent = r.icon;
    w.querySelector('h2').innerHTML = r.title;
    w.querySelector('.m-body').innerHTML = r.html;
    w.querySelector('.modal').classList.add('revealed');
    b.disabled = false; b.textContent = r.btn || 'Continue';
    markDirty(); refreshHud();
  }, reduceMotion ? 200 : delay);
}

// ---------- IPO your own business ----------
const ipoValuation = id => bizIncome(id) / (S.biz[id].ipo ? S.biz[id].ipo.own : 1) * 400;
function doIpo(id) {
  const b = byId(BUSINESSES, id), o = S.biz[id];
  if (o.ipo || o.lvl < 10 || b.shady) return;
  const val = ipoValuation(id);
  const sym = (b.name.replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 3) + 'X').slice(0, 4);
  let s = sym, n = 2; while (S.mk.px[s]) s = sym.slice(0, 3) + n++;
  const pop = rand(1.05, 1.45);
  reveal({ icon: '🔔', title: `${b.name} goes public`, wait: `Ringing the opening bell for ${s}…`, then: () => {
    const p = val / 1e6;
    S.mk.px[s] = { p: p * pop, h: [p, p * pop] };
    o.ipo = { sym: s, own: 0.7, name: b.name };
    const cash = val * 0.3; earn(cash); S.u.ipos++;
    confetti(180); sfx('win'); log(`${b.name} IPO raised ${fmt(cash)}`, 'gold'); checkAchievements();
    return { icon: '📈', title: `${s} is live!`, html: `<p>You sold 30% to the public for <b class="gold-t">${fmt(cash)}</b>. The stock popped ${pct(pop - 1, 0)} on day one.</p><p class="muted small">Shareholders now take 30% of its profits. Track it in Empire.</p>`, btn: 'To the moon' };
  } });
}

const globe = { rot: -40, tilt: 18, drag: null, vel: 0.08, raf: 0, hover: null };
function startGlobe() {

  const size = () => { const w = c.clientWidth; c.width = w * d; c.height = w * d; ctx.setTransform(d, 0, 0, d, 0, 0); return w; };
  let W = size();

    const l = (lon + globe.rot) * rad, p = lat * rad, t = globe.tilt * rad, R = W * 0.44;

    const hit = pins.find(p => Math.hypot(p.x - mx, p.y - my) < p.r + 4);

    } else tip.hidden = true;
  };
  c.onpointerup = () => { globe.drag = null; };
  c.onpointerleave = () => { tip.hidden = true; };
  globe.raf = requestAnimationFrame(draw);

// Mogul Life — real-world seasons and holidays, ambient effects, background music, the kick-out scene and patch notes.
'use strict';

];
const SEASONS = { winter: { name: 'Winter', icon: '❄️', fx: 'snow' }, spring: { name: 'Spring', icon: '🌸', fx: 'petals' }, summer: { name: 'Summer', icon: '☀️', fx: 'sun' }, autumn: { name: 'Autumn', icon: '🍂', fx: 'leaves' } };

const holStart = (h, y) => new Date(y, h.m - 1, h.d).getTime();
const holEnd = (h, y) => holStart(h, y) + h.len * 864e5;
function activeHoliday() {
  const now = Date.now(), y = new Date().getFullYear();
  for (const h of HOLIDAYS) for (const yy of [y - 1, y]) if (now >= holStart(h, yy) && now < holEnd(h, yy)) return { ...h, end: holEnd(h, yy), year: yy };

}

  const now = Date.now(), y = new Date().getFullYear();

}

  }

    <div class="hb-txt"><b>${se.name} season</b><small>Next event: ${nx.icon} ${nx.name} in <span data-countdown="${nx.start}"></span></small></div></div>`;

const sfxl = { c: null, x: null, parts: [], kind: '', raf: 0 };
function startSeasonFx() {

function newPart(anywhere) {

  else if (k === 'bats') Object.assign(p, { x: anywhere ? rand(0, W) : -30, y: rand(20, H * 0.7), vx: rand(0.8, 1.8), vy: 0, e: Math.random() < 0.75 ? '🦇' : '🍂' });
  else if (k === 'clovers') Object.assign(p, { vy: rand(0.4, 0.9), vx: 0, e: '🍀' });

}
function seasonLoop(t) {
  const { x, parts, kind } = sfxl, W = innerWidth, H = innerHeight;
  if (!x) return;
  x.clearRect(0, 0, W, H);
  parts.forEach((p, i) => {
    p.ph += 0.02; p.r += p.vr;
    p.x += p.vx + Math.sin(p.ph) * (kind === 'bats' ? 0 : 0.4);
    p.y += p.vy + (kind === 'bats' ? Math.sin(p.ph * 3) * 0.8 : 0);
    x.save(); x.translate(p.x, p.y); x.rotate(kind === 'bats' ? 0 : p.r);
    if (kind === 'snow') { x.globalAlpha = 0.7; x.fillStyle = '#fff'; x.beginPath(); x.arc(0, 0, p.s, 0, 7); x.fill(); }
    else if (kind === 'leaves') { x.globalAlpha = 0.55; x.fillStyle = ['#e8833a', '#c9542a', '#e6b84a', '#9c4a24'][i % 4]; x.beginPath(); x.ellipse(0, 0, 6 * p.s, 3 * p.s, 0, 0, 7); x.fill(); }
    else if (kind === 'petals') { x.globalAlpha = 0.55; x.fillStyle = i % 2 ? '#ffb7d9' : '#fff0f7'; x.beginPath(); x.ellipse(0, 0, 4.5 * p.s, 2.6 * p.s, 0, 0, 7); x.fill(); }
    else if (kind === 'sun') { x.globalAlpha = 0.35 + 0.35 * Math.sin(p.ph * 2); x.fillStyle = '#ffd36b'; x.shadowColor = '#ffd36b'; x.shadowBlur = 10; x.beginPath(); x.arc(0, 0, 1.8 * p.s, 0, 7); x.fill(); }
    else { x.globalAlpha = 0.6; x.font = `${Math.round(16 * p.s)}px serif`; x.textAlign = 'center'; x.fillText(p.e, 0, 0); }
    x.restore();
    if (p.y > H + 30 || p.y < -40 || p.x > W + 40 || p.x < -60) parts[i] = newPart(false);
  });

      const cx = rand(W * 0.1, W * 0.9), cy = rand(H * 0.1, H * 0.5), col = pick(['#f3c14b', '#ff6f7d', '#7aa7ff', '#b493ff', '#3fd9a0']);
      for (let k = 0; k < 40; k++) { const a = k / 40 * 6.28, v = rand(1.2, 2.6); sfxl.bursts.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 70, col }); }

    sfxl.bursts = sfxl.bursts.filter(b => { b.x += b.vx; b.y += b.vy; b.vy += 0.02; b.vx *= 0.985; b.life--; x.globalAlpha = Math.max(0, b.life / 70) * 0.8; x.fillStyle = b.col; x.fillRect(b.x, b.y, 2.2, 2.2); return b.life > 0; });

}

// ---------- background music: a procedural lo-fi loop ----------
const music = { on: true, playing: false, master: null, timer: 0, next: 0, step: 0, noise: null };
try { music.on = localStorage.getItem('mogul-music') !== 'off'; } catch (e) {}
const mhz = n => 440 * Math.pow(2, (n - 69) / 12);
const CHORDS = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]];
const PENTA = [72, 74, 76, 79, 81, 84];
function startMusic() {

    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const m = actx.createGain(); m.gain.value = 0.0001; m.gain.exponentialRampToValueAtTime(0.5, actx.currentTime + 2);
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    const dl = actx.createDelay(); dl.delayTime.value = 0.39; const fb = actx.createGain(); fb.gain.value = 0.32;
    dl.connect(fb).connect(dl); dl.connect(lp);
    m.connect(lp).connect(actx.destination);
    music.master = m; music.lp = lp; music.delay = dl;
    const buf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;

function stopMusic() {

  m.gain.cancelScheduledValues(t); m.gain.setValueAtTime(m.gain.value, t); m.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);

function tone(freq, t, len, vol, type = 'triangle', dest = music.master, attack = 0.01) {
  const o = actx.createOscillator(), g = actx.createGain();

}

function scheduleMusic() {

<script>
// Mogul Life — player actions, game loop and boot.
'use strict';

function noJail() { if (jailed()) { sfx('error'); toast('You can\'t do that from a jail cell.', 'bad'); return false; } return true; }
function bought(name, ev) {
  sfx('buy');
  if (ev) coinBurst(ev.clientX, ev.clientY, 8);
  toast(name, 'good');
  markDirty();
}
function cool(id, days) { S.cd[id] = S.day + days; }

const ACT = {
  tab(id) { S.ui.tab = id; renderNav(); render(); scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); },
  sub(v) { const [t, s] = v.split(':'); S.ui.sub[t] = s; if (S.ui.tab !== t) { S.ui.tab = t; renderNav(); } render(); },
  go(v) { const [t, s] = v.split(':'); if (s) S.ui.sub[t] = s; ACT.tab(t); },
  speed(n) { S.speed = +n; restartLoop(); refreshHud(); },
  sound() { sound = !sound; try { localStorage.setItem('mogul-sound', sound ? 'on' : 'off'); } catch (e) {} $('#soundBtn').classList.toggle('off', !sound); if (S.ui.tab === 'trophies') render(); sfx('click'); },

  hustle(_, el, ev) {

    const x = ev.clientX || r.left + r.width / 2, y = ev.clientY || r.top + r.height / 2;

    coinBurst(x, y, 4);
    sfx('coin');
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    if (S.taps % 25 === 0) checkAchievements();
  },
  hustleUp(_, el, ev) { const c = hustleUpCost(); if (!spend(c)) return; S.hustleLvl++; bought(`Hustle level ${S.hustleLvl + 1}! Each tap pays more.`, ev); },

  apply(id, el, ev, interviewed) {
    if (!noJail()) return;
    const j = byId(JOBS, id);
    if (reqCheck(j.req).length || cdLeft('int_' + id)) return;
    const promo = j.req?.prev === S.job;
    if (!promo && !interviewed) { startInterview(id); return; }
    S.job = id; S.perf = promo ? Math.max(S.perf * 0.6, 40) : 50;

    log(promo ? `Promoted to ${j.name}` : `Started working as a ${j.name}`, 'good');
    checkAchievements(); markDirty();
  },
  quit() { if (!S.job) return; log(`Quit job as ${byId(JOBS, S.job).name}`, 'info'); S.job = null; sfx('click'); markDirty(); },
  enroll(id, el, ev) {
    if (!noJail() || S.study) return;
    const e = byId(EDU, id); if (reqCheck(e.req).length) return;
    if (!spend(e.cost)) return;

  },
  dropout() { if (!S.study) return; log(`Dropped out of ${byId(EDU, S.study.id).name}`, 'bad'); S.study = null; stat('hap', -3); markDirty(); },
  practice(id, el, ev) {
    if (!noJail() || S.st.en < 8) return;

    S.hobby[id] = Math.min(100, S.hobby[id] + gain);

    floatText(`${hb.icon} +${gain.toFixed(1)}`, ev.clientX - 20, ev.clientY - 30, 'violet'); sfx('click');
    markDirty();
  },

  activity(id, el, ev) {
    if (!noJail()) return;
    const a = byId(ACTIVITIES, id);
    if (cdLeft(id)) return;

  buyHome(id, el, ev) {
    const h = byId(HOMES, id), c = h.price * S.mk.housing;
    if (S.homes[id] || !spend(c)) return;
    S.homes[id] = { upg: [], rented: false, paid: c };
    const better = (curHome().price || 0) < h.price;
    if (better) S.home = id;
    bought(`🔑 You bought ${h.name}!${better ? ' Moved in.' : ''}`, ev); confetti(60);
    log(`Bought ${h.name} for ${fmt(c)}`, 'money'); checkAchievements();
  },
  sellHome(id) {
    const h = byId(HOMES, id), v = homeValue(id) * 0.95;
    confirmIt(`Sell ${h.name}?`, `You'll get ${fmt(v)} after fees.`, () => {
      earn(v); delete S.homes[id]; if (S.home === id) S.home = 'basement';
      sfx('cash'); toast(`Sold ${h.name} for ${fmt(v)}`, 'good'); log(`Sold ${h.name} for ${fmt(v)}`, 'money'); markDirty();
    });
  },
  rentOut(id) { const o = S.homes[id]; if (!o || S.home === id) return; o.rented = !o.rented; sfx('click'); toast(o.rented ? `${byId(HOMES, id).name} is now rented out` : 'Tenants moved out', 'info'); markDirty(); },
  upg(v, el, ev) {
    const [hid, uid_] = v.split(':'); const o = S.homes[hid]; if (!o || o.upg.includes(uid_)) return;
    const u = byId(UPGRADES, uid_), c = byId(HOMES, hid).price * u.pct;
    if (!spend(c)) return; o.upg.push(uid_); bought(`${u.icon} Installed ${u.name}`, ev);
  },

  buyVeh(id, el, ev) { const d = byId(VEHICLES, id); if (!spend(d.price)) return; S.vehicles.push({ id, day: S.day, uid: uid() }); bought(`${d.icon} You bought a ${d.name}!`, ev); if (d.price > 100 * K) confetti(50); log(`Bought a ${d.name}`, 'money'); checkAchievements(); },
  sellVeh(u) { const v = S.vehicles.find(x => x.uid === u); if (!v) return; const val = vehValue(v); earn(val); S.vehicles = S.vehicles.filter(x => x !== v); sfx('cash'); toast(`Sold ${byId(VEHICLES, v.id).name} for ${fmt(val)}`, 'good'); markDirty(); },
  buyColl(id, el, ev) { const d = byId(COLLECTIBLES, id), c = collBuyPrice(d); if (!spend(c)) return; S.coll.push({ id, paid: c, mult: rand(0.92, 1.08), uid: uid() }); bought(`${d.icon} You won the auction for ${d.name}`, ev); checkAchievements(); },
  sellColl(u) { const c = S.coll.find(x => x.uid === u); if (!c) return; const v = collValue(c); earn(v); S.coll = S.coll.filter(x => x !== c); sfx('cash'); toast(`Sold ${byId(COLLECTIBLES, c.id).name} for ${fmt(v)}`, v >= c.paid ? 'good' : 'bad'); markDirty(); },

  bizBuy(id, el, ev) {
    const b = byId(BUSINESSES, id); if (S.biz[id] || reqCheck(b.req).length) return;
    if (!spend(b.cost)) return;
    S.biz[id] = { lvl: 1, br: 1, mkt: false, mgr: false, ins: false, price: 1, closedUntil: 0, boost: 1, boostUntil: 0, inv: b.cost, cities: { nyc: 1 }, emp: [], awards: 0, earned: 0, launchCd: 0 };
    bought(`${b.icon} You opened a ${b.name}!`, ev); confetti(50); log(`Opened ${b.name}`, 'money'); checkAchievements();
  },
  bizUp(id, el, ev) { const b = byId(BUSINESSES, id), o = S.biz[id], c = bizUpCost(b, o.lvl); if (!spend(c)) return; o.lvl++; o.inv += c; bought(`${b.name} upgraded to level ${o.lvl}${o.lvl % 10 === 0 ? '. Income doubled!' : ''}`, ev); if (o.lvl % 10 === 0) confetti(60); },
  bizBranch(id) { branchModal(id); },
  bizToggle(v) { const [id, k] = v.split(':'); S.biz[id][k] = !S.biz[id][k]; sfx('click'); markDirty(); },
  bizPrice(v) { const [id, p] = v.split(':'); S.biz[id].price = +p; sfx('click'); markDirty(); },
  bizSell(id) {
    const b = byId(BUSINESSES, id), v = bizValue(id);
    confirmIt(`Sell ${b.name}?`, `A buyer offers ${fmt(v)}.`, () => { earn(v); delete S.biz[id]; sfx('cash'); toast(`Sold ${b.name} for ${fmt(v)}`, 'good'); log(`Sold ${b.name}`, 'money'); markDirty(); });
  },

  suFound(_, el, ev) { if (S.startup || !spend(50 * K)) return; const name = pick(STARTUP_NAMES); S.startup = { name, val: 250 * K, eq: 1, round: 0, raised: 0, days: 0, hist: [250 * K] }; bought(`🦄 You founded ${name}!`, ev); log(`Founded ${name}`, 'good'); },
  suRaise() {
    const s = S.startup, r = ROUNDS[s.round]; if (!s || !r || s.val < r.min) return;
    const raised = s.val * r.take, mine = raised * 0.25;
    s.eq *= 1 - r.dil; s.round++; s.raised += raised; earn(mine);
    sfx('win'); confetti(50); toast(`${s.name} raised ${fmt(raised)} in its ${r.name}! You took home ${fmt(mine)}.`, 'gold'); log(`${s.name} closed ${r.name}`, 'money'); markDirty();
  },
  suIpo() {
    const s = S.startup; if (!s || s.val < B) return;
    const pay = s.val * s.eq; earn(pay); S.ipos++; S.startup = null;
    sfx('win'); confetti(160);
    openModal({ icon: '🔔', title: `${s.name} is public!`, html: `<p>You rang the opening bell. Your ${(s.eq * 100).toFixed(1)}% stake paid out <b class="gold-t">${fmt(pay)}</b>.</p>`, buttons: [{ label: 'Legendary', cls: 'gold' }] });
    log(`${s.name} IPO paid ${fmt(pay)}`, 'gold'); checkAchievements(); markDirty();
  },
  suSell() {
    const s = S.startup; if (!s) return; const pay = s.val * s.eq * 0.8;
    confirmIt(`Sell ${s.name}?`, `An acquirer offers ${fmt(pay)} for your stake.`, () => { earn(pay); S.startup = null; sfx('cash'); toast(`Sold ${s.name} for ${fmt(pay)}`, 'good'); log(`Sold ${s.name} for ${fmt(pay)}`, 'money'); markDirty(); });
  },

  sel(v) { const [k, sym] = v.split(':'); S.ui.sel = S.ui.sel || {}; S.ui.sel[k] = sym; sfx('tick'); render(); },
  buy(v, el, ev) {
    const [sym, f] = v.split(':'); const amt = S.money * +f;
    if (amt < 1) { toast('Not enough cash.', 'bad'); sfx('error'); return; }
    S.money -= amt; addHolding(sym, amt / px(sym), amt);
    coinBurst(ev.clientX, ev.clientY, 6); sfx('buy'); toast(`Bought ${fmt(amt)} of ${sym}`, 'good'); checkAchievements(); render();
  },
  sell(v, el, ev) {
    const [sym, f] = v.split(':'); const h = S.hold[sym]; if (!h) return;
    const sh = h.sh * +f, val = sh * px(sym), basis = h.cost * +f;
    earn(val); h.sh -= sh; h.cost -= basis; if (+f === 1 || h.sh < 1e-9) delete S.hold[sym];
    if (CRYPTO.some(c => c.sym === sym) && basis > 0) S.totals.cryptoX = Math.max(S.totals.cryptoX, val / basis);
    const gain = val - basis;
    if (gain > 0) coinBurst(ev.clientX, ev.clientY, 10);
    sfx(gain >= 0 ? 'cash' : 'bad'); toast(`Sold ${sym} for ${fmt(val)} (${gain >= 0 ? 'profit' : 'loss'} ${fmt(gain)})`, gain >= 0 ? 'good' : 'bad');
    checkAchievements(); render();
  },
  save(f) { const a = S.money * +f; if (a < 1) return; S.money -= a; S.savings += a; sfx('buy'); toast(`Deposited ${fmt(a)}`, 'good'); markDirty(); },
  withdraw() { if (!S.savings) return; earn(S.savings); toast(`Withdrew ${fmt(S.savings)}`, 'good'); S.savings = 0; sfx('cash'); markDirty(); },
  bond(f) { const a = S.money * +f; if (a < 100) { toast('Bonds start at $100.', 'bad'); return; } S.money -= a; S.bonds.push({ amt: a, until: S.day + 30 }); sfx('buy'); toast(`Bought a ${fmt(a)} bond`, 'good'); markDirty(); },
  borrow(f) {
    const room = loanLimit() - S.loan; const a = Math.max(0, Math.min(room, loanLimit() * +f));
    if (a < 100) { toast('You have hit your borrowing limit.', 'bad'); sfx('error'); return; }
    S.loan += a; earn(a); S.credit = clamp(S.credit - 5, 300, 850); sfx('cash'); toast(`Borrowed ${fmt(a)}`, 'info'); markDirty();
  },
  repay(f) { const a = Math.min(S.money, S.loan * +f); if (a < 1) return; S.money -= a; S.loan -= a; if (S.loan < 1) { S.loan = 0; S.credit = clamp(S.credit + 15, 300, 850); toast('Loan paid off! Credit score up.', 'good'); confetti(30); } else toast(`Repaid ${fmt(a)}`, 'good'); sfx('buy'); markDirty(); },

  date(_, el, ev) {
    if (!noJail()) return;
    const c = dateCost(); if (!spend(c)) return;
    if (S.partner) { S.partner.love = Math.min(100, S.partner.love + rand(8, 15) * (activeHoliday()?.love || 1)); stat('hap', 4); floatText('❤️', ev.clientX, ev.clientY - 30); sfx('buy'); toast(`Lovely evening with ${S.partner.name}`, 'good'); }
    else {
      const ch = 0.25 + S.st.hap / 400 + S.st.rep / 300 + S.st.fit / 400;
      if (Math.random() < ch) { S.partner = { name: randName(), love: 30 }; sfx('win'); confetti(30); toast(`💘 It's a match! You're dating ${S.partner.name}`, 'gold'); log(`Started dating ${S.partner.name}`, 'good'); }
      else { stat('hap', -3); sfx('bad'); toast(pick(['They spent the whole date on their phone.', 'They ghosted you after dessert.', 'No spark. Better luck next time.']), 'bad'); }
    }
    markDirty();
  },
  gift(_, el, ev) { if (!S.partner) return; const c = giftCost(); if (!spend(c)) return; S.partner.love = Math.min(100, S.partner.love + rand(5, 10)); floatText('🎁', ev.clientX, ev.clientY - 30); sfx('buy'); markDirty(); },
  propose() {
    if (!S.partner || S.married || S.partner.love < 75) return;
    const c = ringCost(); if (!spend(c)) return;
    if (Math.random() < 0.4 + S.partner.love / 200) {
      S.married = true; stat('hap', 20); sfx('win'); confetti(150);
      openModal({ icon: '💍', title: 'They said yes!', html: `<p>You married ${esc(S.partner.name)} in a ceremony people will talk about for years.</p>`, buttons: [{ label: 'Best day ever', cls: 'gold' }] });
      log(`Married ${S.partner.name}`, 'gold'); checkAchievements();
    } else { S.partner.love -= 20; stat('hap', -10); sfx('bad'); toast(`${S.partner.name} said they're not ready yet.`, 'bad'); }
    markDirty();
  },
  baby() {
    if (!S.married || S.partnerOut || !spend(5000)) return;
    if (Math.random() < 0.6) { const n = pick(FIRST); S.kids.push({ name: n, smt: 10, born: S.day }); stat('hap', 15); sfx('win'); confetti(70); toast(`👶 Welcome to the world, ${n}!`, 'gold'); log(`Had a baby: ${n}`, 'gold'); checkAchievements(); }
    else toast('No luck this time. Try again soon.', 'info');
    markDirty();
  },
  tutor(i, el, ev) { const k = S.kids[+i]; if (!k) return; const c = tutorCost(k); if (!spend(c)) return; k.smt = Math.min(100, k.smt + rand(5, 10)); floatText('🧠', ev.clientX, ev.clientY - 30); sfx('buy'); markDirty(); },
  breakup() { if (!S.partner) return; confirmIt(S.married ? 'File for divorce?' : 'Break up?', S.married ? 'You will lose 30% of your cash in the settlement.' : 'This will hurt your happiness.', () => breakUp()); },
  hangout(_, el, ev) { if (!noJail() || cdLeft('hang') || !spend(60)) return; stat('hap', 6); stat('rep', 0.5); cool('hang', 2); floatText('🍻', ev.clientX, ev.clientY - 30); sfx('buy'); markDirty(); },
  party(_, el, ev) {
    if (!noJail() || cdLeft('party')) return; const c = partyCost(); if (!spend(c)) return;
    const h = curHome(), boost = 2 + Math.log10((h.price || 2000) / 1000) * 1.5;
    stat('rep', boost); stat('hap', 10); stat('en', -15); cool('party', 7); sfx('win'); confetti(90);
    toast(`🎉 Legendary party at your ${h.name}! +${boost.toFixed(1)} reputation`, 'gold'); markDirty();
  },
  pet(id, el, ev) {
    const p = byId(PETS, id); if (p.home && (curHome().price || 0) < p.home) return;
    if (!spend(p.cost)) return;
    const n = pick(['Bubbles', 'Rocket', 'Duchess', 'Waffles', 'Captain', 'Pickles', 'Noodle', 'Zeus', 'Mango', 'Ziggy']);
    S.pets.push({ id, name: n }); bought(`${p.icon} Meet ${n} the ${p.name}!`, ev); checkAchievements();
  },
  donate(id, el, ev) { const c = byId(CHARITY, id); if (!spend(c.amt)) return; stat('rep', c.rep); stat('hap', 3); bought(`Donated ${fmt(c.amt)}. +${c.rep} reputation`, ev); log(`Donated ${fmt(c.amt)} to charity`, 'good'); checkAchievements(); },
  build(id, el, ev) {
    const m = byId(MONUMENTS, id); if (S.monuments.includes(id) || !spend(m.cost)) return;
    S.monuments.push(id); stat('rep', m.rep); if (m.hap) stat('hap', m.hap);
    sfx('win'); confetti(120); toast(`${m.icon} The ${m.name} is complete!`, 'gold'); log(`Built the ${m.name}`, 'gold'); checkAchievements(); markDirty();
  },
  campaign(i) {
    if (!noJail()) return;
    const o = OFFICES[+i]; if (S.office !== +i - 1 || cdLeft('camp')) return;
    if (!spend(o.cost)) return;
    cool('camp', 10);
    const ch = clamp(0.35 + (S.st.rep - o.rep) / 40 - S.heat / 200, 0.05, 0.95);
    const win = Math.random() < ch;
    if (win) { S.office = +i; stat('rep', 5); sfx('win'); confetti(130); openModal({ icon: o.icon, title: `You won the election!`, html: `<p>You are now ${o.name}. You earn ${fmt(o.pay)} a day and taxes dropped to ${Math.round(taxRate() * 100)}%.</p>`, buttons: [{ label: 'Victory speech', cls: 'gold' }] }); log(`Elected ${o.name}`, 'gold'); checkAchievements(); }
    else { stat('hap', -8); sfx('bad'); shake(); toast(`You lost the race for ${o.name}. Your odds were ${Math.round(ch * 100)}%.`, 'bad'); log(`Lost the election for ${o.name}`, 'bad'); }
    markDirty();
  },
  evade() { S.evade = !S.evade; sfx('click'); toast(S.evade ? 'You stopped paying taxes. Heat will rise.' : 'Back to paying taxes like a good citizen.', S.evade ? 'bad' : 'good'); markDirty(); },
  insider() {
    if (cdLeft('insider')) return; const c = insiderCost(); if (!spend(c)) return;
    const s = pick(STOCKS); S.mk.tip = { sym: s.sym }; S.heat = clamp(S.heat + 25, 0, 100); cool('insider', 5);
    S.ui.sub.invest = 'stocks'; S.ui.sel = S.ui.sel || {}; S.ui.sel.stocks = s.sym;
    openModal({ icon: '🕵️', title: 'The tip', html: `<p>A nervous man whispers: <b class="gold-t">"Buy ${s.sym}. Tonight."</b></p>`, buttons: [{ label: `Open ${s.sym}`, cls: 'gold', fn: () => ACT.tab('invest') }, { label: 'Close' }] });
  },
  bribe() {
    const c = bribeCost(); if (!spend(c)) return;
    if (Math.random() < 0.15) { S.heat = clamp(S.heat + 20, 0, 100); sfx('bad'); shake(); toast('The official reported you! Heat went UP.', 'bad'); }
    else { S.heat = clamp(S.heat - 35, 0, 100); sfx('cash'); toast('Your problems quietly disappeared.', 'good'); }
    markDirty();
  },
  lawyer() { S.lawyer = !S.lawyer; sfx('click'); toast(S.lawyer ? 'A sharp lawyer is now on retainer.' : 'Lawyer dismissed.', 'info'); markDirty(); },

  retire() {
    const g = legacyGain(); if (!g) return;
    const heir = S.kids.length ? S.kids.slice().sort((a, b) => b.smt - a.smt)[0].name : randName().split(' ')[0];
    confirmIt('Pass on your empire?', `${esc(heir)} takes over with ${S.legacy.pts + g} legacy points. Everything else resets.`, () => {
      const lg = { pts: S.legacy.pts + g, gen: S.legacy.gen + 1, best: Math.max(S.legacy.best, netWorth()) };
      const ach = S.ach, login = S.login, fund = S.retire || 0;
      S = freshState(lg, ach, { name: heir, login });
      S.name = heir; S.seenIntro = true; S.patchSeen = 1;
      u1Migrate(); S.money += fund;
      if (fund) log(`${heir} inherited a ${fmt(fund)} retirement fund`, 'gold');
      log(`${heir} inherits the family legacy. Generation ${lg.gen} begins.`, 'gold');
      confetti(200); sfx('win'); checkAchievements(); save(); restartLoop(); renderNav(); render();
      openModal({ icon: '🏰', title: `Generation ${lg.gen}`, html: `<p>${esc(heir)} starts fresh with a <b class="gold-t">+${lg.pts * 4}%</b> income bonus and ${fmt(S.money)} in cash.</p>`, buttons: [{ label: 'Build the dynasty', cls: 'gold' }] });
    });
  },
  reset() {
    confirmIt('Reset everything?', 'This deletes your save, achievements and legacy. There is no undo.', () => {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      S = freshState(); S.patchSeen = 1; u1Migrate(); save(); restartLoop(); renderNav(); render(); intro();
    }, 'danger');
  },
};

function confirmIt(title, text, yes, cls = 'gold') {
  openModal({ title, html: `<p>${text}</p>`, buttons: [{ label: 'Yes', cls, fn: () => { yes(); } }, { label: 'Cancel', cls: 'ghost' }] });
}

// ---------- input ----------
let pointerDown = false;
document.addEventListener('pointerdown', () => { pointerDown = true; });
document.addEventListener('pointerup', () => { setTimeout(() => pointerDown = false, 60); });
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act, f = ACT[a] || CASINO[a] || ADMIN[a] || U1[a] || EXTRA[a];
  if (!f) return;
  if (!['hustle', 'tab', 'sub', 'sel', 'go'].includes(a)) sfx('click');
  f(el.dataset.id, el, ev);
  adminApply();
  refreshHud(); refreshLive();
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'pname') { S.name = ev.target.value.trim().slice(0, 20) || 'You'; save(); }
});
document.addEventListener('keydown', ev => {
  if (ev.target.matches('input, textarea, select')) return;
  if (ev.code === 'Space' && S.ui.tab === 'home' && !modalOpen()) { ev.preventDefault(); const b = $('.hustle'); if (b && !b.disabled) { const r = b.getBoundingClientRect(); ACT.hustle('', b, { clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 }); refreshHud(); } }
});

// ---------- loop ----------
let loopId = 0, sinceRender = 0;
function restartLoop() {
  clearInterval(loopId);
  if (!S.speed) return;
  loopId = setInterval(step, DAY_MS / S.speed);
}
function step() {
  if (modalOpen()) return;
  const before = S.money;
  tick();
  adminApply();
  cashPulse();
  if (!$('#admin').hidden && S.day % 2 === 0 && !document.activeElement?.closest('#admin')) renderAdmin();
  if (S.money - before > 0 && S.ui.tab === 'home' && S.speed <= 2) {
    const c = $('#cashwrap').getBoundingClientRect();
    floatText('+' + fmt(S.money - before), c.left + 10, c.bottom - 4, 'mint small');
  }
  sinceRender++;
  const refreshTabs = ['home', 'work', 'biz', 'assets', 'life', 'trophies'];
  if ((dirty && !(S.ui.tab === 'casino' && (race || busy))) || (sinceRender >= 6 && refreshTabs.includes(S.ui.tab) && !pointerDown && !document.activeElement?.matches('input, select'))) { sinceRender = 0; render(); }
  else refreshLive();
  refreshHud();
}

// ---------- boot ----------
function intro() {
  if (S.seenIntro) return;
  openModal({ icon: '🏙️', title: 'Welcome to Mogul Life', cls: 'intro',
    html: `<p>You start with <b class="gold-t">$1,000</b> and a couch in your parents' basement. Every day you earn, spend and invest. Build the biggest fortune on the leaderboard.</p>
      <ul class="intro-list"><li><b>Hustle</b> on the Home tab for quick cash (or press Space).</li><li><b>Work</b> a job, study, and climb a career ladder.</li><li><b>Businesses</b> earn money every day, even while you're away.</li><li>Keep your <b>energy, health and happiness</b> up in Life.</li></ul>
      <label class="name-in">What's your name? <input id="introName" maxlength="20" placeholder="You"></label>`,
    buttons: [{ label: 'Start my empire', cls: 'gold', fn: (close, w) => { const n = w.querySelector('#introName').value.trim(); if (n) S.name = n; S.seenIntro = true; save(); sfx('win'); confetti(60); dailyLogin(); } }] });
}
function offlineEarnings() {
  const secs = (Date.now() - (S.lastSave || Date.now())) / 1000;
  if (secs < 60) return;
  const days = Math.min(secs, 8 * 3600) / (DAY_MS / 1000);
  const f = flows();
  const passive = Math.max(0, f.biz + f.rent + f.office + f.divs - f.out.staff);
  const amt = passive * days * 0.5;
  if (amt < 1) return;
  earn(amt);
  const hrs = secs / 3600;
  openModal({ icon: '🌙', title: 'Welcome back!', html: `<p>While you were away for ${hrs >= 1 ? hrs.toFixed(1) + ' hours' : Math.round(secs / 60) + ' minutes'}, your empire earned</p><div class="m-big">${fmt(amt)}</div><p class="muted small">Away earnings run at 50% speed, up to 8 hours.</p>`,
    buttons: [{ label: 'Collect', cls: 'gold', fn: () => { sfx('cash'); confetti(60); coinBurst(innerWidth / 2, innerHeight / 2, 24); } }] });
}
function dailyLogin() {
  const today = new Date().toDateString();
  if (S.login.last === today) return;
  const y = new Date(Date.now() - 864e5).toDateString();
  S.login.streak = S.login.last === y ? S.login.streak % 7 + 1 : 1;
  S.login.last = today;
  const base = Math.max(500, netWorth() * 0.004);
  const reward = base * S.login.streak * (S.login.streak === 7 ? 2 : 1);
  earn(reward); save();
  openModal({ icon: '🎁', title: 'Daily bonus', html: `<div class="streak">${[1, 2, 3, 4, 5, 6, 7].map(d => `<div class="${d < S.login.streak ? 'got' : d === S.login.streak ? 'now' : ''}"><small>Day ${d}</small><span>${d === 7 ? '💎' : '💰'}</span></div>`).join('')}</div><div class="m-big">${fmt(reward)}</div><p class="muted small">Come back tomorrow to keep your streak going. Day 7 pays double.</p>`,
    buttons: [{ label: 'Claim', cls: 'gold', fn: () => { sfx('cash'); confetti(50); } }] });
}

function start(hot) {
  let loaded = null;
  try { if (hot && hot.S) loaded = JSON.parse(hot.S); } catch (e) {}
  S = loaded || load() || freshState();
  S.ui = S.ui || { tab: 'home', sub: {} };
  u1Migrate();
  if (!S.seenIntro) S.patchSeen = 1;
  fxInit(); renderStats(); renderNav(); render(); refreshHud(); animateCash(); lastCash = S.money;
  $('#soundBtn').classList.toggle('off', !sound);
  syncMusicBtn(); holidayWatch(); startSeasonFx();
  restartLoop();
  if (!S.seenIntro) intro();
  else { offlineEarnings(); dailyLogin(); if (!S.patchSeen) showPatchNotes(); }
  addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  try { window.claude?.hot?.snapshot?.(() => ({ S: JSON.stringify(S) })); } catch (e) {}
  let rs; addEventListener('resize', () => { clearTimeout(rs); rs = setTimeout(() => { if (S.ui.tab === 'home') startSkyline(); }, 200); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>
