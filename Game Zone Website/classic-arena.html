<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Classic Arena</title>
  <meta name="description" content="Classic games in 3D with free online multiplayer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #070b18;
  --panel: rgba(16, 22, 46, 0.78);
  --panel2: rgba(255, 255, 255, 0.07);
  --line: rgba(255, 255, 255, 0.12);
  --text: #f1f4ff;
  --muted: #9ba6cf;
  --a1: #ff7a59;
  --a2: #ff3d8b;
  --p0: #ff5a6e;
  --p1: #4da3ff;
  --ok: #3ddc84;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
.hidden { display: none !important; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#menu-bg {
  position: fixed; inset: 0; pointer-events: none; transition: opacity .6s;
  background:
    radial-gradient(ellipse at 15% -10%, rgba(255, 80, 140, .22), transparent 55%),
    radial-gradient(ellipse at 95% 110%, rgba(77, 163, 255, .22), transparent 55%),
    linear-gradient(180deg, rgba(7, 11, 24, .25), rgba(7, 11, 24, .8));
}
body.in-game #menu-bg { opacity: 0; }

/* ---------- screens */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity .45s ease; }
.screen.active { opacity: 1; pointer-events: auto; }
#home { overflow-y: auto; padding: 0 24px 56px; }
#hud.active { pointer-events: none; }
#hud button { pointer-events: auto; }

/* ---------- buttons */
.btn {
  font: 600 15px Inter, sans-serif; color: var(--text); cursor: pointer;
  padding: 12px 20px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel2);
  transition: transform .18s cubic-bezier(.2, .8, .2, 1), background .2s, box-shadow .2s, border-color .2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.btn:hover { background: rgba(255, 255, 255, .12); transform: translateY(-2px); }
.btn:active { transform: translateY(0) scale(.97); }
.btn.primary { background: linear-gradient(135deg, var(--a1), var(--a2)); border: none; box-shadow: 0 10px 28px -10px var(--a2); }
.btn.primary:hover { box-shadow: 0 14px 34px -10px var(--a2); }
.btn.ghost { backdrop-filter: blur(10px); }
.btn.link { background: none; border: none; color: var(--muted); font-weight: 500; margin-top: 6px; }
.btn.link:hover { color: var(--text); transform: none; }
.btn.round { width: 46px; height: 46px; padding: 0; border-radius: 50%; font-size: 16px; backdrop-filter: blur(10px); background: var(--panel); }
.btn.big { width: 100%; justify-content: flex-start; padding: 16px 18px; text-align: left; border-radius: 18px; }
.btn.big .bi { font-size: 26px; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; background: rgba(255, 255, 255, .12); flex: none; }
.btn.big b { display: block; font-size: 16px; }
.btn.big small { display: block; font-weight: 500; font-size: 13px; opacity: .8; margin-top: 2px; }
.mini { font: 600 12px Inter; color: var(--text); background: rgba(255, 255, 255, .12); border: none; padding: 5px 10px; border-radius: 99px; cursor: pointer; }
.mini:hover { background: rgba(255, 255, 255, .2); }

/* ---------- home */
.top { display: flex; align-items: center; justify-content: space-between; max-width: 1180px; margin: 0 auto; padding: 22px 0; gap: 12px; }
.logo { font: 600 24px Fredoka, sans-serif; display: flex; align-items: center; gap: 10px; letter-spacing: .01em; }
.logo b { font-weight: 700; background: linear-gradient(90deg, var(--a1), var(--a2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo-ball {
  width: 28px; height: 28px; border-radius: 50%; position: relative;
  background: radial-gradient(circle at 32% 30%, #fff, #ffd1a8 18%, var(--a1) 45%, var(--a2) 100%);
  box-shadow: 0 0 22px -2px var(--a2); animation: bob 2.4s ease-in-out infinite;
}
.top-actions { display: flex; align-items: center; gap: 12px; }
.pill { display: flex; align-items: center; gap: 9px; padding: 7px 8px 7px 14px; border-radius: 99px; background: rgba(61, 220, 132, .14); border: 1px solid rgba(61, 220, 132, .4); font-size: 13px; font-weight: 600; animation: fadeUp .4s; }
.pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: ping 1.6s infinite; }
.hero { max-width: 1180px; margin: 4vh auto 36px; animation: fadeUp .7s cubic-bezier(.2, .8, .2, 1) both; }
.hero h1 { font: 700 clamp(38px, 6.2vw, 68px)/1.04 Fredoka, sans-serif; letter-spacing: -.01em; }
.grad { background: linear-gradient(90deg, var(--a1), var(--a2), #8f7bff, var(--a1)); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 8s linear infinite; }
.hero p { color: var(--muted); font-size: 17px; margin-top: 14px; max-width: 520px; line-height: 1.5; }
.diff-row { display: flex; align-items: center; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
.diff-row > span { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.diff { display: inline-flex; gap: 4px; padding: 4px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); backdrop-filter: blur(10px); }
.diff button { font: 600 14px Inter, sans-serif; color: var(--muted); background: none; border: none; padding: 8px 16px; border-radius: 99px; cursor: pointer; transition: color .2s, background .25s, box-shadow .25s; }
.diff button:hover { color: var(--text); }
.diff button.on { color: #fff; background: linear-gradient(135deg, var(--a1), var(--a2)); box-shadow: 0 6px 18px -8px var(--a2); }
.diff button[data-d="0"].on { background: linear-gradient(135deg, #3ddc84, #23a6d5); box-shadow: 0 6px 18px -8px #3ddc84; }
.diff button[data-d="3"].on { background: linear-gradient(135deg, #b026ff, #ff2b2b); box-shadow: 0 6px 18px -8px #b026ff; }
.grid { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 18px; }
.gcard {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; padding: 22px;
  border-radius: 24px; border: 1px solid var(--line); color: inherit; font: inherit; text-align: left; cursor: pointer; overflow: hidden;
  background: linear-gradient(160deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .02)); backdrop-filter: blur(14px);
  opacity: 0; translate: 0 26px; animation: cardIn .7s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: calc(var(--i) * 70ms + 200ms);
  transition: transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s, border-color .3s;
}
.gcard::before { content: ''; position: absolute; top: -70px; right: -70px; width: 190px; height: 190px; border-radius: 50%; background: var(--c); filter: blur(60px); opacity: .22; transition: opacity .3s, transform .5s; }
.gcard:hover { transform: translateY(-7px); border-color: color-mix(in srgb, var(--c) 55%, transparent); box-shadow: 0 24px 50px -22px var(--c); }
.gcard:hover::before { opacity: .45; transform: scale(1.2); }
.gcard:active { transform: translateY(-2px) scale(.98); }
.gicon { width: 66px; height: 66px; border-radius: 20px; display: grid; place-items: center; font-size: 36px; background: linear-gradient(140deg, color-mix(in srgb, var(--c) 85%, white), color-mix(in srgb, var(--c) 70%, black)); box-shadow: 0 10px 24px -10px var(--c), inset 0 1px 0 rgba(255, 255, 255, .4); transition: transform .4s cubic-bezier(.3, 1.6, .5, 1); }
.gcard:hover .gicon { transform: rotate(-8deg) scale(1.1); }
.gtext h3 { font: 600 22px Fredoka, sans-serif; }
.gtext p { color: var(--muted); font-size: 14px; margin-top: 5px; line-height: 1.4; }
.gplay { margin-top: auto; font-weight: 700; font-size: 13px; color: var(--c); display: flex; align-items: center; gap: 6px; letter-spacing: .03em; text-transform: uppercase; }
.gplay span { transition: transform .3s; }
.gcard:hover .gplay span { transform: translateX(5px); }

/* ---------- modal */
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(3, 6, 15, .55); backdrop-filter: blur(6px); opacity: 0; transition: opacity .25s; }
.modal.show { opacity: 1; }
.modal .card {
  width: min(440px, 100%); padding: 30px 26px 20px; border-radius: 28px; background: var(--panel); border: 1px solid var(--line);
  box-shadow: 0 30px 80px rgba(0, 0, 0, .5); text-align: center; display: flex; flex-direction: column; gap: 18px;
  transform: scale(.9) translateY(14px); transition: transform .4s cubic-bezier(.2, 1.3, .4, 1);
}
.modal.show .card { transform: none; }
.m-head h2 { font: 600 28px Fredoka, sans-serif; }
.m-head p { color: var(--muted); margin-top: 6px; font-size: 15px; }
.m-icon { width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 24px; display: grid; place-items: center; font-size: 42px; background: linear-gradient(140deg, color-mix(in srgb, var(--c, var(--a2)) 85%, white), color-mix(in srgb, var(--c, var(--a2)) 65%, black)); box-shadow: 0 14px 30px -12px var(--c, var(--a2)); animation: popIn .6s cubic-bezier(.3, 1.6, .5, 1); }
.m-icon.pulse { animation: bob 2s ease-in-out infinite; }
.m-actions { display: flex; flex-direction: column; gap: 10px; }
.m-actions.row { flex-direction: row; }
.m-actions.row .btn { flex: 1; }
.m-status { min-height: 20px; font-size: 14px; color: var(--muted); }
.m-status.err { color: #ff7d8a; }
.code { display: flex; justify-content: center; gap: 8px; }
.code span { width: 54px; height: 66px; display: grid; place-items: center; font: 700 36px Fredoka; border-radius: 16px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); animation: dropIn .5s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: calc(var(--i) * 70ms); }
.code-input { width: 100%; font: 700 38px Fredoka; letter-spacing: .4em; text-align: center; text-transform: uppercase; padding: 14px 0 14px .4em; border-radius: 18px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); color: var(--text); outline: none; transition: border-color .2s, box-shadow .2s; user-select: text; }
.code-input:focus { border-color: var(--a2); box-shadow: 0 0 0 4px rgba(255, 61, 139, .18); }
.shake { animation: shake .4s; }
.waiting { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 14px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, .15); border-top-color: var(--a2); animation: spin .8s linear infinite; }
.result .trophy { font-size: 64px; animation: popIn .7s cubic-bezier(.3, 1.6, .5, 1); }
.result h2 { font: 700 38px Fredoka; margin-top: 4px; }
.result.win h2 { background: linear-gradient(90deg, #ffd54a, var(--a1)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.result .final { font: 700 46px Fredoka; display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 8px; }
.result .final .p0 { color: var(--p0); } .result .final .p1 { color: var(--p1); }
.result .final i { color: var(--muted); font-style: normal; font-size: 30px; }
.result .sub { color: var(--muted); margin-top: 2px; }

/* ---------- HUD */
#btn-exit { position: absolute; top: 16px; left: 16px; }
.scoreboard { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; backdrop-filter: blur(12px); overflow: hidden; box-shadow: 0 12px 34px rgba(0, 0, 0, .35); }
#hud.active .scoreboard { animation: slideDown .6s cubic-bezier(.2, 1.2, .4, 1) both; }
.pl { display: flex; align-items: center; gap: 12px; padding: 9px 18px; transition: background .35s; }
.pl .name { font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.pl .name::before { content: ''; width: 9px; height: 9px; border-radius: 50%; }
.pl.p0 .name::before { background: var(--p0); }
.pl.p1 .name::before { background: var(--p1); }
.pl .score { font: 700 30px Fredoka; min-width: 30px; text-align: center; display: inline-block; }
.pl.p0 .score { color: var(--p0); } .pl.p1 .score { color: var(--p1); }
.pl.p0.active { background: linear-gradient(90deg, rgba(255, 90, 110, .28), transparent); }
.pl.p1.active { background: linear-gradient(270deg, rgba(77, 163, 255, .28), transparent); }
.pl.active .name { color: var(--text); }
.score.pop { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
.mid { padding: 7px 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-left: 1px solid var(--line); border-right: 1px solid var(--line); min-width: 150px; }
.gname { font: 700 10px Inter; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.info { font-size: 13px; font-weight: 600; white-space: nowrap; margin-top: 2px; }
.turn { position: absolute; top: 86px; left: 50%; transform: translateX(-50%); padding: 7px 16px; border-radius: 99px; font-weight: 700; font-size: 13px; background: var(--panel); border: 1px solid var(--line); animation: fadeUp .35s; }
.turn.mine { background: linear-gradient(90deg, var(--a1), var(--a2)); border-color: transparent; animation: glow 1.8s ease-in-out infinite; }
.banner { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font: 700 clamp(30px, 5.5vw, 60px) Fredoka; text-shadow: 0 6px 30px rgba(0, 0, 0, .55); opacity: 0; white-space: nowrap; pointer-events: none; }
.banner.show { animation: banner 1.9s cubic-bezier(.2, .8, .2, 1) forwards; }
.countdown { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); font: 700 150px Fredoka; text-shadow: 0 10px 40px rgba(0, 0, 0, .5); opacity: 0; pointer-events: none; }
.countdown.pop { animation: count .65s ease-out; }
.power { position: absolute; bottom: 74px; left: 50%; transform: translateX(-50%); width: min(340px, 70vw); height: 16px; border-radius: 99px; background: rgba(0, 0, 0, .5); border: 1px solid var(--line); overflow: hidden; animation: fadeUp .25s; }
.power .fill { position: relative; height: 100%; width: 0; background: linear-gradient(90deg, #3ddc84, #ffd54a 60%, #ff4d4d); background-size: min(340px, 70vw) 100%; border-radius: 99px; }
.power .mark { position: absolute; top: 0; bottom: 0; width: 10%; z-index: 1; background: rgba(255, 255, 255, .22); border-left: 2px solid #fff; border-right: 2px solid #fff; }
.crosshair { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .9); box-shadow: 0 0 0 1px rgba(0, 0, 0, .4); }
.crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #ff3d5a; }
.hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: 99px; background: rgba(0, 0, 0, .4); backdrop-filter: blur(8px); color: rgba(255, 255, 255, .8); font-size: 13px; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }

/* ---------- toasts & confetti */
#toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { padding: 11px 18px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(12px); font-weight: 600; font-size: 14px; box-shadow: 0 12px 30px rgba(0, 0, 0, .4); animation: toast 2.8s cubic-bezier(.2, .8, .2, 1) forwards; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 25; overflow: hidden; }
#confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }

/* ---------- animations */
@keyframes cardIn { to { opacity: 1; translate: 0 0; } }
@keyframes fadeUp { from { opacity: 0; translate: 0 12px; } }
@keyframes slideDown { from { opacity: 0; translate: 0 -30px; } }
@keyframes dropIn { from { opacity: 0; transform: translateY(-20px) scale(.6); } }
@keyframes popIn { from { opacity: 0; transform: scale(.3) rotate(-20deg); } }
@keyframes pop { 40% { transform: scale(1.6); } }
@keyframes bob { 50% { transform: translateY(-5px) rotate(20deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { to { background-position: 300% 0; } }
@keyframes ping { 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes glow { 50% { box-shadow: 0 0 26px -2px var(--a2); } }
@keyframes shake { 20%, 60% { translate: -8px 0; } 40%, 80% { translate: 8px 0; } }
@keyframes banner {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
  14% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  24% { transform: translate(-50%, -50%) scale(1); }
  78% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -80%) scale(.95); }
}
@keyframes count {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
  30% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
}
@keyframes toast { 0% { opacity: 0; translate: 0 20px; } 10%, 85% { opacity: 1; translate: 0 0; } 100% { opacity: 0; translate: 0 -10px; } }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

@media (max-width: 640px) {
  #home { padding: 0 16px 40px; }
  .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .gcard { padding: 16px; gap: 12px; border-radius: 20px; }
  .gicon { width: 52px; height: 52px; font-size: 28px; border-radius: 16px; }
  .gtext h3 { font-size: 18px; }
  .gtext p { font-size: 12.5px; }
  #btn-join { padding: 10px 14px; font-size: 14px; }
  .pill span { display: none; }
  .scoreboard { top: 70px; }
  .pl { padding: 7px 10px; gap: 8px; }
  .pl .score { font-size: 24px; }
  .mid { min-width: 0; padding: 6px 10px; }
  .info { font-size: 11px; }
  .turn { top: 134px; }
  .hint { font-size: 11.5px; }
  .code span { width: 46px; height: 58px; font-size: 30px; }
}
</style>

<body>
  <canvas id="c"></canvas>
  <div id="menu-bg"></div>

  <section id="home" class="screen active">
    <header class="top">
      <div class="logo"><span class="logo-ball"></span>Classic <b>Arena</b></div>
      <div class="top-actions">
        <div id="conn-pill" class="pill hidden"><i></i><span>Friend connected</span><button id="btn-leave" class="mini">Leave</button></div>
        <button id="btn-join" class="btn ghost">Join a room</button>
      </div>
    </header>
    <div class="hero">
      <h1>Pick a game.<br><span class="grad">Play with a friend.</span></h1>
      <p id="hero-sub">Classic games in 3D. Free online multiplayer with just a room code.</p>
      <div class="diff-row"><span>Difficulty</span><div class="diff" id="diff"></div></div>
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <section id="hud" class="screen">
    <button id="btn-exit" class="btn round" title="Leave game">✕</button>
    <div class="scoreboard">
      <div class="pl p0" id="pl0"><span class="name" id="nm0">You</span><span class="score" id="sc0">0</span></div>
      <div class="mid"><div class="gname" id="gname"></div><div class="info" id="info"></div></div>
      <div class="pl p1" id="pl1"><span class="score" id="sc1">0</span><span class="name" id="nm1">CPU</span></div>
    </div>
    <div id="turn" class="turn hidden"></div>
    <div id="banner" class="banner"></div>
    <div id="countdown" class="countdown"></div>
    <div id="power" class="power hidden"><div class="mark"></div><div class="fill"></div></div>
    <div id="crosshair" class="crosshair hidden"></div>
    <div id="hint" class="hint"></div>
  </section>

  <div id="modal" class="modal hidden"><div class="card" id="modal-card"></div></div>
  <div id="toasts"></div>
  <div id="confetti"></div>

  <script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ===== util.js =====
const __m_util = (() => {

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const gauss = () => {
  let u = 0, v = 0;

    L.x = clamp(ptr.nx * c.xMax * 1.15, -c.xMax, c.xMax) * sgn;
    L.z = lerp(c.zone[1], c.zone[0], t) * sgn;
    if (ptr.pressed) L.c++;
    return { x: +L.x.toFixed(3), z: +L.z.toFixed(3), sx: +L.sx.toFixed(2), sy: +L.sy.toFixed(2), c: L.c };
  }

  cpuInput(dt) {
    const c = this.c, b = this.ball, v = this.vel;
    const s = this.cpu || (this.cpu = { x: 0, z: -(c.zone[0] + c.zone[1]) / 2, c: 0, t: 0, err: 0, armed: false });
    let tx = b.x * 0.3, tz = c.tennis ? -(c.halfL + 0.8) : -lerp(c.zone[0], c.zone[1], 0.3);
    if (this.phase === 'play' && v.z < 0 && this.lastHitter === 0) {
      if (!s.armed) { s.err = rand(-1, 1) * this.d(c.tennis ? [3.8, 3.1, 2.4, 1.5] : [0.62, 0.46, 0.36, 0.3]); s.armed = true; }
      const t = (tz - b.z) / v.z;
      if (t > 0) tx = b.x + v.x * t + s.err;
    } else s.armed = false;
    if (c.tennis) { s.x = tx; s.z = tz; } // running speed is limited by the engine
    else { s.x = damp(s.x, tx, this.d([4, 5.5, 7, 10]), dt); s.z = damp(s.z, tz, 4, dt); }
    if (this.phase === 'serve' && this.server === 1) { s.t += dt; if (s.t > 1.1) { s.t = 0; s.c++; } } else s.t = 0;
    return { x: s.x, z: s.z, sx: Math.sin(this.time * 1.7) * 3, sy: 2.2 + Math.sin(this.time * 0.9) * 1.6, c: s.c };
  }

  step(dt, inputs) {
    const c = this.c;
    this.time += dt;
    for (let p = 0; p < 2; p++) {
      const inp = inputs[p] || {}, pad = this.pads[p];
      if (inp.c > this.clicks[p]) {
        this.clicks[p] = inp.c;
        if (this.phase === 'serve' && this.server === p && this.timer <= 0) this.serve();
      }
      if (inp.x === undefined) continue;
      const tx = inp.x;
      const tz = c.tennis && this.phase === 'serve' && this.server === p ? (c.halfL + 0.5) * (p ? -1 : 1) : inp.z;
      if (c.run) {
        const dx = tx - pad.x, dz = tz - pad.z, d = Math.hypot(dx, dz), m = c.run * dt;
        if (d > m) { pad.x += dx / d * m; pad.z += dz / d * m; } else { pad.x = tx; pad.z = tz; }
      } else { pad.x = tx; pad.z = tz; }
      pad.sx = (inp.sx || 0) * (p ? -1 : 1);
      pad.sy = inp.sy || 0;
      if (!c.tennis) {
        const near = Math.abs(this.ball.z - pad.z) < 0.7;
        pad.y = damp(pad.y, near ? clamp(this.ball.y, c.surf + 0.04, c.surf + 0.45) : c.surf + 0.16, 12, dt);
      }
    }
    if (this.phase === 'serve') {
      this.timer -= dt;
      const s = this.pads[this.server], d = this.dir(this.server);
      if (c.tennis) this.ball.set(s.x - 0.35 * d, 2.3 + Math.sin(this.time * 4) * 0.25, s.z + d * 0.4);
      else this.ball.set(s.x, c.surf + 0.22 + Math.sin(this.time * 5) * 0.04, s.z + d * 0.06);
      this.vel.set(0, 0, 0);
      return;
    }
    if (this.phase === 'point') {
      this.timer -= dt;
      if (this.timer <= 0 && this.over === null) { this.phase = 'serve'; this.timer = 0.4; this.lastHitter = -1; this.bounces = 0; }
    }
    const n = 4, h = dt / n, b = this.ball, v = this.vel;
    for (let i = 0; i < n; i++) {
      const pz = b.z;
      v.y -= c.g * h;
      b.addScaledVector(v, h);
      if (pz * b.z < 0 && b.y < c.surf + c.netH + c.r && Math.abs(b.x) < c.netW) {
        b.z = Math.sign(pz) * c.r * 1.2; v.z *= -0.25; v.x *= 0.5;
        this.fx('thud', 0.5);
      }
      if (b.y - c.r <= c.surf && v.y < 0 && (c.tennis || (Math.abs(b.x) <= c.halfW && Math.abs(b.z) <= c.halfL))) {
        b.y = c.surf + c.r;
        if (-v.y > 0.6) this.fx('bounce', clamp(-v.y / 4, 0.2, 1));
        v.y = -v.y * c.e; v.x *= 0.97; v.z *= 0.97;
        if (this.phase === 'play') this.onBounce();
      }
      if (!c.tennis && b.y - c.r <= 0 && v.y < 0) {
        b.y = c.r; v.y = -v.y * 0.55; v.x *= 0.7; v.z *= 0.7;
        if (this.phase === 'play') this.dead();
      }
      if (this.phase === 'play' && (Math.abs(b.z) > c.halfL + (c.tennis ? 12 : 3) || Math.abs(b.x) > (c.tennis ? 16 : 4))) this.dead();
      if (this.phase === 'play') this.checkHit();
    }
  }

  onBounce() {
    const b = this.ball, c = this.c, side = b.z > 0 ? 0 : 1;
    const inB = Math.abs(b.x) <= c.inW + c.r && Math.abs(b.z) <= c.halfL + c.r;
    if (this.bounces === 0) {
      if (!inB) return this.point(1 - this.lastHitter, 'Out!');
      if (side === this.lastHitter) return this.point(1 - this.lastHitter, 'Fault!');
      this.bounces = 1;
    } else this.point(this.lastHitter, '');
  }
  dead() {
    if (this.bounces >= 1) this.point(this.lastHitter, '');
    else this.point(1 - this.lastHitter, 'Out!');
  }

  checkHit() {
    const c = this.c, b = this.ball, p = this.vel.z > 0 ? 0 : 1;
    if (p === this.lastHitter || (c.mustBounce && this.bounces < 1)) return;
    const pad = this.pads[p];
    // People get a bigger hitting area on easier levels; the computer never does.
    const k = this.mode === 'cpu' && p === 1 ? 1 : this.d([1.6, 1.3, 1.1, 1]);
    if (Math.abs(b.x - pad.x) < c.reach[0] * k && Math.abs(b.z - pad.z) < c.reach[1] * k && b.y > c.surf - 0.08 && b.y < c.surf + c.reach[2] * k) this.hit(p);
  }

  hit(p) {
    const c = this.c, d = this.dir(p), pad = this.pads[p], b = this.ball, v = this.vel;
    const lat = clamp(pad.sx / 3.5, -1, 1), fwd = clamp(pad.sy / 3.5, -0.3, 1);
    const power = clamp(0.25 + Math.hypot(pad.sx, pad.sy) / 5, 0.25, 1);
    const tx = clamp(lat * c.inW * 0.8 + (b.x - pad.x) * 0.5 + rand(-0.08, 0.08) * c.inW, -c.inW * 0.88, c.inW * 0.88);
    const tz = d * c.halfL * clamp(0.55 + 0.3 * fwd + rand(-0.08, 0.08), 0.25, 0.9);
    const ty = c.surf + c.r;
    let T = lerp(c.flight[0], c.flight[1], power) * this.d([1.3, 1.15, 1, 0.88]); // slower ball on easier levels
    for (let k = 0; k < 12; k++) {
      v.set((tx - b.x) / T, (ty - b.y + 0.5 * c.g * T * T) / T, (tz - b.z) / T);
      const tn = -b.z / v.z, yn = b.y + v.y * tn - 0.5 * c.g * tn * tn;
      if (tn < 0 || yn > c.surf + c.netH + c.r + (c.tennis ? 0.25 : 0.04)) break;
      T += 0.06;
    }
    this.lastHitter = p;
    this.bounces = 0;
    this.swing[p]++;
    this.fx('hit', 0.5 + power * 0.6);
  }

  serve() { this.phase = 'play'; this.hit(this.server); }

  point(w, why) {
    if (this.phase !== 'play') return;
    this.phase = 'point';
    this.timer = 1.3;
    const l = 1 - w;
    this.score[w]++;
    let txt = `${why ? why + ' · ' : ''}Point to {${w}}`;
    if (this.c.tennis) {
      if (this.score[w] >= 4 && this.score[w] - this.score[l] >= 2) {
        this.games[w]++;
        this.score = [0, 0];
        this.server = 1 - this.server;
        txt = `Game to {${w}}!`;
        if (this.games[w] >= 2) this.over = w;
      }
    } else {
      const s = this.score, tot = s[0] + s[1];
      if (s[w] >= 11 && s[w] - s[l] >= 2) this.over = w;
      else this.server = tot >= 20 ? tot % 2 : Math.floor(tot / 2) % 2;
    }
    this.say(txt);
    this.fx('score');
    this.updHud();
  }

  pack() {
    const b = this.ball, P = this.pads;
    return {
      p: [b.x, b.y, b.z, P[0].x, P[0].y, P[0].z, P[1].x, P[1].y, P[1].z],
      s: this.baseS({ ph: this.phase, sw: this.swing.slice(), sv: this.server }),
    };
  }

  apply(st) {
    this.view = st.s;
    const p = st.p;
    this.ballM.position.set(p[0], p[1], p[2]);
    for (let k = 0; k < 2; k++) {
      let x = p[3 + k * 3], z = p[5 + k * 3];
      if (k === this.me && this.mode === 'guest' && !this.c.run) { x = this.loc.x; z = this.loc.z; }
      this.padM[k].position.set(x, p[4 + k * 3], z);
      const sw = st.s.sw ? st.s.sw[k] : 0;
      if (sw !== this.seenSwing[k]) { this.seenSwing[k] = sw; this.swingT[k] = 0; }
    }
  }

  update(dt) {
    this.clock += dt;
    const bp = this.ballM.position;
    this.trail.unshift(bp.clone());
    if (this.trail.length > this.trailM.length * 2) this.trail.pop();
    this.trailM.forEach((m, i) => m.position.copy(this.trail[i * 2] || bp));
    this.ballM.rotation.x += dt * 20;
    for (let k = 0; k < 2; k++) this.swingT[k] += dt;
    const v = this.view;
    if (v && v.mi !== this.seenMi) { if (this.seenMi !== undefined && v.mi > 0) this.crowd.cheer(); this.seenMi = v.mi; }
    this.crowd.update(this.clock, dt);
    this.animate(dt);
    const mp = this.padM[this.me].position, s = this.me ? -1 : 1, c = this.c;
    if (c.tennis) this.aimCam(new THREE.Vector3(mp.x * 0.35, 7.2, s * (c.halfL + 9.5)), new THREE.Vector3(mp.x * 0.2, 0.5, -s * 1.5), dt, 5);
    else this.aimCam(new THREE.Vector3(mp.x * 0.3, c.surf + 1.25, s * 3.45), new THREE.Vector3(mp.x * 0.1, c.surf - 0.1, -s * 0.3), dt, 6);
  }

  makeTrail(r, color) {
    this.trailM = [];
    for (let i = 0; i < 8; i++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(r * (1 - i * 0.1), 12, 8), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3 * (1 - i / 8), depthWrite: false }));
      this.scene.add(m);
      this.trailM.push(m);
    }
  }
}

class PingPong extends Rally {
  constructor(ctx) { super(ctx, CFG.pingpong); }

  animate(dt) {
    for (let k = 0; k < 2; k++) {
      const pad = this.padM[k], t = this.swingT[k], a = t < 0.3 ? Math.sin(t / 0.3 * Math.PI) : 0;
      pad.rotation.x = this.dir(k) * a * 0.7;
      const ch = this.chars[k];
      if (!ch) continue;
      // Stand behind the paddle with it in the right hand.
      const f = k === 0 ? 1 : -1, r = ch.root.position, ox = r.x, oz = r.z;
      r.x = damp(r.x, pad.position.x - 0.3 * f, 9, dt);
      r.z = damp(r.z, pad.position.z + 0.45 * f, 9, dt);
      ch.crouch = 0.32;
      ch.lean = 0.28;
      ch.twist = -a * 0.4 * f;
      ch.update(dt, Math.hypot(r.x - ox, r.z - oz) / Math.max(dt, 1e-3));
      ch.armIK(0, pad.localToWorld(_v.set(0, -0.12, 0)), _w.set(r.x - f * 0.6, 0.6, r.z + f * 0.3));
      ch.armFK(1, -0.6, 0.3, -1.2);
    }
  }

  build() {
    const st = makeStage({ bg: 0x070a14, floor: 0x10131c, floorRough: 0.8, sun: [2, 9, 3], sunIntensity: 0.5, hemi: 0.35, shadow: 3, fogNear: 12, fogFar: 34, env: 0.35 });
    this.scene = st.scene;
    st.sun.castShadow = false;
    this.bloom = 0.18;
    const S = this.scene, Y = this.c.surf;
    // court floor, walls, light panels
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(9, 14), surfMat(tex.speckle('ppfloor', 0x8e2c2a, { amount: 0.18, scale: 96 }), { repeat: [4, 6], roughness: 0.75 }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = 0.002; floor.receiveShadow = true; S.add(floor);
    const outer = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), surfMat(tex.speckle('pphall', 0x1c2333, { amount: 0.2 }), { repeat: [16, 16], roughness: 0.8 }));
    outer.rotation.x = -Math.PI / 2; outer.position.y = 0.001; outer.receiveShadow = true; S.add(outer);
    const wallM = surfMat(tex.plaster('ppwall', 0x1b2440), { repeat: [10, 3] });
    for (const z of [-11, 11]) rbox(30, 8, 0.3, wallM, 0, 4, z, S, 1);
    for (const x of [-11, 11]) rbox(0.3, 8, 22, wallM, x, 4, 0, S, 1);
    for (const x of [-3, 0, 3]) for (const z of [-4, 0, 4]) {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.5), neonMat(0xfff4e0, 2.2));
      p.rotation.x = Math.PI / 2; p.position.set(x, 7.4, z); S.add(p);
    }
    spot(S, { pos: [0, 6, 0.4], target: [0, Y, 0], intensity: 60, angle: 0.55, penumbra: 0.7, shadow: true, mapSize: 2048, color: 0xfff6ea });
    spot(S, { pos: [-4, 5, 4], target: [0, Y, 0], intensity: 50, angle: 0.5, penumbra: 1, color: 0xbcd4ff });
    spot(S, { pos: [4, 5, -4], target: [0, Y, 0], intensity: 50, angle: 0.5, penumbra: 1, color: 0xbcd4ff });
    // barriers with branding
    const bar = new THREE.MeshPhysicalMaterial({ color: 0x18307a, roughness: 0.4, clearcoat: 0.6 });
    const brand = ['CLASSIC ARENA', 'TABLE TENNIS', 'CLASSIC ARENA'];
    for (const x of [-4.5, 4.5]) for (let i = 0; i < 6; i++) {
      const z = -6.25 + i * 2.5;
      rbox(0.12, 0.72, 2.4, bar, x, 0.36, z, S, 2);
      const s = sign(brand[i % 3], { width: 2.1, glow: 1.2, font: 'bold 120px Fredoka, Arial' });
      s.position.set(x - Math.sign(x) * 0.065, 0.38, z); s.rotation.y = -Math.sign(x) * Math.PI / 2; S.add(s);
    }
    for (const z of [-7.5, 7.5]) for (let i = 0; i < 4; i++) {
      const x = -3.6 + i * 2.4;
      rbox(2.3, 0.72, 0.12, bar, x, 0.36, z, S, 2);
    }
    // crowds along both long sides
    const slots = [
      ...grandstand(S, { x: 6.2, z: 0, ry: -Math.PI / 2, width: 15, rows: 6, seatColor: 0x23305c }),
      ...grandstand(S, { x: -6.2, z: 0, ry: Math.PI / 2, width: 15, rows: 6, seatColor: 0x23305c }),
    ];
    this.crowd = new Crowd(S, slots);
    // the table
    const top = new THREE.MeshPhysicalMaterial({ color: 0x103a7a, roughness: 0.38, clearcoat: 0.35, clearcoatRoughness: 0.3 });
    rbox(2.74, 0.03, 1.525, top, 0, Y - 0.015, 0, S, 0.006);
    const white = mat(0xf8f8f8, { roughness: 0.4 });
    const line = (w, d, x, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), white); m.rotation.x = -Math.PI / 2; m.position.set(x, Y + 0.0012, z); m.receiveShadow = true; S.add(m); };
    for (const z of [-0.7525, 0.7525]) line(2.74, 0.02, 0, z + (z > 0 ? -0.01 : 0.01));
    for (const x of [-1.36, 1.36]) line(0.02, 1.525, x, 0);
    line(2.74, 0.003, 0, 0);
    const steel = surfMat(tex.brushed('ppsteel', 0x8b93a1), { metalness: 0.9, roughness: 0.35 });
    rbox(2.5, 0.06, 1.3, mat(0x14161c, { roughness: 0.6 }), 0, Y - 0.06, 0, S, 0.02);
    for (const x of [-1.05, 1.05]) {
      for (const z of [-0.6, 0.6]) {
        const leg = tube([[x, Y - 0.08, z], [x, 0.06, z]], 0.022, steel, 2);
        S.add(leg);
        const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.014, 10, 20), mat(0x111111));
        wheel.position.set(x, 0.05, z); wheel.rotation.y = Math.PI / 2; S.add(wheel);
      }
      S.add(tube([[x, 0.35, -0.6], [x, 0.35, 0.6]], 0.016, steel, 2));
    }
    // net
    const net = new THREE.Mesh(new THREE.PlaneGeometry(1.83, 0.1525), new THREE.MeshStandardMaterial({ map: netTex(90, 1024, 86), transparent: true, side: THREE.DoubleSide, alphaTest: 0.1 }));
    net.position.set(0, Y + 0.076, 0); S.add(net);
    rbox(1.83, 0.016, 0.008, white, 0, Y + 0.1525, 0, S, 0.003);
    for (const x of [-0.93, 0.93]) {
      rbox(0.025, 0.17, 0.025, steel, x, Y + 0.085, 0, S, 0.008);
      rbox(0.05, 0.035, 0.07, mat(0x111111), x, Y + 0.0, 0, S, 0.01);
    }
    // paddles: wooden blade, red and black rubbers, flared handle
    const wood = new THREE.MeshPhysicalMaterial({ color: 0xd8b07a, roughness: 0.5, clearcoat: 0.3 });
    this.padM = [0, 1].map(() => {
      const g = new THREE.Group();
      const add = (geo, m, z) => { const o = new THREE.Mesh(geo, m); o.rotation.x = Math.PI / 2; o.position.z = z; o.castShadow = true; g.add(o); };
      add(new THREE.CylinderGeometry(0.077, 0.077, 0.006, 48), wood, 0);
      add(new THREE.CylinderGeometry(0.075, 0.075, 0.003, 48), mat(0xd01f2c, { roughness: 0.7 }), 0.0045);
      add(new THREE.CylinderGeometry(0.075, 0.075, 0.003, 48), mat(0x111111, { roughness: 0.7 }), -0.0045);
      const h = lathe([[0.012, 0], [0.016, 0.025], [0.018, 0.07], [0.014, 0.1], [0.011, 0.105]], 16, wood);
      h.position.y = -0.18; g.add(h);
      S.add(g);
      return g;
    });
    // the opponent (your own player stays out of the way of your camera)
    const k = 1 - this.me;
    const ch = this.chars[k] = new Character(LOOKS[k]);
    ch.root.rotation.y = k === 0 ? Math.PI : 0;
    ch.root.position.set(0, 0, k === 0 ? 2.2 : -2.2);
    S.add(ch.root);
    // ball
    this.ballM = new THREE.Mesh(new THREE.SphereGeometry(this.c.r, 28, 20), new THREE.MeshPhysicalMaterial({ color: 0xfff3e0, emissive: 0x2a1a08, roughness: 0.35, clearcoat: 0.5 }));
    this.ballM.castShadow = true;
    S.add(this.ballM);
    this.makeTrail(this.c.r, 0xffe2b0);
  }
}

function racket(color) {
  const g = new THREE.Group();
  const frame = new THREE.MeshPhysicalMaterial({ color, roughness: 0.3, clearcoat: 1, metalness: 0.2 });
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.016, 0.2, 8), mat(0x1d1d1d, { roughness: 0.8 }));
  grip.position.y = -0.04; g.add(grip);
  for (const s of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.17, 8), frame);
    arm.position.set(s * 0.04, -0.22, 0); arm.rotation.z = s * 0.28; g.add(arm);
  }
  const head = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.011, 10, 48), frame);
  head.scale.set(1, 1.3, 1); head.position.y = -0.46; head.castShadow = true; g.add(head);
  const strings = new THREE.Mesh(new THREE.CircleGeometry(0.128, 40), new THREE.MeshStandardMaterial({ map: netTex(18, 256, 256), transparent: true, alphaTest: 0.1, side: THREE.DoubleSide, color: 0xf3ff9a }));
  strings.scale.set(1, 1.3, 1); strings.position.y = -0.46; g.add(strings);
  g.rotation.set(-0.3, 0, 0);
  return g;
}

class Tennis extends Rally {
  constructor(ctx) { super(ctx, CFG.tennis); }

  animate(dt) {
    const v = this.view || {};
    for (let k = 0; k < 2; k++) {
      const ch = this.chars[k], P = this.padM[k].position, r = ch.root.position;
      const sp = Math.hypot(P.x - r.x, P.z - r.z) / Math.max(dt, 1e-3);
      r.set(P.x, 0, P.z);
      const t = this.swingT[k];
      ch.crouch = 0.18;
      ch.lean = 0.1;
      ch.twist = 0;
      if (t < 0.45) {
        const e = ease(t / 0.45);
        ch.twist = lerp(0.7, -0.8, e);
        ch.update(dt, Math.min(sp, 4));
        ch.armFK(0, lerp(0.6, -1.7, e), lerp(-1.4, -0.3, e), -0.35);
        ch.armFK(1, lerp(-0.6, 0.2, e), 0.5, -1.0);
      } else if (v.ph === 'serve' && v.sv === k) {
        ch.update(dt, Math.min(sp, 4));
        ch.armFK(0, 0.9, -1.0, -1.6);
        ch.armFK(1, -2.8, 0.15, -0.1);
      } else {
        ch.update(dt, sp);
        ch.armFK(0, -0.75, -0.45, -1.15);
        ch.armFK(1, -0.7, 0.35, -1.25);
      }
    }
    this.umpire.head.rotation.y = Math.sin(this.clock * 0.6) * 0.15 + clamp(this.ballM.position.z * 0.05, -0.8, 0.8);

// Guests render the host's world ~100ms in the past, blending between the two nearest snapshots.
function interpolated() {
  if (!snaps.length) return null;
  const rt = performance.now() - 100;
  while (snaps.length >= 2 && snaps[1].t <= rt) snaps.shift();
  const a = snaps[0], b = snaps[1];
  if (!b || rt <= a.t || a.d.p.length !== b.d.p.length) return a.d;
  const k = clamp((rt - a.t) / (b.t - a.t), 0, 1);

// Browsers stop animation frames in hidden tabs; keep the match (and the friend's view) alive with a timer.

function frame(now) {

      const inputs = [];
      inputs[me] = inp;
      inputs[1 - me] = mode === 'cpu' ? (game.cpuInput(dt) || {}) : remoteInput;
      if (running) game.step(dt, inputs);
      st = game.pack();
      if (mode === 'host') {
        pendingEv.push(...game.events);
        if (now - lastSend > 33) {
          net.send({ t: 'st', d: { p: st.p.map(v => Math.round(v * 1000) / 1000), s: st.s, ev: pendingEv } });
          pendingEv = []; lastSend = now;
        }
      }
      game.events.length = 0;
    } else {
      if (now - lastSend > 33) { net.send({ t: 'in', d: inp }); lastSend = now; }
      st = interpolated();
    }
    if (st) { game.apply(st, dt); hudUpdate(st.s); }
    game.update(dt);
    if (!game) return;
    const pw = $('#power');
    if (game.power != null) {
      pw.classList.remove('hidden');
      pw.querySelector('.fill').style.width = (game.power * 100).toFixed(1) + '%';
      const mk = pw.querySelector('.mark');
      if (game.powerMark != null) {
        const zone = game.powerZone || 0.1;
        mk.style.display = '';
        mk.style.width = (zone * 100) + '%';
        mk.style.left = ((game.powerMark - zone / 2) * 100) + '%';
      }
      else mk.style.display = 'none';
    } else pw.classList.add('hidden');
    $('#crosshair').classList.toggle('hidden', !game.crosshair);
    draw(game.scene, game.camera, game.bloom, game.exposure);
  } else {
    menu.update(dt);
    draw(menu.scene, menu.cam, 0.6, 1);
  }
  ptr.pressed = false;
  ptr.released = false;
}
requestAnimationFrame(loop);
// Test hook, only on the local test server.
if (new URLSearchParams(location.search).has('test')) window.arena = {
  get game() { return game; }, startGame, renderer, composer,
  shot() {
    draw(game.scene, game.camera, game.bloom, game.exposure);
    let img = document.getElementById('test-shot');
    if (!img) { img = document.createElement('img'); img.id = 'test-shot'; img.style.cssText = 'position:fixed;left:0;top:0;width:62vw;z-index:99;pointer-events:none'; document.body.appendChild(img); }
    img.src = canvas.toDataURL('image/jpeg', 0.85);
  },
  unshot() { document.getElementById('test-shot')?.remove(); },
};

// Opening an invite link (?room=CODE) goes straight to the join dialog.
const roomParam = new URLSearchParams(location.search).get('room');
if (roomParam) {
  history.replaceState(null, '', location.pathname);
  openJoin(roomParam.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5));
}

})();
</script>
