<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Zone</title>
<!-- Each card uses its game's own fonts. Without internet they fall back to normal fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&family=Barlow:wght@400;500&family=Rajdhani:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&family=Limelight&family=Monoton&family=Manrope:wght@400;600&family=JetBrains+Mono:wght@500;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Fredoka:wght@600;700&family=Nunito:wght@600;700&family=Big+Shoulders+Stencil+Display:wght@800&family=Barlow+Semi+Condensed:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=Orbitron:wght@800;900&display=swap">
<style>
  :root {
    --bg: #07040f;
    --text: #f4f1ff;
    --muted: #9b93b8;
    --pink: #ff3d81;
    --cyan: #22e4ff;
    --yellow: #ffd23f;
    --purple: #8b5cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overflow-x: hidden;
  }
  #stars { position: fixed; inset: 0; z-index: 0; }
  .glow-blob {
    position: fixed; width: 50vmax; height: 50vmax; border-radius: 50%;
    filter: blur(90px); opacity: .28; z-index: 0; pointer-events: none;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .glow-blob.a { background: var(--purple); top: -20vmax; left: -15vmax; }
  .glow-blob.b { background: var(--pink); bottom: -25vmax; right: -15vmax; animation-delay: -9s; }
  @keyframes drift { to { transform: translate(10vmax, 6vmax) scale(1.15); } }

  main { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 56px 20px 80px; }

  /* ---------- Title ---------- */
  header { text-align: center; margin-bottom: 40px; }
  .title {
    position: relative; display: inline-block;
    font-size: clamp(3rem, 11vw, 7.5rem); font-weight: 900; letter-spacing: .04em;
    line-height: 1; text-transform: uppercase;
    background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink), var(--yellow), var(--cyan));
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 6s linear infinite, pop-in 1s cubic-bezier(.2,1.6,.4,1) both;
    filter: drop-shadow(0 0 24px rgba(139,92,255,.55));
  }
  .title::before, .title::after {
    content: attr(data-text); position: absolute; inset: 0; opacity: 0;
  }
  .title::before { animation: glitch 4s infinite steps(1); -webkit-text-fill-color: var(--cyan); }
  .title::after  { animation: glitch 4s infinite steps(1) .1s; -webkit-text-fill-color: var(--pink); }
  @keyframes glitch {
    0%, 92%, 100% { opacity: 0; transform: none; clip-path: none; }
    93% { opacity: .8; transform: translate(-6px, 2px); clip-path: inset(10% 0 55% 0); }
    95% { opacity: .8; transform: translate(6px, -2px); clip-path: inset(60% 0 8% 0); }
    97% { opacity: .8; transform: translate(-3px, 0); clip-path: inset(35% 0 35% 0); }
  }
  @keyframes shimmer { to { background-position: 300% 0; } }
  @keyframes pop-in { from { transform: scale(.3) rotate(-8deg); opacity: 0; } }
  .subtitle {
    margin-top: 14px; color: var(--muted); font-size: 1.1rem; letter-spacing: .3em; text-transform: uppercase;
    animation: fade-up .8s .4s both;
  }
  .subtitle .blink { color: var(--yellow); animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes fade-up { from { opacity: 0; transform: translateY(20px); } }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px;
    animation: fade-up .8s .6s both;
  }
  .search {
    flex: 1 1 260px; max-width: 420px; padding: 14px 18px; border-radius: 14px;
    border: 2px solid rgba(255,255,255,.12); background: rgba(10,6,22,.7); color: var(--text);
    font: inherit; font-size: 1rem; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .search:focus { border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(34,228,255,.18), 0 0 30px rgba(34,228,255,.25); }
  .btn {
    position: relative; overflow: hidden; border: none; cursor: pointer; font: inherit; font-weight: 800;
    padding: 14px 20px; border-radius: 14px; color: #0b0618; letter-spacing: .05em; text-transform: uppercase;
    background: linear-gradient(135deg, var(--yellow), var(--pink));
    box-shadow: 0 6px 0 #9a1f52, 0 10px 30px rgba(255,61,129,.35);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9a1f52, 0 4px 14px rgba(255,61,129,.35); }
  .btn.ghost { background: rgba(255,255,255,.08); color: var(--text); box-shadow: 0 6px 0 rgba(0,0,0,.5); }
  .btn .count {
    display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 8px;
    border-radius: 999px; background: var(--pink); color: #fff; font-size: .72rem; vertical-align: 1px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .btn .count[hidden] { display: none; }

  /* ---------- Cards (shared) ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; perspective: 1200px; }
  @media (max-width: 380px) { .grid { grid-template-columns: 1fr; } }
  .card {
    /* defaults; each game theme below overrides these */
    --card-bg: rgba(22, 16, 40, 0.85); --card-fg: var(--text); --card-muted: var(--muted);
    --font-title: inherit; --font-body: inherit;
    --btn-bg: var(--c); --btn-fg: #0b0618; --btn-r: 999px; --btn-shadow: none;
    position: relative; border-radius: 20px; padding: 2px; cursor: pointer;
    transform-style: preserve-3d; transition: transform .15s ease-out;
    animation: card-in .7s cubic-bezier(.2,1.4,.4,1) both;
    animation-delay: calc(var(--i) * 90ms + 700ms);
  }
  @keyframes card-in { from { opacity: 0; transform: translateY(60px) rotateX(30deg) scale(.85); } }
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1;
    background: conic-gradient(from var(--angle, 0deg), var(--c), transparent 30%, transparent 70%, var(--c));
    animation: spin 4s linear infinite; opacity: .55; transition: opacity .3s;
  }
  .card:hover::before { opacity: 1; }
  @property --angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  @keyframes spin { to { --angle: 360deg; } }
  .card-inner {
    position: relative; overflow: hidden; border-radius: 18px; height: 100%;
    background: var(--card-bg); color: var(--card-fg); font-family: var(--font-body);
    display: flex; flex-direction: column; transition: box-shadow .3s;
  }
  .card:hover { z-index: 2; }
  .card:hover .card-inner { box-shadow: 0 30px 60px -10px var(--c-glow); }
  .thumb { position: relative; height: 200px; overflow: hidden; }
  .art { position: absolute; inset: 0; overflow: hidden; }
  .shine {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; z-index: 5;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.5), transparent 45%);
    opacity: 0; transition: opacity .3s;
  }
  .card:hover .shine { opacity: 1; }
  .info { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .info h2 { font-family: var(--font-title); font-size: 1.6rem; line-height: 1.1; }
  .info p { color: var(--card-muted); font-size: .95rem; line-height: 1.45; flex: 1; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 10px; }
  .tag { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--c); }
  .play {
    border: none; cursor: pointer; font-family: var(--font-title); font-weight: 800; font-size: 1rem; letter-spacing: .1em;
    padding: 10px 20px; border-radius: var(--btn-r); color: var(--btn-fg); background: var(--btn-bg);
    box-shadow: var(--btn-shadow); transition: transform .15s, filter .3s;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .card:hover .play { transform: scale(1.08); filter: drop-shadow(0 0 12px var(--c)); }
  .badges {
    position: absolute; top: 12px; left: 12px; z-index: 6;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  }
  .badge {
    font-size: .7rem; font-weight: 800;
    padding: 5px 10px; border-radius: 999px; background: var(--yellow); color: #0b0618;
    font-family: "Trebuchet MS", sans-serif; letter-spacing: .08em; text-transform: uppercase;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .badge.upd { background: linear-gradient(90deg, var(--cyan), var(--pink)); animation: none; }
  .badge.upd.fresh { box-shadow: 0 0 0 2px #fff, 0 0 18px var(--pink); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.1); } }
  .card.highlight { transform: scale(1.06); }
  .card.highlight .card-inner { box-shadow: 0 0 0 3px var(--c), 0 0 50px var(--c); }
  .empty { text-align: center; color: var(--muted); padding: 40px; font-size: 1.2rem; display: none; }
  .ripple {
    position: absolute; border-radius: 50%; background: rgba(255,255,255,.6); pointer-events: none; z-index: 7;
    transform: scale(0); animation: ripple .6s ease-out forwards;
  }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }

  /* Seasonal sticker on each card's corner (set by the season code below) */
  .card::after {
    content: attr(data-sticker); position: absolute; top: -16px; right: -10px; z-index: 9;
    font-size: 34px; line-height: 1; pointer-events: none;
    transform: translateZ(30px) rotate(14deg); transition: transform .3s cubic-bezier(.2,1.6,.4,1);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.55));
  }
  .card:hover::after { transform: translateZ(30px) rotate(-8deg) scale(1.25); }

  /* Generic card art (for games you add later without a theme) */
  .art-generic { display: grid; place-items: center;
    background: radial-gradient(circle at 50% 120%, var(--c), transparent 70%), linear-gradient(160deg, #1a1033, #0b0618); }
  .art-generic .emoji { font-size: 5rem; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px); } }

  /* ================= IRON ATOLL: naval radar, islands, dark sea ================= */
  .t-atoll {
    --c: #f2a93b; --card-bg: linear-gradient(180deg, #0f1f26, #0a1a22); --card-fg: #dce8e4; --card-muted: #8aa29f;
    --font-title: "Saira Condensed", "Arial Narrow", sans-serif; --font-body: "Barlow", system-ui, sans-serif;
    --btn-fg: #1d1406; --btn-r: 4px;
  }
  .t-atoll h2, .t-atoll .play { text-transform: uppercase; letter-spacing: .06em; }
  .art-atoll { background: radial-gradient(circle at 50% 55%, #14404a, #0a1a22 75%); }
  .atoll-grid { position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(95,212,196,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(95,212,196,.12) 1px, transparent 1px);
    background-size: 30px 30px; animation: sea-pan 12s linear infinite; }
  @keyframes sea-pan { to { background-position: 30px 30px; } }
  .isle { position: absolute; background: #2f5a3a; box-shadow: 0 0 0 3px #c9a46a, 0 0 0 9px rgba(95,212,196,.15); }
  .isle.i1 { width: 64px; height: 44px; left: calc(50% - 32px); top: calc(55% - 22px); border-radius: 58% 42% 55% 45% / 50% 60% 40% 50%; }
  .isle.i2 { width: 38px; height: 26px; left: 12%; top: 18%; border-radius: 40% 60% 45% 55%; background: #5a3a2f; }
  .isle.i3 { width: 46px; height: 30px; right: 10%; bottom: 14%; border-radius: 60% 40% 50% 50%; background: #5a3a2f; }
  .radar { position: absolute; width: 170px; height: 170px; left: calc(50% - 85px); top: calc(55% - 85px); border-radius: 50%;
    border: 1px solid rgba(95,212,196,.5);
    background: repeating-radial-gradient(circle, transparent 0 27px, rgba(95,212,196,.22) 27px 28px); }
  .radar .sweep { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(95,212,196,.55), rgba(95,212,196,0) 22%, transparent);
    animation: spin-plain 3s linear infinite; }
  @keyframes spin-plain { to { transform: rotate(360deg); } }
  .blip { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #ff5a4e;
    box-shadow: 0 0 10px #ff5a4e; animation: blip 3s ease-out infinite; }
  .blip.ally { background: #7bd88f; box-shadow: 0 0 10px #7bd88f; }
  @keyframes blip { 0%, 100% { opacity: .2; transform: scale(.8); } 10% { opacity: 1; transform: scale(1.5); } }
  .art-atoll svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .missile { fill: none; stroke: #f2a93b; stroke-width: 2; stroke-dasharray: 6 200; stroke-linecap: round; animation: missile 2.6s ease-in infinite; }
  @keyframes missile { from { stroke-dashoffset: 200; } to { stroke-dashoffset: -10; } }
  .mono-hud { position: absolute; font: 700 10px "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: .12em; }
  .art-atoll .mono-hud { left: 10px; bottom: 8px; color: #5fd4c4; }
  .art-atoll .mono-hud b { color: #f2a93b; }

  /* ================= SKYVAULT: aircraft market, price chart ================= */
  .t-sky {
    --c: #4fd8ff; --card-bg: #131a28; --card-fg: #e8edf8; --card-muted: #93a4c4;
    --font-title: "Rajdhani", "Segoe UI", sans-serif; --font-body: "IBM Plex Sans", system-ui, sans-serif;
    --btn-fg: #0a0e16; --btn-r: 10px;
  }
  .t-sky h2 { font-size: 1.8rem; letter-spacing: .02em; }
  .art-sky { background: #0a0e16;
    background-image: linear-gradient(#1a2338 1px, transparent 1px), linear-gradient(90deg, #1a2338 1px, transparent 1px);
    background-size: 100% 38px, 50px 100%; }
  .art-sky svg { position: absolute; inset: 0 0 26px 0; width: 100%; height: calc(100% - 26px); }
  .sky-line { fill: none; stroke: #4fd8ff; stroke-width: 2.5; stroke-dasharray: 500; animation: draw 4s ease-out infinite;
    filter: drop-shadow(0 0 6px #4fd8ff); vector-effect: non-scaling-stroke; }
  .sky-area { animation: fade-area 4s ease-out infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 500; } 60%, 100% { stroke-dashoffset: 0; } }
  @keyframes fade-area { 0%, 30% { opacity: 0; } 70%, 100% { opacity: 1; } }
  .sky-plane { position: absolute; font-size: 30px; color: #e8edf8; left: -40px; top: 30px;
    animation: fly-across 6s linear infinite; text-shadow: 0 0 12px #4fd8ff; }
  @keyframes fly-across { from { transform: translate(0, 30px) rotate(-12deg); } to { transform: translate(420px, -20px) rotate(-12deg); } }
  .sky-price { position: absolute; right: 12px; top: 12px; padding: 4px 9px; border-radius: 6px;
    font: 600 13px "IBM Plex Mono", ui-monospace, monospace; color: #0a0e16; background: #ffb347;
    animation: pulse 2s ease-in-out infinite; }
  .sky-credits { position: absolute; left: 12px; top: 12px; font: 600 11px "IBM Plex Mono", ui-monospace, monospace; color: #93a4c4; letter-spacing: .08em; }
  .sky-credits b { color: #ffb347; }
  .ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: #0e1420; border-top: 1px solid #232e46;
    overflow: hidden; white-space: nowrap; font: 500 11px/26px "IBM Plex Mono", ui-monospace, monospace; color: #93a4c4; }
  .ticker div { display: inline-block; animation: ticker 18s linear infinite; }
  .ticker .up { color: #3ddc84; } .ticker .dn { color: #ff5c5c; }
  @keyframes ticker { to { transform: translateX(-50%); } }

  /* ================= MIDNIGHT VELVET: neon casino on green felt ================= */
  .t-velvet {
    --c: #e9b95f; --card-bg: linear-gradient(180deg, #311524, #22101a); --card-fg: #f6ead4; --card-muted: #c3a69d;
    --font-title: "Limelight", Georgia, serif; --font-body: "Manrope", system-ui, sans-serif;
    --btn-bg: linear-gradient(180deg, #f7d891, #b5883a); --btn-fg: #140810;
    --btn-shadow: 0 3px 0 #6b4c1c;
  }
  .t-velvet h2 { font-weight: 400; color: #f7d891; }
  .art-velvet { background: radial-gradient(ellipse at 50% 40%, #18634b, #0d3a2d 60%, #072419);
    box-shadow: inset 0 0 0 10px #3b1d12, inset 0 0 0 12px #e9b95f55, inset 0 0 40px #000a; }
  .neon-sign { position: absolute; top: 22px; left: 0; right: 0; text-align: center;
    font: 400 26px "Monoton", "Limelight", Georgia, serif; color: #ffd6de; letter-spacing: .04em;
    text-shadow: 0 0 4px #fff, 0 0 10px #ff3b5c, 0 0 22px #ff3b5c, 0 0 40px #ff3b5c;
    animation: neon-flicker 5s infinite; }
  @keyframes neon-flicker { 0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; } 20%, 24%, 55% { opacity: .35; text-shadow: none; } }
  .pcard { position: absolute; width: 56px; height: 80px; border-radius: 6px; background: #fbf4e6;
    box-shadow: 0 6px 14px rgba(0,0,0,.5); color: #1c1218; font: 700 20px Georgia, serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
    bottom: 22px; transition: transform .4s cubic-bezier(.2,1.6,.4,1); }
  .pcard i { font-style: normal; font-size: 26px; }
  .pcard.red { color: #c4122f; }
  .pcard.k1 { left: calc(50% - 62px); transform: rotate(-12deg); }
  .pcard.k2 { left: calc(50% - 8px); transform: rotate(10deg); }
  .card:hover .pcard.k1 { transform: rotate(-22deg) translate(-10px, -8px); }
  .card:hover .pcard.k2 { transform: rotate(20deg) translate(10px, -8px); }
  .chipstack { position: absolute; bottom: 24px; display: flex; flex-direction: column-reverse; }
  .chipstack.s1 { left: 18%; } .chipstack.s2 { right: 16%; }
  .chip { width: 38px; height: 11px; border-radius: 50%; margin-top: -4px; border: 2px dashed rgba(255,255,255,.75);
    box-shadow: 0 2px 0 rgba(0,0,0,.35); animation: chip-drop .5s cubic-bezier(.3,1.6,.5,1) both; }
  .chip.r { background: #d6203f; } .chip.g { background: #1f8a5b; } .chip.v { background: #7b4dff; } .chip.o { background: #ff7a2e; }
  @keyframes chip-drop { from { transform: translateY(-60px); opacity: 0; } }
  .sparkle-dot { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #f7d891; box-shadow: 0 0 8px #f7d891;
    animation: twinkle 2s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1.3); } }

  /* ================= BURNOUT SKIES: sunset dogfight, HUD ================= */
  .t-burnout {
    --c: #ff5a2a; --card-bg: #0b1220; --card-fg: #f3ead9; --card-muted: #9aa6b8;
    --font-title: "Saira Condensed", "Arial Narrow", sans-serif; --font-body: "Barlow", system-ui, sans-serif;
    --btn-bg: #ffb54a; --btn-fg: #0b1220; --btn-r: 2px;
  }
  .t-burnout h2, .t-burnout .play { text-transform: uppercase; letter-spacing: .08em; font-style: italic; }
  .t-burnout .play { clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); padding-inline: 24px; }
  .art-burnout { background: #0b1220; }
  .burn-sky { position: absolute; inset: -40%; animation: bank 6s ease-in-out infinite;
    background: linear-gradient(180deg, #141a38 0%, #3a2350 30%, #a3405a 42%, #ff7a3a 48%, #ffb54a 50%, #3a1c14 50.4%, #1a0e0c 70%); }
  @keyframes bank { 0%, 100% { transform: rotate(-9deg) translateY(4px); } 50% { transform: rotate(9deg) translateY(-6px); } }
  .burn-sun { position: absolute; width: 70px; height: 70px; border-radius: 50%; left: 62%; top: 46%;
    background: radial-gradient(circle, #fff3c4, #ffb54a 50%, transparent 72%); }
  .cloud { position: absolute; height: 18px; border-radius: 20px; background: rgba(255,200,170,.25); filter: blur(4px);
    animation: cloud-pass linear infinite; }
  .cloud.c1 { width: 120px; top: 22%; animation-duration: 3.5s; }
  .cloud.c2 { width: 80px; top: 70%; animation-duration: 2.4s; animation-delay: -1s; }
  .cloud.c3 { width: 160px; top: 40%; animation-duration: 5s; animation-delay: -3s; opacity: .6; }
  @keyframes cloud-pass { from { transform: translateX(380px); } to { transform: translateX(-200px); } }
  .jet { position: absolute; width: 130px; left: calc(50% - 70px); top: calc(50% - 26px); animation: jet-bob 2.2s ease-in-out infinite; }
  @keyframes jet-bob { 50% { transform: translate(6px, -8px) rotate(-3deg); } }
  .flame { animation: flame .08s steps(2) infinite; transform-origin: right center; }
  @keyframes flame { 50% { transform: scaleX(.6); opacity: .7; } }
  .hud { position: absolute; inset: 0; color: #ffb54a; }
  .reticle { position: absolute; width: 46px; height: 46px; left: calc(50% - 23px); top: calc(50% - 23px);
    border: 1.5px solid #ffb54a; border-radius: 50%; opacity: .85; }
  .reticle::before, .reticle::after { content: ""; position: absolute; background: #ffb54a; }
  .reticle::before { left: 50%; top: -10px; bottom: -10px; width: 1.5px; transform: translateX(-50%); }
  .reticle::after { top: 50%; left: -10px; right: -10px; height: 1.5px; transform: translateY(-50%); }
  .tape { position: absolute; top: 50%; transform: translateY(-50%); padding: 3px 6px; border: 1px solid #ffb54a;

  /* ================= TUMBLE LAB: graph paper physics ================= */

  .art-tumble { background-color: #f7f9fb; border-bottom: 1.5px solid #1a2634;
    background-image: linear-gradient(#c9d5df 1px, transparent 1px), linear-gradient(90deg, #c9d5df 1px, transparent 1px),
      linear-gradient(#e1e8ee 1px, transparent 1px), linear-gradient(90deg, #e1e8ee 1px, transparent 1px);
    background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px; }
  .tb { position: absolute; bottom: 0; border: 1.8px solid #1a2634; animation: drop 3.2s infinite; }

  .tb.b1 { width: 40px; height: 40px; left: 12%; background: #ff5a36; animation-delay: 0s; }
  .tb.b2 { width: 28px; height: 28px; left: 70%; background: #13a37e; animation-delay: -.8s; }
  .tb.bouncy { width: 22px; height: 22px; left: 86%; background: #8a5cf0; animation: bouncy 1.1s infinite cubic-bezier(.5,0,.5,1); }
  .tb.crate { width: 46px; height: 46px; left: 32%; background: #2c7be5 linear-gradient(45deg, transparent 48%, #1a2634 48% 52%, transparent 52%);
    animation-name: drop-spin; animation-delay: -1.6s; }
  .tb-wedge { position: absolute; bottom: 0; left: 52%; width: 50px; height: 44px; animation: drop 3.2s infinite; animation-delay: -2.4s; }
  @keyframes drop {
    0% { transform: translateY(-260px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
    35% { transform: translateY(0) scale(1.15, .85); animation-timing-function: cubic-bezier(0,.55,.45,1); }
    48% { transform: translateY(-60px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
    60% { transform: translateY(0) scale(1.08, .92); animation-timing-function: cubic-bezier(0,.55,.45,1); }
    68% { transform: translateY(-16px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
    75%, 92% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(0); opacity: 0; }
  }
  @keyframes drop-spin {
    0% { transform: translateY(-260px) rotate(-60deg); animation-timing-function: cubic-bezier(.55,0,1,.45); }
    35% { transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(0,.55,.45,1); }
    48% { transform: translateY(-40px) rotate(20deg); animation-timing-function: cubic-bezier(.55,0,1,.45); }
    60%, 92% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(0); opacity: 0; }
  }
  @keyframes bouncy { 0%, 100% { transform: translateY(0) scale(1.2, .8); } 50% { transform: translateY(-150px); } }
  .tb-plank { position: absolute; left: -10px; top: 46px; width: 130px; height: 12px; background: #34485e; border: 1.8px solid #1a2634;
    transform: rotate(18deg); transform-origin: left; }

  .bp-plane { position: absolute; inset: 0 0 14px 0; width: 100%; height: calc(100% - 14px); }

  .bp-plane .hub-dot { fill: #f2b134; }

  .p-fuse { animation-name: part-fuse !important; }
  .p-wing { animation-name: part-wing !important; }
  .p-tail { animation-name: part-tail !important; }
  .p-eng  { animation-name: part-eng !important; }
  @keyframes part-fuse { 0% { transform: translateX(-260px); opacity: 0; } 10%, 90% { transform: none; opacity: 1; } 100% { opacity: 0; } }
  @keyframes part-wing { 0%, 12% { transform: translateY(-200px) rotate(-8deg); opacity: 0; } 24%, 90% { transform: none; opacity: 1; } 100% { opacity: 0; } }
  @keyframes part-tail { 0%, 24% { transform: translate(-120px, 140px); opacity: 0; } 36%, 90% { transform: none; opacity: 1; } 100% { opacity: 0; } }
  @keyframes part-eng  { 0%, 36% { transform: translateX(160px); opacity: 0; } 48%, 90% { transform: none; opacity: 1; } 100% { opacity: 0; } }
  @keyframes prop-spin { 0%, 52% { transform: rotate(0); } 53%, 90% { transform: rotate(0) scaleY(.25); } 100% { transform: rotate(0); } }

  @keyframes bolt-in { 0%, 50% { transform: scale(0); } 55% { transform: scale(2); } 60%, 90% { transform: scale(1); } 100% { transform: scale(0); } }
  .dims line { stroke: rgba(231,235,238,.55); stroke-width: 1; }

  .dims { opacity: 0; animation: dims-in 6s infinite; }
  @keyframes dims-in { 0%, 56% { opacity: 0; } 62%, 90% { opacity: 1; } 100% { opacity: 0; } }
  .bp-stamp { position: absolute; right: 14px; top: 12px; padding: 2px 8px; transform: rotate(-6deg);

  /* ---------- Launch overlay ---------- */

  #launch.on { opacity: 1; pointer-events: all; }

  #launch.on .ring { animation: grow 1.1s cubic-bezier(.7,0,.3,1) forwards; }
  @keyframes grow { to { transform: scale(220); } }
  #launch .label { position: relative; z-index: 2; text-align: center; color: var(--lc, #0b0618); opacity: 0;

    20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); }

  /* =====================================================================
     SEASONAL EVENTS
     The script picks a season from today's date and adds a class like
     "season-halloween" to <body>, plus the decorations below.
     ===================================================================== */
  #season-back  { position: fixed; inset: 0; z-index: 0;  pointer-events: none; overflow: hidden; }
  #season-front { position: fixed; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
  #season-fx    { position: fixed; inset: 0; z-index: 40; pointer-events: none; }

  .season-bar { position: relative; display: inline-block; margin-top: 20px; animation: fade-up .8s .5s both; }
  .season-chip {
    font: inherit; font-weight: 800; font-size: .9rem; letter-spacing: .06em; color: var(--text); cursor: pointer;
    padding: 9px 18px; border-radius: 999px; border: 1.5px solid var(--yellow); background: rgba(255,255,255,.06);
    box-shadow: 0 0 24px -6px var(--yellow); font-variant-numeric: tabular-nums; transition: transform .15s;
  }

    position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); z-index: 20; min-width: 230px;

  .season-menu button { all: unset; display: block; cursor: pointer; padding: 9px 12px; border-radius: 9px; font-weight: 600; }
  .season-menu button:hover, .season-menu button.on { background: rgba(255,255,255,.09); }

/* ---------- Sound ---------- */
let soundOn = store.get("hub-sound") !== "off";
let audio;
function beep(freq = 600, dur = .08, type = "square", vol = .05, slide = 0) {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, audio.currentTime + dur);
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
  } catch {}
}
function updateSoundBtn() { $("#sound").textContent = soundOn ? "🔊 Sound" : "🔇 Muted"; }

$("#sound").onclick = () => { soundOn = !soundOn; store.set("hub-sound", soundOn ? "on" : "off"); updateSoundBtn(); beep(880, .1); };

function hexToRgb(hex) { const n = parseInt(hex.replace("#", ""), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const rgba = (hex, a) => `rgba(${hexToRgb(hex).join(",")},${a})`;
const isLight = hex => { const [r, g, b] = hexToRgb(hex); return (r * 299 + g * 587 + b * 114) / 1000 > 150; };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ---------- Build cards ---------- */
GAMES.forEach((g, i) => {
  const theme = THEMES[g.theme];
  const color = g.color || theme?.color || "#22e4ff";
  g.color = color;
  const card = document.createElement("div");
  card.className = "card" + (theme ? " t-" + g.theme : "");
  card.style.setProperty("--i", i);
  card.style.setProperty("--c", color);
  card.style.setProperty("--c-glow", rgba(color, .45));
  card.dataset.search = (g.title + " " + (g.tag || "") + " " + (g.description || "")).toLowerCase();
  const art = theme ? theme.art()
    : g.image ? `<div class="art"><img src="${g.image}" alt="" style="width:100%;height:100%;object-fit:cover"></div>`
    : `<div class="art art-generic"><span class="emoji">${g.emoji || "🎮"}</span></div>`;
  card.innerHTML = `
    <div class="card-inner">
      <div class="badges">${g.file === lastPlayed ? '<span class="badge">Last played</span>' : ""}</div>
      <div class="thumb">${art}</div>
      <div class="info">
        <h2></h2>
        <p></p>
        <div class="meta"><span class="tag"></span><button class="play">▶ PLAY</button></div>
      </div>
      <div class="shine"></div>
    </div>`;
  if (theme?.titleHTML) card.querySelector("h2").innerHTML = theme.titleHTML;
  else card.querySelector("h2").textContent = g.title;
  card.querySelector("p").textContent = g.description || "";
  card.querySelector(".tag").textContent = g.tag || "";
  grid.appendChild(card);
  theme?.init?.(card);

  card.addEventListener("mousemove", e => {
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    card.style.transform = `rotateY(${(x - .5) * 16}deg) rotateX(${(.5 - y) * 16}deg) scale(1.04)`;
    card.style.setProperty("--mx", x * 100 + "%");
    card.style.setProperty("--my", y * 100 + "%");
  });
  card.addEventListener("mouseenter", () => beep(420 + i * 60, .05, "triangle", .04));
  card.addEventListener("mouseleave", () => { card.style.transform = ""; });
  card.addEventListener("animationend", e => { if (e.target === card) card.style.animation = "none"; });
  card.addEventListener("click", e => launch(g, card, e));
});

/* ---------- Pixel Front mini map: countries growing pixel by pixel ---------- */
function pixelMap(card) {
  const cv = card.querySelector("canvas"), c = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  const COLORS = ["#2f80ed", "#27ae60", "#f5b400", "#e74c3c", "#8e44ad", "#ff5d8f"];
  const landEl = card.querySelector(".px-land"), troopEl = card.querySelector(".px-troops");
  let land, owner, landCount, owned, resetAt;

  function reset() {
    land = new Uint8Array(W * H); owner = new Int8Array(W * H).fill(-1); landCount = 0; owned = 0; resetAt = 0;
    const blobs = Array.from({ length: 7 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 6 + Math.random() * 9 }));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let v = 0;
      for (const b of blobs) v += Math.max(0, 1 - Math.hypot((x - b.x) / 1.3, y - b.y) / b.r);
      if (v + Math.random() * .15 > .45) { land[y * W + x] = 1; landCount++; }
    }
    c.fillStyle = "#7cc4e8"; c.fillRect(0, 0, W, H);
    for (let i = 0; i < W * H; i++) if (land[i]) { c.fillStyle = (i * 7 + (i / W | 0)) % 5 ? "#e8dcb5" : "#dccf9f"; c.fillRect(i % W, i / W | 0, 1, 1); }
    COLORS.forEach((col, p) => {
      for (let tries = 0; tries < 500; tries++) {
        const i = Math.floor(Math.random() * W * H);
        if (land[i] && owner[i] < 0) { paint(i, p); break; }
      }
    });
  }
  function paint(i, p) {
    if (owner[i] < 0) owned++;
    owner[i] = p;
    c.fillStyle = COLORS[p]; c.fillRect(i % W, i / W | 0, 1, 1);
  }
  function step() {
    for (let n = 0; n < 140; n++) {
      const i = Math.floor(Math.random() * W * H), p = owner[i];
      if (p < 0) continue;
      const x = i % W, y = i / W | 0;
      const d = [[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random() * 4)];
      const nx = x + d[0], ny = y + d[1];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const j = ny * W + nx;
      if (!land[j] || owner[j] === p) continue;
      if (owner[j] < 0 || Math.random() < (p === 0 ? .12 : .05)) paint(j, p);
    }
    let mine = 0;
    for (let i = 0; i < owner.length; i++) if (owner[i] === 0) mine++;
    landEl.textContent = Math.round(mine / landCount * 100) + "%";
    troopEl.textContent = (mine * 137).toLocaleString();
    if (owned >= landCount && !resetAt) resetAt = performance.now() + 2500;
    if (resetAt && performance.now() > resetAt) reset();
  }
  reset();
  setInterval(step, 70);
}

/* ---------- BEATSTORM: notes stream down a neon highway in time with a beat ---------- */
function beatHighway(card) {
  const cv = card.querySelector("canvas"), c = cv.getContext("2d"), W = cv.width, H = cv.height;
  const scoreEl = card.querySelector(".bs-score"), multEl = card.querySelector(".bs-mult"), pop = card.querySelector(".bs-pop");
  const COLS = ["#3ddc84", "#ff3d8b", "#ffd23f", "#3ef0ff", "#b56cff"], LANES = 5;
  const TOP = 14, HIT = H - 30, NEAR = W * .8, FAR = W * .14, CX = W / 2, SPEED = .62, STEP = 60 / 112 / 2;
  const depth = z => Math.pow(z, 1.7);
  const yAt = z => TOP + (HIT - TOP) * depth(z);
  const wAt = z => FAR + (NEAR - FAR) * depth(z);
  const xAt = (lane, z) => CX - wAt(z) / 2 + wAt(z) * lane / LANES;   // lane may be fractional (edges)
  const zEnd = Math.pow((H - TOP) / (HIT - TOP), 1 / 1.7);              // where the highway leaves the bottom edge
  const flash = new Array(LANES).fill(0);
  let notes = [], acc = 0, scroll = 0, combo = 0, score = 0, mult = 1, last = performance.now(), t = 0;
  const showPop = (text, miss) => { pop.textContent = text; pop.className = "bs-pop" + (miss ? " miss" : ""); void pop.offsetWidth; pop.classList.add("go"); };
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
    acc += dt;
    while (acc >= STEP) {   // new notes on the beat (eighth notes)
      acc -= STEP;
      if (Math.random() < .55) {
        const l = Math.floor(Math.random() * LANES); notes.push({ l, z: 0 });
        if (Math.random() < .15) notes.push({ l: (l + 2) % LANES, z: 0 });
      }
    }
    scroll = (scroll + dt * SPEED) % .125;
    // stage background with sweeping light beams
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#1a0f33"); g.addColorStop(1, "#07050f");
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = "lighter";
    [[.12, "#ff3d8b"], [.88, "#3ef0ff"]].forEach(([x, col], i) => {
      const a = Math.sin(t * 1.3 + i * 2) * .5;
      c.save(); c.translate(W * x, -10); c.rotate(a * (i ? -1 : 1) + (i ? .5 : -.5));
      const bg = c.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, col + "55"); bg.addColorStop(1, col + "00");
      c.fillStyle = bg; c.beginPath(); c.moveTo(-6, 0); c.lineTo(6, 0); c.lineTo(40, H * 1.2); c.lineTo(-40, H * 1.2); c.fill(); c.restore();
    });
    c.globalCompositeOperation = "source-over";
    // the highway
    c.beginPath(); c.moveTo(xAt(0, 0), TOP); c.lineTo(xAt(LANES, 0), TOP); c.lineTo(xAt(LANES, zEnd), H); c.lineTo(xAt(0, zEnd), H); c.closePath();
    c.fillStyle = "rgba(10,6,24,.88)"; c.fill();
    c.strokeStyle = "#b56cff"; c.lineWidth = 2; c.shadowColor = "#b56cff"; c.shadowBlur = 10; c.stroke(); c.shadowBlur = 0;
    c.strokeStyle = "rgba(160,120,255,.22)"; c.lineWidth = 1;
    for (let l = 1; l < LANES; l++) { c.beginPath(); c.moveTo(xAt(l, 0), TOP); c.lineTo(xAt(l, zEnd), H); c.stroke(); }
    for (let z = scroll; z < zEnd; z += .125) {   // beat lines rushing toward you
      c.strokeStyle = `rgba(181,108,255,${.08 + depth(z) * .25})`;
      c.beginPath(); c.moveTo(xAt(0, z), yAt(z)); c.lineTo(xAt(LANES, z), yAt(z)); c.stroke();
    }
    // hit line and targets
    c.strokeStyle = "rgba(255,255,255,.5)"; c.lineWidth = 2;
    c.beginPath(); c.moveTo(xAt(0, 1), HIT); c.lineTo(xAt(LANES, 1), HIT); c.stroke();
    const lw = wAt(1) / LANES;
    for (let l = 0; l < LANES; l++) {
      const x = xAt(l + .5, 1);
      flash[l] = Math.max(0, flash[l] - dt * 4);
      c.strokeStyle = COLS[l]; c.lineWidth = 2.5;
      c.beginPath(); c.ellipse(x, HIT, lw * .36, lw * .18, 0, 0, 7); c.stroke();
      if (flash[l] > 0) {
        c.globalCompositeOperation = "lighter"; c.globalAlpha = flash[l];
        const fg = c.createRadialGradient(x, HIT, 0, x, HIT, lw * .9); fg.addColorStop(0, COLS[l]); fg.addColorStop(1, COLS[l] + "00");
        c.fillStyle = fg; c.fillRect(x - lw, HIT - lw * 1.4, lw * 2, lw * 1.8);
        c.globalAlpha = 1; c.globalCompositeOperation = "source-over";
      }
    }
    // notes
    for (let i = notes.length - 1; i >= 0; i--) {
      const n = notes[i];
      n.z += dt * SPEED;
      if (n.z >= 1) {
        notes.splice(i, 1);
        if (Math.random() < .96) {
          flash[n.l] = 1; combo++;
          mult = Math.min(4, 1 + Math.floor(combo / 10));
          score += 10 * mult;
          if (combo % 25 === 0) showPop(combo + " NOTE STREAK!");
          else if (Math.random() < .08) showPop(Math.random() < .6 ? "PERFECT!" : "GREAT!");
        } else { combo = 0; mult = 1; showPop("MISS", true); }
        scoreEl.textContent = score.toLocaleString();
        multEl.textContent = "×" + mult; multEl.classList.toggle("max", mult === 4);
        continue;
      }
      const x = xAt(n.l + .5, n.z), y = yAt(n.z), rx = wAt(n.z) / LANES * .36;
      c.fillStyle = COLS[n.l]; c.shadowColor = COLS[n.l]; c.shadowBlur = 8;
      c.beginPath(); c.ellipse(x, y, rx, rx * .5, 0, 0, 7); c.fill(); c.shadowBlur = 0;
      c.fillStyle = "rgba(255,255,255,.65)"; c.beginPath(); c.ellipse(x - rx * .2, y - rx * .12, rx * .42, rx * .16, 0, 0, 7); c.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- Don't Touch the Button: the button dodges a cursor, until it doesn't ---------- */
function buttonChase(card) {
  const art = card.querySelector(".art-button"), btn = art.querySelector(".bt-btn"), cur = art.querySelector(".bt-cur"), say = art.querySelector(".bt-say");
  const lvlEl = art.querySelector(".bt-lvl"), nameEl = art.querySelector(".bt-name"), failEl = art.querySelector(".bt-fails");
  const LEVELS = ["The Easy One", "Clingy", "Teleporter", "Opposite Day", "Lights Out", "Mirror World", "Button Rain", "Fake Victory", "Snake", "The Maze", "Bullet Hell", "Final Exam"];
  const TAUNTS = ["do it", "just once", "press me", "nobody's watching", "c'mon", "boop?", "I'm so squishy", "you know you want to"];
  let bx = .5, by = .55, cx = .12, cy = .85, dodges = 0, need = 4, touches = 0, lvl = 0, pause = 0;
  const place = () => {
    for (const el of [btn, say]) { el.style.left = bx * 100 + "%"; el.style.top = by * 100 + "%"; }
  };
  const jump = () => {
    let nx, ny;
    do { nx = .14 + Math.random() * .72; ny = .47 + Math.random() * .24; } while (Math.hypot(nx - cx, ny - cy) < .35);
    bx = nx; by = ny; place();
  };
  setInterval(() => {
    const r = art.getBoundingClientRect();
    if (!r.width || pause-- > 0) return;
    cx += (bx - cx) * .09; cy += (by - cy) * .09;   // the cursor creeps toward the button
    cur.style.left = cx * 100 + "%"; cur.style.top = cy * 100 + "%";
    if (Math.hypot((bx - cx) * r.width, (by - cy) * r.height) > 46) return;
    if (dodges < need) {   // dodge!
      dodges++; jump();
      say.className = "bt-say"; say.textContent = TAUNTS[Math.floor(Math.random() * TAUNTS.length)];
      return;
    }
    // ...but sooner or later the cursor gets it
    touches++; dodges = 0; need = 3 + Math.floor(Math.random() * 4); pause = 22;
    failEl.textContent = "Touches: " + touches;
    btn.classList.add("pressed"); art.classList.add("flash");
    say.className = "bt-say win"; say.textContent = "HA! you touched it";
    setTimeout(() => {
      btn.classList.remove("pressed"); art.classList.remove("flash");
      lvl = (lvl + 1) % LEVELS.length;
      lvlEl.textContent = "LVL " + (lvl + 1); nameEl.textContent = LEVELS[lvl];
      say.className = "bt-say"; say.textContent = "try again";
      jump();
    }, 1000);
  }, 50);
}

/* ---------- Iron Mandate mini map: provinces changing hands ---------- */
function mandateMap(card) {
  const cv = card.querySelector("canvas"), c = cv.getContext("2d"), W = cv.width, H = cv.height;
  const dayEl = card.querySelector(".im-day"), goldEl = card.querySelector(".im-gold");
  const newsEl = card.querySelector(".im-news"), ping = card.querySelector(".im-ping");
  const NAMES = ["Valdoria", "Kestrel", "Ostmark", "Serane", "Dravia", "Halvor", "Corvain", "Elmora"];
  const COLORS = ["#e8b931", "#c44b3a", "#4f86c6", "#5aa86f", "#9a6bc7", "#d07a3a", "#3fa3a0", "#b8577f"].map(hexToRgb);
  const PROV = ["Ashford", "Brennmoor", "Calden", "Dunmere", "Eastwatch", "Fallow", "Greyhaven", "Highmark", "Ironvale", "Kettering", "Lowfen", "Marrow"];
  let cell, seeds, owner, nb, day, gold, resetAt;

  function reset() {
    seeds = Array.from({ length: 46 }, () => ({ x: Math.random() * W, y: Math.random() * H }));
    const blobs = Array.from({ length: 6 }, () => ({ x: W * (.15 + Math.random() * .7), y: H * (.2 + Math.random() * .6), r: 26 + Math.random() * 26 }));
    cell = new Int16Array(W * H).fill(-1);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let v = 0;
      for (const b of blobs) v += Math.max(0, 1 - Math.hypot((x - b.x) / 1.4, y - b.y) / b.r);
      if (v < .32) continue;   // sea
      const wx = x + Math.sin(y * .35) * 1.6, wy = y + Math.cos(x * .3) * 1.6;   // wobbly borders
      let best = 0, bd = Infinity;
      seeds.forEach((s, i) => { const d = (s.x - wx) ** 2 + (s.y - wy) ** 2; if (d < bd) { bd = d; best = i; } });
      cell[y * W + x] = best;
    }
    nb = seeds.map(() => new Set());
    for (let i = 0; i < W * H; i++) {
      const k = cell[i]; if (k < 0) continue;
      const r = (i + 1) % W ? cell[i + 1] : -1, d = cell[i + W] ?? -1;
      if (r >= 0 && r !== k) { nb[k].add(r); nb[r].add(k); }
      if (d >= 0 && d !== k) { nb[k].add(d); nb[d].add(k); }
    }
    owner = seeds.map(() => 1 + Math.floor(Math.random() * 7));
    const land = seeds.map((_, i) => i).filter(i => nb[i].size);
    const cap = land[Math.floor(Math.random() * land.length)];
    owner[cap] = 0; nb[cap].forEach(j => { if (Math.random() < .5) owner[j] = 0; });
    day = 1; gold = 500; resetAt = 0; newsEl.textContent = "";
    draw();
  }
  function draw() {
    const img = c.createImageData(W, H), d = img.data;
    for (let i = 0; i < W * H; i++) {
      const k = cell[i], o = i * 4;
      if (k < 0) { const g = (i % W + (i / W | 0)) % 6 ? 0 : 6; d[o] = 10 + g; d[o + 1] = 24 + g; d[o + 2] = 38 + g; d[o + 3] = 255; continue; }
      let [r, g, b] = COLORS[owner[k]];
      const rk = (i + 1) % W ? cell[i + 1] : k, dk = cell[i + W] ?? k;
      const edge = (rk !== k && rk >= 0) || (dk !== k && dk >= 0), coast = rk < 0 || dk < 0;
      const nation = (rk >= 0 && owner[rk] !== owner[k]) || (dk >= 0 && owner[dk] !== owner[k]);
      const f = nation ? .25 : coast ? .55 : edge ? .72 : owner[k] === 0 ? 1 : .86;
      d[o] = r * f; d[o + 1] = g * f; d[o + 2] = b * f; d[o + 3] = 255;
    }
    c.putImageData(img, 0, 0);
  }
  function step() {
    if (resetAt) { if (performance.now() > resetAt) reset(); return; }
    day++; gold += 40 + owner.filter(o => o === 0).length * 6;
    dayEl.textContent = day; goldEl.textContent = gold.toLocaleString();
    for (let tries = 0; tries < 30; tries++) {   // one border province changes hands
      const k = Math.floor(Math.random() * seeds.length), list = [...nb[k]];
      if (!list.length) continue;
      const j = list[Math.floor(Math.random() * list.length)], a = owner[j], b = owner[k];
      if (a === b || Math.random() > (a === 0 ? .9 : b === 0 ? .35 : .6)) continue;
      owner[k] = a;
      if (Math.random() < .5 || a === 0 || b === 0) {
        newsEl.className = "im-news" + (a === 0 ? " me" : "");
        newsEl.textContent = `⚔ ${NAMES[a]} seizes ${PROV[k % PROV.length]} from ${NAMES[b]}`;
      }
      if (a === 0) {
        ping.style.left = seeds[k].x / W * 100 + "%"; ping.style.top = seeds[k].y / H * 100 + "%";
        ping.classList.remove("go"); void ping.offsetWidth; ping.classList.add("go");
      }
      break;
    }
    draw();
    const alive = new Set(owner.filter((_, i) => nb[i].size));
    if (alive.size === 1) { newsEl.textContent = `👑 ${NAMES[[...alive][0]]} rules the world`; resetAt = performance.now() + 3000; }
  }
  reset();
  setInterval(step, 450);
}

/* ---------- Load games in the background so they open instantly ---------- */
const prefetched = new Set();
function prefetch(file) {
  if (prefetched.has(file)) return;
  prefetched.add(file);
  const l = document.createElement("link");
  l.rel = "prefetch"; l.href = file;
  document.head.appendChild(l);
}
[...grid.children].forEach((card, i) => {
  card.addEventListener("mouseenter", () => prefetch(GAMES[i].file));
  card.addEventListener("touchstart", () => prefetch(GAMES[i].file), { passive: true });
});

/* ---------- Launch a game ---------- */
function launch(game, card, e) {
  if (launching) return;
  launching = true;
  store.set("hub-last", game.file);

  const inner = card.querySelector(".card-inner"), r = inner.getBoundingClientRect();
  const cx = e?.clientX ?? r.left + r.width / 2, cy = e?.clientY ?? r.top + r.height / 2;
  const rip = document.createElement("span"), size = Math.max(r.width, r.height);
  rip.className = "ripple";
  rip.style.cssText = `width:${size}px;height:${size}px;left:${cx - r.left - size / 2}px;top:${cy - r.top - size / 2}px`;
  inner.appendChild(rip);
  burst(cx, cy, game.color, 30);
  if (seasonKey) fxBurst(cx, cy, SEASONS[seasonKey].stickers, 14);

  beep(200, .6, "sawtooth", .05, 6);
  setTimeout(() => beep(1200, .15, "square", .04), 500);
  document.body.classList.add("shake");
  warp = true;

  const ov = $("#launch"), ring = ov.querySelector(".ring");
  ov.style.setProperty("--c", game.color);
  ov.style.setProperty("--lc", isLight(game.color) ? "#0b0618" : "#ffffff");
  ring.style.left = (r.left + r.width / 2 - 10) + "px";
  ring.style.top = (r.top + r.height / 2 - 10) + "px";
  $("#launch-name").textContent = game.title;
  setTimeout(() => ov.classList.add("on"), 250);
  setTimeout(() => { window.location.href = game.file; }, 1500);
}

// Reset everything when coming back with the browser's Back button
window.addEventListener("pageshow", () => {
  launching = false; warp = false;
  $("#launch").classList.remove("on");
  document.body.classList.remove("shake");
  document.querySelectorAll(".ripple").forEach(el => el.remove());
});

/* ---------- Search ---------- */
$("#search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll(".card").forEach(c => {
    const hit = c.dataset.search.includes(q);
    c.style.display = hit ? "" : "none";
    shown += hit;
  });
  $("#empty").style.display = shown ? "none" : "block";
});

/* ---------- Random game (slot machine) ---------- */
let rolling = false;
function randomGame() {
  if (launching || rolling) return;
  const cards = [...document.querySelectorAll(".card")].filter(c => c.style.display !== "none");
  if (!cards.length) return;
  rolling = true;
  const pick = Math.floor(Math.random() * cards.length);
  const steps = cards.length * 2 + pick + 1;
  let n = 0;
  (function tick() {
    cards.forEach(c => c.classList.remove("highlight"));
    const c = cards[n % cards.length];
    c.classList.add("highlight");
    beep(500 + (n % cards.length) * 80, .05, "square", .04);
    n++;
    if (n < steps) setTimeout(tick, 60 + n * 12);
    else setTimeout(() => {
      c.classList.remove("highlight");
      rolling = false;
      launch(GAMES[[...grid.children].indexOf(c)], c);
    }, 500);
  })();
}
$("#random").onclick = randomGame;

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeNews(); $("#season-menu").hidden = true; }
  if (e.target.tagName === "INPUT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey || newsIsOpen()) return;
  if (e.key === "/") { e.preventDefault(); $("#search").focus(); }
  if (e.key.toLowerCase() === "r") randomGame();

const cv = $("#stars"), ctx = cv.getContext("2d");
let W, H, stars = [], warp = false, speed = 0.6, bgRGB = "7,4,15";
function resize() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  stars = Array.from({ length: Math.min(500, Math.floor(W * H / 3500)) }, newStar);
}
function newStar() {
  return { x: (Math.random() - .5) * W, y: (Math.random() - .5) * H, z: Math.random() * W, pz: 0,
           c: pick(trailColors) };

addEventListener("mousemove", e => { mouseX = (e.clientX / W - .5) * 40; mouseY = (e.clientY / H - .5) * 40; });

  speed += ((warp ? 40 : 0.6) - speed) * 0.05;
  ctx.fillStyle = `rgba(${bgRGB},${warp ? .25 : .6})`;
  ctx.fillRect(0, 0, W, H);

    if (s.z < 1) { Object.assign(s, newStar(), { z: W }); s.pz = s.z; continue; }
    const sx = s.x / s.z * W * .5 + cx, sy = s.y / s.z * W * .5 + cy;

/* =====================================================================
   🎃🎄🎆  SEASONAL EVENTS
   Uses your computer's date. Each event has a start and an end, and the
   page checks the date every second, so it switches by itself (even if
   the page is left open overnight). Outside of events it looks normal.

   Preview any season: click the event chip under the title, or open the
   page with ?season=christmas (or halloween, newyear, easter, valentine,
   stpatrick, none) at the end of the address.

const DAY = 864e5;

// Easter Sunday for a given year (the standard "computus" calculation)
function easterSunday(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}

// When each event runs. "end" is the first day it's OVER (so Halloween ends the moment Nov 1 starts).
function seasonWindows(y) {
  const D = (m, d, yy = y) => new Date(yy, m - 1, d);
  const e = easterSunday(y), plus = n => new Date(e.getFullYear(), e.getMonth(), e.getDate() + n);

    { key: "valentine", start: D(2, 7),          end: D(2, 15) },
    { key: "stpatrick", start: D(3, 14),         end: D(3, 18) },
    { key: "easter",    start: plus(-7),         end: plus(2) },   // Palm Sunday → Easter Monday
    { key: "halloween", start: D(10, 1),         end: D(11, 1) },
    { key: "christmas", start: D(12, 1),         end: D(12, 31) },
    { key: "newyear",   start: D(12, 31),        end: D(1, 3, y + 1) },

}

/* Decoration builders */
function webSVG() {
  const A = [0, 15, 30, 45, 60, 75, 90].map(d => d * Math.PI / 180);
  let s = A.map(a => `<line x1="0" y1="0" x2="${200 * Math.cos(a)}" y2="${200 * Math.sin(a)}"/>`).join("");
  for (const r of [30, 62, 98, 138, 182]) {
    let d = "";
    A.forEach((a, i) => {
      const x = r * Math.cos(a), y = r * Math.sin(a);
      if (!i) d += `M${x} ${y}`;
      else { const m = (A[i - 1] + a) / 2, rr = r * .86; d += ` Q${rr * Math.cos(m)} ${rr * Math.sin(m)} ${x} ${y}`; }
    });
    s += `<path d="${d}"/>`;
  }
  return `<svg class="s-web" viewBox="0 0 200 200">${s}</svg><div class="s-spider"><span>🕷️</span></div>`;
}
function lightsHTML() {
  const n = 30, loops = 7, cols = ["#ff3b4f", "#2ecc71", "#ffd36b", "#4fc3ff", "#ff8a3d"];
  let d = "M0 4", bulbs = "";
  for (let i = 0; i < loops; i++) { const a = i * 1000 / loops, b = (i + 1) * 1000 / loops; d += ` Q${(a + b) / 2} 40 ${b} 4`; }
  for (let i = 0; i < n; i++) {
    const f = (i + .5) / n, y = 4 + 18 * Math.sin(Math.PI * ((f * loops) % 1));
    bulbs += `<span class="bulb" style="left:${f * 100}%;top:${y + 2}px;--bc:${cols[i % cols.length]};animation-delay:${-(i % 3) * .5}s"></span>`;
  }
  return `<div class="s-lights"><svg viewBox="0 0 1000 40" preserveAspectRatio="none"><path d="${d}"/></svg>${bulbs}</div>`;
}
function grassHTML() {
  return `<svg class="s-grass"><defs><pattern id="grass" width="24" height="36" patternUnits="userSpaceOnUse">
    <path d="M0 36 L4 14 L8 36 L12 4 L16 36 L20 16 L24 36Z" fill="#62c46e"/></pattern></defs>
    <rect width="100%" height="36" fill="url(#grass)"/><rect y="28" width="100%" height="8" fill="#4aa857"/></svg>`;

const fxCv = $("#season-fx"), fxCtx = fxCv.getContext("2d");

const sprites = {};
function sprite(ch) {   // draw each emoji once, then reuse the picture (much faster)
  if (sprites[ch]) return sprites[ch];
  const c = document.createElement("canvas"), x = c.getContext("2d");
  const font = '64px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  x.font = font;

}
function fxResize() { fxCv.width = innerWidth; fxCv.height = innerHeight; }

  const n = 50 + Math.floor(Math.random() * 40), power = rand(140, 260);

    fxParts.push(P({ kind: "spark", x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 90, drag: 1.2,
      life: 1, decay: rand(.55, .9), color: i % 2 ? c1 : c2, w: 2 }));

    fxParts.push(P({ ch: pick(chars), x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 160, g: 700,

/* ---------- Turning a season on/off ---------- */

    txt = s ? `${s.icon} ${s.name} event · preview` : "🚫 No event · preview";
  } else if (!s) {
    const n = nextWindow(now), ns = SEASONS[n.key], d = Math.ceil((n.start - now) / DAY);
    txt = `${ns.icon} ${ns.name} event in ${d} day${d === 1 ? "" : "s"}`;
  } else if (seasonKey === "newyear") {
    const ny = new Date(upcomingYear(now), 0, 1), ms = ny - now;
    if (ms > 0) {
      const two = n => String(n).padStart(2, "0");
      txt = `🎆 ${ny.getFullYear()} in ${Math.floor(ms / 36e5)}:${two(Math.floor(ms / 6e4) % 60)}:${two(Math.floor(ms / 1e3) % 60)}`;
    } else txt = `🎆 Happy New Year ${ny.getFullYear()}!`;
  } else {
    const d = Math.ceil((currentWindow(now).end - now) / DAY);
    txt = `${s.icon} ${s.name} event · ${d <= 1 ? "last day!" : d + " days left"}`;
  }
  if (seasonKey === "easter") txt += eggsFound === EGG_COUNT ? " · 🐰 all eggs found!" : ` · 🥚 ${eggsFound}/${EGG_COUNT} found`;
  if (chip.textContent !== txt) chip.textContent = txt;
}

function buildSeasonMenu() {
  const menu = $("#season-menu");
  menu.innerHTML = "<small>Preview a season</small>";
  const items = [["auto", "📅 Automatic (today's date)"], ...Object.entries(SEASONS).map(([k, s]) => [k, `${s.icon} ${s.name}`]), ["none", "🚫 No event"]];
  for (const [k, label] of items) {
    const b = document.createElement("button");
    b.textContent = label;
    if ((seasonPreview || "auto") === k) b.className = "on";
    b.onclick = e => {
      e.stopPropagation();
      seasonPreview = k === "auto" ? null : k;
      menu.hidden = true;
      applySeason(activeSeason());
      beep(700, .06, "triangle", .04);
    };
    menu.appendChild(b);
  }
}
$("#season-chip").onclick = e => { e.stopPropagation(); buildSeasonMenu(); $("#season-menu").hidden = !$("#season-menu").hidden; };
document.addEventListener("click", () => { $("#season-menu").hidden = true; });

applySeason(activeSeason());
setInterval(() => {   // follow the real date: switches over at midnight by itself
  if (!seasonPreview) { const w = currentWindow(); if ((w?.key || null) !== seasonKey) applySeason(w); }
  updateChip();
}, 1000);

/* =====================================================================
   📢  NEWS & UPDATE ANNOUNCEMENTS
   Comes from news.js (written by you) and auto-news.js (written by
   "Check for Updates"). A game with recent news gets a badge on its card;
   anything you haven't seen yet pops up once and shows in the News panel.
   ===================================================================== */
const dayStart = (d = new Date()) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const parseDay = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const newsById = new Map();
for (const n of window.GZ_NEWS || []) {
  if (!n || !n.title || !n.date) continue;
  const when = parseDay(n.date);
  if (isNaN(when) || when > dayStart()) continue;   // future dates stay hidden until that day
  const id = n.id || `${n.game || "site"}|${n.date}|${n.title}`;
  newsById.set(id, { ...n, id, when });
}
const NEWS = [...newsById.values()].sort((a, b) => b.when - a.when);
let seenNews;
try { seenNews = new Set(JSON.parse(store.get("hub-news-seen") || "[]")); } catch { seenNews = new Set(); }
const saveSeen = () => store.set("hub-news-seen", JSON.stringify([...seenNews].slice(-300)));
const isRecent = n => (dayStart() - n.when) / DAY <= (n.days ?? 14);
const isUnread = n => isRecent(n) && !seenNews.has(n.id);
const gameFor = n => GAMES.find(g => g.file === n.game);
const cleanVer = v => String(v).replace(/^v/i, "");
const ago = when => { const d = Math.round((dayStart() - when) / DAY); return d <= 0 ? "Today" : d === 1 ? "Yesterday" : d < 30 ? d + " days ago" : when.toLocaleDateString(); };

function launchFile(file) {
  const i = GAMES.findIndex(g => g.file === file);
  if (i >= 0) launch(GAMES[i], grid.children[i]); else location.href = file;
}

function renderNewsBadges() {
  [...grid.children].forEach((card, i) => {
    const box = card.querySelector(".badges");
    box.querySelector(".upd")?.remove();
    const n = NEWS.find(n => n.game === GAMES[i].file && isRecent(n));
    if (!n) return;
    const fresh = !seenNews.has(n.id), b = document.createElement("span");
    b.className = "badge upd" + (fresh ? " fresh" : "");
    const isNew = /^new game/i.test(n.title);
    b.textContent = (isNew ? "✨ New game" : fresh ? "✨ New update" : "✨ Updated") + (n.version ? " · v" + cleanVer(n.version) : "");
    b.title = n.title;
    box.prepend(b);
  });
  const unread = NEWS.filter(isUnread).length, cnt = $("#news-btn .count");
  cnt.hidden = !unread; cnt.textContent = unread;
}

function renderNewsList() {
  const list = $("#news-list");
  list.innerHTML = "";
  if (!NEWS.length) {
    list.innerHTML = `<p class="np-empty">No news yet.<br>Write some in <b>news.js</b> (next to this page),<br>or run <b>Check for Updates</b>.</p>`;
    return;
  }
  for (const n of NEWS) {
    const g = gameFor(n), color = g?.color || "#22e4ff", el = document.createElement("article");
    el.className = "np-item" + (isUnread(n) ? " unread" : "");
    el.style.setProperty("--c", color);
    el.innerHTML = `<div class="np-top"><span class="np-game"></span><span class="np-date"></span></div><h4></h4><p></p>`;
    el.querySelector(".np-game").textContent = g ? g.title : n.game ? n.game.replace(/\.html?$/i, "") : "Game Zone";
    el.querySelector(".np-date").textContent = ago(n.when);
    const h = el.querySelector("h4");
    h.textContent = n.title;
    if (n.version) { const v = document.createElement("span"); v.className = "np-ver"; v.textContent = "v" + cleanVer(n.version); h.append(" ", v); }
    el.querySelector("p").textContent = n.text || "";
    if (n.game) {
      const b = document.createElement("button");
      b.className = "np-play"; b.textContent = "▶ Play";
      b.style.color = isLight(color) ? "#0b0618" : "#fff";
      b.onclick = () => { closeNews(); launchFile(n.game); };
      el.appendChild(b);
    }
    list.appendChild(el);
  }
}

const newsIsOpen = () => $("#news-panel").classList.contains("open");
function openNews() {
  renderNewsList();
  $("#news-panel").classList.add("open");
  $("#news-backdrop").classList.add("open");
  NEWS.filter(isRecent).forEach(n => seenNews.add(n.id));
  saveSeen(); renderNewsBadges(); hideToast(false);
  beep(520, .08, "triangle", .04);
}
function closeNews() {
  $("#news-panel").classList.remove("open");
  $("#news-backdrop").classList.remove("open");
}
$("#news-btn").onclick = openNews;
$("#news-close").onclick = closeNews;
$("#news-backdrop").onclick = closeNews;

function showToast(n) {
  const t = $("#toast"), g = gameFor(n);
  t.style.setProperty("--c", g?.color || "#22e4ff");
  t.innerHTML = `<div class="t-icon">📢</div><div class="t-body"><small></small><b></b><span class="t-text"></span></div><div class="t-actions"></div>`;
  t.querySelector("small").textContent = g ? g.title + (n.version ? " · v" + cleanVer(n.version) : "") : "Game Zone news";
  t.querySelector("b").textContent = n.title;
  t.querySelector(".t-text").textContent = n.text || "";
  const acts = t.querySelector(".t-actions");
  const add = (label, cls, fn) => { const b = document.createElement("button"); b.textContent = label; b.className = cls; b.onclick = e => { e.stopPropagation(); fn(); }; acts.appendChild(b); };
  if (n.game) add("▶ Play", "t-play", () => { hideToast(true); launchFile(n.game); });
  if (NEWS.length > 1) add("All news", "", () => { hideToast(true); openNews(); });
  add("✕", "", () => hideToast(true));
  t._markSeen = () => { seenNews.add(n.id); saveSeen(); renderNewsBadges(); };
  requestAnimationFrame(() => t.classList.add("show"));
  clearTimeout(t._timer);
  t._timer = setTimeout(() => hideToast(false), 15000);   // not dismissed = it'll show again next time
}
function hideToast(markSeen) {
  const t = $("#toast");
  t.classList.remove("show");
  clearTimeout(t._timer);
  if (markSeen) t._markSeen?.();
}

renderNewsBadges();
const firstUnread = NEWS.find(isUnread);
if (firstUnread) setTimeout(() => { if (!launching) showToast(firstUnread); }, 1800);
</script>
