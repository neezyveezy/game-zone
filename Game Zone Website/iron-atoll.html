<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iron Atoll</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed island canvas, a command HUD across the top, a glass operations panel docked right (bottom sheet on phones). */
:root {
  --sea: #0a1a22;
  --panel: rgba(12, 24, 30, 0.86);
  --panel-solid: #0f1f26;
  --raise: rgba(255, 255, 255, 0.04);
  --line: rgba(140, 190, 190, 0.16);
  --fg: #dce8e4;
  --muted: #8aa29f;
  --amber: #f2a93b;
  --amber-ink: #1d1406;
  --cyan: #5fd4c4;
  --red: #ff5a4e;
  --green: #7bd88f;
  --f-display: "Saira Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--sea); color: var(--fg); font: 14px/1.45 var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#fade { position: fixed; inset: 0; background: #050c10; opacity: 0; pointer-events: none; transition: opacity .45s var(--ease); z-index: 30; }
#fade.on { opacity: 1; }
#flash { position: fixed; inset: 0; pointer-events: none; z-index: 5; box-shadow: inset 0 0 0 0 rgba(255,90,78,0); transition: box-shadow .6s; }
#flash.on { box-shadow: inset 0 0 160px 20px rgba(255,60,50,.35); animation: alarm 1.2s infinite; }
@keyframes alarm { 50% { box-shadow: inset 0 0 90px 0 rgba(255,60,50,.12); } }

/* ---------- HUD ---------- */
#hud { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 22px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: linear-gradient(180deg, rgba(6,14,18,.9), rgba(6,14,18,.55) 70%, rgba(6,14,18,0)); transform: translateY(-110%); transition: transform .7s var(--ease); }
#hud.show { transform: none; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font: 700 20px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.brand small { color: var(--muted); font-size: 12px; }
.stat { display: flex; flex-direction: column; }
.stat label, .lbl { font: 600 10.5px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.stat b { font: 700 19px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat small { font: 500 11.5px var(--f-mono); color: var(--green); }
.cash b { color: var(--amber); transition: transform .2s; display: inline-block; }
.cash b.bump { transform: scale(1.08); }
.rank { display: flex; align-items: center; gap: 10px; }
.rank svg { width: 34px; height: 34px; }
.xpbar { width: 120px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 4px; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--amber), #ffd27a); transition: width .6s var(--ease); }
.rank-name { font: 700 15px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.spacer { flex: 1; }
.chip { font: 600 11px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; padding: 6px 10px; border-radius: 99px; border: 1px solid rgba(95,212,196,.4); color: var(--cyan); background: rgba(95,212,196,.08); white-space: nowrap; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); display: grid; place-items: center; cursor: pointer; transition: background .2s, transform .2s; }
.icon-btn:hover { background: rgba(255,255,255,.09); transform: translateY(-1px); }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }

/* ---------- Panel ---------- */
#panel { position: fixed; z-index: 9; top: calc(76px + env(safe-area-inset-top, 0px)); right: 14px; bottom: 14px; width: 370px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); box-shadow: 0 20px 60px rgba(0,0,0,.45); transform: translateX(calc(100% + 30px)); transition: transform .7s var(--ease) .1s; overflow: hidden; }
#panel.show { transform: none; }
.tabs { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--line); flex: none; }
.tabs button { position: relative; background: none; border: 0; padding: 13px 0 11px; cursor: pointer; font: 600 12.5px/1 var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); transition: color .2s; }
.tabs button:hover, .tabs button.on { color: var(--fg); }
.tabs button .badge { position: absolute; top: 6px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font: 700 10px/16px var(--f-mono); letter-spacing: 0; }
.tabs .ink { position: absolute; bottom: -1px; height: 2px; background: var(--amber); transition: left .35s var(--ease), width .35s var(--ease); }
.tabwrap { position: relative; flex: 1; min-height: 0; }
.tab { position: absolute; inset: 0; overflow-y: auto; padding: 16px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .3s var(--ease), transform .3s var(--ease); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
.tab.on { opacity: 1; transform: none; pointer-events: auto; }
.handle { display: none; }

h2 { font: 700 22px/1.05 var(--f-display); letter-spacing: .03em; text-transform: uppercase; margin: 0 0 4px; text-wrap: balance; }
h3 { font: 700 13px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 18px 0 10px; }
p.sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.opt { position: relative; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; transition: transform .2s var(--ease), border-color .2s, background .2s; min-width: 0; }
.opt:hover:not(:disabled) { transform: translateY(-2px); border-color: rgba(242,169,59,.5); background: rgba(242,169,59,.06); }
.opt:disabled { cursor: not-allowed; opacity: .45; }
.opt .t { font: 700 15px/1.1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; }
.opt .d { font-size: 12px; color: var(--muted); line-height: 1.35; }
.opt .m { display: flex; justify-content: space-between; gap: 6px; font: 500 12px var(--f-mono); }
.opt .m .c { color: var(--amber); }
.opt .lock { font: 600 10.5px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--red); }
.cat { font: 600 10px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; align-self: flex-start; }
.cat.eco { color: #9fe0a6; background: rgba(123,216,143,.12); }
.cat.def { color: var(--cyan); background: rgba(95,212,196,.12); }
.cat.mil { color: #ffb36b; background: rgba(242,169,59,.12); }
.cat.core { color: #fff; background: rgba(255,255,255,.1); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; font: 700 14px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; transition: transform .18s var(--ease), background .2s, box-shadow .2s, opacity .2s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); background: rgba(255,255,255,.08); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.98); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--amber); color: var(--amber-ink); border-color: transparent; box-shadow: 0 6px 20px rgba(242,169,59,.25); }
.btn.primary:hover:not(:disabled) { background: #ffbb55; box-shadow: 0 8px 28px rgba(242,169,59,.35); }
.btn.danger { background: var(--red); color: #fff; border-color: transparent; box-shadow: 0 6px 20px rgba(255,90,78,.3); }
.btn.danger:hover:not(:disabled) { background: #ff7065; }
.btn.small { padding: 8px 11px; font-size: 12px; }
.btn.block { width: 100%; }
.btn .c { font-family: var(--f-mono); font-weight: 700; letter-spacing: 0; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.kv { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; font-size: 13px; margin: 12px 0; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv span:nth-child(even) { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--amber); transition: width .25s linear; }
.bar.hp i { background: var(--green); }
.note { font-size: 12px; color: var(--muted); padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.03); border: 1px dashed var(--line); }
.warn { color: var(--red); }

.row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); transition: background .2s, border-color .2s; }
.row:hover { background: rgba(255,255,255,.06); }
.row .grow { flex: 1; min-width: 0; }
.row .nm { font: 700 15px/1.1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: 12px; color: var(--muted); }
.swatch { width: 10px; height: 34px; border-radius: 3px; flex: none; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.tag { display: inline-block; font: 600 10px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; background: rgba(255,255,255,.07); color: var(--muted); margin: 4px 4px 0 0; }
.tag.hot { background: rgba(255,90,78,.15); color: #ff8a80; }
.tag.cool { background: rgba(95,212,196,.12); color: var(--cyan); }
.tag.amber { background: rgba(242,169,59,.14); color: var(--amber); }

.target { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); transition: transform .2s var(--ease), border-color .2s; }
.target:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.22); }
.target .top { display: flex; gap: 10px; align-items: center; }
.target .acts { display: flex; gap: 6px; }
.target .acts .btn { flex: 1; }

.wrow { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); }
.wrow .t { font: 700 15px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.wrow .d { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.05); cursor: pointer; font: 700 16px/1 var(--f-mono); transition: background .15s; }
.stepper button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }
.stepper b { min-width: 28px; text-align: center; font: 700 15px var(--f-mono); }

.msg { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); animation: slidein .4s var(--ease); }
.msg .who { font: 700 13px/1.2 var(--f-display); letter-spacing: .05em; text-transform: uppercase; }
.msg .txt { font-size: 13px; }
.msg .when { font: 500 11px var(--f-mono); color: var(--muted); margin-left: auto; white-space: nowrap; }
.msg.news .txt { color: var(--muted); }
.msg.sys .who { color: var(--amber); }
@keyframes slidein { from { opacity: 0; transform: translateX(10px); } }

/* ---------- Overlays ---------- */
#toasts { position: fixed; z-index: 40; left: 50%; top: calc(84px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(420px, calc(100% - 32px)); }
.toast { padding: 10px 16px; border-radius: 12px; background: rgba(10,20,24,.92); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.4); font-size: 13px; animation: toastIn .45s var(--ease); transition: opacity .4s, transform .4s var(--ease); display: flex; gap: 10px; align-items: center; }
.toast b { font-family: var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.toast.good b { color: var(--green); } .toast.bad b { color: var(--red); } .toast.info b { color: var(--amber); }
.toast.out { opacity: 0; transform: translateY(-10px) scale(.96); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.94); } }

#alert { position: fixed; z-index: 20; left: 50%; top: calc(80px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(560px, calc(100% - 32px)); padding: 14px 18px; border-radius: 14px; background: linear-gradient(135deg, rgba(120,14,10,.92), rgba(60,8,6,.92)); border: 1px solid rgba(255,120,100,.5); box-shadow: 0 0 0 1px rgba(255,90,78,.2), 0 20px 50px rgba(120,0,0,.45); animation: alertIn .5s var(--ease); }
#alert .hd { display: flex; align-items: center; gap: 10px; font: 800 20px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; }
#alert .hd .cd { margin-left: auto; font: 700 24px var(--f-mono); }
#alert .bd { margin-top: 6px; font-size: 13px; color: #ffd5cf; }
.blink { width: 10px; height: 10px; border-radius: 50%; background: #ff5a4e; animation: blink .6s infinite alternate; box-shadow: 0 0 12px #ff5a4e; }
@keyframes blink { to { opacity: .2; } }
@keyframes alertIn { from { opacity: 0; transform: translate(-50%, -20px) scale(.96); } }

#battlehud { position: fixed; z-index: 11; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 12px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); display: flex; gap: 20px; animation: toastIn .4s var(--ease); }
#battlehud .stat b { font-size: 17px; }
#viewchip { position: fixed; z-index: 11; left: 16px; top: calc(78px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); animation: toastIn .4s var(--ease); max-width: calc(100% - 32px); }
#viewchip .lbl { margin: 0; }
#viewchip b { font: 700 15px var(--f-display); letter-spacing: .05em; text-transform: uppercase; }

.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(3,8,10,.55); backdrop-filter: blur(4px); opacity: 0; transition: opacity .3s var(--ease); }
.modal.on { opacity: 1; }
.modal .card { width: min(480px, 100%); max-height: calc(100% - 20px); overflow-y: auto; padding: 22px; border-radius: 18px; background: var(--panel-solid); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,.6); transform: translateY(16px) scale(.97); transition: transform .4s var(--ease); }
.modal.on .card { transform: none; }
.modal .acts { display: flex; gap: 8px; margin-top: 18px; }
.modal .acts .btn { flex: 1; }
.big { font: 700 34px/1 var(--f-mono); color: var(--amber); }
.res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.res-grid div { padding: 10px; border-radius: 10px; background: rgba(255,255,255,.04); text-align: center; }
.res-grid b { display: block; font: 700 22px var(--f-mono); }
.res-grid span { font: 600 10px var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---------- Intro ---------- */
#intro { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at 50% 60%, rgba(5,12,16,0) 0%, rgba(5,12,16,.55) 60%, rgba(5,12,16,.9) 100%); transition: opacity .9s var(--ease), visibility .9s; }
#intro.gone { opacity: 0; visibility: hidden; }
.intro-card { width: min(440px, 100%); box-sizing: border-box; text-align: center; padding: 30px 26px 22px; border-radius: 20px; background: rgba(6,14,18,.72); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 30px 80px rgba(0,0,0,.5); animation: rise 1s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } }
.logo { font: 800 clamp(54px, 12vw, 92px)/.85 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: #f4ede0; text-shadow: 0 4px 30px rgba(0,0,0,.5); }
.logo span { color: var(--amber); }
.tagline { margin: 12px auto 26px; color: #b9cbc7; max-width: 34ch; }
.field { text-align: left; margin-bottom: 12px; }
.field input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(8,18,22,.8); color: var(--fg); font: 500 15px var(--f-body); transition: border-color .2s, box-shadow .2s; }
.field input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(242,169,59,.18); }
.intro-acts { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.fine { margin-top: 16px; font-size: 12px; color: var(--muted); }
.range { width: 100%; accent-color: var(--amber); }

/* ---------- Phones ---------- */
@media (max-width: 860px) {
  #hud { gap: 12px; padding-left: 12px; padding-right: 12px; flex-wrap: wrap; row-gap: 6px; }
  .brand b { font-size: 16px; max-width: 130px; }
  .brand small, .xpbar, #hud .eng-stat { display: none; }
  .rank svg { width: 26px; height: 26px; }
  .rank-name { font-size: 12px; }
  .stat b { font-size: 16px; }
  #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 48%; border-radius: 18px 18px 0 0; transform: translateY(105%); padding-bottom: env(safe-area-inset-bottom, 0px); transition: transform .5s var(--ease), height .4s var(--ease); }
  #panel.min { height: 52px; }
  .handle { display: block; width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 8px auto 0; cursor: pointer; border: 0; padding: 0; flex: none; }
  .tabs button { padding: 11px 0 10px; font-size: 11.5px; letter-spacing: .08em; }
  #battlehud { bottom: calc(48% + 10px); left: 12px; gap: 14px; padding: 10px 12px; }
  #viewchip { top: auto; bottom: calc(48% + 70px); left: 12px; }
}
@media (min-width: 861px) {
  #alert, #toasts { left: calc((100% - 400px) / 2); }
  #alert { width: min(560px, calc(100% - 440px)); }
}

/* ---------- v2 additions ---------- */
.mono { font: 500 12px var(--f-mono); color: var(--muted); }
.stepper button.wide { width: auto; padding: 0 8px; font-size: 12px; }
.seg { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; padding: 4px; margin: 10px 0 12px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 8px 0; border-radius: 8px; cursor: pointer; font: 700 11px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); transition: background .25s var(--ease), color .2s; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--amber); color: var(--amber-ink); box-shadow: 0 4px 14px rgba(242,169,59,.25); }
.seg button[data-sec="ultimate"]:not(.on) { color: #ff8a80; }
.seg button[data-sec="ultimate"].on { background: var(--red); color: #fff; box-shadow: 0 4px 14px rgba(255,90,78,.35); }
.confirm { margin-top: 10px; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,90,78,.45); background: rgba(255,90,78,.08); font-size: 13px; animation: slidein .3s var(--ease); }
.confirm .acts { display: flex; gap: 6px; } .confirm .acts .btn { flex: 1; }
.btn.ghost-danger { color: #ff8a80; border-color: rgba(255,90,78,.35); background: transparent; }
.btn.ghost-danger:hover:not(:disabled) { background: rgba(255,90,78,.1); }
.abtns { display: flex; flex-wrap: wrap; gap: 6px; }
.inline { display: flex; gap: 6px; margin-top: 8px; }
.inline input, .inline select, .sel { flex: 1; min-width: 0; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: rgba(8,18,22,.8); color: var(--fg); font: 500 14px var(--f-body); }
.sel { width: 100%; box-sizing: border-box; margin: 4px 0 6px; }
.toggle { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; transition: border-color .2s, background .2s; }
.toggle b { display: block; font: 700 14px/1.2 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.toggle small { display: block; color: var(--muted); font-size: 12px; }
.toggle .sw { flex: none; position: relative; width: 38px; height: 22px; border-radius: 11px; background: rgba(255,255,255,.12); transition: background .25s; }

<body>


<canvas id="cv"></canvas>
<div id="flash"></div>

<header id="hud">

  <button id="btn-ach" class="icon-btn ach-btn" aria-label="Achievements"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"/></svg><span id="ach-n">0</span></button>
  <button id="btn-admin" class="icon-btn" aria-label="Admin console"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg></button>
  <button id="btn-sound" class="icon-btn" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="snd-wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg></button>
  <button id="btn-menu" class="icon-btn" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>

<script>
'use strict';
// Procedural game audio: everything is synthesized with Web Audio, no samples.
const Sound = (() => {
  let ctx = null, master, comp, revSend, noiseBuf, brownBuf, ambGain, sirenNodes = null;
  let muted = false, volume = 0.8;
  const listener = { x: 600, y: 430, span: 700 };
  let activeLoops = 0;
  const MAX_LOOPS = 12;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 5;
    comp.attack.value = 0.002; comp.release.value = 0.3;
    master = ctx.createGain(); master.gain.value = muted ? 0 : volume;
    master.connect(comp); comp.connect(ctx.destination);
    const rev = ctx.createConvolver(); rev.buffer = makeIR(3.4, 2.6);
    revSend = ctx.createGain(); revSend.gain.value = 0.5;
    revSend.connect(rev); rev.connect(master);
    noiseBuf = makeNoise(false); brownBuf = makeNoise(true);
    startAmbient();
  }

  function makeNoise(brown) {
    const len = ctx.sampleRate * 4;
    const b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch); let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
      }
    }
    return b;
  }
  function makeIR(dur, decay) {
    const len = Math.floor(ctx.sampleRate * dur);
    const b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const t = i / len;
        // early reflections from terrain plus a long diffuse tail
        const early = (i < ctx.sampleRate * 0.12 && Math.random() < 0.004) ? (Math.random() * 2 - 1) * 1.5 : 0;
        d[i] = ((Math.random() * 2 - 1) * Math.pow(1 - t, decay) + early) * 0.6;
      }
    }
    return b;
  }

  const now = () => ctx.currentTime;
  function src(buf, t, rate = 1, loop = false) {
    const s = ctx.createBufferSource(); s.buffer = buf; s.loop = loop; s.playbackRate.value = rate;
    s.start(t, Math.random() * (buf.duration - 1));
    return s;
  }
  function filt(type, f, q = 0.7) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
  function gain(v = 1) { const g = ctx.createGain(); g.gain.value = v; return g; }
  function chain(...n) { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; }
  function env(g, t, peak, a, d, curve = 'exp') {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    if (curve === 'exp') g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    else g.gain.linearRampToValueAtTime(0, t + a + d);
  }

  // Position relative to the listener (camera centre). Returns pan and normalized distance.
  function place(x, y) {
    const dx = x - listener.x, dy = y - listener.y;
    const d = Math.hypot(dx, dy) / listener.span;
    return { pan: Math.max(-1, Math.min(1, dx / listener.span)), dist: d };
  }
  // A spatial output bus: gain by distance, air absorption lowpass, stereo pan, reverb send.
  function bus(x, y, base = 1, wet = 0.5) {
    const { pan, dist } = place(x, y);
    const out = gain(base / (1 + dist * dist * 1.6));
    const lp = filt('lowpass', 16000 / (1 + dist * 3.5), 0.5);
    const pn = ctx.createStereoPanner ? ctx.createStereoPanner() : gain(1);
    if (pn.pan) pn.pan.value = pan * 0.8;
    out.connect(lp); lp.connect(pn); pn.connect(master);
    const send = gain(wet * (0.6 + dist)); pn.connect(send); send.connect(revSend);

  function ok() { return ctx && ctx.state === 'running'; }

  // ---------- Explosions ----------
  const recentBooms = [];
  function explosion(x, y, size = 1, air = false) {
    if (!ok()) return;
    // a salvo can trigger dozens of blasts at once; past a handful they just blur together and cost CPU
    const tn = now();
    while (recentBooms.length && tn - recentBooms[0] > 0.35) recentBooms.shift();
    if (recentBooms.length >= (size > 1.5 ? 7 : 5)) return;
    recentBooms.push(tn);
    const b = bus(x, y, 1.0 * Math.sqrt(size), air ? 0.9 : 0.7);
    const t = now() + Math.min(b.dist * 0.18, 0.5) + 0.01; // sound arrives a bit after the flash
    const s = Math.min(size, 3);
    // 1. supersonic crack
    const crack = src(noiseBuf, t, 1.2); const cg = gain(0);
    chain(crack, filt('highpass', air ? 1800 : 1100), cg, b.input);
    env(cg, t, 1.6, 0.001, 0.09); crack.stop(t + 0.2);
    // 2. body: broadband blast with a lowpass that closes down
    const body = src(brownBuf, t, 1); const bf = filt('lowpass', 3200, 0.9); const bg = gain(0);
    chain(body, bf, bg, b.input);
    bf.frequency.setValueAtTime(4200, t); bf.frequency.exponentialRampToValueAtTime(180, t + 1.4 * Math.sqrt(s));
    env(bg, t, 2.2 * s, 0.006, 1.8 + s * 0.6); body.stop(t + 4);
    // 3. sub-bass pressure wave
    const sub = ctx.createOscillator(); sub.type = 'sine'; const sg = gain(0);
    chain(sub, sg, b.input);
    sub.frequency.setValueAtTime(air ? 120 : 95, t); sub.frequency.exponentialRampToValueAtTime(26, t + 0.9);
    env(sg, t, (air ? 1.0 : 2.4) * Math.sqrt(s), 0.004, 1.3); sub.start(t); sub.stop(t + 1.6);
    // 4. rolling rumble tail
    const rum = src(brownBuf, t, 0.6); const rg = gain(0);
    chain(rum, filt('lowpass', 160, 1.2), rg, b.input);
    rg.gain.setValueAtTime(0.0001, t); rg.gain.linearRampToValueAtTime(1.1 * s, t + 0.12);
    rg.gain.exponentialRampToValueAtTime(0.0001, t + 3.5 + s); rum.stop(t + 5.5);
    // 5. debris crackle and falling material
    const n = air ? 4 : 9;
    for (let i = 0; i < n; i++) {
      const tt = t + 0.15 + Math.random() * (air ? 1.2 : 2.2);
      const c = src(noiseBuf, tt, 1); const g2 = gain(0);
      chain(c, filt('bandpass', 1500 + Math.random() * 4000, 3), g2, b.input);
      env(g2, tt, 0.12 + Math.random() * 0.25, 0.001, 0.02 + Math.random() * 0.05); c.stop(tt + 0.12);
    }
  }

  // ---------- One-shots ----------

    bp.frequency.setValueAtTime(350, t); bp.frequency.exponentialRampToValueAtTime(2600, t + 0.35);

  function gun(x, y, dur = 0.5) { // rotary cannon burst

  function cannonRun(x, y, dur) {
    // attack jet nose cannon: a very high rate of fire blurs into one tearing "brrrt",

    const b = bus(x, y, 1.1, 0.8); const t = now();

  function titan(x, y) { // the Titan Bomb: a stack of very long, very low layers

    const crack = src(noiseBuf, t, 1); const cg = gain(0); chain(crack, filt('highpass', 800), cg, out);

    const rum = src(brownBuf, t, 0.45, true); const rg = gain(0); chain(rum, filt('lowpass', 120, 1.4), rg, out);

  // ---------- Continuous engine loops (with doppler) ----------
  function loop(kind) {
    const dummy = { update() {}, stop() {} };
    if (!ok() || activeLoops >= MAX_LOOPS) return dummy;
    activeLoops++;
    const t = now();
    const out = gain(0); const pn = ctx.createStereoPanner ? ctx.createStereoPanner() : gain(1);
    const air = filt('lowpass', 12000, 0.4);
    out.connect(air); air.connect(pn); pn.connect(master);
    const send = gain(0.25); pn.connect(send); send.connect(revSend);
    const nodes = []; let freqNodes = [], rateNodes = [], baseF = [], base = 0.5, sweep = null;

    if (kind === 'drone') {
      // two-stroke engine: detuned saws, chopped by a piston-rate amplitude modulator
      const am = gain(0.6);
      [[118, 'sawtooth', 0.35], [119.6, 'sawtooth', 0.3], [59, 'square', 0.18], [236, 'sawtooth', 0.08]].forEach(([f, ty, v]) => {
        const o = ctx.createOscillator(); o.type = ty; o.frequency.value = f; const g = gain(v);
        o.connect(g); g.connect(am); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(f);
      });
      const lfo = ctx.createOscillator(); lfo.frequency.value = 31; const lg = gain(0.4);
      lfo.connect(lg); lg.connect(am.gain); lfo.start(t); nodes.push(lfo);
      const lp = filt('lowpass', 1600, 1.4); am.connect(lp); lp.connect(out);
      base = 0.32;
    } else if (kind === 'heli') {
      // twin rotors: low noise chopped at blade-pass rate, plus turbine whine
      const n = src(brownBuf, t, 1, true); const lp = filt('lowpass', 700, 0.8); const chop = gain(0.4);
      chain(n, lp, chop, out); nodes.push(n); rateNodes.push(n.playbackRate);
      const lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 11; const lg = gain(0.38);
      lfo.connect(lg); lg.connect(chop.gain); lfo.start(t); nodes.push(lfo);
      const lfo2 = ctx.createOscillator(); lfo2.type = 'square'; lfo2.frequency.value = 11.7; const lg2 = gain(0.22);
      lfo2.connect(lg2); lg2.connect(chop.gain); lfo2.start(t); nodes.push(lfo2);
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = 1500; const og = gain(0.03);
      chain(o, og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(1500);
      base = 0.6;
    } else if (kind === 'bomber') {
      const r = src(brownBuf, t, 0.7, true); const rg = gain(1.2); chain(r, filt('lowpass', 260), rg, out); nodes.push(r); rateNodes.push(r.playbackRate);
      const n = src(noiseBuf, t, 1, true); const ng = gain(0.25); chain(n, filt('bandpass', 700, 0.5), ng, out); nodes.push(n);
      base = 0.7;
    } else if (kind === 'fighter' || kind === 'striker') {
      // turbofan: deep roar, broadband jet noise, a pair of turbine whines, low rumble; doppler on all
      const r = src(brownBuf, t, 1, true); const rg = gain(1.1); chain(r, filt('lowpass', kind === 'striker' ? 600 : 800, 0.5), rg, out); nodes.push(r); rateNodes.push(r.playbackRate);
      const n = src(noiseBuf, t, 1, true); const ng = gain(0.45); chain(n, filt('bandpass', 1700, 0.45), ng, out); nodes.push(n); rateNodes.push(n.playbackRate);
      [[3150, 0.025], [4300, 0.016]].forEach(([f, v]) => { const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f; const og = gain(v); chain(o, og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(f); });
      const lo = ctx.createOscillator(); lo.type = 'sawtooth'; lo.frequency.value = 52; const lg = gain(0.12); chain(lo, filt('lowpass', 180), lg, out); lo.start(t); nodes.push(lo); freqNodes.push(lo.frequency); baseF.push(52);
      base = 0.85;
    } else if (kind === 'sub') {
      const o = ctx.createOscillator(); o.frequency.value = 58; const og = gain(0.25); chain(o, og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(58);
      const r = src(brownBuf, t, 0.6, true); const rg = gain(0.5); chain(r, filt('lowpass', 140), rg, out); nodes.push(r);
      base = 0.16;
    } else if (kind === 'carrier') {
      const r = src(brownBuf, t, 0.5, true); const rg = gain(1.1); chain(r, filt('lowpass', 150, 0.8), rg, out); nodes.push(r);
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 36; const og = gain(0.14); chain(o, filt('lowpass', 110), og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(36);
      base = 0.42;
    } else if (kind === 'bomb') {
      activeLoops--; return dummy;
    } else if (kind === 'cruise' || kind === 'hyper' || kind === 'jet') {
      // turbojet: hiss + whine + low roar
      const n = src(noiseBuf, t, 1, true); const bp = filt('bandpass', kind === 'hyper' ? 2200 : 1300, 0.6); const g = gain(0.7);
      chain(n, bp, g, out); nodes.push(n); rateNodes.push(n.playbackRate);
      const r = src(brownBuf, t, 1, true); const rg = gain(0.9); chain(r, filt('lowpass', 420), rg, out); nodes.push(r); rateNodes.push(r.playbackRate);
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = kind === 'hyper' ? 2900 : 1850;
      const og = gain(0.05); chain(o, og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(o.frequency.value);
      base = kind === 'hyper' ? 0.55 : 0.45;
    } else if (kind === 'ballistic') {
      // re-entry scream: narrow band noise that falls in pitch as it descends
      const n = src(noiseBuf, t, 1, true); const bp = filt('bandpass', 3000, 9); const g = gain(1.6);
      chain(n, bp, g, out); nodes.push(n); sweep = bp.frequency;
      const r = src(brownBuf, t, 1, true); const rg = gain(0.8); chain(r, filt('lowpass', 300), rg, out); nodes.push(r);
      base = 0.0;
    } else if (kind === 'gunboat') {
      const r = src(brownBuf, t, 1, true); const rg = gain(1); chain(r, filt('lowpass', 260), rg, out); nodes.push(r);
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 46; const og = gain(0.12);
      chain(o, filt('lowpass', 300), og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(46);
      base = 0.4;
    }
    let lastD = null, stopped = false;
    return {
      update(x, y, vx, vy, progress = 0) {
        if (stopped) return;
        const p = place(x, y); const tt = now();
        const g = base === 0 ? (0.05 + progress * progress * 0.9) : base;
        out.gain.setTargetAtTime(g / (1 + p.dist * p.dist * 2.2), tt, 0.08);
        air.frequency.setTargetAtTime(14000 / (1 + p.dist * 3), tt, 0.1);
        if (pn.pan) pn.pan.setTargetAtTime(p.pan * 0.85, tt, 0.08);
        // doppler from the radial velocity toward the listener
        const dx = x - listener.x, dy = y - listener.y, d = Math.hypot(dx, dy) || 1;
        const vr = -(dx * vx + dy * vy) / d;
        const dop = Math.max(0.6, Math.min(1.6, 1 / (1 - vr / 1100)));
        freqNodes.forEach((f, i) => f.setTargetAtTime(baseF[i] * dop * (kind === 'drone' ? 1 + Math.sin(tt * 1.3) * 0.015 : 1), tt, 0.08));
        rateNodes.forEach(r => r.setTargetAtTime(dop, tt, 0.08));
        if (sweep) sweep.setTargetAtTime(3400 - progress * 2600, tt, 0.06);
      },
      stop() {
        if (stopped) return; stopped = true; activeLoops--;
        const tt = now(); out.gain.setTargetAtTime(0, tt, 0.05);
        nodes.forEach(n => { try { n.stop(tt + 0.4); } catch (e) {} });
        setTimeout(() => { try { out.disconnect(); pn.disconnect(); } catch (e) {} }, 800);
      }
    };
  }

  // ---------- UI and alerts ----------
  function tone(f, t, d, type = 'sine', v = 0.2, dest = master) {

  function siren(on) {

// ================= Insignia =================
function insignia(r, size = 34) {
  const c = '#f2a93b', s = [];
  if (r === 0) s.push(`<circle cx="20" cy="20" r="9" fill="none" stroke="${c}" stroke-width="2.5"/>`);
  else if (r <= 3) for (let i = 0; i < r; i++) s.push(`<path d="M8 ${14 + i * 7} L20 ${8 + i * 7} L32 ${14 + i * 7}" fill="none" stroke="${c}" stroke-width="3.2" stroke-linejoin="round"/>`);
  else if (r <= 5) for (let i = 0; i < r - 3; i++) s.push(`<rect x="${(r === 4 ? 16 : 11) + i * 10}" y="9" width="7" height="22" rx="1" fill="${c}"/>`);
  else if (r === 6) s.push(`<path d="M20 6 L30 20 L20 34 L10 20Z" fill="${c}"/>`);
  else if (r === 7) s.push(`<path d="M6 16 Q20 8 34 16 L28 20 L34 26 Q20 20 6 26 L12 20Z" fill="${c}"/><circle cx="20" cy="18" r="3" fill="#1d1406"/>`);
  else { const n = r === 8 ? 1 : 3; for (let i = 0; i < n; i++) { const cx = n === 1 ? 20 : 8 + i * 12, R = n === 1 ? 11 : 6; s.push(`<path d="${star(cx, 20, R)}" fill="${c}"/>`); } }
  return `<svg viewBox="0 0 40 40" width="${size}" height="${size}" aria-label="${RANKS[r].n}">${s.join('')}</svg>`;
}
function star(cx, cy, R) { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * 0.42 : R; d += (i ? 'L' : 'M') + (cx + Math.cos(a) * r).toFixed(1) + ' ' + (cy + Math.sin(a) * r).toFixed(1); } return d + 'Z'; }

}
function resetPointers() { pointers.clear(); drag = null; pinch = null; cv.style.cursor = 'default'; }
cv.addEventListener('lostpointercapture', e => { if (pointers.has(e.pointerId)) endPointer(e); });
addEventListener('blur', resetPointers);
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e => {
  if (ui.intro) return;
  e.preventDefault();
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  const nz = clamp(cam.uz * Math.exp(-e.deltaY * 0.0015), 0.6, 6);
  // zoom toward the cursor
  const k = 1 - cam.uz / nz; cam.px += (wx - cam.px) * k; cam.py += (wy - cam.py) * k; cam.uz = nz;
}, { passive: false });

// ================= Main loop =================
let last = performance.now(), uiAcc = 0, saveAcc = 0;
function frame(now) {
  const ms = now - last;
  const dt = Math.min(0.05, ms / 1000); last = now;
  qualityTick(ms);
  try {
    if (S && !ui.intro) tick(dt);
    FX.update(dt);
    draw(now / 1000, dt);
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function tick(dt) {
  if (S.over) return;
  S.time += dt;
  if (!((ui.incAge -= dt) > 0)) { S._inc = myIslands().reduce((a, base) => a + income(base), 0) + cityStats().inc; ui.incAge = 0.25; }
  S.cash += S._inc * dt;
  sysTick(dt);
  featTick(dt);
  // every island's construction shares the same engineers: the oldest orders go first
  const builds = [];
  for (const base of myIslands()) for (const b of base.plots) if (b && b.build) builds.push(b);
  builds.sort((a, c) => (a.build.q || 0) - (c.build.q || 0));
  const speed = 1 + 0.08 * Math.max(0, S.eng - builds.length);
  builds.forEach((b, k) => {
    b.build.wait = !free() && k >= S.eng;
    if (b.build.wait) return;
    b.build.t += dt * speed;
    if (b.build.t >= b.build.total) {
      const kind = b.build.kind; b.build = null;
      b.lv += 1; b.hp = bHp(b.type, b.lv); S.stats.built = (S.stats.built || 0) + 1;
      Sound.ui('build');
      if (!free()) toast('good', kind === 'build' ? 'Construction complete' : 'Upgrade complete', `${B[b.type].n} level ${b.lv}`);
      addXp(bCost(b.type, b.lv) / 30 + 5);
      refreshPanel(true);
    }
  });
  S.bots.forEach(b => botTick(b, dt));
  if (S.incoming) {
    const left = S.incoming.eta - S.time;
    if (left <= 0 && !view.battle) startDefense();
    else updateAlert(left);
  } else if (!ui.titanAlert && !$('#alert').hidden) $('#alert').hidden = true;
  if (view.battle) { view.battle.update(dt); updateBattleHud(); }
  const isl = curIsland(), st = curState();
  if (isl && st) emitDamage(isl, st, dt);
  uiAcc += dt;
  if (uiAcc > 0.5) { uiAcc = 0; renderPanel(); }
  saveAcc += dt;
  if (saveAcc > 5) { saveAcc = 0; save(); }
  updateHud(dt);
}
function updateAlert(left) {
  const el = $('#alert'), inc = S.incoming, b = botById(inc.bot), rl = radarLv(S);
  const counts = {}; inc.wave.forEach(w => counts[w] = (counts[w] || 0) + 1);
  const comp = rl >= 2 ? Object.entries(counts).map(([k, n]) => `${n} \u00d7 ${W[k].n}`).join(', ') : rl === 1 ? `${inc.wave.length} contacts` : 'Unknown contacts';
  const wait = view.battle ? ' Arrives after your current battle.' : '';
  const html = `<div class="hd"><span class="blink"></span>Incoming attack<span class="cd">${Math.max(0, Math.ceil(left))}</span></div><div class="bd">${rl ? `Radar tracks launches from <b>${esc(b.island)}</b> (${esc(b.name)}). ${comp}.` : 'Visual contact only. Build a radar for earlier warning.'}${wait}</div>`;
  if (el.innerHTML !== html) el.innerHTML = html;
  el.hidden = false;
}
const curState = () => view.mode === 'home' ? activeBase() : view.mode === 'map' ? null : botById(view.botId);
const curIsland = () => { const st = S && curState(); return st ? islOf(st) : null; };
function updateHud(dt) {
  const shown = ui.cashShown + (S.cash - ui.cashShown) * Math.min(1, dt * 8);
  ui.cashShown = Math.abs(S.cash - shown) < 1 ? S.cash : shown;
  $('#hud-cash').textContent = fmt(ui.cashShown);
  $('#hud-inc').textContent = `+${fmt((S._inc || 0) + tradeIncome())}/s`;
  $('#hud-eng').textContent = `${Math.max(0, S.eng - totalBuilds())} free / ${S.eng}`;
  const r = rankIdx(S);
  if (ui.lastRank !== r) { $('#rank-ins').innerHTML = insignia(r); $('#rank-name').textContent = RANKS[r].n; ui.lastRank = r; }
  const nx = RANKS[r + 1]; $('#xp-fill').style.width = nx ? ((S.xp - RANKS[r].xp) / (nx.xp - RANKS[r].xp) * 100).toFixed(1) + '%' : '100%';
  const sh = Math.max(S.shieldUntil, S.newcomerUntil) - S.time;
  const chip = $('#shield-chip');
  if (S.admin.god) { chip.hidden = false; chip.textContent = 'Admin shield'; }
  else if (sh > 0) { chip.hidden = false; chip.textContent = `${S.newcomerUntil > S.time && S.newcomerUntil >= S.shieldUntil ? 'Newcomer shield' : 'Shield'} ${fmtT(sh)}`; }
  else chip.hidden = true;
  $('#btn-admin').classList.toggle('lit', !!S.admin.unlocked);
  const nf = nightFactor(), ct = `Day ${dayNumber()} \u00b7 ${clockText()}`;
  if (ui.clockTxt !== ct) { ui.clockTxt = ct; $('#clock-t').textContent = ct; $('#clock').classList.toggle('night', nf > 0.5); }
  const rc = S.research.cur;
  if (rc) { document.querySelectorAll('[data-resprog]').forEach(el => el.style.width = (rc.t / rc.total * 100).toFixed(1) + '%'); document.querySelectorAll('[data-restimer]').forEach(el => el.textContent = fmtT(rc.total - rc.t) + ' left'); }
  const achN = Object.keys(S.ach.got).length; if (ui.achN !== achN) { ui.achN = achN; $('#ach-n').textContent = achN; }
  if (ui.pfKey !== S.portrait) { ui.pfKey = S.portrait; $('#btn-profile').innerHTML = portraitSVG(S.portrait, 34); }
  const spd = 1 + 0.08 * Math.max(0, S.eng - totalBuilds()), AB = activeBase();
  document.querySelectorAll('[data-prog]').forEach(el => { const b = AB.plots[+el.dataset.prog]; if (b && b.build) el.style.width = (b.build.t / b.build.total * 100).toFixed(1) + '%'; });
  document.querySelectorAll('[data-timer]').forEach(el => { const b = AB.plots[+el.dataset.timer]; if (b && b.build) el.textContent = b.build.wait ? 'Waiting for an engineer' : fmtT((b.build.total - b.build.t) / spd) + ' left'; });
  if (sh > 0) document.querySelectorAll('[data-shield]').forEach(el => el.textContent = fmtT(sh));
  document.querySelectorAll('[data-bshield]').forEach(el => { const b = botById(+el.dataset.bshield); if (b) el.textContent = fmtT(b.shieldUntil - S.time); });
}
let introSeed = (Math.random() * 1e9) | 0;
function drawMapFrame(t, W_, H_) {
  const vp = viewport();
  const L = mapLayout(), fit = Math.min(vp.w / (L.bx * 2), vp.h / (L.by * 2));
  cam.s = fit * cam.uz;
  cam.px = clamp(cam.px, -L.bx, L.bx); cam.py = clamp(cam.py, -L.by, L.by);
  cam.ox = vp.x + vp.w / 2 - cam.px * cam.s; cam.oy = vp.y + vp.h / 2 - cam.py * cam.s;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#0b2430'; g.fillRect(0, 0, W_, H_);
  g.setTransform(cam.s * dpr, 0, 0, cam.s * dpr, cam.ox * dpr, cam.oy * dpr);
  const [x0, y0] = toWorld(0, 0), [x1, y1] = toWorld(W_, H_);
  drawWorldMap(g, t, cam.s, { x0, y0, x1, y1 });
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (vignette) g.drawImage(vignette, 0, 0, W_, H_);
}
function draw(t, dt) {
  const W_ = innerWidth, H_ = innerHeight;
  if (ui.intro) cam.z = 1.25 + Math.sin(t * 0.1) * 0.03; else cam.z += (1 - cam.z) * Math.min(1, dt * 1.6);
  let isl, st, flag;
  if (S && !ui.intro && view.mode === 'map') return drawMapFrame(t, W_, H_);
  if (!S || ui.intro) { isl = makeIsland(S ? S.seed : introSeed, 0); st = S && !ui.intro ? S : { plots: [] }; flag = '#f2a93b'; }
  else { st = curState(); isl = islOf(st); flag = isMine(st) ? S.flagD : st.color; }
  const cityG = S && !ui.intro && st === S && S.cityOn ? cityGeo(isl) : null;
  computeCam(isl, cityG);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!seaGrad) { seaGrad = g.createLinearGradient(0, 0, 0, H_); seaGrad.addColorStop(0, '#0d2c3a'); seaGrad.addColorStop(1, '#0a3442'); }
  g.fillStyle = seaGrad; g.fillRect(0, 0, W_, H_);
  const sk = Math.min(FX.shake, 60), sx = (Math.random() - 0.5) * sk, sy = (Math.random() - 0.5) * sk;
  g.setTransform(cam.s * dpr, 0, 0, cam.s * dpr, (cam.ox + sx) * dpr, (cam.oy + sy) * dpr);
  const [x0, y0] = toWorld(0, 0), [x1, y1] = toWorld(W_, H_);
  renderScene(g, { isl, st, battle: view.battle, flag, selected: view.mode === 'home' ? view.selected : null, hover: view.mode === 'home' ? view.hover : null, vr: { x0, y0, x1, y1 }, scale: cam.s, quality: Q.level, night: S && !ui.intro ? nightFactor() : 0, dusk: S && !ui.intro ? duskFactor() : 0, city: cityG, skin: S && !ui.intro && isMine(st) ? S.skin : null, multi: ui.multi && view.mode === 'home' ? ui.multi : null }, t);
  const vp = viewport(), [lx, ly] = toWorld(vp.x + vp.w / 2, vp.y + vp.h / 2);
  Sound.listener.x = lx; Sound.listener.y = ly; Sound.listener.span = 700 / cam.uz;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (FX.light > 0.01) { g.globalCompositeOperation = 'lighter'; g.fillStyle = `rgba(255,170,90,${FX.light * 0.28})`; g.fillRect(0, 0, W_, H_); g.globalCompositeOperation = 'source-over'; }
  if (vignette) g.drawImage(vignette, 0, 0, W_, H_);
}

// ================= Save / load =================
function save() {
  if (!S) return;
  S.savedAt = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function load() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function sanitize(s) {
  s.incoming = null;
  s.admin = Object.assign({ unlocked: false, free: false, god: false, unlock: false }, s.admin || {});
  s.stats = Object.assign({ strikes: 0, destroyed: 0, defended: 0, lost: 0, titans: 0 }, s.stats || {});
  s.expansions = s.expansions || 0;
  const fix = base => {
    base.plots = (base.plots || []).map(p => p && p.type && B[p.type] ? p : null);
    Object.keys(base.arsenal || {}).forEach(k => { if (!W[k] || !(base.arsenal[k] > 0)) delete base.arsenal[k]; });
    base.size = Math.max(base.size || 0, rankIdx(base));
    if (base === s) base.size = Math.max(base.size, rankIdx(base) + s.expansions);
    base.size = clamp(base.size, 0, MAX_SIZE);
    ensurePlots(base);
    // older saves had a 1-plot power plant: give it its 4-plot grounds when the neighbours are free
    base.plots.forEach((p, i) => {
      if (!p || p.type !== 'reactor' || p.site) return;
      const s = wideSite(i, base.plots.length, 4);
      if (s && s.slice(1).every(k => !base.plots[k])) { p.site = s; s.slice(1).forEach(k => base.plots[k] = { type: 'annex', of: i, lv: 1, hp: 1, build: null }); }
    });
  };
  fix(s); s.bots.forEach(fix);
  initSystems(s);
  defaultsCustom(s);
  s.colonies.forEach(c => { c.plots = (c.plots || []).map(p => p && p.type && B[p.type] ? p : null); c.eng = 0; c.arsenal = c.arsenal || {}; });
  if ((s.v || 0) < 4) {
    // ranks now take 2.5x longer: scale everyone's experience so nobody loses their rank
    s.xp = Math.round(s.xp * 2.5); s.bots.forEach(b => { b.xp = Math.round(b.xp * 2.5); });
    s.nextBotId = Math.max(BOT_TARGET, ...s.bots.map(b => b.id + 1));
  }
  s.nextBotId = Math.max(s.nextBotId || 0, BOT_TARGET, ...s.bots.map(b => b.id + 1));
  while (s.bots.length < BOT_TARGET) { const id = s.nextBotId++; s.bots.push(makeBot(rosterEntry(id), id)); }
  s.bots.forEach(b => { b.theme = b.theme || themeFor(b.seed); b.stats = b.stats || { strikes: 0, defended: 0 }; });
  s.v = 4;
  return s;
}
function offlineCatchUp() {
  const away = clamp((Date.now() - (S.savedAt || Date.now())) / 1000, 0, 7200);
  if (away < 30) return;
  const earned = income(S) * away * 0.5;
  S.cash += earned;
  myIslands().forEach(base => base.plots.forEach(b => { if (b && b.build) b.build.t += away; }));
  S.bots.forEach(b => { b.cash += income(b) * away * 0.5; for (let k = 0; k < Math.min(30, away / 40); k++) botAct(b); growCheck(b); });
  setTimeout(() => toast('good', 'Welcome back', `Your island earned ${fmt(earned)} while you were away`), 1200);
}
addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);

// ================= Boot =================
function enterGame(fresh) {
  Sound.init();
  ui.intro = false; cam.z = 1.6; resetCam();
  $('#intro').classList.add('gone');
  $('#hud').classList.add('show'); $('#panel').classList.add('show'); $('#zoomctl').hidden = false;
  $('#hud-island').textContent = S.name; $('#hud-cmdr').textContent = S.cmdr; decorateTabs(); updateIslandSwitch();
  ui.cashShown = S.cash; ui.lastRank = -1;
  setTimeout(placeInk, 50);
  setTab('base');
  if (fresh) {
    setTimeout(() => { Sound.ui('build'); toast('good', 'Island claimed', `${S.name} is yours, ${S.cmdr}`); }, 700);
    setTimeout(() => log('sys', 'Command', 'Newcomer shield active for 5 minutes. Build your economy and a radar before it drops.'), 1800);
    setTimeout(() => log('chat', 'Saltwolf', 'New flag on the map. Welcome to the neighborhood.', '#c9603a'), 9000);
  } else offlineCatchUp();
}
function start(data) {
  applyQuality();
  const saved = (data && data.S) || load();
  if (saved && saved.v >= 1 && !saved.over) { $('#btn-continue').hidden = false; $('#btn-claim').textContent = 'Start a new island'; $('#btn-claim').classList.remove('primary'); $('#btn-continue').classList.add('primary'); }
  $('#btn-continue').addEventListener('click', () => { S = sanitize(saved); enterGame(false); });
  $('#btn-claim').addEventListener('click', () => {
    const cmdr = $('#in-cmdr').value.trim() || 'Cmdr. Reyes', isl = $('#in-isl').value.trim() || 'Basalt Key';
    S = newGame(cmdr, isl, introSeed); enterGame(true); save();
  });
  if (data && data.S && data.view) { S = sanitize(data.S); enterGame(false); }
  try { window.claude?.hot?.snapshot?.(() => (S && !ui.intro ? { S: JSON.parse(JSON.stringify(S)), view: true } : {})); } catch (e) {}
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
