<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iron Atoll</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed island canvas, a command HUD across the top, a glass operations panel docked right (bottom sheet on phones). */
:root {
  --sea: #0a1a22;
  --panel: rgba(12, 24, 30, 0.86);
  --panel-solid: #0f1f26;
  --raise: rgba(255, 255, 255, 0.04);
  --line: rgba(140, 190, 190, 0.16);
  --fg: #dce8e4;
  --muted: #8aa29f;
  --amber: #f2a93b;
  --amber-ink: #1d1406;
  --cyan: #5fd4c4;
  --red: #ff5a4e;
  --green: #7bd88f;
  --f-display: "Saira Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--sea); color: var(--fg); font: 14px/1.45 var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#fade { position: fixed; inset: 0; background: #050c10; opacity: 0; pointer-events: none; transition: opacity .45s var(--ease); z-index: 30; }
#fade.on { opacity: 1; }
#flash { position: fixed; inset: 0; pointer-events: none; z-index: 5; box-shadow: inset 0 0 0 0 rgba(255,90,78,0); transition: box-shadow .6s; }
#flash.on { box-shadow: inset 0 0 160px 20px rgba(255,60,50,.35); animation: alarm 1.2s infinite; }
@keyframes alarm { 50% { box-shadow: inset 0 0 90px 0 rgba(255,60,50,.12); } }

/* ---------- HUD ---------- */
#hud { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 22px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: linear-gradient(180deg, rgba(6,14,18,.9), rgba(6,14,18,.55) 70%, rgba(6,14,18,0)); transform: translateY(-110%); transition: transform .7s var(--ease); }
#hud.show { transform: none; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font: 700 20px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.brand small { color: var(--muted); font-size: 12px; }
.stat { display: flex; flex-direction: column; }
.stat label, .lbl { font: 600 10.5px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.stat b { font: 700 19px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat small { font: 500 11.5px var(--f-mono); color: var(--green); }
.cash b { color: var(--amber); transition: transform .2s; display: inline-block; }
.cash b.bump { transform: scale(1.08); }
.rank { display: flex; align-items: center; gap: 10px; }
.rank svg { width: 34px; height: 34px; }
.xpbar { width: 120px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 4px; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--amber), #ffd27a); transition: width .6s var(--ease); }
.rank-name { font: 700 15px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.spacer { flex: 1; }
.chip { font: 600 11px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; padding: 6px 10px; border-radius: 99px; border: 1px solid rgba(95,212,196,.4); color: var(--cyan); background: rgba(95,212,196,.08); white-space: nowrap; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); display: grid; place-items: center; cursor: pointer; transition: background .2s, transform .2s; }
.icon-btn:hover { background: rgba(255,255,255,.09); transform: translateY(-1px); }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }

/* ---------- Panel ---------- */
#panel { position: fixed; z-index: 9; top: calc(76px + env(safe-area-inset-top, 0px)); right: 14px; bottom: 14px; width: 370px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); box-shadow: 0 20px 60px rgba(0,0,0,.45); transform: translateX(calc(100% + 30px)); transition: transform .7s var(--ease) .1s; overflow: hidden; }
#panel.show { transform: none; }
.tabs { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--line); flex: none; }
.tabs button { position: relative; background: none; border: 0; padding: 13px 0 11px; cursor: pointer; font: 600 12.5px/1 var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); transition: color .2s; }
.tabs button:hover, .tabs button.on { color: var(--fg); }
.tabs button .badge { position: absolute; top: 6px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font: 700 10px/16px var(--f-mono); letter-spacing: 0; }
.tabs .ink { position: absolute; bottom: -1px; height: 2px; background: var(--amber); transition: left .35s var(--ease), width .35s var(--ease); }
.tabwrap { position: relative; flex: 1; min-height: 0; }
.tab { position: absolute; inset: 0; overflow-y: auto; padding: 16px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .3s var(--ease), transform .3s var(--ease); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
.tab.on { opacity: 1; transform: none; pointer-events: auto; }
.handle { display: none; }

h2 { font: 700 22px/1.05 var(--f-display); letter-spacing: .03em; text-transform: uppercase; margin: 0 0 4px; text-wrap: balance; }
h3 { font: 700 13px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 18px 0 10px; }
p.sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.opt { position: relative; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; transition: transform .2s var(--ease), border-color .2s, background .2s; min-width: 0; }
.opt:hover:not(:disabled) { transform: translateY(-2px); border-color: rgba(242,169,59,.5); background: rgba(242,169,59,.06); }
.opt:disabled { cursor: not-allowed; opacity: .45; }
.opt .t { font: 700 15px/1.1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; }
.opt .d { font-size: 12px; color: var(--muted); line-height: 1.35; }
.opt .m { display: flex; justify-content: space-between; gap: 6px; font: 500 12px var(--f-mono); }
.opt .m .c { color: var(--amber); }
.opt .lock { font: 600 10.5px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--red); }
.cat { font: 600 10px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; align-self: flex-start; }
.cat.eco { color: #9fe0a6; background: rgba(123,216,143,.12); }
.cat.def { color: var(--cyan); background: rgba(95,212,196,.12); }
.cat.mil { color: #ffb36b; background: rgba(242,169,59,.12); }
.cat.core { color: #fff; background: rgba(255,255,255,.1); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; font: 700 14px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; transition: transform .18s var(--ease), background .2s, box-shadow .2s, opacity .2s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); background: rgba(255,255,255,.08); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.98); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--amber); color: var(--amber-ink); border-color: transparent; box-shadow: 0 6px 20px rgba(242,169,59,.25); }
.btn.primary:hover:not(:disabled) { background: #ffbb55; box-shadow: 0 8px 28px rgba(242,169,59,.35); }
.btn.danger { background: var(--red); color: #fff; border-color: transparent; box-shadow: 0 6px 20px rgba(255,90,78,.3); }
.btn.danger:hover:not(:disabled) { background: #ff7065; }
.btn.small { padding: 8px 11px; font-size: 12px; }
.btn.block { width: 100%; }
.btn .c { font-family: var(--f-mono); font-weight: 700; letter-spacing: 0; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.kv { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; font-size: 13px; margin: 12px 0; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv span:nth-child(even) { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--amber); transition: width .25s linear; }
.bar.hp i { background: var(--green); }
.note { font-size: 12px; color: var(--muted); padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.03); border: 1px dashed var(--line); }
.warn { color: var(--red); }

.row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); transition: background .2s, border-color .2s; }
.row:hover { background: rgba(255,255,255,.06); }
.row .grow { flex: 1; min-width: 0; }
.row .nm { font: 700 15px/1.1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: 12px; color: var(--muted); }
.swatch { width: 10px; height: 34px; border-radius: 3px; flex: none; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.tag { display: inline-block; font: 600 10px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; background: rgba(255,255,255,.07); color: var(--muted); margin: 4px 4px 0 0; }
.tag.hot { background: rgba(255,90,78,.15); color: #ff8a80; }
.tag.cool { background: rgba(95,212,196,.12); color: var(--cyan); }
.tag.amber { background: rgba(242,169,59,.14); color: var(--amber); }

.target { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); transition: transform .2s var(--ease), border-color .2s; }
.target:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.22); }
.target .top { display: flex; gap: 10px; align-items: center; }
.target .acts { display: flex; gap: 6px; }
.target .acts .btn { flex: 1; }

.wrow { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); }
.wrow .t { font: 700 15px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.wrow .d { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.05); cursor: pointer; font: 700 16px/1 var(--f-mono); transition: background .15s; }
.stepper button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }
.stepper b { min-width: 28px; text-align: center; font: 700 15px var(--f-mono); }

.msg { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); animation: slidein .4s var(--ease); }
.msg .who { font: 700 13px/1.2 var(--f-display); letter-spacing: .05em; text-transform: uppercase; }
.msg .txt { font-size: 13px; }
.msg .when { font: 500 11px var(--f-mono); color: var(--muted); margin-left: auto; white-space: nowrap; }
.msg.news .txt { color: var(--muted); }
.msg.sys .who { color: var(--amber); }
@keyframes slidein { from { opacity: 0; transform: translateX(10px); } }

/* ---------- Overlays ---------- */
#toasts { position: fixed; z-index: 40; left: 50%; top: calc(84px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(420px, calc(100% - 32px)); }
.toast { padding: 10px 16px; border-radius: 12px; background: rgba(10,20,24,.92); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.4); font-size: 13px; animation: toastIn .45s var(--ease); transition: opacity .4s, transform .4s var(--ease); display: flex; gap: 10px; align-items: center; }
.toast b { font-family: var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.toast.good b { color: var(--green); } .toast.bad b { color: var(--red); } .toast.info b { color: var(--amber); }
.toast.out { opacity: 0; transform: translateY(-10px) scale(.96); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.94); } }

#alert { position: fixed; z-index: 20; left: 50%; top: calc(80px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(560px, calc(100% - 32px)); padding: 14px 18px; border-radius: 14px; background: linear-gradient(135deg, rgba(120,14,10,.92), rgba(60,8,6,.92)); border: 1px solid rgba(255,120,100,.5); box-shadow: 0 0 0 1px rgba(255,90,78,.2), 0 20px 50px rgba(120,0,0,.45); animation: alertIn .5s var(--ease); }
#alert .hd { display: flex; align-items: center; gap: 10px; font: 800 20px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; }
#alert .hd .cd { margin-left: auto; font: 700 24px var(--f-mono); }
#alert .bd { margin-top: 6px; font-size: 13px; color: #ffd5cf; }
.blink { width: 10px; height: 10px; border-radius: 50%; background: #ff5a4e; animation: blink .6s infinite alternate; box-shadow: 0 0 12px #ff5a4e; }
@keyframes blink { to { opacity: .2; } }
@keyframes alertIn { from { opacity: 0; transform: translate(-50%, -20px) scale(.96); } }

#battlehud { position: fixed; z-index: 11; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 12px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); display: flex; gap: 20px; animation: toastIn .4s var(--ease); }
#battlehud .stat b { font-size: 17px; }
#viewchip { position: fixed; z-index: 11; left: 16px; top: calc(78px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); animation: toastIn .4s var(--ease); max-width: calc(100% - 32px); }
#viewchip .lbl { margin: 0; }
#viewchip b { font: 700 15px var(--f-display); letter-spacing: .05em; text-transform: uppercase; }

.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(3,8,10,.55); backdrop-filter: blur(4px); opacity: 0; transition: opacity .3s var(--ease); }
.modal.on { opacity: 1; }
.modal .card { width: min(480px, 100%); max-height: calc(100% - 20px); overflow-y: auto; padding: 22px; border-radius: 18px; background: var(--panel-solid); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,.6); transform: translateY(16px) scale(.97); transition: transform .4s var(--ease); }
.modal.on .card { transform: none; }
.modal .acts { display: flex; gap: 8px; margin-top: 18px; }
.modal .acts .btn { flex: 1; }
.big { font: 700 34px/1 var(--f-mono); color: var(--amber); }
.res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.res-grid div { padding: 10px; border-radius: 10px; background: rgba(255,255,255,.04); text-align: center; }
.res-grid b { display: block; font: 700 22px var(--f-mono); }
.res-grid span { font: 600 10px var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---------- Intro ---------- */
#intro { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at 50% 60%, rgba(5,12,16,0) 0%, rgba(5,12,16,.55) 60%, rgba(5,12,16,.9) 100%); transition: opacity .9s var(--ease), visibility .9s; }
#intro.gone { opacity: 0; visibility: hidden; }
.intro-card { width: min(440px, 100%); box-sizing: border-box; text-align: center; padding: 30px 26px 22px; border-radius: 20px; background: rgba(6,14,18,.72); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 30px 80px rgba(0,0,0,.5); animation: rise 1s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } }
.logo { font: 800 clamp(54px, 12vw, 92px)/.85 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: #f4ede0; text-shadow: 0 4px 30px rgba(0,0,0,.5); }
.logo span { color: var(--amber); }
.tagline { margin: 12px auto 26px; color: #b9cbc7; max-width: 34ch; }
.field { text-align: left; margin-bottom: 12px; }
.field input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(8,18,22,.8); color: var(--fg); font: 500 15px var(--f-body); transition: border-color .2s, box-shadow .2s; }
.field input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(242,169,59,.18); }
.intro-acts { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.fine { margin-top: 16px; font-size: 12px; color: var(--muted); }
.range { width: 100%; accent-color: var(--amber); }

/* ---------- Phones ---------- */
@media (max-width: 860px) {
  #hud { gap: 12px; padding-left: 12px; padding-right: 12px; flex-wrap: wrap; row-gap: 6px; }
  .brand b { font-size: 16px; max-width: 130px; }
  .brand small, .xpbar, #hud .eng-stat { display: none; }
  .rank svg { width: 26px; height: 26px; }
  .rank-name { font-size: 12px; }
  .stat b { font-size: 16px; }
  #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 48%; border-radius: 18px 18px 0 0; transform: translateY(105%); padding-bottom: env(safe-area-inset-bottom, 0px); transition: transform .5s var(--ease), height .4s var(--ease); }
  #panel.min { height: 52px; }
  .handle { display: block; width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 8px auto 0; cursor: pointer; border: 0; padding: 0; flex: none; }
  .tabs button { padding: 11px 0 10px; font-size: 11.5px; letter-spacing: .08em; }
  #battlehud { bottom: calc(48% + 10px); left: 12px; gap: 14px; padding: 10px 12px; }
  #viewchip { top: auto; bottom: calc(48% + 70px); left: 12px; }
}
@media (min-width: 861px) {
  #alert, #toasts { left: calc((100% - 400px) / 2); }
  #alert { width: min(560px, calc(100% - 440px)); }
}

/* ---------- v2 additions ---------- */
.mono { font: 500 12px var(--f-mono); color: var(--muted); }
.stepper button.wide { width: auto; padding: 0 8px; font-size: 12px; }
.seg { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; padding: 4px; margin: 10px 0 12px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 8px 0; border-radius: 8px; cursor: pointer; font: 700 11px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); transition: background .25s var(--ease), color .2s; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--amber); color: var(--amber-ink); box-shadow: 0 4px 14px rgba(242,169,59,.25); }
.seg button[data-sec="ultimate"]:not(.on) { color: #ff8a80; }
.seg button[data-sec="ultimate"].on { background: var(--red); color: #fff; box-shadow: 0 4px 14px rgba(255,90,78,.35); }
.confirm { margin-top: 10px; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,90,78,.45); background: rgba(255,90,78,.08); font-size: 13px; animation: slidein .3s var(--ease); }
.confirm .acts { display: flex; gap: 6px; } .confirm .acts .btn { flex: 1; }
.btn.ghost-danger { color: #ff8a80; border-color: rgba(255,90,78,.35); background: transparent; }
.btn.ghost-danger:hover:not(:disabled) { background: rgba(255,90,78,.1); }
.abtns { display: flex; flex-wrap: wrap; gap: 6px; }
.inline { display: flex; gap: 6px; margin-top: 8px; }
.inline input, .inline select, .sel { flex: 1; min-width: 0; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: rgba(8,18,22,.8); color: var(--fg); font: 500 14px var(--f-body); }
.sel { width: 100%; box-sizing: border-box; margin: 4px 0 6px; }
.toggle { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; transition: border-color .2s, background .2s; }
.toggle b { display: block; font: 700 14px/1.2 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.toggle small { display: block; color: var(--muted); font-size: 12px; }
.toggle .sw { flex: none; position: relative; width: 38px; height: 22px; border-radius: 11px; background: rgba(255,255,255,.12); transition: background .25s; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #dfe9e6; transition: transform .3s var(--ease); }
.toggle.on { border-color: rgba(242,169,59,.5); background: rgba(242,169,59,.07); }
.toggle.on .sw { background: var(--amber); } .toggle.on .sw::after { transform: translateX(16px); }
.card.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
#btn-admin.lit { color: var(--amber); border-color: rgba(242,169,59,.5); }
.titan-card { padding: 14px; border-radius: 14px; border: 1px solid rgba(255,90,78,.35); background: radial-gradient(ellipse at 50% 70%, rgba(255,60,40,.12), rgba(0,0,0,0) 70%), rgba(255,255,255,.02); }
.reqs { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 14px; }
.req { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.req .chk { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid rgba(255,255,255,.25); display: grid; place-items: center; font-size: 12px; color: #102010; flex: none; }
.req.ok { color: var(--fg); } .req.ok .chk { background: var(--green); border-color: var(--green); }
.titan-wrap { display: grid; place-items: center; padding: 18px 0 8px; }
.titan-btn { width: 150px; height: 150px; border-radius: 50%; border: 6px solid #3a3f44; cursor: pointer; background: radial-gradient(circle at 40% 35%, #8a8f94, #4a4f54 60%, #2c3034); box-shadow: inset 0 -8px 16px rgba(0,0,0,.5), 0 10px 0 #1c1f22, 0 16px 30px rgba(0,0,0,.5); font: 800 22px/1 var(--f-display); letter-spacing: .14em; color: rgba(255,255,255,.55); transition: transform .12s, box-shadow .12s; }
.titan-btn:disabled { cursor: not-allowed; }
.titan-btn.armed { background: radial-gradient(circle at 40% 35%, #ff8a7a, #e0261a 55%, #8e1008); color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.5); animation: titanPulse 0.9s infinite, titanFlicker 2.6s infinite; }
.titan-btn.armed:hover { transform: translateY(2px); }
.titan-btn.armed:active { transform: translateY(8px); box-shadow: inset 0 -4px 10px rgba(0,0,0,.5), 0 2px 0 #1c1f22, 0 6px 14px rgba(0,0,0,.5); }
@keyframes titanPulse { 0%, 100% { box-shadow: inset 0 -8px 16px rgba(0,0,0,.45), 0 10px 0 #1c1f22, 0 0 0 0 rgba(255,60,40,.7), 0 16px 30px rgba(0,0,0,.5); } 50% { box-shadow: inset 0 -8px 16px rgba(0,0,0,.45), 0 10px 0 #1c1f22, 0 0 0 22px rgba(255,60,40,0), 0 16px 30px rgba(0,0,0,.5); } }
@keyframes titanFlicker { 0%, 46%, 50%, 54%, 100% { filter: brightness(1); } 48%, 52% { filter: brightness(1.6); } }
#whiteout { position: fixed; inset: 0; z-index: 45; background: #fffaf0; opacity: 0; pointer-events: none; }
#whiteout.on { opacity: 1; transition: opacity .06s; }
#whiteout.fade { opacity: 0; transition: opacity 2.6s ease-out; }
#zoomctl { position: fixed; z-index: 9; right: 400px; bottom: 18px; display: flex; flex-direction: column; gap: 6px; margin-right: 12px; }
#zoomctl button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(10px); color: var(--fg); cursor: pointer; font: 700 18px/1 var(--f-mono); display: grid; place-items: center; transition: transform .2s, background .2s; }
#zoomctl button:hover { transform: translateY(-1px); background: rgba(30,50,58,.9); }
#zoomctl svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
@media (max-width: 860px) { #zoomctl { right: 12px; bottom: calc(48% + 12px); margin: 0; } #panel.min ~ #zoomctl { bottom: 64px; } }


#hud .stat b, #hud .brand b, .rank-name { white-space: nowrap; }
@media (max-width: 1280px) { #hud { gap: 14px; } #hud .eng-stat, .brand small { display: none; } .xpbar { width: 80px; } }
@media (max-width: 1500px) { #hud { gap: 14px; } #hud .eng-stat { display: none; } }
@media (max-width: 1020px) { #hud .rank > div { display: none; } }

/* ---------- v5: icons, empire, customization, records ---------- */
.ico { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; flex: none; }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 8px; }
.tabs button .ico { width: 16px; height: 16px; }
.tabs button span:not(.badge) { line-height: 1; }
.row > .ico { width: 18px; height: 18px; color: var(--muted); }
h2 .ico { width: 20px; height: 20px; vertical-align: -2px; color: var(--amber); }
.cat.civ { color: #f2c48a; background: rgba(242,196,138,.12); }
.pf-btn { width: 38px; height: 38px; padding: 0; border-radius: 10px; border: 1px solid var(--line); background: none; cursor: pointer; overflow: hidden; flex: none; transition: transform .2s; }
.pf-btn:hover { transform: translateY(-1px); }
.pf-btn svg { display: block; width: 100%; height: 100%; }
.isl-switch { max-width: 170px; margin: 2px 0; padding: 3px 6px; border-radius: 7px; border: 1px solid var(--line); background: rgba(8,18,22,.8); color: var(--fg); font: 600 12px var(--f-body); }
.upgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.upgrid .btn { justify-content: space-between; }
.upgrid .btn .c { font-size: 11px; opacity: .85; }
.seg.seg2 { grid-template-columns: repeat(2, 1fr); } .seg.seg3 { grid-template-columns: repeat(3, 1fr); } .seg.seg5 { grid-template-columns: repeat(5, 1fr); }
.toast.callout { align-items: flex-start; border-color: var(--cc); box-shadow: 0 0 0 1px var(--cc), 0 12px 30px rgba(0,0,0,.45); max-width: 100%; }
.toast.callout .cico { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--cc); color: #0b1418; }
.toast.callout .cico .ico { width: 18px; height: 18px; }
.toast.callout b { display: block; color: var(--fg); }
.toast.callout span { display: block; font-size: 12.5px; color: var(--muted); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.opt.sel { border-color: var(--amber); background: rgba(242,169,59,.1); }
.swatchrow { display: flex; gap: 3px; } .swatchrow i { flex: 1; height: 16px; border-radius: 4px; }
.flagrow { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.flagrow img { border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.flagctl { flex: 1; min-width: 200px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 10px; font-size: 12px; color: var(--muted); }
.flagctl label { display: flex; flex-direction: column; gap: 3px; }
.flagctl label:nth-child(n+4) { grid-column: span 3; }
.flagctl input[type=color] { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 7px; background: none; padding: 2px; }
.profile-top { display: flex; gap: 14px; align-items: center; margin: 8px 0 4px; }
.profile-top svg { border-radius: 14px; flex: none; }
.portraits { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.pbtn { padding: 0; border: 2px solid transparent; border-radius: 12px; background: none; cursor: pointer; overflow: hidden; }
.pbtn svg { display: block; width: 100%; height: auto; }
.pbtn.sel { border-color: var(--amber); }
.medals { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.medal { display: grid; place-items: center; aspect-ratio: 1; border-radius: 8px; background: rgba(255,255,255,.04); color: rgba(255,255,255,.18); }
.medal .ico { width: 18px; height: 18px; }
.medal.on { color: var(--amber); background: rgba(242,169,59,.12); }
.ico-w { color: var(--amber); flex: none; } .ach:not(.on) .ico-w { color: var(--muted); }
.lb { display: flex; flex-direction: column; gap: 4px; max-height: 50vh; overflow-y: auto; }
.lbrow { display: grid; grid-template-columns: 26px 10px 1fr 76px 44px 44px; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 9px; background: rgba(255,255,255,.03); font-size: 12.5px; }
.lbrow.me { background: rgba(242,169,59,.12); box-shadow: inset 0 0 0 1px rgba(242,169,59,.4); }
.lbrow b { display: block; font: 700 13px/1.2 var(--f-display); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbrow small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbpos { font: 700 13px var(--f-mono); color: var(--muted); text-align: right; }
.lbv { font: 500 12px var(--f-mono); text-align: right; color: var(--muted); } .lbv.hi { color: var(--fg); font-weight: 700; }
@media (max-width: 860px) { .portraits { grid-template-columns: repeat(4, 1fr); } .medals { grid-template-columns: repeat(6, 1fr); } .grid3 { grid-template-columns: 1fr; } .lbrow { grid-template-columns: 22px 8px 1fr 64px 34px 34px; gap: 5px; } .isl-switch { max-width: 110px; } }
/* ---------- v4: tech, world, diplomacy, achievements ---------- */
.tabs { grid-template-columns: repeat(6, 1fr); }
.tabs button { letter-spacing: .04em; font-size: 12px; }
.chip.clock { display: inline-flex; align-items: center; gap: 6px; color: #f2d48a; border-color: rgba(242,169,59,.35); background: rgba(242,169,59,.08); }
.chip.clock svg { width: 14px; height: 14px; }
.chip.clock .sun { fill: #f2c14b; } .chip.clock .moon { fill: none; }
.chip.clock.night { color: #b9c8ff; border-color: rgba(150,170,255,.35); background: rgba(120,140,255,.08); }
.chip.clock.night .sun { fill: none; } .chip.clock.night .moon { fill: #c9d4ff; }
.ach-btn { position: relative; }
.ach-btn span { position: absolute; bottom: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 8px; background: var(--amber); color: var(--amber-ink); font: 700 10px/16px var(--f-mono); }
.opbar { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(255,90,78,.55), rgba(255,255,255,.12) 50%, rgba(95,212,196,.6)); margin-top: 6px; }
.opbar.small { height: 4px; margin: 2px 0 0; }
.opbar i { position: absolute; top: -3px; width: 4px; height: calc(100% + 6px); margin-left: -2px; border-radius: 2px; background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.6); }
.rnode { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); transition: border-color .2s, background .2s; }
.rnode .nm { font: 700 14px/1.2 var(--f-display); letter-spacing: .03em; text-transform: uppercase; }
.rnode .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.rnode .tier { display: inline-block; margin-right: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,.08); font: 700 10px/1.4 var(--f-mono); color: var(--muted); }
.rnode.done { border-color: rgba(123,216,143,.4); background: rgba(123,216,143,.06); }
.rnode.run { border-color: rgba(242,169,59,.55); background: rgba(242,169,59,.07); }
.rnode.ready { border-color: rgba(242,169,59,.3); }
.rnode.locked { opacity: .7; }
.achgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ach { display: flex; gap: 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.02); opacity: .62; min-width: 0; }
.ach.on { opacity: 1; border-color: rgba(242,169,59,.45); background: rgba(242,169,59,.07); }
.ach .ico { font-size: 18px; line-height: 1; color: var(--amber); flex: none; }
.ach b { display: block; font: 700 13px/1.2 var(--f-display); letter-spacing: .03em; text-transform: uppercase; }
.ach small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.ach small.rw { font-family: var(--f-mono); color: var(--amber); margin-top: 2px; }
#mapcard { position: fixed; z-index: 11; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(340px, calc(100% - 32px)); box-sizing: border-box; padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 12px 40px rgba(0,0,0,.45); animation: toastIn .35s var(--ease); }
#mapcard .mc-t { display: block; font: 700 20px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
#mapcard .mc-acts { display: flex; flex-wrap: wrap; gap: 6px; }
@media (max-width: 860px) { #mapcard { bottom: calc(48% + 12px); } .achgrid { grid-template-columns: 1fr; } #hud .chip.clock { order: 9; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
/* Performance: live background blur over an animated canvas is re-rendered every frame (very costly in Edge),
   so panels use solid tinted glass instead. */
:root { --panel: rgba(11, 22, 28, 0.95); }
*, *::before, *::after { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
.modal { background: rgba(3, 8, 10, 0.72); }
#panel, #battlehud, #viewchip, .modal .card { will-change: transform; }

/* ---------- Update 12: seasons, shop, coalitions, update log ---------- */
.modal { z-index: 65; }
.season-chip { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font: 600 11px/1 var(--f-display); color: var(--sa, var(--cyan)); border-color: color-mix(in srgb, var(--sa, #5fd4c4) 55%, transparent); background: color-mix(in srgb, var(--sa, #5fd4c4) 12%, transparent); transition: transform .2s, background .2s; }
.season-chip:hover { transform: translateY(-1px); background: color-mix(in srgb, var(--sa, #5fd4c4) 22%, transparent); }
.season-chip svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.intro-season { margin: 14px auto 0; display: inline-block; padding: 6px 12px; border-radius: 99px; font: 700 12px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--sa); border: 1px solid var(--sa); background: color-mix(in srgb, var(--sa) 12%, transparent); animation: seasonPulse 2.4s infinite; }
@keyframes seasonPulse { 50% { box-shadow: 0 0 18px color-mix(in srgb, var(--sa) 45%, transparent); } }
.linkbtn { background: none; border: 0; padding: 0; color: var(--amber); cursor: pointer; text-decoration: underline; font: inherit; }
.uplog h3 { color: var(--amber); }
.uplog ul { margin: 0 0 6px; padding-left: 18px; }
.uplog li { margin: 0 0 7px; font-size: 13px; line-height: 1.45; color: var(--fg); }
.modal .card:has(.uplog) { width: min(620px, 100%); }
.season-banner { display: flex; align-items: center; gap: 12px; justify-content: space-between; padding: 12px 14px; margin: 10px 0; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--sa) 50%, transparent); background: linear-gradient(120deg, color-mix(in srgb, var(--sa) 20%, transparent), color-mix(in srgb, var(--sb) 14%, transparent)); }
.season-banner b { display: block; font: 800 22px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.season-banner small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.season-banner .left { flex: none; font: 700 12px var(--f-mono); color: var(--sa); }
.shopitem { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raise); }
.shopitem.on { border-color: rgba(242,169,59,.5); background: rgba(242,169,59,.06); }
.shopitem .pv { flex: none; width: 52px; height: 52px; border-radius: 10px; background: rgba(255,255,255,.05); display: grid; place-items: center; overflow: hidden; }
.shopitem .pv svg { width: 46px; height: 46px; }
.shopitem .nm { font: 700 15px/1.15 var(--f-display); letter-spacing: .03em; text-transform: uppercase; margin-top: 4px; }
.shopitem .meta { font-size: 12px; color: var(--muted); }
/* Halloween dresses the interface up a little */
body[data-season="halloween"] .logo span { color: #ff8a2b; text-shadow: 0 0 24px rgba(255,138,43,.45); }
body[data-season="halloween"] #hud { background: linear-gradient(180deg, rgba(20,8,28,.92), rgba(20,8,28,.55) 70%, rgba(20,8,28,0)); }
body[data-season="halloween"] #panel { box-shadow: 0 20px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(164,99,242,.25); }
body[data-season="halloween"] .tabs .ink { background: linear-gradient(90deg, #ff8a2b, #a463f2); }
body[data-season="halloween"] .intro-card { border-color: rgba(255,138,43,.35); box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 60px rgba(164,99,242,.18); }
body[data-season="christmas"] .logo span { color: #e2483d; }
body[data-season="christmas"] .tabs .ink { background: linear-gradient(90deg, #e2483d, #3fae6a); }
body[data-season="newyear"] .logo span { color: #f2c94c; text-shadow: 0 0 24px rgba(242,201,76,.5); }
body[data-season="valentine"] .logo span { color: #ff6b9a; }
body[data-season="stpatrick"] .logo span { color: #3fbf6a; }
body[data-season="easter"] .logo span { color: #b98cff; }
body[data-season="summer"] .logo span { color: #2fc6e0; }
body[data-season="harvest"] .logo span { color: #e09a3a; }
@media (max-width: 1280px) { .season-chip span { display: none; } }
@media (max-width: 860px) { #btn-updates { display: none; } .seg:not(.seg2):not(.seg3):not(.seg5) { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>

<canvas id="cv"></canvas>
<div id="flash"></div>

  <div id="shield-chip" class="chip" hidden>Shield</div>
  <button id="btn-season" class="chip season-chip" aria-label="Season shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16v10H4zM2 7h20v3H2zM12 7v13M12 7c-2-4-6-3-4 0M12 7c2-4 6-3 4 0"/></svg><span>Shop</span></button>

  <button id="btn-menu" class="icon-btn" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>

    <button data-tab="base" class="on">Base</button>

  </nav>

    <section class="tab on" id="tab-base"></section>
    <section class="tab" id="tab-crew"></section>
    <section class="tab" id="tab-arsenal"></section>
    <section class="tab" id="tab-tech"></section>
    <section class="tab" id="tab-world"></section>
    <section class="tab" id="tab-comms"></section>
  </div>

<div id="zoomctl" hidden><button data-zoom="in" aria-label="Zoom in">+</button><button data-zoom="out" aria-label="Zoom out">&minus;</button><button data-zoom="fit" aria-label="Fit island"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
<div id="viewchip" hidden></div>
<div id="mapcard" hidden></div>
<div id="battlehud" hidden></div>
<div id="alert" hidden></div>
<div id="toasts"></div>

      <div class="field"><label class="lbl" for="in-isl">Island name</label><input id="in-isl" maxlength="20" placeholder="Basalt Key" autocomplete="off"></div>

  </div>
</div>

<script>
'use strict';
// Procedural game audio: everything is synthesized with Web Audio, no samples.
const Sound = (() => {
  let ctx = null, master, comp, revSend, noiseBuf, brownBuf, ambGain, sirenNodes = null;
  let muted = false, volume = 0.8;
  const listener = { x: 600, y: 430, span: 700 };
  let activeLoops = 0;
  const MAX_LOOPS = 16;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 5;
    comp.attack.value = 0.002; comp.release.value = 0.3;
    master = ctx.createGain(); master.gain.value = muted ? 0 : volume;
    master.connect(comp); comp.connect(ctx.destination);
    const rev = ctx.createConvolver(); rev.buffer = makeIR(3.4, 2.6);
    revSend = ctx.createGain(); revSend.gain.value = 0.5;
    revSend.connect(rev); rev.connect(master);
    noiseBuf = makeNoise(false); brownBuf = makeNoise(true);
    startAmbient();
    buildBooms();
  }

  function makeNoise(brown) {
    const len = ctx.sampleRate * 4;
    const b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch); let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
      }
    }
    return b;
  }
  function makeIR(dur, decay) {
    const len = Math.floor(ctx.sampleRate * dur);
    const b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const t = i / len;
        // early reflections from terrain plus a long diffuse tail
        const early = (i < ctx.sampleRate * 0.12 && Math.random() < 0.004) ? (Math.random() * 2 - 1) * 1.5 : 0;
        d[i] = ((Math.random() * 2 - 1) * Math.pow(1 - t, decay) + early) * 0.6;
      }
    }
    return b;
  }

  const now = () => ctx.currentTime;
  function src(buf, t, rate = 1, loop = false) {
    const s = ctx.createBufferSource(); s.buffer = buf; s.loop = loop; s.playbackRate.value = rate;
    s.start(t, Math.random() * (buf.duration - 1));
    return s;
  }
  function filt(type, f, q = 0.7) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
  function gain(v = 1) { const g = ctx.createGain(); g.gain.value = v; return g; }
  function chain(...n) { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; }
  function env(g, t, peak, a, d, curve = 'exp') {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    if (curve === 'exp') g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    else g.gain.linearRampToValueAtTime(0, t + a + d);
  }

  // Position relative to the listener (camera centre). Returns pan and normalized distance.
  function place(x, y) {
    const dx = x - listener.x, dy = y - listener.y;
    const d = Math.hypot(dx, dy) / listener.span;
    return { pan: Math.max(-1, Math.min(1, dx / listener.span)), dist: d };
  }
  // A spatial output bus: gain by distance, air absorption lowpass, stereo pan, reverb send.
  function bus(x, y, base = 1, wet = 0.5) {
    const { pan, dist } = place(x, y);
    const out = gain(base / (1 + dist * dist * 1.6));
    const lp = filt('lowpass', 16000 / (1 + dist * 3.5), 0.5);
    const pn = ctx.createStereoPanner ? ctx.createStereoPanner() : gain(1);
    if (pn.pan) pn.pan.value = pan * 0.8;
    out.connect(lp); lp.connect(pn); pn.connect(master);
    const send = gain(wet * (0.6 + dist)); pn.connect(send); send.connect(revSend);
    return { input: out, dist };
  }

  function ok() { return ctx && ctx.state === 'running'; }

  // ---------- Explosions ----------
  // Update 12: explosions are pre-rendered once with real DSP (time-varying filters, saturation,
  // terrain echoes, falling debris) into a handful of variants, then played back with random pitch.
  // That sounds far more like a real blast and costs a single buffer source per explosion.
  const boomBufs = { ground: [], big: [], air: [], water: [], gun: [], titan: [] };
  const BOOM = {
    ground: { dur: 3.8, crack: 0.9, f0: 64, f1: 27, thump: 1.15, tT: 0.2, cut0: 5600, cut1: 150, bT: 0.32, body: 1.0, rT: 1.5, rumble: 0.9, drive: 1.9, echo: 1, debris: 14, splash: 0 },
    big:    { dur: 5.6, crack: 1.0, f0: 50, f1: 19, thump: 1.4, tT: 0.34, cut0: 4800, cut1: 110, bT: 0.55, body: 1.1, rT: 2.6, rumble: 1.2, drive: 2.4, echo: 1.2, debris: 26, splash: 0 },
    air:    { dur: 2.8, crack: 1.3, f0: 95, f1: 42, thump: 0.6, tT: 0.12, cut0: 7000, cut1: 260, bT: 0.18, body: 0.9, rT: 0.8, rumble: 0.45, drive: 1.6, echo: 1.1, debris: 0, splash: 0 },
    water:  { dur: 3.4, crack: 0.45, f0: 58, f1: 24, thump: 1.2, tT: 0.24, cut0: 2600, cut1: 120, bT: 0.3, body: 0.8, rT: 1.3, rumble: 0.8, drive: 1.7, echo: 0.8, debris: 0, splash: 1 },
    gun:    { dur: 1.9, crack: 1.1, f0: 85, f1: 38, thump: 0.9, tT: 0.09, cut0: 6000, cut1: 300, bT: 0.07, body: 0.9, rT: 0.35, rumble: 0.35, drive: 1.5, echo: 0.9, debris: 0, splash: 0 },
    titan:  { dur: 13, crack: 1.0, f0: 38, f1: 11, thump: 1.6, tT: 0.9, cut0: 4200, cut1: 60, bT: 1.6, body: 1.2, rT: 5.5, rumble: 1.5, drive: 2.8, echo: 1.6, debris: 70, splash: 0 },
  };
  function synthBoom(kind, seed) {
    const P = BOOM[kind], sr = Math.min(ctx.sampleRate, 32000), N = Math.floor(sr * P.dur);
    const buf = ctx.createBuffer(2, N, sr);
    let st = (seed * 2654435761) >>> 0;
    const rnd = () => { st = (st * 1664525 + 1013904223) >>> 0; return st / 4294967296; };
    const TAU = Math.PI * 2, aR = 1 - Math.exp(-TAU * 95 / sr), aE = 1 - Math.exp(-TAU * 900 / sr);
    const dn = Math.tanh(P.drive);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let lp1 = 0, lp2 = 0, lp3 = 0, ph = 0, hs = 0;
      const f0 = P.f0 * (0.92 + rnd() * 0.16);
      for (let i = 0; i < N; i++) {
        const t = i / sr, w = rnd() * 2 - 1;
        // body: broadband roar whose filter closes as the fireball cools
        const cut = P.cut1 + (P.cut0 - P.cut1) * Math.exp(-t / (P.bT * 0.7));
        lp1 += (1 - Math.exp(-TAU * cut / sr)) * (w - lp1);
        const eB = (1 - Math.exp(-t / 0.0015)) * (0.72 * Math.exp(-t / P.bT) + 0.28 * Math.exp(-t / (P.bT * 3.8)));
        // rumble: two-pole low noise that swells and rolls away
        lp2 += aR * (w - lp2); lp3 += aR * (lp2 - lp3);
        const eR = (1 - Math.exp(-t / 0.05)) * Math.exp(-t / P.rT);
        // pressure thump: a falling sine
        const f = P.f1 + (f0 - P.f1) * Math.exp(-t / (P.tT * 0.5)); ph += TAU * f / sr;
        const eT = (1 - Math.exp(-t / 0.0025)) * Math.exp(-t / P.tT);
        // the crack: an N-wave plus a burst of hiss
        let cr = 0;
        if (t < 0.005) cr = t < 0.0007 ? t / 0.0007 : 1 - 1.7 * (t - 0.0007) / 0.0043;
        cr += w * Math.exp(-t / 0.007) * 0.8;
        // water: a long fizz of spray falling back
        let sp = 0;
        if (P.splash) { hs += 0.35 * (w - hs); sp = (w - hs) * Math.min(1, t / 0.15) * Math.exp(-t / 0.9) * 0.5; }
        let x = P.crack * cr + P.body * 2.2 * lp1 * eB + P.rumble * 9 * lp3 * eR + P.thump * Math.sin(ph) * eT + sp;
        d[i] = Math.tanh(x * P.drive) / dn;
      }
      // terrain echoes: dull copies of the blast arriving from hills and buildings
      if (P.echo) {
        const dull = new Float32Array(N); let e = 0; for (let i = 0; i < N; i++) { e += aE * (d[i] - e); dull[i] = e; }
        const taps = [[0.16, 0.36], [0.31, 0.27], [0.52, 0.2], [0.83, 0.13], [1.25, 0.09], [1.8, 0.05]];
        for (const [dt, gn] of taps) {
          const off = Math.floor((dt * P.echo + (ch ? 0.012 : 0) + rnd() * 0.03) * sr), gg = gn * (0.85 + rnd() * 0.3);
          for (let i = off; i < N; i++) d[i] += dull[i - off] * gg;
        }
      }
      // debris and dirt raining back down
      for (let k = 0; k < P.debris; k++) {
        const t0 = 0.25 + rnd() * rnd() * P.dur * 0.6, i0 = Math.floor(t0 * sr), len = Math.floor((0.004 + rnd() * 0.02) * sr), amp = (0.05 + rnd() * 0.12) * Math.exp(-t0 / 2);
        let prev = 0;
        for (let i = 0; i < len && i0 + i < N; i++) { const w = rnd() * 2 - 1; d[i0 + i] += (w - prev) * amp * (1 - i / len); prev = w; }
      }
      let peak = 0; for (let i = 0; i < N; i++) peak = Math.max(peak, Math.abs(d[i]));
      const k = 0.95 / (peak || 1); for (let i = 0; i < N; i++) d[i] *= k;
    }
    return buf;
  }
  function buildBooms() {
    const jobs = [['ground', 1], ['air', 2], ['gun', 3], ['big', 4], ['water', 5], ['ground', 6], ['air', 7], ['ground', 8], ['big', 9], ['gun', 10], ['water', 11], ['titan', 12]];
    let i = 0;
    const step = () => { if (i >= jobs.length) return; const [k, s] = jobs[i++]; try { boomBufs[k].push(synthBoom(k, s)); } catch (e) {} setTimeout(step, 30); };
    setTimeout(step, 50);
  }
  function playBoom(kind, b, t, rate, vol) {
    const arr = boomBufs[kind]; if (!arr.length) return false;
    const s = ctx.createBufferSource(); s.buffer = arr[Math.floor(Math.random() * arr.length)];
    s.playbackRate.value = rate;
    const g = gain(vol); s.connect(g); g.connect(b.input); s.start(t);
    s.onended = () => { try { g.disconnect(); } catch (e) {} };
    return true;
  }
  const recentBooms = [];
  function explosion(x, y, size = 1, air = false, water = false) {
    if (!ok()) return;
    // a salvo can trigger dozens of blasts at once; past a handful they just blur together and cost CPU
    const tn = now();
    while (recentBooms.length && tn - recentBooms[0] > 0.35) recentBooms.shift();
    if (recentBooms.length >= (size > 1.5 ? 7 : 5)) return;
    recentBooms.push(tn);
    const b = bus(x, y, 1.0 * Math.sqrt(size), air ? 0.9 : 0.7);
    const t = now() + Math.min(b.dist * 0.18, 0.5) + 0.01; // sound arrives a bit after the flash
    const kind = water ? 'water' : air ? 'air' : size >= 1.4 ? 'big' : 'ground';
    const rate = Math.max(0.68, Math.min(1.18, 1.14 - size * 0.12)) * (0.93 + Math.random() * 0.14);
    if (playBoom(kind, b, t, rate, Math.min(1.7, 0.85 + size * 0.3))) return;
    legacyBoom(b, t, size, air);
  }
  function legacyBoom(b, t, size, air) {
    const s = Math.min(size, 3);
    const crack = src(noiseBuf, t, 1.2); const cg = gain(0);
    chain(crack, filt('highpass', air ? 1800 : 1100), cg, b.input);
    env(cg, t, 1.6, 0.001, 0.09); crack.stop(t + 0.2);
    const body = src(brownBuf, t, 1); const bf = filt('lowpass', 3200, 0.9); const bg = gain(0);
    chain(body, bf, bg, b.input);
    bf.frequency.setValueAtTime(4200, t); bf.frequency.exponentialRampToValueAtTime(180, t + 1.4 * Math.sqrt(s));
    env(bg, t, 2.2 * s, 0.006, 1.8 + s * 0.6); body.stop(t + 4);
    const sub = ctx.createOscillator(); sub.type = 'sine'; const sg = gain(0);
    chain(sub, sg, b.input);
    sub.frequency.setValueAtTime(air ? 120 : 95, t); sub.frequency.exponentialRampToValueAtTime(26, t + 0.9);
    env(sg, t, (air ? 1.0 : 2.4) * Math.sqrt(s), 0.004, 1.3); sub.start(t); sub.stop(t + 1.6);
  }

  // ---------- One-shots ----------
  let lastLaunch = 0;
  function launch(x, y, vol = 1) { // interceptor launch: ignition thump + roaring whoosh
    if (!ok()) return;
    const t = now(); if (t - lastLaunch < 0.04) return; lastLaunch = t;
    const b = bus(x, y, 0.9 * vol, 0.6);
    const th = ctx.createOscillator(); const tg = gain(0); chain(th, tg, b.input);
    th.frequency.setValueAtTime(140, t); th.frequency.exponentialRampToValueAtTime(40, t + 0.25);
    env(tg, t, 1.4, 0.002, 0.3); th.start(t); th.stop(t + 0.4);
    const n = src(noiseBuf, t, 1); const bp = filt('bandpass', 500, 0.8); const g = gain(0);
    chain(n, bp, g, b.input);
    bp.frequency.setValueAtTime(350, t); bp.frequency.exponentialRampToValueAtTime(2600, t + 0.35);
    bp.frequency.exponentialRampToValueAtTime(900, t + 1.6);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(1.3, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8); n.stop(t + 2);
    const r = src(brownBuf, t, 1); const rg = gain(0); chain(r, filt('lowpass', 500), rg, b.input);
    env(rg, t, 1.2, 0.02, 1.4); r.stop(t + 1.8);
  }
  let lastGun = 0;
  function gun(x, y, dur = 0.5) { // rotary cannon burst
    if (!ok()) return;
    const t = now(); if (t - lastGun < 0.06) return; lastGun = t;
    const b = bus(x, y, 0.8, 0.45);
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 72;
    const ws = ctx.createWaveShaper(); ws.curve = clipCurve();
    const g = gain(0); chain(o, ws, filt('bandpass', 900, 0.6), g, b.input);
    const n = src(noiseBuf, t, 1); const ng = gain(0); chain(n, filt('highpass', 2000), ng, b.input);
    const lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 72;
    const lg = gain(0.25); lfo.connect(lg); lg.connect(ng.gain);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.7, t + 0.02);
    g.gain.setValueAtTime(0.7, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + 0.05);
    ng.gain.setValueAtTime(0.25, t); ng.gain.setValueAtTime(0.25, t + dur); ng.gain.linearRampToValueAtTime(0, t + dur + 0.04);
    o.start(t); lfo.start(t); o.stop(t + dur + 0.1); lfo.stop(t + dur + 0.1); n.stop(t + dur + 0.1);
  }
  let _clip;
  function clipCurve() {
    if (_clip) return _clip;
    _clip = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; _clip[i] = Math.tanh(x * 4); }
    return _clip;
  }
  let lastCannon = 0;
  function cannon(x, y) { // naval gun / coastal battery / tank gun report
    if (!ok()) return;
    const t = now(); if (t - lastCannon < 0.05) return; lastCannon = t;
    const b = bus(x, y, 0.9, 0.8);
    if (playBoom('gun', b, t + Math.min(b.dist * 0.12, 0.3), 0.95 + Math.random() * 0.15, 0.9)) return;
    const n = src(noiseBuf, t, 1); const g = gain(0); chain(n, filt('lowpass', 2400), g, b.input);
    env(g, t, 1.5, 0.002, 0.45); n.stop(t + 0.7);
    const o = ctx.createOscillator(); const og = gain(0); chain(o, og, b.input);
    o.frequency.setValueAtTime(80, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.4);
    env(og, t, 1.6, 0.002, 0.6); o.start(t); o.stop(t + 0.8);
  }
  function splash(x, y) {
    if (!ok()) return;
    const b = bus(x, y, 0.7, 0.4); const t = now() + 0.05;
    const n = src(noiseBuf, t, 0.7); const g = gain(0); chain(n, filt('bandpass', 700, 0.6), g, b.input);
    env(g, t, 0.9, 0.01, 0.9); n.stop(t + 1.2);
  }

  function cannonRun(x, y, dur) {
    // attack jet nose cannon: a very high rate of fire blurs into one tearing "brrrt",
    // followed a moment later by the rounds hitting the ground
    if (!ok()) return;
    const b = bus(x, y, 1.1, 0.8); const t = now();
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 64;
    const ws = ctx.createWaveShaper(); ws.curve = clipCurve();
    const g1 = gain(0); chain(o, ws, filt('lowpass', 1900, 0.7), g1, b.input);
    const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = 128; const g2 = gain(0); chain(o2, filt('bandpass', 380, 1.2), g2, b.input);
    const n = src(noiseBuf, t, 1); const ng = gain(0); chain(n, filt('highpass', 700), ng, b.input);
    const lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 64; const lg = gain(0.35); lfo.connect(lg); lg.connect(ng.gain);
    [[g1, 0.9], [g2, 0.35], [ng, 0.35]].forEach(([gg, v]) => { gg.gain.setValueAtTime(0, t); gg.gain.linearRampToValueAtTime(v, t + 0.03); gg.gain.setValueAtTime(v, t + dur); gg.gain.linearRampToValueAtTime(0, t + dur + 0.08); });
    [o, o2, lfo].forEach(x2 => { x2.start(t); x2.stop(t + dur + 0.15); }); n.stop(t + dur + 0.15);
    // impacts: dense crackle with a low thump, slightly delayed
    for (let i = 0; i < 26; i++) {
      const tt = t + 0.35 + Math.random() * dur; const c = src(noiseBuf, tt, 0.8); const g3 = gain(0);
      chain(c, filt('lowpass', 900 + Math.random() * 1500), g3, b.input); env(g3, tt, 0.35 + Math.random() * 0.3, 0.002, 0.08); c.stop(tt + 0.15);
    }
  }
  function flare(x, y) { // flare dispenser: a few sharp pops and a fizzing burn
    if (!ok()) return;
    const b = bus(x, y, 0.45, 0.5); const t = now();
    for (let i = 0; i < 4; i++) { const tt = t + i * 0.07; const c = src(noiseBuf, tt, 1); const g = gain(0); chain(c, filt('bandpass', 2600, 1.2), g, b.input); env(g, tt, 0.7, 0.001, 0.04); c.stop(tt + 0.08); }
    const f = src(noiseBuf, t, 0.8); const fg = gain(0); chain(f, filt('highpass', 4000), fg, b.input); env(fg, t + 0.05, 0.18, 0.05, 0.9); f.stop(t + 1.2);
  }
  function shot(x, y) { // small-arms crack
    if (!ok()) return;
    const b = bus(x, y, 0.35, 0.5); const t = now();
    const n = src(noiseBuf, t, 1); const g = gain(0); chain(n, filt('bandpass', 2200, 0.9), g, b.input);
    env(g, t, 1, 0.001, 0.06); n.stop(t + 0.12);
    const o = ctx.createOscillator(); const og = gain(0); chain(o, og, b.input);
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.08);
    env(og, t, 0.5, 0.001, 0.1); o.start(t); o.stop(t + 0.15);
  }
  function emp(x, y) { // electric discharge zap
    if (!ok()) return;
    const b = bus(x, y, 0.8, 0.6); const t = now();
    const o = ctx.createOscillator(); o.type = 'sawtooth'; const og = gain(0); chain(o, filt('lowpass', 3000), og, b.input);
    o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.9);
    env(og, t, 0.5, 0.005, 0.9); o.start(t); o.stop(t + 1);
    const n = src(noiseBuf, t, 1); const g = gain(0); chain(n, filt('highpass', 3000), g, b.input);
    env(g, t, 0.6, 0.002, 0.5); n.stop(t + 0.6);
  }
  function firework(x, y) { // a thud, a sharp bang, then a shower of crackles
    if (!ok()) return;
    const b = bus(x, y, 0.5, 0.9), t = now() + 0.05;
    if (!playBoom('air', b, t, 1.5 + Math.random() * 0.3, 0.45)) return;
    for (let i = 0; i < 14; i++) { const tt = t + 0.25 + Math.random() * 1.2; const c = src(noiseBuf, tt, 1); const g2 = gain(0); chain(c, filt('highpass', 3000), g2, b.input); env(g2, tt, 0.15 + Math.random() * 0.15, 0.001, 0.02); c.stop(tt + 0.05); }
  }
  function flame(x, y) { // flamethrower: a roaring hiss with crackle
    if (!ok()) return;
    const b = bus(x, y, 0.55, 0.4), t = now();
    const n = src(noiseBuf, t, 0.8), g1 = gain(0); chain(n, filt('bandpass', 700, 0.5), g1, b.input);
    g1.gain.setValueAtTime(0.0001, t); g1.gain.linearRampToValueAtTime(0.9, t + 0.06); g1.gain.setValueAtTime(0.9, t + 0.5); g1.gain.linearRampToValueAtTime(0, t + 0.75); n.stop(t + 0.8);
    const r = src(brownBuf, t, 1), g2 = gain(0); chain(r, filt('lowpass', 260), g2, b.input); env(g2, t, 0.9, 0.05, 0.7); r.stop(t + 0.85);
  }
  function titan(x, y) { // the Titan Bomb: a stack of very long, very low layers
    if (!ok()) return;
    const t = now();
    const out = gain(1.2); out.connect(master); const send = gain(0.9); out.connect(send); send.connect(revSend);
    if (boomBufs.titan.length) { const s2 = ctx.createBufferSource(); s2.buffer = boomBufs.titan[0]; s2.playbackRate.value = 0.9; const g0 = gain(1.6); s2.connect(g0); g0.connect(out); s2.start(t); }
    const crack = src(noiseBuf, t, 1); const cg = gain(0); chain(crack, filt('highpass', 800), cg, out);
    env(cg, t, 2.2, 0.002, 0.4); crack.stop(t + 0.6);
    const body = src(brownBuf, t, 0.8); const bf = filt('lowpass', 4000, 0.7); const bg = gain(0); chain(body, bf, bg, out);
    bf.frequency.setValueAtTime(5000, t); bf.frequency.exponentialRampToValueAtTime(90, t + 6);
    bg.gain.setValueAtTime(0.0001, t); bg.gain.linearRampToValueAtTime(3, t + 0.05); bg.gain.exponentialRampToValueAtTime(0.0001, t + 9);
    body.stop(t + 9.5);
    const sub = ctx.createOscillator(); const sg = gain(0); chain(sub, sg, out);
    sub.frequency.setValueAtTime(70, t); sub.frequency.exponentialRampToValueAtTime(16, t + 5);
    sg.gain.setValueAtTime(0.0001, t); sg.gain.linearRampToValueAtTime(3, t + 0.04); sg.gain.exponentialRampToValueAtTime(0.0001, t + 6);
    sub.start(t); sub.stop(t + 6.5);
    const rum = src(brownBuf, t, 0.45, true); const rg = gain(0); chain(rum, filt('lowpass', 120, 1.4), rg, out);
    rg.gain.setValueAtTime(0.0001, t); rg.gain.linearRampToValueAtTime(2.2, t + 0.8); rg.gain.exponentialRampToValueAtTime(0.0001, t + 14);
    rum.stop(t + 14.5);
    for (let i = 0; i < 60; i++) { // debris raining down
      const tt = t + 0.5 + Math.random() * 6; const c = src(noiseBuf, tt, 1); const g2 = gain(0);
      chain(c, filt('bandpass', 800 + Math.random() * 3500, 2), g2, out); env(g2, tt, 0.15 + Math.random() * 0.3, 0.001, 0.05); c.stop(tt + 0.1);
    }
  }

  // ---------- Continuous engine loops (with doppler) ----------
  function loop(kind) {
    const dummy = { update() {}, stop() {} };
    if (!ok() || activeLoops >= MAX_LOOPS) return dummy;
    activeLoops++;
    const t = now();
    const out = gain(0); const pn = ctx.createStereoPanner ? ctx.createStereoPanner() : gain(1);
    const air = filt('lowpass', 12000, 0.4);
    out.connect(air); air.connect(pn); pn.connect(master);
    const send = gain(0.25); pn.connect(send); send.connect(revSend);
    const nodes = []; let freqNodes = [], rateNodes = [], baseF = [], base = 0.5, sweep = null;

    if (kind === 'drone') {
      // two-stroke engine: detuned saws, chopped by a piston-rate amplitude modulator
      const am = gain(0.6);
      [[118, 'sawtooth', 0.35], [119.6, 'sawtooth', 0.3], [59, 'square', 0.18], [236, 'sawtooth', 0.08]].forEach(([f, ty, v]) => {
        const o = ctx.createOscillator(); o.type = ty; o.frequency.value = f; const g = gain(v);
        o.connect(g); g.connect(am); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(f);
      });
      const lfo = ctx.createOscillator(); lfo.frequency.value = 31; const lg = gain(0.4);
      lfo.connect(lg); lg.connect(am.gain); lfo.start(t); nodes.push(lfo);
      const lp = filt('lowpass', 1600, 1.4); am.connect(lp); lp.connect(out);
      base = 0.32;
    } else if (kind === 'gunship') {
      // single four-blade rotor: a faster, harder slap than the transport, plus a hot turbine
      const n = src(brownBuf, t, 1.1, true); const lp = filt('lowpass', 900, 0.8); const chop = gain(0.35);
      chain(n, lp, chop, out); nodes.push(n); rateNodes.push(n.playbackRate);
      const lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 17; const lg = gain(0.42);
      lfo.connect(lg); lg.connect(chop.gain); lfo.start(t); nodes.push(lfo);
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = 2100; const og = gain(0.025);
      chain(o, og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(2100);
      base = 0.5;
    } else if (kind === 'lander') {
      // twin diesels thudding away under a churn of water
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 31; const og = gain(0.2);
      chain(o, filt('lowpass', 240), og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(31);
      const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = 62.5; const og2 = gain(0.05);
      chain(o2, filt('lowpass', 300), og2, out); o2.start(t); nodes.push(o2); freqNodes.push(o2.frequency); baseF.push(62.5);
      const r = src(brownBuf, t, 0.8, true); const rg = gain(0.6); chain(r, filt('lowpass', 400), rg, out); nodes.push(r);
      base = 0.38;
    } else if (kind === 'tank') {
      // diesel growl and the clatter of tracks
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 27; const og = gain(0.22);
      chain(o, filt('lowpass', 200, 1.2), og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(27);
      const n = src(noiseBuf, t, 1, true); const ng = gain(0.12); chain(n, filt('bandpass', 1900, 1.4), ng, out); nodes.push(n);
      const lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 9; const lg = gain(0.1); lfo.connect(lg); lg.connect(ng.gain); lfo.start(t); nodes.push(lfo);
      base = 0.22;
    } else if (kind === 'heli') {
      // twin rotors: low noise chopped at blade-pass rate, plus turbine whine
      const n = src(brownBuf, t, 1, true); const lp = filt('lowpass', 700, 0.8); const chop = gain(0.4);
      chain(n, lp, chop, out); nodes.push(n); rateNodes.push(n.playbackRate);
      const lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 11; const lg = gain(0.38);
      lfo.connect(lg); lg.connect(chop.gain); lfo.start(t); nodes.push(lfo);
      const lfo2 = ctx.createOscillator(); lfo2.type = 'square'; lfo2.frequency.value = 11.7; const lg2 = gain(0.22);
      lfo2.connect(lg2); lg2.connect(chop.gain); lfo2.start(t); nodes.push(lfo2);
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = 1500; const og = gain(0.03);
      chain(o, og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(1500);
      base = 0.6;
    } else if (kind === 'bomber') {
      const r = src(brownBuf, t, 0.7, true); const rg = gain(1.2); chain(r, filt('lowpass', 260), rg, out); nodes.push(r); rateNodes.push(r.playbackRate);
      const n = src(noiseBuf, t, 1, true); const ng = gain(0.25); chain(n, filt('bandpass', 700, 0.5), ng, out); nodes.push(n);
      base = 0.7;
    } else if (kind === 'fighter' || kind === 'striker') {
      // turbofan: deep roar, broadband jet noise, a pair of turbine whines, low rumble; doppler on all
      const r = src(brownBuf, t, 1, true); const rg = gain(1.1); chain(r, filt('lowpass', kind === 'striker' ? 600 : 800, 0.5), rg, out); nodes.push(r); rateNodes.push(r.playbackRate);
      const n = src(noiseBuf, t, 1, true); const ng = gain(0.45); chain(n, filt('bandpass', 1700, 0.45), ng, out); nodes.push(n); rateNodes.push(n.playbackRate);
      [[3150, 0.025], [4300, 0.016]].forEach(([f, v]) => { const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f; const og = gain(v); chain(o, og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(f); });
      const lo = ctx.createOscillator(); lo.type = 'sawtooth'; lo.frequency.value = 52; const lg = gain(0.12); chain(lo, filt('lowpass', 180), lg, out); lo.start(t); nodes.push(lo); freqNodes.push(lo.frequency); baseF.push(52);
      base = 0.85;
    } else if (kind === 'sub') {
      const o = ctx.createOscillator(); o.frequency.value = 58; const og = gain(0.25); chain(o, og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(58);
      const r = src(brownBuf, t, 0.6, true); const rg = gain(0.5); chain(r, filt('lowpass', 140), rg, out); nodes.push(r);
      base = 0.16;
    } else if (kind === 'carrier') {
      const r = src(brownBuf, t, 0.5, true); const rg = gain(1.1); chain(r, filt('lowpass', 150, 0.8), rg, out); nodes.push(r);
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 36; const og = gain(0.14); chain(o, filt('lowpass', 110), og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(36);
      base = 0.42;
    } else if (kind === 'bomb') {
      activeLoops--; return dummy;
    } else if (kind === 'cruise' || kind === 'hyper' || kind === 'jet') {
      // turbojet: hiss + whine + low roar
      const n = src(noiseBuf, t, 1, true); const bp = filt('bandpass', kind === 'hyper' ? 2200 : 1300, 0.6); const g = gain(0.7);
      chain(n, bp, g, out); nodes.push(n); rateNodes.push(n.playbackRate);
      const r = src(brownBuf, t, 1, true); const rg = gain(0.9); chain(r, filt('lowpass', 420), rg, out); nodes.push(r); rateNodes.push(r.playbackRate);
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = kind === 'hyper' ? 2900 : 1850;
      const og = gain(0.05); chain(o, og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(o.frequency.value);
      base = kind === 'hyper' ? 0.55 : 0.45;
    } else if (kind === 'ballistic') {
      // re-entry scream: narrow band noise that falls in pitch as it descends
      const n = src(noiseBuf, t, 1, true); const bp = filt('bandpass', 3000, 9); const g = gain(1.6);
      chain(n, bp, g, out); nodes.push(n); sweep = bp.frequency;
      const r = src(brownBuf, t, 1, true); const rg = gain(0.8); chain(r, filt('lowpass', 300), rg, out); nodes.push(r);
      base = 0.0;
    } else if (kind === 'gunboat') {
      const r = src(brownBuf, t, 1, true); const rg = gain(1); chain(r, filt('lowpass', 260), rg, out); nodes.push(r);
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 46; const og = gain(0.12);
      chain(o, filt('lowpass', 300), og, out); o.start(t); nodes.push(o); freqNodes.push(o.frequency); baseF.push(46);
      base = 0.4;
    }
    let lastD = null, stopped = false, lastU = -1;
    return {
      update(x, y, vx, vy, progress = 0) {
        if (stopped) return;
        const tt = now();
        // automation events pile up if they are scheduled every frame: 20 updates a second is plenty
        if (tt - lastU < 0.05) return; lastU = tt;
        const p = place(x, y);
        const g = base === 0 ? (0.05 + progress * progress * 0.9) : base;
        out.gain.setTargetAtTime(g / (1 + p.dist * p.dist * 2.2), tt, 0.08);
        air.frequency.setTargetAtTime(14000 / (1 + p.dist * 3), tt, 0.1);
        if (pn.pan) pn.pan.setTargetAtTime(p.pan * 0.85, tt, 0.08);
        // doppler from the radial velocity toward the listener
        const dx = x - listener.x, dy = y - listener.y, d = Math.hypot(dx, dy) || 1;
        const vr = -(dx * vx + dy * vy) / d;
        const dop = Math.max(0.6, Math.min(1.6, 1 / (1 - vr / 1100)));
        freqNodes.forEach((f, i) => f.setTargetAtTime(baseF[i] * dop * (kind === 'drone' ? 1 + Math.sin(tt * 1.3) * 0.015 : 1), tt, 0.08));
        rateNodes.forEach(r => r.setTargetAtTime(dop, tt, 0.08));
        if (sweep) sweep.setTargetAtTime(3400 - progress * 2600, tt, 0.06);
      },
      stop() {
        if (stopped) return; stopped = true; activeLoops--;
        const tt = now(); out.gain.setTargetAtTime(0, tt, 0.05);
        nodes.forEach(n => { try { n.stop(tt + 0.4); } catch (e) {} });
        setTimeout(() => { try { out.disconnect(); pn.disconnect(); } catch (e) {} }, 800);
      }
    };
  }

  // ---------- UI and alerts ----------
  function tone(f, t, d, type = 'sine', v = 0.2, dest = master) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; const g = gain(0);
    o.connect(g); g.connect(dest); env(g, t, v, 0.005, d); o.start(t); o.stop(t + d + 0.05);
    return o;
  }
  function ui(kind) {
    if (!ok()) return;
    const t = now();
    if (kind === 'click') tone(1800, t, 0.03, 'square', 0.04);
    else if (kind === 'tab') tone(900, t, 0.05, 'triangle', 0.06);
    else if (kind === 'cash') { tone(1320, t, 0.08, 'triangle', 0.12); tone(1980, t + 0.06, 0.12, 'triangle', 0.1); }
    else if (kind === 'build') { tone(523, t, 0.12, 'triangle', 0.12); tone(784, t + 0.1, 0.2, 'triangle', 0.12); }
    else if (kind === 'error') { tone(160, t, 0.15, 'square', 0.08); tone(120, t + 0.12, 0.18, 'square', 0.08); }
    else if (kind === 'rank') [392, 523, 659, 784, 1046].forEach((f, i) => tone(f, t + i * 0.12, 0.5, 'sawtooth', 0.07));
    else if (kind === 'ping') { tone(1250, t, 0.6, 'sine', 0.12); tone(1250, t + 0.35, 0.5, 'sine', 0.04); }
    else if (kind === 'msg') { tone(1400, t, 0.06, 'sine', 0.08); tone(1050, t + 0.07, 0.08, 'sine', 0.08); }
    else if (kind === 'alarm') for (let i = 0; i < 3; i++) tone(980, t + i * 0.22, 0.12, 'square', 0.08);
  }
  function siren(on) {
    if (!ctx) return;
    if (on && !sirenNodes) {
      const t = now(); const g = gain(0); const ws = ctx.createWaveShaper(); ws.curve = clipCurve();
      const lp = filt('lowpass', 2500); const send = gain(0.8);
      const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(); o1.type = 'sawtooth'; o2.type = 'sine';
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.18; const lg = gain(260);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
      o1.frequency.value = 620; o2.frequency.value = 624;
      const m1 = gain(0.15), m2 = gain(0.5); o1.connect(m1); o2.connect(m2); m1.connect(ws); m2.connect(ws);
      ws.connect(lp); lp.connect(g); g.connect(master); g.connect(send); send.connect(revSend);
      g.gain.linearRampToValueAtTime(0.09, t + 1.5);
      [o1, o2, lfo].forEach(o => o.start(t));
      sirenNodes = { g, osc: [o1, o2, lfo] };
    } else if (!on && sirenNodes) {
      const t = now(), s = sirenNodes; sirenNodes = null;
      s.g.gain.setTargetAtTime(0, t, 0.5); s.osc.forEach(o => o.stop(t + 3));
    }
  }
  function startAmbient() {
    // surf on the shore and a light wind
    const t = now(); ambGain = gain(0.0);
    const n = src(brownBuf, t, 0.5, true); const lp = filt('lowpass', 550); const sw = gain(0.6);
    chain(n, lp, sw, ambGain);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.09; const lg = gain(0.4); lfo.connect(lg); lg.connect(sw.gain); lfo.start(t);
    const w = src(noiseBuf, t, 1, true); const wg = gain(0.02); chain(w, filt('highpass', 4000), wg, ambGain);
    ambGain.connect(master); ambGain.gain.linearRampToValueAtTime(0.18, t + 3);
  }

  return {
    init, explosion, launch, gun, cannon, cannonRun, flare, flame, splash, shot, emp, titan, loop, ui, siren, listener, firework,
    get muted() { return muted; },
    setMuted(m) { muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : volume, now(), 0.05); },
    setVolume(v) { volume = v; if (master && !muted) master.gain.setTargetAtTime(v, now(), 0.05); },
    get volume() { return volume; },
    get _booms() { return boomBufs; }
  };
})();

const cityUnlocked = () => rankIdx(S) >= 4;
function ensureCity() {
  if (S.cityOn || !cityUnlocked()) return;
  S.cityOn = true;
  for (let k = 0; k < CITY_N; k++) if (!S.plots[CITY0 + k]) S.plots[CITY0 + k] = null;
  Sound.ui('build');
  callout('people', 'Civilian city founded', 'A bridge now links your island to a new city island. Build homes there: every civilian pays taxes.', '#5fd4c4');
  log('sys', 'City', 'Civilian city unlocked. Its plots only take civilian buildings.');
}
const isCityPlot = i => i >= CITY0 && i < CITY0 + CITY_N;
function cityStats() {
  if (!S.cityOn) return { pop: 0, cap: 0, inc: 0, malls: 0 };
  let pop = 0, cap = 0, malls = 0;
  for (let k = 0; k < CITY_N; k++) {
    const b = S.plots[CITY0 + k]; if (!b || !b.type || b.lv < 1) continue;
    const d = B[b.type];
    if (d.civ) { const c = d.civ * Math.pow(b.lv, 1.2); cap += c; if (!b.destroyed) pop += c * (b.hp / bHp(b.type, b.lv)); }
    if (b.type === 'mall' && !b.destroyed) malls += b.lv;
  }
  return { pop: Math.round(pop), cap: Math.round(cap), malls, inc: pop * 0.25 * (1 + 0.12 * malls) * incomeMul(S) };
}

    && (cat === 'all' || B[b.type].cat === cat || (cat === 'eco' && b.type === 'hq')))
    .sort((a, c) => bCost(a.type, a.lv + 1) - bCost(c.type, c.lv + 1));

}

<script>

const BLOC_NAMES = ['Northern Atlantic Pact', 'Coral Union', 'Southern Treaty Organization', 'Iron League', 'Pacific Accord', 'Tidewater Alliance', 'Meridian Bloc', 'Free Isles Compact', 'Basalt Entente', 'Archipelago Union', 'Leeward Concord', 'Equator League'];

const BLOC_MAX = 8, FOUND_COST = 250000;
const blocs = () => (S && S.blocs) || [];
const blocOf = id => blocs().find(c => c.members.includes(id)) || null;
const sameBloc = (a, b) => { const c = blocOf(a); return !!c && a !== b && c.members.includes(b); };
const myBloc = () => blocOf('player');
const blocById = id => blocs().find(c => c.id === id);

const memberName = id => id === 'player' ? S.name : (botById(id) || {}).island || '?';
const blocAvgOp = c => { const bots = c.members.filter(m => m !== 'player').map(botById).filter(Boolean); return bots.length ? bots.reduce((a, b) => a + rel(b).op, 0) / bots.length : 0; };

function newBloc(members, name, color) {
  S.blocSeq = (S.blocSeq || 0) + 1;
  const used = new Set(blocs().map(c => c.name));
  const nm = name || BLOC_NAMES.find(n => !used.has(n)) || 'Coalition ' + S.blocSeq;
  const cl = color || BLOC_COLORS.find(c => !blocs().some(b => b.color === c)) || pick(BLOC_COLORS);
  const c = { id: S.blocSeq, name: nm, color: cl, members, leader: members[0], founded: S.time };
  S.blocs.push(c); mapCache = null; return c;
}
// the atoll starts with a few coalitions already in place
function initBlocs() {
  S.blocs = S.blocs || []; S.blocQueue = S.blocQueue || [];
  if (S.blocShare == null) S.blocShare = 0.1;
  if (S.blocsInit) return;
  S.blocsInit = true;
  const pool = S.bots.filter(b => !blocOf(b.id)).sort(() => Math.random() - 0.5);
  for (let k = 0; k < 4 && pool.length >= 3; k++) {

}

  if (c.members.length < 2) { S.blocs = S.blocs.filter(x => x !== c); if (!quiet) log('news', 'Coalitions', `The ${c.name} has dissolved.`); }

// ---------- collective defense ----------
// someone hit a coalition member: the other members answer
function blocResponse(attacker, victimId) {

    if (m === 'player') { if (S.blocShare > 0 && !peaceWith(attacker)) S.blocQueue.push({ kind: 'player', to: attacker.id, at: S.time + rand(8, 20), bloc: c.id }); continue; }

  }

    log('news', 'Coalitions', `The ${c.name} invokes collective defense: ${answer.length} member${answer.length > 1 ? 's' : ''} will strike ${attacker.island} for attacking ${memberName(vid)}.`);
    if (vid === 'player' || c.members.includes('player')) callout('ally', `${c.name}: collective defense`, `${answer.map(b => b.island).slice(0, 4).join(', ')}${answer.length > 4 ? ' and others' : ''} will strike ${attacker.island}.`, c.color);
  }
}
// the player attacked a coalition member: every other member retaliates against the player
function blocPlayerAggression(b) {

  if (helpers.length) callout('war', `${c.name} scrambles`, `${helpers.length} member${helpers.length > 1 ? 's' : ''} sent fighters to defend ${b.island}.`, c.color);

// the player's own contribution to a collective strike, resolved without leaving your island
function playerCollective(q) {

  log('sys', 'Coalitions', `Collective strike on ${t.island}: ${listWeapons(wave)}. ${hits} hits, ${destroyed} destroyed, ${fmt(loot)} taken.`);

// ---------- player actions ----------
function foundBloc(name) {

    log('news', 'Coalitions', `${b.island} joined the ${c.name}.`); Sound.ui('build');

}
function applyBloc(cid) {

<script>
'use strict';
// Update 12: Seasons. Decorations follow the real calendar on this device: Halloween decorations are up
// until October 31st is over, then Harvest, Christmas, New Year, Valentine's, St. Patrick's, Easter and
// Summer each come and go on their own dates. The Season Shop sells limited items that can only be
// bought while their season is running; once bought they are yours to keep and show off all year.

// ================= Calendar =================
function easterDate(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
