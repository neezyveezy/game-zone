<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Type or Sink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b2e;--panel:#fffaf2;--accent:#ff6b2c;--accent-d:#c24a17;--blue:#4f7cff;--blue-d:#2f4fb8;--good:#22a866;--good-d:#167a49;--bad:#e5484d;--muted:#6b6880;--line:#e9e2d4;--gold:#ffc83d;--gold-d:#c9921a;--purple:#8b5cf6;--purple-d:#6236c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1b2e;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink)}
#cv{position:fixed;inset:0;display:block}
button,select,textarea{font-family:inherit}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
.screen.active{display:flex}
.panel{background:var(--panel);border-radius:26px;padding:22px;box-shadow:0 8px 0 rgba(0,0,0,.22),0 24px 60px rgba(0,0,0,.4);width:min(620px,100%);max-height:100%;overflow:auto;margin:auto}
.panel.wide{width:min(820px,100%)}
.panel h2{margin:0 0 4px;font-size:30px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{font-weight:600;font-size:19px;border:0;border-radius:16px;padding:13px 20px;background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-d);cursor:pointer;transition:transform .07s,box-shadow .07s,filter .15s;user-select:none}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-d)}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.btn.green{background:var(--good);box-shadow:0 5px 0 var(--good-d)}
.btn.gold{background:var(--gold);color:#4a3000;box-shadow:0 5px 0 var(--gold-d)}
.btn.purple{background:var(--purple);box-shadow:0 5px 0 var(--purple-d)}
.btn.ghost{background:#ece6da;color:var(--ink);box-shadow:0 5px 0 #c9c0ae}
.btn.small{font-size:15px;padding:8px 14px;border-radius:12px;box-shadow:0 3px 0 #c9c0ae}
.btn.big{font-size:24px;padding:16px 22px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.label{font-weight:600;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
#home{justify-content:flex-start;padding-left:max(16px,7vw)}
.home{display:flex;flex-direction:column;gap:12px;width:min(390px,100%)}
.title{font-size:clamp(54px,10vw,96px);font-weight:700;color:#fff;line-height:.86;letter-spacing:1px;text-shadow:0 6px 0 #b3261e,0 12px 30px rgba(0,0,0,.55);margin-bottom:4px}
.title span{color:#ffd23f}
.tag{color:#ffe7d6;font-size:19px;margin-bottom:6px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.who{color:#fff;font-size:15px;opacity:.9;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.halfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.halfrow .btn{font-size:16px;padding:11px 10px}
#homeTop{position:fixed;top:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:5}
.badge{background:rgba(255,250,242,.96);border-radius:14px;padding:7px 12px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.25);display:flex;align-items:center;gap:8px}
.lvl{background:var(--purple);color:#fff;border-radius:10px;padding:2px 8px;font-size:14px}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc83d 45%,#c9921a);box-shadow:inset 0 0 0 2px #b07a0a;vertical-align:middle}
.xpbar{height:8px;background:#e7e0d3;border-radius:5px;overflow:hidden;width:70px}
.xpbar div{height:100%;background:var(--purple)}
@media (max-width:820px){#home{justify-content:center;align-items:flex-start;padding-top:64px;padding-left:16px}.home{align-items:stretch;text-align:center}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.card{text-align:left;border:3px solid transparent;background:#fff;border-radius:16px;padding:10px;cursor:pointer;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.card b{font-size:16px}.card small{color:var(--muted);font-size:12.5px;line-height:1.25}
.card .sw{height:34px;border-radius:10px;margin-bottom:6px}
.card.sel{border-color:var(--accent);background:#fff3ea}
.card:disabled{cursor:default;opacity:.45}.card.sel:disabled{opacity:1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:0;background:#fff;border-radius:12px;padding:9px 14px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.seg.bigseg button{font-size:19px;padding:12px 20px}
.seg button.sel{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-d)}
.seg button:disabled{cursor:default}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:42px;height:42px;border-radius:12px;border:0;font-size:24px;font-weight:700;background:#fff;box-shadow:0 3px 0 var(--line);cursor:pointer;color:var(--ink)}
.stepper span{font-size:26px;font-weight:700;min-width:30px;text-align:center}
.code{font-size:44px;font-weight:700;letter-spacing:6px;color:var(--accent)}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.prow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 var(--line)}
.prow canvas{width:40px;height:40px;border-radius:50%;flex:none}
.prow .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;background:#ece6da;color:var(--muted);white-space:nowrap}
.pill.host{background:#ffe1cc;color:var(--accent-d)}
.pill.t0{background:#ffd9da;color:#b3262b}.pill.t1{background:#d6e4ff;color:#1f4fb8}
input.txt,textarea.txt,select.txt{font:inherit;font-size:20px;padding:11px 14px;border-radius:14px;border:3px solid var(--line);background:#fff;outline:none;min-width:0;color:var(--ink)}
textarea.txt{font-size:16px;width:100%;min-height:80px;resize:vertical}
select.txt{font-size:16px;padding:8px 10px}
input.txt:focus,textarea.txt:focus{border-color:var(--accent)}
#onlineStatus{min-height:24px;margin-top:12px;font-weight:600}
.cust{display:grid;grid-template-columns:240px 1fr;gap:18px}
@media (max-width:640px){.cust{grid-template-columns:1fr}}
#pcv{width:240px;height:300px;border-radius:22px;background:#ffe9d6;justify-self:center}
.opt{margin-bottom:10px}
.opt .ol{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sws button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d8d0c0;cursor:pointer;padding:0}
.sws button.sel{box-shadow:0 0 0 3px var(--accent)}
.cyc{display:flex;align-items:center;gap:8px}
.cyc button{width:36px;height:36px;border-radius:10px;border:0;background:#fff;box-shadow:0 3px 0 var(--line);font-size:18px;font-weight:700;cursor:pointer;color:var(--ink)}
.cyc span{min-width:130px;text-align:center;font-weight:600;font-size:17px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tabs button{border:0;background:#fff;border-radius:12px;padding:8px 14px;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.tabs button.sel{background:var(--purple);color:#fff;box-shadow:0 3px 0 var(--purple-d)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{background:#fff;border-radius:16px;padding:10px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:3px solid transparent}
.item.eq{border-color:var(--good)}
.item canvas{width:80px;height:80px}
.item b{font-size:15px}
.item .btn{width:100%;font-size:15px;padding:8px}
.item .lock{font-size:14px;color:var(--muted);font-weight:600;padding:8px 0}
#shopMsg{min-height:22px;font-weight:600;margin-top:8px}
table.lbt{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:15px}
.lbt th{text-align:left;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1px;padding:0 8px}
.lbt td{background:#fff;padding:8px;box-shadow:0 3px 0 var(--line)}
.lbt td:first-child{border-radius:12px 0 0 12px;font-weight:700;width:40px;text-align:center}
.lbt td:last-child{border-radius:0 12px 12px 0}
#hud{padding:0;pointer-events:none}
#hud .top{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;padding:0 70px}
#prompt{background:rgba(255,250,242,.96);border-radius:22px;padding:10px 22px 12px;text-align:center;width:min(500px,100%);box-shadow:0 6px 0 rgba(0,0,0,.2),0 14px 30px rgba(0,0,0,.3)}
#pRound{font-size:13px;letter-spacing:2px;color:var(--muted);font-weight:600}
#pQ{font-size:17px;font-weight:500;min-height:20px}
#pBig{font-size:clamp(24px,5.2vw,42px);font-weight:700;line-height:1.05;color:var(--accent);overflow-wrap:anywhere}
#pRule{display:none;margin:6px auto 0;font-weight:700;font-size:17px;background:var(--ink);color:#ffd23f;border-radius:10px;padding:3px 12px;width:max-content;max-width:100%}
#timer{height:10px;background:#e7e0d3;border-radius:6px;overflow:hidden;margin-top:8px}
#timerFill{height:100%;background:var(--good);width:100%;border-radius:6px}
#pNeed{font-size:14.5px;margin-top:6px;font-weight:600;min-height:18px}
#pNeed.bad{color:var(--bad)}#pNeed.ok{color:var(--good)}
.corner{position:absolute;top:12px;pointer-events:auto}
#quitBtn{left:12px}
#muteBtn{left:64px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,250,242,.95);font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:var(--ink)}
#aliveBox{right:12px;background:rgba(255,250,242,.95);border-radius:14px;padding:9px 14px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.25);pointer-events:none}
#streakBox{position:absolute;right:12px;top:64px;background:rgba(255,250,242,.95);border-radius:14px;padding:7px 12px;font-weight:700;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.25);display:none}
#streakBox.fire{background:linear-gradient(90deg,#ff7a00,#ffcc33);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#feed{position:absolute;left:12px;top:70px;display:flex;flex-direction:column;gap:4px;max-width:46vw}
#feed div{background:rgba(20,16,30,.7);color:#fff;border-radius:10px;padding:5px 10px;font-size:14px;animation:fade 4.5s forwards}
@keyframes fade{0%{opacity:0;transform:translateX(-10px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#inputBar{position:absolute;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 16px}
#fb{min-height:28px;font-weight:700;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.8);font-size:19px;text-align:center}
#fb.good{color:#7dffb5}#fb.bad{color:#ffb0b0}
.inrow{pointer-events:auto;display:flex;gap:8px;width:min(580px,100%)}
#answer{flex:1;font:inherit;font-size:23px;font-weight:600;padding:12px 16px;border-radius:18px;border:4px solid #fff;outline:none;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);min-width:0;color:var(--ink);text-transform:uppercase}
#answer:focus{border-color:#ffd23f}
#answer:disabled{background:#e9e4da;color:var(--muted)}
#answer::placeholder{text-transform:none;font-weight:500}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
#deadBar{display:none;pointer-events:auto;background:rgba(255,250,242,.96);border-radius:18px;padding:10px 16px;font-weight:600;align-items:center;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#coach{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:120px;width:min(460px,calc(100% - 32px));background:#fff;border:4px solid var(--purple);border-radius:20px;padding:12px 16px;font-size:17px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:auto}
#coach .row{margin-top:8px}
@media (max-width:640px){#hud .top{top:62px;padding:0 10px}#feed{top:auto;bottom:110px}#prompt{padding:8px 14px 10px}#streakBox{top:auto;bottom:96px}#coach{bottom:150px}}
.res{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.res .prow .place{font-size:18px;font-weight:700;width:34px;text-align:center}
.res .prow.me{outline:3px solid var(--accent)}
.res .stat{font-size:13px;color:var(--muted);text-align:right}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.award{background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 3px 0 var(--line);display:flex;gap:8px;align-items:center}
.award canvas{width:40px;height:40px;border-radius:50%;flex:none}
.award b{display:block;font-size:13px;color:var(--purple);text-transform:uppercase;letter-spacing:.5px}
.award span{font-size:14px;font-weight:600}
.award small{display:block;color:var(--muted);font-size:12.5px}
.rewards{background:linear-gradient(135deg,#f3edff,#fff6dc);border-radius:16px;padding:12px 14px;margin:14px 0;font-weight:600;display:none}
.rewards .big{font-size:20px}
.rewards .xpbar{width:100%;height:12px;margin-top:6px}
.rewards .lvup{color:var(--purple);font-size:17px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(10,8,20,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal.show{display:flex}
#newsList{padding-left:20px;line-height:1.45;font-size:16.5px}
#newsList li{margin-bottom:6px}
.howto ol{padding-left:22px;line-height:1.5;font-size:17px}
.howto li{margin-bottom:6px}
.cbox{background:#fff;border-radius:14px;padding:10px;box-shadow:0 3px 0 var(--line);margin-top:6px}
.citem{display:flex;align-items:center;gap:8px;padding:4px 0}
.citem .nm{flex:1;font-weight:600}
.citem button{border:0;background:#ffe1e1;color:#b3262b;border-radius:8px;width:28px;height:28px;font-weight:700;cursor:pointer}
#cErr{color:var(--bad);font-weight:600;min-height:20px;font-size:14px}
label.chk{display:flex;align-items:center;gap:8px;font-weight:600;margin:8px 0;cursor:pointer}
label.chk input{width:20px;height:20px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="homeTop">
  <button class="btn gold small" id="newsBtn" data-i18n="whatsNew" style="box-shadow:0 3px 0 var(--gold-d)"></button>
  <div class="badge"><span class="lvl" id="hLvl">Lv 1</span><div class="xpbar"><div id="hXp" style="width:0%"></div></div><span class="coin"></span><span id="hCoins">0</span></div>
</div>

<div id="home" class="screen active">
  <div class="home">
    <div class="title"><span data-i18n="title1" style="color:#fff"></span><br><span data-i18n="title2"></span></div>
    <div class="tag" data-i18n="tag"></div>
    <button class="btn big" data-go="solo" data-i18n="playSolo"></button>
    <button class="btn blue big" data-go="online" data-i18n="playOnline"></button>
    <div class="halfrow">
      <button class="btn green" data-go="custom" data-i18n="customize"></button>
      <button class="btn purple" data-go="shop" data-i18n="shop"></button>
    </div>
    <div class="halfrow">
      <button class="btn ghost" data-go="howto" data-i18n="howto"></button>
      <button class="btn ghost" id="tutBtn" data-i18n="tutorial"></button>
      <button class="btn ghost" data-go="lb" data-i18n="leaderboard"></button>
      <button class="btn ghost" data-go="settings" data-i18n="settings"></button>
    </div>
    <div class="who" id="who"></div>
  </div>
</div>

<div id="settings" class="screen">
  <div class="panel">
    <h2 data-i18n="settingsTitle"></h2>
    <div class="label" data-i18n="language"></div>
    <div class="seg bigseg" id="langSeg"><button data-lang="en">English</button><button data-lang="nl">Nederlands</button></div>
    <div class="muted" style="margin-top:8px" data-i18n="langNote"></div>
    <div class="label" data-i18n="sound"></div>
    <div class="seg bigseg" id="soundSeg"><button data-snd="on" data-i18n="on"></button><button data-snd="off" data-i18n="off"></button></div>
    <div class="label" data-i18n="music"></div>
    <div class="seg bigseg" id="musicSeg"><button data-mus="on" data-i18n="on"></button><button data-mus="off" data-i18n="off"></button></div>
    <div class="row end" style="margin-top:18px"><button class="btn green" data-go="home" data-i18n="done"></button></div>
  </div>
</div>

<div id="solo" class="screen">
  <div class="panel">
    <h2 data-i18n="soloTitle"></h2>
    <div class="muted" data-i18n="soloDesc"></div>
    <div id="soloSettings"></div>
    <div class="row end" style="margin-top:18px">
      <button class="btn ghost" data-go="home" data-i18n="back"></button>
      <button class="btn big" id="soloStart" data-i18n="start"></button>
    </div>
  </div>
</div>

<div id="online" class="screen">
  <div class="panel">
    <h2 data-i18n="onlineTitle"></h2>
    <div class="muted" data-i18n="onlineDesc"></div>
    <div class="label" data-i18n="hostGame"></div>
    <button class="btn blue" id="createBtn" data-i18n="createRoom"></button>
    <div class="label" data-i18n="joinGame"></div>
    <div class="row">
      <input class="txt" id="joinCode" data-i18n-ph="codePh" maxlength="6" style="flex:1;text-transform:uppercase;letter-spacing:3px">
      <button class="btn" id="joinBtn" data-i18n="join"></button>
    </div>
    <div id="onlineStatus"></div>
    <div class="row end" style="margin-top:8px"><button class="btn ghost" data-go="home" data-i18n="back"></button></div>
  </div>
</div>

<div id="lobby" class="screen">
  <div class="panel">
    <div class="row" style="justify-content:space-between">
      <div><div class="label" style="margin:0" data-i18n="roomCode"></div><div class="code" id="roomCode">-----</div></div>
      <button class="btn ghost small" id="copyCode" data-i18n="copy"></button>
    </div>
    <div class="label" data-i18n="players"></div>
    <div class="plist" id="lobbyPlayers"></div>
    <div class="muted" id="lobbyLang" style="margin-top:10px;font-weight:600"></div>
    <div id="lobbySettings"></div>
    <div class="label" data-i18n="customTitle"></div>
    <div class="muted small" data-i18n="customHelp"></div>
    <div class="cbox"><div id="customList"></div>
      <div id="customForm">
        <input class="txt" id="cName" maxlength="24" data-i18n-ph="customName" style="width:100%;font-size:16px;margin-top:6px">
        <textarea class="txt" id="cWords" maxlength="6000" data-i18n-ph="customWords" style="margin-top:6px"></textarea>
        <div id="cErr"></div>
        <div class="row" style="justify-content:space-between">
          <label class="chk"><input type="checkbox" id="cOnly"><span data-i18n="customOnly"></span></label>
          <button class="btn small" id="cAdd" data-i18n="customAdd" style="box-shadow:0 3px 0 var(--accent-d)"></button>
        </div>
      </div>
    </div>
    <div class="muted" id="lobbyWait" style="margin-top:14px;font-weight:600" data-i18n="waitHost"></div>
    <div class="row end" style="margin-top:16px">
      <button class="btn ghost" id="lobbyLeave" data-i18n="leave"></button>
      <button class="btn big" id="lobbyStart" data-i18n="startGame"></button>
    </div>
  </div>
</div>

<div id="custom" class="screen">
  <div class="panel wide">
    <h2 data-i18n="custTitle"></h2>
    <div class="cust">
      <div style="display:flex;flex-direction:column;gap:10px;align-items:center">
        <canvas id="pcv"></canvas>
        <input class="txt" id="nameIn" maxlength="14" data-i18n-ph="namePh" style="width:240px;text-align:center">
        <button class="btn ghost small" id="randBtn" data-i18n="randomize"></button>
        <div class="muted small" data-i18n="custShopHint" style="text-align:center;max-width:240px"></div>
      </div>
      <div id="custOpts"></div>
    </div>
    <div class="row end" style="margin-top:14px"><button class="btn purple" data-go="shop" data-i18n="shop"></button><button class="btn green" data-go="home" data-i18n="done"></button></div>
  </div>
</div>

function bases(k,L){
  const out=[k];
  if(k.endsWith('s'))out.push(k.slice(0,-1));
  if(L==='en'){if(k.endsWith('es'))out.push(k.slice(0,-2));if(k.endsWith('ies'))out.push(k.slice(0,-3)+'y')}

}

const RULECACHE={};
function genRules(list){
  const keys=list.map(x=>x[0]),n=keys.length,out=[];
  const cnt=f=>{let c=0;for(const k of keys)if(f(k))c++;return c};
  for(const L of 'abcdefghijklmnopqrstuvwxyz'){
    if(cnt(k=>k[0]===L)>=6)out.push({t:'start',v:L});
    if(cnt(k=>k.endsWith(L))>=6)out.push({t:'end',v:L});
    const h=cnt(k=>k.includes(L));if(h>=6&&h<=n*.55)out.push({t:'has',v:L});
  }
  for(let m=6;m<=13;m++){const c=cnt(k=>k.length>=m);if(c>=8&&c<=n*.6)out.push({t:'min',v:m})}
  for(let m=3;m<=7;m++){const c=cnt(k=>k.length<=m);if(c>=6&&c<=n*.6)out.push({t:'max',v:m})}
  for(let m=4;m<=12;m++){if(cnt(k=>k.length===m)>=5)out.push({t:'len',v:m})}
  for(const L of 'eaio'){const c=cnt(k=>!k.includes(L));if(c>=8&&c<=n*.7)out.push({t:'without',v:L})}
  for(const L of 'abcdefghijklmnopqrstuvwxyz')for(const m of[7,9,11]){if(cnt(k=>k[0]===L&&k.length>=m)>=4&&cnt(k=>k[0]===L)>=8)out.push({t:'startmin',v:L,n:m})}
  {const c=cnt(k=>/(.)\1/.test(k));if(c>=6&&c<=n*.6)out.push({t:'double',v:''})}
  return out;
}

function rulePass(r,k,b){
  if(!r)return true;
  switch(r.t){case'start':return k[0]===r.v;case'end':return k.endsWith(r.v)||(!!b&&b.endsWith(r.v));case'has':return k.includes(r.v);case'min':return k.length>=r.v;case'without':return!k.includes(r.v);

}

function blockStyle(skin,base,wi,j,b,T){

  if(b.pen)return{f:'#6b6b78',tx:'#ffb0b0',s:'#3e3e48'};
  switch(skin){
    case'team':return{f:wi%2?shade(base,-14):shade(base,4),tx:'#fff'};
    case'wood':return{f:wi%2?'#9c6a3c':'#b07a46',tx:'#fff4e0',grain:1};
    case'stone':return{f:(j+wi)%2?'#8a8d96':'#9da0a8',tx:'#2a2a33',s:'rgba(0,0,0,.35)'};
    case'gold':return{f:wi%2?'#f2b91f':'#ffd54a',tx:'#7a4a00',shine:1};
    case'ice':return{f:'rgba(185,232,255,.88)',tx:'#1d4f80',s:'rgba(255,255,255,.9)'};
    case'candy':return{f:j%2?'#ff6fa8':'#ffffff',tx:j%2?'#fff':'#ff3d7f',s:'rgba(200,40,100,.4)'};
    case'neon':{const hue=(j*24+wi*60+T*90)%360;return{f:'#160f2e',tx:`hsl(${hue},100%,65%)`,s:`hsl(${hue},100%,60%)`,glow:1}}

    default:return{f:wi%2?shade(base,-16):shade(base,4),tx:lum(base)>.6?'#2a2233':'#fff'};
  }
}

  if(!inMenu){

const inp=$('#answer');
function meP(){return view&&view.players.find(p=>p.id===myId)}
function updateHUD(){
  if(screen!=='hud'||!view)return;

  if(st.gid!==lastGid){lastGid=st.gid;lastPhase=null;lastRound=0}

function updateCoach(st,me){
  const box=$('#coach');
  if(!st.tutorial||role!=='solo'||tutState.hidden){box.style.display='none';return}
  let key;
  if(st.phase==='intro'&&st.round===1)key='intro';
  else if(st.phase==='question')key=me&&me.locked?'locked':'q';
  else if(st.phase==='reveal')key='reveal';
  else if(st.phase==='rise')key='rise';
  else if(st.phase==='intro')key=st.round>=4?'done':'r2';
  else{box.style.display='none';return}
  if(tutState.done)key='done';
  if(key==='done'&&!tutState.done){tutState.done=true;if(!prog.tut){prog.tut=true;prog.coins+=50;prog.xp+=50;saveProg();sfx('buy')}}
  if(key!==coachKey){coachKey=key;$('#coachTxt').textContent=t('tut_'+key);const bb=$('#coachBtns');bb.innerHTML='';
    if(key==='done'){const a=document.createElement('button');a.className='btn ghost small';a.textContent=t('tut_menu');a.onclick=()=>toMenu();
      const b=document.createElement('button');b.className='btn purple small';b.style.boxShadow='0 3px 0 var(--purple-d)';b.textContent=t('tut_keep');b.onclick=()=>{tutState.hidden=true;box.style.display='none'};bb.append(a,b)}}
  box.style.display='block';
}

let lastRewards={};
function grantRewards(st,mine){
  if(lastRewards[st.gid])return lastRewards[st.gid];
  if(st.tutorial||!mine||prog.rewarded.includes(st.gid))return null;
  prog.rewarded.push(st.gid);if(prog.rewarded.length>40)prog.rewarded.splice(0,prog.rewarded.length-40);
  const n=st.results.length,won=st.teams?mine.team===st.winnerTeam:(n>1&&mine.place===1);
  const awards=(st.awards||[]).filter(a=>a.pid===mine.id).length;
  const coins=10+Math.floor(mine.total/3)+mine.rounds*2+(n>1?(won?40:mine.place===2?25:mine.place===3?12:0):0)+awards*10;
  const xp=25+mine.total+mine.rounds*10+(won?60:0);
  const before=levelInfo(prog.xp).level;prog.coins+=coins;prog.xp+=xp;const after=levelInfo(prog.xp).level;saveProg();
  LB.push({n:mine.name,r:mine.rounds,h:mine.height,w:won?1:0,m:st.map,md:st.mode,d:Date.now()});
  LB.sort((a,b)=>(b.r-a.r)||(b.h-a.h));if(LB.length>300)LB.length=300;store('tos_lb',LB);
  return lastRewards[st.gid]={coins,xp,up:after>before?after:0};
}

function startGame(settings,humans){
  const names=shuffle((settings.lang==='nl'?BOTNAMES_NL:BOTNAMES).slice());
  let roster=humans.map(h=>Object.assign({},h));let bots=Math.max(0,settings.bots|0);
  if(settings.mode==='teams'&&!settings.tutorial){if(roster.length+bots<2)bots=2-roster.length;if((roster.length+bots)%2===1)bots+=(roster.length+bots<8)?1:-1}
  const mk=d=>settings.diff==='mixed'?pick(['easy','normal','hard','insane']):d;
  for(let i=0;i<bots;i++)roster.push({id:'bot'+i,name:names[i%names.length],look:randomLook(),isBot:true,diff:mk(settings.diff)});
  if(settings.mode==='teams'&&!settings.tutorial){const hum=shuffle(roster.filter(p=>!p.isBot)),bt=roster.filter(p=>p.isBot);roster=hum.concat(bt);roster.forEach((p,i)=>p.team=i%2)}
  shuffle(roster);
  game=new Game(settings,roster,{onState:(st,imp)=>{if(role==='host')sendState(st,imp)}});
  view=game.state;overShown=false;myPick={round:-1,word:'',len:0,gid:''};resetVis();sceneKey='';showScreen('hud');
}

  c.fillStyle='#fff3e6';rr(c,0,0,80,80,14);c.fill();

function status(m){$('#onlineStatus').textContent=m}
function loadPeer(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=()=>res();s.onerror=()=>{s.remove();rej(new Error(t('libErr')))};document.head.appendChild(s)})}
const makeCode=()=>Array.from({length:5},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('');
function broadcast(m){for(const c of net.conns.values()){try{if(c.open)c.send(m)}catch(e){}}}
function broadcastLobby(){broadcast({t:'lobby',lobby:net.lobby})}
function sendState(st,imp){const now=performance.now();if(imp||now-net.lastSend>110){net.lastSend=now;broadcast({t:'state',s:st})}}
function leaveNet(){try{if(net.host)net.host.close()}catch(e){}try{if(net.peer)net.peer.destroy()}catch(e){}net.peer=null;net.host=null;net.conns.clear();net.lobby=null;net.votes.clear();net.voteN=0;net.voteM=0;net.myVote=false}
async function createRoom(){
  status(t('connecting'));try{await loadPeer()}catch(e){status(e.message);return}
  leaveNet();const code=makeCode();const peer=new Peer(PREFIX+code);net.peer=peer;
  peer.on('open',()=>{role='host';myId='host';net.lobby={code,players:[{id:'host',name:profile.name,look:profile.look}],settings:Object.assign({},soloSettings,{bots:Math.min(soloSettings.bots,2),lang,custom:[],customOnly:false})};showScreen('lobby');renderLobby()});
  peer.on('connection',conn=>{conn.on('data',d=>hostOnData(conn,d));conn.on('close',()=>hostOnClose(conn));conn.on('error',()=>hostOnClose(conn))});
  peer.on('error',e=>{if(e.type==='unavailable-id'&&role!=='host'){createRoom();return}if(role!=='host')status(t('connErr',{e:e.type}))});
  peer.on('disconnected',()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}});
}
function hostOnData(conn,d){
  if(!d||typeof d!=='object'||!net.lobby)return;
  if(d.t==='hello'){
    if(game){conn.send({t:'err',code:'started'});setTimeout(()=>conn.close(),400);return}
    const L=net.lobby;if(L.players.length>=8){conn.send({t:'err',code:'full'});setTimeout(()=>conn.close(),400);return}
    if(L.players.some(p=>p.id===conn.peer))return;
    net.conns.set(conn.peer,conn);L.players.push({id:conn.peer,name:cleanName(d.name),look:sanitizeLook(d.look)});
    L.settings.bots=Math.min(L.settings.bots,Math.max(0,8-L.players.length));
    conn.send({t:'welcome',id:conn.peer});broadcastLobby();renderLobby();sfx('pop');
  }else if(!net.conns.has(conn.peer))return;
  else if(d.t==='answer'&&game){const r=game.submit(conn.peer,String(d.w||'').slice(0,40));try{conn.send(Object.assign({t:'fb'},r))}catch(e){}}
  else if(d.t==='typing'&&game)game.setTyping(conn.peer,d.n|0);
  else if(d.t==='rematch')hostVote(conn.peer);
}
function hostOnClose(conn){
  if(!net.conns.has(conn.peer))return;net.conns.delete(conn.peer);if(!net.lobby)return;
  const p=net.lobby.players.find(x=>x.id===conn.peer);net.lobby.players=net.lobby.players.filter(x=>x.id!==conn.peer);net.votes.delete(conn.peer);
  if(game){game.markGone(conn.peer);if(p)addFeed(t('left',{n:p.name}));if(game.state.phase==='over')checkVotes()}else{broadcastLobby();renderLobby()}
}
function hostVote(id){if(!game||game.state.phase!=='over')return;net.votes.add(id);checkVotes()}
function checkVotes(){
  if(!net.lobby)return;const ids=net.lobby.players.map(p=>p.id);const n=ids.filter(i=>net.votes.has(i)).length;
  net.voteN=n;net.voteM=ids.length;broadcast({t:'votes',n,m:ids.length});if(screen==='over')renderResultButtons();
  if(ids.length&&n>=ids.length)startOnline();
}
function startOnline(){if(role!=='host'||!net.lobby)return;net.votes.clear();net.voteN=0;net.lobby.settings.lang=lang;broadcast({t:'start'});startGame(net.lobby.settings,net.lobby.players.map(p=>({id:p.id,name:p.name,look:p.look})))}
async function joinRoom(){
  const code=$('#joinCode').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length<4){status(t('enterCode'));return}
  status(t('connecting'));try{await loadPeer()}catch(e){status(e.message);return}
  leaveNet();const peer=new Peer();net.peer=peer;let got=false;
  const to=setTimeout(()=>{if(!got){status(t('noReach'));leaveNet()}},12000);
  peer.on('open',()=>{const conn=peer.connect(PREFIX+code,{reliable:true,serialization:'json'});net.host=conn;
    conn.on('open',()=>conn.send({t:'hello',name:profile.name,look:profile.look}));
    conn.on('data',d=>{got=true;clearTimeout(to);clientOnData(d)});
    conn.on('close',()=>{if(role==='client'){role=null;game=null;view=null;leaveNet();showScreen('online');status(t('disc'))}})});
  peer.on('error',e=>{clearTimeout(to);status(e.type==='peer-unavailable'?t('noRoom'):t('connErr',{e:e.type}))});
}
function clientOnData(d){
  if(!d||typeof d!=='object')return;
  switch(d.t){
    case'welcome':role='client';myId=d.id;break;
    case'lobby':net.lobby=d.lobby;view=null;net.myVote=false;net.voteN=0;if(screen!=='lobby')showScreen('lobby');renderLobby();break;
    case'start':view=null;overShown=false;net.myVote=false;net.voteN=0;myPick={round:-1,word:'',len:0,gid:''};resetVis();sceneKey='';break;
    case'state':if(!d.s||!Array.isArray(d.s.players))return;view=d.s;if(screen!=='hud'&&d.s.phase!=='over')showScreen('hud');break;
    case'fb':feedback(d);break;
    case'votes':net.voteN=d.n|0;net.voteM=d.m|0;if(screen==='over')renderResultButtons();break;
    case'err':status(t(d.code==='full'?'full':'started'));role=null;leaveNet();break;
  }
}
function renderLobby(){
  const L=net.lobby;if(!L)return;$('#roomCode').textContent=L.code;
  const list=$('#lobbyPlayers');list.innerHTML='';
  for(const p of L.players){const row=document.createElement('div');row.className='prow';const nm=document.createElement('div');nm.className='nm';nm.textContent=p.name+(p.id===myId?t('you'):'');row.append(avatar(p.look,40),nm);
    if(p.id==='host'){const pl=document.createElement('span');pl.className='pill host';pl.textContent=t('host');row.appendChild(pl)}list.appendChild(row)}
  if(L.settings.bots>0){const row=document.createElement('div');row.className='prow';const nm=document.createElement('div');nm.className='nm';const dn=L.settings.diff==='mixed'?t('mixed'):t('diffs')[L.settings.diff];nm.textContent=L.settings.bots>1?t('botsN',{n:L.settings.bots,d:dn}):t('bots1',{d:dn});row.appendChild(nm);list.appendChild(row)}
  $('#lobbyLang').textContent=t('qLang',{l:I18N[L.settings.lang==='nl'?'nl':'en'].langName});
  const isHost=role==='host';
  renderSettings($('#lobbySettings'),L.settings,isHost,s=>{L.settings=s;broadcastLobby();renderLobby()},Math.max(0,8-L.players.length));
  const cl=$('#customList');cl.innerHTML='';const cust=L.settings.custom||[];
  if(!cust.length){const d=document.createElement('div');d.className='muted small';d.textContent=t('customNone');cl.appendChild(d)}
  cust.forEach((c,i)=>{const r=document.createElement('div');r.className='citem';const nm=document.createElement('span');nm.className='nm';nm.textContent=c.name;const cnt=document.createElement('span');cnt.className='pill';cnt.textContent=t('customWordsN',{n:(c.words||[]).length});r.append(nm,cnt);
    if(isHost){const x=document.createElement('button');x.textContent='✕';x.onclick=()=>{L.settings.custom.splice(i,1);broadcastLobby();renderLobby()};r.appendChild(x)}cl.appendChild(r)});
  if(!isHost&&L.settings.customOnly&&cust.length){const d=document.createElement('div');d.className='muted small';d.style.marginTop='6px';d.textContent=t('customOnlyOn');cl.appendChild(d)}
  $('#customForm').style.display=isHost?'block':'none';$('#cOnly').checked=!!L.settings.customOnly;
  $('#lobbyStart').style.display=isHost?'':'none';$('#lobbyWait').style.display=isHost?'none':'block';
}
$('#cAdd').onclick=()=>{
  const L=net.lobby;if(role!=='host'||!L)return;L.settings.custom=L.settings.custom||[];const err=$('#cErr');
  if(L.settings.custom.length>=8){err.textContent=t('customMax');return}
  const name=String($('#cName').value).replace(/[<>&"]/g,'').trim().slice(0,24);
  const seen=new Set(),words=[];for(const w of String($('#cWords').value).split(/[,\n;]+/)){const d=w.replace(/[<>&"]/g,'').trim().slice(0,40),k=norm(d);if(k.length<2||seen.has(k))continue;seen.add(k);words.push(d);if(words.length>=400)break}
  if(!name||words.length<5){err.textContent=t('customErr');sfx('bad');return}
  err.textContent='';L.settings.custom.push({name,words});$('#cName').value='';$('#cWords').value='';sfx('pop');broadcastLobby();renderLobby();
};
$('#cOnly').onchange=e=>{if(role!=='host'||!net.lobby)return;net.lobby.settings.customOnly=e.target.checked;broadcastLobby();renderLobby()};
$('#createBtn').onclick=()=>{sfx('click');createRoom()};
$('#joinBtn').onclick=()=>{sfx('click');joinRoom()};
$('#joinCode').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom()});
$('#copyCode').onclick=()=>{try{navigator.clipboard.writeText(net.lobby.code);$('#copyCode').textContent=t('copied');setTimeout(()=>$('#copyCode').textContent=t('copy'),1500)}catch(e){}};
$('#lobbyLeave').onclick=()=>toMenu();
$('#lobbyStart').onclick=()=>{if(role!=='host'||!net.lobby)return;sfx('go');startOnline()};

/* ================= main loop ================= */
let last=performance.now();
function frame(tm){const dt=Math.min(50,tm-last);last=tm;T=tm/1000;
  if(role==='client'&&view&&view.timeLeft>0)view.timeLeft-=dt;
  try{render(dt);updateHUD();if(screen==='custom')drawPreview()}catch(e){console.error(e)}
  requestAnimationFrame(frame)}
applyLang();saveProfile();updMute();showScreen('home');requestAnimationFrame(frame);
if(prog.news!=='u1')setTimeout(openNews,700);
</script>
