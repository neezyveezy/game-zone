<!doctype html>
<html lang="en">
<head>
<script src="gz-lock.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Type or Sink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b2e;--panel:#fffaf2;--accent:#ff6b2c;--accent-d:#c24a17;--blue:#4f7cff;--blue-d:#2f4fb8;--good:#22a866;--good-d:#167a49;--bad:#e5484d;--muted:#6b6880;--line:#e9e2d4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1b2e;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink)}
#cv{position:fixed;inset:0;display:block}
button{font-family:inherit}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
.screen.active{display:flex}
.panel{background:var(--panel);border-radius:26px;padding:22px;box-shadow:0 8px 0 rgba(0,0,0,.22),0 24px 60px rgba(0,0,0,.4);width:min(620px,100%);max-height:100%;overflow:auto;margin:auto}
.panel h2{margin:0 0 4px;font-size:30px}
.muted{color:var(--muted)}
.btn{font-weight:600;font-size:19px;border:0;border-radius:16px;padding:13px 20px;background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-d);cursor:pointer;transition:transform .07s,box-shadow .07s,filter .15s;user-select:none}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-d)}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.btn.green{background:var(--good);box-shadow:0 5px 0 var(--good-d)}
.btn.ghost{background:#ece6da;color:var(--ink);box-shadow:0 5px 0 #c9c0ae}
.btn.small{font-size:15px;padding:8px 14px;border-radius:12px;box-shadow:0 3px 0 #c9c0ae}
.btn.big{font-size:24px;padding:16px 22px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.label{font-weight:600;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
#home{justify-content:flex-start;padding-left:max(16px,7vw)}
.home{display:flex;flex-direction:column;gap:14px;width:min(380px,100%)}
.title{font-size:clamp(54px,10vw,96px);font-weight:700;color:#fff;line-height:.86;letter-spacing:1px;text-shadow:0 6px 0 #b3261e,0 12px 30px rgba(0,0,0,.55);margin-bottom:4px}
.title span{color:#ffd23f}
.tag{color:#ffe7d6;font-size:19px;margin-bottom:10px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.who{color:#fff;font-size:15px;opacity:.9;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.halfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){#home{justify-content:center;align-items:flex-start;padding-top:28px;padding-left:16px}.home{align-items:stretch;text-align:center}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.card{text-align:left;border:3px solid transparent;background:#fff;border-radius:16px;padding:10px;cursor:pointer;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.card b{font-size:16px}.card small{color:var(--muted);font-size:12.5px;line-height:1.25}
.card .sw{height:34px;border-radius:10px;margin-bottom:6px}
.card.sel{border-color:var(--accent);background:#fff3ea}
.card:disabled{cursor:default;opacity:.45}.card.sel:disabled{opacity:1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:0;background:#fff;border-radius:12px;padding:9px 14px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.seg.bigseg button{font-size:19px;padding:12px 20px}
.seg button.sel{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-d)}
.seg button:disabled{cursor:default}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:42px;height:42px;border-radius:12px;border:0;font-size:24px;font-weight:700;background:#fff;box-shadow:0 3px 0 var(--line);cursor:pointer;color:var(--ink)}
.stepper span{font-size:26px;font-weight:700;min-width:30px;text-align:center}
.code{font-size:44px;font-weight:700;letter-spacing:6px;color:var(--accent)}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.prow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 var(--line)}
.prow canvas{width:40px;height:40px;border-radius:50%}
.prow .nm{font-weight:600;flex:1}
.pill{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;background:#ece6da;color:var(--muted)}
.pill.host{background:#ffe1cc;color:var(--accent-d)}
input.txt{font:inherit;font-size:20px;padding:11px 14px;border-radius:14px;border:3px solid var(--line);background:#fff;outline:none;min-width:0;color:var(--ink)}
input.txt:focus{border-color:var(--accent)}
#onlineStatus{min-height:24px;margin-top:12px;font-weight:600}
.cust{display:grid;grid-template-columns:240px 1fr;gap:18px}
@media (max-width:640px){.cust{grid-template-columns:1fr}}
#pcv{width:240px;height:280px;border-radius:22px;background:#ffe9d6;justify-self:center}
.opt{margin-bottom:10px}
.opt .ol{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sws button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d8d0c0;cursor:pointer;padding:0}
.sws button.sel{box-shadow:0 0 0 3px var(--accent)}
.cyc{display:flex;align-items:center;gap:8px}
.cyc button{width:36px;height:36px;border-radius:10px;border:0;background:#fff;box-shadow:0 3px 0 var(--line);font-size:18px;font-weight:700;cursor:pointer;color:var(--ink)}
.cyc span{min-width:120px;text-align:center;font-weight:600;font-size:17px}
#hud{padding:0;pointer-events:none}
#hud .top{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;padding:0 70px}
#prompt{background:rgba(255,250,242,.96);border-radius:22px;padding:10px 22px 12px;text-align:center;width:min(480px,100%);box-shadow:0 6px 0 rgba(0,0,0,.2),0 14px 30px rgba(0,0,0,.3)}
#pRound{font-size:13px;letter-spacing:2px;color:var(--muted);font-weight:600}
#pQ{font-size:17px;font-weight:500;min-height:20px}
#pBig{font-size:clamp(26px,5.5vw,44px);font-weight:700;line-height:1.05;color:var(--accent);overflow-wrap:anywhere}
#pLetter{display:none;margin:6px auto 0;font-weight:700;font-size:18px;background:var(--ink);color:#ffd23f;border-radius:10px;padding:2px 12px;width:max-content}
#timer{height:10px;background:#e7e0d3;border-radius:6px;overflow:hidden;margin-top:8px}
#timerFill{height:100%;background:var(--good);width:100%;border-radius:6px}
#pNeed{font-size:14.5px;margin-top:6px;font-weight:600;min-height:18px}
#pNeed.bad{color:var(--bad)}#pNeed.ok{color:var(--good)}
.corner{position:absolute;top:12px;pointer-events:auto}
#quitBtn{left:12px}
#muteBtn{left:64px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,250,242,.95);font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:var(--ink)}
#aliveBox{right:12px;background:rgba(255,250,242,.95);border-radius:14px;padding:9px 14px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.25);pointer-events:none}
#feed{position:absolute;left:12px;top:70px;display:flex;flex-direction:column;gap:4px;max-width:46vw}
#feed div{background:rgba(20,16,30,.7);color:#fff;border-radius:10px;padding:5px 10px;font-size:14px;animation:fade 4.5s forwards}
@keyframes fade{0%{opacity:0;transform:translateX(-10px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#inputBar{position:absolute;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 16px}
#fb{min-height:28px;font-weight:700;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.8);font-size:19px;text-align:center}
#fb.good{color:#7dffb5}#fb.bad{color:#ffb0b0}
.inrow{pointer-events:auto;display:flex;gap:8px;width:min(580px,100%)}
#answer{flex:1;font:inherit;font-size:23px;font-weight:600;padding:12px 16px;border-radius:18px;border:4px solid #fff;outline:none;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);min-width:0;color:var(--ink);text-transform:uppercase}
#answer:focus{border-color:#ffd23f}
#answer:disabled{background:#e9e4da;color:var(--muted)}
#answer::placeholder{text-transform:none;font-weight:500}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
#deadBar{display:none;pointer-events:auto;background:rgba(255,250,242,.96);border-radius:18px;padding:10px 16px;font-weight:600;align-items:center;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
@media (max-width:640px){#hud .top{top:62px;padding:0 10px}#feed{top:auto;bottom:110px}#prompt{padding:8px 14px 10px}}
.res{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.res .prow .place{font-size:20px;font-weight:700;width:34px;text-align:center}
.res .prow.me{outline:3px solid var(--accent)}
.res .stat{font-size:13px;color:var(--muted);text-align:right}
.howto ol{padding-left:22px;line-height:1.5;font-size:17px}
.howto li{margin-bottom:6px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="home" class="screen active">
  <div class="home">
    <div class="title"><span data-i18n="title1" style="color:#fff"></span><br><span data-i18n="title2"></span></div>
    <div class="tag" data-i18n="tag"></div>
    <button class="btn big" data-go="solo" data-i18n="playSolo"></button>
    <button class="btn blue big" data-go="online" data-i18n="playOnline"></button>
    <button class="btn green" data-go="custom" data-i18n="customize"></button>
    <div class="halfrow">
      <button class="btn ghost" data-go="howto" data-i18n="howto"></button>
      <button class="btn ghost" data-go="settings" data-i18n="settings"></button>
    </div>
    <div class="who" id="who"></div>
  </div>
</div>

<div id="settings" class="screen">
  <div class="panel">
    <h2 data-i18n="settingsTitle"></h2>
    <div class="label" data-i18n="language"></div>
    <div class="seg bigseg" id="langSeg">
      <button data-lang="en">English</button>
      <button data-lang="nl">Nederlands</button>
    </div>
    <div class="muted" style="margin-top:8px" data-i18n="langNote"></div>
    <div class="label" data-i18n="sound"></div>
    <div class="seg bigseg" id="soundSeg">
      <button data-snd="on" data-i18n="on"></button>
      <button data-snd="off" data-i18n="off"></button>
    </div>
    <div class="label" data-i18n="music"></div>
    <div class="seg bigseg" id="musicSeg">
      <button data-mus="on" data-i18n="on"></button>
      <button data-mus="off" data-i18n="off"></button>
    </div>
    <div class="row end" style="margin-top:18px"><button class="btn green" data-go="home" data-i18n="done"></button></div>
  </div>
</div>

<div id="solo" class="screen">
  <div class="panel">
    <h2 data-i18n="soloTitle"></h2>
    <div class="muted" data-i18n="soloDesc"></div>
    <div id="soloSettings"></div>
    <div class="row end" style="margin-top:18px">
      <button class="btn ghost" data-go="home" data-i18n="back"></button>
      <button class="btn big" id="soloStart" data-i18n="start"></button>
    </div>
  </div>
</div>

<div id="online" class="screen">
  <div class="panel">
    <h2 data-i18n="onlineTitle"></h2>
    <div class="muted" data-i18n="onlineDesc"></div>
    <div class="label" data-i18n="hostGame"></div>
    <button class="btn blue" id="createBtn" data-i18n="createRoom"></button>
    <div class="label" data-i18n="joinGame"></div>
    <div class="row">
      <input class="txt" id="joinCode" data-i18n-ph="codePh" maxlength="6" style="flex:1;text-transform:uppercase;letter-spacing:3px">
      <button class="btn" id="joinBtn" data-i18n="join"></button>
    </div>
    <div id="onlineStatus"></div>
    <div class="row end" style="margin-top:8px"><button class="btn ghost" data-go="home" data-i18n="back"></button></div>
  </div>
</div>

<div id="lobby" class="screen">
  <div class="panel">
    <div class="row" style="justify-content:space-between">
      <div><div class="label" style="margin:0" data-i18n="roomCode"></div><div class="code" id="roomCode">-----</div></div>
      <button class="btn ghost small" id="copyCode" data-i18n="copy"></button>
    </div>
    <div class="label" data-i18n="players"></div>
    <div class="plist" id="lobbyPlayers"></div>
    <div class="muted" id="lobbyLang" style="margin-top:10px;font-weight:600"></div>
    <div id="lobbySettings"></div>
    <div class="muted" id="lobbyWait" style="margin-top:14px;font-weight:600" data-i18n="waitHost"></div>
    <div class="row end" style="margin-top:16px">
      <button class="btn ghost" id="lobbyLeave" data-i18n="leave"></button>
      <button class="btn big" id="lobbyStart" data-i18n="startGame"></button>
    </div>
  </div>
</div>

<div id="custom" class="screen">
  <div class="panel" style="width:min(760px,100%)">
    <h2 data-i18n="custTitle"></h2>
    <div class="cust">
      <div style="display:flex;flex-direction:column;gap:10px;align-items:center">
        <canvas id="pcv"></canvas>
        <input class="txt" id="nameIn" maxlength="14" data-i18n-ph="namePh" style="width:240px;text-align:center">
        <button class="btn ghost small" id="randBtn" data-i18n="randomize"></button>
      </div>
      <div id="custOpts"></div>
    </div>
    <div class="row end" style="margin-top:14px"><button class="btn green" data-go="home" data-i18n="done"></button></div>
  </div>
</div>

<div id="howto" class="screen">
  <div class="panel howto">
    <h2 data-i18n="howtoTitle"></h2>
    <ol id="howtoList"></ol>
    <div class="muted" data-i18n="howtoTip"></div>
    <div class="row end" style="margin-top:14px"><button class="btn" data-go="home" data-i18n="gotIt"></button></div>
  </div>
</div>

<div id="hud" class="screen">
  <button class="iconbtn corner" id="quitBtn">&#10005;</button>
  <button class="iconbtn corner" id="muteBtn"></button>
  <div class="corner" id="aliveBox"></div>
  <div class="top"><div id="prompt">
    <div id="pRound"></div><div id="pQ"></div><div id="pBig"></div><div id="pLetter"></div>
    <div id="timer"><div id="timerFill"></div></div>
    <div id="pNeed"></div>
  </div></div>
  <div id="feed"></div>
  <div id="inputBar">
    <div id="fb"></div>
    <div class="inrow" id="inRow">
      <input id="answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="40">
      <button class="btn" id="sendBtn">GO</button>
    </div>
    <div id="deadBar"><span id="deadTxt"></span><button class="btn small" id="skipBtn" style="box-shadow:0 3px 0 var(--accent-d)" data-i18n="skip"></button></div>
  </div>
</div>

<div id="over" class="screen">
  <div class="panel">
    <h2 id="resTitle"></h2>
    <div class="muted" id="resSub"></div>
    <div class="res" id="resList"></div>
    <div class="muted" id="resWait" style="font-weight:600" data-i18n="waitHostRes"></div>
    <div class="row end">
      <button class="btn ghost" id="resMenu" data-i18n="menu"></button>
      <button class="btn big" id="resAgain"></button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================= utils ================= */
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
function hexRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function shade(h,a){const[r,g,b]=hexRgb(h);const f=v=>clamp(Math.round(v+a*2.55),0,255);return`rgb(${f(r)},${f(g)},${f(b)})`}
function lum(h){const[r,g,b]=hexRgb(h);return(0.299*r+0.587*g+0.114*b)/255}

/* ================= translations ================= */
let lang=load('tos_lang','en');if(lang!=='nl')lang='en';
const I18N={

  try{
    const inGame=screen==='hud'&&view;const hurry=inGame&&view.phase==='question'&&view.timeLeft<5000;
    const spb=60/(inGame?(hurry?150:128):106)/4;
    if(MUS.next<AC.currentTime)MUS.next=AC.currentTime+.05;
    while(MUS.next<AC.currentTime+.2){
      const s=MUS.step,bar=Math.floor(s/16)%4,st=s%16,ch=PROG[bar],t0=MUS.next;

      if(st%4===2)mnote(mtof(ch[0]-12),spb*1.2,'triangle',.16,t0);
      if(st%2===0)mnote(mtof(ch[(st/2)%3]+12),spb*1.5,'square',.03,t0);

  peer.on('connection',conn=>{conn.on('data',d=>hostOnData(conn,d));conn.on('close',()=>hostOnClose(conn));conn.on('error',()=>hostOnClose(conn))});
  peer.on('error',e=>{if(e.type==='unavailable-id'&&role!=='host'){createRoom();return}if(role!=='host')status(t('connErr',{e:e.type}))});
  peer.on('disconnected',()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}});
}
function hostOnData(conn,d){
  if(!d||typeof d!=='object'||!net.lobby)return;
  if(d.t==='hello'){
    if(game){conn.send({t:'err',code:'started'});setTimeout(()=>conn.close(),400);return}
    const L=net.lobby;if(L.players.length>=8){conn.send({t:'err',code:'full'});setTimeout(()=>conn.close(),400);return}
    if(L.players.some(p=>p.id===conn.peer))return;
    net.conns.set(conn.peer,conn);L.players.push({id:conn.peer,name:cleanName(d.name),look:sanitizeLook(d.look)});
    L.settings.bots=Math.min(L.settings.bots,8-L.players.length);
    conn.send({t:'welcome',id:conn.peer});broadcastLobby();renderLobby();sfx('pop');
  }else if(d.t==='answer'&&game){const r=game.submit(conn.peer,String(d.w||'').slice(0,40));try{conn.send(Object.assign({t:'fb'},r))}catch(e){}}
  else if(d.t==='typing'&&game)game.setTyping(conn.peer,d.n|0);
}
function hostOnClose(conn){
  if(!net.conns.has(conn.peer))return;net.conns.delete(conn.peer);if(!net.lobby)return;
  const p=net.lobby.players.find(x=>x.id===conn.peer);net.lobby.players=net.lobby.players.filter(x=>x.id!==conn.peer);
  if(game){game.markGone(conn.peer);if(p)addFeed(t('left',{n:p.name}))}else{broadcastLobby();renderLobby()}
}
async function joinRoom(){
  const code=$('#joinCode').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length<4){status(t('enterCode'));return}
  status(t('connecting'));try{await loadPeer()}catch(e){status(e.message);return}
  leaveNet();const peer=new Peer();net.peer=peer;let got=false;
  const to=setTimeout(()=>{if(!got){status(t('noReach'));leaveNet()}},12000);
  peer.on('open',()=>{const conn=peer.connect(PREFIX+code,{reliable:true,serialization:'json'});net.host=conn;
    conn.on('open',()=>conn.send({t:'hello',name:profile.name,look:profile.look}));
    conn.on('data',d=>{got=true;clearTimeout(to);clientOnData(d)});
    conn.on('close',()=>{if(role==='client'){role=null;game=null;view=null;leaveNet();showScreen('online');status(t('disc'))}})});
  peer.on('error',e=>{clearTimeout(to);status(e.type==='peer-unavailable'?t('noRoom'):t('connErr',{e:e.type}))});
}
function clientOnData(d){
  if(!d||typeof d!=='object')return;
  switch(d.t){
    case'welcome':role='client';myId=d.id;break;
    case'lobby':net.lobby=d.lobby;view=null;if(screen!=='lobby')showScreen('lobby');renderLobby();break;
    case'start':view=null;overShown=false;resetVis();sceneKey='';break;
    case'state':view=d.s;if(screen!=='hud'&&screen!=='over'&&d.s.phase!=='over')showScreen('hud');break;
    case'fb':feedback(d);break;
    case'err':status(t(d.code==='full'?'full':'started'));role=null;leaveNet();break;
  }
}
function renderLobby(){
  const L=net.lobby;if(!L)return;$('#roomCode').textContent=L.code;
  const list=$('#lobbyPlayers');list.innerHTML='';
  for(const p of L.players){const row=document.createElement('div');row.className='prow';const nm=document.createElement('div');nm.className='nm';nm.textContent=p.name+(p.id===myId?t('you'):'');row.append(avatar(p.look,40),nm);
    if(p.id==='host'){const pl=document.createElement('span');pl.className='pill host';pl.textContent=t('host');row.appendChild(pl)}list.appendChild(row)}
  if(L.settings.bots>0){const row=document.createElement('div');row.className='prow';const nm=document.createElement('div');nm.className='nm';const dn=L.settings.diff==='mixed'?t('mixed'):t('diffs')[L.settings.diff];nm.textContent=L.settings.bots>1?t('botsN',{n:L.settings.bots,d:dn}):t('bots1',{d:dn});row.appendChild(nm);list.appendChild(row)}
  $('#lobbyLang').textContent=t('qLang',{l:I18N[L.settings.lang==='nl'?'nl':'en'].langName});
  const isHost=role==='host';
  renderSettings($('#lobbySettings'),L.settings,isHost,s=>{L.settings=s;broadcastLobby();renderLobby()},8-L.players.length);
  $('#lobbyStart').style.display=isHost?'':'none';$('#lobbyWait').style.display=isHost?'none':'block';
}
$('#createBtn').onclick=()=>{sfx('click');createRoom()};
$('#joinBtn').onclick=()=>{sfx('click');joinRoom()};
$('#joinCode').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom()});
$('#copyCode').onclick=()=>{try{navigator.clipboard.writeText(net.lobby.code);$('#copyCode').textContent=t('copied');setTimeout(()=>$('#copyCode').textContent=t('copy'),1500)}catch(e){}};
$('#lobbyLeave').onclick=()=>toMenu();
$('#lobbyStart').onclick=()=>{if(role!=='host'||!net.lobby)return;sfx('go');net.lobby.settings.lang=lang;broadcast({t:'start'});startGame(net.lobby.settings,net.lobby.players.map(p=>({id:p.id,name:p.name,look:p.look})))};

/* ================= main loop ================= */
let last=performance.now();
function frame(tm){const dt=Math.min(50,tm-last);last=tm;T=tm/1000;
  if(role==='client'&&view&&view.timeLeft>0)view.timeLeft-=dt;
  try{render(dt);updateHUD();if(screen==='custom')drawPreview()}catch(e){console.error(e)}
  requestAnimationFrame(frame)}
applyLang();saveProfile();updMute();requestAnimationFrame(frame);
</script>
</body>
