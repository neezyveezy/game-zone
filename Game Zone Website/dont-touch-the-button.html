<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Don't Touch the Button</title>
<style>
:root{--bg:#14121f;--panel:#1f1b33;--line:#2e2850;--text:#f3f0ff;--muted:#a59fc6;--accent:#ffd84a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
#hud{position:fixed;top:0;left:0;right:0;min-height:64px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:10px 20px;background:var(--panel);border-bottom:2px solid var(--line);z-index:20}
#lvl{font-weight:800;color:var(--accent);white-space:nowrap}
#instr{flex:1;min-width:200px;font-size:18px;font-weight:600;text-align:center}
#prog{font-variant-numeric:tabular-nums;font-weight:800;min-width:60px;text-align:right;font-size:22px;white-space:nowrap}
#fails{color:var(--muted);white-space:nowrap;font-size:14px}
@media (max-width:640px){#instr{order:5;flex-basis:100%;font-size:15px}}
#arena{position:fixed;top:64px;left:0;right:0;bottom:0;overflow:hidden;touch-action:none}
#arena.nocursor{cursor:none}
.bigbtn,.cardbtn{border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8f,#ff3b47 40%,#b3121d 80%);box-shadow:0 10px 0 #7a0910,0 18px 30px rgba(0,0,0,.5),inset 0 -6px 12px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;text-shadow:0 2px 0 #7a0910;letter-spacing:1px;text-align:center;line-height:1.05;font-family:inherit}
.bigbtn{position:absolute;left:0;top:0;pointer-events:none;z-index:5}
.bigbtn.hover{filter:brightness(1.18)}
.bigbtn.focus{outline:4px dashed var(--accent);outline-offset:12px}
.bigbtn.green{background:radial-gradient(circle at 35% 30%,#a8ffcb,#3ddc84 45%,#14824a 85%);box-shadow:0 10px 0 #0c5a33,0 18px 30px rgba(0,0,0,.5);text-shadow:0 2px 0 #0c5a33}
.cardbtn{position:relative;width:140px;height:140px;margin:18px auto 6px;border:0;font-size:18px;cursor:pointer}
.cardbtn:active{transform:translateY(6px);box-shadow:0 4px 0 #7a0910}
.target{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a8ffcb,#3ddc84 50%,#1a9b55);box-shadow:0 4px 0 #0f6b39;pointer-events:none;z-index:3;animation:pop .25s ease-out;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0b3d22;font-size:20px}
.target.red{background:radial-gradient(circle at 35% 30%,#ff9da2,#ff3b47 50%,#b3121d);box-shadow:0 4px 0 #7a0910;color:#fff;font-size:10px}
.target.liar{animation:liar 1.1s ease-in-out infinite}
@keyframes pop{from{scale:0}to{scale:1}}
@keyframes liar{0%,100%{scale:1;filter:none}50%{scale:1.08;filter:hue-rotate(-30deg)}}
.player{position:absolute;left:0;top:0;border-radius:8px;background:var(--accent);box-shadow:0 4px 0 #a88a00;z-index:6;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#1a1400;font-weight:900}
#fake{position:absolute;left:0;top:0;pointer-events:none;z-index:30}
.dark{position:absolute;inset:0;pointer-events:none;z-index:25}
#typed{position:absolute;left:16px;right:16px;bottom:12%;text-align:center;font-size:44px;font-weight:900;letter-spacing:10px;color:var(--accent);pointer-events:none}
#typed.phrase{font-size:clamp(18px,4vw,34px);letter-spacing:3px;color:var(--muted)}
#typed .ok{color:var(--accent)}
#typed .sp{display:inline-block;width:.6em}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:var(--accent);color:#1a1400;font-weight:800;padding:8px 16px;border-radius:10px;z-index:40;pointer-events:none;white-space:nowrap;animation:toast 1.8s forwards}
@keyframes toast{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
.popup{position:absolute;background:#fff;color:#222;padding:14px 18px;border-radius:12px;font-weight:700;box-shadow:0 12px 40px rgba(0,0,0,.6);pointer-events:none;z-index:8;max-width:260px;animation:pop .2s ease-out}
#overlay{position:fixed;inset:0;background:rgba(10,8,20,.84);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#overlay.hidden{display:none}
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:30px;max-width:520px;width:100%;text-align:center;max-height:100%;overflow:auto}
.card h1{font-size:34px;line-height:1.1;margin-bottom:10px}
.card h2{font-size:22px;margin:4px 0}
.card p{color:var(--muted);margin:8px 0 14px;font-size:17px;line-height:1.45}
.card hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.card .next{color:var(--accent);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:1px}
.card .stat{font-size:20px;color:var(--text);margin:6px 0}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.go{background:var(--accent);color:#1a1400;border:0;border-radius:12px;padding:14px 28px;font-size:18px;font-weight:800;cursor:pointer;font-family:inherit}
.go.ghost{background:transparent;color:var(--muted);border:2px solid var(--line)}
.go:hover{filter:brightness(1.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin:14px 0}
.lvbtn{padding:10px 0;border-radius:10px;border:2px solid var(--line);background:#2a2547;color:var(--text);font-weight:800;cursor:pointer;font-size:15px;font-family:inherit}
.lvbtn:hover:not(:disabled){border-color:var(--accent)}
.lvbtn:disabled{opacity:.3;cursor:default}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));background:#fff;color:#222;border-radius:14px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:10;text-align:center;font-size:15px}
.dialog .dh{font-weight:800;font-size:20px;margin-bottom:8px}
.dialog p{margin-bottom:18px;color:#555;line-height:1.4}
.dialog.bottom{top:auto;bottom:16px;transform:translateX(-50%)}
.dialog.ad{transform:none;width:240px;padding:16px;text-align:left;font-size:14px}
.dialog.ad .dh{font-size:16px;padding-right:24px}
.dialog.ad p{margin-bottom:12px}
.dialog.fakecard{background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:20px}
.dialog.fakecard h1{font-size:30px;margin-bottom:8px}
.dialog.fakecard p{color:var(--muted)}
.dialog.bsod{background:#1747c8;color:#fff;text-align:left}
.dialog.bsod p{color:#dbe4ff}
.d-red{background:radial-gradient(circle at 35% 30%,#ff8a8f,#ff3b47 40%,#b3121d 85%);color:#fff;border:0;border-radius:999px;padding:14px 34px;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 5px 0 #7a0910;display:inline-flex;flex-direction:column;align-items:center;font-family:inherit}
.d-red small{font-size:9px;font-weight:600;opacity:.85;margin-top:3px}
.d-link{display:block;margin:14px auto 0;color:#999;font-size:12px;text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
.bsod .d-link{color:#b8c8ff}
.d-grey{background:#eee;color:#222;border:0;border-radius:10px;padding:12px 18px;font-size:18px;font-weight:800;margin:4px;cursor:pointer;font-family:inherit;min-width:64px}
.d-grey:hover{background:#ddd}
.ad-x{position:absolute;top:8px;right:10px;background:none;border:0;font-size:18px;color:#888;cursor:pointer;line-height:1;font-family:inherit}
.ad-x.redx{background:radial-gradient(circle at 35% 30%,#ff8a8f,#ff3b47 40%,#b3121d 85%);color:#fff;border-radius:50%;width:26px;height:26px;font-size:13px;top:6px;right:6px}
.stopbtn{position:absolute;left:0;top:0;width:100px;height:60px;border-radius:12px;border:0;background:#d8d4ea;color:#1f1b33;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #8f89ad;z-index:6;font-family:inherit}
.doors{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:18px;z-index:6}
.dcol{display:flex;flex-direction:column;align-items:center}
.sign{background:#fff7d6;color:#3a2a00;padding:8px;border-radius:8px;font-size:13px;font-weight:700;margin-bottom:10px;width:130px;min-height:62px;display:flex;align-items:center;justify-content:center;text-align:center}
.door{width:110px;height:180px;background:#7a4a24;border:4px solid #4a2b12;border-radius:10px 10px 0 0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#ffd9a8;font-family:inherit}
.door:hover{filter:brightness(1.15)}
.door.open{background:#1f6b44;border-color:#124a2e;cursor:default}
.loadbar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,80%);pointer-events:none;text-align:center;font-weight:800}
.loadbar .bar{height:26px;border:3px solid var(--line);border-radius:14px;overflow:hidden;margin-top:8px;background:#0e0c18}
.loadbar .fill{height:100%;width:0;background:var(--accent)}
</style>
</head>
<body>
<div id="hud"><span id="lvl">DON'T TOUCH THE BUTTON</span><span id="instr"></span><span id="prog"></span><span id="fails">Touches: 0</span></div>
<div id="arena"></div>
<div id="overlay" class="hidden"></div>
<script>
const $ = s => document.querySelector(s);
const arena = $('#arena'), ov = $('#overlay'), hud = $('#hud');
let W = 0, H = 0;
function measure(){ arena.style.top = hud.offsetHeight + 'px'; const r = arena.getBoundingClientRect(); W = r.width; H = r.height; }
addEventListener('resize', measure); measure();

let mx = -999, my = -999;
function setMouse(e){ const r = arena.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; }
addEventListener('pointermove', setMouse);
addEventListener('pointerdown', setMouse, true);
addEventListener('pointerup', () => { if(L) L.holding = false; });

const keys = new Set();
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const randv = s => pick([-1, 1]) * s * rand(.85, 1.15);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const TAUNTS = ["do it", "just once", "press me", "nobody's watching", "c'mon", "you know you want to", "I'm so squishy", "boop?"];
const FAIL_LINES = ["It was right there. You couldn't resist.", "The button thanks you for your service.", "Your finger has betrayed you.", "That's not what \"don't\" means.", "The button wins this round.", "Self-control: 0. Button: 1."];

let actx;
function beep(freq, dur, type = 'sine', vol = .15){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}
function shake(el){ el.animate([{translate:'0 0'},{translate:'-12px 4px'},{translate:'10px -6px'},{translate:'-6px 2px'},{translate:'0 0'}], {duration:300}); }
function toast(msg){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; arena.appendChild(d); setTimeout(() => d.remove(), 1800); }

// ---------- level state ----------
let fails = 0, levelIdx = 0, L = null, runStart = 0;

function newLevel(){
  arena.innerHTML = ''; arena.className = ''; keys.clear();
  return {buttons:[], targets:[], updates:[], sched:[], state:'play', t:0, need:0, got:0, mode:null,
    timeLeft:null, timeoutFail:null, xf:null, lag:false, lx:mx, ly:my, fake:null, onKey:null,
    anyClickFails:null, off:{x:0, y:0}, quake:0, player:null, onTargetDown:null, onGot:null,
    holding:false, hudText:null, dark:null, spotOpts:null, tprops:null};
}
function at(t, fn){ L.sched.push({t, fn}); }
function draw(o){
  o.el.style.width = o.el.style.height = (o.r * 2) + 'px';
  o.el.style.left = (o.x - o.r + L.off.x) + 'px';
  o.el.style.top = (o.y - o.r + L.off.y) + 'px';
  if(o.span) o.el.style.fontSize = Math.max(10, o.r * .28) + 'px';
  o.el.style.opacity = o.opacity;
}
function addButton(o = {}){
  const el = document.createElement('div'); el.className = 'bigbtn' + (o.cls ? ' ' + o.cls : '');
  const span = document.createElement('span'); span.textContent = o.label ?? "DON'T"; el.appendChild(span);
  arena.appendChild(el);
  const b = Object.assign({x:W/2, y:H/2, r:70, vx:0, vy:0, move:'static', speed:120, opacity:1, hovering:false, taunt:0}, o, {el, span});
  L.buttons.push(b); draw(b); return b;
}
function btnFar(r, o = {}){ return addButton(Object.assign({r}, farCorner(r), o)); }
function addLiar(x, y){
  const el = document.createElement('div'); el.className = 'target liar'; arena.appendChild(el);
  const b = {x, y, r:26, el, liar:true, move:'static', opacity:1, failMsg:"It was pulsing. Suspiciously. Like a button would."};
  L.buttons.push(b); draw(b); return b;
}
function addTarget(x, y, o = {}){
  const el = document.createElement('div'); el.className = 'target' + (o.cls ? ' ' + o.cls : ''); arena.appendChild(el);
  if(o.label != null) el.textContent = o.label;
  const t = Object.assign({x, y, r:26, move:'static', opacity:1}, L.tprops || {}, o, {el});
  L.targets.push(t); draw(t); return t;
}
function addPlayer(x, y){
  const el = document.createElement('div'); el.className = 'player'; el.textContent = '• •'; arena.appendChild(el);
  L.player = {x, y, r:15, speed:280, el, opacity:1}; draw(L.player);
}
function randomSpot(r, o = {}){
  const m = o.margin ?? r + 16, gap = o.gap ?? 40, tgap = o.tgap ?? 14;
  const ymin = o.ymin ?? m, ymax = o.ymax ?? H - m;
  let best = {x:W/2, y:H/2}, bs = -Infinity;
  for(let i = 0; i < 150; i++){
    const x = rand(m, Math.max(m, W - m)), y = rand(ymin, Math.max(ymin, ymax));
    let s = Infinity;
    for(const b of L.buttons){ if(b !== o.exclude) s = Math.min(s, dist(x, y, b.x, b.y) - b.r - r - gap); }
    for(const t of L.targets) s = Math.min(s, dist(x, y, t.x, t.y) - t.r - r - tgap);
    if(o.avoidPointer){ const p = pointer(); s = Math.min(s, dist(x, y, p.x, p.y) - r - 80); }
    if(L.player) s = Math.min(s, dist(x, y, L.player.x, L.player.y) - r - 70);
    if(s > bs){ bs = s; best = {x, y}; }
    if(s >= 0) break;
  }
  return best;
}
function farCorner(r){
  const p = r + 20, cs = [[p,p],[W-p,p],[p,H-p],[W-p,H-p]], q = L && L.player ? L.player : {x:mx, y:my};
  let best = cs[0], bd = -1;
  for(const c of cs){ const d = dist(c[0], c[1], q.x, q.y); if(d > bd){ bd = d; best = c; } }
  return {x:best[0], y:best[1]};
}
function spawnTarget(o){ const s = randomSpot(26, L.spotOpts || {}); return addTarget(s.x, s.y, o); }
function collect(n, mode){ L.need = n; L.got = 0; L.mode = mode; if(mode === 'all'){ for(let i = 0; i < n; i++) spawnTarget(); } else if(mode === 'one') spawnTarget(); }
function survive(sec){ L.timeLeft = sec; }
function removeTarget(t){ t.el.remove(); const i = L.targets.indexOf(t); if(i >= 0) L.targets.splice(i, 1); }
function hitTarget(t){
  removeTarget(t); L.got++;
  beep(660 + L.got * 40, .09, 'triangle');
  if(L.onGot) L.onGot(L.got);
  if(L.state !== 'play') return;
  if(L.got >= L.need) win();
  else if(L.mode === 'one') spawnTarget();
}
function rawPointer(){ return L && L.lag ? {x:L.lx, y:L.ly} : {x:mx, y:my}; }
function screenPointer(){ let p = rawPointer(); if(L && L.xf) p = L.xf(p.x, p.y); return p; }
function pointer(){ const p = screenPointer(); return {x:p.x - L.off.x, y:p.y - L.off.y}; }
function useFake(){
  arena.classList.add('nocursor');
  const fc = document.createElement('div'); fc.id = 'fake';
  fc.innerHTML = '<svg width="22" height="30" viewBox="0 0 22 30"><path d="M1 1 L1 24 L7 18 L11 28 L15 26 L11 17 L19 17 Z" fill="#fff" stroke="#000" stroke-width="1.5"/></svg>';
  arena.appendChild(fc); L.fake = fc;
}
function addDark(){ const d = document.createElement('div'); d.className = 'dark'; arena.appendChild(d); return d; }
function dialog(html, cls = ''){ const d = document.createElement('div'); d.className = 'dialog ui ' + cls; d.innerHTML = html; arena.appendChild(d); return d; }

arena.addEventListener('pointerdown', e => {
  if(!L || L.state !== 'play' || e.target.closest('.ui')) return;
  const p = pointer();
  for(const b of L.buttons) if(dist(p.x, p.y, b.x, b.y) <= b.r){ if(b.winOnPress) return win(); return fail(b.failMsg || null); }
  for(const t of L.targets) if(dist(p.x, p.y, t.x, t.y) <= t.r + 8){ if(L.onTargetDown) return L.onTargetDown(t); return hitTarget(t); }
  if(L.anyClickFails) return fail(L.anyClickFails);
});

// ---------- movement ----------
function toward(o, x, y, step){ const dx = x - o.x, dy = y - o.y, d = Math.hypot(dx, dy); if(d > 1){ const s = Math.min(d, step); o.x += dx / d * s; o.y += dy / d * s; } }
function move(o, dt){
  switch(o.move){
    case 'follow': { if(mx < -900) break; const q = o.chase === 'player' && L.player ? L.player : pointer(); toward(o, q.x, q.y, o.speed * dt); break; }
    case 'chain': { const d = dist(o.x, o.y, o.lead.x, o.lead.y), gap = (o.r + o.lead.r) * .85; if(d > gap) toward(o, o.lead.x, o.lead.y, d - gap); break; }
    case 'bounce': case 'gravity': {
      if(o.move === 'gravity') o.vy += 900 * dt;
      o.x += o.vx * dt; o.y += o.vy * dt;
      if(o.x < o.r){ o.x = o.r; o.vx = Math.abs(o.vx); }
      if(o.x > W - o.r){ o.x = W - o.r; o.vx = -Math.abs(o.vx); }
      if(o.y < o.r){ o.y = o.r; o.vy = Math.abs(o.vy); }
      if(o.y > H - o.r){ o.y = H - o.r; o.vy = -Math.abs(o.vy); }
      break;
    }
    case 'fly': o.x += o.vx * dt; o.y += o.vy * dt; if(o.x < -120 || o.x > W + 120 || o.y < -120 || o.y > H + 120) o.dead = true; break;
    case 'orbit': o.ang += o.w * dt; o.x = o.cx + Math.cos(o.ang) * o.rad; o.y = o.cy + Math.sin(o.ang) * o.rad; break;
    case 'teleport': o.tt -= dt; if(o.tt <= 0){ o.tt = o.period; const s = randomSpot(o.r, {exclude:o, avoidPointer:true, gap:10}); o.x = s.x; o.y = s.y; o.el.animate([{scale:.2},{scale:1}], {duration:180}); } break;
    case 'sine': o.x = o.cx + (o.ax || 0) * Math.sin(L.t * o.w + (o.ph || 0)); o.y = o.cy + (o.ay || 0) * Math.sin(L.t * (o.w2 || o.w) + (o.ph2 || 0)); break;
    case 'pop': o.age += dt; o.r = o.max * Math.sin(Math.PI * Math.min(1, o.age / o.life)); if(o.age >= o.life) o.dead = true; break;
    case 'drift': if(o.to) toward(o, o.to.x, o.to.y, o.speed * dt); break;
    case 'flee': {
      const p = pointer(), d = dist(o.x, o.y, p.x, p.y);
      if(d < 170 && d > 0){ o.x += (o.x - p.x) / d * o.speed * dt; o.y += (o.y - p.y) / d * o.speed * dt; }
      o.x = clamp(o.x, o.r, W - o.r); o.y = clamp(o.y, o.r, H - o.r);
      for(const b of L.buttons){ const bd = dist(o.x, o.y, b.x, b.y), min = b.r + o.r + 4; if(bd < min && bd > 0){ o.x = b.x + (o.x - b.x) / bd * min; o.y = b.y + (o.y - b.y) / bd * min; } }
      break;
    }
  }
}

// ---------- levels ----------
const LEVELS = [
  {name:"The Easy One", instr:"Don't touch the button. That's it. Survive 5 seconds.",
   setup(){ addButton({r:90}); survive(5); },
   win:"See? Easy. It won't stay like this."},

  {name:"Picking Flowers", instr:"Click all 5 green circles. Don't touch the button.",
   setup(){ addButton({r:80}); collect(5, 'all'); },
   win:"Gold star. ⭐"},

  {name:"Special Offer", instr:"PRESS THE BUTTON to skip this level! ⏩ Offer ends soon!",
   setup(){ addButton({r:110, label:'PRESS ME'}); survive(8); },
   failMsg:"It was a trick. The game is literally called Don't Touch the Button.",
   win:"Wow, you actually didn't. Trust nobody."},

  {name:"Clingy", instr:"Collect 6 circles. The button wants to be close to you.",
   setup(){ btnFar(60, {move:'follow', speed:110}); collect(6, 'one'); },

  {name:"Stopwatch", instr:"Press STOP at exactly 5.00 seconds (±0.25). Careful, things keep swapping.",
   setup(){
     const A = {x:W/2 - 120, y:H/2}, B = {x:W/2 + 120, y:H/2};
     const red = addButton({r:60, x:A.x, y:A.y});
     const stop = document.createElement('button'); stop.className = 'stopbtn ui'; stop.textContent = 'STOP'; arena.appendChild(stop);
     let redAt = A, stopAt = B, sw = 0, k = -1;
     L.t0 = 0;
     L.hudText = () => (L.t - L.t0).toFixed(2) + 's';
     L.updates.push(dt => {
       sw += dt; if(k < 0 && sw > 1.5){ k = 0; sw = 0; }
       let e = 0; if(k >= 0){ k += dt / .5; e = Math.min(1, k); }
       const ee = (1 - Math.cos(Math.PI * e)) / 2, arc = Math.sin(Math.PI * e) * 95;
       const rTo = redAt === A ? B : A, sTo = stopAt === A ? B : A;
       red.x = redAt.x + (rTo.x - redAt.x) * ee; red.y = redAt.y - arc;
       stop.style.left = (stopAt.x + (sTo.x - stopAt.x) * ee - 50) + 'px'; stop.style.top = (stopAt.y + arc - 30) + 'px';
       if(k >= 1){ k = -1; sw = 0; redAt = rTo; stopAt = sTo; }
     });
     stop.addEventListener('pointerdown', e => {
       e.stopPropagation(); if(L.state !== 'play') return;
       const el = L.t - L.t0;
       if(Math.abs(el - 5) <= .25) win();
       else { toast(`${el.toFixed(2)}s, ${el < 5 ? 'too early' : 'too late'}! Again.`); beep(200, .1, 'square', .06); L.t0 = L.t; }
     });
   },
   win:"Precision timing. Very professional."},

   setup(){
     const letters = ['A', 'B', 'C'], X = Math.floor(Math.random() * 3), others = shuffle([0, 1, 2].filter(i => i !== X)), Y = others[0], Z = others[1];
     const signs = []; signs[X] = "The button is NOT behind this door."; signs[Y] = "The button is behind this door."; signs[Z] = `The button is not behind door ${letters[Y]}.`;
     const wrap = document.createElement('div'); wrap.className = 'doors ui'; arena.appendChild(wrap);
     let opened = 0;
     letters.forEach((l, i) => {
       const col = document.createElement('div'); col.className = 'dcol';
       col.innerHTML = `<div class="sign">${signs[i]}</div><button class="door">${l}</button>`;
       wrap.appendChild(col);
       const door = col.querySelector('.door');
       door.onclick = () => {
         if(door.classList.contains('open') || L.state !== 'play') return;
         if(i === X) return fail(`Door ${l} had the button. Only door ${letters[Z]}'s sign was true.`);
         door.classList.add('open'); door.textContent = '✅'; opened++; beep(700 + opened * 100, .1, 'triangle');
         if(opened >= 2) win();
       };
     });
   },
   win:"Sherlock Holmes would be proud."},

     const t = addTarget(W / 2, H / 2, {r:36});
     addButton({r:50, move:'sine', cx:W/2, cy:H/2, ax:Math.min(W / 2 - 60, 350), w:1.4, ay:0, ph:Math.PI / 2});
     survive(10); L.timeoutFail = "Too slow! You need 15 clicks before time runs out.";
     L.onTargetDown = () => { L.got++; t.el.animate([{scale:.85},{scale:1}], {duration:120}); beep(500 + L.got * 25, .05, 'triangle'); if(L.got >= L.need) win(); };
   },
   win:"Click click click click click. Nice."},

  {name:"Loading…", instr:"Please wait while the next level loads…",
   setup(){
     const lb = document.createElement('div'); lb.className = 'loadbar'; lb.innerHTML = '<div id="lbt">Loading… 0%</div><div class="bar"><div class="fill"></div></div>'; arena.appendChild(lb);
     const fill = lb.querySelector('.fill'), txt = lb.querySelector('#lbt');
     btnFar(45, {label:'SKIP ▶▶', move:'follow', speed:60});
     survive(10);
     L.updates.push((dt, t) => { const pct = t >= 10 ? 100 : Math.min(99, Math.floor(t / 7 * 99)); fill.style.width = pct + '%'; txt.textContent = `Loading… ${pct}%`; });
     at(3, () => toast("Click SKIP to load faster!")); at(7.2, () => toast("Stuck at 99%… press SKIP?")); at(8.8, () => toast("Seriously, just press it."));
   },
   win:"Loaded! Patience is a virtue."},

  {name:"Minefield", instr:"Collect 6 circles. Watch your step.",
   setup(){ for(let i = 0; i < 28; i++){ const r = rand(22, 34), s = randomSpot(r, {gap:10}); addButton({x:s.x, y:s.y, r}); } L.spotOpts = {gap:12}; collect(6, 'all'); },
   win:"Not a single boom. 💣"},

  {name:"Bullet Hell", instr:"ARROW KEYS / WASD. Survive 15 seconds. Buttons are being thrown at you!",
   setup(){
     addPlayer(W / 2, H / 2); survive(15);
     let acc = 0;
     L.updates.push((dt, t) => {
       acc += dt; if(acc < Math.max(.18, .4 - t * .015)) return; acc = 0;
       const side = Math.floor(Math.random() * 4), r = rand(16, 26);
       const x = side === 0 ? -r : side === 1 ? W + r : rand(0, W), y = side === 2 ? -r : side === 3 ? H + r : rand(0, H);
       const P = L.player, a = Math.atan2(P.y - y, P.x - x) + rand(-.35, .35), sp = rand(200, 320);
       addButton({x, y, r, label:'', noTaunt:true, move:'fly', vx:Math.cos(a) * sp, vy:Math.sin(a) * sp});
     });
   },
   win:"Dodged like a pro."},

  {name:"The Button Fights Back", instr:"Survive 12 seconds. The button can touch YOU now. Keep moving!",
   setup(){
     const b = btnFar(55, {move:'follow', speed:170});
     L.updates.push((dt, t) => {
       b.speed = 170 + t * 16;
       if(dist(mx, my, b.x, b.y) < b.r * .8) fail("It touched you. That counts. Those are the rules now.");
     });
     survive(12);
   },
   win:"You outran a button. Incredible."},

  {name:"Final Exam", instr:"FINAL EXAM: Collect 8 circles. Everything at once. Good luck.",
   setup(){
     L.quake = 5;
     const bs = [btnFar(50, {move:'bounce', vx:randv(200), vy:randv(170)}), addButton({x:80, y:H - 80, r:45, move:'bounce', vx:randv(180), vy:randv(160)}), addButton({x:W - 80, y:80, r:40, move:'follow', speed:85})];
     L.updates.push((dt, t) => bs.forEach((b, i) => { b.opacity = .3 + .7 * Math.abs(Math.sin(t * 1.6 + i)); }));
     collect(8, 'one');
   },
   win:"You've graduated from Button University. 🎓"}
];

function cookieLevel(){
  const d = dialog('');
  const step1 = () => {
    d.innerHTML = `<div class="dh">🍪 We value your privacy</div>
      <p>This game uses cookies to remember how many times you touched the button. Please accept to continue.</p>
      <button class="d-red" id="acc">ACCEPT ALL<small>definitely not the button</small></button>
      <button class="d-link" id="rej">reject</button>`;
    d.querySelector('#acc').onclick = () => fail("That was the button wearing a trench coat.");
    d.querySelector('#rej').onclick = () => { beep(500, .06, 'triangle'); step2(); };
  };
  const step2 = () => {
    d.innerHTML = `<div class="dh">Are you sure? 🥺</div>
      <p>Rejecting cookies makes the button really, really sad.</p>
      <button class="d-red" id="happy">MAKE IT HAPPY<small>it's a normal button, promise</small></button>
      <button class="d-link" id="sure">yes, I'm sure</button>`;
    d.querySelector('#happy').onclick = () => fail("The button doesn't have feelings. It was manipulating you.");
    d.querySelector('#sure').onclick = () => { d.remove(); win(); };
  };
  step1();
}

// ---------- progress ----------
function getUnlocked(){ try{ return Math.min(LEVELS.length - 1, +localStorage.getItem('dttb-unlocked') || 0); }catch(e){ return 0; } }
function setUnlocked(i){ try{ if(i > getUnlocked()) localStorage.setItem('dttb-unlocked', i); }catch(e){} }

// ---------- flow ----------
function updateHud(){
  const parts = [];
  if(L && L.state !== undefined){
    if(L.hudText) parts.push(L.hudText());
    else { if(L.need) parts.push(L.got + '/' + L.need); if(L.timeLeft != null) parts.push(Math.ceil(L.timeLeft) + 's'); }
  }
  $('#prog').textContent = parts.join(' · ');
  $('#fails').textContent = 'Touches: ' + fails;
}
function card(inner, actions){
  ov.innerHTML = `<div class="card">${inner}<div class="acts"></div></div>`;
  const a = ov.querySelector('.acts');
  actions.forEach((x, k) => { const b = document.createElement('button'); b.className = k === 0 ? 'go' : 'go ghost'; b.textContent = x[0]; b.onclick = x[1]; a.appendChild(b); });
  ov.classList.remove('hidden');
}
function nextInfo(i){ const lv = LEVELS[i]; return `<div class="next">Level ${i + 1} of ${LEVELS.length}</div><h2>${lv.name}</h2><p>${lv.instr}</p>`; }

function startLevel(i){
  levelIdx = i; ov.classList.add('hidden'); setUnlocked(i);
  $('#lvl').textContent = `LEVEL ${i + 1}/${LEVELS.length}`;
  $('#instr').textContent = LEVELS[i].instr;
  measure(); L = newLevel();
  LEVELS[i].setup();
  updateHud();
}
function newRun(i){ fails = 0; runStart = performance.now(); startLevel(i); }
function fail(msg){
  if(!L || L.state !== 'play') return;
  L.state = 'fail'; fails++; L.holding = false;
  beep(110, .5, 'sawtooth', .2); shake(arena); updateHud();
  const lv = LEVELS[levelIdx];
  setTimeout(() => card(`<h1>💥 You touched the button.</h1><p>${msg || lv.failMsg || pick(FAIL_LINES)}</p><p class="stat">Touches so far: ${fails}</p>`,
    [["Try again", () => startLevel(levelIdx)], ["Menu", title]]), 350);
}
function win(){
  if(!L || L.state !== 'play') return;
  L.state = 'won'; L.holding = false;
  beep(880, .12, 'triangle'); setTimeout(() => beep(1320, .2, 'triangle'), 110);
  updateHud();
  const lv = LEVELS[levelIdx], n = levelIdx + 1;
  if(n < LEVELS.length) setUnlocked(n);
  setTimeout(() => {
    if(n >= LEVELS.length) return finale();
    card(`<h1>✅ Cleared!</h1><p>${lv.win}</p><hr>${nextInfo(n)}`, [["Start", () => startLevel(n)], ["Menu", title]]);
  }, 300);
}

function rank(f){
  if(f === 0) return "🏆 Untouchable";
  if(f <= 5) return "🛡️ Iron Will";
  if(f <= 20) return "😅 Mostly Restrained";
  if(f <= 50) return "🤔 Button Curious";
  return "🔴 Button Enthusiast";
}
function finale(){
  const secs = Math.round((performance.now() - runStart) / 1000);
  const time = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
  let best = null;
  try{ best = JSON.parse(localStorage.getItem('dttb-best')); if(!best || fails < best.fails){ best = {fails, time}; localStorage.setItem('dttb-best', JSON.stringify(best)); } }catch(e){}
  $('#lvl').textContent = 'YOU WIN'; $('#instr').textContent = ''; $('#prog').textContent = '';
  card(`<h1>🎉 You beat Don't Touch the Button!</h1>
    <p class="stat">Touches: <b>${fails}</b> · Time: <b>${time}</b></p>
    <p class="stat">${rank(fails)}</p>
    ${best ? `<p>Best run: ${best.fails} touches</p>` : ''}
    <button class="cardbtn" id="celebrate">PRESS TO<br>CELEBRATE</button>
    <p id="celemsg"></p>`,
    [["Play again", () => newRun(0)], ["Menu", title]]);
  const quips = ["…You just couldn't help yourself, could you?", "The game is OVER and you're still pressing it.", "This is why we can't have nice things.", "Okay, at this point you're just doing it for fun.", "The button is honored. Truly."];
  let k = 0;
  $('#celebrate').onclick = () => {
    fails++; beep(110, .3, 'sawtooth', .15); shake(ov.querySelector('.card'));
    $('#celemsg').textContent = quips[Math.min(k++, quips.length - 1)] + ` (Touches: ${fails})`;
    $('#fails').textContent = 'Touches: ' + fails;
  };
}
function levelSelect(){
  const un = getUnlocked();
  card(`<h1>Level select</h1><p>Beat a level to unlock the next one.</p><div class="grid">${LEVELS.map((lv, i) => `<button class="lvbtn" data-i="${i}" ${i > un ? 'disabled' : ''} title="${lv.name}">${i + 1}</button>`).join('')}</div>`,
    [["Back", title]]);
  ov.querySelectorAll('.lvbtn').forEach(b => b.onclick = () => newRun(+b.dataset.i));
}
function title(){
  L = null; arena.innerHTML = '';
  $('#lvl').textContent = "DON'T TOUCH THE BUTTON"; $('#instr').textContent = ''; $('#prog').textContent = '';
  const un = getUnlocked();
  const acts = un > 0
    ? [[`Continue (Level ${un + 1})`, () => newRun(un)], ["New game", () => newRun(0)], ["Level select", levelSelect]]
    : [["Start", () => newRun(0)], ["Level select", levelSelect]];
  card(`<h1>Don't Touch<br>the Button</h1><p>${LEVELS.length} levels. One rule.<br>Click with your mouse. Don't click the red thing.</p>
    <button class="cardbtn" id="tbtn">DON'T</button><p id="tmsg"></p>`, acts);
  const lines = ["You haven't even started yet.", "Seriously? On the title screen?", "We're not counting these. Yet.", "Press Start. The YELLOW one."];
  let k = 0;
  $('#tbtn').onclick = () => { beep(110, .3, 'sawtooth', .15); shake(ov.querySelector('.card')); $('#tmsg').textContent = lines[Math.min(k++, lines.length - 1)]; };
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(!ov.classList.contains('hidden')){
    if(e.key === 'Enter' && !e.repeat){ const g = ov.querySelector('.acts .go'); if(g){ e.preventDefault(); g.click(); } }
    return;
  }
  keys.add(k);
  if(L && L.state === 'play'){
    if(L.player && ['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
    if(L.onKey) L.onKey(e);
  }
  if(e.key === ' ') e.preventDefault();
});

// ---------- main loop ----------
let last = performance.now();
function tick(){
  const now = performance.now();
  let total = Math.min(1, Math.max(0, (now - last) / 1000)); last = now;
  // Catch up in small steps so timers stay accurate even when ticks arrive late
  while(total > 0 && L && L.state === 'play'){
    const dt = Math.min(.05, total); total -= dt;
    try{ update(dt); }catch(e){ console.error(e); }
  }
}
function update(dt){
  {
    L.t += dt;
    for(const s of [...L.sched]) if(L.t >= s.t){ L.sched.splice(L.sched.indexOf(s), 1); s.fn(); }
    if(L.lag){ const f = Math.min(1, dt * 3.5); L.lx += (mx - L.lx) * f; L.ly += (my - L.ly) * f; }
    L.off = L.quake ? {x:rand(-L.quake, L.quake), y:rand(-L.quake, L.quake)} : {x:0, y:0};
    const p = pointer();
    for(const b of L.buttons){
      move(b, dt);
      if(b.span && !b.noTaunt && !L.player){
        const h = dist(p.x, p.y, b.x, b.y) < b.r;
        b.el.classList.toggle('hover', h);
        if(h){ b.taunt -= dt; if(b.taunt <= 0){ b.span.textContent = pick(TAUNTS); b.taunt = 1.2; } b.hovering = true; }
        else if(b.hovering){ b.span.textContent = b.label ?? "DON'T"; b.taunt = 0; b.hovering = false; }
      }
    }
    for(const t of L.targets) move(t, dt);
    if(L.player){
      const P = L.player; let dx = 0, dy = 0;
      if(keys.has('arrowleft') || keys.has('a')) dx--;
      if(keys.has('arrowright') || keys.has('d')) dx++;
      if(keys.has('arrowup') || keys.has('w')) dy--;
      if(keys.has('arrowdown') || keys.has('s')) dy++;
      const d = Math.hypot(dx, dy) || 1;
      P.x = clamp(P.x + dx / d * P.speed * dt, P.r, W - P.r); P.y = clamp(P.y + dy / d * P.speed * dt, P.r, H - P.r);
      for(const b of L.buttons) if(dist(P.x, P.y, b.x, b.y) < b.r + P.r * .75){ fail("You bumped into the button. Bumping counts as touching."); break; }
      if(L.state === 'play') for(const t of [...L.targets]) if(dist(P.x, P.y, t.x, t.y) < t.r + P.r){ hitTarget(t); if(L.state !== 'play') break; }
      draw(P);
    }
    for(const f of L.updates){ if(L.state !== 'play') break; f(dt, L.t); }
    if(L.state === 'play' && L.timeLeft != null){ L.timeLeft -= dt; if(L.timeLeft <= 0){ L.timeLeft = 0; if(L.timeoutFail) fail(L.timeoutFail); else win(); } }
    L.buttons = L.buttons.filter(b => { if(b.dead){ b.el.remove(); return false; } return true; });
    for(const b of L.buttons) draw(b);
    for(const t of L.targets) draw(t);
    const sp = screenPointer();
    if(L.fake) L.fake.style.transform = `translate(${sp.x}px,${sp.y}px)`;
    if(L.dark) L.dark.style.background = `radial-gradient(circle at ${sp.x}px ${sp.y}px, transparent 0, transparent 85px, rgba(0,0,0,.97) 150px)`;
    updateHud();
  }
}
function frame(){ tick(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
// Fallback for when the browser pauses animation frames (some previews and background tabs do)
setInterval(() => { if(performance.now() - last > 50) tick(); }, 25);
title();
</script>
