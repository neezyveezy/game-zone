<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tumble Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen lab bench — control strip on top, graph-paper stage, tool tray below */
:root {
  --bg: #e6ecf1;
  --paper: #f7f9fb;
  --grid: #e1e8ee;
  --grid-major: #c9d5df;
  --ink: #1a2634;
  --muted: #5a6a7b;
  --line: #c4d0db;
  --chip: #ffffff;
  --chip-on: #1a2634;
  --chip-on-fg: #f7f9fb;
  --accent: #ff5a36;
  --static: #34485e;
  --hole: #111821;
  --tire: #2b333d;
  --ice: #36b4f0;
  --c1: #ff5a36; --c2: #2c7be5; --c3: #f2b400; --c4: #13a37e; --c5: #8a5cf0;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #081628; --paper: #0e2544; --grid: #14325a; --grid-major: #1d4373;
    --ink: #e2ecf7; --muted: #8ea6c1; --line: #24497a; --chip: #12305a;
    --chip-on: #e2ecf7; --chip-on-fg: #0e2544; --accent: #ff7a59; --static: #a7bfdb;
    --hole: #01040a; --tire: #1a1f27; --ice: #7fd8ff;
    --c1: #ff7a59; --c2: #5ba3ff; --c3: #ffcf3f; --c4: #3dd3a3; --c5: #b08cff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #081628; --paper: #0e2544; --grid: #14325a; --grid-major: #1d4373;
  --ink: #e2ecf7; --muted: #8ea6c1; --line: #24497a; --chip: #12305a;
  --chip-on: #e2ecf7; --chip-on-fg: #0e2544; --accent: #ff7a59; --static: #a7bfdb;
  --hole: #01040a; --tire: #1a1f27; --ice: #7fd8ff;
  --c1: #ff7a59; --c2: #5ba3ff; --c3: #ffcf3f; --c4: #3dd3a3; --c5: #b08cff;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 13px; overflow: hidden; }
.app {
  height: 100%; box-sizing: border-box;
  display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
  padding-inline: 16px; padding-block: 12px;
  max-width: 1500px; margin-inline: auto;
}
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
h1 { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; margin: 0; line-height: 1; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.field { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
select, button.ctl {
  font: 500 12px var(--mono); color: var(--ink); background: var(--chip);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
button.ctl:hover, select:hover { border-color: var(--ink); }
button.ctl[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); }
input[type=range] { width: 110px; accent-color: var(--accent); }
.gval { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 4.5ch; text-transform: none; letter-spacing: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stage {
  position: relative; min-height: 0; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.readout {
  position: absolute; top: 10px; left: 12px; right: 12px; pointer-events: none;
  display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: var(--muted);
}
.readout b { color: var(--ink); font-weight: 500; }
.hint { min-width: 0; }
.stats { font-variant-numeric: tabular-nums; white-space: nowrap; }
.flag { color: var(--accent); font-weight: 500; }

.tray { overflow-x: auto; scrollbar-width: thin; }
.tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding-block: 2px; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin-inline: 4px; }
.tool {
  display: flex; align-items: center; gap: 7px;
  font: 500 12px var(--mono); color: var(--ink);
  background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px 6px 7px; cursor: pointer;
}
.tool svg { width: 20px; height: 20px; flex: none; }
.tool kbd { font: 400 10px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.tool:hover { border-color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); }
.tool[aria-pressed="true"] kbd { color: var(--chip-on-fg); border-color: currentColor; opacity: 0.7; }
.tool.act { border-style: dashed; }

@media (max-width: 640px) {
  h1 { font-size: 22px; }
  .sub { display: none; }
  input[type=range] { width: 80px; }
  .tools { flex-wrap: nowrap; justify-content: flex-start; width: max-content; }
  .tool kbd { display: none; }
  .readout .hint { display: none; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <h1>Tumble<span>.</span>Lab</h1>
      <div class="sub">rigid-body sandbox</div>
    </div>
    <div class="controls">
      <label class="field" for="scene">Scene
        <select id="scene">
          <option value="playground">Playground</option>
          <option value="wrecking">Wrecking ball</option>
          <option value="cars">Hill climb</option>
          <option value="cradle">Newton's cradle</option>
          <option value="dominoes">Dominoes</option>
          <option value="plinko">Plinko</option>
          <option value="tower">Tower</option>
          <option value="space">Black hole</option>
        </select>
      </label>
      <label class="field" for="gravity">Gravity
        <input id="gravity" type="range" min="-1" max="2" step="0.1" value="1">
        <span class="gval" id="gval">1.0 g</span>
      </label>
      <button class="ctl" id="slowmo" type="button" aria-pressed="false">Slow-mo</button>
      <button class="ctl" id="sound" type="button" aria-pressed="true">Sound on</button>
      <button class="ctl" id="pause" type="button">Pause</button>
      <button class="ctl" id="reset" type="button">Reset</button>
      <button class="ctl" id="clear" type="button">Clear</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="c" aria-label="Physics sandbox canvas"></canvas>
    <div class="readout">
      <div class="hint" id="hint"></div>
      <div class="stats"><span id="flags" class="flag"></span>bodies <b id="count">0</b></div>
    </div>
  </div>

  <nav class="tray" aria-label="Tools">
    <div class="tools" id="tools"></div>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
const { Engine, Events, Bodies, Body, Composite, Constraint, Query, Vector } = Matter;

const SW = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
const TOOLS = [
  { id: 'grab',   key: 'g', label: 'Grab',     hint: 'Drag any shape and let go to fling it',
    icon: `<path d="M6 3l13 7.5-5.5 1.6L11 18z" ${SW}/>` },
  { id: 'ball',   key: 'b', label: 'Ball',     hint: 'Click to drop a ball. Hold to pour',
    icon: `<circle cx="12" cy="12" r="7" ${SW}/><path d="M12 12l5-4" ${SW}/>` },
  { id: 'box',    key: 'x', label: 'Crate',    hint: 'Click to drop a crate. Hold to pour',
    icon: `<rect x="5" y="5" width="14" height="14" ${SW}/><path d="M5 5l14 14" ${SW}/>` },
  { id: 'tri',    key: 'w', label: 'Wedge',    hint: 'Click to drop a wedge. Hold to pour',
    icon: `<path d="M12 4l8 15H4z" ${SW}/>` },
  { id: 'bouncy', key: 'o', label: 'Bouncy',   hint: 'Super-elastic balls (restitution 0.92)',
    icon: `<circle cx="12" cy="9" r="5" ${SW}/><path d="M6 19h12M9 16.5h6" ${SW}/>` },
  { id: 'ramp',   key: 'm', label: 'Ramp',     hint: 'Drag to draw a fixed plank',
    icon: `<path d="M4 18L20 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>` },
  { id: 'tramp',  key: 't', label: 'Trampoline', hint: 'Drag to draw a plank that launches anything that lands on it',
    icon: `<path d="M3 14h18M6 14l-1 5M18 14l1 5" ${SW}/><circle cx="12" cy="7" r="2.5" ${SW}/>` },
  { id: 'rope',   key: 'p', label: 'Rope',     hint: 'Drag between two points. Ends stick to shapes or nail to the wall',
    icon: `<path d="M4 5c5 0 3 7 8 7s3 7 8 7" ${SW}/><circle cx="4" cy="5" r="1.5" fill="currentColor"/>` },
  { id: 'spring', key: 's', label: 'Spring',   hint: 'Drag from a shape or the wall to another shape. Empty space hangs a new ball',
    icon: `<path d="M3 12l2-4 3 8 3-8 3 8 3-8 3 8 2-4" ${SW}/>` },
  { id: 'car',    key: 'v', label: 'Car',      hint: 'Click to drop a self-driving car',
    icon: `<path d="M3 13h18v3H3zM7 13l2-4h6l2 4" ${SW}/><circle cx="7.5" cy="17.5" r="2" ${SW}/><circle cx="16.5" cy="17.5" r="2" ${SW}/>` },
  { id: 'ragdoll',key: 'd', label: 'Ragdoll',  hint: 'Click to drop a floppy little person. Grab to fling them',
    icon: `<circle cx="12" cy="5" r="2.5" ${SW}/><path d="M12 8v7M12 15l-4 6M12 15l4 6M7 10l5 1 5-1" ${SW}/>` },
  { id: 'hole',   key: 'h', label: 'Black hole', hint: 'Click to place a black hole that swallows things. Click it again to remove',
    icon: `<circle cx="12" cy="12" r="3.2" fill="currentColor"/><path d="M12 4a8 8 0 0 1 8 8M12 20a8 8 0 0 1-8-8M17 6.5a6 6 0 0 0-5-1.5" ${SW}/>` },
  { id: 'freeze', key: 'f', label: 'Freeze',   hint: 'Click a shape to freeze it in place. Click again to thaw',
    icon: `<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M10 4.5l2 1.5 2-1.5M10 19.5l2-1.5 2 1.5" ${SW}/>` },
  { id: 'bomb',   key: 'k', label: 'Blast',    hint: 'Click to blow nearby shapes apart',
    icon: `<circle cx="11" cy="14" r="6" ${SW}/><path d="M15 9l3-3M18 3v2M21 6h-2" ${SW}/>` },
  { id: 'erase',  key: 'e', label: 'Erase',    hint: 'Click or drag across shapes to remove them. Slice ropes to cut them',
    icon: `<path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>` },
];
const ACTIONS = [
  { id: 'rain',  key: 'n', label: 'Shape rain', icon: `<path d="M6 4v4M12 2v4M18 5v4M8 12v4M15 11v4M5 18v3M12 19v3M19 17v3" ${SW}/>` },
  { id: 'quake', key: 'q', label: 'Earthquake', icon: `<path d="M2 12h4l2-5 3 10 3-12 3 9 2-2h3" ${SW}/>` },
];
const SPAWNERS = new Set(['ball', 'box', 'tri', 'bouncy']);
const MAX_BODIES = 600;
const HOLE_R = 320;

const stage = document.getElementById('stage');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hintEl = document.getElementById('hint');
const countEl = document.getElementById('count');
const flagsEl = document.getElementById('flags');
const sceneSel = document.getElementById('scene');
const gravityIn = document.getElementById('gravity');
const gval = document.getElementById('gval');
const pauseBtn = document.getElementById('pause');
const slowBtn = document.getElementById('slowmo');
const soundBtn = document.getElementById('sound');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const engine = Engine.create();
engine.positionIterations = 8;
engine.velocityIterations = 6;
engine.constraintIterations = 4;
const world = engine.world;

let W = 0, H = 0, dpr = 1, walls = [];
let tool = 'grab', paused = false, slowmo = false, soundOn = true;
let holes = [], quake = 0, groupSeq = -1;
let T = {};
const rings = [];

// ---------- theme ----------
function readTokens() {
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  T = { ink: v('--ink'), stat: v('--static'), accent: v('--accent'), hole: v('--hole'),
        tire: v('--tire'), ice: v('--ice'), paper: v('--paper'),
        colors: ['--c1', '--c2', '--c3', '--c4', '--c5'].map(v) };
}
readTokens();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTokens);
new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------- sound ----------
let ac = null, master = null, soundBudget = 0;
function wakeAudio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
    } catch { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
}
function tone(freq, dur, type = 'triangle', vol = 0.12, slideTo) {
  if (!soundOn || !ac || soundBudget <= 0) return;
  soundBudget--;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur = 0.6, vol = 0.5, cutoff = 700) {
  if (!soundOn || !ac) return;
  const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; f.type = 'lowpass'; f.frequency.value = cutoff; g.gain.value = vol;
  src.connect(f).connect(g).connect(master); src.start();
}
Events.on(engine, 'collisionStart', e => {
  if (!soundOn || !ac) return;
  for (const p of e.pairs) {
    const A = p.bodyA.parent, B = p.bodyB.parent;
    const v = Vector.magnitude(Vector.sub(A.velocity, B.velocity));
    if (v < 2.5) continue;
    const sa = A.plugin.spec || {}, sb = B.plugin.spec || {};
    if (sa.kind === 'rope' || sb.kind === 'rope') continue;
    const vol = Math.min(0.16, v * 0.01);
    if (sa.tramp || sb.tramp) { tone(160, 0.32, 'sine', vol * 1.4, 520); continue; }
    const dyn = A.isStatic ? B : B.isStatic ? A : (A.area < B.area ? A : B);
    const s = dyn.plugin.spec || {};
    const f = Math.max(110, Math.min(1100, 24000 / Math.sqrt(dyn.area)));
    if (s.bouncy) tone(f * 0.7, 0.18, 'sine', vol, f * 1.6);
    else if (s.kind === 'ball' || s.kind === 'peg') tone(f, 0.07, 'triangle', vol);
    else tone(f * 0.55, 0.05, 'square', vol * 0.45);
  }
});

// ---------- world ----------
function resize() {
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildWalls();
}
function buildWalls() {
  Composite.remove(world, walls);
  const t = 200, o = { isStatic: true, label: 'wall', friction: 0.6 };
  walls = [
    Bodies.rectangle(W / 2, H + t / 2, W + t * 4, t, o),
    Bodies.rectangle(-t / 2, H - 3000, t, 6000, o),
    Bodies.rectangle(W + t / 2, H - 3000, t, 6000, o),
  ];
  Composite.add(world, walls);
}
const base = () => Math.max(12, Math.min(26, Math.min(W, H) / 24));
const rand = n => Math.floor(Math.random() * n);
const nextGroup = () => groupSeq--;
const items = () => Composite.allBodies(world).filter(b => b.label !== 'wall');
const dynamic = () => items().filter(b => !b.isStatic);
const links = () => Composite.allConstraints(world).filter(c => c !== drag);

function makeBody(s) {
  const opts = {
    friction: s.friction ?? (s.bouncy ? 0.02 : 0.35),
    frictionAir: s.frictionAir ?? (s.bouncy ? 0.001 : 0.006),
    restitution: s.restitution ?? (s.bouncy ? 0.92 : 0.12),
    density: s.density ?? 0.002,
    isStatic: !!s.static,
    collisionFilter: { category: 1, mask: 0xFFFFFFFF, group: s.group || 0 },
  };
  if (s.slop) opts.slop = s.slop;
  if (s.inertiaInf) opts.inertia = Infinity;
  let b;
  if (s.kind === 'ball' || s.kind === 'peg') b = Bodies.circle(s.x, s.y, s.r, opts);
  else if (s.kind === 'poly') b = Bodies.polygon(s.x, s.y, s.sides, s.r, opts);
  else b = Bodies.rectangle(s.x, s.y, s.w, s.h, opts);
  if (s.angle) Body.setAngle(b, s.angle);
  const { x, y, angle, vx, vy, av, ...spec } = s;
  spec.color = spec.color ?? rand(5);
  b.plugin.spec = spec;
  if (!s.static && (vx || vy)) Body.setVelocity(b, { x: vx || 0, y: vy || 0 });
  if (!s.static && av) Body.setAngularVelocity(b, av);
  Composite.add(world, b);
  if (spec.frozen) Body.setStatic(b, true);
  return b;
}
function link(o) {
  const c = Constraint.create({
    bodyA: o.a || undefined, pointA: o.pa ? { ...o.pa } : undefined,
    bodyB: o.b || undefined, pointB: o.pb ? { ...o.pb } : undefined,
    length: o.length, stiffness: o.stiffness ?? 1, damping: o.damping ?? 0,
  });
  c.plugin.kind = o.kind;
  Composite.add(world, c);
  return c;
}
function removeBody(b) {
  Composite.remove(world, b);
  for (const c of Composite.allConstraints(world))
    if (c.bodyA === b || c.bodyB === b) Composite.remove(world, c);
  if (drag && drag.bodyB === b) drag = null;
}
function enforceCap() {
  const d = dynamic();
  for (let i = 0; i < d.length - MAX_BODIES; i++) removeBody(d[i]);
}
function spawn(kind, x, y) {
  const s = base() * (0.75 + Math.random() * 0.6);
  if (kind === 'ball') makeBody({ kind: 'ball', x, y, r: s });
  else if (kind === 'box') makeBody({ kind: 'box', x, y, w: s * 1.8, h: s * 1.8, angle: Math.random() * 0.6 - 0.3 });
  else if (kind === 'tri') makeBody({ kind: 'poly', x, y, sides: 3, r: s * 1.3, angle: Math.random() * Math.PI });
  else if (kind === 'bouncy') makeBody({ kind: 'ball', x, y, r: s * 0.75, bouncy: true });
  enforceCap();
}
function plank(x1, y1, x2, y2, extra = {}) {
  const len = Math.hypot(x2 - x1, y2 - y1);
  return makeBody({ kind: 'plank', x: (x1 + x2) / 2, y: (y1 + y2) / 2, w: len, h: 12,
    angle: Math.atan2(y2 - y1, x2 - x1), static: true, ...extra });
}
function trampoline(x1, y1, x2, y2) {
  return plank(x1, y1, x2, y2, { tramp: true, restitution: 1.05, friction: 0.1 });
}

// A chain of thin links. Ends attach to the shape under them, or get nailed to the background.
function rope(p1, p2, bodyA, bodyB) {
  const L = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  if (L < 20) return;
  const n = Math.max(3, Math.round(L / 14)), seg = L / n;
  const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x), cos = Math.cos(ang), sin = Math.sin(ang);
  const g = (bodyA && bodyA.collisionFilter.group) || (bodyB && bodyB.collisionFilter.group) || nextGroup();
  for (const b of [bodyA, bodyB]) if (b && !b.collisionFilter.group) { b.collisionFilter.group = g; b.plugin.spec.group = g; }
  const segs = [];
  for (let i = 0; i < n; i++)
    segs.push(makeBody({ kind: 'rope', x: p1.x + cos * seg * (i + 0.5), y: p1.y + sin * seg * (i + 0.5),
      w: seg, h: 5, angle: ang, group: g, density: 0.004, friction: 0.6, frictionAir: 0.02, color: 0 }));
  const half = { x: cos * seg / 2, y: sin * seg / 2 }, neg = { x: -half.x, y: -half.y };
  for (let i = 0; i < n - 1; i++) link({ a: segs[i], pa: half, b: segs[i + 1], pb: neg, length: 0, stiffness: 0.95, kind: 'link' });
  const anchor = (p, body, s, local) => body

// ---------- scenes ----------
function pyramid(cx, rows, s) {

    const n = rows - i;

}

    trampoline(W * 0.3, H * 0.86, W * 0.46, H * 0.8);
    makeBody({ kind: 'ball', x: W * 0.06, y: H * 0.32 - b * 2, r: b * 1.2, color: 0 });
    makeBody({ kind: 'ball', x: W * 0.12, y: H * 0.32 - b * 4, r: b * 0.8, bouncy: true, color: 4 });
    const s = b * 1.6, rows = W < 500 ? 4 : 6;

// ---------- pointer ----------
const ptr = { down: false, x: 0, y: 0, sx: 0, sy: 0, last: 0, startBody: null };

      ctx.beginPath(); ctx.arc(x, y, r * 0.45, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      for (let k = 0; k < 3; k++) { const a = an + k * Math.PI * 2 / 3; ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * r * 0.45, y + Math.sin(a) * r * 0.45); }
      ctx.stroke();
    } else if (s.face) {
      ctx.fillStyle = T.ink;
      const ex = (dx, dy) => [x + Math.cos(an) * dx - Math.sin(an) * dy, y + Math.sin(an) * dx + Math.cos(an) * dy];
      for (const sx of [-1, 1]) { const [px, py] = ex(sx * r * 0.32, -r * 0.15); ctx.beginPath(); ctx.arc(px, py, Math.max(1.5, r * 0.11), 0, Math.PI * 2); ctx.fill(); }
      ctx.beginPath(); ctx.arc(x, y, r * 0.45, an + 0.5, an + Math.PI - 0.5); ctx.stroke();
    } else if (s.chassis) {
      const ex = (dx, dy) => [x + Math.cos(an) * dx - Math.sin(an) * dy, y + Math.sin(an) * dx + Math.cos(an) * dy];
      const [hx, hy] = ex(s.dir * s.w * 0.44, -s.h * 0.1);
      ctx.fillStyle = T.colors[2]; ctx.beginPath(); ctx.arc(hx, hy, Math.max(2, s.h * 0.16), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (r && !s.static) {
      ctx.beginPath();
      if (s.bouncy) ctx.arc(x, y, r * 0.5, an, an + Math.PI * 1.3);
      else { ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(an) * r, y + Math.sin(an) * r); }
      ctx.stroke();
    }
    if (s.frozen) {
      ctx.save(); drawShape(b, s);
      ctx.globalAlpha = 0.35; ctx.fillStyle = T.ice; ctx.fill();
      ctx.globalAlpha = 1; ctx.strokeStyle = T.ice; ctx.lineWidth = 3; ctx.setLineDash([3, 3]); ctx.stroke();
      ctx.restore();
    }
  }

  for (const c of cons) {
    const k = c.plugin.kind;
    if (k === 'pin' || k === 'string') {
      ctx.fillStyle = T.paper; ctx.strokeStyle = T.ink; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(c.pointA.x, c.pointA.y, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (k === 'axle') {
      const b = end(c.bodyB, c.pointB);
      ctx.fillStyle = T.ink; ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (k === 'spring') {
      ctx.fillStyle = T.accent;
      for (const p of [end(c.bodyA, c.pointA), end(c.bodyB, c.pointB)]) { ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill(); }
    }
  }

  if (drag) {
    const a = drag.pointA, bp = Vector.add(drag.bodyB.position, drag.pointB);
    ctx.strokeStyle = T.accent; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(bp.x, bp.y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = T.accent; ctx.beginPath(); ctx.arc(bp.x, bp.y, 4, 0, Math.PI * 2); ctx.fill();
  }

  if (ptr.down && ['ramp', 'tramp', 'rope', 'spring'].includes(tool)) {
    const a = { x: ptr.sx, y: ptr.sy }, b = { x: ptr.x, y: ptr.y };
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    ctx.globalAlpha = 0.5;
    if (tool === 'spring') { ctx.strokeStyle = T.accent; ctx.lineWidth = 2; zigzag(a, b, Math.max(4, Math.round(len / 14))); }
    else {
      ctx.strokeStyle = tool === 'tramp' ? T.accent : tool === 'rope' ? T.ink : T.stat;
      ctx.lineWidth = tool === 'rope' ? 5 : 12; ctx.lineCap = 'round';
      if (tool === 'rope') ctx.setLineDash([2, 9]);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.setLineDash([]); ctx.lineCap = 'butt';
    }
    ctx.globalAlpha = 1;
    const deg = Math.round(Math.abs(Math.atan2(dy, Math.abs(dx))) * 180 / Math.PI);
    const label = tool === 'rope' ? `${Math.max(3, Math.round(len / 14))} links · ${Math.round(len)} px`
      : tool === 'spring' ? `rest length ${Math.round(len)} px` : `${deg}° · ${Math.round(len)} px`;
    ctx.fillStyle = T.ink; ctx.font = '500 12px "IBM Plex Mono", ui-monospace, monospace';
    ctx.fillText(label, b.x + 12, b.y - 10);
  }

  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.t += 1 / 30;
    if (r.t >= 1) { rings.splice(i, 1); continue; }
    ctx.strokeStyle = T.accent; ctx.globalAlpha = 1 - r.t; ctx.lineWidth = 3 * (1 - r.t) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.small ? 4 + r.t * 30 : 20 + r.t * 200, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

// ---------- loop ----------
const STEP = 1000 / 60;
let acc = 0, prev = performance.now(), lastCount = -1;
function frame(now) {
  acc += Math.min(now - prev, 100); prev = now;
  soundBudget = 4;
  if (ptr.down && SPAWNERS.has(tool) && now - ptr.last > 110) {
    ptr.last = now;
    spawn(tool, ptr.x + (Math.random() - 0.5) * 10, ptr.y + (Math.random() - 0.5) * 10);
  }
  let steps = 0;
  while (acc >= STEP && steps < 3) {
    if (!paused) Engine.update(engine, STEP);
    acc -= STEP; steps++;
  }
  if (steps === 3) acc = 0;
  if (quake > 0) { updateFlags(); if (!reduceMotion) stage.style.transform = `translate(${(Math.random() - 0.5) * 6}px, ${(Math.random() - 0.5) * 4}px)`; }
  for (const b of dynamic())
    if (b.position.y > H + 400 || b.position.x < -400 || b.position.x > W + 400) removeBody(b);
  draw(now);
  const n = items().length;
  if (n !== lastCount) { countEl.textContent = n; lastCount = n; }
  requestAnimationFrame(frame);
}

// ---------- boot (keeps the scene across live page updates) ----------
function serialize() {
  const list = items(), idx = new Map(list.map((b, i) => [b, i]));
  return {
    bodies: list.map(b => ({ ...b.plugin.spec, x: b.position.x, y: b.position.y, angle: b.angle,
      vx: b.velocity.x, vy: b.velocity.y, av: b.angularVelocity })),
    links: links().filter(c => c.plugin.kind).map(c => ({
      a: c.bodyA ? idx.get(c.bodyA) : -1, b: c.bodyB ? idx.get(c.bodyB) : -1,
      pa: { ...c.pointA }, pb: { ...c.pointB }, length: c.length, stiffness: c.stiffness, damping: c.damping, kind: c.plugin.kind,
    })).filter(l => l.a !== undefined && l.b !== undefined),
    holes, gravity: engine.gravity.y, tool, paused, slowmo, soundOn, scene: sceneSel.value,
  };
}
function restore(data) {
  const made = data.bodies.map(makeBody);
  for (const l of data.links || [])
    link({ ...l, a: l.a >= 0 ? made[l.a] : null, b: l.b >= 0 ? made[l.b] : null });
  holes = Array.isArray(data.holes) ? data.holes : [];
  groupSeq = Math.min(-1, ...data.bodies.map(s => s.group || 0)) - 1;
}
function start(data) {
  data = data || {};
  resize();
  new ResizeObserver(resize).observe(stage);
  if (data.scene) sceneSel.value = data.scene;
  setGravity(typeof data.gravity === 'number' ? data.gravity : 1);
  setTool(TOOLS.some(t => t.id === data.tool) ? data.tool : 'grab');
  setPaused(!!data.paused);
  setSlowmo(!!data.slowmo);
  setSound(data.soundOn !== false);
  if (Array.isArray(data.bodies) && data.bodies.length) restore(data);
  else loadScene(sceneSel.value);
  window.claude?.hot?.snapshot?.(serialize);
  requestAnimationFrame(t => { prev = t; frame(t); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
