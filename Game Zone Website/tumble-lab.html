<!DOCTYPE html>
<html lang="en">
<head>
<script src="gz-lock.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tumble Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root { --bg: #0d1420; --panel: rgba(16,24,38,.94); --panel2: #1a2638; --line: rgba(255,255,255,.09); --ink: #eaf2ff; --muted: #8fa3bf;
  --mint: #3df5c3; --orange: #ffb03b; --red: #ff4d5e; --blue: #4da3ff; --gold: #ffd23f; --purple: #b98cff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 14px/1.35 "Nunito", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 10px; background: var(--panel2); padding: 7px 11px; font-weight: 800; transition: transform .08s, background .12s, box-shadow .12s; }
button:hover:not(:disabled) { background: #24344c; }
button:active:not(:disabled) { transform: scale(.95); }
button:disabled { opacity: .45; cursor: default; }
button.on { background: linear-gradient(180deg, #2fd6aa, #1fae8a); color: #062018; }
button.primary { background: linear-gradient(180deg, #45ffd0, #22c79c); color: #052019; box-shadow: 0 4px 0 #128566; }
button.warn { background: linear-gradient(180deg, #ffc35c, #ff9a2b); color: #2b1600; box-shadow: 0 4px 0 #b4600c; }
button.danger { background: #4a1f28; color: #ffb3bb; }
canvas#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
canvas#cv.grab { cursor: grab; } canvas#cv.grabbing { cursor: grabbing; } canvas#cv.pan { cursor: move; }
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.4); backdrop-filter: blur(6px); }
[hidden] { display: none !important; }
kbd { font: 700 10px "Nunito"; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,.1); color: var(--muted); }

/* top bar */
#top { position: fixed; z-index: 5; top: 10px; left: 10px; right: 10px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
#top > * { pointer-events: auto; }
#top .grp { display: flex; gap: 4px; padding: 5px; }
#top .grp button { padding: 7px 10px; font-size: 15px; min-width: 38px; }
#modeName { font: 700 18px "Fredoka"; padding: 8px 14px; white-space: nowrap; }
#modeName b { color: var(--mint); }
#top .sp { flex: 1; }
#coins { font: 700 15px "Fredoka"; padding: 8px 12px; color: var(--gold); white-space: nowrap; }

/* left toolbox */
#side { position: fixed; z-index: 4; top: 66px; left: 10px; bottom: 10px; width: 292px; display: flex; overflow: hidden; }
#cats { width: 54px; padding: 6px 5px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--line); overflow-y: auto; scrollbar-width: none; }
#cats button { width: 42px; height: 42px; padding: 0; font-size: 21px; border-radius: 12px; background: transparent; position: relative; }
#cats button.on { background: #24344c; box-shadow: inset 3px 0 0 var(--mint); }
#cats button .n { position: absolute; right: -2px; top: -2px; font: 800 9px "Nunito"; background: var(--red); color: #fff; border-radius: 6px; padding: 0 4px; }
#items { flex: 1; overflow-y: auto; padding: 10px 10px 14px; scrollbar-width: thin; }
#items h3 { margin: 0 0 8px; font: 700 15px "Fredoka"; color: var(--muted); letter-spacing: .02em; display: flex; justify-content: space-between; align-items: center; }
#items .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.it { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 6px; border-radius: 12px; background: var(--panel2); font-size: 11px; font-weight: 800; line-height: 1.1; text-align: center; min-height: 68px; }
.it .ic { font-size: 25px; line-height: 1.15; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.it.on { background: linear-gradient(180deg, #2b5b52, #1d3f3a); box-shadow: inset 0 0 0 2px var(--mint); }
.it.locked { opacity: .55; }
.it.locked::after { content: "🔒"; position: absolute; right: 4px; top: 3px; font-size: 11px; }
.it small { font-size: 9px; color: var(--muted); font-weight: 700; }
.mats { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 10px; }
.mats button { padding: 4px 8px; font-size: 11.5px; border-radius: 999px; display: flex; align-items: center; gap: 5px; }
.mats button i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
.hint { margin: 10px 0 0; padding: 9px 10px; border-radius: 10px; background: rgba(61,245,195,.07); color: #b7d8cc; font-size: 12px; font-weight: 700; }

/* selection panel */
#props { position: fixed; z-index: 4; right: 10px; bottom: 10px; width: 250px; padding: 12px; display: grid; gap: 8px; }
#props h4 { margin: 0; font: 700 15px "Fredoka"; display: flex; justify-content: space-between; align-items: center; }
#props .row { display: flex; gap: 5px; flex-wrap: wrap; }
#props .row button { flex: 1; padding: 6px 4px; font-size: 12px; }
#props label { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 800; color: var(--muted); }
#props select, #props input[type=color] { background: var(--panel2); border: 0; border-radius: 8px; padding: 4px 6px; color: var(--ink); }
#props input[type=color] { width: 44px; height: 28px; padding: 2px; }
.vit { display: grid; gap: 4px; font-size: 11px; font-weight: 800; color: var(--muted); }
.vit div { display: flex; align-items: center; gap: 6px; }
.vit i { flex: 1; height: 6px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
.vit i b { display: block; height: 100%; }

/* context menu */
#ctx { position: fixed; z-index: 30; min-width: 190px; padding: 6px; display: grid; gap: 3px; max-height: 70vh; overflow-y: auto; }
#ctx .h { padding: 4px 8px 6px; font: 700 13px "Fredoka"; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 3px; }
#ctx button { text-align: left; padding: 7px 10px; font-size: 12.5px; background: transparent; border-radius: 8px; }
#ctx button:hover { background: #24344c; }
#ctx .sep { height: 1px; background: var(--line); margin: 3px 0; }

/* HUD for modes */
#hud { position: fixed; z-index: 4; top: 66px; left: 50%; transform: translateX(-50%); padding: 10px 16px; text-align: center; min-width: 260px; max-width: calc(100vw - 640px); }
#hud h2 { margin: 0; font: 700 18px "Fredoka"; }
#hud p { margin: 3px 0 0; color: var(--muted); font-weight: 700; font-size: 13px; }
#hud .row { display: flex; gap: 6px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
#hud .big { font: 700 26px "Fredoka"; color: var(--gold); }
.inv { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
.inv span { padding: 3px 8px; border-radius: 999px; background: var(--panel2); font-size: 12px; font-weight: 800; }

/* replay bar */
#rp { position: fixed; z-index: 6; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(720px, calc(100vw - 30px)); padding: 10px 14px; display: flex; align-items: center; gap: 8px; }
#rp input[type=range] { flex: 1; accent-color: var(--mint); }
#rp .t { font: 700 13px "Fredoka"; min-width: 64px; text-align: right; color: var(--muted); }
.rpTag { position: fixed; z-index: 6; top: 70px; left: 50%; transform: translateX(-50%); font: 700 14px "Fredoka"; letter-spacing: .2em; color: var(--red); text-shadow: 0 0 12px rgba(255,77,94,.6); pointer-events: none; }

/* main menu */
#menu { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: radial-gradient(ellipse at 50% 30%, rgba(13,20,32,.25), rgba(13,20,32,.88) 70%); overflow-y: auto; }
#menu .box { width: min(760px, 100%); display: grid; gap: 16px; justify-items: center; }
#menu h1 { margin: 0; font: 700 clamp(46px, 9vw, 86px)/.95 "Fredoka"; letter-spacing: .01em; text-align: center; color: #b9fbe6;
  text-shadow: 0 6px 0 #0a5a47, 0 14px 24px rgba(0,0,0,.5); }
#menu h1 span { display: inline-block; animation: wob 2.6s ease-in-out infinite; }
#menu h1 span:nth-child(n+7) { color: #ffd98a; text-shadow: 0 6px 0 #8a5a0a, 0 14px 24px rgba(0,0,0,.5); }
#menu h1 span:nth-child(2n) { animation-delay: -.6s; } #menu h1 span:nth-child(3n) { animation-delay: -1.3s; }
@keyframes wob { 50% { transform: translateY(-6px) rotate(-3deg); } }
#menu .sub { color: var(--muted); font-weight: 800; margin-top: -8px; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
.mode { padding: 18px 14px 16px; border-radius: 18px; text-align: center; display: grid; gap: 4px; justify-items: center; background: linear-gradient(180deg, #1d2c42, #142033); box-shadow: 0 6px 0 #0b131f, inset 0 0 0 1px rgba(255,255,255,.07); }
.mode:hover { background: linear-gradient(180deg, #23385a, #182841) !important; }
.mode .ic { font-size: 42px; }
.mode b { font: 700 20px "Fredoka"; }
.mode small { color: var(--muted); font-size: 12px; font-weight: 700; }
.mode.p b { color: #9ff5dd; } .mode.s b { color: #ffd98a; } .mode.d b { color: #ff9aa5; }
.more { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.more button { padding: 10px 14px; font-size: 14px; }

/* modal */
#modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(5,9,15,.65); }
#modal .box { width: min(640px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 18px 20px; }
#modal .box.wide { width: min(920px, 100%); }
#modal h2 { margin: 0 0 8px; font: 700 24px "Fredoka"; }
#modal p { color: #c8d6ea; }
#modal .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 14px; }
#modal textarea, #modal input[type=text] { width: 100%; background: #0c1320; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); padding: 10px; font: 600 12px ui-monospace, monospace; }
#modal textarea { min-height: 120px; resize: vertical; user-select: text; }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.lv { padding: 10px 6px 8px; border-radius: 14px; display: grid; gap: 3px; justify-items: center; text-align: center; }
.lv b { font: 700 20px "Fredoka"; }
.lv small { font-size: 11px; color: var(--muted); font-weight: 800; }
.lv .st { font-size: 13px; letter-spacing: 1px; }
.lv.done { box-shadow: inset 0 0 0 2px rgba(61,245,195,.35); }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.sh { padding: 10px; border-radius: 14px; background: var(--panel2); display: grid; gap: 4px; justify-items: center; text-align: center; }
.sh .ic { font-size: 30px; }
.sh b { font: 700 14px "Fredoka"; } .sh small { color: var(--muted); font-size: 11px; font-weight: 700; }
.sh.eq { box-shadow: inset 0 0 0 2px var(--mint); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
.seg button.on { background: var(--mint); color: #062018; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.ac { padding: 10px; border-radius: 12px; background: var(--panel2); display: flex; gap: 10px; align-items: center; opacity: .5; }
.ac.got { opacity: 1; box-shadow: inset 0 0 0 2px rgba(255,210,63,.4); }
.ac .ic { font-size: 26px; } .ac b { display: block; font: 700 13.5px "Fredoka"; } .ac small { color: var(--muted); font-size: 11px; font-weight: 700; }
.saves { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.sv { border-radius: 12px; background: var(--panel2); overflow: hidden; display: grid; }
.sv img { width: 100%; aspect-ratio: 16/10; object-fit: cover; background: #0c1320; display: block; }
.sv div { padding: 8px; display: grid; gap: 6px; } .sv b { font-size: 13px; } .sv .r { display: flex; gap: 5px; } .sv .r button { flex: 1; padding: 5px; font-size: 12px; }
.set { display: grid; gap: 10px; }
.set label { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel2); font-weight: 800; }
.set label small { display: block; color: var(--muted); font-weight: 700; font-size: 12px; }
.set input[type=range] { accent-color: var(--mint); }
.set input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--mint); }

#toast { position: fixed; z-index: 60; left: 50%; bottom: 24px; transform: translate(-50%, 20px); padding: 10px 16px; border-radius: 12px; background: #101a2a; border: 1px solid var(--line); font-weight: 800; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 30px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); } #toast.good { border-color: rgba(61,245,195,.5); } #toast.bad { border-color: rgba(255,77,94,.5); }
#achPop { position: fixed; z-index: 61; right: 16px; top: 70px; padding: 10px 14px; border-radius: 14px; background: linear-gradient(90deg, #2b2410, #3a2f0d); border: 1px solid rgba(255,210,63,.5); display: flex; gap: 10px; align-items: center; transform: translateX(130%); transition: transform .35s cubic-bezier(.2,1.3,.4,1); }
#achPop.show { transform: none; } #achPop .ic { font-size: 28px; } #achPop b { display: block; color: var(--gold); font: 700 14px "Fredoka"; } #achPop small { font-weight: 800; color: #e9dcb0; }
#loading { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg); font: 700 22px "Fredoka"; color: var(--mint); }

@media (max-width: 900px) {
  #side { width: 236px; } #items .grid { grid-template-columns: repeat(2, 1fr); }
  #hud { max-width: calc(100vw - 280px); left: auto; right: 10px; transform: none; }
  .modes { grid-template-columns: 1fr; }
  #props { width: 210px; }
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="loading">Loading the lab…</div>

<div id="top">
  <button class="glass" id="bMenu" title="Main menu" style="font-size:18px;padding:8px 12px">☰</button>
  <div class="glass" id="modeName">🧪 <b>Sandbox</b></div>
  <div class="glass grp">
    <button id="bPlay" title="Pause / play (Space)">⏸</button>
    <button id="bSlow" title="Slow motion (T)">🐢</button>
    <button id="bReplay" title="Slow-mo replay of the last 10 seconds (R)">⏪</button>
    <button id="bXray" title="X-ray (X)">🩻</button>
  </div>
  <div class="glass grp" id="gEdit">
    <button id="bUndo" title="Undo (Ctrl+Z)">↶</button>
    <button id="bRedo" title="Redo (Ctrl+Y)">↷</button>
    <button id="bClear" title="Clear everything">🧹</button>
  </div>
  <div class="sp"></div>
  <div class="glass grp" id="gFile">
    <button id="bSave" title="Save this creation">💾</button>
    <button id="bShare" title="Share code">🔗</button>
    <button id="bNet" title="Online">🌐</button>
  </div>
  <div class="glass" id="coins">🪙 0</div>
  <div class="glass grp"><button id="bSet" title="Settings">⚙️</button></div>
</div>

<div id="side" class="glass"><div id="cats"></div><div id="items"></div></div>
<div id="props" class="glass" hidden></div>
<div id="ctx" class="glass" hidden></div>
<div id="hud" class="glass" hidden></div>
<div id="rp" class="glass" hidden>
  <button id="rpPlay">⏸</button>
  <input type="range" id="rpBar" min="0" max="100" value="100">
  <span class="t" id="rpT">0.0s</span>
  <select id="rpSpd" title="Replay speed"><option value="0.1">0.1×</option><option value="0.25" selected>0.25×</option><option value="0.5">0.5×</option><option value="1">1×</option></select>
  <button id="rpX" title="X-ray">🩻 X-ray</button>
  <button id="rpClose" class="primary">Done</button>
</div>
<div class="rpTag" id="rpTag" hidden>● REPLAY</div>

<div id="menu">
  <div class="box">
    <h1><span>T</span><span>u</span><span>m</span><span>b</span><span>l</span><span>e</span> <span>L</span><span>a</span><span>b</span></h1>
    <div class="sub">Build it. Break it. Blow it up.</div>
    <div class="modes">
      <button class="mode p" data-go="puzzle"><span class="ic">🧩</span><b>Puzzle mode</b><small>Solve physics puzzles with a few parts. Earn stars.</small></button>
      <button class="mode s" data-go="sandbox"><span class="ic">🧪</span><b>Sandbox</b><small>Everything unlocked so far. No rules.</small></button>
      <button class="mode d" data-go="destroy"><span class="ic">💥</span><b>Destruction</b><small>Level buildings with limited explosives.</small></button>
    </div>
    <div class="more">
      <button data-go="online">🌐 Online & battles</button>
      <button data-go="saves">💾 My creations</button>
      <button data-go="shop">🛒 Shop</button>
      <button data-go="ach">🏆 Achievements</button>
      <button data-go="plus">⭐ Human Plus</button>
      <button data-go="set">⚙️ Settings</button>
    </div>
  </div>
</div>

<div id="modal" hidden><div class="box glass" id="mbox"></div></div>
<div id="toast"></div>
<div id="achPop"><span class="ic">🏆</span><div><b id="achT"></b><small id="achD"></small></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
<script>
'use strict';
(() => {

// =====================================================================================================
//  TUMBLE LAB · core: helpers, saving, sound, materials, physics world, things & bodies, camera
// =====================================================================================================
const { Engine, Bodies, Body, Composite, Constraint, Query, Events, Vertices } = Matter;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const angDiff = (a) => { a = (a + Math.PI) % (Math.PI * 2); if (a < 0) a += Math.PI * 2; return a - Math.PI; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const SET = Object.assign({ blood: true, vol: 0.7, voices: true, particles: 1, warned: false, outlines: true }, store.get('tl_set', {}));
const saveSet = () => store.set('tl_set', SET);
let toastT = 0;
function toast(msg, cls) { const el = $('toast'); el.textContent = msg; el.className = 'show ' + (cls || ''); clearTimeout(toastT); toastT = setTimeout(() => { el.className = ''; }, 2400); }

// ------------------------------------------------------------------ sound (all made live with Web Audio)
let AC = null, master = null, NOISE = null;
function ac() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = SET.vol;
      const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
      master.connect(comp); comp.connect(AC.destination);
      const len = AC.sampleRate * 2; NOISE = AC.createBuffer(1, len, AC.sampleRate);
      const d = NOISE.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
const sndLast = {};
function ok(name, gap) { const t = performance.now(); if (t - (sndLast[name] || 0) < gap) return false; sndLast[name] = t; return true; }
function env(g, t, a, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function tone(f, dur, type = 'sine', vol = 0.3, f2 = 0, delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  env(g, t, 0.005, vol, dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol = 0.3, ftype = 'lowpass', f = 1000, q = 1, f2 = 0, delay = 0, attack = 0.004) {
  if (!AC) return; const t = AC.currentTime + delay, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; s.loop = true; fl.type = ftype; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
  if (f2) fl.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
  env(g, t, attack, vol, dur); s.connect(fl); fl.connect(g); g.connect(master);
  s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
}
// a voice: a buzzing throat (sawtooth) through mouth-shape filters ("formants"), so it sounds like ah / oh / uh

    out.push(KINDS.plank.spawn(x, y - 67, { mat, w: 130, h: 14 }));

  }

// ------------------------------------------------------------------ keyboard
window.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea, select')) return;
  if (!$('menu').hidden && e.key !== 'Escape') return;
  const k = e.key.toLowerCase(), ctrl = e.ctrlKey || e.metaKey;
  G.keys[k] = true;
  if (ctrl && k === 'z') { e.preventDefault(); undo(); return; }
  if (ctrl && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
  if (ctrl && k === 'c') { copySel(); return; }
  if (ctrl && k === 'v') { if (CLIP) act({ t: 'paste', data: CLIP, x: M.x, y: M.y }); return; }
  if (ctrl && k === 'd') { e.preventDefault(); copySel(); if (CLIP) act({ t: 'paste', data: CLIP, x: M.x + 30, y: M.y }); return; }
  if (ctrl) return;
  if (k === ' ') { e.preventDefault(); togglePause(); }
  else if (k === 't') toggleSlow();
  else if (k === 'r' && !SEL.size) openReplay();
  else if (k === 'r' && SEL.size) act({ t: 'rot', ids: [...SEL].map((t) => t.id), da: (e.shiftKey ? -1 : 1) * Math.PI / 12 });
  else if (k === 'q' && SEL.size) act({ t: 'rot', ids: [...SEL].map((t) => t.id), da: -Math.PI / 12 });
  else if (k === 'e' && SEL.size) act({ t: 'rot', ids: [...SEL].map((t) => t.id), da: Math.PI / 12 });
  else if ((k === '+' || k === '=') && SEL.size) act({ t: 'scale', ids: [...SEL].map((t) => t.id), s: 1.15 });
  else if (k === '-' && SEL.size) act({ t: 'scale', ids: [...SEL].map((t) => t.id), s: 1 / 1.15 });
  else if (k === 'x') toggleXray();
  else if (k === 'b') act({ t: 'c4' });
  else if (k === 'g') act({ t: 'machines' });
  else if (k === 'f') { const b = bodyNear(M.x, M.y); if (b && b.tl.thing) act({ t: 'use', id: b.tl.thing.id }); }
  else if (k === 'delete' || k === 'backspace') { if (SEL.size) { act({ t: 'del', ids: [...SEL].map((t) => t.id) }); SEL.clear(); paintProps(); } }
  else if (k === 'escape') { if (G.replay) closeReplay(); else if (!$('modal').hidden) closeModal(); else if (M.first) { M.first = null; } else if (SEL.size) { SEL.clear(); paintProps(); } else if ($('menu').hidden && G.mode !== 'menu') openMenu(); }

  const sp = 12 / cam.z;

async function packCode(obj) {
  const json = JSON.stringify(obj);
  try {
    if (window.CompressionStream) {
      const s = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      const buf = new Uint8Array(await new Response(s).arrayBuffer());
      let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
      return 'TL2-' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
  } catch (e) { /* fall back below */ }
  return 'TL1-' + btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function unpackCode(code) {
  code = String(code || '').trim().replace(/\s+/g, '');
  const kind = code.slice(0, 4), b64 = code.slice(4).replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  if (kind === 'TL1-') return JSON.parse(decodeURIComponent(escape(bin)));
  if (kind !== 'TL2-') throw new Error('not a Tumble Lab code');
  const buf = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(s).text());
}

  if (m.cr) for (const r of m.cr) { const c = things.get(r[0]); if (!c) continue; [, c.alive, c.conscious, c.face, c.blood, c.burnNow, c.frozen] = r; c.alive = !!c.alive; c.conscious = !!c.conscious; c.burnNow = !!c.burnNow; c.kind = r[7]; if (r[9]) c.wounds = r[9].map(([p, x, y, kind, rr2, bleed]) => ({ p, x, y, kind, r: rr2, bleed })); c.bones = {}; for (const n of r[10] || []) c.bones[n] = 1; c.plus.skeleton = !!r[11]; c.plus.rainbow = !!r[12]; c.plus.metal = !!r[13]; c.pain = r[14]; c.burn = r[15]; }
  if (m.fire) { const ids = new Set(m.fire); for (const x of allBodies()) if (x.tl) x.tl.fire = ids.has(x.tl.id) ? 0.8 : 0; }
  if (m.g != null) engine.gravity.y = m.g;
}
// clients glide every body toward where the host says it is
function clientGlide() {
  if (NET.role !== 'client') return;
  for (const [id, [x, y, a]] of NET.target) {
    const b = byId.get(id); if (!b) continue;
    const dx = x - b.position.x, dy = y - b.position.y;
    if (Math.abs(dx) > 200 || Math.abs(dy) > 200) Body.setPosition(b, { x, y }); else Body.setPosition(b, { x: b.position.x + dx * 0.45, y: b.position.y + dy * 0.45 });
    Body.setAngle(b, b.angle + angDiff(a - b.angle) * 0.45);
  }
  // clients still drip blood from the wounds they can see
  if (SET.blood && STEP % 6 === 0) for (const c of CREATURES) if (c.kind !== 'robot') for (const w of c.wounds) if (w.bleed > 0.4 && Math.random() < w.bleed * 0.3) { const pb = c.parts[w.p]; if (pb) { const p = toWorldPt(pb, w.x, w.y); dropBlood(p.x, p.y, rnd(-0.5, 0.5), 0, 1); } }
}

// ------------------------------------------------------------------ contraption battles
let BT = null;
const ZONE = 760, ARENA = 1150;
function battleArena() {
  lockAll(spawnKind('platform', -ARENA - 20, -200, { w: 40, h: 400, mat: 'metal' })); lockAll(spawnKind('platform', ARENA + 20, -200, { w: 40, h: 400, mat: 'metal' }));
}
function startBattle(bot) {
  hideMenu(); resetModeRules(); clearWorld();
  G.mode = 'battle'; G.paused = true; setPauseBtn();
  BT = { phase: 'wait', bot, budget: {}, cores: {}, side: {}, names: {}, owner: new Map(), left: 0, result: null };
  battleArena();
  if (bot) { BT.side.me = -1; BT.side.bot = 1; BT.names.me = NET.name; BT.names.bot = '🤖 Bot'; battleBegin(); }
  else { BT.side.host = -1; BT.names.host = NET.name; }
  G.allowCats = ['tools', 'objects', 'boom', 'weapons', 'machines']; G.toolAllow = ['select', 'weld', 'hinge', 'rope', 'spring', 'erase', 'use'];
  G.cat = 'machines'; G.tool = 'car';
  centerCam(0, -260, Math.min(0.75, VW / 2600));
  setModeUI('⚔️ <b>Contraption battle</b>'); paintHud();
}
function battleBegin() {
  const me = NET.role === 'host' ? 'host' : 'me';
  if (!BT.bot) { const other = [...NET.conns.values()][0]; if (!other) return; BT.side[other.pid] = 1; BT.names[other.pid] = other.name; }
  BT.phase = 'build'; BT.t0 = STEP; BT.left = 90;
  for (const pid of Object.keys(BT.side)) { BT.budget[pid] = 30; const c = lockAll(spawnKind('core', BT.side[pid] * 560, -20, {}))[0]; BT.cores[pid] = c.id; BT.owner.set(c.id, pid); c.coreOf = pid; }
  if (BT.bot) botBuild();
  sfx('win'); toast('⚔️ Build your machine around your 💎 core! 90 seconds.', 'good');
  btSync();
}
function btPublic() { return { phase: BT.phase, left: BT.left, budget: BT.budget, cores: BT.cores, side: BT.side, names: BT.names, result: BT.result }; }
function btSync() { if (NET.role === 'host') hostAll({ c: 'bt', b: btPublic() }); paintHud(); }
function myBtId() { return NET.role === 'client' ? NET.myPid : NET.role === 'host' ? 'host' : 'me'; }
function battleCanSpawn(kind, who) {
  if (!BT || BT.phase !== 'build') { if (who === 'me' || who === 'host') toast('You can only build during the build phase.'); return false; }
  const pid = who === 'me' && NET.role === 'host' ? 'host' : who;
  if (KINDS_LIFE[kind] || kind === 'nuke' || kind === 'core') return false;
  if ((BT.budget[pid] || 0) <= 0) { if (pid === myBtId()) toast('No parts left!', 'bad'); return false; }
  return true;
}
function battleSpawned(kind, list, who) {
  const pid = who === 'me' && NET.role === 'host' ? 'host' : who, side = BT.side[pid] || -1;
  for (const t of list) {
    const c = centerOf(t), x = clamp(c.x, side < 0 ? -ZONE - 300 : 150, side < 0 ? -150 : ZONE + 300);
    if (x !== c.x) for (const b of t.bodies) Body.setPosition(b, { x: b.position.x + x - c.x, y: b.position.y });
    BT.owner.set(t.id, pid);
  }
  BT.budget[pid] = Math.max(0, (BT.budget[pid] || 0) - 1);
  btSync();
}
function battleTick() {
  if (!BT || G.mode !== 'battle' || BT.client) return;
  if (NET.role === 'client') return;
  if (BT.phase === 'build') {
    BT.left = Math.max(0, 90 - Math.floor((STEP - BT.t0) / 60));
    if (STEP % 60 === 0) btSync();
    if (BT.left <= 0 || G.battleGo) { G.battleGo = false; BT.phase = 'fight'; BT.t0 = STEP; G.paused = false; setPauseBtn(); for (const t of things.values()) { if (['wheel', 'car', 'truck', 'thruster', 'spinner', 'fan', 'piston', 'magnet'].includes(t.kind)) t.data.on = 1; if (GUN[t.kind] || t.kind === 'flamer') t.data.auto = 1; if (t.kind === 'grenade' || t.kind === 'dynamite') t.data.fuse = STEP + 120 + Math.random() * 200; } sfx('boom', 0.6); toast('⚔️ FIGHT!', 'good'); btSync(); }
  } else if (BT.phase === 'fight') {
    BT.left = Math.max(0, 75 - Math.floor((STEP - BT.t0) / 60));
    if (STEP % 60 === 0) btSync();
    const alive = {};
    for (const pid in BT.cores) { const t = things.get(BT.cores[pid]); const b = t && t.bodies[0]; alive[pid] = b && !b.tl.dead && Math.abs(b.position.x) < ARENA + 40 && b.position.y < 300 ? b.tl.hp / b.tl.maxHp : 0; }
    const ids = Object.keys(alive), dead = ids.filter((p) => alive[p] <= 0);
    if (dead.length || BT.left <= 0) {
      let win = null; if (dead.length === 1) win = ids.find((p) => p !== dead[0]); else if (!dead.length) { const s = ids.sort((a, b) => alive[b] - alive[a]); if (alive[s[0]] - alive[s[1]] > 0.02) win = s[0]; }
      BT.phase = 'over'; BT.result = { win, name: win ? BT.names[win] : '' }; btSync(); battleResult(BT.result);
    }
  }
}
function battleResult(r) {
  const me = myBtId(), won = r.win === me;
  if (won) { stat('battleWins'); addCoins(60); }
  sfx(won ? 'win' : r.win ? 'lose' : 'ui'); if (won) confettiBurst();
  openModal(`<h2>${won ? '🏆 You win!' : r.win ? `💥 ${esc(r.name)} wins` : '🤝 Draw'}</h2><p>${won ? '+🪙60' : 'Build something nastier next time!'}</p>
    <div class="row">${NET.role === 'host' || BT && BT.bot ? '<button class="primary" data-m="net-battle">⚔️ Rematch</button>' : ''}<button data-m="${NET.role ? 'net-leave' : 'menu'}">${NET.role ? 'Leave' : 'Menu'}</button></div>`);
}
function paintBattleHud() {
  const H = $('hud');
  if (!BT) { H.hidden = true; return; }
  const me = myBtId(), names = Object.entries(BT.names || {}).map(([p, n]) => `${BT.side[p] < 0 ? '⬅️' : '➡️'} ${esc(n)}${p === me ? ' (you)' : ''}`).join(' · ');
  H.innerHTML = BT.phase === 'wait' ? `<h2>⚔️ Waiting for a second player…</h2><p>Room code <b style="color:var(--mint);letter-spacing:.15em">${NET.code}</b></p>`
    : `<h2>${BT.phase === 'build' ? '🔧 Build!' : BT.phase === 'fight' ? '⚔️ Fight!' : '🏁 Over'} <span class="big" style="font-size:22px">${BT.left}s</span></h2><p>${names}</p>${BT.phase === 'build' ? `<p>Parts left: <b>${BT.budget[me] ?? 0}</b> · Build on your side, around your 💎 core. Destroy theirs or push it out!</p>${NET.role !== 'client' ? '<div class="row"><button class="warn" id="hFight">⚔️ Start the fight now</button></div>' : ''}` : ''}`;
  H.hidden = false;
  const f = $('hFight'); if (f) f.onclick = () => { G.battleGo = true; };
}
function battleOverlay() {
  if (!BT || BT.phase !== 'build') return;
  for (const s of [-1, 1]) { ctx.fillStyle = s < 0 ? 'rgba(77,163,255,.07)' : 'rgba(255,77,94,.07)'; const x0 = s < 0 ? -ZONE - 300 : 150, x1 = s < 0 ? -150 : ZONE + 300; ctx.fillRect(x0, -900, x1 - x0, 900); ctx.strokeStyle = s < 0 ? 'rgba(77,163,255,.5)' : 'rgba(255,77,94,.5)'; ctx.lineWidth = 2 / cam.z; ctx.setLineDash([10 / cam.z, 8 / cam.z]); ctx.strokeRect(x0, -900, x1 - x0, 900); ctx.setLineDash([]); }
}
// the bot builds one of a few nasty machines
function botBuild() {
  const kind = pick(['ram', 'gun', 'bomb']), X = 560, own = (list) => { for (const t of [].concat(list)) BT.owner.set(t.id, 'bot'); return list; };
  const truck = own(spawnKind('truck', X - 120, -60, {}))[0];
  const core = things.get(BT.cores.bot); const cb = core.bodies[0]; Body.setPosition(cb, { x: X - 120, y: -110 });
  makeLink('weld', truck.bodies[0], { x: X - 120, y: -90 }, cb, { x: X - 120, y: -90 }, { quiet: 1 });
  if (kind === 'ram') { const r = own(spawnKind('box', X - 210, -70, { mat: 'metal', w: 30, h: 70 }))[0]; makeLink('weld', truck.bodies[0], { x: X - 195, y: -70 }, r.bodies[0], { x: X - 195, y: -70 }, { quiet: 1 }); }
  if (kind === 'gun') { const g = own(spawnKind('rifle', X - 140, -140, {}))[0]; Body.setAngle(g.bodies[0], Math.PI); makeLink('weld', cb, { x: X - 130, y: -130 }, g.bodies[0], { x: X - 130, y: -130 }, { quiet: 1 }); }
  if (kind === 'bomb') { const t = own(spawnKind('tnt', X - 210, -70, {}))[0]; makeLink('weld', truck.bodies[0], { x: X - 195, y: -70 }, t.bodies[0], { x: X - 195, y: -70 }, { quiet: 1 }); }
  // drive left
  truck.data.spd = -0.22;
}

// =====================================================================================================
//  main loop, slow-mo replay with x-ray, top bar, first-time notice, start-up
// =====================================================================================================
function step() {
  G.timeScale = G.slow ? 0.25 : 1; engine.timing.timeScale = G.timeScale;
  STEP++;
  for (const cr of CREATURES) { creatureStep(cr); plusStep(cr); }
  machineStep(); liquidStep(); fireStep();
  Engine.update(engine, DT);
  ropeStep(); processBreaks(); particleStep(); cleanup();
  record();
  puzzleTick(); destroyTick(); battleTick(); netTick();
}
// ---- recording the last 10 seconds for the replay
function record() {
  if (STEP % 2) return;
  const list = allBodies(), arr = new Float32Array(list.length * 4); let n = 0;
  for (const b of list) {
    if (!b.tl || b.tl.room) continue;
    if (!REC.archive.has(b.tl.id)) REC.archive.set(b.tl.id, b.tl);
    arr[n++] = b.tl.id; arr[n++] = b.position.x; arr[n++] = b.position.y; arr[n++] = b.angle;
  }
  REC.frames.push({ s: STEP, items: arr.subarray(0, n) });
  if (REC.frames.length > 300) REC.frames.shift();
  const first = REC.frames[0].s;
  while (REC.events.length && REC.events[0].s < first - 30) REC.events.shift();
  if (STEP % 600 === 0) { const keep = new Set(); for (const f of REC.frames) for (let i = 0; i < f.items.length; i += 4) keep.add(f.items[i]); for (const id of REC.archive.keys()) if (!keep.has(id) && !byId.has(id)) REC.archive.delete(id); }
}
function openReplay() {
  if (G.mode === 'menu') return;
  if (REC.frames.length < 20) { toast('Nothing to replay yet: let something happen first!'); return; }
  G.replay = { i: Math.max(0, REC.frames.length - 180), play: true, spd: +$('rpSpd').value, xray: G.xray, acc: 0, frames: REC.frames.slice(), events: REC.events.slice() };
  REC.frames = G.replay.frames;   // freeze what we're watching
  $('rp').hidden = false; $('rpTag').hidden = false; $('rpBar').max = REC.frames.length - 1;
  $('rpX').classList.toggle('on', G.replay.xray); $('rpPlay').textContent = '⏸';
  hideCtx(); stat('replays'); sfx('whoosh');
}
function closeReplay() { G.replay = null; $('rp').hidden = true; $('rpTag').hidden = true; }
function replayTick(dt) {
  const R = G.replay; if (!R) return;
  if (R.play) { R.acc += dt * R.spd; while (R.acc >= 33.3) { R.acc -= 33.3; R.i++; if (R.i >= REC.frames.length - 1) { R.i = REC.frames.length - 1; R.play = false; $('rpPlay').textContent = '▶'; break; } } }
  $('rpBar').value = R.i; $('rpT').textContent = ((R.i - REC.frames.length + 1) * 2 / 60).toFixed(1) + 's';
}
$('rpPlay').onclick = () => { const R = G.replay; if (!R) return; if (!R.play && R.i >= REC.frames.length - 1) R.i = 0; R.play = !R.play; $('rpPlay').textContent = R.play ? '⏸' : '▶'; };
$('rpBar').oninput = (e) => { if (G.replay) { G.replay.i = +e.target.value; G.replay.play = false; $('rpPlay').textContent = '▶'; } };
$('rpSpd').onchange = (e) => { if (G.replay) G.replay.spd = +e.target.value; };
$('rpX').onclick = () => { if (!G.replay) return; G.replay.xray = !G.replay.xray; $('rpX').classList.toggle('on', G.replay.xray); if (G.replay.xray) stat('xrays'); };
$('rpClose').onclick = closeReplay;

// ---- top bar
function togglePause() {
  if (NET.role === 'client') { toast('Only the host can pause.'); return; }
  if ((G.mode === 'puzzle' || G.mode === 'destroy' || G.mode === 'battle') && G.phase !== 'run' && G.phase !== 'boom' && !(BT && BT.phase === 'fight')) { toast(G.mode === 'puzzle' ? 'Press ▶ Run to start.' : 'Not yet!'); return; }
  G.paused = !G.paused; setPauseBtn();
}
function setPauseBtn() { $('bPlay').textContent = G.paused ? '▶' : '⏸'; $('bPlay').classList.toggle('on', G.paused); }
function toggleSlow() { if (NET.role === 'client') { toast('Only the host can use slow-mo online.'); return; } G.slow = !G.slow; $('bSlow').classList.toggle('on', G.slow); toast(G.slow ? '🐢 Slow motion' : '🐇 Normal speed'); }
function toggleXray() { G.xray = !G.xray; $('bXray').classList.toggle('on', G.xray); if (G.xray) stat('xrays'); toast(G.xray ? '🩻 X-ray on' : '🩻 X-ray off'); }
$('bMenu').onclick = () => { sfx('ui'); if (NET.role) { roomModal(); return; } openMenu(); };
$('bPlay').onclick = togglePause; $('bSlow').onclick = toggleSlow; $('bReplay').onclick = openReplay; $('bXray').onclick = toggleXray;
$('bUndo').onclick = undo; $('bRedo').onclick = redo;
$('bClear').onclick = () => { if (NET.role === 'client') { toast('Only the host can clear the lab.'); return; } act({ t: 'clear' }); toast('🧹 Cleared. Press ↶ to undo.'); };
$('bSave').onclick = askSave;
$('bShare').onclick = async () => { showCode(await packCode(serWorld())); };
$('bNet').onclick = openOnline; $('bSet').onclick = openSettings;

// ---- the loop
let lastT = performance.now(), acc = 0, demoNext = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(100, now - lastT); lastT = now;
  try {
    heldKeys();
    if (G.replay) replayTick(dt);
    else if (NET.role === 'client') { acc += dt; while (acc >= DT) { acc -= DT; STEP++; particleStep(); } clientGlide(); }
    else if (!G.paused) {
      acc += dt; let n = 0;
      while (acc >= DT && n < 3) { step(); acc -= DT; n++; }
      if (n >= 3) acc = 0;
    } else acc = 0;
    if (G.mode === 'menu') demoTick();
    render();
    if (STEP % 20 === 0) uiTick();
  } catch (err) { console.error(err); }
}
function demoTick() {
  cam.x += Math.sin(performance.now() / 4000) * 0.15;
  if (STEP > demoNext) {
    demoNext = STEP + 300;
    const r = Math.random();
    if (r < 0.3) { const t = spawnKind('ball', rnd(-200, 400), -700, { mat: pick(['metal', 'rubber', 'stone']), r: rnd(18, 34) }); }
    else if (r < 0.55) { const t = spawnKind('grenade', rnd(-100, 300), -500, {})[0]; t.data.fuse = STEP + 150; }
    else if (r < 0.75) spawnKind('box', rnd(-300, 300), -600, { mat: pick(BUILD_MATS), w: rnd(30, 70), h: rnd(30, 70) });
    else spawnCreature('human', rnd(-300, 300), -800, {});
    if (STEP - G.demoT > 60 * 45 || things.size > 120) demoScene();
  }
}
function uiTick() {
  if (SEL.size === 1 && [...SEL][0].type === 'cr' && !$('props').hidden) paintProps();
  if (G.mode === 'puzzle' && G.phase === 'run') { const L = LEVELS[G.level], left = Math.max(0, (L.time || 10) - (STEP - G.runAt) / 60); const p = $('hud').querySelector('p'); if (p) p.textContent = `${L.goal} · ⏱ ${left.toFixed(0)}s`; }
}

// ---- the first time: a heads-up about blood
function warnFirst() {
  if (SET.warned) return;
  $('modal').dataset.lock = 1;
  openModal(`<h2>🧪 Welcome to Tumble Lab!</h2><p>This lab has <b>cartoon blood, weapons and ragdoll violence</b>: people can get hurt, break bones and lose limbs.</p><p>Prefer it clean? Turn <b>Blood & gore</b> off now or any time in ⚙️ Settings.</p>
    <div class="row"><button data-m="warn-off">🧼 Turn blood off</button><button class="primary" data-m="warn-ok">Got it, let's play</button></div>`);
}
$('modal').addEventListener('click', (e) => { const b = e.target.closest('[data-m="warn-off"]'); if (b) { SET.blood = false; SET.warned = true; saveSet(); delete $('modal').dataset.lock; closeModal(); toast('🧼 Blood is off. Turn it back on in ⚙️ Settings.'); } });

// ---- start
function boot() {
  resize(); addEventListener('resize', resize);
  buildRoom(); paintCoins(); paintCats(); paintItems(); paintNet();
  G.mode = 'menu'; $('side').hidden = true; $('top').style.visibility = 'hidden';
  demoScene();
  $('loading').hidden = true;
  requestAnimationFrame(loop);
  warnFirst();
  // pasted share links: tumble-lab.html#code=TL2-...
  const m = /[#&]code=(TL[12]-[A-Za-z0-9_-]+)/.exec(location.hash);
  if (m) unpackCode(m[1]).then((d) => startSandbox(d)).catch(() => toast('That share link is broken.', 'bad'));
}
if (!window.Matter) { $('loading').textContent = 'Could not load the physics engine. Check your internet and refresh.'; }
else boot();
})();
</script>
