<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midnight Velvet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Monoton&family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky neon marquee bar over a velvet room. Lobby = marquee hero + game grid; each game = green felt stage beside a brass control panel. Deliberately single dark theme (it's a casino at midnight). */
:root{
  --ink:#140810; --velvet:#22101a; --velvet-2:#311524; --line:#4b2337; --cream:#f6ead4; --muted:#c3a69d;
  --brass:#e9b95f; --brass-2:#b5883a; --brass-hi:#f7d891; --ruby:#ff3b5c; --violet:#9b6bff; --ember:#ff7a45; --teal:#3f9a82;
  --felt:#0d3a2d; --felt-2:#18634b; --felt-deep:#072419; --rail:#3b1d12;
  --paper:#fbf4e6; --card-ink:#1c1218; --card-red:#c4122f;
  --pocket-red:#b5122f; --pocket-black:#1a1016; --pocket-green:#0f7a4f;
  --win:#6ef0a8; --lose:#ff5a6e;
  --chip-1:#e8dfcf; --chip-5:#d6203f; --chip-25:#1f8a5b; --chip-100:#22202a; --chip-500:#7b4dff; --chip-1k:#e9b95f; --chip-5k:#ff7a2e;
  --f-neon:'Monoton','Limelight',Georgia,serif; --f-disp:'Limelight',Georgia,'Times New Roman',serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink);color:var(--cream)}
body{font:15px/1.5 var(--f-body);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(55% 40% at 12% -8%,rgba(255,59,92,.20),transparent 70%),
  radial-gradient(45% 35% at 100% 6%,rgba(233,185,95,.13),transparent 70%),
  radial-gradient(70% 45% at 50% 115%,rgba(155,107,255,.14),transparent 70%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.02) 0 1px,transparent 1px 22px),
  repeating-linear-gradient(-45deg,rgba(255,255,255,.02) 0 1px,transparent 1px 22px),var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--ink) 95%,transparent);border-bottom:1px solid var(--line)}
.logo{font-family:var(--f-neon);font-size:21px;line-height:1;color:var(--cream);text-decoration:none;white-space:nowrap;text-shadow:0 0 4px var(--ruby),0 0 14px var(--ruby),0 0 30px rgba(255,59,92,.5);animation:flicker 7s infinite;will-change:opacity}
.logo span{color:var(--brass-hi);text-shadow:0 0 4px var(--brass),0 0 14px var(--brass),0 0 30px rgba(233,185,95,.4)}
@keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.4}94%{opacity:1}96%{opacity:.6}97%{opacity:1}}
.spacer{flex:1}
.bal{position:relative;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--velvet);border:1px solid var(--line);font:500 16px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bal.up{animation:balpulse .6s}
.bal.down{animation:balshake .35s}
@keyframes balpulse{40%{box-shadow:0 0 0 4px rgba(110,240,168,.25),0 0 30px rgba(110,240,168,.35);border-color:var(--win)}}
@keyframes balshake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.delta{position:absolute;right:12px;top:-2px;font:600 13px var(--f-mono);pointer-events:none;animation:rise 1.3s ease-out forwards}
.delta.p{color:var(--win)} .delta.n{color:var(--lose)}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
.ibtn{appearance:none;background:var(--velvet);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;font:600 13px var(--f-body);white-space:nowrap;transition:background .2s,border-color .2s}
.ibtn:hover{background:var(--velvet-2);border-color:var(--brass-2)}
.ibtn.gold{position:relative;background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:#2a1406;border-color:var(--brass-hi)}
.ibtn.gold::before,#dailyBtn.ready::before{content:"";position:absolute;inset:-1px;border-radius:inherit;box-shadow:0 0 18px rgba(233,185,95,.75);opacity:0;animation:glowo 1.6s ease-in-out infinite;pointer-events:none}
@keyframes glowo{50%{opacity:1}}
@keyframes glow{50%{opacity:.75}}
@media (max-width:560px){.logo{font-size:16px}.top{gap:6px}.ibtn{padding:6px 9px;font-size:12px}.bal{font-size:14px}.hide-sm{display:none}}

/* ---------- chips ---------- */
.chip{--c:var(--chip-5);--t:var(--paper);position:relative;width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font:600 11px var(--f-mono);color:var(--t);
  background:radial-gradient(circle,var(--c) 0 55%,transparent 56%),repeating-conic-gradient(var(--paper) 0 14deg,var(--c) 14deg 45deg);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.4)}
.chip>span{width:66%;height:66%;border-radius:50%;border:1.5px dashed rgba(255,255,255,.5);display:grid;place-items:center}
.chip.lt{--t:var(--card-ink)} .chip.lt>span{border-color:rgba(0,0,0,.35)}
.rack{display:flex;flex-wrap:wrap;gap:8px}
.rack .chip{cursor:pointer;border:0;padding:0;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.rack .chip:hover{transform:translateY(-4px)}
.rack .chip.sel{transform:translateY(-6px) scale(1.08);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 0 0 3px var(--brass-hi),0 8px 22px rgba(233,185,95,.5)}
.pchip{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;font-size:9.5px;pointer-events:none;z-index:2}
.pchip.pop{animation:chipdrop .32s cubic-bezier(.3,1.7,.5,1)}
@keyframes chipdrop{from{transform:translateY(-22px) scale(1.3);opacity:0}}

/* ---------- layout ---------- */
main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:22px 16px 90px;overflow-x:clip}
.btn{appearance:none;border:1px solid var(--line);background:var(--velvet-2);color:var(--cream);font:700 14px var(--f-body);letter-spacing:.02em;padding:11px 14px;border-radius:12px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s,background .2s,box-shadow .2s,opacity .2s}
.btn:hover:not(:disabled){background:var(--line);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--brass-hi),var(--brass) 45%,var(--brass-2));color:#2a1406;border-color:var(--brass-hi);font-size:16px;padding:15px 18px;text-transform:uppercase;letter-spacing:.1em;box-shadow:0 8px 26px -8px rgba(233,185,95,.7),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#fbe3a8,var(--brass-hi) 45%,var(--brass))}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.btn.primary:hover::after{transform:translateX(120%)}
.btn.cash{background:linear-gradient(180deg,#a8ffd0,var(--win));color:#062a18;border-color:#b9ffd9;box-shadow:0 8px 26px -8px rgba(110,240,168,.8)}
.btn.cash:hover:not(:disabled){background:linear-gradient(180deg,#c6ffe2,#8ff5bd)}
.btn.sm{padding:8px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.split{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.panel{background:linear-gradient(180deg,var(--velvet-2),var(--velvet));border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font:400 15px var(--f-disp);color:var(--brass);letter-spacing:.06em}
.lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.inrow{display:flex;gap:6px;align-items:stretch}
.inrow input,.inrow select{flex:1;min-width:0}
input[type=number],input[type=text],input[type=password],select{appearance:none;-moz-appearance:textfield;background:var(--ink);border:1px solid var(--line);border-radius:10px;color:var(--cream);font:500 16px var(--f-mono);padding:10px 12px;width:100%}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]:focus,input[type=text]:focus,input[type=password]:focus,select:focus{outline:none;border-color:var(--brass)}
.inrow .btn{padding:8px 10px;font-size:13px;flex:none}
.inrow>span{align-self:center;color:var(--muted);font-family:var(--f-mono)}
.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.seg{display:flex;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--velvet-2);color:var(--cream);box-shadow:inset 0 0 0 1px var(--brass-2)}
.seg button:disabled{cursor:not-allowed;opacity:.5}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:500 12px var(--f-mono);padding:3px 8px;border-radius:999px;background:var(--velvet-2);border:1px solid var(--line);animation:pillin .35s cubic-bezier(.3,1.6,.5,1)}
.pill.g{color:var(--win);border-color:rgba(110,240,168,.35)} .pill.r{color:var(--lose);border-color:rgba(255,90,110,.35)} .pill.y{color:var(--brass)}
@keyframes pillin{from{transform:scale(.4);opacity:0}}

/* ---------- felt + result ---------- */
.felt{position:relative;contain:layout paint;border-radius:28px;padding:22px;min-height:400px;background:radial-gradient(120% 90% at 50% 0%,var(--felt-2),var(--felt) 58%,var(--felt-deep));border:10px solid var(--rail);box-shadow:inset 0 0 0 2px rgba(233,185,95,.35),inset 0 0 70px rgba(0,0,0,.55),0 30px 60px -30px rgba(0,0,0,.9);overflow:hidden;min-width:0}
.felt::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background:repeating-radial-gradient(circle at 30% 20%,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
@media (max-width:560px){.felt{padding:14px;border-width:6px;border-radius:20px;min-height:340px}}
.stage{position:relative;contain:layout paint;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#1b0c16,#0e050b);border:1px solid var(--line);min-width:0}
.result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;padding:14px 26px;border-radius:18px;background:rgba(20,8,16,.92);border:1px solid var(--line);transition:transform .4s cubic-bezier(.3,1.6,.5,1),opacity .3s;z-index:20;min-width:180px;max-width:90%}
.result.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.result b{display:block;font:400 clamp(30px,6vw,48px)/1.05 var(--f-disp)}
.result span{display:block;margin-top:4px;font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.result.win{border-color:rgba(110,240,168,.5)} .result.win b{color:var(--win);text-shadow:0 0 22px rgba(110,240,168,.6)}
.result.lose b{color:var(--lose)} .result.push b{color:var(--brass)}
.felt-text{text-align:center;font:400 clamp(13px,2vw,17px) var(--f-disp);letter-spacing:.2em;color:rgba(233,185,95,.75);text-shadow:0 1px 0 rgba(0,0,0,.4)}
.felt-text small{display:block;font:600 10.5px var(--f-body);letter-spacing:.2em;color:rgba(246,234,212,.45);margin-top:3px;text-transform:uppercase}

/* ---------- cards ---------- */
.card{--cw:78px;width:var(--cw);aspect-ratio:5/7;position:relative;flex:none;perspective:700px}
@media (max-width:560px){.card{--cw:56px}}
.card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.35,.5,1)}
.card.down .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:calc(var(--cw)*.11);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .f{background:linear-gradient(160deg,var(--paper),#eee1c8);color:var(--card-ink);box-shadow:0 6px 16px rgba(0,0,0,.5);display:grid;place-items:center;font-family:var(--f-disp)}
.card.red .f{color:var(--card-red)}
.card .ix{position:absolute;top:calc(var(--cw)*.06);left:calc(var(--cw)*.08);font:800 calc(var(--cw)*.19)/1 var(--f-body);display:flex;flex-direction:column;align-items:center;letter-spacing:-.04em}
.card .ix i{font-style:normal;font-size:.8em;margin-top:1px}
.card .ix.br{top:auto;left:auto;bottom:calc(var(--cw)*.06);right:calc(var(--cw)*.08);transform:rotate(180deg)}
.card .pip{font-size:calc(var(--cw)*.46);line-height:1}
.card .pip.ace{font-size:calc(var(--cw)*.66)}
.card .pip.face{display:flex;flex-direction:column;align-items:center;font-size:calc(var(--cw)*.42)}
.card .pip.face i{font-style:normal;font-size:.55em;margin-top:-2px}
.card .b{transform:rotateY(180deg);background:radial-gradient(circle,transparent 0 22%,rgba(0,0,0,.12) 23% 24%,transparent 25%),repeating-linear-gradient(45deg,var(--ruby) 0 4px,#9e1733 4px 8px);border:calc(var(--cw)*.06) solid var(--paper);box-shadow:0 6px 16px rgba(0,0,0,.5)}
.card .b::after{content:"MV";position:absolute;inset:0;display:grid;place-items:center;font:400 calc(var(--cw)*.24) var(--f-disp);color:var(--paper);text-shadow:0 0 6px rgba(0,0,0,.4)}
.card.deal{animation:deal .5s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes deal{from{transform:translate(160px,-200px) rotate(-35deg);opacity:0}}
.card.xl{--cw:132px} @media (max-width:560px){.card.xl{--cw:104px}}
.hand{display:flex;align-items:flex-start;min-height:calc(var(--cw,78px)*1.4)}
.hand .card+.card{margin-left:calc(var(--cw)*-.42)}
.score{display:inline-grid;place-items:center;min-width:34px;padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(233,185,95,.45);font:500 13px var(--f-mono);color:var(--cream)}
.score:empty{display:none}
.lbl{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:rgba(246,234,212,.7);margin-bottom:8px;flex-wrap:wrap}

/* ---------- spots (table bets) ---------- */
.spot{position:relative;appearance:none;border:2px solid rgba(233,185,95,.55);background:rgba(0,0,0,.14);border-radius:14px;color:var(--cream);padding:14px 10px;cursor:pointer;text-align:center;transition:background .2s,box-shadow .2s,transform .12s;min-height:72px}
.spot:hover{background:rgba(233,185,95,.12)}
.spot:active{transform:scale(.98)}
.spot b{display:block;font:400 clamp(15px,2.2vw,20px) var(--f-disp);letter-spacing:.08em;color:var(--brass-hi)}
.spot small{display:block;font-size:11px;letter-spacing:.06em;color:rgba(246,234,212,.6);margin-top:2px}
.spot.won{animation:spotwin 1.4s ease-out}
@keyframes spotwin{0%,60%{background:rgba(110,240,168,.28);box-shadow:0 0 0 3px var(--win),0 0 30px rgba(110,240,168,.5)}}

/* ---------- lobby ---------- */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;align-items:center;padding:34px 34px;border-radius:30px;background:radial-gradient(90% 120% at 0% 0%,rgba(255,59,92,.22),transparent 60%),linear-gradient(135deg,var(--velvet-2),var(--velvet));border:1px solid var(--line);overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:8px;border-radius:24px;padding:7px;background:radial-gradient(circle,var(--brass-hi) 0 2.3px,rgba(233,185,95,.18) 2.9px,transparent 3.4px) 0 0/18px 18px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:chase 1.2s steps(2) infinite;pointer-events:none}
@keyframes chase{to{background-position:9px 9px}}
.eyebrow{margin:0 0 10px;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:var(--brass)}
.neon{font:400 clamp(40px,8vw,84px)/1.02 var(--f-neon);color:var(--cream);text-shadow:0 0 4px var(--ruby),0 0 16px var(--ruby),0 0 44px rgba(255,59,92,.55);animation:flicker 9s infinite;will-change:opacity}
.neon span{color:var(--brass-hi);text-shadow:0 0 4px var(--brass),0 0 16px var(--brass),0 0 44px rgba(233,185,95,.45)}
.hero p.lead{max-width:46ch;color:var(--muted);font-size:16px;margin:16px 0 22px}
.hstats{display:flex;gap:10px;flex-wrap:wrap}
.hstat{padding:10px 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);min-width:120px}
.hstat b{display:block;font:500 20px var(--f-mono);font-variant-numeric:tabular-nums}
.hstat span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero-art{position:relative;height:260px}
.hero-art .card{position:absolute;--cw:96px;animation:float 6s ease-in-out infinite;will-change:transform}
.hero-art .chip{position:absolute;width:64px;height:64px;font-size:14px;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-14px) rotate(calc(var(--r,0deg) + 4deg))}}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:28px 22px}.hero-art{height:170px}.hero-art .card{--cw:72px}.hero-art .chip{width:48px;height:48px}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 14px}
.bar h2{font:400 24px var(--f-disp);letter-spacing:.04em}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;transition:all .2s}
.filters button.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{position:relative;contain:layout paint;display:flex;flex-direction:column;text-decoration:none;color:var(--cream);border-radius:20px;background:var(--velvet);border:1px solid var(--line);overflow:hidden;transition:transform .25s cubic-bezier(.3,1.4,.5,1),border-color .25s,box-shadow .25s;animation:tilein .5s cubic-bezier(.2,.9,.3,1.1) both}
.tile:hover{transform:translateY(-5px);border-color:var(--brass-2);box-shadow:0 20px 40px -18px rgba(255,59,92,.45),0 0 0 1px rgba(233,185,95,.2)}
@keyframes tilein{from{transform:translateY(16px);opacity:.0}}
.tile .art{position:relative;height:138px;display:grid;place-items:center;overflow:hidden;background:var(--bgart,radial-gradient(circle at 50% 30%,var(--felt-2),var(--felt-deep)))}
.tile .art>*{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.tile:hover .art>*{transform:scale(1.08) rotate(-2deg)}
.tile .meta{padding:12px 14px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.tile h3{font:400 19px var(--f-disp);letter-spacing:.03em}
.tile .cat{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .rtp{font:500 11px var(--f-mono);color:var(--brass);padding:3px 8px;border:1px solid rgba(233,185,95,.35);border-radius:999px;white-space:nowrap}
.tab{margin-top:30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tabrow{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:12px;background:var(--velvet);border:1px solid var(--line);font-size:14px}
.tabrow b{font:500 14px var(--f-mono)}
.empty{color:var(--muted);font-size:14px}

/* tile art bits */
.a-reels{display:flex;gap:6px;padding:8px;border-radius:14px;background:#120810;border:2px solid var(--brass-2);box-shadow:0 0 30px rgba(255,59,92,.35)}
.a-reels span{width:40px;height:52px;border-radius:8px;background:linear-gradient(180deg,#ddd0b8,var(--paper) 30%,var(--paper) 70%,#ddd0b8);display:grid;place-items:center;font:400 34px var(--f-disp);color:var(--ruby);text-shadow:0 2px 0 #7a0c20}
.mc{position:absolute;width:60px;height:84px;border-radius:8px;background:var(--paper);color:var(--card-ink);font:400 26px/1 var(--f-disp);padding:6px;box-shadow:0 8px 18px rgba(0,0,0,.5);font-style:normal}
.mc b{display:block;font-size:22px;font-weight:400}
.mc.r{color:var(--card-red)}
.a-cards{position:relative;width:120px;height:100px}
.a-roul{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,var(--brass) 0 9%,#2b160c 10% 34%,transparent 35%),repeating-conic-gradient(var(--pocket-red) 0 10deg,var(--pocket-black) 10deg 20deg);border:6px solid #4b2614;box-shadow:0 0 0 2px var(--brass-2),0 10px 30px rgba(0,0,0,.6);animation:spinslow 14s linear infinite}
@keyframes spinslow{to{rotate:360deg}}
.a-wheel{width:116px;height:116px;border-radius:50%;background:radial-gradient(circle,var(--velvet) 0 18%,transparent 19%),conic-gradient(var(--violet) 0 18deg,var(--velvet-2) 18deg 36deg,var(--brass) 36deg 54deg,var(--velvet-2) 54deg 72deg,var(--teal) 72deg 90deg,var(--velvet-2) 90deg 108deg,var(--ember) 108deg 126deg,var(--velvet-2) 126deg 144deg,var(--ruby) 144deg 162deg,var(--velvet-2) 162deg 180deg,var(--brass) 180deg 198deg,var(--velvet-2) 198deg 216deg,var(--teal) 216deg 234deg,var(--velvet-2) 234deg 252deg,var(--brass) 252deg 270deg,var(--velvet-2) 270deg 288deg,var(--teal) 288deg 306deg,var(--velvet-2) 306deg 360deg);border:5px solid var(--brass-2);animation:spinslow 18s linear infinite reverse}
.a-dice{display:flex;gap:12px}
.a-dice .die{--ds:52px;transform:rotate(-12deg)} .a-dice .die+.die{transform:rotate(14deg) translateY(10px)}
.a-big{font:400 54px/1 var(--f-disp);color:var(--brass-hi);text-shadow:0 0 22px rgba(233,185,95,.6);text-align:center}
.a-big small{display:block;font:700 10px var(--f-body);letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.a-grid{display:grid;grid-template-columns:repeat(4,22px);gap:5px}
.a-grid i{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:12px;font-style:normal}
.a-grid i.on{background:var(--brass);box-shadow:0 0 12px rgba(233,185,95,.7)}
.a-grid i.gem{background:rgba(110,240,168,.2)}
.a-coin{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--brass-hi),var(--brass) 45%,var(--brass-2));border:5px solid #c99a46;display:grid;place-items:center;font:400 34px var(--f-disp);color:#6b4612;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 3px rgba(255,255,255,.2);animation:coinwob 3s ease-in-out infinite}
@keyframes coinwob{50%{transform:rotateY(60deg)}}
.a-plinko{width:130px;height:100px;background:radial-gradient(circle,var(--cream) 0 2px,transparent 2.5px) 0 0/16px 16px;-webkit-mask:linear-gradient(to bottom right,transparent 49%,#000 50%) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49%,#000 50%) right/50% 100% no-repeat;mask:linear-gradient(to bottom right,transparent 49%,#000 50%) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49%,#000 50%) right/50% 100% no-repeat}
.a-crash{width:150px;height:100px}

/* ---------- game shell ---------- */
.ghead{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.back{appearance:none;text-decoration:none;color:var(--cream);background:var(--velvet);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;transition:background .2s}
.back:hover{background:var(--velvet-2)}
.ghead h1{font:400 clamp(26px,4vw,38px)/1.05 var(--f-disp);letter-spacing:.03em}
.ghead .sub{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.ghead .rtp{margin-left:auto;font:500 12px var(--f-mono);color:var(--brass);padding:5px 10px;border:1px solid rgba(233,185,95,.35);border-radius:999px;white-space:nowrap}
.gview{animation:gin .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes gin{from{opacity:0;transform:translateY(12px)}}

/* ---------- slots ---------- */
.slot{position:relative;padding:20px;border-radius:28px;background:linear-gradient(180deg,#3a1526,#1a0a12);border:1px solid var(--line);box-shadow:inset 0 0 0 2px rgba(233,185,95,.3),0 30px 60px -30px rgba(0,0,0,.9);min-width:0}
.slot-top{display:flex;justify-content:center;margin-bottom:14px}
.slot-top .neon{font-size:clamp(22px,4vw,34px)}
.reels{--cell:84px;position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:10px;border-radius:18px;background:#0b0408;border:3px solid var(--brass-2);box-shadow:inset 0 0 30px rgba(0,0,0,.9),0 0 40px rgba(255,59,92,.25)}
@media (max-width:560px){.reels{--cell:58px;gap:5px;padding:6px}.slot{padding:12px}}
.reel{position:relative;height:calc(var(--cell)*3);overflow:hidden;border-radius:10px;background:linear-gradient(180deg,#cfc1a6,var(--paper) 22%,var(--paper) 78%,#cfc1a6)}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 25%,transparent 75%,rgba(0,0,0,.45))}
.strip{will-change:transform}
.cell{height:var(--cell);display:grid;place-items:center;font-size:calc(var(--cell)*.56);line-height:1;transition:transform .3s}
.spinning .strip{filter:blur(1.5px)}
.reel.stop{animation:reelstop .22s}
@keyframes reelstop{50%{transform:translateY(4px)}}
.cell.hit{animation:cellhit .9s ease-in-out infinite;position:relative;z-index:1}
@keyframes cellhit{50%{transform:scale(1.18);filter:drop-shadow(0 0 10px rgba(255,59,92,.9))}}
.seven{font:400 calc(var(--cell)*.7)/1 var(--f-disp);color:var(--ruby);text-shadow:0 3px 0 #6d0a1c,0 0 14px rgba(255,59,92,.5)}
.payline{position:absolute;left:4px;right:4px;top:50%;height:2px;background:rgba(255,59,92,.6);box-shadow:0 0 10px var(--ruby);pointer-events:none;z-index:2}
.slot-msg{margin-top:12px;text-align:center;min-height:24px;font-weight:700;color:var(--brass-hi)}
.ptable{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px 10px;font:500 13px var(--f-mono);align-items:center}
.ptable .h{font:700 10.5px var(--f-body);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.ptable .s{font-size:20px;line-height:1.2}
.ptable .s .seven{font-size:22px}
.ptable span:not(.h):not(.s){text-align:right}
.toggle.on{background:var(--ruby);border-color:var(--ruby);color:#fff}

/* ---------- blackjack ---------- */
.bj{display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:space-between;min-height:470px}
.bj .seat{display:flex;flex-direction:column;align-items:center}
.hands{display:flex;gap:26px;justify-content:center;flex-wrap:wrap}
.phand{display:flex;flex-direction:column;align-items:center;padding:8px 10px;border-radius:16px;border:2px solid transparent;transition:border-color .3s,background .3s}
.phand.active{border-color:rgba(233,185,95,.6);background:rgba(233,185,95,.07)}
.phand.win .score{border-color:var(--win);color:var(--win)} .phand.lose{opacity:.6} .phand.push .score{border-color:var(--brass)}
.hb{font:500 12px var(--f-mono);color:var(--brass-hi)}
.tag{font-size:10px;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.4);letter-spacing:.1em}
.phand.win .tag{color:var(--win)} .phand.lose .tag{color:var(--lose)}

/* ---------- roulette ---------- */
.rl-top{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start;margin-bottom:18px}
@media (max-width:820px){.rl-top{grid-template-columns:minmax(0,1fr)}}
.wheelbox{position:relative;width:100%;max-width:380px;aspect-ratio:1;margin:0 auto}
.wheelbox canvas{width:100%;height:100%;display:block}
.lastnum{display:flex;align-items:center;gap:12px}
.lastnum .n{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:400 30px var(--f-disp);background:var(--velvet-2);border:2px solid var(--brass-2)}
.n.red{background:var(--pocket-red)} .n.black{background:var(--pocket-black)} .n.green{background:var(--pocket-green)}
.rnum{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:500 12px var(--f-mono);animation:pillin .35s cubic-bezier(.3,1.6,.5,1)}
.board-wrap{overflow-x:auto;padding-bottom:6px;border-radius:18px}
.board{display:grid;grid-template-columns:52px repeat(12,minmax(44px,1fr)) 56px;grid-template-rows:repeat(3,56px) 50px 50px;gap:4px;min-width:700px;padding:14px;border-radius:18px;background:radial-gradient(120% 120% at 50% 0%,var(--felt-2),var(--felt));border:8px solid var(--rail);box-shadow:inset 0 0 0 2px rgba(233,185,95,.35)}
.rc{position:relative;appearance:none;border:1.5px solid rgba(246,234,212,.35);border-radius:8px;color:var(--cream);font:400 18px var(--f-disp);cursor:pointer;background:transparent;transition:filter .15s,transform .1s}
.rc:hover{filter:brightness(1.3)}
.rc.red{background:var(--pocket-red)} .rc.black{background:var(--pocket-black)} .rc.green{background:var(--pocket-green)}
.rc.out{font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.12)}
.rc.out.red,.rc.out.black{background:transparent}
.rc .dia{display:inline-block;width:22px;height:22px;transform:rotate(45deg);border-radius:3px}
.rc .dia.red{background:var(--pocket-red)} .rc .dia.black{background:var(--pocket-black);border:1px solid rgba(246,234,212,.4)}
.rc.hit{animation:hitglow 1s ease-in-out infinite;z-index:1}
@keyframes hitglow{50%{box-shadow:0 0 0 3px var(--brass-hi),0 0 24px var(--brass)}}
.rc.won{animation:spotwin 1.4s ease-out}
.tbet{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)} .tbet b{color:var(--cream);font:500 15px var(--f-mono)}

/* ---------- baccarat ---------- */
.bac{display:flex;flex-direction:column;gap:20px;min-height:430px}
.bac-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bseat{display:flex;flex-direction:column;align-items:center;padding:12px;border-radius:16px;background:rgba(0,0,0,.14);transition:box-shadow .3s}
.bseat.win{box-shadow:0 0 0 2px var(--win),0 0 26px rgba(110,240,168,.35)}
.bseat .hand .card+.card{margin-left:calc(var(--cw)*-.25)}
.bseat .hand .card.third{transform:rotate(90deg);margin-left:calc(var(--cw)*.05)}
.bseat .hand .card.third .in{transition:none}
.spots3{display:grid;grid-template-columns:1fr .8fr 1fr;gap:10px}
.road{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;max-width:100%}
.road i{aspect-ratio:1;border-radius:50%;font:700 9px/1 var(--f-body);font-style:normal;display:grid;place-items:center;color:#fff}
.road i.P{background:#2e6fd6} .road i.B{background:var(--pocket-red)} .road i.T{background:var(--pocket-green)}
.road i.x{background:rgba(255,255,255,.06)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)} .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* ---------- video poker ---------- */
.vp{display:flex;flex-direction:column;align-items:center;gap:18px;min-height:400px;justify-content:center}
.vp .hand{gap:12px;min-height:0;flex-wrap:nowrap}
.vp .hand .card+.card{margin-left:0}
.vp .card{--cw:96px;cursor:pointer;transition:transform .2s}
@media (max-width:620px){.vp .card{--cw:56px}.vp .hand{gap:5px}}
.vslot{display:flex;flex-direction:column;align-items:center;gap:8px}
.vslot .held{font:800 11px var(--f-body);letter-spacing:.2em;color:var(--ink);background:var(--brass-hi);padding:2px 8px;border-radius:6px;opacity:0;transform:translateY(-4px);transition:.2s}
.vslot.on .held{opacity:1;transform:none}
.vslot.on .card{transform:translateY(-8px)}
.vpt{width:100%;border-collapse:collapse;font-size:13px}
.vpt td{padding:5px 8px;border-bottom:1px solid rgba(75,35,55,.6)}
.vpt td:last-child{text-align:right;font-family:var(--f-mono)}
.vpt tr.on td{background:rgba(233,185,95,.18);color:var(--brass-hi);animation:pillin .3s}
.vp-hint{min-height:22px;font-weight:700;color:var(--brass-hi);letter-spacing:.06em;text-align:center}

/* ---------- dice faces ---------- */
.die{--ds:72px;width:var(--ds);height:var(--ds);border-radius:calc(var(--ds)*.18);background:linear-gradient(145deg,#fffaf0,#e6d8bd);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 10px 20px rgba(0,0,0,.45);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:calc(var(--ds)*.13)}
.die i{width:calc(var(--ds)*.17);height:calc(var(--ds)*.17);border-radius:50%;background:var(--card-ink);place-self:center;opacity:0;font-style:normal}
.die i.on{opacity:1}
.die.red-pips i{background:var(--card-red)}
.die.rolling{animation:tumble .7s cubic-bezier(.3,.7,.4,1)}
@keyframes tumble{0%{transform:translate(-120px,-60px) rotate(-260deg)}60%{transform:translate(10px,8px) rotate(30deg)}80%{transform:translate(-4px,-6px) rotate(-8deg)}}

/* ---------- craps ---------- */
.cp{display:flex;flex-direction:column;gap:14px;min-height:460px}
.points{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pt{position:relative;border:2px solid rgba(233,185,95,.5);border-radius:10px;text-align:center;padding:8px 0;font:400 22px var(--f-disp);color:var(--cream)}
.pt.on{background:rgba(233,185,95,.16)}
.puck{position:absolute;top:-12px;right:-8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 9px var(--f-body);letter-spacing:.06em;background:var(--paper);color:var(--card-ink);box-shadow:0 4px 10px rgba(0,0,0,.5);animation:chipdrop .35s cubic-bezier(.3,1.7,.5,1)}
.puck.off{position:static;background:var(--card-ink);color:var(--paper);border:2px solid var(--paper);animation:none}
.dicebox{display:flex;justify-content:center;align-items:center;gap:18px;min-height:110px}
.cp-spots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cp-spots .wide{grid-column:1/-1}
.cp-status{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}

/* ---------- plinko / crash stages ---------- */
.pl canvas,.cr canvas{display:block;width:100%}
.pl{padding:6px 0 0}
.floater{position:absolute;font:600 15px var(--f-mono);pointer-events:none;animation:rise 1.2s ease-out forwards;transform:translateX(-50%);z-index:5;white-space:nowrap}
.cr{aspect-ratio:16/10;max-height:520px}
.cr canvas{height:100%}
.cr-mult{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:400 clamp(44px,9vw,92px)/1 var(--f-disp);color:var(--cream);text-shadow:0 0 30px rgba(233,185,95,.35);pointer-events:none;font-variant-numeric:tabular-nums;transition:color .2s}
.cr-mult.boom{color:var(--lose);animation:shake .4s}
.cr-mult.cashed{color:var(--win)}
.cr-sub{position:absolute;left:50%;top:calc(38% + clamp(32px,6vw,58px));transform:translateX(-50%);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:800;pointer-events:none;white-space:nowrap}
@keyframes shake{20%{transform:translate(-52%,-50%)}40%{transform:translate(-48%,-50%)}60%{transform:translate(-51%,-50%)}80%{transform:translate(-49%,-50%)}}

/* ---------- mines ---------- */
.mn{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:18px;max-width:560px;margin:0 auto}
@media (max-width:560px){.mn{gap:6px;padding:10px}}
.tilebtn{appearance:none;aspect-ratio:1;border:0;border-radius:14px;cursor:pointer;background:linear-gradient(180deg,#3d1a2d,#2a1220);box-shadow:inset 0 -5px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);font-size:clamp(24px,5vw,40px);display:grid;place-items:center;transition:transform .15s,background .2s}
.tilebtn:hover:not(.open){transform:translateY(-3px);background:linear-gradient(180deg,#4d2239,#331626)}
.tilebtn.open{cursor:default;box-shadow:inset 0 2px 8px rgba(0,0,0,.6);background:#12070d;animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
.tilebtn.open.gem{background:radial-gradient(circle,rgba(110,240,168,.25),#12070d 70%)}
.tilebtn.open.boom{background:radial-gradient(circle,rgba(255,59,92,.55),#12070d 70%);animation:boom .5s}
.tilebtn.dim{opacity:.4}
@keyframes pop{from{transform:scale(.5)}}
@keyframes boom{0%{transform:scale(1.4)}30%{transform:scale(.9) rotate(-6deg)}60%{transform:rotate(5deg)}}

/* ---------- dice game ---------- */
.dg{padding:34px 26px;display:flex;flex-direction:column;gap:28px;justify-content:center;min-height:380px}
.dnum{text-align:center;font:400 clamp(60px,12vw,112px)/1 var(--f-disp);font-variant-numeric:tabular-nums;transition:color .2s}
.dnum.w{color:var(--win);text-shadow:0 0 30px rgba(110,240,168,.5)} .dnum.l{color:var(--lose)}
.dtrack{position:relative;height:14px;border-radius:999px;margin:18px 6px 6px}
.dtrack input{position:absolute;inset:-10px 0;width:100%;height:34px;margin:0;opacity:0;cursor:grab}
.dthumb{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:9px;background:linear-gradient(180deg,var(--brass-hi),var(--brass));box-shadow:0 4px 12px rgba(0,0,0,.5);pointer-events:none;display:grid;place-items:center;font:700 10px var(--f-mono);color:#2a1406}
.dmark{position:absolute;bottom:22px;transform:translateX(-50%);transition:left .55s cubic-bezier(.3,1.3,.5,1);font:600 14px var(--f-mono);padding:4px 8px;border-radius:8px;background:var(--cream);color:var(--ink)}
.dmark::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--cream)}
.dmark.w{background:var(--win)} .dmark.w::after{border-top-color:var(--win)}
.dmark.l{background:var(--lose)} .dmark.l::after{border-top-color:var(--lose)}
.dscale{display:flex;justify-content:space-between;font:500 12px var(--f-mono);color:var(--muted);padding:0 6px}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dstats div{padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.dstats b{display:block;font:500 18px var(--f-mono)} .dstats span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- keno ---------- */
.kn{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;padding:18px}
@media (max-width:560px){.kn{gap:5px;padding:10px}}
.kt{position:relative;appearance:none;border:0;aspect-ratio:1;border-radius:12px;cursor:pointer;font:500 clamp(13px,2.4vw,18px) var(--f-mono);color:var(--cream);background:linear-gradient(180deg,#3d1a2d,#2a1220);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);transition:transform .15s,background .2s}
.kt:hover{transform:translateY(-2px)}
.kt.pick{background:linear-gradient(180deg,var(--violet),#5b34c9);box-shadow:0 0 16px rgba(155,107,255,.5)}
.kt.drawn{background:#12070d;color:var(--muted);animation:pop .3s cubic-bezier(.3,1.7,.5,1)}
.kt.drawn.pick{background:radial-gradient(circle,var(--brass-hi),var(--brass) 60%);color:#2a1406;box-shadow:0 0 22px rgba(233,185,95,.8)}
.kpay{display:flex;gap:4px;flex-wrap:wrap}
.kpay span{flex:1;min-width:40px;text-align:center;padding:5px 2px;border-radius:8px;background:var(--ink);border:1px solid var(--line);font:500 11px var(--f-mono)}
.kpay span em{display:block;font-style:normal;color:var(--muted);font-size:10px}
.kpay span.on{border-color:var(--brass);color:var(--brass-hi);background:rgba(233,185,95,.12)}

/* ---------- wheel ---------- */
.wh{padding:20px;display:grid;place-items:center}
.whbox{position:relative;width:100%;max-width:440px;aspect-ratio:1}
.whbox canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;width:0;height:0;margin-left:-16px;border:16px solid transparent;border-bottom:0;border-top:30px solid var(--brass-hi);filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));z-index:2;transform-origin:50% 0}
.pointer.tick{animation:tickp .12s}
@keyframes tickp{50%{transform:rotate(-14deg)}}
.wlegend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wlegend span{display:flex;align-items:center;gap:6px;font:500 12px var(--f-mono);padding:6px 8px;border-radius:8px;background:var(--ink);border:1px solid var(--line)}

/* ---------- coin ---------- */
.cf{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:420px}
.coinwrap{perspective:900px}
.coinwrap.toss{animation:toss 1.6s cubic-bezier(.3,.6,.4,1)}
@keyframes toss{40%{transform:translateY(-120px) scale(1.15)}75%{transform:translateY(0) scale(1)}85%{transform:translateY(-14px)}}
.coin{position:relative;width:180px;height:180px;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.25,.8,.3,1)}
.coin .side{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;font:400 64px var(--f-disp);background:radial-gradient(circle at 35% 30%,var(--brass-hi),var(--brass) 45%,var(--brass-2));color:#6b4612;border:8px solid #c99a46;box-shadow:inset 0 0 0 4px rgba(255,255,255,.2),inset 0 0 30px rgba(0,0,0,.25)}
.coin .side small{position:absolute;bottom:30px;font:800 11px var(--f-body);letter-spacing:.3em}
.coin .t{transform:rotateY(180deg);background:radial-gradient(circle at 35% 30%,#ffd6de,var(--ruby) 50%,#a3142f);color:#5a0618;border-color:#d73a57}
.streak{font:400 20px var(--f-disp);color:var(--brass-hi);letter-spacing:.06em;min-height:28px}

/* ---------- overlays ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

@keyframes fadein{from{opacity:0}}
#modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(10,4,8,.84)}

#modal .kv{font-size:15px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
/* ---------- update 1 ---------- */

.tk.p{background:var(--brass);color:#2a1406}.tk.x{background:var(--violet);color:#fff}.tk.r{background:#d8d2c4;color:var(--ruby)}
.bl{min-height:470px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:36px;background:radial-gradient(90% 70% at 50% 30%,#3a1848,#12070d)}

.balloon{--s:.55;--h:300;position:relative;width:200px;height:250px;transform:scale(var(--s));transform-origin:50% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s}

.a-balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:30px;background:var(--muted)}
.sc{display:grid;place-items:center;padding:26px 16px;min-height:440px;background:radial-gradient(circle at 50% 30%,#3a1838,#12070d)}
.ticket{width:min(390px,100%);border-radius:18px;padding:16px;background:linear-gradient(160deg,var(--brass-hi),var(--brass) 50%,var(--brass-2));box-shadow:0 22px 50px rgba(0,0,0,.6);color:#2a1406;transform:rotate(-1.2deg)}
.tk-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}.tk-head b{font:400 24px var(--f-disp)}.tk-head span{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.tk-grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;padding:6px;border-radius:12px;background:#2a1406;aspect-ratio:1}
.tk-cell{display:grid;place-items:center;border-radius:8px;background:var(--paper);font-size:clamp(28px,7vw,46px)}

.tk-grid canvas{position:absolute;left:6px;top:6px;width:calc(100% - 12px);height:calc(100% - 12px);border-radius:8px;cursor:crosshair;touch-action:none;transition:opacity .45s}
.tk-grid canvas.gone{opacity:0;pointer-events:none}.tk-grid canvas.xr{opacity:.35}
.tk-foot{margin-top:10px;text-align:center;font-weight:800;font-size:13px}
.a-scratch{display:grid;grid-template-columns:repeat(3,32px);gap:4px;padding:6px;background:var(--brass);border-radius:10px;transform:rotate(-4deg)}

.a-scratch i{background:linear-gradient(135deg,#aaa4b8,#eeedf3,#938da3)}
.dby{padding:14px}
.dby-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.dby-call{font:400 16px var(--f-disp);color:var(--brass-hi);letter-spacing:.04em}
.track{position:relative;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 40px,transparent 40px 80px),linear-gradient(180deg,#145a3e,#0b3a28);border:2px solid rgba(233,185,95,.4)}

.horse{position:absolute;left:34px;top:50%;margin-top:-20px;font-size:32px;line-height:40px;will-change:transform}
.hz{display:inline-block;transform:scaleX(-1)}
.track.run .hz{animation:gallop .28s ease-in-out infinite alternate}
@keyframes gallop{to{transform:scaleX(-1) translateY(-4px) rotate(-4deg)}}
.finish{position:absolute;right:34px;top:0;bottom:0;width:8px;background:repeating-linear-gradient(0deg,#fff 0 8px,#140810 8px 16px);opacity:.85}
.runners{display:flex;flex-direction:column;gap:6px}

.cu{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;min-height:420px}

.cups{position:relative;width:100%;max-width:460px;height:170px}
.cup{position:absolute;left:50%;bottom:16px;width:100px;height:124px;margin-left:-50px;appearance:none;border:0;background:none;padding:0;cursor:pointer;transition-property:transform;transition-timing-function:cubic-bezier(.45,0,.3,1);z-index:1}

.cupb{position:absolute;inset:0;z-index:2;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);background:linear-gradient(90deg,#6a0c20,var(--ruby) 38%,#e2425f 52%,#8a1027);transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .3s}

.filters{margin-bottom:14px}

/* skins */
html[data-skin="vegas"]{--ink:#110c06;--velvet:#1f170b;--velvet-2:#2c2010;--line:#4a3818;--ruby:#e0413a;--brass:#ffcc33;--brass-2:#c79a1e;--brass-hi:#ffe48a;--violet:#c46bff;--cream:#fff4dc;--muted:#c9b48e}

/* card backs: the equipped back styles real cards only; shop previews (.mini) always show their own pattern */
.card .b.bk-ruby{background:radial-gradient(circle,transparent 0 22%,rgba(0,0,0,.12) 23% 24%,transparent 25%),repeating-linear-gradient(45deg,#ff3b5c 0 4px,#9e1733 4px 8px)}
html[data-back="royal"] .card:not(.mini) .b,.card .b.bk-royal{background:repeating-linear-gradient(45deg,#2e6fd6 0 4px,#173d80 4px 8px)}
html[data-back="emerald"] .card:not(.mini) .b,.card .b.bk-emerald{background:repeating-linear-gradient(45deg,#1f8a5b 0 4px,#0f4a30 4px 8px)}
html[data-back="gold"] .card:not(.mini) .b,.card .b.bk-gold{background:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 2px,transparent 2px 7px),linear-gradient(135deg,#f7d891,#b5883a 50%,#f7d891)}
html[data-back="galaxy"] .card:not(.mini) .b,.card .b.bk-galaxy{background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9) 0 1px,transparent 2px) 0 0/14px 14px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.6) 0 1px,transparent 2px) 0 0/22px 22px,linear-gradient(135deg,#1a0f3a,#5a1f8a 50%,#0b2a5a)}
html[data-back="leopard"] .card:not(.mini) .b,.card .b.bk-leopard{background:radial-gradient(circle at 30% 40%,#3a2208 0 3px,transparent 4px) 0 0/16px 16px,radial-gradient(circle at 70% 75%,#3a2208 0 2.5px,transparent 3.5px) 0 0/16px 16px,#d9a441}
html[data-back="neon"] .card:not(.mini) .b,.card .b.bk-neon{background:repeating-linear-gradient(90deg,#ff2bd6 0 3px,#0b0b1a 3px 9px,#00f0ff 9px 12px,#0b0b1a 12px 18px)}
html[data-back="pumpkin"] .card:not(.mini) .b,.card .b.bk-pumpkin{background:radial-gradient(circle at 50% 50%,#ffb347 0 18%,transparent 19%) 0 0/18px 18px,repeating-linear-gradient(90deg,#ff7a1a 0 5px,#d9590a 5px 9px)}
html[data-back="candycane"] .card:not(.mini) .b,.card .b.bk-candycane{background:repeating-linear-gradient(45deg,#fff 0 5px,#e0182d 5px 10px,#fff 10px 12px,#2a8a4a 12px 15px)}
html[data-back="fireworks"] .card:not(.mini) .b,.card .b.bk-fireworks{background:radial-gradient(circle at 30% 30%,#ffd54f 0 1.5px,transparent 2.5px) 0 0/12px 12px,radial-gradient(circle at 70% 70%,#ff4f8b 0 1.5px,transparent 2.5px) 0 0/16px 16px,radial-gradient(circle,#2a1a5a,#0a0618)}
html[data-back="easteregg"] .card:not(.mini) .b,.card .b.bk-easteregg{background:repeating-linear-gradient(0deg,#ffd1e8 0 6px,#c8f0ff 6px 12px,#fff3b0 12px 18px,#d9c8ff 18px 24px)}
html[data-back="waves"] .card:not(.mini) .b,.card .b.bk-waves{background:radial-gradient(circle at 50% 100%,transparent 0 6px,#7fe3ff 6px 8px,transparent 8px) 0 0/16px 10px,linear-gradient(180deg,#0a6b8a,#05374a)}
html[data-back="hearts"] .card:not(.mini) .b,.card .b.bk-hearts{background:radial-gradient(circle at 50% 50%,#ff6ec7 0 3px,transparent 4px) 0 0/12px 12px,linear-gradient(135deg,#8a1240,#ff4f8b)}
html[data-back="shamrock"] .card:not(.mini) .b,.card .b.bk-shamrock{background:radial-gradient(circle at 50% 50%,#7dff9e 0 2.5px,transparent 3.5px) 0 0/10px 10px,repeating-linear-gradient(45deg,#1f8a4f 0 4px,#0f5a30 4px 8px)}
html[data-back="stripes"] .card:not(.mini) .b,.card .b.bk-stripes{background:radial-gradient(circle,#fff 0 1.5px,transparent 2px) 0 0/9px 9px,linear-gradient(180deg,#1b3d8a 0 45%,transparent 45%),repeating-linear-gradient(180deg,#d6203f 0 6px,#fff 6px 12px)}
html[data-back="autumn"] .card:not(.mini) .b,.card .b.bk-autumn{background:radial-gradient(circle at 30% 30%,#ffb347 0 3px,transparent 4px) 0 0/14px 14px,radial-gradient(circle at 70% 70%,#c4401a 0 3px,transparent 4px) 0 0/14px 14px,#6b3a12}
html[data-felt="graveyard"]{--felt:#24123a;--felt-2:#4a2368;--felt-deep:#110820}
html[data-felt="pine"]{--felt:#0c3320;--felt-2:#1d5e38;--felt-deep:#051a10}
html[data-felt="lagoon"]{--felt:#0b4250;--felt-2:#15849a;--felt-deep:#04212a}
/* penalty */
.pk{min-height:440px;background:repeating-linear-gradient(90deg,#1f7a4f 0 60px,#1a6c45 60px 120px)}
.pk-crowd{position:absolute;left:0;right:0;top:0;height:20%;background:radial-gradient(circle,rgba(246,234,212,.5) 0 2px,transparent 2.5px) 0 0/12px 10px,linear-gradient(180deg,#140810,#2a1020)}
.pk.goalfx .pk-crowd{animation:crowd .25s 4 alternate}
@keyframes crowd{to{transform:translateY(-4px);filter:brightness(1.5)}}
.goal{position:absolute;left:50%;top:15%;transform:translateX(-50%);width:min(80%,560px);aspect-ratio:2.6;border:6px solid #f4f4f4;border-bottom:0;border-radius:4px 4px 0 0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.16) 0 1px,transparent 1px 10px),repeating-linear-gradient(-45deg,rgba(255,255,255,.16) 0 1px,transparent 1px 10px),rgba(0,0,0,.2);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.pk.goalfx .goal{animation:netbulge .4s}
@keyframes netbulge{40%{transform:translateX(-50%) scale(1.03)}}
.gz{appearance:none;border:1px dashed rgba(255,255,255,.2);background:transparent;cursor:crosshair;transition:background .2s}
.gz:hover{background:rgba(247,216,145,.18)}
.gz.xr{background:rgba(255,59,92,.3);box-shadow:inset 0 0 0 2px rgba(255,59,92,.85)}
.gz.hit{background:rgba(110,240,168,.35)}
.keeper{position:absolute;left:50%;bottom:0;width:16%;height:78%;pointer-events:none;transform:translateX(-50%) translate(var(--kx,0%),var(--ky,0%)) rotate(var(--kr,0deg)) scaleX(var(--ks,1));transform-origin:50% 100%;transition:transform .45s cubic-bezier(.2,.8,.3,1)}
.kh{position:absolute;left:50%;top:0;width:34%;aspect-ratio:1;margin-left:-17%;border-radius:50%;background:#f2c9a0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.kb{position:absolute;left:12%;right:12%;top:22%;bottom:0;border-radius:40% 40% 8px 8px;background:linear-gradient(180deg,var(--brass-hi),var(--ember));box-shadow:inset 0 -10px 0 rgba(0,0,0,.2)}
.kb::before,.kb::after{content:"";position:absolute;top:6%;width:75%;height:16%;border-radius:999px;background:var(--ember);transition:transform .3s}
.kb::before{right:85%;transform:rotate(-30deg);transform-origin:right center}
.kb::after{left:85%;transform:rotate(30deg);transform-origin:left center}
.keeper.dive .kb::before{transform:rotate(-75deg)}.keeper.dive .kb::after{transform:rotate(75deg)}
.pk-spot{position:absolute;left:50%;bottom:13%;width:16px;height:6px;margin-left:-8px;border-radius:50%;background:rgba(255,255,255,.7)}
.pk-ball{position:absolute;left:50%;bottom:14%;margin-left:-20px;width:40px;height:40px;font-size:34px;line-height:40px;text-align:center;z-index:4;pointer-events:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.4))}
.pk-msg{position:absolute;left:0;right:0;bottom:29%;text-align:center;font:400 clamp(20px,4vw,34px) var(--f-disp);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4);pointer-events:none}
.pk-dots{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);display:flex;gap:8px}
.pk-dots i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.pk-dots i.g{background:var(--win);border-color:var(--win)}.pk-dots i.s{background:var(--lose);border-color:var(--lose)}
.a-goal{width:130px;height:62px;border:5px solid #f4f4f4;border-bottom:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 1px,transparent 1px 8px);position:relative}
.a-goal b{position:absolute;right:14px;top:8px;font-size:30px}
/* dive, rockets, darts */
.dv canvas,.rk canvas,.dt canvas{display:block;width:100%}
.dv-sub{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font:800 12px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:rgba(246,234,212,.8);pointer-events:none;white-space:nowrap}
.a-dive{position:relative;width:130px;height:90px}.a-dive span{position:absolute;left:4px;top:8px;font-size:46px;transform:scaleX(-1)}.a-dive b{position:absolute;right:10px;bottom:6px;font-size:38px;filter:drop-shadow(0 0 12px rgba(247,216,145,.8))}
.rk-call{position:absolute;left:14px;top:12px;max-width:45%;font:400 16px var(--f-disp);color:var(--brass-hi);pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.runner.on2{border-color:var(--teal);background:rgba(63,154,130,.16)}
.a-rockets{position:relative;width:130px;height:96px;display:flex;align-items:flex-end;justify-content:center;gap:6px}.a-rockets span{font-size:30px}.a-rockets span:nth-child(2){transform:translateY(-24px)}.a-rockets span:nth-child(3){transform:translateY(-10px)}.a-rockets i{position:absolute;top:-4px;right:4px;font-size:28px;font-style:normal}
.dt-score{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.dt-score span{font:600 12px var(--f-mono);padding:3px 8px;border-radius:8px;background:rgba(20,8,16,.75)}
.dt-score .g{color:var(--win)}.dt-score .r{color:var(--lose)}
.a-board{position:relative;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#f7d891 0 8%,var(--pocket-red) 9% 20%,var(--pocket-green) 21% 45%,#efe3cc 46% 75%,var(--pocket-black) 76%);border:5px solid #2a140a;box-shadow:0 0 24px rgba(255,59,92,.35)}.a-board b{position:absolute;right:-20px;top:-14px;font-size:34px}
/* bingo */
.bg{padding:14px}
.bg-top{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.bg-ball{--c:var(--brass);width:78px;height:78px;flex:none;border-radius:50%;display:grid;place-items:center;align-content:center;background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--c) 60%);box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 -6px 0 rgba(0,0,0,.2);color:#140810}
.bg-ball small{font:800 11px var(--f-body);letter-spacing:.1em}.bg-ball span{font:400 28px/1 var(--f-disp)}
.bg-ball.pop{animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
.bg-called{min-width:0}.bg-last{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.bg-last i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--f-mono);background:var(--c);color:#140810;animation:pillin .3s}
.bg-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bcard{border-radius:14px;padding:8px;background:var(--paper);color:var(--card-ink);box-shadow:0 10px 24px rgba(0,0,0,.4)}
.bcard.corners{box-shadow:0 0 0 3px var(--brass),0 10px 24px rgba(0,0,0,.4)}
.bc-h,.bc-g{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.bc-h{margin-bottom:3px}.bc-h b{background:var(--c);color:#fff;text-align:center;border-radius:6px;font:400 16px var(--f-disp);padding:2px 0}
.bc-g span{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:6px;background:#efe3cc;font:600 13px var(--f-mono)}
.bc-g span.d::after{content:"";position:absolute;inset:12%;border-radius:50%;background:rgba(255,59,92,.55);animation:pop .3s cubic-bezier(.3,1.7,.5,1)}
.bc-g span.free{color:var(--brass-2)}
.bc-g span.ln{background:#ffe08a}
.bc-w{text-align:center;font:400 15px var(--f-disp);color:var(--card-red);min-height:22px;margin-top:4px}
.a-bingo{display:flex;gap:5px}.a-bingo i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:400 13px var(--f-disp);font-style:normal;color:#fff;background:var(--ruby)}.a-bingo i:nth-child(2){background:var(--brass);color:#2a1406}.a-bingo i:nth-child(3){background:var(--teal)}.a-bingo i:nth-child(4){background:var(--violet)}.a-bingo i:nth-child(5){background:var(--ember)}
/* sic bo */
.sbf{display:flex;flex-direction:column;gap:10px;min-height:0}
.sb-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.sb-cup{position:relative;width:200px;height:110px;flex:none}
.sb-dice{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px}
.sb-dice .die{--ds:50px}
.cupc{position:absolute;left:10px;right:10px;bottom:0;height:110px;border-radius:50% 50% 12px 12px/70% 70% 12px 12px;background:linear-gradient(90deg,#6a0c20,var(--ruby) 40%,#e2425f 55%,#8a1027);box-shadow:inset 0 -12px 0 var(--brass-2),0 10px 24px rgba(0,0,0,.5);transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .3s;z-index:2}
.sb-cup.open .cupc{transform:translateY(-92px) rotate(-12deg);opacity:.9}
.sb-cup.shake .cupc{animation:cupshake .12s infinite}
@keyframes cupshake{25%{transform:translateX(-6px) rotate(-4deg)}75%{transform:translateX(6px) rotate(4deg)}}
.sb-res{font:400 18px var(--f-disp);color:var(--brass-hi);margin-bottom:6px}.sb-res b{font-family:var(--f-mono);font-weight:500}
.sb-board{display:flex;flex-direction:column;gap:6px}
.sb-row{display:grid;gap:6px}
.sb-row.r3{grid-template-columns:1fr .8fr 1fr}.sb-row.r6{grid-template-columns:repeat(6,minmax(0,1fr))}.sb-row.r7{grid-template-columns:repeat(7,minmax(0,1fr))}
.sb{position:relative;appearance:none;border:1.5px solid rgba(233,185,95,.5);background:rgba(0,0,0,.15);border-radius:10px;color:var(--cream);cursor:pointer;padding:7px 2px;text-align:center;min-height:50px;transition:background .2s;min-width:0}
.sb:hover{background:rgba(233,185,95,.12)}
.sb b{display:block;font:400 16px var(--f-disp);color:var(--brass-hi)}.sb small{display:block;font-size:10px;color:rgba(246,234,212,.6)}
.sb .fc{font-size:20px;line-height:1;letter-spacing:-2px}
.sb.won{animation:spotwin 1.4s ease-out}
.sb .pchip{width:26px;height:26px;margin:-13px 0 0 -13px;font-size:8.5px}
/* red dog */
.rd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:420px}
.rd-row{display:flex;gap:18px;align-items:center}
.rd-slot{width:86px;aspect-ratio:5/7;border-radius:12px;border:2px dashed rgba(233,185,95,.4);display:grid;place-items:center}
.rd-slot.mid{border-color:rgba(246,234,212,.55)}
@media (max-width:560px){.rd-slot{width:64px}}
.rd-spread{font:400 22px var(--f-disp);color:var(--brass-hi);text-align:center}
.rd-pay{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.rd-pay span{padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid rgba(233,185,95,.3);font:500 12px var(--f-mono)}
.rd-pay span b{margin-right:6px;font-family:var(--f-body)}
.rd-pay span.on{border-color:var(--brass);background:rgba(233,185,95,.2);color:var(--brass-hi)}
/* ---------- update 3 · fix 1.8 : seasonal scenes (all behind the games, never on top) ---------- */
#amb{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#scene{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#scene>*{position:absolute;pointer-events:none}
.sc-moon{right:6vw;top:calc(84px + env(safe-area-inset-top,0px));width:clamp(70px,11vw,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fffbe6,#f3e2a8 55%,#d9c27a);box-shadow:0 0 50px rgba(255,236,170,.45),0 0 140px rgba(255,200,120,.22);opacity:.9}
.sc-moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 60%,rgba(150,120,60,.25) 0 10%,transparent 11%),radial-gradient(circle at 62% 30%,rgba(150,120,60,.2) 0 8%,transparent 9%),radial-gradient(circle at 66% 70%,rgba(150,120,60,.18) 0 6%,transparent 7%)}

  T.clear=()=>{if(T.locked)return;const ks=T.hist.map(h=>h[0]);let sum=0;for(const [k,v] of T.hist){sum+=v;T.bets[k]=r2(T.bets[k]-v);if(T.bets[k]<=0)delete T.bets[k]}T.hist=[];W.refund(sum);[...new Set(ks)].forEach(T.draw);S.click()};
  T.rebet=()=>{if(T.locked||!T.last){if(!T.last)toast('No previous bet to repeat');return}for(const [k,v] of Object.entries(T.last)){if(canPlace(k,true)&&!T.add(k,v))break}};

}

function mulb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function hhNext(){const now=Date.now(),H=Math.floor(now/36e5);for(let i=0;i<3;i++){const s=hhSlot(H+i);if(s.start>now)return s.start}return 0}
let HH_LAST;

  if(h){const g=G.find(x=>x.id===h.gid),left=Math.max(0,h.until-Date.now());b.hidden=false;b.href='#'+h.gid;b.innerHTML=`<span class="hh-ic">🍸</span><span class="gw-l">Happy Hour</span><b>${g?g.name:''}</b><span>pays triple on every win</span><span class="hh-t">${Math.floor(left/6e4)}:${String(Math.floor(left%6e4/1e3)).padStart(2,'0')} left</span><span class="gw-go">Play →</span>`}else b.hidden=true;
  if(key!==HH_LAST){const first=HH_LAST===undefined;HH_LAST=key;if(h&&!first){const g=G.find(x=>x.id===h.gid);toast(`🍸 Happy Hour! ${g?g.name:'A game'} pays triple for ${Math.round((h.until-Date.now())/6e4)} minutes`);S.win()}
    if(LOBBY_PAINT&&CUR==='Lobby')LOBBY_PAINT();for(const id in cache)$('.hhp',cache[id]).hidden=!(h&&h.gid===id)}
  const nx=$('#hhNext');if(nx){if(h)nx.textContent='';else{const s=ADM.hhOff?0:hhNext();nx.textContent=s?`🍸 Next Happy Hour starts in about ${Math.max(1,Math.ceil((s-Date.now())/6e4))} min. One game pays triple for 10 minutes.`:''}}}

  if(ADM.boost>1)bits.push('×'+ADM.boost+' payouts');if(ADM.free)bits.push('Free play');if(ADM.speed>1)bits.push(ADM.speed+'× speed');if(ADM.xray)bits.push('X-ray');
  const p=$('#rigPill');p.hidden=!ADM.unlocked||!bits.length;p.textContent=bits.join(' · ');const ai=$('#menu [data-m="admin"]');if(ai)ai.innerHTML=`<span>${ADM.unlocked?'🔓':'🔒'}</span>Admin${ADM.unlocked?' · unlocked':''}`;$('#menuBtn').classList.toggle('on',ADM.unlocked)}

function admLock(){
  const m=$('#modal');
  m.innerHTML=`<div class="box" id="pwBox" role="dialog" aria-label="Admin login"><h2>Staff only</h2><p class="hint">This door is for the house. Enter the admin password to continue.</p>
    <form id="pwF" class="field"><label class="lab" for="pwI">Password</label><input id="pwI" type="password" autocomplete="off" spellcheck="false"><p class="err" id="pwE" hidden></p><button class="btn primary" type="submit">Unlock</button></form>
    <button class="btn sm" id="mClose" type="button">Cancel</button></div>`;
  $('#mClose').onclick=()=>m.hidden=true;setTimeout(()=>$('#pwI').focus(),60);
  $('#pwF').onsubmit=async e=>{e.preventDefault();const E=$('#pwE');let ok=false;
    try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode($('#pwI').value));ok=[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')===ADM_HASH}
    catch(err){E.hidden=false;E.textContent='This browser blocked the password check. Try a different browser.';return}
    if(ok){ADM.unlocked=true;applyAdm();ACH.hit('agent');S.big();FX.burst(220);toast('Welcome back, boss');admPanel()}
    else{const b=$('#pwBox');b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');E.hidden=false;E.textContent='Wrong password. Security is watching.';$('#pwI').select();S.err()}};
}

    <section><h3>Casino sign</h3><div class="inrow"><input id="aSign" type="text" maxlength="28" value="${esc(ADM.sign||'Midnight Velvet')}" aria-label="Casino name"><button class="btn" data-a="sign">Rename</button></div><p class="hint">The last word glows gold.</p></section>
    <section><h3>Effects</h3><div class="row"><button class="btn sm" data-a="confetti">Confetti cannon</button><button class="btn sm" data-a="bigwin">Test big win</button><button class="btn sm" data-a="stats">Wipe stats</button><button class="btn sm" data-a="daily">Reset daily spin</button><button class="btn sm" data-a="achreset">Reset achievements</button></div></section>
    <section><div class="row"><button class="btn" data-a="lock">Lock and switch off cheats</button><button class="btn primary" data-a="close">Done</button></div></section></div>`;
  const box=$('.adm',m),upd=()=>$('#aBal').textContent=fmtBal(W.bal);
  const wire=(id,fn)=>$$(`#${id} button`,box).forEach(b=>b.onclick=()=>{$$(`#${id} button`,box).forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset.v);S.click();applyAdm()});
  wire('aRig',val=>{ADM.rig=val;$('#aRigD').textContent=RIGS[val][1]});wire('aBoost',val=>ADM.boost=+val);wire('aSpd',val=>ADM.speed=+val);wire('anS',val=>{ADM.ann=Object.assign(ADM.ann||{},{style:val})});
  $$('[data-per]',box).forEach(s=>s.onchange=()=>{if(s.value)ADM.per[s.dataset.per]=s.value;else delete ADM.per[s.dataset.per];admSave();paintPill();$('#perN').textContent=perN()});
  const fi=()=>{const nx=ADM.next;if(nx){const gn=nx.gid==='any'?'game':((G.find(g=>g.id===nx.gid)||{}).name||'game');$('#fInfo').textContent=`Armed: the next ${gn} round will ${nx.mode==='value'?`land on “${nx.val}”`:nx.mode==='win'?'win':nx.mode==='lose'?'lose':'hit the jackpot'}.`;return}

  $('#fG').onchange=fi;$('#fM').onchange=()=>{$('#fV').disabled=$('#fM').value!=='value';fi()};fi();
  $('#aGotw').onchange=e=>{ADM.gotw=e.target.value;applyAdm();if(CUR==='Lobby')route();toast('Game of the Week updated')};

  box.addEventListener('click',e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;const amt=r2(parseFloat($('#aAmt').value));

/* ================= daily spin ================= */
const DAILY=[250,500,1000,250,750,2500,500,1000,250,1500,750,5000],DAY=864e5;
const dailyReady=()=>Date.now()-W.daily>=DAY;
function updDaily(){$('#dailyBtn').classList.toggle('ready',dailyReady()||W.tokens>0)}
function openDaily(){
  const m=openModal(),t=LV.tier(),mul=t[3];
  m.innerHTML=`<div class="box daily" role="dialog" aria-label="Daily spin"><h2>Daily spin</h2><p class="hint">One free spin every 24 hours.${mul>1?` Your ${t[1]} tier makes every prize ×${mul}.`:' Reach Silver tier at level 10 for bigger prizes.'}</p>
    <div class="dwheel"><div class="pointer" id="dsPt"></div><canvas id="dsCv"></canvas></div><p class="dnext" id="dsN"></p><button class="btn primary" id="dsGo">Spin</button><button class="btn sm" id="dsClose">Close</button></div>`;
  const cv=$('#dsCv'),N=DAILY.length,seg=Math.PI*2/N,COLS=['--ruby','--violet','--teal','--ember','--brass-2','--chip-25'];let rot=0,busy=false;
  const g=fitCanvas(cv,w=>w);
  function draw(){if(!g)return;const {w,c}=g,cx=w/2,r=w/2-6;c.clearRect(0,0,w,w);c.fillStyle=css('--brass-2');c.beginPath();c.arc(cx,cx,r+4,0,7);c.fill();
    for(let i=0;i<N;i++){const a=rot+i*seg-Math.PI/2-seg/2,v=DAILY[i];c.fillStyle=v===5000?css('--brass-hi'):css(COLS[i%COLS.length]);c.beginPath();c.moveTo(cx,cx);c.arc(cx,cx,r,a,a+seg);c.closePath();c.fill();c.strokeStyle='rgba(20,8,16,.6)';c.lineWidth=2;c.stroke();
      c.save();c.translate(cx,cx);c.rotate(rot+i*seg);c.fillStyle=v===5000?'#2a1406':'#fff';c.font=`600 ${Math.max(11,r*.12)}px 'DM Mono', monospace`;c.textAlign='center';c.textBaseline='middle';c.fillText(short(Math.round(v*mul)),0,-r*.72);c.restore()}
    c.fillStyle='#1a0a12';c.beginPath();c.arc(cx,cx,r*.2,0,7);c.fill();c.strokeStyle=css('--brass');c.lineWidth=3;c.stroke();c.font=`${r*.14}px serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('🎁',cx,cx)}
  draw();
  const tick=()=>{if(!document.contains(cv)){clearInterval(iv);return}const left=DAY-(Date.now()-W.daily),go=$('#dsGo');go.disabled=busy||(left>0&&W.tokens<1);go.textContent=left>0&&W.tokens>0?`Use an extra spin (${W.tokens})`:'Spin';
    $('#dsN').textContent=left>0?`Next free spin in ${Math.floor(left/36e5)}h ${Math.floor(left%36e5/6e4)}m ${Math.floor(left%6e4/1e3)}s`:'Your free spin is ready'};const iv=setInterval(tick,1000);tick();
  $('#dsClose').onclick=()=>m.hidden=true;
  $('#dsGo').onclick=async()=>{const free=dailyReady();if(busy||(!free&&W.tokens<1))return;busy=true;if(free)W.daily=Date.now();else W.tokens--;W.save();tick();
    const idx=rnd(N),TAU=Math.PI*2,r0=rot,base=((-idx*seg-r0)%TAU+TAU)%TAU,r1=r0+TAU*(RM?1:6)+base+(Math.random()-.5)*seg*.6,dur=RM?900:5000,t0=performance.now();let lastK=0;
    await new Promise(res=>{const st=now=>{const p=Math.min(1,(now-t0)/dur);rot=r0+(r1-r0)*(1-Math.pow(1-p,4));const k=Math.floor((rot+seg/2)/seg);if(k!==lastK){lastK=k;S.tick();const pt=$('#dsPt');if(pt){pt.classList.remove('tick');void pt.offsetWidth;pt.classList.add('tick')}}draw();p<1?requestAnimationFrame(st):res()};requestAnimationFrame(st)});
    const val=Math.round(DAILY[idx]*mul);W.give(val);W.save();updDaily();ACH.hit('daily');FX.burst(DAILY[idx]>=2500?220:120);DAILY[idx]>=5000?S.big():S.win();toast(`Daily spin: +${fmt(val)} chips`);busy=false;tick()};
}
$('#dailyBtn').onclick=openDaily;setInterval(updDaily,30000);

    <p class="hint">Every achievement pays 500 chips the moment you unlock it. You have earned ${fmt(n*500)} chips from them so far.</p>
    <div class="achgrid">${[...ACHS].sort((a,b)=>(got[b[0]]?1:0)-(got[a[0]]?1:0)).map(([id,i,nm,d])=>`<div class="ach ${got[id]?'got':''}"><span class="ai">${i}</span><div><b>${nm}</b><small>${d}</small></div>${got[id]?'<em>+500</em>':''}</div>`).join('')}</div>
    <button class="btn primary" id="achClose">Close</button></div>`;$('#achClose').onclick=()=>m.hidden=true}

W.load();try{Object.assign(ADM,JSON.parse(localStorage.getItem(KEY+'-adm')||'{}'))}catch(e){}
ADM.per=ADM.per||{};S.on=SET.sfx;
shownBal=W.bal;$('#bal').textContent=fmtBal(W.bal);$('#refill').hidden=W.bal>=100;paintSnd();applyLook();applySeason();applyAdm();updAch();updDaily();paintLv();route();BOOT=true;
